name: commit-to-main
description: >
  Land committed file(s) on the protected `main` branch from a GitHub-hosted
  workflow, via a PAT-authenticated auto-merge PR. `main` requires status checks
  and rejects a direct workflow push (GH006), and a PR opened with the default
  GITHUB_TOKEN does NOT trigger the on:pull_request required checks (so it would
  stall auto-merge forever). Opening the PR with a real PAT triggers the checks
  normally; they run + must pass; then the PR auto-merges (squash). This is the
  shared fix for BL-20260723-WORKFLOW-COMMIT-TO-PROTECTED-MAIN /
  BL-20260706-GPU-BURST-LEDGER-PUSH-RACE.

  REQUIREMENT: the calling job must `actions/checkout` with `token: <the PAT>` so
  the branch push is authenticated as the PAT (not GITHUB_TOKEN). The PAT needs
  Contents: write + Pull requests: write on this repo.

inputs:
  token:
    description: PAT with Contents:write + Pull-requests:write (also used for gh).
    required: true
  paths:
    description: Space-separated path(s) to `git add`.
    required: true
  message:
    description: Commit message (subject line).
    required: true
  pr-title:
    description: Title for the auto-merge PR.
    required: true
  pr-body:
    description: Body for the auto-merge PR.
    required: false
    default: "Automated data commit (auto-merge)."
  verify-merged:
    description: >
      When "true", block until the auto-merge PR this action opened has actually
      MERGED, and FAIL if it has not within `verify-timeout-minutes`.

      Off by default so existing callers are byte-for-byte unchanged.

      ⚠️ WITHOUT THIS, THIS ACTION EXITS 0 THE MOMENT THE PR IS *OPENED*. A green
      caller therefore means "a PR exists", never "the rows are on main" — and
      those are the two states R2 is entirely about. Measured 2026-08-30: 13
      workflows call this action, 12 verify nothing, and origin carried 5
      stranded `automation/*` branches, the oldest 10 weeks. The clean case is
      `automation/econ-calendar-33232352515-1`: one commit, 444 data rows,
      written 2026-08-29 and still not on main two days later, from a workflow
      that exited 0. See
      BL-20260830-TWELVE-OF-THIRTEEN-COMMIT-TO-MAIN-CALLERS-NEVER-CHECK-THEIR-ROWS-LANDED
      and, for why a branch strands in the first place,
      BL-20260830-A-TRANSIENT-RED-BASE-PERMANENTLY-STRANDS-AN-AUTOMERGE-BRANCH.

      Lives HERE rather than in each caller because the wait is identical
      everywhere and the naming, the PR url and the failure vocabulary are all
      this action's. A caller still owns the question this cannot answer — "are
      MY rows in the file?" — via assert_rows_landed.py --pushed-ref.
    default: "false"
  verify-timeout-minutes:
    description: >
      How long `verify-merged` waits. Default 30.

      ⚠️ IT WAS 18, CHOSEN AGAINST A "~11 min" FIGURE THAT IS NOT THIS REPO'S.
      MEASURED on the first real stamp merge (dispatcher run 33361821570,
      2026-08-31): the wait took 15m45s of the 18m budget — 87.5% — and merged
      with 2m15s to spare. `pytest-run` alone is 12.9-14.6 min on main and was
      observed at 15.3, before queue time. So 18 made every stamp a coin-flip on
      CI variance, and a timeout is not cosmetic: `verify-merged` FAILS the job,
      the stamp does not land, and the queue job re-fires on the next cron.

      30 keeps a real margin over the observed worst case without waiting all
      day on a genuinely stranded branch. Give the calling job a
      `timeout-minutes` above this or the job dies mid-wait — research-queue
      dispatch carries 35 for exactly that reason.
    default: "30"
  refresh-command:
    description: >
      A shell command that RE-DERIVES this caller's generated file(s), run after
      the stale-branch refresh merges `main` in and BEFORE the result is pushed.

      Empty by default, so every existing caller is byte-for-byte unchanged.

      ⚠️ WITHOUT THIS, THE REFRESH IS INERT FOR A PRODUCER WHOSE OUTPUT IS
      DERIVED FROM THE THING IT MERGES. Merging `main` mints a new head sha,
      which re-triggers the checks — and that is the whole of what it does. It
      never regenerates the derived file, so the new head carries the SAME stale
      content and the SAME guard fails again, one sha later.

      MEASURED on `constraint-readout.yml`, which has concluded `success` ZERO
      times in its entire life. Run 34592532948 generated for 31 minutes, opened
      #11789, and died on `session-brief-guard` with
      `verdict=introduced_registers_changed`. Its own refresh graded
      `not_needed_up_to_date`. Reproduced against `origin/main`: render the brief
      at an older base, advance ONLY the registers to current main — which is
      what GitHub's MERGE REF does, since PR checks run against
      branch-merged-with-main — and the guard emits that exact verdict and exits
      1. The renderer and the guard do NOT disagree (checked: both exit 0 on an
      unmoved base); the brief is stale against a base that moved underneath it.

      For such a caller, re-running the checks is not the remedy — RE-DERIVING
      is. Pass the same command the workflow used to generate in the first place
      (for `constraint-readout.yml`: `python3 scripts/ops/constraint_readout.py
      --write && python3 scripts/ops/render_session_brief.py --write`).

      ⚠️ A FAILING COMMAND IS ITS OWN STATE AND IS NEVER SILENTLY IGNORED. It
      grades `failed_refresh_command`, distinct from `refreshed` and from
      `refreshed_rederived`, because "we re-derived" and "we tried and could
      not" are opposite facts about the head that is about to be pushed.
    required: false
    default: ""
  refresh-stale-branch:
    description: >
      When "true" (the default), a `verify-merged` wait that is not progressing
      MERGES CURRENT MAIN INTO THE THROWAWAY BRANCH ONCE, so the required checks
      re-run against a base that has moved.

      ⚠️ WHY: a branch's checks run once, on the sha the PR was opened with, and
      NOTHING ever re-runs them. So a base that was red — or merely different —
      when the branch was cut strands it permanently, even after main is fixed.
      Measured 2026-08-31: two automation PRs (#10538, #10539) sat stranded on
      `session-brief-guard`, which renders the SESSION BRIEF with
      `datetime.now()` — so the committed block goes stale at a UTC-midnight
      cadence boundary with no commit anywhere, and every PR open across that
      boundary reds on content it never touched. `pytest-run` was green on both.
      Merging main in produced a new head sha and both cleared.

      That specific cause is fixed at its root (the guard is diff-scoped now),
      but the STRUCTURE that turns any transient red base into a permanent
      strand is not, and this is the generic remedy.

      Bounded deliberately: at most ONE attempt per run, and only when main has
      actually moved — a merge that produces no new sha produces no new checks,
      so attempting it would be a pure no-op that still costs a poll. A conflict
      aborts and leaves the branch exactly as it was.

      Set "false" for byte-for-byte the pre-2026-08-31 wait.
    default: "true"
  branch-prefix:
    description: Prefix for the throwaway PR head branch.
    required: false
    default: automation/data-commit

outputs:
  committed:
    description: "true if a PR was opened, false if there was nothing to commit."
    value: ${{ steps.run.outputs.committed }}
  pr:
    description: The opened PR URL (empty when nothing to commit).
    value: ${{ steps.run.outputs.pr }}
  branch:
    description: >
      The throwaway head branch this action pushed the rows to (empty when
      nothing to commit). Published because a caller that wants to assert its
      rows landed needs to name the ref they were PUSHED to — that is the only
      thing separating `pending_merge` (we committed, the merge is owed) from
      `absent` (we produced nothing), and a caller with no branch name collapses
      the two. Re-deriving `<prefix>-<run_id>-<attempt>` caller-side would be a
      second copy of a naming scheme this action owns, free to drift from it.
    value: ${{ steps.run.outputs.branch }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        VERIFY_MERGED: ${{ inputs.verify-merged }}
        VERIFY_TIMEOUT_MINUTES: ${{ inputs.verify-timeout-minutes }}
        REFRESH_STALE_BRANCH: ${{ inputs.refresh-stale-branch }}
        REFRESH_COMMAND: ${{ inputs.refresh-command }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::commit-to-main: the PAT token input is empty. Set the repo secret (a PAT with Contents:write + Pull-requests:write) and pass it as the 'token' input."
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # `-f` IS LOAD-BEARING, NOT DEFENSIVE, and its absence made this action
        # silently unusable for any gitignored path. `.gitignore` ignores
        # `runtime_logs/`, so a plain `git add` REFUSES such a path outright
        # ("The following paths are ignored by one of your .gitignore files")
        # and, under `set -euo pipefail`, kills this step AFTER the caller has
        # already computed its artifact — i.e. the exact compute-then-discard
        # failure this action exists to absorb, reintroduced one layer down.
        # `replay-pregate-nightly` hand-rolled its own landing step and learned
        # this the hard way on run #4390 (2026-09-02), destroying 10 salvaged
        # heads; it could not then port onto this action without hitting the
        # same wall here.
        #
        # ⚠️ `-f` CANNOT WIDEN WHAT A CALLER LANDS. `PATHS` is an explicit,
        # caller-supplied list, never a wildcard sweep, so this overrides
        # .gitignore for exactly the paths the caller named and nothing else.
        # MEASURED 2026-09-12 over all 44 distinct `paths:` values passed by the
        # 29 calling workflows: ZERO are gitignored, so this is a strict no-op
        # for every caller that exists today and changes behaviour only for one
        # that deliberately lands an ignored path. Force-adding such a path is
        # an established pattern here — 72 files under `runtime_logs/` are
        # already tracked that way.
        # shellcheck disable=SC2086 — PATHS is intentionally word-split into args.
        git add -f -- ${PATHS}
        if git diff --cached --quiet; then
          echo "nothing to commit — no PR opened"
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "pr=" >> "$GITHUB_OUTPUT"
          echo "branch=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        BR="${BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        # THE LANDING DECLARATION, WRITTEN BY THE GENERATOR — because nothing
        # else can write it. `check_pr_landing.py`'s R11 asks whether the guard
        # existed at the branch's merge-base; every branch this action cuts from
        # a current `main` answers YES and therefore MUST declare. The branch is
        # created HERE, seconds before the PR, by a workflow — there is no
        # session to add the file and no human in the loop, so an automation PR
        # cut after 2026-09-03 fails R11 permanently and cannot merge.
        # MEASURED at 09:10Z that day: 7 open automation PRs red-locked on
        # exactly this (3 reconcile-open-prs, 3 work-digest, 1 strategy-reviews),
        # stacking up because each family re-fires on its cadence while nothing
        # can land. `reconcile-open-prs` keeps `docs/claude/work/OPEN-PRS.json`
        # honest, so the register that tracks PR staleness was itself the thing
        # that could not land.
        #
        # ⚠️ NOT AN EXEMPTION FOR `automation/**` IN THE GUARD. That was the
        # cheap route and it would have created an unguarded lane on the guard's
        # first day — the "cheaper to lie to than to satisfy" failure this repo
        # already paid for with `new-table-wiring-guard`'s presence-only marker.
        # These PRs now make the same declaration every other PR makes, and are
        # graded by the same rules.
        #
        # ⚠️ `landing: "self"` IS THE TRUE STATEMENT HERE, NOT THE CONVENIENT
        # ONE. This action arms auto-merge itself, four lines below, with
        # `gh pr merge --auto --squash`. So these PRs DO self-land, and
        # declaring `hold` would be a lie the action's own next step contradicts.
        # ⚠️ Note that route is INVISIBLE to the guard's `armed` test, which
        # looks only for `.github/pr-automerge-requests/<slug>.txt` — filed as
        # BL-20260903-CHECK-PR-LANDING-ARMED-TEST-MISSES-THE-GH-PR-MERGE-AUTO-ROUTE.
        #
        # The slug derivation is `check_pr_landing.branch_slug()`: strip a
        # leading `claude/`, then `/` -> `-`. These branches carry no `claude/`
        # prefix, so `automation/work-digest-123-1` -> `automation-work-digest-123-1`.
        SLUG="$(printf '%s' "${BR#claude/}" | tr '/' '-')"
        mkdir -p .github/pr-landing
        python3 - "$SLUG" "$BR" <<'PYDECL'
        import json, os, sys
        slug, branch = sys.argv[1], sys.argv[2]
        wf = os.environ.get("GITHUB_WORKFLOW", "unknown workflow")
        run = os.environ.get("GITHUB_RUN_ID", "unknown run")
        repo = os.environ.get("GITHUB_REPOSITORY", "")
        decl = {
            "tier": 1,
            "landing": "self",
            "why": (
                f"Machine-generated data commit, opened by the {wf!r} workflow "
                f"(run {run}) through .github/actions/commit-to-main on branch "
                f"{branch}. Tier-1 by the canonical doc's own list: the diff is "
                f"generated register/report content on the Tier-1 surface, with "
                f"no order path, no strategy config, no risk caps, no src/, no "
                f"deploy/ and no live-VM runtime file. It self-lands because "
                f"this same action arms auto-merge with `gh pr merge --auto "
                f"--squash`, so `self` is what actually happens; GitHub still "
                f"merges only on green, and R5 still grades the diff against "
                f"the Tier-1 surface rather than taking this declaration on "
                f"trust. Written by the generator because no session or human "
                f"is in the loop to write it."
            ),
        }
        with open(f".github/pr-landing/{slug}.json", "w", encoding="utf-8") as fh:
            json.dump(decl, fh, indent=2, ensure_ascii=False)
            fh.write("\n")
        print(f"landing declaration written for {slug}")
        PYDECL
        # AND THE ARMING HALF, because R6 requires BOTH and is right to.
        # `check_pr_landing.py` R6: a `landing: "self"` declaration with no
        # `.github/pr-automerge-requests/<slug>.txt` FAILS — "a readiness
        # declaration lands nothing on its own — that is precisely how 7 green
        # PRs sat unmerged on 2026-09-03". Verified by running the guard against
        # a real locked branch with only the declaration added: it moved the
        # failure from R11 to R6 rather than passing.
        #
        # ⚠️ SAY WHAT THIS FILE DOES AND DOES NOT DO HERE, so a later reader is
        # not misled. `claude-pr-automerge.yml` triggers on
        # `branches: ["claude/**"]`, and these branches are `automation/**` — so
        # this file does NOT fire that workflow and is NOT what merges the PR.
        # What merges it is `gh pr merge --auto --squash` two steps below.
        # The file is the repo's declared-intent record, which R6 checks, and
        # the intent it records is TRUE: this PR does auto-merge on green.
        # It is written INERT deliberately; do not "fix" it by widening that
        # workflow's branch filter, which would give every automation branch a
        # second, live arming path nobody asked for.
        mkdir -p .github/pr-automerge-requests
        printf 'armed by .github/actions/commit-to-main for %s (run %s)\n' \
          "${BR}" "${GITHUB_RUN_ID}" > ".github/pr-automerge-requests/${SLUG}.txt"
        # AND THE MERGE-SLOT CLAIM, because R13 requires it IN THE SAME PUSH
        # THAT ARMS — "arming is not a request to merge, it IS the merge".
        #
        # ⚠️ WITHOUT THIS EVERY PR THIS ACTION OPENS FAILS ITS OWN REQUIRED
        # GUARD AND CAN NEVER MERGE. The two writes above satisfied R11 and R6
        # and left R13 unsatisfied, so `pr-landing-guard` — a required check —
        # failed on every automation PR from the day R13 shipped. MEASURED
        # 2026-09-09: 47 open PRs, 46 of them automation, PR #11487's guards job
        # reading `PASS 53 · FAIL 1` with the 1 being this guard on R13.
        #
        # ⚠️ AND THE CONSEQUENCE WAS REPO-WIDE, NOT JUST A PILE OF OPEN PRs. The
        # receipt never lands -> `check_digest_liveness` reads the last LANDED
        # receipt -> grades `stale` past its window -> and because that guard is
        # time-based and repo-wide it then REDS EVERY OPEN PR, trading PRs
        # included. A generator that cannot land its own receipt takes the whole
        # repo red with it.
        #
        # ⚠️ THIS FILE IS THE WHOLE DENOMINATOR. The open queue showed eleven
        # distinct `automation/*` prefixes and that reads like eleven bugs; it is
        # not. Those are `branch-prefix` INPUTS to this one action, which 27
        # workflows call. Fixing any single caller would have fixed one prefix
        # and left the rest, which is why the fix is here.
        #
        # ⚠️ THE OLD NOTE HERE IS SUPERSEDED AND IS KEPT ONLY AS THE RECORD OF
        # WHY IT MATTERED. It read: *NOT WRITTEN WITH `json.dump` —
        # `session-board.json` is hand-maintained and matches NO `json.dumps`
        # indent (measured: 1, 2, 3, 4 and tab all differ; the root sits at 1
        # space while the `merge_slot` block sits at 2), so a whole-file
        # re-serialisation rewrites ~139 lines to change 4 and turns every
        # concurrent edit into a guaranteed conflict instead of a 4-line one.*
        # Every word of that was true and it no longer describes this step: the
        # claim below takes the per-branch route and touches `session-board.json`
        # NOT AT ALL, so there is no shared serialisation to preserve. Do not
        # re-derive a splice requirement from it.
        #
        # ⚠️ FAILS LOUDLY IF THE SCRIPT IS ABSENT rather than skipping the claim.
        # A silent skip would re-create the deadlock invisibly, which is the
        # exact class this change exists to end: a step that reports success for
        # something it did not achieve.
        if [ ! -f scripts/ops/claim_merge_slot.py ]; then
          echo "::error::commit-to-main: scripts/ops/claim_merge_slot.py is missing from this checkout, so the R13 merge-slot claim cannot be written. REFUSING to open a PR that would fail its own required guard and could never merge."
          exit 1
        fi
        # ⚠️ `--branch-claim`, NOT THE SHARED FIELD. R13 accepts both routes and
        # the legacy one still passes, so this action kept writing
        # `docs/claude/session-board.json::merge_slot` after the per-branch route
        # shipped — which means every automation PR dirtied every other
        # board-touching branch, and 27 workflows call this action.
        #
        # MEASURED on origin/main 2026-09-12, population = the last 40 commits:
        # 18 touch `session-board.json` and ALL 18 change the `merge_slot` lines,
        # INCLUDING ALL 3 automation commits. That is the mechanism
        # BL-20260908-R13-MAKES-EVERY-AUTOMATION-PR-WRITE-THE-MERGE-SLOT-SO-MAIN-CAN-NEVER-BE-QUIET
        # measured at SEVENTEEN consecutive conflict cycles on one PR: a branch
        # whose only conflict is those four lines cannot converge, because the
        # arrival rate of board-touching commits exceeds a CI window.
        #
        # ⚠️ NOTHING IS GIVEN UP. R13 never serialized — its own docstring says a
        # committed claim reaches no other session until the branch merges — so
        # the shared field bought CONFLICT and no exclusion. Attribution and
        # timestamping are preserved exactly and strengthened: the claim names
        # its branch in the PATH as well as in the body, and both must agree.
        #
        # ⚠️ THE PATH IS NOT RE-DERIVED HERE. `${SLUG}` and the script's own slug
        # rule agree on every branch name this action produces, and agreeing
        # today is not the same as being one rule. `git add` takes the DIRECTORY
        # so whatever the script wrote is what gets staged — a second derivation
        # is exactly how the two drift apart later.
        python3 scripts/ops/claim_merge_slot.py --branch-claim \
          --branch "${BR}" \
          --held-by "github-actions[bot] · ${GITHUB_WORKFLOW:-unknown workflow} run ${GITHUB_RUN_ID:-unknown}" \
          --purpose "Automated data commit opened by .github/actions/commit-to-main; arming auto-merge IS the merge, so R13 takes the slot here."
        # FAIL LOUDLY IF NO CLAIM LANDED. Same reasoning as the missing-script
        # check above: a step that reports success for something it did not
        # achieve re-creates the deadlock invisibly. `--branch-claim` exits 0 on
        # success, but an exit code is a claim about the CALL; the file is the
        # claim about the RESULT.
        if [ -z "$(git status --porcelain -- .github/merge-slots/)" ]; then
          echo "::error::commit-to-main: claim_merge_slot.py --branch-claim wrote nothing under .github/merge-slots/, so this branch holds no R13 claim and the PR could never merge. REFUSING."
          exit 1
        fi
        git add -- ".github/pr-landing/${SLUG}.json" \
                   ".github/pr-automerge-requests/${SLUG}.txt" \
                   ".github/merge-slots"
        git commit -m "${MESSAGE}"
        # Push the throwaway branch. The calling job checked out with the PAT, so
        # `origin` is PAT-authenticated → the PR opened below triggers the required
        # checks (a GITHUB_TOKEN-opened PR would not).
        git push origin "HEAD:refs/heads/${BR}"
        # BOUNDED RETRY ON A SECONDARY RATE LIMIT.
        # `probes` run #55 (2026-09-02, event=schedule) died exactly here with
        # `GraphQL: API rate limit already exceeded for user ID 119055177` — the
        # SAME exhausted quota that made strategy-review-packets run #22 report a
        # false "not on main" a few minutes earlier. `set -e` aborted on the first
        # try, leaving the rows pushed to the throwaway branch with NO PR opened
        # and nothing tracking them.
        #
        # ⚠️ STATE WHAT THIS CAN AND CANNOT ABSORB, because a retry that quietly
        # cannot help is worse than none. GitHub's SECONDARY limits clear in
        # seconds-to-a-minute and this absorbs them. A PRIMARY hourly limit does
        # NOT clear inside this window, and no bounded retry could reach it — such
        # a run still fails, and it SHOULD, because the real remedy is upstream
        # (fewer API calls from concurrent sessions), not a longer sleep here.
        PR_URL=""
        for attempt in 1 2 3; do
          if PR_URL="$(gh pr create --base main --head "${BR}" \
                        --title "${PR_TITLE}" --body "${PR_BODY}" 2>/tmp/ctm_create_err)"; then
            break
          fi
          PR_URL=""
          echo "::warning::commit-to-main: gh pr create attempt ${attempt}/3 failed: $(tail -c 400 /tmp/ctm_create_err)"
          [ "${attempt}" -eq 3 ] && break
          sleep $(( attempt * 20 ))
        done
        if [ -z "${PR_URL}" ]; then
          # NAME the consequence. The rows are not lost — they are on ${BR} — and
          # a reader who knows that can recover them; a bare exit 1 sends them
          # looking for a generation failure that did not happen.
          echo "::error::commit-to-main: could not open a PR for ${BR} after 3 attempts. THE ROWS ARE NOT LOST — they are pushed to ${BR} and can be opened manually. Last error: $(tail -c 400 /tmp/ctm_create_err)"
          exit 1
        fi
        echo "opened ${PR_URL}"
        # Squash-auto-merge once required checks pass; delete the throwaway branch.
        if ! gh pr merge --auto --squash --delete-branch "${PR_URL}"; then
          echo "::warning::commit-to-main: could not enable auto-merge on ${PR_URL} — leaving it open for a manual merge."
        fi
        echo "committed=true" >> "$GITHUB_OUTPUT"
        echo "pr=${PR_URL}" >> "$GITHUB_OUTPUT"
        echo "branch=${BR}" >> "$GITHUB_OUTPUT"

        if [ "${VERIFY_MERGED:-false}" != "true" ]; then
          echo "::notice::verify-merged is off — this step is green because a PR was OPENED, which is NOT the same as the rows being on main."
          exit 0
        fi

        # Wait for the auto-merge, exiting the moment it lands rather than
        # sleeping a fixed span.
        MINS="${VERIFY_TIMEOUT_MINUTES:-18}"
        case "${MINS}" in ''|*[!0-9]*) MINS=18 ;; esac   # a typo must not mean "do not wait"
        DEADLINE=$(( $(date +%s) + MINS * 60 ))

        # ── one-shot stale-branch refresh ───────────────────────────────────
        # A branch's checks run once, on the sha the PR opened with, and nothing
        # re-runs them — so a base that was red when the branch was cut strands
        # it forever. Merging current main in mints a new head sha, which is the
        # only thing that re-triggers the required checks.
        #
        # Attempted at most ONCE, a third of the way in (never before 3m), and
        # only if main has actually MOVED: a merge producing no new sha produces
        # no new checks, so trying would burn a poll for nothing.
        #
        # ⚠️ The states are NOT collapsed. `not_needed_up_to_date` (we looked,
        # there was nothing to merge) and `skipped_fetch_failed` (we could not
        # look) are opposite facts about why nothing happened, and a reader
        # debugging a strand needs to tell them apart.
        REFRESH_TRIED=0
        REFRESH_STATE="not_attempted"
        REFRESH_AT=$(( $(date +%s) + (MINS * 60 / 3) ))
        MIN_WAIT=$(( $(date +%s) + 180 ))
        # An explicit `if`, not `[ ... ] && VAR=...`. ⚠️ The reason is NOT the one
        # first written here — "set -e kills the job on a false test" — which was
        # measured and is FALSE mid-script: bash exempts a failing command in an
        # && list and execution continues (verified 2026-08-31, exit 0). It IS
        # true when such a list is the script's LAST statement (exit 1 there).
        # So the `if` buys immunity to a later edit moving this to the end, not a
        # bug fix; the claim is written down because a plausible-sounding shell
        # rule that does not hold is exactly what gets copied into the next file.
        if [ "${REFRESH_AT}" -lt "${MIN_WAIT}" ]; then REFRESH_AT="${MIN_WAIT}"; fi
        [ "${REFRESH_STALE_BRANCH:-true}" = "true" ] || REFRESH_STATE="disabled"

        # Did we EVER manage to read the PR? `UNKNOWN` is `gh pr view` failing,
        # and a loop that never once succeeded knows NOTHING about the merge —
        # a different fact from "it did not merge", and the one the timeout
        # message used to assert. See the `never_read` branch after the loop.
        STATE_EVER_READ=0
        while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
          STATE="$(gh pr view "${PR_URL}" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
          [ "${STATE}" = "UNKNOWN" ] || STATE_EVER_READ=1
          case "${STATE}" in
            MERGED)
              echo "merged: ${PR_URL}"
              exit 0
              ;;
            CLOSED)
              echo "::error::commit-to-main: ${PR_URL} was CLOSED without merging — the rows on ${BR} will never reach main."
              exit 1
              ;;
            *)
              # UNKNOWN is 'we could not read the PR', NOT 'not merged yet'.
              # Keep waiting rather than concluding either way.
              if [ "${REFRESH_TRIED}" -eq 0 ] && [ "${REFRESH_STATE}" != "disabled" ] \
                 && [ "$(date +%s)" -ge "${REFRESH_AT}" ]; then
                REFRESH_TRIED=1
                if ! git fetch -q origin main; then
                  REFRESH_STATE="skipped_fetch_failed"
                elif git merge-base --is-ancestor FETCH_HEAD HEAD; then
                  REFRESH_STATE="not_needed_up_to_date"
                elif ! git merge FETCH_HEAD -m "Merge main so the required checks re-run against the current base"; then
                  # ⚠️ THIS BRANCH IS NOW UNREACHABLE FROM THIS ACTION, AND IS
                  # KEPT DELIBERATELY RATHER THAN DELETED. The claim above moved
                  # to the per-branch route, so this action no longer touches
                  # `docs/claude/session-board.json` at all and a merge of `main`
                  # cannot conflict on a file this branch never changed. It stays
                  # because it costs nothing when it does not fire, and because
                  # the failure it prevents — a permanently stranded automation
                  # branch — is the one this action exists to end: if any caller
                  # reintroduces a board edit, aborting there would trade the
                  # deadlock for a conflict-strand. The reasoning below is the
                  # record of why the shared field needed handling at all, and it
                  # is also the argument for having moved off it.
                  #
                  # THE SLOT CLAIM MADE ONE CONFLICT ROUTINE, SO IT IS
                  # RESOLVED RATHER THAN ABORTED. R13 had every arming branch
                  # rewrite the SAME four lines of `session-board.json`, and R13
                  # does NOT serialize (a committed claim reaches no other
                  # session until the branch merges,
                  # BL-20260810-MERGE-SLOT-MIRROR-UNWRITABLE-PRE-MERGE). So two
                  # automation runs in flight at once each write a valid claim,
                  # never see one another, and collide here. VERIFIED, not
                  # assumed: replaying two concurrent claims in a scratch repo
                  # gives `CONFLICT (content): Merge conflict in
                  # docs/claude/session-board.json`.
                  #
                  # Aborting would strand the branch permanently — trading the
                  # deadlock this action just fixed for a conflict-strand on any
                  # overlapping pair. Resolving is not routing around R13: we
                  # take MAIN's board (so the other branch's claim and anyone's
                  # `active_sessions` edits survive) and then RE-ASSERT OUR OWN
                  # claim over it, which is precisely the attributable claim R13
                  # grades.
                  #
                  # ⚠️ SCOPED TO THAT ONE PATH. Any other conflicted file means
                  # two runs disagree about DATA, which no rule here can settle,
                  # so it still aborts.
                  CONFLICTED="$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ *$//')"
                  if [ "${CONFLICTED}" = "docs/claude/session-board.json" ] \
                     && git checkout --theirs -- docs/claude/session-board.json \
                     && python3 scripts/ops/claim_merge_slot.py \
                          --branch "${BR}" \
                          --held-by "github-actions[bot] · ${GITHUB_WORKFLOW:-unknown workflow} run ${GITHUB_RUN_ID:-unknown}" \
                          --purpose "Re-asserted over main after a merge-slot conflict; arming IS the merge (R13)." \
                     && git add -- docs/claude/session-board.json \
                     && git commit -q --no-edit; then
                    if git push origin "HEAD:refs/heads/${BR}"; then
                      REFRESH_STATE="refreshed_after_slot_conflict"
                      DEADLINE=$(( $(date +%s) + MINS * 60 ))
                    else
                      REFRESH_STATE="failed_push"
                    fi
                  else
                    git merge --abort || true
                    REFRESH_STATE="failed_conflict"
                  fi
                else
                  # ── RE-DERIVE BEFORE PUSHING ────────────────────────────────
                  # Merging main mints a new sha and re-triggers the checks. For
                  # a producer whose output is DERIVED FROM the registers it
                  # just merged, that is not enough: the new head still carries
                  # the pre-merge derived file, so a guard comparing the two
                  # fails again one sha later. Re-running the checks is not the
                  # remedy; re-deriving is.
                  #
                  # ⚠️ THREE OUTCOMES, NEVER COLLAPSED. `refreshed` = merged, no
                  # re-derive asked for. `refreshed_rederived` = merged AND the
                  # command ran AND changed something. `refreshed_rederive_noop`
                  # = the command ran and produced no change, which is a real
                  # and different answer (the derived file was already correct
                  # for the new base) and must not read as if nothing was tried.
                  # `failed_refresh_command` = we tried and could not, which is
                  # the opposite of having re-derived and must never be silent.
                  REDERIVE_STATE="not_requested"
                  if [ -n "${REFRESH_COMMAND:-}" ]; then
                    if bash -c "${REFRESH_COMMAND}"; then
                      # ⚠️ SCOPED TO ${PATHS}, like the original `git add`, so a
                      # re-derive can never widen what this caller lands — the
                      # invariant the `-f` comment above this script exists to
                      # protect. A change the command made OUTSIDE those paths
                      # is therefore NOT pushed, so it is reported rather than
                      # dropped silently: a caller seeing `rederived` must not
                      # have to wonder what else moved.
                      # shellcheck disable=SC2086 — PATHS is a pathspec list.
                      if ! git diff --quiet -- ${PATHS} || ! git diff --cached --quiet -- ${PATHS}; then
                        # shellcheck disable=SC2086
                        git add -f -- ${PATHS}
                        if git commit -q -m "Re-derive after merging main so the generated file matches the new base"; then
                          REDERIVE_STATE="rederived"
                        else
                          REDERIVE_STATE="failed_commit"
                        fi
                      else
                        REDERIVE_STATE="noop"
                      fi
                      # ⚠️ `git status --porcelain`, NOT `git diff`. A re-derive
                      # that CREATES a file leaves it UNTRACKED, and `git diff`
                      # does not see an untracked file — so the obvious check
                      # reports a clean tree for exactly the case most worth
                      # reporting. Found by the test, not by reading it back.
                      LEFTOVER="$(git status --porcelain --untracked-files=all | sed 's/^...//' | tr '\n' ' ' | sed 's/ *$//')"
                      if [ -n "${LEFTOVER}" ]; then
                        echo "::warning::commit-to-main: refresh-command also touched file(s) OUTSIDE this caller's paths (${PATHS}); those are NOT pushed: ${LEFTOVER}"
                      fi
                    else
                      REDERIVE_STATE="failed_command"
                    fi
                  fi
                  if [ "${REDERIVE_STATE}" = "failed_command" ] || [ "${REDERIVE_STATE}" = "failed_commit" ]; then
                    # Push anyway: the merge alone is still strictly better than
                    # a branch that never re-triggers its checks, and stranding
                    # it here would trade a stale-brief failure for a permanent
                    # strand. But SAY so — a silent fallthrough would report a
                    # re-derive that did not happen.
                    echo "::warning::commit-to-main: refresh-command ${REDERIVE_STATE} — pushing the merge WITHOUT a re-derive. The generated file on this head is still the pre-merge one, so a guard that compares it to the registers will fail again."
                    REFRESH_STATE="failed_refresh_command"
                  fi
                  if ! git push origin "HEAD:refs/heads/${BR}"; then
                    REFRESH_STATE="failed_push"
                  else
                    case "${REDERIVE_STATE}" in
                      rederived)      REFRESH_STATE="refreshed_rederived" ;;
                      noop)           REFRESH_STATE="refreshed_rederive_noop" ;;
                      failed_command|failed_commit) : ;;   # already set above
                      *)              REFRESH_STATE="refreshed" ;;
                    esac
                    # The fresh checks deserve the full budget, not the remainder.
                    DEADLINE=$(( $(date +%s) + MINS * 60 ))
                  fi
                fi
                echo "::notice::commit-to-main: stale-branch refresh -> ${REFRESH_STATE}"
              fi
              echo "state=${STATE}; refresh=${REFRESH_STATE}; waiting ($(( (DEADLINE - $(date +%s)) / 60 ))m left)"
              sleep 30
              ;;
          esac
        done
        # ⚠️ READ THE PR'S OWN CHECKS FIRST — do not assume a cause.
        # This message named the stranded-automerge row (referenced in FULL in
        # the echo below) as "almost certainly" the reason. ⚠️ Do not abbreviate
        # a backlog id in a comment: check_backlog_refs scans line by line, so a
        # truncated id resolves to nothing and reads as tracked while being
        # tracked by nobody — which is what this very comment did on first draft. On the very first real timeout (PR #10534,
        # dispatcher run 33340458710) that was WRONG: the base was green and
        # `pytest-run` failed on the branch's own content. Naming one cause
        # confidently sends the reader to re-run checks that will fail again.
        # ── ASK GIT BEFORE ASSERTING ANYTHING ────────────────────────────────
        # ⚠️ THIS BLOCK EXISTS BECAUSE THE MESSAGE BELOW WAS MEASURED FALSE.
        # strategy-review-packets run #22 (2026-09-02, its FIRST-EVER scheduled
        # run) failed here at 09:31:27Z reporting "the rows ... are NOT on main".
        # PR #10771 had MERGED at 09:20:18Z — eleven minutes earlier — and all
        # six of its check runs were `success`. The whole 30m of polling logged
        # `state=UNKNOWN`, i.e. `gh pr view` failed on EVERY attempt (the account
        # was rate-limited that morning), so the job never once read the PR and
        # then reported a merge outcome anyway.
        #
        # That is UNPROVENANCED DIAGNOSTIC OUTPUT sub-class A, which CLAUDE.md
        # defines as "a failure message that names a cause no code path tested":
        # both causes the message offers are about CHECK RUNS, and neither is
        # "we could not read the PR at all". The remedy this repo prescribes for
        # sub-class A is to branch on the actual failure STAGE, not to reword.
        #
        # So: `git` is an INDEPENDENT evidence source that needs no `gh`, no API
        # quota and no token beyond the checkout's own. Asking it converts an
        # assumption into a measurement — and on the motivating run it would have
        # returned "merged" and exited 0.
        # ⚠️ THE TEST IS PATH CONTENT, NOT ANCESTRY, AND THAT IS LOAD-BEARING.
        # A first draft used `git merge-base --is-ancestor HEAD FETCH_HEAD` and
        # it is WRONG here: this repo SQUASH-merges, so the throwaway branch's
        # commit is never an ancestor of main even when the PR merged perfectly.
        # Verified against the motivating run — #10771's head sha d3e8415c is
        # NOT an ancestor of origin/main, while
        # `comms/strategy_reviews/2026-09-02/INDEX.json` IS on main. An ancestry
        # test would have reproduced the very false negative this block exists to
        # end.
        #
        # So ask the question the message actually makes: are the PATHS WE
        # COMMITTED on main, byte-identical to what we wrote? That is
        # squash-safe, needs no `gh`, and is the claim itself rather than a
        # proxy for it.
        LANDED="unknown"
        if git fetch -q origin main 2>/dev/null; then
          # shellcheck disable=SC2086 — PATHS is a space-separated pathspec list.
          if git diff --quiet HEAD FETCH_HEAD -- ${PATHS} 2>/dev/null; then
            LANDED="yes"
          else
            LANDED="no"
          fi
        fi

        if [ "${LANDED}" = "yes" ]; then
          # The rows ARE on main. The wait was watching the wrong thing (or was
          # blind); the WORK succeeded, so the job must not fail.
          echo "::warning::commit-to-main: the ${MINS}m wait on ${PR_URL} expired, but git confirms the committed paths are byte-identical on origin/main — the rows LANDED. Reporting success on the git evidence rather than on the unreadable PR state. (state ever read: ${STATE_EVER_READ}; refresh: ${REFRESH_STATE}.) ⚠️ If this warning becomes routine, the WAIT is broken even though the WORK is fine — read `gh` auth/rate limits, do not learn to ignore it."
          exit 0
        fi

        # THREE OUTCOMES, NEVER COLLAPSED — and only the first two are claims
        # about the merge. `never_read` is a claim about US.
        if [ "${STATE_EVER_READ}" -eq 0 ]; then
          echo "::error::commit-to-main: ${PR_URL} — WE NEVER ONCE READ THE PR STATE in ${MINS}m (every poll returned UNKNOWN: \`gh pr view\` failed, typically auth or rate limit), and git says this commit is NOT on main (fetch: ${LANDED}). This is 'we could not look' PLUS an independent negative — NOT a verdict about the PR's checks. Fix the \`gh\` read first; do not re-run checks on a hunch."
          exit 1
        fi

        echo "::error::commit-to-main: ${PR_URL} did not merge within ${MINS}m (stale-branch refresh: ${REFRESH_STATE}; git confirms the commit is not on main). The rows are written on ${BR} and are NOT on main. CHECK THE PR'S OWN CHECK RUNS BEFORE ASSUMING A CAUSE — the two look identical from here: (a) the branch's checks FAILED on its own content, which a re-run will not fix; or (b) they were never re-run after a transient red base (BL-20260830-A-TRANSIENT-RED-BASE-PERMANENTLY-STRANDS-AN-AUTOMERGE-BRANCH), which a re-run or rebase does fix."
        exit 1
