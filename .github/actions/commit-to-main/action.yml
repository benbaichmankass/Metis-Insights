name: commit-to-main
description: >
  Land committed file(s) on the protected `main` branch from a GitHub-hosted
  workflow, via a PAT-authenticated auto-merge PR. `main` requires status checks
  and rejects a direct workflow push (GH006), and a PR opened with the default
  GITHUB_TOKEN does NOT trigger the on:pull_request required checks (so it would
  stall auto-merge forever). Opening the PR with a real PAT triggers the checks
  normally; they run + must pass; then the PR auto-merges (squash). This is the
  shared fix for BL-20260723-WORKFLOW-COMMIT-TO-PROTECTED-MAIN /
  BL-20260706-GPU-BURST-LEDGER-PUSH-RACE.

  REQUIREMENT: the calling job must `actions/checkout` with `token: <the PAT>` so
  the branch push is authenticated as the PAT (not GITHUB_TOKEN). The PAT needs
  Contents: write + Pull requests: write on this repo.

inputs:
  token:
    description: PAT with Contents:write + Pull-requests:write (also used for gh).
    required: true
  paths:
    description: Space-separated path(s) to `git add`.
    required: true
  message:
    description: Commit message (subject line).
    required: true
  pr-title:
    description: Title for the auto-merge PR.
    required: true
  pr-body:
    description: Body for the auto-merge PR.
    required: false
    default: "Automated data commit (auto-merge)."
  verify-merged:
    description: >
      When "true", block until the auto-merge PR this action opened has actually
      MERGED, and FAIL if it has not within `verify-timeout-minutes`.

      Off by default so existing callers are byte-for-byte unchanged.

      ⚠️ WITHOUT THIS, THIS ACTION EXITS 0 THE MOMENT THE PR IS *OPENED*. A green
      caller therefore means "a PR exists", never "the rows are on main" — and
      those are the two states R2 is entirely about. Measured 2026-08-30: 13
      workflows call this action, 12 verify nothing, and origin carried 5
      stranded `automation/*` branches, the oldest 10 weeks. The clean case is
      `automation/econ-calendar-33232352515-1`: one commit, 444 data rows,
      written 2026-08-29 and still not on main two days later, from a workflow
      that exited 0. See
      BL-20260830-TWELVE-OF-THIRTEEN-COMMIT-TO-MAIN-CALLERS-NEVER-CHECK-THEIR-ROWS-LANDED
      and, for why a branch strands in the first place,
      BL-20260830-A-TRANSIENT-RED-BASE-PERMANENTLY-STRANDS-AN-AUTOMERGE-BRANCH.

      Lives HERE rather than in each caller because the wait is identical
      everywhere and the naming, the PR url and the failure vocabulary are all
      this action's. A caller still owns the question this cannot answer — "are
      MY rows in the file?" — via assert_rows_landed.py --pushed-ref.
    default: "false"
  verify-timeout-minutes:
    description: >
      How long `verify-merged` waits. Default 30.

      ⚠️ IT WAS 18, CHOSEN AGAINST A "~11 min" FIGURE THAT IS NOT THIS REPO'S.
      MEASURED on the first real stamp merge (dispatcher run 33361821570,
      2026-08-31): the wait took 15m45s of the 18m budget — 87.5% — and merged
      with 2m15s to spare. `pytest-run` alone is 12.9-14.6 min on main and was
      observed at 15.3, before queue time. So 18 made every stamp a coin-flip on
      CI variance, and a timeout is not cosmetic: `verify-merged` FAILS the job,
      the stamp does not land, and the queue job re-fires on the next cron.

      30 keeps a real margin over the observed worst case without waiting all
      day on a genuinely stranded branch. Give the calling job a
      `timeout-minutes` above this or the job dies mid-wait — research-queue
      dispatch carries 35 for exactly that reason.
    default: "30"
  refresh-stale-branch:
    description: >
      When "true" (the default), a `verify-merged` wait that is not progressing
      MERGES CURRENT MAIN INTO THE THROWAWAY BRANCH ONCE, so the required checks
      re-run against a base that has moved.

      ⚠️ WHY: a branch's checks run once, on the sha the PR was opened with, and
      NOTHING ever re-runs them. So a base that was red — or merely different —
      when the branch was cut strands it permanently, even after main is fixed.
      Measured 2026-08-31: two automation PRs (#10538, #10539) sat stranded on
      `session-brief-guard`, which renders the SESSION BRIEF with
      `datetime.now()` — so the committed block goes stale at a UTC-midnight
      cadence boundary with no commit anywhere, and every PR open across that
      boundary reds on content it never touched. `pytest-run` was green on both.
      Merging main in produced a new head sha and both cleared.

      That specific cause is fixed at its root (the guard is diff-scoped now),
      but the STRUCTURE that turns any transient red base into a permanent
      strand is not, and this is the generic remedy.

      Bounded deliberately: at most ONE attempt per run, and only when main has
      actually moved — a merge that produces no new sha produces no new checks,
      so attempting it would be a pure no-op that still costs a poll. A conflict
      aborts and leaves the branch exactly as it was.

      Set "false" for byte-for-byte the pre-2026-08-31 wait.
    default: "true"
  branch-prefix:
    description: Prefix for the throwaway PR head branch.
    required: false
    default: automation/data-commit

outputs:
  committed:
    description: "true if a PR was opened, false if there was nothing to commit."
    value: ${{ steps.run.outputs.committed }}
  pr:
    description: The opened PR URL (empty when nothing to commit).
    value: ${{ steps.run.outputs.pr }}
  branch:
    description: >
      The throwaway head branch this action pushed the rows to (empty when
      nothing to commit). Published because a caller that wants to assert its
      rows landed needs to name the ref they were PUSHED to — that is the only
      thing separating `pending_merge` (we committed, the merge is owed) from
      `absent` (we produced nothing), and a caller with no branch name collapses
      the two. Re-deriving `<prefix>-<run_id>-<attempt>` caller-side would be a
      second copy of a naming scheme this action owns, free to drift from it.
    value: ${{ steps.run.outputs.branch }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        BRANCH_PREFIX: ${{ inputs.branch-prefix }}
        VERIFY_MERGED: ${{ inputs.verify-merged }}
        VERIFY_TIMEOUT_MINUTES: ${{ inputs.verify-timeout-minutes }}
        REFRESH_STALE_BRANCH: ${{ inputs.refresh-stale-branch }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::commit-to-main: the PAT token input is empty. Set the repo secret (a PAT with Contents:write + Pull-requests:write) and pass it as the 'token' input."
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # shellcheck disable=SC2086 — PATHS is intentionally word-split into args.
        git add -- ${PATHS}
        if git diff --cached --quiet; then
          echo "nothing to commit — no PR opened"
          echo "committed=false" >> "$GITHUB_OUTPUT"
          echo "pr=" >> "$GITHUB_OUTPUT"
          echo "branch=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        BR="${BRANCH_PREFIX}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        git commit -m "${MESSAGE}"
        # Push the throwaway branch. The calling job checked out with the PAT, so
        # `origin` is PAT-authenticated → the PR opened below triggers the required
        # checks (a GITHUB_TOKEN-opened PR would not).
        git push origin "HEAD:refs/heads/${BR}"
        PR_URL="$(gh pr create --base main --head "${BR}" --title "${PR_TITLE}" --body "${PR_BODY}")"
        echo "opened ${PR_URL}"
        # Squash-auto-merge once required checks pass; delete the throwaway branch.
        if ! gh pr merge --auto --squash --delete-branch "${PR_URL}"; then
          echo "::warning::commit-to-main: could not enable auto-merge on ${PR_URL} — leaving it open for a manual merge."
        fi
        echo "committed=true" >> "$GITHUB_OUTPUT"
        echo "pr=${PR_URL}" >> "$GITHUB_OUTPUT"
        echo "branch=${BR}" >> "$GITHUB_OUTPUT"

        if [ "${VERIFY_MERGED:-false}" != "true" ]; then
          echo "::notice::verify-merged is off — this step is green because a PR was OPENED, which is NOT the same as the rows being on main."
          exit 0
        fi

        # Wait for the auto-merge, exiting the moment it lands rather than
        # sleeping a fixed span.
        MINS="${VERIFY_TIMEOUT_MINUTES:-18}"
        case "${MINS}" in ''|*[!0-9]*) MINS=18 ;; esac   # a typo must not mean "do not wait"
        DEADLINE=$(( $(date +%s) + MINS * 60 ))

        # ── one-shot stale-branch refresh ───────────────────────────────────
        # A branch's checks run once, on the sha the PR opened with, and nothing
        # re-runs them — so a base that was red when the branch was cut strands
        # it forever. Merging current main in mints a new head sha, which is the
        # only thing that re-triggers the required checks.
        #
        # Attempted at most ONCE, a third of the way in (never before 3m), and
        # only if main has actually MOVED: a merge producing no new sha produces
        # no new checks, so trying would burn a poll for nothing.
        #
        # ⚠️ The states are NOT collapsed. `not_needed_up_to_date` (we looked,
        # there was nothing to merge) and `skipped_fetch_failed` (we could not
        # look) are opposite facts about why nothing happened, and a reader
        # debugging a strand needs to tell them apart.
        REFRESH_TRIED=0
        REFRESH_STATE="not_attempted"
        REFRESH_AT=$(( $(date +%s) + (MINS * 60 / 3) ))
        MIN_WAIT=$(( $(date +%s) + 180 ))
        # An explicit `if`, not `[ ... ] && VAR=...`. ⚠️ The reason is NOT the one
        # first written here — "set -e kills the job on a false test" — which was
        # measured and is FALSE mid-script: bash exempts a failing command in an
        # && list and execution continues (verified 2026-08-31, exit 0). It IS
        # true when such a list is the script's LAST statement (exit 1 there).
        # So the `if` buys immunity to a later edit moving this to the end, not a
        # bug fix; the claim is written down because a plausible-sounding shell
        # rule that does not hold is exactly what gets copied into the next file.
        if [ "${REFRESH_AT}" -lt "${MIN_WAIT}" ]; then REFRESH_AT="${MIN_WAIT}"; fi
        [ "${REFRESH_STALE_BRANCH:-true}" = "true" ] || REFRESH_STATE="disabled"

        while [ "$(date +%s)" -lt "${DEADLINE}" ]; do
          STATE="$(gh pr view "${PR_URL}" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
          case "${STATE}" in
            MERGED)
              echo "merged: ${PR_URL}"
              exit 0
              ;;
            CLOSED)
              echo "::error::commit-to-main: ${PR_URL} was CLOSED without merging — the rows on ${BR} will never reach main."
              exit 1
              ;;
            *)
              # UNKNOWN is 'we could not read the PR', NOT 'not merged yet'.
              # Keep waiting rather than concluding either way.
              if [ "${REFRESH_TRIED}" -eq 0 ] && [ "${REFRESH_STATE}" != "disabled" ] \
                 && [ "$(date +%s)" -ge "${REFRESH_AT}" ]; then
                REFRESH_TRIED=1
                if ! git fetch -q origin main; then
                  REFRESH_STATE="skipped_fetch_failed"
                elif git merge-base --is-ancestor FETCH_HEAD HEAD; then
                  REFRESH_STATE="not_needed_up_to_date"
                elif ! git merge FETCH_HEAD -m "Merge main so the required checks re-run against the current base"; then
                  git merge --abort || true
                  REFRESH_STATE="failed_conflict"
                elif ! git push origin "HEAD:refs/heads/${BR}"; then
                  REFRESH_STATE="failed_push"
                else
                  REFRESH_STATE="refreshed"
                  # The fresh checks deserve the full budget, not the remainder.
                  DEADLINE=$(( $(date +%s) + MINS * 60 ))
                fi
                echo "::notice::commit-to-main: stale-branch refresh -> ${REFRESH_STATE}"
              fi
              echo "state=${STATE}; refresh=${REFRESH_STATE}; waiting ($(( (DEADLINE - $(date +%s)) / 60 ))m left)"
              sleep 30
              ;;
          esac
        done
        # ⚠️ READ THE PR'S OWN CHECKS FIRST — do not assume a cause.
        # This message named the stranded-automerge row (referenced in FULL in
        # the echo below) as "almost certainly" the reason. ⚠️ Do not abbreviate
        # a backlog id in a comment: check_backlog_refs scans line by line, so a
        # truncated id resolves to nothing and reads as tracked while being
        # tracked by nobody — which is what this very comment did on first draft. On the very first real timeout (PR #10534,
        # dispatcher run 33340458710) that was WRONG: the base was green and
        # `pytest-run` failed on the branch's own content. Naming one cause
        # confidently sends the reader to re-run checks that will fail again.
        echo "::error::commit-to-main: ${PR_URL} did not merge within ${MINS}m (stale-branch refresh: ${REFRESH_STATE}). The rows are written on ${BR} and are NOT on main. CHECK THE PR'S OWN CHECK RUNS BEFORE ASSUMING A CAUSE — the two look identical from here: (a) the branch's checks FAILED on its own content, which a re-run will not fix; or (b) they were never re-run after a transient red base (BL-20260830-A-TRANSIENT-RED-BASE-PERMANENTLY-STRANDS-AN-AUTOMERGE-BRANCH), which a re-run or rebase does fix."
        exit 1
