name: sunset-pass

# E3 — the SUNSET PASS, on a cadence. Phase G of the operating-layer build.
#
# WHY A CRON AND NOT A SESSION. E3's trigger is *Cadenced* in the operating
# model, and the reason is the measurement it exists to fix: 6 strategy
# retirements ever, none in five weeks against 45 live legs, and nothing has
# ever retired a skill, register, workflow or guard. A pass that only runs when
# a session remembers to run it is how that record was set.
#
# WHY THIS RUNS ON A HOSTED RUNNER AND NOT THE VM — and it is a real difference
# from `strategy-review-packets.yml`, not an oversight. That workflow generates
# ON THE VM because it opens the live trade journal (`sqlite mode=ro`) and
# copying a money DB to a hosted runner would be a far worse trade than one SSH.
# This pass opens NO database. It reads committed artifacts plus ONE public
# Tier-1 HTTP route over the Caddy hostname the SPA already uses. No SSH, no
# journal, no credential.
#
# ⚠️ THE LIFETIME CAPTURE IS THREE-STATE AND THE FAILURE DIRECTION MATTERS.
# `/api/bot/performance?window=all` is what separates "this leg has never closed
# a trade in its life" from "the gate has not had 20 closes to look at yet".
# If the curl fails we pass NOTHING rather than an empty file: `lifetime_state`
# then reads `not_read` and the pass proposes NOTHING on lifetime evidence.
# An empty JSON would read as `unreadable`; a `{"perStrategy": []}` would read
# as `read` and manufacture ~50 retirement candidates out of a network blip.
# That is the whole reason the fetch and the run are separate steps.

on:
  schedule:
    # 05:10 UTC Mondays — WEEKLY, not daily, and the cadence is the argument.
    # A retirement candidate is a claim about accumulated silence; re-asking
    # daily would not make the answer arrive sooner and would put 52 rows of
    # churn a day into a committed record. It runs after
    # `strategy-review-packets` (04:40 daily) so the newest M7 index is already
    # committed and the pass reads a same-day denominator.
    - cron: "10 5 * * 1"
  workflow_dispatch:
    inputs:
      reason:
        description: "why this is being run off-cadence"
        required: false

# ⚠️ DO NOT ASSUME THE CRON FIRES. `probes.yml` and `due-list.yml` both landed
# 2026-08-31 with valid crons and have ZERO schedule runs since
# (`OI-20260901-SCHEDULED-PROBES-AND-DUE-LIST-HAVE-NEVER-FIRED-ON-CRON`, open).
# Scheduling demonstrably works elsewhere here — `health-snapshot` has 438
# schedule runs — so this is unexplained rather than impossible. The
# `workflow_dispatch` path exists so the mechanism can be PROVEN now instead of
# inferred from a cron nobody has watched fire.

concurrency:
  group: sunset-pass
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sunset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ MUST be the PAT, not GITHUB_TOKEN. The landing step below calls
          # `.github/actions/commit-to-main`, which pushes its branch with
          # whatever credential the checkout configured, and a PR opened by
          # GITHUB_TOKEN does NOT trigger the `on: pull_request` required
          # checks — so it would stall auto-merge forever. The action's own
          # docstring states this as a REQUIREMENT of calling it.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml

      - name: Capture lifetime closes (best-effort, and its failure is a STATE)
        id: life
        run: |
          set -uo pipefail
          if curl -fsS --max-time 45 \
               "https://ict-bot.duckdns.org/api/bot/performance?window=all" \
               -o /tmp/perf.json \
             && python3 -c "import json,sys; d=json.load(open('/tmp/perf.json')); sys.exit(0 if isinstance(d.get('perStrategy'),list) else 1)"; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "lifetime capture OK"
          else
            # DELIBERATELY leave the file unused rather than writing a stub.
            # See the header: a stub would read as `read` and manufacture
            # candidates out of a network failure.
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::lifetime capture unavailable — the pass will run with"
            echo "::warning::lifetime_state=not_read and propose NOTHING on lifetime evidence."
          fi

      - name: Run the sunset pass
        run: |
          set -euo pipefail
          if [ "${{ steps.life.outputs.have }}" = "1" ]; then
            python3 scripts/ops/sunset_pass.py --lifetime-json /tmp/perf.json --write
          else
            python3 scripts/ops/sunset_pass.py --write
          fi

      # ⚠️ THIS STEP WAS A DIRECT `git push origin "HEAD:${GITHUB_REF_NAME}"`,
      # AND ON THIS WORKFLOW THAT COULD NEVER SUCCEED — not "usually failed".
      # `on:` here is `schedule` + `workflow_dispatch` ONLY, and BOTH of those
      # run on the default branch, so `GITHUB_REF_NAME` is ALWAYS `main`, which
      # is branch-protected. MEASURED over the workflow's complete run history:
      # exactly one scheduled run has ever fired (34110131942, 2026-09-07),
      # and it failed at this step with
      # `! [remote rejected] HEAD -> main (protected branch hook declined)`,
      # twice, then `could not push the sunset artifact`.
      #
      # The retry loop could not help and made it look considered: a protected
      # branch declines the push on every attempt, so four tries produced four
      # identical refusals. `git pull --rebase` rebases fine and changes nothing
      # about who may push.
      #
      # ⚠️ THE CONSEQUENCE WAS ON AN OPERATOR SURFACE, WHICH IS WHY THIS IS NOT
      # COSMETIC: the CLAUDE.md SESSION BRIEF renders `comms/sunset/`, so it has
      # been advertising "10 retirement candidate(s) over 52 strategy legs" from
      # a pass whose only scheduled run could not land its artifact. Retiring a
      # leg is Tier-3, so no strategy was harmed — the defect is that the brief
      # read as if a live weekly cadence stood behind the list.
      #
      # There is no non-`main` path to preserve here (unlike
      # replay-pregate-nightly.yml, which takes a `ref:`), so this is an
      # unconditional swap rather than a two-branch split.
      - name: Land the sunset artifact on main (auto-merge PR)
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/sunset
          message: "sunset-pass: E3 candidates"
          pr-title: "chore(sunset): E3 retirement candidates (auto)"
          pr-body: >-
            Automated E3 sunset pass. PROPOSES retirement candidates and enacts
            nothing — retiring a strategy leg is Tier-3 and is dispositioned by
            hand in `docs/claude/SUNSET-DISPOSITIONS.json`.
          branch-prefix: automation/sunset-pass
          # ⚠️ LOAD-BEARING. Without it the step exits 0 the moment the PR
          # OPENS, so a green run would mean "a PR exists" and never "the
          # candidates are on main" — and the backlog row's criterion asks for
          # the artifact to be ON origin/main carrying that run's stamp. The
          # whole defect being fixed here is that a run reported success while
          # its output landed nowhere; a landing step that verifies nothing
          # would reproduce it one level up.
          verify-merged: "true"

      - name: Report
        run: |
          python3 - <<'PY'
          import json, glob, os
          f = sorted(glob.glob("comms/sunset/*/INDEX.json"))[-1]
          d = json.load(open(f))
          p = d["population"]
          n = d["retire_candidates"]
          # STATE THE POPULATION. A candidate count with no denominator is the
          # unstated-population error this repo has a top-level rule about.
          line = (f"E3 sunset pass {d['utc_date']}: **{n} retirement candidate(s)** over "
                  f"{p['strategy_legs_graded']} strategy legs "
                  f"(lifetime read `{p['lifetime_state']}`, "
                  f"{len(p['packet_dates_read'])} packet date(s)); machinery probe "
                  f"`{p['machinery_probe']['probe_state']}`, "
                  f"{p['machinery_probe']['scanned']} findings carried.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(line + "\n\nE3 **proposes**; retiring a live leg is Tier-3. "
                       "Disposition candidates in `docs/claude/SUNSET-DISPOSITIONS.json` "
                       "— `check_sunset_dispositions.py` escalates an unanswered one.\n")
          print(line)
          PY
