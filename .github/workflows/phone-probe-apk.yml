name: phone-probe-apk

# Builds the phase-1a Android WebView probe (tools/phone-probe/) and uploads the DEBUG APK as a workflow artifact.
# Design: docs/integrations/breakout-phone-executor-DESIGN.md § 7.2 / § 7.9.
#
# Tier 1: builds a sideloadable debug APK; touches no VM, no order path, no secret. The app is read-only
# (no order, no tap on the Breakout page, no stored credential). It is signed with the runner's throwaway debug
# key, so a LATER build cannot be installed over an earlier one — uninstall first, which also clears its session.

on:
  push:
    paths:
      - 'tools/phone-probe/**'
      - '.github/workflows/phone-probe-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages (runner image ships the SDK; add what the build needs)
        run: |
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: tools/phone-probe
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Page-side logic check (headless Chromium)
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE" && NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/phone-probe/test/fixture_check.js
      - uses: actions/upload-artifact@v4
        with:
          name: phone-probe-1a-debug-apk
          path: tools/phone-probe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# no-durable-result: builds a sideloadable probe APK; the probe's measurements come from the operator's phone, not from this job
