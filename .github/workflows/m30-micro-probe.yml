name: m30-micro-probe

# M30 S0 — microstructure FEASIBILITY probe on a GitHub-hosted runner.
#
# The free/cheap daily-bar macro input class is exhausted (M28 ledger: 15 graded
# constructions, zero survivors). This is the S0 feasibility step of the pivot to a
# different input class — higher-frequency intraday OHLCV structure off the keyless
# Bybit v5 kline API. Bybit geo-blocks US IPs on api.bybit.com, but api.bytick.com
# (Bybit's alternate CDN) IS reachable from a US GitHub-hosted runner — the probe's
# fetcher tries bytick FIRST (via crypto_signals_data._bases), so this runs off-VM
# here with no trainer-VM relay needed (unlike the crypto sleeve backfill).
#
# S0 = FEASIBILITY, not a graded verdict: data density + per-feature non-degeneracy +
# a FIRST-LOOK (in-sample, overlapping) IC preview. The honest non-overlapping S2
# grader is a follow-up, only if S0 passes.
#
# Runs entirely off-VM (ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). No SSH, no
# live-VM touch, no order path, no commit — comment-back only (a research probe, not a
# persisted artifact).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (symbols/interval/horizons overrides).
#   2. issues.opened w/ label `m30-micro-probe-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "CSV of Bybit symbols"
        required: false
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      interval:
        description: "Bybit kline interval (e.g. 5,15,60)"
        required: false
        default: "60"
      horizons:
        description: "CSV of forward-bar horizons for the first-look IC"
        required: false
        default: "1,2,4,8"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: m30-micro-probe-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'm30-micro-probe-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: M30 S0 — microstructure feasibility probe
        id: probe
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          python scripts/micro/microstructure_probe.py \
            --symbols "${{ github.event.inputs.symbols || 'BTCUSDT,ETHUSDT,SOLUSDT' }}" \
            --interval "${{ github.event.inputs.interval || '60' }}" \
            --horizons "${{ github.event.inputs.horizons || '1,2,4,8' }}" \
            --out /tmp/m30-micro.json | tee /tmp/m30_micro_card.txt

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(probe output unavailable)';
            try { card = fs.readFileSync('/tmp/m30_micro_card.txt', 'utf8'); } catch (e) {}
            const body = [
              '🔬 **m30-micro-probe** — S0 microstructure feasibility (intraday OHLCV off Bybit klines).',
              '',
              '```', card.trim(), '```',
              '',
              '_S0 = feasibility only; first-look IC is an in-sample preview, NOT the honest non-overlapping S2 verdict._',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
