name: pm-snapshot-collect

# PM-COLLECTOR — free prediction-market snapshots for macro questions (Fed decision,
# CPI, NFP, recession) from Kalshi's public market-data REST and Polymarket's public
# gamma API. Same landing shape as econ-calendar-produce (PAT-authored auto-merge PR via
# ./.github/actions/commit-to-main). APPEND-ONLY point-in-time log: comms/macro/pm_snapshots/YYYY-MM.jsonl.
# Tier-1-style data pull: no key, no order path, no live-VM mutation, no evaluation.
# Cadence: every 6h (~1 min/run => ~120 Actions min/month).

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pm-snapshot-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip "pyyaml>=6.0"
      - name: Collect snapshots (append-only)
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: python scripts/macro/pm_snapshot_collect.py
      - name: Land snapshots on main (auto-merge PR)
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/macro/pm_snapshots
          message: "chore(pm): prediction-market PIT snapshots"
          pr-title: "chore(pm): prediction-market PIT snapshots (auto)"
          pr-body: "Append-only Kalshi/Polymarket macro-market snapshots (pm-snapshot-collect). Data-only; auto-merge."
          branch-prefix: automation/pm-snapshots
          verify-merged: "true"
