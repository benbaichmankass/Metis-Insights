name: m33-seasonality-grade

# M33 — grade the CALENDAR-SEASONALITY family on a GitHub-hosted runner.
#
# A new free signal family beyond the exhausted macro inputs (COT/crypto/value/
# implied-vol/credit): does the forward DAILY return differ by day-of-week /
# day-of-month bucket / turn-of-month, out-of-sample and net of cost? Keyless FRED
# daily closes (SP500/NASDAQ100/DJIA/WTI), US-reachable, so — like the value +
# implied-vol + credit sleeves — this runs on a GitHub-hosted US runner; no trainer
# relay, no geo-block. The best/worst bucket is picked IN-SAMPLE only and evaluated
# on the untouched OOS half (no seasonality data-snoop), significance + net-of-cost.
#
# Off-VM (ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). Comment-back only — the
# verdict is posted to the issue; nothing is committed (a research grade).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (cost/split/t-flag overrides).
#   2. issues.opened w/ label `m33-seasonality-grade-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      cost_bps:
        description: "per-entry round-trip cost in bps"
        required: false
        default: "1.0"
      t_flag:
        description: "OOS |t| significance flag"
        required: false
        default: "2.0"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: m33-seasonality-grade-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  grade:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'm33-seasonality-grade-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: M33 — grade the calendar-seasonality family
        id: grade
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          python scripts/macro/seasonality_probe.py \
            --cost-bps "${{ github.event.inputs.cost_bps || '1.0' }}" \
            --t-flag "${{ github.event.inputs.t_flag || '2.0' }}" \
            | tee /tmp/m33_seasonality_card.txt

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(grade output unavailable)';
            try { card = fs.readFileSync('/tmp/m33_seasonality_card.txt', 'utf8'); } catch (e) {}
            const body = [
              '🧪 **m33-seasonality-grade** — calendar-seasonality family (day-of-week / day-of-month / turn-of-month → daily return).',
              '',
              '```', card.trim(), '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
