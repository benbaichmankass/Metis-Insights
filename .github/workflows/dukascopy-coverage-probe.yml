# Does Dukascopy actually cover the 18 symbols behind the blocked backtest cells?
#
# WHY THIS EXISTS. yfinance is MEASURED to serve at most 730 d of 1h history —
# it REFUSES a longer request outright rather than truncating it (proof run
# 32734360738). Eight of the 25 `no_free_lane_candle_feed` legs are 1h and want
# a ~1825 d sweep span, so yfinance cannot serve them at any request size.
# Dukascopy serves YEARS of 1-minute history for FX / metals / index / ETF CFDs,
# which makes it the candidate — but "is it the candidate" is a question about
# COVERAGE, and nobody has ever asked it.
#
# ⚠️ THIS PROBE DUMPS THE CATALOGUE; IT DOES NOT DECLARE COVERAGE.
# The mapping from our symbol to a Dukascopy instrument is a JUDGEMENT, not a
# substring match, and the two are easy to confuse:
#   - SPY   -> INSTRUMENT_ETF_CFD_US_SPY_US   is the same underlying.
#   - MES   -> an index CFD is a DIFFERENT INSTRUMENT (different venue, hours,
#             financing and settlement) that merely tracks the same index.
# Reporting the second as "covered" is the semantic substitution this repo's
# diagnostic-provenance rule exists to stop. So the job prints the raw
# catalogue and a human/session does the mapping with the states kept apart.
#
# Read-only: lists instrument names, fetches NO candles, writes NO data.
name: dukascopy-coverage-probe

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Substring to list (empty = the WHOLE catalogue)"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install pandas dukascopy-python

      - name: Dump the catalogue
        run: |
          set -euo pipefail
          python scripts/ops/fetch_dukascopy_ohlcv.py --list "${{ inputs.filter }}" \
            | tee /tmp/catalogue.txt
          echo "---- catalogue size ----"
          wc -l < /tmp/catalogue.txt

      - name: Probe each blocked symbol, and REPORT BOTH FAILURE DIRECTIONS
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess, sys

          # The 18 distinct symbols behind the 25 no_free_lane_candle_feed cells.
          SYMBOLS = ["GDX", "GLD", "IAUM", "IEF", "IWM", "MES", "MGC", "MHG",
                     "QLD", "QQQ", "SCHA", "SLV", "SPLG", "SPY", "TLT",
                     "TQQQ", "USO", "XAUUSD"]

          # ⚠️ RUN 1 (32744577414) GOT TWO OF EIGHTEEN WRONG, IN OPPOSITE
          # DIRECTIONS, and both came from matching a raw ticker as a substring:
          #
          #   FALSE POSITIVE  MHG -> INSTRUMENT_NORWAY_MHG_NO_NOK, which is
          #                   Mowi ASA, a Norwegian salmon farmer quoted in NOK.
          #                   Our MHG is CME Micro Copper. A reader trusting the
          #                   hit would backtest copper against fish.
          #   FALSE NEGATIVE  XAUUSD reported unmatched while the venue carries
          #                   INSTRUMENT_FX_METALS_XAU_USD -- the underscore
          #                   defeated a literal substring search. Confirmed on
          #                   the venue by run 32744837828, not from a docstring.
          #
          # So a raw substring is not a probe, it is a coincidence detector.
          # Two changes, and NEITHER of them decides coverage -- that stays a
          # reader's judgement, which is the whole contract of this job:
          #   1. Also try a PUNCTUATION-INSENSITIVE form, so XAUUSD reaches
          #      XAU_USD. Reported as a separate `relaxed` match so it is never
          #      silently equated with an exact one.
          #   2. Flag every hit whose instrument family is NOT a US ETF CFD as
          #      NEEDS_ADJUDICATION. That is what separates SPY (an ETF CFD, the
          #      same underlying) from MHG (a Norwegian equity that merely
          #      shares three letters).

          def names_for(query):
              out = subprocess.run(
                  [sys.executable, "scripts/ops/fetch_dukascopy_ohlcv.py",
                   "--list", query],
                  capture_output=True, text=True).stdout.strip()
              if not out or out.startswith("no instrument matches"):
                  return []
              return out.splitlines()

          def relaxed(sym):
              """XAUUSD -> XAU_USD. Only tried when the exact form finds nothing."""
              if len(sym) == 6 and sym.isalpha():
                  return f"{sym[:3]}_{sym[3:]}"
              return None

          US_ETF_CFD = re.compile(r"^INSTRUMENT_ETF_CFD_US_([A-Z0-9]+)_US_USD$")

          exact, via_relaxed, unmatched = {}, {}, []
          for sym in SYMBOLS:
              hits = names_for(sym)
              if hits:
                  exact[sym] = hits
                  continue
              alt = relaxed(sym)
              hits = names_for(alt) if alt else []
              if hits:
                  via_relaxed[sym] = (alt, hits)
              else:
                  unmatched.append(sym)

          def adjudicate(sym, names):
              """Which hits are the SAME ticker as a US ETF CFD, and which are not."""
              same, other = [], []
              for n in names:
                  m = US_ETF_CFD.match(n)
                  (same if m and m.group(1) == sym else other).append(n)
              return same, other

          print("=== EXACT NAME MATCH ===")
          for sym in sorted(exact):
              same, other = adjudicate(sym, exact[sym])
              if same:
                  print(f"  {sym}: SAME-TICKER US ETF CFD -> {', '.join(same)}")
              if other:
                  print(f"  {sym}: ⚠️ NEEDS_ADJUDICATION (not a same-ticker US "
                        f"ETF CFD) -> {', '.join(other)}")
              if not same:
                  print(f"      ^ {sym} has NO same-ticker ETF CFD. A hit here is "
                        f"a coincidence until a reader says otherwise.")

          print("\n=== MATCHED ONLY VIA THE RELAXED FORM ===")
          # Kept separate from exact: the relaxed form is a GUESS about how the
          # venue punctuates, and a reader should see that it was needed.
          for sym in sorted(via_relaxed):
              alt, names = via_relaxed[sym]
              print(f"  {sym} (as {alt}): {', '.join(names)}")
          if not via_relaxed:
              print("  (none)")

          print("\n=== NO MATCH IN EITHER FORM ===")
          # Stated explicitly: a symbol missing from a hit list is otherwise
          # indistinguishable from one nobody probed.
          print("  " + (", ".join(unmatched) if unmatched else "(none)"))

          print(f"\nprobed={len(SYMBOLS)}  exact={len(exact)}  "
                f"relaxed={len(via_relaxed)}  unmatched={len(unmatched)}")
          print("\n⚠️ NONE OF THESE THREE BUCKETS IS 'COVERED'. A same-ticker US "
                "ETF CFD is the same underlying but still a CFD (financing and "
                "fees differ from the ETF). A NEEDS_ADJUDICATION hit may be an "
                "unrelated instrument -- MHG matched a Norwegian salmon farmer. "
                "MES/MGC have no same-ticker instrument and would need a PROXY, "
                "which is a different instrument and must stay labelled as one.")
          PY
