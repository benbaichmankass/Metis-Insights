name: econ-calendar-produce

# ROADMAP_MACRO M1 — the economic-calendar spine producer's DETERMINISTIC
# re-parse-and-land path.
#
# TWO sources of the same point-in-time economic-calendar rows, one pipeline:
#   1. FMP (the AUTONOMOUS feed) — Financial Modeling Prep's economic calendar
#      (free tier + FMP_API_KEY), fetched directly on this hosted runner over plain
#      HTTPS (scripts/macro/econ_calendar_fmp.py), exactly like the FRED valuation
#      producer. This is what runs on the daily SCHEDULE — no session dependency.
#   2. Bigdata.com tearsheet .md captures — a richer cross-check (curve/VIX/CFTC),
#      dropped in by a Claude session; parsed the same way.
# Both write a capture under comms/macro/econ_calendar_captures/ and the producer
# regenerates comms/macro/econ_calendar_snapshots.jsonl (point-in-time, append-only)
# + econ_calendar_upcoming.json from ALL committed captures. Full-regen is
# idempotent (same captures → same log byte-for-byte); a new capture adds its rows.
#
# The live sleeve reads the accrued snapshots (git-synced onto the live VM); the M1
# "clean joined dataset" gate replays them. See scripts/macro/econ_calendar_{fmp,produce}.py
# and docs/research/M1-econ-calendar-spine-2026-07-29.md.
#
# NOT --emit-config: config/economic_calendar.yaml is a LIVE-PATH config (read by the
# news-influence layer). A cadence must never silently mutate it — its population
# stays an operator-gated, session-emitted change (Tier-3).
#
# Safe to merge BEFORE FMP_API_KEY is provisioned: the FMP fetch step is gated on the
# secret being present; without it the scheduled run just regenerates from existing
# captures (a no-op commit) — it never fails for a missing key.
#
# HOW IT LANDS ON PROTECTED main: checks out with the BRANCH_PROTECTION_TOKEN PAT and
# hands off to ./.github/actions/commit-to-main (PAT-authored auto-merge PR — same as
# the macro-valuation-snapshot / macro-*-backfill cluster).
#
# Triggers:
#   1. schedule          — daily 22:30 UTC (after the US session's prints; a
#                          cadence-daily read is plenty for a weeks-horizon study).
#   2. workflow_dispatch — operator "Run workflow" (seed / manual top-up / re-land).
#   3. issues.opened w/ label `econ-calendar-produce-now` — Claude-driven (owner only).
#
# Tier-1: observability producer, no order path, no live-VM mutation. FMP_API_KEY is
# a free key used only on the runner (never reaches the live VM).

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: econ-calendar-produce
  cancel-in-progress: false

jobs:
  produce:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'econ-calendar-produce-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: Fetch FXStreet economic-calendar capture (autonomous feed)
        # FXStreet's calendar-api is KEYLESS (the empirical source probe picked it:
        # 92 US events with consensus + actual + revised — docs/research/
        # M1-econ-calendar-source-probe-2026-07-29.md). No secret, so the scheduled
        # run always fetches. Best-effort: a fetch failure regenerates from existing
        # captures rather than failing the run.
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          python scripts/macro/econ_calendar_fxstreet.py \
            --countries US \
            --days-back 45 --days-forward 14 \
            --out-dir comms/macro/econ_calendar_captures || \
            echo "::warning::FXStreet fetch degraded — regenerating from existing captures only"

      - name: Regenerate PIT snapshots from ALL committed captures
        id: produce
        run: |
          set -euo pipefail
          python scripts/macro/econ_calendar_produce.py \
            --json /tmp/econ_produce_summary.json
          {
            echo "summary<<EOF"
            cat /tmp/econ_produce_summary.json
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Land the captures + regenerated PIT log on main (auto-merge PR)
        id: commit
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/macro/econ_calendar_captures comms/macro/econ_calendar_snapshots.jsonl comms/macro/econ_calendar_upcoming.json
          message: "chore(m1): economic-calendar PIT snapshots"
          pr-title: "chore(m1): economic-calendar PIT snapshots (auto)"
          pr-body: "Point-in-time economic-calendar snapshots — daily FMP capture + regen (econ-calendar-produce). Data-only; auto-merge. Live-path config/economic_calendar.yaml is NOT touched here (operator-gated)."
          branch-prefix: automation/econ-calendar
          # ⚠️ NOT decoration: without this the step exits 0 the moment the PR
          # OPENS, and "the push succeeded" is silently treated as "the rows
          # arrived". They are different claims and only one is what a later
          # session depends on. The action owns the bounded wait — do not copy
          # a timeout here.
          verify-merged: "true"

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.produce.outputs.summary }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          PR: ${{ steps.commit.outputs.pr }}
        with:
          script: |
            const summary = process.env.SUMMARY || '(no summary captured)';
            const committed = process.env.COMMITTED || 'unknown';
            const pr = process.env.PR || '';
            const body = [
              '🗓️ **econ-calendar-produce** — regenerated PIT snapshots from committed captures.',
              '',
              '```json', summary.trim(), '```',
              '',
              committed === 'true' ? `landed via auto-merge PR: ${pr}` : 'no snapshot change this run.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
