name: econ-calendar-produce

# ROADMAP_MACRO M1 — the economic-calendar spine producer's DETERMINISTIC
# re-parse-and-land path.
#
# The calendar data comes through the Bigdata.com MCP (bigdata_country_tearsheet),
# which is bound to a Claude session — a GitHub-hosted runner CANNOT call it (unlike
# the keyless-HTTP feeds FRED/CFTC/Bybit/Open-Meteo). So the FETCH is a thin
# Claude-session step that saves each raw tearsheet to a committed capture under
# comms/macro/econ_calendar_captures/<COUNTRY>-<observed_at>.md; THIS workflow is the
# pure, CI-reproducible parse → point-in-time-map → land half. It regenerates
# comms/macro/econ_calendar_snapshots.jsonl (append-only PIT log) + econ_calendar_upcoming.json
# from whatever captures are committed and lands them on main. Full-regen is
# idempotent (re-running over the same captures reproduces the log byte-for-byte).
#
# The live sleeve reads the accrued snapshots (git-synced onto the live VM); the M1
# "clean joined dataset" gate replays them. See scripts/macro/econ_calendar_produce.py
# and docs/research/M1-econ-calendar-spine-2026-07-29.md.
#
# Deliberately NOT scheduled and NOT --emit-config:
#   - No schedule: without a fresh capture there is nothing new to land; the fetch
#     is the Claude-session step (this + a proposed scheduled producer session).
#   - No --emit-config: config/economic_calendar.yaml is a LIVE-PATH config (read by
#     the news-influence layer). A cadence must never silently mutate it — its
#     population stays an operator-gated, session-emitted change (Tier-3).
#
# HOW IT LANDS ON PROTECTED main: checks out with the BRANCH_PROTECTION_TOKEN PAT and
# hands off to ./.github/actions/commit-to-main (PAT-authored auto-merge PR — same as
# the macro-valuation-snapshot / macro-*-backfill cluster).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (re-land after new captures).
#   2. issues.opened w/ label `econ-calendar-produce-now` — Claude-driven (owner only).
#
# Tier-1: observability producer, no order path, no live-VM mutation, no secret.

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: econ-calendar-produce
  cancel-in-progress: false

jobs:
  produce:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'econ-calendar-produce-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: Regenerate PIT snapshots from committed captures
        id: produce
        run: |
          set -euo pipefail
          python scripts/macro/econ_calendar_produce.py \
            --json /tmp/econ_produce_summary.json
          {
            echo "summary<<EOF"
            cat /tmp/econ_produce_summary.json
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Land the regenerated PIT log on main (auto-merge PR)
        id: commit
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/macro/econ_calendar_snapshots.jsonl comms/macro/econ_calendar_upcoming.json
          message: "chore(m1): economic-calendar PIT snapshots"
          pr-title: "chore(m1): economic-calendar PIT snapshots (auto)"
          pr-body: "Regenerated point-in-time economic-calendar snapshots from committed Bigdata.com tearsheet captures (econ-calendar-produce). Data-only; auto-merge. Live-path config/economic_calendar.yaml is NOT touched here (operator-gated)."
          branch-prefix: automation/econ-calendar

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.produce.outputs.summary }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          PR: ${{ steps.commit.outputs.pr }}
        with:
          script: |
            const summary = process.env.SUMMARY || '(no summary captured)';
            const committed = process.env.COMMITTED || 'unknown';
            const pr = process.env.PR || '';
            const body = [
              '🗓️ **econ-calendar-produce** — regenerated PIT snapshots from committed captures.',
              '',
              '```json', summary.trim(), '```',
              '',
              committed === 'true' ? `landed via auto-merge PR: ${pr}` : 'no snapshot change this run.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
