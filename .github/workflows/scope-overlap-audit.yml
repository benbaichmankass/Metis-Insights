name: scope-overlap-audit

# NON-BLOCKING detector: does this PR touch a file another LIVE session has
# already declared on the coordination board?
#
# WHY THIS AND NOT A MERGE SERIALIZER (W3, and the plan was wrong)
#   W3 was planned as a merge serializer. The measurement refuted the premise.
#   Over 2026-08-30T19:13Z->2026-08-31T12:53Z, 39 merges landed on main — one
#   every 27.3 min, MEDIAN 15.9 min between merges from different sources.
#   Nothing was racing for the merge button, and `require-up-to-date` has been
#   off since 2026-08-10 so one merge does not invalidate another PR's checks.
#
#   The one real collision in that window: PR #10582 went `dirty` because
#   #10579 and #10580 landed under it — and those two merged 23 MINUTES APART,
#   already serial. Serialising merges would not have prevented it. The branch
#   was simply old, which no merge ordering fixes.
#
#   Nor was it under-declaration: the other session's 11:41Z START named
#   `docs/claude/OPEN-ITEMS.json` explicitly. The declaration existed and was
#   correct. What failed is that a declared scope never reaches a session that
#   is ALREADY RUNNING — the PreToolUse guard that would catch it is never
#   invoked on Claude Code on the web (BL-20260820-PROJECT-HOOKS-INERT-ON-WEB).
#
#   So this carries information that already exists to the one surface a
#   running session cannot miss: its own PR.
#
# IT GATES NOTHING, DELIBERATELY
#   A required check verifying the board protocol was considered and REJECTED
#   with the operator on 2026-08-20 (see merge-claim-audit.yml): presence-only,
#   so it would be cheaper to satisfy by posting a formulaic comment than by
#   doing the work — enforcing the ARTIFACT of the protocol, not the protocol.
#   The same reasoning holds here. This reports and stops.
#
# WHY pull_request_target AND NOT pull_request: it must post a comment, and a
# fork PR's GITHUB_TOKEN is read-only. It NEVER checks out or executes PR code
# — it reads the changed-file LIST and the board through the API, and runs one
# committed script from the BASE ref — so it carries none of the usual
# pull_request_target risk, which comes entirely from running untrusted content.
#
# THREE VERDICT STATES, NEVER COLLAPSED: overlap / no_overlap / could_not_check.
#
# FOUR ATTRIBUTION STATES, ALSO NEVER COLLAPSED (added 2026-09-02): mine /
# other_active / other_landed / unattributable. The first nine live fires of this
# detector all reported a session's OWN declaration back at it as "another
# session declared", because whose-START-is-this was decided by grepping the
# first backticked `claude/...` token out of the body — which, on the manager's
# own precise START, was a DIFFERENT session's branch quoted in prose. Sessions
# also open PRs from short-lived branches, so branch equality could never match a
# session's board declaration. Identity is now parsed in Python from a
# self-identification context, keyed on session id as well as branch, and graded
# for staleness. See scripts/ci/check_scope_overlap.py.
#
# It comments only on `overlap` and `could_not_check` — silent on the happy
# path, like merge-claim-audit, because a comment on every PR is noise. The
# verdict is ALWAYS written to the job summary, so "it ran and found nothing"
# stays distinguishable from "it did not run".
#
# ONE NOTE ON THE PR BODY, WHICH IS NOW AN INPUT (2026-09-02). `pr.body` is
# author-controlled, and a body quoting another session's `claude.ai/code/…`
# footer would make that session's START read as the author's own and be
# suppressed. It is stated rather than hidden (see `pr_session_ids`) and is not
# a privilege boundary: this workflow GATES NOTHING, so the only thing such a
# body can buy is a quieter advisory comment on the author's own PR. No secret,
# no checkout of PR code, and no order path is reachable from it either way.
#
# Tier-1: read-only, no VM, no order path, no secret beyond GITHUB_TOKEN.

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: scope-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The BASE ref, never the PR head — the script that runs must be the one
      # on main, not one the PR could have edited.
      #
      # base.REF (the branch tip), not base.SHA. `base.sha` is the base branch as
      # it stood when the PR was last synced, so it goes stale with the branch —
      # and on 2026-08-31 that made this job fail red on PR #10588, whose base
      # sha (dca4af6d) predates the very script this workflow runs. Both are
      # trusted content (neither is PR-authored), so the security property is
      # unchanged; the tip is simply the tool version we mean to run.
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # THREE STATES, and this workflow collapsed one of its own.
      # "the tool is not on the base ref" is `could_not_check` — WE DID NOT LOOK
      # — and it is emphatically not `no_overlap`. Hard-failing the job instead
      # (the #10588 red above) reports a TOOLING GAP as if it were a finding,
      # which is exactly how a non-blocking detector gets trained past and
      # ignored. Rare now that we take the base tip; still not collapsed.
      - name: Is the tool present on the base ref?
        id: tool
        run: |
          if [ -f scripts/ci/check_scope_overlap.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Self-test before trusting any verdict
        if: steps.tool.outputs.present == 'true'
        run: python3 scripts/ci/check_scope_overlap.py --self-test

      - name: Collect the changed files and the board's recent STARTs
        if: steps.tool.outputs.present == 'true'
        uses: actions/github-script@v7
        env:
          BOARD_ISSUE: '6927'
          LOOKBACK_HOURS: '24'
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            let changed = [], starts = [];
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100,
              });
              changed = files.map(f => f.filename);
            } catch (e) { core.warning(`changed-file read failed: ${e.message}`); }

            let dones = [], branchStates = {};
            try {
              const since = new Date(Date.now() - Number(process.env.LOOKBACK_HOURS) * 3600e3);
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: Number(process.env.BOARD_ISSUE),
                since: since.toISOString(), per_page: 100,
              });
              // A START declares scope. A QUESTION, a merge-slot claim and an
              // audit comment declare nothing, so they are not read. A DONE
              // declares nothing either, but it RETIRES a START, so it is now
              // collected separately rather than dropped.
              const isStart = b => /(?:▶️|:arrow_forward:)?\s*\*{0,2}START\*{0,2}\b/i.test((b || '').slice(0, 400));
              // ⚠️ ANCHORED to the first non-empty line, unlike isStart. A false
              // START only over-reports; a false DONE RETIRES a live declaration
              // and suppresses a real overlap. Mirrors `_DONE_RE` in the script,
              // where the asymmetry is unit-tested.
              const firstLine = b => ((b || '').split('\n').find(l => l.trim()) || '');
              const isDone  = b => /^[\s>#*_]*(?:✅|:white_check_mark:)?\s*\*{0,2}DONE\*{0,2}\b/i.test(firstLine(b));
              const row = c => ({ body: c.body, url: c.html_url, created_at: c.created_at });
              // ⚠️ NO `branchOf` HERE ANY MORE, AND THAT IS THE FIX.
              // It used to be `body.match(/`(claude\/[^`\s]+)`/)` — the first
              // backticked branch ANYWHERE in the body. On 2026-09-02 the
              // manager's own START named another session's branch in PROSE, to
              // complain about it, and this line stamped that branch onto the
              // manager's comment: a fabricated attribution to a named third
              // party. Identity is now parsed in Python, from a
              // self-identification context only, where it is unit-testable
              // against the real comment (see `parse_identity`).
              starts = comments.filter(c => isStart(c.body)).map(row);
              dones  = comments.filter(c => !isStart(c.body) && isDone(c.body)).map(row);
            } catch (e) { core.warning(`board read failed: ${e.message}`); }

            // Branch -> PR state, for the STALENESS axis. A declaration whose
            // branch has already merged is not a live collision, and on PR
            // #10731 ALL SEVEN declaring branches had merged — one of them 90
            // seconds before its own START was posted.
            //
            // Bounded to the 200 most-recently-updated PRs: the board lookback
            // is 24h, so a branch declared in it is all but certain to appear.
            // A branch NOT found stays absent, and the assessor reads an absent
            // branch as ACTIVE — unknown staleness must fail toward reporting.
            try {
              for (const page of [1, 2]) {
                const rs = await github.rest.pulls.list({
                  owner: context.repo.owner, repo: context.repo.repo,
                  state: 'all', sort: 'updated', direction: 'desc',
                  per_page: 100, page,
                });
                for (const p of rs.data) {
                  const ref = p.head && p.head.ref;
                  // First write wins: the list is newest-updated first, so this
                  // keeps the most recent PR for a reused branch.
                  if (ref && !(ref in branchStates)) {
                    branchStates[ref] = p.merged_at ? 'merged' : p.state;
                  }
                }
                if (rs.data.length < 100) break;
              }
            } catch (e) {
              core.warning(`PR-state read failed: ${e.message} — every declaration `
                           + `will be graded ACTIVE, which over-reports rather than `
                           + `silences`);
            }

            fs.writeFileSync('/tmp/overlap.json', JSON.stringify({
              pr: pr.number, my_branch: pr.head.ref, my_body: pr.body || '',
              changed_files: changed, starts, done_posts: dones,
              branch_states: branchStates,
            }));
            core.info(`collected ${changed.length} changed file(s), ${starts.length} START(s), `
                      + `${dones.length} DONE(s), ${Object.keys(branchStates).length} branch state(s)`);

      - name: Assess and report
        if: steps.tool.outputs.present == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const out = execFileSync('python3',
              ['scripts/ci/check_scope_overlap.py', '--input', '/tmp/overlap.json'],
              { encoding: 'utf8' });
            const v = JSON.parse(out);

            // ALWAYS recorded, so a silent happy path is still observable.
            await core.summary
              .addHeading('scope-overlap audit')
              .addRaw(`**state:** \`${v.state}\` · declared paths compared: ${v.parsed} · `
                      + `explicitly excluded: ${v.explicitly_excluded}\n\n`)
              .addRaw(`**attribution:** ${(v.hits||[]).length} live · `
                      + `${(v.landed_hits||[]).length} landed · `
                      + `${(v.unattributed_hits||[]).length} unattributable · `
                      + `${v.self_declared||0} your own (suppressed)\n\n`)
              .addRaw(v.markdown)
              .write();

            if (v.state === 'no_overlap') {
              core.info('no overlap — staying silent on the PR');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: v.markdown + '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });

      # The `could_not_check` half. Without this the tool-absent path would end
      # the job GREEN and SILENT, which is the worse failure: a clean bill of
      # health from a check that never ran. Says which state it is, and why.
      - name: Report could_not_check (tool absent on the base ref)
        if: steps.tool.outputs.present != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.payload.pull_request.base.ref;
            const md = [
              '### 🟡 scope-overlap audit — `could_not_check`',
              '',
              '`scripts/ci/check_scope_overlap.py` is not present on the base ref '
              + `\`${ref}\`, so this PR's changed files were **not compared** against `
              + 'any session\'s declared scope.',
              '',
              'This is **not** `no_overlap`. Nothing was checked. Read the '
              + 'coordination board (#6927) by hand before merging.',
            ].join('\n');
            await core.summary
              .addHeading('scope-overlap audit')
              .addRaw('**state:** `could_not_check` — tool absent on the base ref\n\n')
              .addRaw(md).write();
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: md + '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_',
            });
