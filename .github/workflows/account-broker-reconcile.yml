name: account-broker-reconcile

# The scheduled caller for `scripts/ops/account_broker_reconcile.py` —
# journal-vs-broker reconciliation for alpaca_live, breakout_1, and bybit_2
# (as far as its API allows).
#
# WHY THIS EXISTS. `journalTrust` (src/runtime/journal_trust.py) can only
# flag a divergence for an account with an entry in
# comms/broker_truth_ledger.json, and that ledger has exactly ONE entry
# (bybit_2, hand-populated, itself stale). alpaca_live and breakout_1
# disagreements between the journal and the broker were INVISIBLE — filed as
# OI-20260826-JOURNAL-TRUST-COVERS-ONE-ACCOUNT, operator-directed 2026-09-28
# ("Build automated reconcile (Recommended)") rather than left to a one-time
# hand export.
#
# ─────────────────────────────────────────────────────────────────────────────
# SAME DESIGN AS broker-bracket-reconcile.yml: RECORD EVERY RUN, SPEAK ONLY
# ON CHANGE. See that workflow's own header for the full reasoning (a
# desensitized alarm is CLAUDE.md's own named P1 bug). In short: a tracking
# issue whose body is rewritten every run (so "Last checked" going stale
# means the schedule itself died), and a comment only when the detector's
# `fingerprint()` (the graded STATE, not the exact P&L figures) moves.
#
# WHAT FAILS THE RUN. Only "we could not grade at all": a missing bearer, or
# a fetch that returned nothing for a REQUIRED source (journal positions;
# without those nothing can be graded). A single account/check reading
# `could_not_look` is a graded outcome (exit 3), not a run failure — the
# tracking issue is where it lives, same as ib_open_orders on the bracket
# reconciler.
#
# Tier 1: read-only. GET requests against the live VM's public HTTPS host
# (some diag-token-gated), no SSH, no order path, no VM mutation, no write to
# any bot surface. The only thing it writes is one GitHub issue.

on:
  schedule:
    # Every 6h at :10 — offset from broker-bracket-reconcile.yml's :40 so the
    # two scheduled reconcilers never compete for the same runner minute.
    - cron: '10 */6 * * *'
  workflow_dispatch:
    inputs:
      force_comment:
        description: "Post the record as a comment even if the fingerprint has not moved."
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

concurrency:
  group: account-broker-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Read journal + broker state
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
          BOT_API_BASE: https://ict-bot.duckdns.org
        run: |
          set -uo pipefail

          if [ -z "${DIAG_READ_TOKEN:-}" ]; then
            echo "::error::DIAG_READ_TOKEN is unset — broker order/position state could not be read. This is NOT a clean bill."
            exit 1
          fi

          # ── journal side (public Tier-1 routes) ──────────────────────────
          if ! curl -sS --fail --max-time 60 \
                 "${BOT_API_BASE}/api/bot/positions?include_paper=true" > /tmp/j_positions.json; then
            echo "::error::could not read /api/bot/positions — nothing was graded."
            exit 1
          fi
          if ! curl -sS --fail --max-time 60 \
                 "${BOT_API_BASE}/api/bot/trades/closed?account_id=bybit_2&limit=25" > /tmp/j_closed.json; then
            echo "::error::could not read /api/bot/trades/closed for bybit_2 — nothing was graded."
            exit 1
          fi
          if ! curl -sS --fail --max-time 60 \
                 "${BOT_API_BASE}/api/bot/prop/status?account_id=breakout_1" > /tmp/prop_status.json; then
            echo "::error::could not read /api/bot/prop/status for breakout_1 — nothing was graded."
            exit 1
          fi
          if ! curl -sS --fail --max-time 60 \
                 "${BOT_API_BASE}/api/bot/prop/fills?account_id=breakout_1&limit=200" > /tmp/prop_fills.json; then
            echo "::error::could not read /api/bot/prop/fills for breakout_1 — nothing was graded."
            exit 1
          fi

          # ── broker side (diag, token-gated). Each is best-effort: a failed
          # fetch here degrades that account to could_not_look inside the
          # detector rather than failing the whole run — mirrors
          # broker-bracket-reconcile.yml's ib_open_orders handling, except
          # THAT one route is required there; here alpaca/bybit/breakout are
          # three independent accounts and one venue outage must not blind
          # the reconcile on the other two. ─────────────────────────────────
          bash scripts/ops/diag_fetch.sh 'alpaca_open_orders?account_id=alpaca_live' \
            > /tmp/alpaca.json || echo '{"accounts":[]}' > /tmp/alpaca.json
          bash scripts/ops/diag_fetch.sh 'bybit_open_orders?account_id=bybit_2' \
            > /tmp/bybit.json || echo '{"accounts":[]}' > /tmp/bybit.json
          bash scripts/ops/diag_fetch.sh 'bybit_wallet_truth?account_id=bybit_2&days=90' \
            > /tmp/bybit_wt.json || echo '{"accounts":[]}' > /tmp/bybit_wt.json
          # Raw trades rows (setup_type/notes) — /trades/closed carries
          # neither, so this is how a NULL-pnl intent_reduce leg (pnl
          # deferred by design) is told apart from a real unknown. A failed
          # read writes nothing, and the detector then reports every NULL-pnl
          # row as could_not_look (reduce_leg_read: unavailable).
          bash scripts/ops/diag_fetch.sh 'journal?table=trades&limit=1000' \
            > /tmp/j_trades_raw.json || rm -f /tmp/j_trades_raw.json

          for f in /tmp/j_positions.json /tmp/j_closed.json /tmp/prop_status.json /tmp/prop_fills.json; do
            if [ ! -s "$f" ]; then
              echo "::error::${f} is empty — refusing to grade an empty population."
              exit 1
            fi
          done
          echo "fetched: $(for f in /tmp/j_positions.json /tmp/j_closed.json /tmp/alpaca.json /tmp/bybit.json /tmp/bybit_wt.json /tmp/prop_status.json /tmp/prop_fills.json; do echo -n "$(basename "$f")=$(wc -c <"$f")B "; done)"

      - name: Reconcile journal vs broker
        id: reconcile
        run: |
          set -uo pipefail
          RAW_ARG=""
          if [ -s /tmp/j_trades_raw.json ]; then
            RAW_ARG="--journal-trades-raw-json /tmp/j_trades_raw.json"
          fi
          ARGS="--journal-positions-json /tmp/j_positions.json \
                --journal-closed-json /tmp/j_closed.json \
                $RAW_ARG \
                --alpaca-broker-json /tmp/alpaca.json \
                --bybit-broker-json /tmp/bybit.json \
                --bybit-wallet-truth-json /tmp/bybit_wt.json \
                --prop-status-json /tmp/prop_status.json \
                --prop-fills-json /tmp/prop_fills.json"

          set +e
          python3 scripts/ops/account_broker_reconcile.py $ARGS            > /tmp/render.txt 2>&1; rc=$?
          python3 scripts/ops/account_broker_reconcile.py $ARGS --fingerprint > /tmp/fp.txt 2>/dev/null
          set -e

          cat /tmp/render.txt

          # 0 clean · 1 findings · 3 an account/check could not be read.
          # Only 2 (parse/usage) means nothing was graded.
          case "$rc" in
            0|1|3) : ;;
            *) echo "::error::detector exited ${rc} — nothing was graded."; exit 1 ;;
          esac

          {
            echo "## account-broker-reconcile"
            echo '```'
            cat /tmp/render.txt
            echo '```'
            echo "_detector exit ${rc} — 0 clean · 1 findings · 3 an account/check could not be read._"
          } >> "$GITHUB_STEP_SUMMARY"

          DIGEST="$(head -1 /tmp/fp.txt)"
          case "$DIGEST" in
            [0-9a-f][0-9a-f]*) : ;;
            *) echo "::error::fingerprint did not produce a digest (got '${DIGEST}') — refusing to write a meaningless tracking record."; exit 1 ;;
          esac

          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Update the tracking record, comment only on change
        uses: actions/github-script@v7
        env:
          RC: ${{ steps.reconcile.outputs.rc }}
          DIGEST: ${{ steps.reconcile.outputs.digest }}
          FORCE: ${{ inputs.force_comment }}
        with:
          script: |
            const fs = require('fs');
            const LABEL  = 'account-broker-reconcile';
            const TITLE  = '🧾 Account broker reconcile — alpaca_live / breakout_1 / bybit_2';
            const digest = process.env.DIGEST;
            const rc     = process.env.RC;
            const force  = String(process.env.FORCE).toLowerCase() === 'true';
            const _raw = fs.readFileSync('/tmp/render.txt', 'utf8');
            const LIMIT = 20000;
            const render = _raw.length > LIMIT
              ? _raw.slice(0, LIMIT) + `\n\n... TRUNCATED at ${LIMIT} of ${_raw.length} chars — see the run log for the full report.`
              : _raw;
            const state  = fs.readFileSync('/tmp/fp.txt', 'utf8').split('\n').slice(1).join('\n').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now    = new Date().toISOString();

            const body = [
              `<!-- account-broker-reconcile-fingerprint: ${digest} -->`,
              `**Last checked: ${now}** · [run](${runUrl}) · detector exit \`${rc}\``,
              ``,
              `> A stale *Last checked* means the **schedule itself** has died — that is`,
              `> the first thing to read here. Silence from this issue means "the same set`,
              `> of problems as last time", **never** "no problems": the standing findings`,
              `> below are re-measured every run and re-stated in full.`,
              ``,
              `\`\`\``,
              render.trim(),
              `\`\`\``,
              ``,
              `<details><summary>graded-state fingerprint (\`${digest}\`) — the preimage</summary>`,
              ``,
              `\`\`\``,
              state,
              `\`\`\``,
              `</details>`,
              ``,
              `---`,
              `Detector: \`scripts/ops/account_broker_reconcile.py\` · caller:`,
              `\`.github/workflows/account-broker-reconcile.yml\`. Read-only; repairs nothing.`,
              `Scope limits (alpaca_live realized P&L not exposed by any broker read in this`,
              `codebase; breakout_1 realized P&L is a DAILY figure, not last-N-trade; bybit_2`,
              `carries the known SUB-subaccount ledger gap from PI-20260924-ZROYCDY4-0001) are`,
              `stated in the render above, not hidden.`,
            ].join('\n');

            const found = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: LABEL, per_page: 10,
            });
            const issue = found.data.find(i => !i.pull_request);

            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, body, labels: [LABEL],
              });
              core.notice(`Created tracking issue #${created.data.number} (baseline ${digest}).`);
              return;
            }

            const prev = (issue.body || '').match(/<!-- account-broker-reconcile-fingerprint: (\w+) -->/);
            const prevDigest = prev ? prev[1] : null;

            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body,
            });

            if (prevDigest === digest && !force) {
              core.notice(`Unchanged (${digest}) — record refreshed on #${issue.number}, staying silent.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: [
                `### ⚠️ Graded state CHANGED — \`${prevDigest || 'none'}\` → \`${digest}\``,
                ``,
                `Detector exit \`${rc}\` · [run](${runUrl}) · ${now}`,
                ``,
                `\`\`\``,
                render.trim(),
                `\`\`\``,
                ``,
                `The issue body above now carries the current state. A change here means the`,
                `**set** of problems moved — a finding appeared or cleared, or an account's`,
                `readability changed on one of the three checks (positions / protection / P&L).`,
                ``,
                `---`,
                `_Generated by [Claude Code](https://claude.ai/code)_`,
              ].join('\n'),
            });
            core.notice(`Fingerprint moved ${prevDigest} -> ${digest}; commented on #${issue.number}.`);
