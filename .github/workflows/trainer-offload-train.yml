name: trainer-offload-train

# rec #3 (roadmap-toolbox-assessment-2026-07-29) — the FREE-RUNNER OFFLOAD for
# OOM-prone ML manifests. The trainer VM is 1 OCPU / 6 GB and OOM-quarantines the
# heavy manifests (btc-regime-5m-lgbm-flow-v1 wedged it 18.7h in D-state,
# BL-20260717-TRAINER-SINGLE-MANIFEST-OOM). A standard GitHub-hosted runner is
# 4 vCPU / 16 GB / $0 — ~2.7x the RAM — so the manifest that OOMs at 6 GB trains
# here. The gap was never compute; it was that the pipeline runs ON the trainer.
# This is the sibling of research-{panel,exit-head,symbol-p0}-build.yml: same
# off-VM economics, fetch the feed from Binance's public archive (keyless,
# globally reachable — Bybit geoblocks US GH-runners), build the ML dataset
# families from the CSV, train the manifest, upload the model + metrics.
#
# The CSV -> `market_raw` family -> `market_features` -> `ml train` path:
# fetch_backtest_candles Binance-vision feed + the `csv` market_raw adapter via
# the `k=v` adapter-kwarg convention (`adapter=csv csv_path=<csv>`). The first
# run (#7910) pinned two csv-path mismatches, now fixed + guarded
# (BL-20260729-OFFLOAD-CSV-ADAPTER): (a) the adapter kwarg is `csv_path`, not
# `path`, and it now coerces the CLI's str value to Path; (b) the feed's
# `timestamp` header is renamed to the adapter's required `ts` after fetch. The
# build step now hard-fails on a 0-row market_raw/market_features so a silent
# empty build can never again report "success".
#
# Triggers:
#   1. workflow_dispatch — operator clicks "Run workflow"
#   2. issues.opened with label `trainer-offload-train-request` (owner-guarded)
#
# Issue body (optional, all keys have defaults for the flow head):
#   manifest: btc-regime-5m-lgbm-flow-v1
#   symbol: BTCUSDT
#   timeframe: 5m
#   days: 2200
#
# R3 — THE OFFLOAD LOOP IS NOW CLOSED ON THIS SIDE (2026-08-27).
#
# Until now this workflow trained, `--no-register`ed, uploaded an artifact and
# pushed NOTHING — the one confirmed instance of the defect
# docs/research/RESEARCH-WORKFLOW-ARCHITECTURE-2026-08-27.md files as R2:
#
#     A job that exits 0 having landed nothing is a FAILED job.
#
# The `publish` input (default FALSE) adds a second job that commits the trained
# model into the tracked `ml/offload-inbox/`, from which the trainer's existing
# 15-minute `trainer_git_sync.sh` force-checkout puts it on disk. ⚠️ WITH
# `publish=false` THIS WORKFLOW BEHAVES EXACTLY AS BEFORE — the publish job does
# not run at all, so the default path is byte-for-byte unchanged.
#
# ⚠️ NOTHING HERE REGISTERS A MODEL, AND `--no-register` STAYS. The trainer-side
# drain (scripts/ml/offload/drain_inbox.py) re-registers ON THE TRAINER, which is
# what makes the registered path resolve there BY CONSTRUCTION — see
# BL-20260827-R3-OFFLOAD-LANDING-HAS-TWO-MEASURED-BLOCKERS Blocker 1, where a
# copied entry carries /home/runner/work/... and is registered-and-unloadable.
# That drain ships UNARMED and its unit installs disabled; a runner-trained model
# joining the live shadow fleet is Tier-2 and gets an explicit operator OK.
#
# WHY publish DEFAULTS TO FALSE. Operator decision, 2026-08-27: commit the
# artifact only for runs that update a registry entry, never every run. Measured:
# model_state.json is p50 1.34 MB (n=5,419) and the trainer turns over ~52
# runs/day, i.e. ~70 MB/day of PERMANENT git history. A runner cannot check the
# trainer's registry (it is untracked — `git ls-files ml/registry-store` -> 0
# against 96 on-disk entries), so the bound is this opt-in, not a lookup.
#
# Safety: READS the repo + fetches PUBLIC candles + trains on historical data.
# It does NOT deploy, touch config/, or register into any live registry. Only the
# `publish` job may write, and only to the inbox path. NOTE the flow head
# additionally needs the trainer-resident `market_microstructure` capture for its
# full-history shard — on public data alone its ofi/vpin cols are 0 pre-capture.

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest id under ml/configs/ (no .yaml)"
        default: "btc-regime-5m-lgbm-flow-v1"
      symbol:
        description: "Symbol to fetch + build"
        default: "BTCUSDT"
      timeframe:
        description: "Dataset timeframe label"
        default: "5m"
      days:
        description: "Trailing days of candles to fetch (~2200 = ~6y of 5m)"
        default: "2200"
      publish:
        description: "Commit the trained model into ml/offload-inbox/ (default false — see the header)"
        type: boolean
        default: false
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: trainer-offload-train-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  train:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'trainer-offload-train-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      # env vars do not cross jobs; these carry the publish decision + the run
      # dir the CLI reported, so the publish job never has to GLOB for a run.
      publish: ${{ steps.publish_gate.outputs.publish }}
      run_dir: ${{ steps.publish_gate.outputs.run_dir }}
      model_id: ${{ steps.publish_gate.outputs.model_id }}
      symbol: ${{ steps.publish_gate.outputs.symbol }}
      timeframe: ${{ steps.publish_gate.outputs.timeframe }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue body
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          get() { printf '%s' "${ISSUE_BODY}" | grep -m1 -i "^$1:" | awk '{print $2}' || true; }
          MANIFEST=$(get manifest);   [ -z "${MANIFEST}" ] && MANIFEST="btc-regime-5m-lgbm-flow-v1"
          SYMBOL=$(get symbol);       [ -z "${SYMBOL}" ] && SYMBOL="BTCUSDT"
          TIMEFRAME=$(get timeframe); [ -z "${TIMEFRAME}" ] && TIMEFRAME="5m"
          DAYS=$(get days);           [ -z "${DAYS}" ] && DAYS="2200"
          PUBLISH=$(get publish);     [ -z "${PUBLISH}" ] && PUBLISH="false"
          # sanity-validate so a malformed body can't inject args
          printf '%s' "${MANIFEST}" | grep -qE '^[a-z0-9][a-z0-9._-]*$' || MANIFEST="btc-regime-5m-lgbm-flow-v1"
          printf '%s' "${SYMBOL}" | grep -qE '^[A-Z0-9]+$' || SYMBOL="BTCUSDT"
          printf '%s' "${TIMEFRAME}" | grep -qE '^[0-9]+[mhdMHD]$' || TIMEFRAME="5m"
          printf '%s' "${DAYS}" | grep -qE '^[0-9]+$' || DAYS="2200"
          # Anything that is not exactly `true` is false. A malformed value must
          # never resolve to "publish" — the permissive direction here is the one
          # that writes to permanent git history.
          [ "${PUBLISH}" = "true" ] || PUBLISH="false"
          { echo "of_manifest=${MANIFEST}"; echo "of_symbol=${SYMBOL}";
            echo "of_timeframe=${TIMEFRAME}"; echo "of_days=${DAYS}";
            echo "of_publish=${PUBLISH}"; } >> "$GITHUB_ENV"

      - name: Set params from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          { echo "of_manifest=${{ inputs.manifest }}"; echo "of_symbol=${{ inputs.symbol }}";
            echo "of_timeframe=${{ inputs.timeframe }}"; echo "of_days=${{ inputs.days }}";
            echo "of_publish=${{ inputs.publish }}"; } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ML deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml requests lightgbm scikit-learn scipy

      - name: Guard — manifest exists
        run: |
          set -euo pipefail
          test -f "ml/configs/${of_manifest}.yaml" || { echo "::error::manifest ml/configs/${of_manifest}.yaml not found"; exit 1; }
          echo "manifest: ml/configs/${of_manifest}.yaml"

      - name: Fetch feed (Binance public archive — dodges the Bybit geoblock)
        run: |
          set -euo pipefail
          mkdir -p data datasets-out artifacts/offload
          case "${of_timeframe}" in
            *m) INT="${of_timeframe%m}" ;;
            1h) INT=60 ;; 2h) INT=120 ;; 4h) INT=240 ;;
            1d|1D) INT=D ;; *) INT="${of_timeframe}" ;;
          esac
          echo "timeframe=${of_timeframe} -> interval=${INT}"
          python scripts/ops/fetch_backtest_candles.py \
            --symbol "${of_symbol}" --interval "${INT}" --days "${of_days}" \
            --output "data/offload_feed.csv"
          # fetch_backtest_candles emits a `timestamp` header (what the backtest
          # harnesses read); the `market_raw` csv adapter requires a `ts` column
          # (BL-20260729-OFFLOAD-CSV-ADAPTER). Rename the header cell only.
          sed -i '1s/^timestamp,/ts,/' data/offload_feed.csv
          echo "feed rows: $(wc -l < data/offload_feed.csv)"; head -2 data/offload_feed.csv

      - name: Build ML dataset families from the CSV
        run: |
          set -euo pipefail
          DR=datasets-out; VER=v002
          echo "=== market_raw (csv adapter) ==="
          # csv adapter kwarg is `csv_path` (the CLI k=v parser passes str; the
          # adapter coerces to Path). BL-20260729-OFFLOAD-CSV-ADAPTER.
          python -m ml build-dataset market_raw \
            --output-dir "$DR" --version "$VER" --source "data/offload_feed.csv" \
            --symbol-scope "${of_symbol}" --timeframe "${of_timeframe}" --overwrite \
            "adapter=csv" "csv_path=data/offload_feed.csv" "symbol=${of_symbol}" "timeframe=${of_timeframe}" \
            2>&1 | tail -20
          RAW="$DR/market_raw/${of_symbol}/${of_timeframe}/$VER"
          echo "raw dir: $RAW"; ls -la "$RAW" 2>&1 | head
          raw_rows=$(wc -l < "$RAW/data.jsonl")
          echo "market_raw rows: $raw_rows"
          if [ "$raw_rows" -lt 1 ]; then
            echo "::error::market_raw produced 0 rows — csv build broken (adapter kwarg / header mismatch)"; exit 1
          fi
          echo "=== market_features ==="
          python -m ml build-dataset market_features \
            --output-dir "$DR" --version "$VER" --source "$RAW" \
            --symbol-scope "${of_symbol}" --timeframe "${of_timeframe}" --overwrite \
            "market_raw_path=$RAW" "vol_window_n=20" "forward_window_m=5" \
            "vol_threshold=0.005" "trend_threshold=0.005" "n_vol_buckets=3" \
            2>&1 | tail -20
          FEAT="$DR/market_features/${of_symbol}/${of_timeframe}/$VER"
          echo "features dir: $FEAT"; ls -la "$FEAT" 2>&1 | head
          feat_rows=$(wc -l < "$FEAT/data.jsonl")
          echo "market_features rows: $feat_rows"
          if [ "$feat_rows" -lt 1 ]; then
            echo "::error::market_features produced 0 rows — feature build broken"; exit 1
          fi

      - name: Train the manifest on the 16 GB runner (--no-register)
        run: |
          set +e
          echo "=== free -h before ==="; free -h
          /usr/bin/time -v python -m ml train "ml/configs/${of_manifest}.yaml" \
            --datasets-root datasets-out \
            --experiments-root ml/experiments-runs \
            --registry-root /tmp/offload-registry \
            --no-register \
            > artifacts/offload/train_out.json 2> artifacts/offload/train_time.txt
          echo "rc=$?"
          echo "=== train stdout (metrics JSON) ==="; cat artifacts/offload/train_out.json | tail -40
          echo "=== peak RSS (proves the 16 GB headroom) ==="; grep -i 'Maximum resident' artifacts/offload/train_time.txt || true

      - name: Summarize verdict
        run: |
          set +e
          python - <<'PYEOF' | tee artifacts/offload/VERDICT.md
          import json, os, re
          man = os.environ.get("of_manifest", "?")
          def load_train_json(p):
              # `ml train`'s stdout is a single (pretty-printed, multi-line) JSON
              # object redirected to this file. Parse the whole file; if a stray
              # log line leaked to stdout, fall back to the outermost {...} span.
              try:
                  txt = open(p).read().strip()
              except Exception:
                  return {}
              if not txt:
                  return {}
              try:
                  return json.loads(txt)
              except Exception:
                  pass
              i, j = txt.find("{"), txt.rfind("}")
              if 0 <= i < j:
                  try:
                      return json.loads(txt[i:j + 1])
                  except Exception:
                      pass
              return {}
          r = load_train_json("artifacts/offload/train_out.json")
          peak = "?"
          try:
              t = open("artifacts/offload/train_time.txt").read()
              m = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", t)
              if m: peak = f"{int(m.group(1))/1024/1024:.2f} GB"
          except Exception: pass
          L = [f"# trainer-offload-train — {man}", ""]
          L.append(f"- **peak RSS: {peak}** (the 6 GB trainer OOMs; a 16 GB runner has the headroom)")
          m_raw = r.get("metrics")
          # `ml train` nests eval metrics under "metrics"; a skip/error envelope
          # has none. Accept only a non-empty dict (a bare bool like
          # "skipped": true must NOT read as a metric — bool is an int subclass).
          metrics = m_raw if isinstance(m_raw, dict) and m_raw else {}
          if metrics:
              L.append(f"- registered: {r.get('registered')} · model_id: {r.get('model_id')}")
              L.append("- metrics:")
              for k in ("accuracy", "macro_f1", "f1_volatile", "support_volatile", "n_eval"):
                  if k in metrics: L.append(f"  - {k}: {metrics[k]}")
          else:
              reason = r.get("reason") or r.get("detail") or "unknown"
              L.append(f"- ⚠️ no metrics — train produced no eval metrics (reason: {reason}). "
                       "Read train_out.json / train_time.txt in the artifact.")
          print("\n".join(L))
          PYEOF

      # ----------------------------------------------------------- R3 publish
      # `ml train` prints {"experiment_dir": ..., "model_id": ...} on stdout
      # (ml/cli.py:91), so the run dir is READ, never guessed by globbing
      # experiments-runs for the newest mtime — a glob would silently pick a
      # different run on a re-dispatch and publish the wrong model.
      #
      # A SKIP (exit 78: dataset absent / 0 rows) prints no experiment_dir. That
      # is a real outcome, not a failure, and it must not publish: `publish` is
      # forced to false rather than letting a missing dir fail the job.
      - name: Decide whether there is anything to publish
        id: publish_gate
        if: always()
        run: |
          set -euo pipefail
          RUN_DIR=$(python3 -c "
          import json,sys
          try: d=json.load(open('artifacts/offload/train_out.json'))
          except Exception: d={}
          print(d.get('experiment_dir') or '')
          " 2>/dev/null || true)
          WANT="${of_publish:-false}"
          PUBLISH="false"
          if [ "$WANT" = "true" ] && [ -n "$RUN_DIR" ] && [ -d "$RUN_DIR" ]; then
            PUBLISH="true"
          elif [ "$WANT" = "true" ]; then
            echo "::warning::publish was requested but the train step produced no "\
                 "experiment_dir (a skip or a failure) — publishing nothing."
          fi
          echo "publish=${PUBLISH}"   >> "$GITHUB_OUTPUT"
          echo "run_dir=${RUN_DIR}"   >> "$GITHUB_OUTPUT"
          echo "model_id=${of_manifest}" >> "$GITHUB_OUTPUT"
          echo "symbol=${of_symbol}"     >> "$GITHUB_OUTPUT"
          echo "timeframe=${of_timeframe}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH} run_dir=${RUN_DIR}"

      # The run dir hops to the publish job as an artifact. ⚠️ THIS IS NOT THE
      # REJECTED "fetch-from-artifact" DESIGN. That one was declined because a
      # GitHub artifact EXPIRES at 30-90 days while a registry entry does not, so
      # a model would outlive its artifact and become registered-and-unloadable
      # on a delay. This hop lasts MINUTES, between two jobs of one run; the
      # DURABLE copy is the git commit the publish job makes.
      - name: Upload the run dir for the publish job
        if: steps.publish_gate.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: offload-run-${{ github.run_id }}
          path: ${{ steps.publish_gate.outputs.run_dir }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trainer-offload-${{ github.run_id }}
          path: |
            artifacts/offload/train_out.json
            artifacts/offload/train_time.txt
            artifacts/offload/VERDICT.md
          retention-days: 14
          if-no-files-found: warn

      - name: Comment verdict on issue
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '_(verdict not produced)_';
            try { body = fs.readFileSync('artifacts/offload/VERDICT.md', 'utf8'); } catch (e) {}
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000) + footer,
            });

      - name: Comment failure/cancellation on issue
        if: github.event_name == 'issues' && (failure() || cancelled())
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const state = process.env.JOB_STATUS === 'cancelled' ? 'cancelled' : 'failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔴 **trainer-offload-train ${state}.**\nRun: ${runUrl}\n\n`
                + `This run produced **no verdict** — if you were waiting on it, it is **dead, not still running**. Read the run log, fix the cause, and re-fire the request. A cancel is usually the job time budget (\`timeout-minutes: 330\`) or a manual cancel.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
            });

  # ------------------------------------------------------------------ publish
  # R3's transport half. Commits the trained model into the tracked
  # `ml/offload-inbox/`, which the trainer's 15-minute `trainer_git_sync.sh`
  # force-checkout (`git checkout --force -B main origin/main`) puts on its disk.
  # The trainer-side drain then re-registers it THERE — see
  # scripts/ml/offload/drain_inbox.py. That drain is UNARMED and its unit ships
  # disabled; this job is the transport and nothing more.
  publish:
    needs: train
    if: needs.train.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The ONLY job here that writes, kept off the workflow's top-level
      # `contents: read` so the train job stays read-only — the same split
      # e35-bracket-sweep.yml uses for its corpus job.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: offload-run-${{ github.run_id }}
          path: offload-run

      - name: Emit the run into the offload inbox
        id: emit
        env:
          MODEL_ID: ${{ needs.train.outputs.model_id }}
          RUN_DIR: ${{ needs.train.outputs.run_dir }}
          SYMBOL: ${{ needs.train.outputs.symbol }}
          TIMEFRAME: ${{ needs.train.outputs.timeframe }}
        run: |
          set -euo pipefail
          # download-artifact flattens to the artifact root, so the run_id — which
          # is the run dir's BASENAME and the drain's idempotency key — is not in
          # the downloaded path. Restore it from the dir the train job reported
          # rather than inventing a new one, or a re-publish would land as a
          # second run of the same model.
          RUN_ID="$(basename "${RUN_DIR}")"
          STAGED="staged/${MODEL_ID}/${RUN_ID}"
          mkdir -p "$(dirname "${STAGED}")"
          mv offload-run "${STAGED}"
          # --require-publishable: reaching this job means the train step DID
          # produce a run, so a refusal here is a genuine fault, not the ordinary
          # "nothing to publish" the gate already filtered out.
          python3 scripts/ml/offload/emit_bundle.py \
            --run-dir "${STAGED}" \
            --inbox ml/offload-inbox \
            --source trainer-offload-train \
            --code-revision "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --symbol "${SYMBOL}" \
            --timeframe "${TIMEFRAME}" \
            --dataset-version v002 \
            --emitted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --require-publishable | tee emit.out
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Commit + push the inbox drop
        id: push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ steps.emit.outputs.run_id }}
          MODEL_ID: ${{ needs.train.outputs.model_id }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/offload-inbox
          if git diff --cached --quiet; then
            echo "::error::nothing staged — emit_bundle reported success but wrote no tracked file. Check that ml/offload-inbox is not gitignored."
            exit 1
          fi
          # WHERE IT LANDS. A dispatch on the default branch cannot push there:
          # branch protection declines a bare commit it cannot give required
          # checks to (GH006). That is STRUCTURAL, so retarget — never retry
          # (BL-20260812-SWEEP-CORPUS-CANNOT-PUSH-TO-MAIN).
          TARGET="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          RETARGETED=0
          if [ "$TARGET" = "${DEFAULT_BRANCH:-main}" ]; then
            TARGET="claude/offload-inbox"
            RETARGETED=1
            echo "::notice::dispatched on ${DEFAULT_BRANCH:-main} (protected) — routing the drop to '$TARGET' to preserve it."
          fi
          {
            echo "offload: ${MODEL_ID} @ ${RUN_ID}"
            echo
            cat emit.out
            echo
            echo "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          } > .commitmsg
          git commit -F .commitmsg
          # Unlike the protection refusal above, losing a race with a concurrent
          # dispatch IS retryable. The inbox is append-only per (model_id, run_id)
          # and emit_bundle is idempotent, so replaying the append onto a fresh
          # tip is safe — that is why this re-emits rather than rebasing, which
          # would conflict on every concurrent append to index.jsonl.
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${TARGET}"; then
              echo "pushed to ${TARGET} on attempt ${attempt}"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::could not push the drop to ${TARGET} after 3 attempts — the model is in this run's artifact and is NOT lost, but nothing has recorded it"
              exit 1
            fi
            git fetch origin "${TARGET}" || true
            git reset --hard "origin/${TARGET}" || true
            python3 scripts/ml/offload/emit_bundle.py \
              --run-dir "staged/${MODEL_ID}/${RUN_ID}" \
              --inbox ml/offload-inbox --code-revision "${GITHUB_SHA}" \
              --emitted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null
            git add ml/offload-inbox
            git diff --cached --quiet || git commit -F .commitmsg
            sleep $((attempt * 5))
          done
          if [ "$RETARGETED" = "1" ]; then
            # A push made with GITHUB_TOKEN starts NO workflows (the recursion
            # guard), so this job cannot open or green its own PR
            # (BL-20260813-CORPUS-RETARGET-CANNOT-OPEN-ITS-OWN-PR). A loud,
            # accurate hand-off beats a claim that is not true.
            echo "::notice::the drop is on '${TARGET}'. A HUMAN OR A SESSION must open the PR — this job cannot, and no workflow will fire from its push."
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------------- landing
      # R2: a run is not done until its rows are READABLE from the shared ref.
      # ⚠️ --store names the path the step above literally `git add`s, not a path
      # taken from prose — the mistake assert_rows_landed.py's own docstring
      # records from its first wiring.
      #
      # `pending_merge` (exit 1) is the EXPECTED verdict for a default-branch
      # dispatch, because the push retargets. That is not a broken run; it means
      # the merge is owed. Reported under its own name so the fix is obvious.
      - name: assert the drop landed
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET: ${{ steps.push.outputs.target }}
          RUN_ID: ${{ steps.emit.outputs.run_id }}
        run: |
          git fetch origin "${DEFAULT_BRANCH:-main}" "${TARGET}" 2>/dev/null || true
          python3 scripts/ci/assert_rows_landed.py \
            --store ml/offload-inbox/index.jsonl \
            --ref "origin/${DEFAULT_BRANCH:-main}" \
            --pushed-ref "origin/${TARGET}" \
            --field run_id --contains "${RUN_ID}" --min-rows 1

      - name: Comment the publish outcome on the issue
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          MODEL_ID: ${{ needs.train.outputs.model_id }}
          RUN_ID: ${{ steps.emit.outputs.run_id }}
          TARGET: ${{ steps.push.outputs.target }}
        with:
          script: |
            const { JOB_STATUS, MODEL_ID, RUN_ID, TARGET } = process.env;
            const ok = JOB_STATUS === 'success';
            const body = [
              `${ok ? '📦' : '🔴'} **offload publish ${JOB_STATUS}** — \`${MODEL_ID}\` @ \`${RUN_ID}\``,
              '',
              ok
                ? `The model is committed to \`ml/offload-inbox/\` on \`${TARGET}\`. It is **not registered anywhere yet**: the trainer-side drain is UNARMED, and arming it is Tier-2.`
                : `Nothing durable was recorded. The model is still in this run's artifact (14d). Read the run log — do not assume it landed.`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
