name: board-post

# Git-push-triggered coordination-board relay — the MCP-independent path for
# posting to the live Claude Coordination Board (resolved from
# docs/claude/board-pointer.json on the DEFAULT branch — never hardcoded).
#
# WHY THIS EXISTS. `docs/CLAUDE-RULES-CANONICAL.md` § "Multi-session coordination"
# makes posting a `▶️ START` comment to the board MANDATORY *before a session's first
# substantive tool call*. But a PM-side session's GitHub MCP is intermittently
# READ-ONLY — `add_issue_comment` returns 403 "Resource not accessible by
# integration" (the same 403 `claude-pr-automerge.yml`'s header documents for PR
# create/merge, and it names issue comments explicitly). Two relays already exist
# for that 403 — `pr-opener.yml` (open a PR) and `claude-pr-automerge.yml` (merge
# one) — and there was NO relay for the board comment, which is the one the rules
# call mandatory. So a read-only session was structurally unable to comply with a
# binding rule; its only options were to skip the board or to stop. This closes
# that gap. Filed as BL-20260820-NO-BOARD-POST-RELAY-FOR-READONLY-MCP.
#
# Contract:
#   * Drop a markdown file at `automation/board-posts/<name>.md` and push it to a
#     `claude/**` branch. Its ENTIRE contents become one comment on the board.
#   * The runner posts it, writes the resulting comment URL (or the error) to
#     `automation/board-results/<name>.txt`, and commits that result back with
#     [skip ci] (no re-trigger loop).
#   * Read the result back with:
#       git fetch origin <branch>
#       git show origin/<branch>:automation/board-results/<name>.txt
#
#   ⚠️ THE REQUEST FILE IS DELIBERATELY LEFT IN PLACE, AND ITS SURVIVAL IS NOT
#   EVIDENCE OF A FAILED POST. This header read "removes the request" until
#   2026-09-03, contradicting the code nine lines below it -- see the block at
#   "An earlier version `git rm`'d each request once posted", which records why
#   removing it was taken OUT: the removal made the results commit touch
#   `automation/board-posts/**`, this workflow's own trigger path.
#
#   That stale sentence had a cost, which is why this note replaces it rather
#   than just deleting it. A session reaches this relay ONLY because its MCP
#   `add_issue_comment` 403'd, so it cannot read the board back through the MCP
#   and must verify from the branch -- following the old contract, it tests
#   "is the request file gone?" and reads STILL PRESENT as "my post failed".
#   Measured 2026-09-03: request present, result file holding a bare comment URL,
#   run exited 0 -- a SUCCESSFUL post that the documented check graded a failure.
#   The consequence runs the wrong way for a relay whose whole premise is that a
#   failed post must be loud: the session either re-posts (duplicating on the board)
#   or reports its own successful claim as failed.
#
#   VERIFY A POST LIKE THIS, never by the request file:
#     * SUCCESS -> `automation/board-results/<name>.txt` holds a bare comment URL
#       and the run exits 0.
#     * FAILURE -> that same file starts with `FAILED:` and the run exits 1.
#   Filed as BL-20260903-BOARD-POST-HEADER-CLAIMS-IT-REMOVES-THE-REQUEST-AND-THE-CODE-DELIBERATELY-DOES-NOT.
#
# DELIBERATELY STRICTER THAN `pr-opener.yml`, WHICH IT IS OTHERWISE MODELLED ON:
#   1. An EMPTY or whitespace-only body is REFUSED, not posted. A blank board
#      comment is a vacuous post that reads as compliance — the "green is not
#      evidence" shape.
#   2. A failed post FAILS THE RUN (exit 1). `pr-opener.yml` records `FAILED:` in
#      the result file and still exits 0; for a PR that is recoverable because the
#      absent PR is self-evident, but a session that believes it claimed the board
#      and did not is invisible to every other session AND to itself. The failure
#      must be loud. `claude-run-failure-alert.yml` then pings the operator.
#
# Blast radius: posts issue COMMENTS on exactly one issue — the one the DEFAULT
# branch's `docs/claude/board-pointer.json` names — and commits result files. It
# cannot open, close, label or edit an issue, cannot touch a PR, and cannot reach
# `src/`, `config/`, a unit file, or either VM.
# The issue number is NOT read from the request, on purpose — a caller-supplied
# number would make this a general issue-commenting primitive. Resolving it from
# the DEFAULT branch (not the pushed branch) keeps that true now that the number
# lives in a file: a `claude/**` branch can edit its own copy of the pointer and
# it will not be consulted.

on:
  push:
    paths: ['automation/board-posts/**']

permissions:
  contents: write
  issues: write

concurrency:
  group: board-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # RESOLVED FROM THE DEFAULT BRANCH, NOT FROM THE PUSHED BRANCH.
      #
      # The header below says the issue number is hardcoded on purpose: a
      # caller-supplied number would turn this relay into a general
      # issue-commenting primitive. That property is preserved, not dropped —
      # the number now comes from `docs/claude/board-pointer.json` **as it
      # stands on the default branch**, which a `claude/**` branch cannot
      # influence. Reading the pointer off the pushed branch would have handed
      # the caller exactly the control the hardcoding refused them.
      #
      # It stopped being hardcoded because #6927 hit GitHub's 2500-comment cap
      # on 2026-09-07 and every hardcoded reference had to be swept by hand —
      # 13 of them across 6 files. One resolver, one file, one edit.
      - name: Resolve the live coordination board (from the default branch)
        id: board
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ptr="$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/claude/board-pointer.json?ref=${{ github.event.repository.default_branch }}" \
                 --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || true)"
          if [ -z "$ptr" ]; then
            echo "::error::board-post: could not read the board pointer from the default branch — REFUSING to post rather than guessing an issue number."
            exit 1
          fi
          state="$(printf '%s' "$ptr" | jq -r .board_state)"
          num="$(printf '%s' "$ptr" | jq -r '.board_issue // empty')"
          if [ "$state" != "live" ] || [ -z "$num" ]; then
            echo "::error::board-post: no live board is provisioned (board_state=$state). A session believes it is claiming the board and is not. Run board-rotate.yml."
            exit 1
          fi
          echo ">>> live coordination board: #${num}"
          echo "issue=$num" >> "$GITHUB_OUTPUT"

      - name: Post pending board comments
        env:
          GH_TOKEN: ${{ github.token }}
          BOARD_ISSUE: ${{ steps.board.outputs.issue }}
        run: |
          set -uo pipefail
          mkdir -p automation/board-results
          shopt -s nullglob
          failed=0
          found=0
          for req in automation/board-posts/*.md; do
            base="$(basename "$req" .md)"
            out="automation/board-results/${base}.txt"

            # IDEMPOTENCY IS THE RESULT FILE, NOT DELETION OF THE REQUEST.
            # An earlier version `git rm`'d each request once posted. That made
            # the results commit touch `automation/board-posts/**` -- this
            # workflow's own trigger path -- so it needed `[skip ci]` to avoid
            # retriggering itself, and `[skip ci]` suppresses EVERY workflow for
            # that commit. When the results commit is the last one on a branch it
            # becomes the PR head, and the PR is then left with ZERO check runs
            # that can never arrive. Measured on PR #10076: head 57a25aa9,
            # `get_check_runs` total_count 0. A check that silently did not run
            # renders identically to green, which is precisely what
            # pytest-collect.yml's own header warns about.
            # Keeping the request in place and skipping it when its result
            # already exists means the commit touches ONLY
            # `automation/board-results/**`, which is outside the trigger path --
            # so there is no self-retrigger, no `[skip ci]`, and the PR keeps CI.
            if [ -f "$out" ]; then
              echo ">>> ${base}: already posted, skipping ($(head -1 "$out"))"
              continue
            fi
            found=$((found + 1))

            # Assert the input before trusting the outcome: a blank comment would
            # post "successfully" and say nothing.
            if [ ! -s "$req" ] || ! grep -q '[^[:space:]]' "$req"; then
              echo "REFUSED: empty or whitespace-only body" > "$out"
              echo ">>> ${base}: REFUSED (empty body)"
              failed=1
              continue
            fi

            if url="$(gh issue comment "$BOARD_ISSUE" --repo "$GITHUB_REPOSITORY" \
                        --body-file "$req" 2>&1)"; then
              echo "$url" > "$out"
              echo ">>> ${base}: $(head -1 "$out")"
            else
              printf 'FAILED:\n%s\n' "$url" > "$out"
              echo ">>> ${base}: FAILED"
              failed=1
            fi
          done

          echo "board-post: ${found} request(s) processed"
          if [ "$failed" -ne 0 ]; then
            echo "::error::board-post: at least one board comment was NOT posted. A session may believe it claimed the board when it did not."
          fi
          echo "BOARD_POST_FAILED=$failed" >> "$GITHUB_ENV"

      - name: Commit results back to branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage ONLY the results directory. Requests are no longer deleted
          # (see the idempotency note above), so nothing under the trigger path
          # `automation/board-posts/**` changes here -- which is what lets this
          # commit omit `[skip ci]` without retriggering the workflow.
          #
          # `-A` on the directory rather than naming files, so a first run that
          # creates it is handled the same as a later one that adds to it.
          # (A previous version staged `automation/board-posts` explicitly and
          # failed under `set -e` once `git rm` had emptied that directory --
          # git does not track empty directories, so the path vanished.)
          git add -A automation/board-results
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "board-post: results"
          git push origin HEAD:${{ github.ref_name }}

      - name: Fail the run if any comment was not posted
        if: always()
        run: |
          if [ "${BOARD_POST_FAILED:-0}" -ne 0 ]; then
            echo "One or more board comments failed to post."
            exit 1
          fi
          echo "All board comments posted."
