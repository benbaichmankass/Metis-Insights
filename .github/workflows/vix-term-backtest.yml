name: vix-term-backtest

# M31 Track A-S5 — run the vix_term single-asset TIMING backtest on a GitHub-hosted runner.
#
# The signal grade (m31-implied-vol-grade) proves vix_term is a robust, cost-surviving
# directional lead on SP500 + NASDAQ-100. This backtest answers the SIZE question a
# deployment decision turns on for a known/crowded macro signal: annualized return,
# Sharpe, and drawdown once the ratio is expressed as an actual long/short/flat position
# on the index future, net of the REAL futures round-trip cost (~1 bp). A-priori
# direction (short high term-ratio / long low), non-overlapping, OOS-split — no fitting.
#
# Keyless FRED (VIXCLS/VXVCLS + SP500/NASDAQ100/DJIA), US-reachable, so it runs on a
# GitHub-hosted US runner — no trainer relay, no geo-block. Off-VM-guarded
# (ICT_OFFVM_BUILD_HOST=1). Comment-back only — the numbers are posted to the issue;
# nothing is committed (a research grade, not a persisted artifact). Observe-only; the
# S4 productionization it informs stays Tier-3, operator-gated.
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (cost-bps / horizon overrides).
#   2. issues.opened w/ label `vix-term-backtest-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      horizons:
        description: "CSV of forward horizons (trading days)"
        required: false
        default: "5,10,21,42"
      cost_bps:
        description: "round-trip futures cost in bps of notional"
        required: false
        default: "1.5"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: vix-term-backtest-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  backtest:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'vix-term-backtest-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: M31 Track A-S5 — vix_term timing backtest
        id: backtest
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          python scripts/macro/vix_term_backtest.py \
            --horizons "${{ github.event.inputs.horizons || '5,10,21,42' }}" \
            --cost-bps "${{ github.event.inputs.cost_bps || '1.5' }}" \
            | tee /tmp/vix_term_bt.txt

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(backtest output unavailable)';
            try { card = fs.readFileSync('/tmp/vix_term_bt.txt', 'utf8'); } catch (e) {}
            const body = [
              '🧪 **vix-term-backtest** — vix_term single-asset timing backtest (ES/NQ/YM, net of real futures cost).',
              '',
              '```', card.trim(), '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
