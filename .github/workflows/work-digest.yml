name: work-digest

# Phase B's daily roll-up, on a real cadence. Operator decision 2026-09-01:
# a standalone daily workflow, not folded into an existing job.
#
# WHY IT EXISTS
#   scripts/ops/work_digest.py shipped with #10654 and had NO trigger — it
#   appeared in 0 of 125 workflow files, so it had never fired and could not.
#   It was deferred to claude/workflows-audit-restructure-fz0sw9, a branch that
#   DOES NOT EXIST on origin, so it was not waiting on another session's paths;
#   it was waiting on nobody.
#
# ⚠️ A SCHEDULED WORKFLOW IN THIS REPO IS NOT EVIDENCE THAT IT FIRES ON TIME.
#   CORRECTED 2026-09-02: this header read "have never once fired" and that is
#   now FALSE — do not re-quote it. probes.yml HAS fired on cron (run #34,
#   event=schedule, success, 2026-09-01T10:12:17Z) and
#   OI-20260901-SCHEDULED-PROBES-AND-DUE-LIST-HAVE-NEVER-FIRED-ON-CRON is
#   CLEARED. The caution stands and is better evidenced, not weaker: that run
#   came ~4h50m LATE against a `20 5 * * *` cron, and once rather than daily.
#   Correct cron syntax is still not evidence of a run — read the run history.
#   So this file being green on the day it lands says nothing. The digest is
#   DEPLOYED, and stays that way until a RUN with event=schedule is observed.
#   The `workflow_dispatch` below exists so that observation can be forced
#   rather than waited for — but a dispatch run is NOT a cron run, and reading
#   one as the other is exactly the substitution that left those two dead.
#
# WHAT IT PINGS
#   STATE CHANGES ONLY, NEVER ACTIVITY — the definition is imported by the
#   script from work_phase_ping.PING_WORTHY, so the per-event path and this
#   roll-up cannot drift. A digest that narrated activity would rebuild the
#   desensitized-alarm failure on a daily cadence (202 of 376 CRITICAL/ERROR
#   rows in one measured window were a single un-latched alarm).
#
# WHAT IT DOES NOT DO
#   It does not send anything. It appends to docs/claude/pending-pings.jsonl;
#   the VM's scripts/notify_on_pull.py drains that queue on the next
#   ict-git-sync pull. So the digest is truth in transit between the commit and
#   the send, and it fails BACK: an uncommitted row is a digest that never
#   happened, never one wrongly shown as delivered. That is why the commit step
#   uses verify-merged — "the PR opened" is not "the digest landed".
#
# Tier-1: an observability producer. No order path, no live-VM mutation, no
# secret beyond the PAT that opens the auto-merge PR.

on:
  schedule:
    # HOURLY at :20 — operator-directed 2026-09-02, verbatim: "I realize that's
    # a lot of noise, but that's how I want it for now until we get a little
    # more settled in." Raised from every-4h (2026-09-01), itself raised from
    # the daily 06:20 this shipped with.
    #
    # [!] THE WINDOW MOVED WITH THE CADENCE AND HAD TO. This was described as
    # "changing one little number" and the cron genuinely is one number -- but
    # the window below was pinned at 24h, so hourly firing alone would have
    # re-reported THE SAME DAY twenty-four times over. That is not more
    # frequent reporting, it is the same report louder, and it is the fastest
    # way to train a reader to ignore the channel (the desensitized-alarm P1
    # this repo has already paid for once: 202 of 376 CRITICAL rows in one
    # window were a single un-latched alarm). Cadence and window are ONE
    # decision; if a future change moves either, it moves both.
    #
    # WHY :20 AND WHY 06 IS IN THE SET. The 06:20 slot is load-bearing and was
    # not chosen for looks: it lands after probes (05:20) and due-list (05:50),
    # so the day's first digest reads registers those two have already
    # refreshed. Keeping the offset at :20 and including 06 preserves that
    # ordering while adding the other five slots around it.
    #
    # ⚠️ MOST OF THESE WILL SAY ALMOST NOTHING, and that is correct. A digest
    # that only fires when something interesting happened is indistinguishable
    # from one that has broken — the empty run IS the evidence the cadence is
    # alive. It will feel like noise before it feels like reassurance.
    - cron: "20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: work-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # BUDGET = work + wait + slack, and the WAIT dominates: commit-to-main with
    # verify-merged waits up to 30m for the auto-merge PR to land, so a budget
    # under 35 kills the job mid-wait and reports a failure for a merge that was
    # about to succeed. 40 = ~5m of work + the 30m wait + 5m slack. This is the
    # value tests/test_commit_to_main_callers.py pins; it caught due-list at 20.
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # A digest is a diff over a WINDOW, so the history must reach back
          # past it. A shallow clone would silently produce an empty digest —
          # indistinguishable from a quiet day, which is the failure this whole
          # file is about.
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Self-test the digest before trusting its output
        run: |
          set -euo pipefail
          python3 scripts/ops/work_digest.py --self-test
          # The ledger unwrapper gates the standing-wedge section, so it is
          # trusted on exactly the same terms as the renderer it feeds.
          python3 scripts/ops/fetch_standing_wedges.py --self-test

      - name: Resolve the 1h window
        id: window
        run: |
          set -euo pipefail
          # The window is the last 1h of main -- it TRACKS THE CRON above, so each
          # digest reports what happened since the previous one rather than
          # re-reporting the same day every hour. Resolved to a REAL commit rather
          # than a date expression, so the digest reports over a range that
          # exists. `--before` returns nothing when the repo was quiet for a day;
          # fall back to the root commit, which yields a digest over everything
          # since — a loud over-report is recoverable, a silent empty one is not.
          BASE="$(git rev-list -1 --before='1 hour ago' main || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-list --max-parents=0 main | tail -1)"
            echo "::warning::work-digest: no commit older than 1h on main; " \
                 "falling back to the root commit, so this digest covers ALL history."
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "work-digest: window $BASE..main"

      # MI-34. A close failure CONFIRMED unclearable by any bot-side lever is
      # downgraded out of the paging channel and carried here instead (operator
      # decision 2026-09-02). The trader writes that ledger to
      # runtime_logs/close_wedge_standing.json, which is .gitignore'd and lives
      # on the VM — so on this runner the file is ABSENT unless we fetch it.
      #
      # ⚠️ THE FETCH IS BEST-EFFORT AND THE FAILURE DIRECTION IS THE POINT.
      # `continue-on-error` is deliberate: a diag outage must not kill the
      # digest, because the digest still has the rest of the day to report. What
      # it must NOT do is render a fetch failure as a clean fleet. It cannot —
      # work_digest.standing_wedges() reports `not_fetched` for a missing file
      # and the renderer prints "NOT EXAMINED — this is 'we did not look', NOT
      # 'nothing is wedged'", loudly, in the operator-visible message. A digest
      # that quietly omitted the section on a failed fetch would put a
      # downgraded item in NEITHER channel, which is the one outcome this whole
      # change exists to make unreachable.
      #
      # ⚠️ AND IT IS NOT THE ONLY THING HOLDING THAT LINE. The trader keeps its
      # own re-page floor (CLOSE_WEDGE_REPAGE_HOURS, default 24h) precisely
      # because this workflow has no track record of firing ON TIME: probes.yml's
      # first-ever scheduled run (#34, success, 2026-09-01T10:12:17Z) came ~4h50m
      # LATE against its `20 5 * * *` cron, and once rather than daily. (The row
      # OI-20260901-SCHEDULED-PROBES-AND-DUE-LIST-HAVE-NEVER-FIRED-ON-CRON was
      # CLEARED on that observation 2026-09-02; this comment cited it as "never
      # once fired" until then — do not re-quote that. The caution is unchanged
      # and better evidenced: a cadence that slips five hours is a worse carrier
      # for a standing alarm than one that was never tried.)
      # Do not remove that floor on the strength of this step existing.
      - name: Fetch the standing close-wedge ledger from the live VM
        continue-on-error: true
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p runtime_logs
          if [ -z "${DIAG_READ_TOKEN:-}" ]; then
            echo "::warning::work-digest: no DIAG_READ_TOKEN — the standing " \
                 "close-wedge ledger will report NOT EXAMINED (we did not look)."
            exit 0
          fi
          # `|| echo '{}'` is deliberately NOT used here. That idiom is what
          # makes a failed fetch indistinguishable from an empty answer, and
          # this repo has paid for it twice. On any failure we write NOTHING and
          # let the absent file speak for itself.
          if ! out="$(scripts/ops/diag_fetch.sh \
                        'log_file?name=close_wedge_standing&lines=2000')"; then
            echo "::warning::work-digest: diag fetch FAILED — the ledger will " \
                 "report NOT EXAMINED. This is not 'nothing is wedged'."
            exit 0
          fi
          # Unwrapping is a SCRIPT, not four lines of inline YAML, because it
          # decides which of three operator-visible states the digest reports —
          # and "the fetch failed" and "nothing is wedged" are two of them. Its
          # own --self-test covers every branch including the failure ones.
          if ! printf '%s' "$out" \
               | python3 scripts/ops/fetch_standing_wedges.py \
                   --out runtime_logs/close_wedge_standing.json; then
            echo "::warning::work-digest: ledger payload unusable — the digest " \
                 "will report NOT EXAMINED rather than guessing at a clean fleet."
          fi

      - name: Render the digest
        run: |
          set -euo pipefail
          python3 scripts/ops/work_digest.py \
            --base "${{ steps.window.outputs.base }}" --head main --write

      - name: Land the digest on main (auto-merge PR)
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: docs/claude/pending-pings.jsonl
          message: "chore(ops): queue the daily work digest"
          pr-title: "chore(ops): queue the daily work digest (auto)"
          pr-body: >-
            Automated daily work digest (Phase B). Queues one rolled-up summary
            of state changes onto pending-pings.jsonl; the VM drains it on the
            next git-sync. Generated artifact only; auto-merge.
          branch-prefix: automation/work-digest
          # "the PR opened" is not "the digest landed", and only the second is
          # what reaches the operator.
          verify-merged: "true"
