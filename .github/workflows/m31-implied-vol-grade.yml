name: m31-implied-vol-grade

# M31 Track A — grade the IMPLIED-VOL input class on a GitHub-hosted runner.
#
# The probe needs only free keyless FRED fredgraph.csv series (the CBOE vol family
# + instrument-aligned price targets). FRED is US-reachable, so — like the value
# sleeve (m28-value-grade.yml) — this runs BEST on a GitHub-hosted US runner; no
# trainer relay, no Bybit geo-block. Pure stdlib + the repo's keyless fred_adapter.
#
# Runs entirely off-VM (ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). No SSH,
# no live-VM touch, no order path. Comment-back only — the verdict is posted to the
# issue; nothing is committed (a research grade, not a persisted artifact).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (horizon / t-flag overrides).
#   2. issues.opened w/ label `m31-implied-vol-grade-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      horizons:
        description: "CSV of forward horizons (trading days)"
        required: false
        default: "5,10,21,42"
      t_flag:
        description: "|ic_t| significance flag"
        required: false
        default: "2.0"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: m31-implied-vol-grade-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  grade:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'm31-implied-vol-grade-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: M31 Track A — grade the implied-vol input class
        id: grade
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          python scripts/macro/implied_vol_probe.py \
            --horizons "${{ github.event.inputs.horizons || '5,10,21,42' }}" \
            --t-flag "${{ github.event.inputs.t_flag || '2.0' }}" \
            | tee /tmp/m31_iv_card.txt

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(grade output unavailable)';
            try { card = fs.readFileSync('/tmp/m31_iv_card.txt', 'utf8'); } catch (e) {}
            const body = [
              '🧪 **m31-implied-vol-grade** — implied-vol input class (CBOE/FRED VIX family → SP500/oil).',
              '',
              '```', card.trim(), '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
