name: m34-xfamily-grade

# M34 — grade the CROSS-FAMILY CONDITIONING probe on a GitHub-hosted runner.
#
# The free signal-research program found exactly two robust equity leads — both
# NON-deployable standalone: vix_term (VIX3M/VIX term ratio) and hy_oas_pct (HY OAS
# stress percentile). This is the one un-foregone construction: does a 2-factor
# CONJUNCTION gate (long equity fwd return only when BOTH leads favorable) clear the
# cost bar where neither leg does alone? Keyless FRED daily series (VIXCLS/VXVCLS/
# BAMLH0A0HYM2 + SP500/NASDAQ100), US-reachable — like the value/implied-vol/credit/
# seasonality sleeves it runs on a GitHub-hosted US runner; no trainer relay.
# Both factors' favorable direction + threshold are fit IN-SAMPLE only and the
# conjunction is evaluated on the untouched OOS half, net of cost; a conjunction only
# counts if it beats BOTH single-factor gates AND buy-and-hold, t-significant.
#
# Off-VM (ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). Comment-back only — the
# verdict is posted to the issue; nothing is committed (a research grade).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (cost/t-flag overrides).
#   2. issues.opened w/ label `m34-xfamily-grade-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      cost_bps:
        description: "per-entry round-trip cost in bps"
        required: false
        default: "1.0"
      t_flag:
        description: "OOS |t| significance flag"
        required: false
        default: "2.0"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: m34-xfamily-grade-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  grade:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'm34-xfamily-grade-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: M34 — grade the cross-family conditioning probe
        id: grade
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          python scripts/macro/xfamily_conditioning_probe.py \
            --cost-bps "${{ github.event.inputs.cost_bps || '1.0' }}" \
            --t-flag "${{ github.event.inputs.t_flag || '2.0' }}" \
            | tee /tmp/m34_xfamily_card.txt

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(grade output unavailable)';
            try { card = fs.readFileSync('/tmp/m34_xfamily_card.txt', 'utf8'); } catch (e) {}
            const body = [
              '🧪 **m34-xfamily-grade** — cross-family conditioning (vix_term × hy_oas_pct conjunction gate → equity fwd return).',
              '',
              '```', card.trim(), '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
