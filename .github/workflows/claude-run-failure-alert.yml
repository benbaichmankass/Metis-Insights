name: claude-run-failure-alert

# The LOUD failure flag for Claude-driven VM / relay / heavy-compute workflows
# (operator directive 2026-07-28: "when a run fails there needs to be an
# immediate loud flag — I'm tired of poking claudes after hours of waiting just
# for them to learn they've been waiting on a run that failed hours earlier").
#
# WHY this exists as a separate `workflow_run` listener instead of a step inside
# each workflow: the pain is a session (or the operator) BLOCKING on a run's
# result and never being told it died. Each relay already posts a per-run issue
# comment on failure/cancel (a session polling the issue eventually sees it), but
# (a) the operator gets no push, and (b) some heavy workflows only comment on
# success (e.g. research-exit-head-build), so a failed run leaves the waiter
# hanging with no signal at all. This listener fires the instant ANY of the named
# workflows concludes failure / cancelled / timed_out and sends ONE Telegram ping
# to the operator alert channel — "stop waiting, it's dead" — so no one ever again
# waits hours on a run that failed minutes in. It is the universal backstop; the
# per-workflow honest issue comment is the session-facing half.
#
# NOT noisy by design: it is scoped to the workflows where a failure is
# genuinely UNOBSERVED — the Claude-driven diag/action relays and GH-runner
# research builds (someone is blocked on the result), plus, since 2026-08-13,
# the cron'd workflows (NOBODY is waiting, which is strictly worse — see the
# per-entry note in the `workflows:` list). Ordinary CI check failures are
# visible on the PR and are deliberately NOT in scope — an alarm that fires on
# everything is itself a P1 bug (CLAUDE.md § "If you see something, say
# something").
#
# `workflow_run` listeners run from the DEFAULT branch (main) — so this is live
# once merged, and fires regardless of which branch/issue triggered the watched
# run.
#
# Required repo secrets (already used by env-gate-guard.yml etc.):
#   * TELEGRAM_BOT_TOKEN
#   * TELEGRAM_CHAT_ID   — the operator alert channel

on:
  workflow_run:
    workflows:
      # The manager-side queue watcher. ⚠️ ITS SILENCE IS INDISTINGUISHABLE FROM
      # A QUIET QUEUE unless something watches the run itself -- which is the
      # whole failure class it exists for. It also FAILS DELIBERATELY when an
      # escalation is due, so this entry is not only the death alarm, it is the
      # escalation channel: a backed-up PR queue reaches the operator through a
      # failed run here rather than through the manager, who is the bottleneck
      # being reported on.
      - pr-queue-watch
      # The alarm on the trainer's FORWARD-ONLY order-flow capture. Its silence
      # is indistinguishable from a healthy capture -- which is the entire
      # failure class it exists for, one level up: the capture's own
      # `ActiveState` is green while it writes nothing, so if the watcher dies
      # too there is no signal anywhere. It also FAILS DELIBERATELY when the
      # capture is stale or when the alarm flunks its own planted controls, so
      # this entry is both the death alarm and the second escalation channel --
      # a Telegram outage does not silence the finding.
      - trainer-capture-watch
      # A cron whose run DIES notifies nobody otherwise, and this repo has a live
      # instance of that class open (probes.yml / due-list.yml, zero schedule runs
      # since landing). Watching it is the cheap half.
      # Phase B's daily digest. A dead run here is invisible twice over: the
      # digest sends nothing itself (it queues to pending-pings.jsonl for the
      # VM to drain), so a failed run and a quiet day look identical to the
      # operator.
      # The reaper is the only thing recording what a killed session left behind.
      # A dead reaper run is invisible in the worst way: its ledger simply stops
      # advancing, and a stale ledger reads exactly like a quiet week.
      - session-reaper
      - work-digest
      - work-decision-commit
      # A1's readout, on the cadence the operating model always declared it
      # had. A dead run here is invisible in the worst possible way: the
      # CLAUDE.md session brief keeps rendering the LAST good readout with its
      # own date attached, so a stalled cron looks exactly like a quiet work
      # store to every session that reads it.
      - constraint-readout
      - strategy-review-packets
      - sunset-pass
      - trainer-vm-diag
      - vm-diag-snapshot
      - system-actions
      - vm-web-api-recover
      - prop-report
      - research-exit-head-build
      - research-panel-build
      - research-symbol-p0-build
      # ── CRON'D WORKFLOWS (added 2026-08-13, full-system audit) ──────────
      #
      # A scheduled run that dies is the SAME failure class this listener was
      # built for, in its worst form: with a relay at least someone is waiting
      # and will eventually poke the issue. On a nightly, NOBODY is waiting, so
      # a failure is not merely un-notified — it is unobservable until an audit
      # happens to read the Actions API.
      #
      # MEASURED 2026-08-13, and it was already biting: `replay-pregate-nightly`
      # had failed 3 of 3 consecutive nights (runs 31460751157 / 31567167485 /
      # 31671108501, trainer-VM SSH timeout at head 9/22) and emitted NOTHING.
      # Its own two notify steps are gated `if: github.event_name == 'issues'`
      # while the trigger that actually fired was `schedule` — so the schedule
      # path is silent on success AND failure.
      #
      # POPULATION, stated because every count of it so far has been wrong.
      # Re-counted 2026-08-21 by parsing every workflow's `on:` block rather
      # than grepping (a commented-out cron reads like a live one to grep):
      # that count said **12**, corrected up from 10, and "ALL 12 are now
      # listed."
      #
      # ⚠️ MEASURED AGAIN 2026-08-31: there are **14**, and **2 were unlisted**
      # — `alpaca-settlement-soak-watch` and `research-queue-dispatch`. The
      # second is the research queue's own scheduler and had ALREADY FAILED
      # TWICE (2026-08-29, 2026-08-30) with nothing pinging. So this list has
      # now been asserted-complete and been false TWICE, and the count in this
      # comment was stale within ten days of being corrected.
      #
      # ⚠️ DO NOT MAINTAIN THIS LIST BY HAND OR RE-QUOTE A COUNT FROM THIS
      # COMMENT. `cron-failure-watch` (scripts/ci/check_cron_failure_watch.py,
      # registered in scripts/ci/run_guards.py) now DERIVES the cron'd set from
      # the workflow files and fails CI when one is unwatched — so the next
      # cron added announces itself on its own commit instead of ten days
      # later in an audit. It also checks the reverse direction: an entry here
      # naming no real workflow `name:` is INERT (GitHub matches on name, not
      # filename), which is an alarm that looks armed and is not.
      #
      #   * `Health Snapshot` and `oci-inventory` were the two historical
      #     exclusions; both are in as of 2026-08-21, once the self-ping
      #     dedupe below made listing them safe (operator-directed: "dedupe
      #     first, then list").
      #
      # WHY THEY WERE EXCLUDED, and the correction that closed it. Both send
      # their own operator ping, so listing them naively double-pinged. The
      # dedupe in the job below reads the watched run's steps and stays quiet
      # only when a `[operator-ping]` step actually SUCCEEDED — so the double
      # is gone and the silent modes are now covered.
      #
      # ⚠️ THE FILED PREMISE WAS PARTLY WRONG, corrected here by reading the
      # YAML rather than inheriting it (BL-20260821-OCI-INVENTORY-CRON-UNWATCHED
      # said a failure at "OCI auth, checkout, a dependency install" sends
      # nothing). GitHub evaluates a custom `if:` as `success() && <expr>`, and
      # `oci-inventory`'s `Run inventory` step carries `continue-on-error:
      # true`. So:
      #   * a failure INSIDE `Run inventory` (OCI auth, an API error) is masked,
      #     `success()` stays true, `Classify verdict` reaches
      #     `could_not_check`, and the Telegram DOES fire — the dominant
      #     failure mode was never silent;
      #   * a failure in `checkout` / `setup-python` / `pip install` makes
      #     `success()` false, so the notify step is SKIPPED — silent;
      #   * `cancelled` / `timed_out` never reach the step at all — silent.
      # `Health Snapshot` has the same shape: its notify is `always() &&
      # steps.status.outputs.level != ''`, so it pings after `status` has run
      # and is silent before it. The residual gap was therefore NARROWER than
      # filed, but real, and it is the part no self-ping can ever cover.
      #
      # `macro-valuation-snapshot` + `econ-calendar-produce` are included even
      # though `macro-producer-liveness` watches them: that check asserts their
      # OUTPUT is fresh, which is a different question from whether the RUN
      # failed, and it cannot distinguish "the producer errored" from "the
      # producer is late". Output-freshness is not run-status coverage.
      # `macro-producer-liveness` itself is listed too — a silent watchdog is
      # worse than none.
      #
      # Not noisy: these fire at most daily/weekly and ONLY on a dead
      # conclusion, so a healthy fleet emits zero pings. A recurring ping here
      # means a nightly is genuinely broken, which is the signal wanted.
      - diag-relay-sweep
      - doc-audit-weekly
      - econ-calendar-produce
      - econ-event-study
      - macro-producer-liveness
      - macro-valuation-snapshot
      - purge-artifacts
      - replay-pregate-nightly
      - research-backtest-augment
      # Added 2026-08-21 with the workflow itself. It has NO self-notify path of
      # its own — by design it stays silent unless the graded state MOVES — so
      # there is nothing here to double-ping, and a dead schedule would
      # otherwise be observable only by reading its tracking issue's
      # "Last checked" line.
      - broker-bracket-reconcile
      # Added 2026-08-21 once the self-ping dedupe landed. Both self-ping, so
      # both were excluded before; the dedupe suppresses this listener only on
      # a VERIFIED successful `[operator-ping]` step, leaving their genuinely
      # silent modes (pre-notify step failure, cancelled, timed_out) covered.
      - oci-inventory
      - Health Snapshot
      # ── added 2026-08-31: the two the hand-maintained list had missed.
      #    research-queue-dispatch is the research queue's scheduler and
      #    had already failed twice unobserved when this was measured.
      - alpaca-settlement-soak-watch
      - research-queue-dispatch
      # ── added 2026-08-31 in the same PR that created it. `due-list` renders
      #    the one surface that answers "what is due right now?", so a silent
      #    failure of it makes every OTHER register invisible at once — the
      #    worst single cron to leave unwatched.
      - due-list
      # `probes` is the mechanism that watches the monitoring rows. A silent
      # failure of it means every row it covers is quietly unwatched WHILE the
      # last-known results file still reads as current — the worst shape.
      - probes
    types: [completed]

permissions:
  contents: read
  # Needed by the self-ping dedupe below: reading the WATCHED run's
  # jobs/steps is the only way to know whether it already told the
  # operator. The `workflow_run` payload carries no step detail.
  actions: read

jobs:
  alert:
    # Fire only on a genuinely-dead conclusion. A job-timeout surfaces as
    # `cancelled` (GitHub cancels the job when `timeout-minutes` is exceeded);
    # `timed_out` covers the rarer explicit-timeout conclusion. `success` and
    # `skipped` never alert.
    if: >
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ── SELF-PING DEDUPE (2026-08-21, operator-directed) ────────────────
      #
      # Some watched workflows tell the operator themselves. Listing one of
      # those here used to mean TWO pings for one event, which is why
      # `oci-inventory` and `Health Snapshot` were excluded — and being
      # excluded, their SILENT failure modes were covered by nothing.
      # Neither horn of that dilemma is acceptable: a double-ping trains the
      # operator to ignore the channel (the desensitized-alarm P1), and an
      # exclusion leaves a cron dying unobserved.
      #
      # The convention: a workflow that sends its own operator ping names a
      # step with the sentinel `[operator-ping]`. This listener reads the
      # watched run's steps and stays quiet only when such a step actually
      # concluded `success`. It is a VERIFIED suppression, never a declared
      # one: naming a workflow in some allow-list would be cheaper to get
      # wrong than to satisfy, the failure shape `new-table-wiring-guard`'s
      # presence-only marker already cost us.
      #
      # ⚠️ THE SENTINEL MUST NAME A STEP WHOSE `success` ENTAILS DELIVERY —
      # NEVER THE BEST-EFFORT SEND ITSELF. When this dedupe first shipped
      # (2026-08-21) it did exactly that, and the comment here asserted the
      # suppression meant "a message really went out". It did not. Both
      # sentinel steps ran `set +e` and `python scripts/notify_session.py …
      # || echo "::warning::telegram notify failed (non-fatal)"`, so each
      # concluded `success` whether or not Telegram accepted the message —
      # while `notify_session.py` was already exiting 1 on a real delivery
      # failure and the `|| echo` was discarding that. A Telegram outage
      # would therefore have been served to this listener as "someone else
      # handled it", swallowing the ping: the exact bug this workflow exists
      # to prevent, newly reachable through the fix meant to help.
      # Both workflows now put the sentinel on a separate marker step gated
      # `if: steps.<send>.outcome == 'success'`, so a failed send leaves it
      # `skipped` and this listener falls back — on a DIFFERENT bot token
      # (`TELEGRAM_BOT_TOKEN` here vs `CLAUDE_TELEGRAM_BOT_TOKEN` there),
      # which is what makes the fallback worth having.
      # Enforced by tests/test_run_failure_alert_dedupe.py, which fails if a
      # sentinel step is ever again `continue-on-error` or swallows with `||`.
      # BL-20260821-SELF-PING-SENTINEL-SURVIVES-A-FAILED-SEND.
      #
      # THREE states, never collapsed — and the tie-break is deliberate:
      #   self_pinged      a sentinel step ran and succeeded  -> stay quiet
      #   no_self_ping     the run has no such successful step -> PING
      #   could_not_check  the API read failed                 -> PING ANYWAY
      # `could_not_check` pings because "we could not look" must never be
      # served as "someone else handled it". A duplicate ping is a nuisance;
      # a swallowed one is the entire bug this workflow exists to prevent.
      - name: Did the watched run already ping the operator?
        id: selfping
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          body="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")" || body=""

          if [ -z "${body}" ] || ! printf '%s' "${body}" | jq -e '.jobs' >/dev/null 2>&1; then
            echo "state=could_not_check" >> "$GITHUB_OUTPUT"
            echo "::warning::could not read run ${RUN_ID} jobs — alerting anyway rather than assuming a self-ping."
            exit 0
          fi

          # A sentinel step that was SKIPPED or FAILED sent nothing, so only
          # `success` counts. This is the whole point of reading conclusions
          # rather than merely finding the step exists.
          n="$(printf '%s' "${body}" | jq '[.jobs[].steps[]?
                 | select(.name | contains("[operator-ping]"))
                 | select(.conclusion == "success")] | length')"
          if [ "${n:-0}" -gt 0 ]; then
            echo "state=self_pinged" >> "$GITHUB_OUTPUT"
            echo "Suppressing: the run already sent ${n} operator ping(s) of its own."
          else
            echo "state=no_self_ping" >> "$GITHUB_OUTPUT"
            echo "No successful [operator-ping] step on this run — alerting."
          fi

      - name: Loud Telegram flag — a Claude-driven run just died
        if: steps.selfping.outputs.state != 'self_pinged'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
          WF_TITLE: ${{ github.event.workflow_run.display_title }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "::warning::Telegram secrets not configured; skipping the failure ping."
            exit 0
          fi
          # A cancelled trainer-vm-diag is almost always the job time budget
          # (timeout-minutes), NOT a sibling preemption — per-issue concurrency
          # cannot cancel a sibling. Say so, so the reader doesn't chase a ghost.
          HINT=""
          if [ "${WF_CONCLUSION}" = "cancelled" ]; then
            HINT="(a 'cancelled' relay run is almost always the job time budget being hit, or a manual cancel — NOT a sibling request preempting it. A long CPU job that needs no VM state belongs on a free GH runner, not the trainer SSH relay — see docs/claude/vm-resource-management.md.)"
          fi
          MSG="🔴 [RUN ${WF_CONCLUSION}] ${WF_NAME}
          ${WF_TITLE}
          A Claude-driven run just concluded '${WF_CONCLUSION}'. If a session is WAITING on this result: STOP waiting — it is dead, not still running.
          ${HINT}
          Next: read the run log / the issue comment, re-diagnose, re-fire — do not keep blocking.
          ${WF_URL}"
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" >/dev/null
          echo "Alerted: ${WF_NAME} concluded ${WF_CONCLUSION} (${WF_URL})"
