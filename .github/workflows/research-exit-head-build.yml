name: research-exit-head-build

# M30 × M20 — the per-bar in-trade EXIT-HEAD discovery run (dense-substrate fusion).
#
# The sibling of `research-panel-build.yml`, for the EXIT frontier. Where that
# workflow builds the decision-time ENTRY panel (block-sparse feature vector, now
# exhausted — Studies 7/8/9/10), this one builds the **dense** per-bar in-trade
# EXIT panel (running MFE/MAE-R, dMAE/dt, bars-in-trade, dist-to-stop, giveback,
# in-trade vol, taker-imbalance OFI) + the triple-barrier/time-stop hold-vs-exit
# meta-label, and trains the take/skip exit head under uniqueness-weighted grouped
# purged WF-CV, grading it net-of-fee (deflated Sharpe). The panel is dense by
# construction, so the OOS multivariate pass runs at scale — the structural escape
# from the block-sparsity wall.
#
# Same off-trainer economics as research-panel-build: a GitHub-hosted runner
# (4 vCPUs, up to ~5.5h, $0 on this public repo) FETCHES the feed from Binance's
# public archive (keyless, globally reachable — Bybit geoblocks US GH-runners),
# builds, analyzes, uploads, and posts the verdict. No VM, no trainer contention,
# no relay cap, no GPU.
#
# The feed fetch now preserves `taker_buy_base` (Binance-vision field 9) so the
# taker-imbalance OFI feature is dense on the run (it is None → dropped only on a
# feed without the taker split).
#
# Triggers:
#   1. workflow_dispatch — operator clicks "Run workflow"
#   2. issues.opened with label `research-exit-head-request` (owner-guarded)
#
# Issue body (optional, all keys have defaults):
#   harness: ict_scalp          # ict_scalp | backtest_system
#   symbol: BTCUSDT
#   timeframe: 5m
#   days: 2200
#   time_stop_bars: 12          # the vertical barrier / time-stop
#   tp_r: 2.0                   # the upper barrier profit target in R
#   exit_threshold: 0.5         # P(hold) below which the head exits
#
# Safety: READS the repo + fetches public candles + runs the strategy unit on
# historical data. It does not push, deploy, or touch config/strategies.yaml. A
# discovered exit edge routes through the M20 net-of-cost backtest gate + Tier-3
# before any live surface (observe-only).

on:
  workflow_dispatch:
    inputs:
      harness:
        description: "Backtest harness (ict_scalp | backtest_system)"
        default: "ict_scalp"
      symbol:
        description: "Symbol to fetch + backtest"
        default: "BTCUSDT"
      timeframe:
        description: "Strategy timeframe label"
        default: "5m"
      days:
        description: "Trailing days of candles to fetch (~2200 = ~6y of 5m)"
        default: "2200"
      time_stop_bars:
        description: "Vertical barrier / time-stop (bars forward from the decision bar)"
        default: "12"
      tp_r:
        description: "Upper-barrier profit target in R"
        default: "2.0"
      exit_threshold:
        description: "P(hold) below which the head exits now"
        default: "0.5"
      roster:
        description: "[backtest_system] comma strategy roster, e.g. trend_donchian. Blank = harness default."
        default: ""
      clock_tf:
        description: "[backtest_system] clock timeframe"
        default: "15m"

      # ⚠️ THESE TWO EXIST SO THE QUEUE CAN FIRE THIS WORKFLOW AT ALL.
      # `scripts/research/dispatch_queue.py` REFUSES to fire a unit graded
      # `accruing` unless the unit declares `run.inputs.research_unit` — and
      # `gh workflow run -f <input-the-workflow-never-declared>` ERRORS, so a
      # workflow without the input is undispatchable for exactly the units that
      # most need the safety label. MEASURED 2026-09-22 across the five sweep
      # workflows: only `e35-bracket-sweep.yml` declared them, which is why
      # RQ-20260922-007 sat `blocked` naming this file.
      research_unit:
        description: >-
          Queue unit id that dispatched this run (RQ-...). Stamped onto the
          result record so a later reader can tell WHICH unit produced it.
          Empty means NOT QUEUE-DISPATCHED — never "this was only a test".
        required: false
        default: ""
      power_state:
        description: >-
          That unit's R4 power verdict, supplied by the dispatcher, not by
          hand. `accruing` means the unit declared up front that it cannot
          answer yet, so its numbers must never be read as a test result.
        required: false
        default: ""
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: research-exit-head-build-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'research-exit-head-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue body
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          get() { printf '%s' "${ISSUE_BODY}" | grep -m1 -i "^$1:" | awk '{print $2}' || true; }
          HARNESS=$(get harness);      [ -z "${HARNESS}" ] && HARNESS="ict_scalp"
          SYMBOL=$(get symbol);        [ -z "${SYMBOL}" ] && SYMBOL="BTCUSDT"
          TIMEFRAME=$(get timeframe);  [ -z "${TIMEFRAME}" ] && TIMEFRAME="5m"
          DAYS=$(get days);            [ -z "${DAYS}" ] && DAYS="2200"
          TSB=$(get time_stop_bars);   [ -z "${TSB}" ] && TSB="12"
          TPR=$(get tp_r);             [ -z "${TPR}" ] && TPR="2.0"
          THR=$(get exit_threshold);   [ -z "${THR}" ] && THR="0.5"
          ROSTER=$(get roster)
          CLOCKTF=$(get clock_tf);     [ -z "${CLOCKTF}" ] && CLOCKTF="15m"
          # sanity-validate so a malformed body can't inject args
          printf '%s' "${HARNESS}" | grep -qE '^(ict_scalp|backtest_system)$' || HARNESS="ict_scalp"
          printf '%s' "${SYMBOL}" | grep -qE '^[A-Z0-9]+$' || SYMBOL="BTCUSDT"
          printf '%s' "${TIMEFRAME}" | grep -qE '^[0-9]+[mhdMHD]$' || TIMEFRAME="5m"
          printf '%s' "${DAYS}" | grep -qE '^[0-9]+$' || DAYS="2200"
          printf '%s' "${TSB}" | grep -qE '^[0-9]+$' || TSB="12"
          printf '%s' "${TPR}" | grep -qE '^[0-9.]+$' || TPR="2.0"
          printf '%s' "${THR}" | grep -qE '^[0-9.]+$' || THR="0.5"
          # roster is a comma list of strategy names; anything else is dropped, not
          # passed through (an unvalidated value here would be arg injection).
          printf '%s' "${ROSTER}" | grep -qE '^[a-z0-9_,]*$' || ROSTER=""
          printf '%s' "${CLOCKTF}" | grep -qE '^[0-9]+[mhdMHD]$' || CLOCKTF="15m"
          { echo "eh_harness=${HARNESS}"; echo "eh_symbol=${SYMBOL}";
            echo "eh_timeframe=${TIMEFRAME}"; echo "eh_days=${DAYS}";
            echo "eh_tsb=${TSB}"; echo "eh_tpr=${TPR}"; echo "eh_thr=${THR}";
            echo "eh_roster=${ROSTER}"; echo "eh_clocktf=${CLOCKTF}"; } >> "$GITHUB_ENV"

      - name: Set params from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          { echo "eh_harness=${{ inputs.harness }}"; echo "eh_symbol=${{ inputs.symbol }}";
            echo "eh_timeframe=${{ inputs.timeframe }}"; echo "eh_days=${{ inputs.days }}";
            echo "eh_tsb=${{ inputs.time_stop_bars }}"; echo "eh_tpr=${{ inputs.tp_r }}";
            echo "eh_thr=${{ inputs.exit_threshold }}";
            echo "eh_roster=${{ inputs.roster }}";
            echo "eh_clocktf=${{ inputs.clock_tf || '15m' }}"; } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml requests

      - name: Fetch feed (Binance public archive — with taker_buy_base for the OFI feature)
        env:
          BACKTEST_FEED_SOURCE: binance_vision
        run: |
          set -euo pipefail
          mkdir -p data
          case "${eh_timeframe}" in
            *m) INT="${eh_timeframe%m}" ;;
            1h) INT=60 ;; 2h) INT=120 ;; 4h) INT=240 ;;
            1d|1D) INT=D ;; *) INT="${eh_timeframe}" ;;
          esac
          echo "timeframe=${eh_timeframe} -> interval=${INT}"
          python scripts/ops/fetch_backtest_candles.py \
            --symbol "${eh_symbol}" --interval "${INT}" --days "${eh_days}" \
            --output "data/eh_feed.csv"
          echo "feed rows: $(wc -l < data/eh_feed.csv)"; head -2 data/eh_feed.csv

      - name: Build the per-bar in-trade exit panel
        run: |
          set -euo pipefail
          mkdir -p artifacts/research
          ROSTER_ARG=""
          if [ -n "${eh_roster:-}" ]; then
            ROSTER_ARG="--roster ${eh_roster} --clock-tf ${eh_clocktf}"
          fi
          /usr/bin/time -v python scripts/research/build_intrabar_exit_panel.py \
            --harness "${eh_harness}" --data "data/eh_feed.csv" \
            --symbol "${eh_symbol}" --timeframe "${eh_timeframe}" \
            --time-stop-bars "${eh_tsb}" --tp-r "${eh_tpr}" \
            ${ROSTER_ARG} \
            --out artifacts/research/exit_panel.jsonl 2> artifacts/research/build_time.txt
          echo "=== manifest ==="
          python -c "import json;m=json.load(open('artifacts/research/exit_panel.jsonl.manifest.json'));print({k:m.get(k) for k in ('row_count','trades_used','base_hold_rate','dense_feature_cols','error')})"
          tail -3 artifacts/research/build_time.txt || true

      # A verdict computed from an empty panel is VACUOUS, not thin -- and the two are
      # indistinguishable from the outside. Before the analyzer runs, assert the panel
      # actually measured something. (docs/CLAUDE-RULES-CANONICAL.md "Green is not
      # evidence" obligation 1; BL-20260730-RESEARCH-WF-SWALLOWED-FAILURES.)
      - name: Assert the panel is non-empty
        run: |
          set -euo pipefail
          python - <<'PYEOF'
          import json, sys
          m = json.load(open("artifacts/research/exit_panel.jsonl.manifest.json"))
          rows, trades = m.get("row_count") or 0, m.get("trades_used") or 0
          if m.get("error"):
              print(f"::error::panel build reported error: {m['error']}"); sys.exit(1)
          if rows < 1 or trades < 1:
              print(f"::error::panel is EMPTY (rows={rows}, trades={trades}) -- the exit "
                    "head would be graded on nothing. Check the roster actually produced "
                    "trades on this feed/timeframe.")
              sys.exit(1)
          if trades < 30:
              print(f"::warning::only {trades} trades in the panel -- per-regime splits "
                    "will be too thin to grade a cell; treat as indicative only.")
          print(f"OK -- panel has {rows} rows from {trades} trades.")
          PYEOF

      - name: Analyze the exit head
        run: |
          set -euo pipefail
          python scripts/research/analyze_exit_head.py \
            --panel artifacts/research/exit_panel.jsonl \
            --exit-threshold "${eh_thr}" \
            --out artifacts/research/exit_head.json

      - name: Summarize verdict
        run: |
          set -euo pipefail
          python - <<'PYEOF' | tee artifacts/research/VERDICT.md
          import json
          def load(p):
              try: return json.load(open(p))
              except Exception: return {}
          m = load("artifacts/research/exit_panel.jsonl.manifest.json")
          r = load("artifacts/research/exit_head.json")
          reg = r.get("regression", {}); pol = r.get("exit_policy", {}); v = r.get("verdict", {})
          fdr = r.get("fdr", {})
          L = ["# M30×M20 exit-head verdict", ""]
          L.append(f"- panel: **{m.get('harness')}** · rows **{m.get('row_count')}** from "
                   f"{m.get('trades_used')} trades ({m.get('rows_per_trade')}/trade) · "
                   f"base hold rate {m.get('base_hold_rate')} · dense feats {len(m.get('dense_feature_cols') or [])}")
          lc = m.get("label_config", {})
          L.append(f"- label: triple-barrier time_stop={lc.get('time_stop_bars')} tp_r={lc.get('tp_r')} cost_r={lc.get('cost_r')}")
          L.append("")
          L.append("## OOS discrimination (take/skip, uniqueness-weighted, grouped purged WF-CV)")
          if reg.get("computed"):
              L.append(f"- **OOS AUC {reg.get('oos_auc')}** · by fold {reg.get('oos_auc_by_fold')} "
                       f"({reg.get('folds_above_half')}/{reg.get('n_folds_used')} > 0.5)")
              if reg.get("oos_r2_advantage") is not None:
                  L.append(f"- OOS R² (advantage/size head) {reg.get('oos_r2_advantage')}")
              L.append(f"- top importances: {reg.get('permutation_importance_ranked', [])[:5]}")
          else:
              L.append(f"- not computed: {reg.get('note')}")
          L.append(f"- FDR survivors: {fdr.get('survivors') or 'none'}")
          L.append("")
          L.append("## Net-of-fee exit-policy vs the fixed SL/TP")
          if pol.get("computed"):
              L.append(f"- **mean net-R improvement {pol.get('mean_net_r_improvement')}** "
                       f"(head {pol.get('mean_head_r')} vs base {pol.get('mean_baseline_r')} over "
                       f"{pol.get('n_policy_trades')} trades; {pol.get('pct_trades_early_exited')}% early-exited)")
              L.append(f"- head Sharpe {pol.get('head_sharpe')} · PSR {pol.get('head_psr')}")
          else:
              L.append(f"- not computed: {pol.get('note')}")
          L.append("")
          if v:
              L.append(f"## VERDICT — clears_bar: **{v.get('clears_bar')}**  "
                       f"(a: AUC>0.55 stable = {v.get('criterion_a_oos_auc_gt_0_55_stable')}; "
                       f"b: net-R>0 = {v.get('criterion_b_net_r_improvement_positive')})")
              L.append(f"> {v.get('note')}")
          print("\n".join(L))
          PYEOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exit-head-${{ github.run_id }}
          path: |
            artifacts/research/exit_panel.jsonl
            artifacts/research/exit_panel.jsonl.manifest.json
            artifacts/research/exit_head.json
            artifacts/research/VERDICT.md
            artifacts/research/build_time.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Comment verdict on issue
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '_(verdict not produced)_';
            try { body = fs.readFileSync('artifacts/research/VERDICT.md', 'utf8'); } catch (e) {}
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000) + footer,
            });

      # Honest failure/cancelled handler (2026-07-28). Without this the run only
      # ever commented on success(), so a failed/cancelled GH-runner build left a
      # waiting session hanging with NO signal — the exact "waited hours on a
      # dead run" pain. Now every conclusion posts a comment; the
      # claude-run-failure-alert listener also fires a Telegram ping.
      - name: Comment failure/cancellation on issue
        if: github.event_name == 'issues' && (failure() || cancelled())
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const state = process.env.JOB_STATUS === 'cancelled' ? 'cancelled' : 'failed';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔴 **research-exit-head-build ${state}.**\nRun: ${runUrl}\n\n`
                + `This run produced **no verdict** — if you were waiting on it, it is **dead, not still running**. Read the run log, fix the cause, and re-fire the request. A cancel is usually the job time budget (\`timeout-minutes: 330\`) or a manual cancel.\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
            });

  # ---------------------------------------------------------------- landing
  # ⚠️ WITHOUT THIS JOB THIS WORKFLOW'S RESULT EXISTED FOR 14 DAYS AND THEN DID
  # NOT. `Upload artifacts` above sets `retention-days: 14`, and the only other
  # output is an issue comment, which is not queryable. So a run that cost up to
  # 330 minutes of runner time left nothing a later session could grep for —
  # the defect checklist row E5 exists to close, and the one RQ-20260922-007
  # names in its `blocked_on`.
  #
  # A SEPARATE JOB, deliberately, mirroring `e35-bracket-sweep.yml`:
  # `.github/actions/commit-to-main` requires the calling job to check out with
  # the PAT, and giving the long build job write credentials to save a checkout
  # would widen the blast radius of the one job that runs untrusted-ish research
  # code for hours. The build stays read-only; only this job writes.
  #
  # `always()` because a FAILED build is itself a result worth landing —
  # `read_state: producer_failed` is "we looked, and it broke", which is a
  # different and more actionable fact than silence.
  #
  # ⚠️ `always()` ALONE IS WRONG, AND WAS WRONG FROM 2026-09-22 TO 2026-09-24.
  # `on.issues.types: [opened]` above has NO label filter — it fires on EVERY
  # issue opened anywhere in the repo (a diag-request, a system-action, a
  # manager dispatch). `build`'s own `if:` correctly SKIPS on such a run, but
  # `needs.build.result` is then `skipped`, which `exit_head_result.py` cannot
  # tell apart from a real failure (`build_result != "success"` -> the same
  # `producer_failed` verdict either way) — the collapsed-states defect
  # CLAUDE-RULES-CANONICAL.md names: "not applicable" and "ran and broke"
  # sharing one value, and the missing one (not applicable) is silent, not
  # loud. MEASURED 2026-09-24 (E58 inventory): of the 13 open
  # `automation/research-result-*` PRs this workflow had produced, **13 of 13**
  # trace to `build: skipped` on an unrelated issue (a trainer-diag-request, a
  # system-action get-env, a manager dispatch, ...) — zero were a real build
  # that ran and failed. `pr-landing-guard` R5 blocking these from landing
  # (E57) accidentally kept 13 fabricated "research results" off main; this is
  # the fix that stops manufacturing them, not a fix that makes them landable.
  #
  # So `research_result` now runs `always()` — still catching a real build
  # failure/cancel/timeout — but ONLY when the trigger was actually a research
  # request, by repeating `build`'s own gate rather than inventing a second
  # one that could drift from it.
  research_result:
    needs: [build]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' &&
        (github.event.issue.user.login == github.repository_owner ||
         github.event.issue.user.login == 'github-actions[bot]') &&
        contains(github.event.issue.labels.*.name, 'research-exit-head-request')))
    runs-on: ubuntu-latest
    # MUST OUTLAST `commit-to-main`'s `verify-merged` wait (30m default), or the
    # job dies mid-wait and reports a timeout for a PR that was merging fine.
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # REQUIRED by `.github/actions/commit-to-main`: it pushes with a bare
          # `git push origin`, so it uses whatever credential the CHECKOUT
          # configured. Under the default GITHUB_TOKEN the PR it opens never
          # receives its required checks and auto-merge waits forever.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ⚠️ `continue-on-error` IS THE POINT OF THIS JOB, NOT A SWALLOWED
      # FAILURE. When `build` failed there is no artifact to download, and that
      # is exactly the case worth landing: the next step branches on the absence
      # and emits `read_state: producer_failed`. An aborting download would make
      # a broken run silent again, which is the defect this job closes.
      - uses: actions/download-artifact@v4
        id: fetch
        continue-on-error: true
        with:
          name: exit-head-${{ github.run_id }}
          path: collected
      - name: Derive the result record from this run's own output
        id: derive
        env:
          IN_HARNESS: ${{ inputs.harness }}
          IN_SYMBOL: ${{ inputs.symbol }}
          IN_TF: ${{ inputs.timeframe }}
          IN_ROSTER: ${{ inputs.roster }}
          IN_DAYS: ${{ inputs.days }}
          IN_THRESHOLD: ${{ inputs.exit_threshold }}
        run: |
          set -euo pipefail
          # THE MAPPING LIVES IN A SCRIPT WITH ITS OWN `--self-test`, not in a
          # heredoc here. A transform embedded in YAML cannot be tested: nothing
          # can plant a broken producer output and assert this reads the verdict
          # correctly, so the first mis-read would land a wrong record, green.
          # `--self-test` plants eight producer shapes (a pass, a fail, a failed
          # build, a missing artifact, an uncomputed run, a missing `clears_bar`,
          # a missing denominator, and a boolean where a count belongs) and
          # asserts each lands in its OWN state and is ADMISSIBLE to the schema.
          POP="${IN_HARNESS} / ${IN_SYMBOL} ${IN_TF}"
          if [ -n "${IN_ROSTER}" ]; then POP="${POP} roster=${IN_ROSTER}"; fi
          POP="${POP}, trailing ${IN_DAYS}d of candles, exit_threshold=${IN_THRESHOLD}; OOS trades under grouped purged WF-CV"
          # NO `|| true`. A load-bearing step may not swallow its own failure.
          python3 scripts/research/exit_head_result.py \
            --exit-head collected/exit_head.json \
            --manifest collected/exit_panel.jsonl.manifest.json \
            --build-result "${{ needs.build.result }}" \
            --out-dir rr \
            --population "${POP}"

      - name: Land the result on main
        uses: ./.github/actions/research-result
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          research-unit: ${{ inputs.research_unit }}
          power-state: ${{ inputs.power_state }}
          # ⚠️ MIRRORED FROM `scripts/research/exit_head_result.py`, whose
          # DECISION_RULE_ID / DECISION_RULE_REGISTERED_AT constants are the one
          # home. Registered in source before any run — that is what makes it a
          # pre-registration rather than a description of the answer.
          decision-rule-id: RULE-EXIT-HEAD-CLEARS-BAR
          decision-rule-registered-at: '2026-09-22'
          verdict: ${{ steps.derive.outputs.verdict }}
          read-state: ${{ steps.derive.outputs.read_state }}
          population: ${{ steps.derive.outputs.population }}
          n: ${{ steps.derive.outputs.n }}
          measurement-file: rr/measurement.json
          # ⚠️ THE STORE IS THE RESULT RECORD ITSELF, AND SAYING SO IS THE
          # HONEST ANSWER RATHER THAN NAMING A CORPUS THIS WORKFLOW DOES NOT
          # WRITE. This workflow `git add`s nothing: its panel and head JSON are
          # a 14-day run artifact. § "A MEASURED must say WHERE THE MEASUREMENT
          # LIVES" is explicit that an unreachable measurement is marked as
          # such. The headline numbers are embedded in `measurement` above and
          # ARE durable; the full panel is not.
          artifact-store: research/results/
          artifact-locator: >-
            the `measurement` block on this record. The full panel
            (`exit_panel.jsonl`, `exit_head.json`, `VERDICT.md`) is an expiring
            run artifact — MEASURED (source not durably retrievable: uploaded
            with retention-days 14 and never committed).
          # ⚠️ READ OFF THE BUILD JOB'S OWN `run:` LINES (199 and 236), not
          # guessed from the workflow's name. The first draft of this line named
          # a `build_exit_panel.py` that does not exist in this repo.
          tool: scripts/research/build_intrabar_exit_panel.py + scripts/research/analyze_exit_head.py
