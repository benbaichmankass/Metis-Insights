name: Soak-doctrine guard

# Fails the PR check if the "offline edge, live mechanics" soak doctrine is
# weakened — either the binding rule is removed from CLAUDE-RULES-CANONICAL.md,
# the new-strategy skill stops framing the soak as a MECHANICS check, or a
# soak-doctrine skill reintroduces the banned "days–weeks soak-to-prove-edge"
# idiom. See scripts/check_soak_doctrine.py and CLAUDE-RULES-CANONICAL.md
# § "Promotion evidence — offline edge, live mechanics".
#
# Whole-file invariant check (not diff-based): enforced on every PR regardless
# of what changed, so the doctrine cannot silently drift back in an unrelated
# edit. Required status check — no `paths:` filter (would strand it "pending").

on:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  soak-doctrine-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the soak doctrine is intact
        run: |
          python scripts/check_soak_doctrine.py
