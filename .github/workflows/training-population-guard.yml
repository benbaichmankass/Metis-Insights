name: Training-population guard

# Preventer (not a detector): fails the PR when a journal-decision family
# (trade_outcomes / setup_labels / conviction_meta) trains LIVE-ONLY — i.e. its
# build_trainer_datasets.sh build does not pass the augmentation marker
# (`include_backtest`) — without an explicit reasoned augmentation_exempt or a
# ratcheting augmentation_debt entry; or when augmentation_debt exceeds its
# (down-only) ceiling; or when a family is wired for augmentation but left parked
# in debt (the ratchet forcing function).
#
# Root cause it exists for (BL-20260731-BACKTEST-AUGMENTATION-NEVER-FED /
# MB-20260530-001): the per-trade backtest-augmentation infra was fully built yet
# `trades.is_backtest=1` count was ZERO in every month — the pooled decision-
# family builds never passed the augmentation, so every "blocked on labels"
# conclusion was reached without it, and successive sessions re-derived the wall.
# See scripts/check_training_population.py + docs/training-population-matrix.md +
# config/training_population.yaml.
#
# REQUIRED status check — no `paths:` filter (would leave the check permanently
# "pending" on a non-matching PR); it is cheap (stdlib + pyyaml, no diff).

on:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  training-population-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run training-population guard
        run: python scripts/check_training_population.py --check

      - name: Verify the training-population matrix is up to date
        run: |
          python scripts/check_training_population.py --matrix
          if ! git diff --quiet -- docs/training-population-matrix.md; then
            echo "::error::docs/training-population-matrix.md is stale — run "
            echo "  python scripts/check_training_population.py --matrix"
            echo "and commit the result."
            git --no-pager diff -- docs/training-population-matrix.md
            exit 1
          fi
