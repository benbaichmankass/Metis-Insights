name: trainer-vm-diag

# Full-visibility diag relay for the trainer VM (158.178.209.121).
#
# The trainer VM is fully autonomous Claude territory
# (docs/claude/trainer-vm-mode.md § 3 + § 9). Claude may open
# issues with this label at any time, without operator approval,
# to pull any log, run any read or diagnostic command, or inspect
# any training artifact on the VM.
#
# Two trigger paths:
#
#   1. workflow_dispatch — operator or Claude clicks "Run workflow".
#      cmd input is the bash command to run on the trainer VM.
#      Result is shown in run logs + uploaded as artifact.
#
#   2. issues.opened with label `trainer-vm-diag-request` **OR
#      `trainer-vm-heavy-request`** — the fully automated path.
#
#      BOTH labels run THIS job, deliberately. `trainer-vm-heavy-request`
#      was created by bootstrap-labels.yml, enforced by
#      `.claude/hooks/vm_lane_guard.sh` (which DENIES an issue_write
#      carrying it without a fresh VM-lane claim marker), named by
#      session-coordination/SKILL.md § 2b as the label a HEAVY trainer
#      job must use — and consumed by NOTHING. A heavy job dispatched
#      exactly as the skill instructs opened an issue, returned an id,
#      and was silently discarded: no run, no comment, no failure.
#
#      That is the SILENT-SUCCESS shape, which is worse than an error,
#      because the guard PASSING reads as confirmation the dispatch was
#      well-formed. Measured cost (2026-08-16, issue #9638): a trainer
#      re-prioritisation sat dead for ~50 minutes while the box burned
#      that time on legs in none of the operator's queued decisions, and
#      the session had already reported the work as done on the
#      coordination board. Re-fired under `trainer-vm-diag-request` as
#      #9662 it ran immediately. Filed TWICE in the health backlog by two
#      different sessions before it was fixed.
#
#      The VM-lane FIFO is a BOARD convention, not a workflow feature, so
#      the two labels need no behavioural difference here — the heavy one
#      exists to trip the claim guard, and it must still RUN.
#
#      Issue body must contain a `cmd:` line:
#
#        cmd: journalctl -u ict-trainer.service -n 100
#
#      Multi-line commands use a fenced block:
#
#        cmd: |
#          cd /home/ubuntu/ict-trading-bot
#          tail -n 200 runtime_logs/trainer/dataset_builds.jsonl
#
#      The workflow SSHes into the trainer VM, runs the command via
#      stdin (no shell interpolation of the command string), posts
#      the output as an issue comment, and closes the issue.
#
# Required repo secrets:
#   * VM_SSH_KEY         — SSH private key; must be authorized on
#                          the trainer VM's ubuntu account.
#
# Required repo variables (or hardcoded defaults):
#   * TRAINER_VM_IP      — defaults to 158.178.209.121
#   * TRAINER_VM_USER    — defaults to ubuntu
#
# Required repo label:
#   * trainer-vm-diag-request — created by bootstrap-labels.yml

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "Bash command to run on trainer VM"
        required: true
        default: "systemctl status ict-trainer.service"
  issues:
    # 2026-06-08: added `labeled` as a fallback for the dropped-webhook
    # failure mode (mirrors vm-diag-snapshot.yml). Dedup step below
    # `opened` only (2026-06-10): listening to both `opened` and `labeled`
    # spawned two runs per create-with-label dispatch. `opened` alone (label
    # checked in the job `if:`) spawns exactly one; the dedup step stays as a
    # belt-and-suspenders no-op.
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  # 2026-07-04 (BL-20260611-002): PER-ISSUE group, mirroring
  # vm-diag-snapshot.yml — the shared group dropped queued bursts
  # (GitHub keeps at most one PENDING run per group regardless of
  # cancel-in-progress). Per-issue keying lets independent requests run
  # concurrently while the ``opened``+``labeled`` double-fire on ONE
  # issue (issue #3000 race) still shares a group, queues serially, and
  # is short-circuited by the dedup step (2026-06-08).
  #
  # This per-issue keying is CORRECT and deliberate: quick read-only pulls
  # must run in parallel and must never be dropped. It does NOT serialize
  # HEAVY jobs on the single 1-OCPU trainer VM, and it CANNOT — GitHub
  # concurrency keeps at most one PENDING run per group, so a true FIFO queue
  # of depth > 1 is impossible at this layer (that limitation is exactly why
  # the shared group dropped bursts). Cross-session serialization of heavy VM
  # work is therefore an APPLICATION-level FIFO on the coordination board
  # (issue #6927) — the `🔒 VM-LANE CLAIM` / `🔓 VM-LANE RELEASE` protocol,
  # mirroring the merge queue — NOT a concurrency group here. Full contract:
  # docs/claude/vm-resource-management.md + docs/claude/coordination-board.md.
  group: trainer-vm-diag-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  diag:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       (contains(github.event.issue.labels.*.name, 'trainer-vm-diag-request') ||
        contains(github.event.issue.labels.*.name, 'trainer-vm-heavy-request')))
    runs-on: ubuntu-latest
    # 2026-07-28: raised 10 -> 60. A 10-min cap silently killed legitimate heavy
    # trainer reads (a deep multi-year backtest / k-fold, a dataset build) at
    # exactly 10 min — and because a job-timeout renders as `cancelled()`, the
    # cancellation handler below FALSELY reported "preempted by a newer diag
    # request" (issues #7815/#7816/#7829). That false message was the entire
    # source of the "newest-wins preemption" mental model; there is no sibling
    # preemption (concurrency is per-issue, cancel-in-progress:false). The SSH
    # keepalive (ServerAliveInterval=30 x CountMax=10) still bounds a genuinely
    # DEAD link to ~5 min regardless, so a longer job cap only extends a run that
    # is actually alive and producing keepalive traffic. Jobs expected to run
    # longer than ~an hour (a full training cycle, an hours-long sweep) MUST be
    # dispatched DETACHED (nohup ... & + a sentinel file) and polled via a
    # follow-up relay, NOT held synchronously in this SSH session — see
    # docs/claude/trainer-vm-mode.md § 10 + docs/claude/vm-resource-management.md.
    # And CPU-heavy work that needs NO VM-resident state (a public-feed fetch +
    # a backtest over it) should run on a FREE GitHub-hosted runner
    # (research-exit-head-build.yml pattern), not this scarce 1-OCPU relay.
    timeout-minutes: 60
    steps:
      - name: Dedup — bail if a bot comment already exists (2026-06-08)
        if: github.event_name == 'issues'
        id: dedup
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const hasBotComment = comments.some(
              c => c.user && c.user.login === 'github-actions[bot]'
            );
            if (hasBotComment) {
              core.notice(
                `Issue #${context.issue.number} already has a github-actions[bot] ` +
                `comment — skipping the duplicate labeled-fire cleanly.`
              );
              core.setOutput('skip', 'true');
            } else {
              core.setOutput('skip', 'false');
            }

      - name: Parse command from issue body
        id: parse
        if: github.event_name == 'issues' && steps.dedup.outputs.skip != 'true'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # Extract everything between the first `cmd:` line and the
          # next sibling top-level key (e.g. `reason:`). Without the
          # second termination rule, an issue body shaped like
          #   cmd: |
          #     <multi-line script>
          #   reason: |
          #     <prose>
          # leaks `reason:` + its body into bash, producing harmless
          # "command not found" lines after the real script runs (BL-
          # 20260607-002, observed in trainer-vm-diag issue #2951).
          # Supports single-line:   cmd: journalctl -n 100
          # Supports fenced block:  cmd: |
          #                           line1
          #                           line2
          #   reason: ...           ← extractor stops at this line
          cmd_raw="$(printf '%s' "${ISSUE_BODY}" | \
            awk '
              /^cmd:/{
                found=1
                sub(/^cmd:[[:space:]]*/,"")
                # `|`, and the chomping variants `|-` / `|+`, all introduce a
                # YAML block scalar. Record that, because the terminator rule
                # below applies ONLY to that form — a single-line `cmd: foo`
                # keeps its existing semantics untouched.
                if ($0 ~ /^\|/) { block_scalar=1; next }
                if ($0!="") print
                next
              }
              # Stop at the next unindented top-level YAML-ish key
              # (alpha/digit/_/-, then `:`). Indented lines (with a
              # leading space or tab) are part of the cmd block and
              # continue to print.
              #
              # ⚠️ NOT INSIDE A FENCE. Within a fenced block the content is
              # CODE, not YAML, and a great many code lines legitimately begin
              # `word:` at column 0 — `try:` / `else:` / `except:` / `finally:`
              # in an embedded python heredoc, a shell `case` label, a jq or
              # awk snippet. Applying a YAML-key terminator to them truncates
              # the command MID-SCRIPT.
              #
              # The danger is not the truncation, it is that the PREFIX STILL
              # RUNS: a cut landing on a complete statement returns plausible
              # output and exit 0 with the remainder silently gone, so a
              # partial answer is indistinguishable from a complete one. That
              # is the class this repo calls an unasserted denominator.
              # Measured 2026-08-30 on trainer-diag #10452, whose embedded
              # `try:` cut the script at line 15; it errored only by luck of
              # landing mid-heredoc (BL-20260830-TRAINERDIAG-FENCED-KEY-TRUNC).
              #
              # A fenced block already has an unambiguous terminator — its
              # closing fence, handled below — so this rule is not needed
              # there. Unfenced blocks are unaffected and still stop here
              # (BL-20260607-002).
              found && !fence && /^[A-Za-z0-9_-]+:/{
                exit
              }
              # Track fence state across the WHOLE body, so a `cmd:` written
              # inside an already-open fence is handled the same as one that
              # opens its own.
              /^[[:space:]]*```/{
                fence = 1 - fence
                # Strip the fence line itself so a fenced cmd body does not
                # leak it into bash — an un-stripped ```bash line runs as the
                # command ``` (error) and any backticks in the body get
                # command-substituted (BL-20260720-TRAINERDIAG-FENCE).
                #
                # A CLOSING fence (1 -> 0) while inside the cmd block ENDS it.
                # Without this the extractor ran off the end of the block and
                # fed the trailing prose to bash: issue #8157 executed its own
                # "Expected from the dry run..." paragraph, producing
                # `Expected: command not found` after the real work. Harmless
                # there, but a body that reads as documentation must never
                # execute as code (BL-20260731-TRAINERDIAG-TRAILING-PROSE).
                if (found && fence == 0) exit
                next
              }
              # The GENERAL terminator for a `|` block, and the reason the two
              # above are not enough. They end the block at a closing fence
              # (#8157) and at the next top-level `key:` (BL-20260607-002) —
              # two layouts. An unfenced block whose trailing prose is an
              # ordinary sentence matched NEITHER and ran off the end into
              # bash: trainer-diag #9400 executed its own explanatory paragraph
              # and returned `Three: command not found`, the #8157 shape
              # recurring 15 days after it was declared fixed.
              #
              # YAML already defines the rule: block-scalar content MUST be
              # indented, so the first non-indented non-empty line ends it,
              # whatever that line looks like. A blank line does NOT (it is a
              # legal blank inside the block), and a fence line never reaches
              # here because the fence rule above consumes it.
              block_scalar && !fence && /^[^ \t]/ && NF { exit }
              found { print }
            ' )"
          if [ -z "${cmd_raw}" ]; then
            echo "::error::Issue body must contain a 'cmd:' line."
            exit 1
          fi
          # Write to a file to avoid length limits in env vars.
          printf '%s\n' "${cmd_raw}" > /tmp/trainer_diag_cmd.sh
          echo "cmd_present=true" >> "$GITHUB_OUTPUT"

      - name: Use dispatch command
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_CMD: ${{ inputs.cmd }}
        run: printf '%s\n' "${DISPATCH_CMD}" > /tmp/trainer_diag_cmd.sh

      - name: Set up SSH key
        if: steps.dedup.outputs.skip != 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY}" ]; then
            echo "::error::VM_SSH_KEY secret is unset."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key
          chmod 600 ~/.ssh/trainer_key
          ssh-keyscan -t ed25519,ecdsa,rsa "${TRAINER_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run command on trainer VM
        if: steps.dedup.outputs.skip != 'true'
        env:
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          # Send the command file via stdin — command string is never
          # interpolated in the SSH invocation, so issue body can't
          # inject shell metacharacters.
          # ServerAlive* keepalives: a long-running trainer command (a full
          # dataset build, a training cycle) can be silent for minutes; without
          # keepalives the SSH session is torn down mid-run and the relay reports
          # a spurious empty/failed result (BL-20260721-TRAINERDIAG-SILENT-SSH-DROP).
          # 30s x 10 = tolerate ~5 min of silence before declaring the link dead.
          ssh -i ~/.ssh/trainer_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "${TRAINER_USER}@${TRAINER_IP}" \
              'bash -s' < /tmp/trainer_diag_cmd.sh \
              > /tmp/trainer_diag_output.txt 2>&1 || true
          wc -c /tmp/trainer_diag_output.txt

      - name: Print output (run-log preview)
        if: steps.dedup.outputs.skip != 'true'
        run: |
          bytes="$(wc -c < /tmp/trainer_diag_output.txt)"
          echo "=== trainer-vm-diag output (${bytes} bytes) ==="
          head -c 8000 /tmp/trainer_diag_output.txt
          if [ "${bytes}" -gt 8000 ]; then
            echo "... (truncated — full output in artifact / issue comment)"
          fi

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch' && steps.dedup.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trainer-vm-diag-${{ github.run_id }}
          path: /tmp/trainer_diag_output.txt
          retention-days: 7
          if-no-files-found: error

      - name: Post result to issue
        if: github.event_name == 'issues' && steps.dedup.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('/tmp/trainer_diag_output.txt', 'utf8');
            const cmd = fs.readFileSync('/tmp/trainer_diag_cmd.sh', 'utf8').trim();
            const MAX = 55_000;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // The echoed command is display-capped, and the cap MUST announce
            // itself. It did not until 2026-08-30: `cmd.slice(0, 500)` rendered
            // a silent, unmarked prefix under the label `**Command:**`, while
            // the OUTPUT immediately below it carried an explicit
            // "(first N of M bytes)" + "... (truncated)". So the one field a
            // reader uses to check WHAT RAN was the one field that lied, and a
            // long command's echo ended mid-token with nothing saying why.
            //
            // That cost a real misdiagnosis: BL-20260807-TRAINER-DIAG-RELAY-
            // SILENT-CMD-TRUNCATION read a mid-token echo as evidence the
            // EXECUTION had been cut and proposed hunting a length boundary
            // with "a ladder of increasing cmd: lengths" — a search for a cap
            // that does not exist on the execution path. Measured 2026-08-30 on
            // #10452: the echo ended at exactly 499 chars, byte-for-byte where
            // a 500-char slice lands. The execution truncation in that case was
            // a different bug entirely (the column-0 `word:` rule above).
            //
            // A display cap is fine; an unlabelled one is an unprovenanced
            // diagnostic. Say so, and say how much was hidden.
            const CMD_ECHO_MAX = 500;
            const cmdEcho = cmd.length <= CMD_ECHO_MAX
              ? cmd
              : cmd.slice(0, CMD_ECHO_MAX)
                + `\n... (echo truncated for display — showing first ${CMD_ECHO_MAX} of `
                + `${cmd.length} chars; the FULL command was executed)`;
            const header = [
              `**trainer-vm-diag** result`,
              `Run: ${runUrl}`,
              ``,
              `**Command:**`,
              '```bash',
              cmdEcho,
              '```',
              ''
            ].join('\n');
            const body = out.length <= MAX
              ? header + '\n**Output:**\n```\n' + out + '\n```'
              : header + `\n**Output** (first ${MAX} of ${out.length} bytes — full output in run artifact):\n\`\`\`\n` + out.slice(0, MAX) + '\n... (truncated)\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Post failure note to issue
        if: github.event_name == 'issues' && failure() && steps.dedup.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          # Empty unless the parse step reached its success line — this is what
          # lets the comment below distinguish a pre-SSH request rejection from
          # a genuine VM/infra failure.
          CMD_PRESENT: ${{ steps.parse.outputs.cmd_present }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Branch on WHERE it failed instead of listing every cause at once.
            // The old comment named "SSH timeout (VM down?)" alongside
            // "malformed cmd: block" — but the parse step runs BEFORE the SSH
            // key is even installed, so on a parse rejection no VM contact is
            // attempted and the infra causes are all impossible. Its sibling
            // relay (vm-diag-snapshot) produced exactly this false "VM down"
            // diagnosis twice in one session, and it reached the coordination
            // board (BL-20260730-DIAG-RELAY-FAILURE-COMMENT-MISLEADING). A
            // failure message that guesses a cause the run never tested is the
            // same defect class as a diagnostic that mislabels a number.
            const parsed = process.env.CMD_PRESENT === 'true';
            const body = parsed
              ? `❌ **trainer-vm-diag failed.**\nRun: ${runUrl}\n\nThe \`cmd:\` block parsed fine, so this is an infrastructure failure ` +
                `**after** the request was accepted. Likely: VM_SSH_KEY unset/malformed, SSH timeout (trainer VM down or rebooting), ` +
                `or the command itself exited non-zero on the VM. The run log's "Run command on trainer VM" step has the real error.`
              : `❌ **trainer-vm-diag failed — MALFORMED REQUEST, not a VM outage.**\nRun: ${runUrl}\n\n` +
                `The issue body carried no parseable \`cmd:\` block, so the run failed **before the SSH key was installed**. ` +
                `This says **nothing** about whether the trainer VM is up.\n\n` +
                `The command is read from the issue **BODY** (the title is display-only). Example body:\n\n` +
                "```\ncmd: |\n  systemctl is-active ict-trainer.service\n  tail -n 50 ~/trainer.log\n```\n\n" +
                `See the exact rejection in the run log's "Parse command from issue body" step.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });

      - name: Post cancellation note to issue
        if: github.event_name == 'issues' && cancelled() && steps.dedup.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          # HONEST cancellation copy (2026-07-28). This step fires on ANY
          # `cancelled()` — and the overwhelmingly common cause is the job
          # exceeding `timeout-minutes` (GitHub renders a job-timeout as a
          # cancel), NOT a newer diag request. Concurrency here is PER-ISSUE
          # (cancel-in-progress:false), so a sibling request CANNOT cancel this
          # run. The old "preempted by a newer diag request" copy was false and
          # seeded a whole "newest-wins" myth — do not reintroduce it.
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⏹ **trainer-vm-diag cancelled.**\nRun: ${runUrl}\n\n`
                + `Most likely cause: the job hit its **time budget** (\`timeout-minutes: 60\`) — a long synchronous read/backtest ran past the cap — or it was manually cancelled. **This was NOT preempted by another diag request** (concurrency is per-issue; a sibling request cannot cancel this run).\n\n`
                + `If you were waiting on this: it is **dead, not still running** — re-diagnose, don't just re-open. Fixes:\n`
                + `- CPU-heavy work that needs **no VM-resident state** (a public-feed fetch + a backtest over it) → run it on a **free GitHub-hosted runner** (\`research-exit-head-build.yml\` pattern), not this scarce 1-OCPU relay. See \`docs/claude/vm-resource-management.md\`.\n`
                + `- A genuinely long VM-resident job (training cycle, hours-long sweep) → dispatch it **detached** (\`nohup … & \` + a sentinel file) and poll via a follow-up relay, not held in one SSH session.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
