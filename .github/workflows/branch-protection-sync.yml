name: branch-protection-sync

# Idempotently PUTs the branch-protection spec on `main` whenever this
# workflow runs. The required-status-checks contexts are hardcoded
# below — the source of truth for which checks gate `main` lives in
# this file. To add or remove a required check, edit the
# `required_contexts` list, commit, push to main; this workflow runs
# automatically and applies the change.
#
# **One-time operator setup (per repo):**
#   1. Create a fine-grained PAT scoped to ONLY this repo with the
#      "Administration: write" permission. (Settings → Developer
#      settings → Personal access tokens → Fine-grained tokens.)
#   2. Add it as a repo secret named `BRANCH_PROTECTION_TOKEN`
#      (Settings → Secrets and variables → Actions → New repository
#      secret).
# After that, every change to the required-checks list ships as a
# normal git commit — no Colab, no notebook, no UI clicks.
#
# Why a PAT and not the default `GITHUB_TOKEN`: GitHub's
# `GITHUB_TOKEN` cannot grant `administration:write` even when the
# workflow declares it under `permissions:`. Branch protection
# mutations require a PAT (fine-grained or classic) with admin scope.
#
# The `notebooks/operator/update_branch_protection.ipynb` notebook
# stays in the repo as a manual fallback — useful if this workflow
# breaks or the operator needs to reset protection from a clean
# state — but is not part of the regular flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the PAT secret is configured
        id: token_check
        env:
          TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          # FAIL RED when the secret is missing (P2.3, 2026-07-31 audit).
          # The skip-don't-fail bootstrap behaviour was right while
          # protection wasn't set up yet; protection has been LIVE and
          # load-bearing since 2026-07-30 (bp-report #8177: 11 contexts,
          # enforce_admins) — from here on, a silently-dropped/rotated-out
          # PAT would let the protection spec drift while this workflow
          # stayed green, which is exactly the fail-open the audit flagged.
          # Secrets are not available in `if:` expressions, so the gate
          # rides a step output.
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::BRANCH_PROTECTION_TOKEN secret is MISSING — branch protection can no longer be synced and will drift from this file. Re-create the fine-grained PAT (Administration: write, this repo only) and set the secret; see the workflow header. Failing RED (protection is live and load-bearing since 2026-07-30; silent skip was only correct during bootstrap)."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::BRANCH_PROTECTION_TOKEN is set; proceeding to sync."
          fi

      - name: PUT branch protection on main
        if: steps.token_check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          # Hardcoded source of truth for required status checks.
          # To change: edit this list, commit, push. Each entry MUST
          # equal the corresponding workflow's job ID (verified
          # 2026-05-21 against .github/workflows/*.yml job IDs).
          #
          # pytest-run executes the full test suite. Promoted from
          # advisory to required on 2026-05-22 once its baseline went
          # green on main: #1658-1667 cleared the failure backlog, #1681
          # the order-dependent + post-IB-merge regressions, and #1717
          # the non-root sudo-stub fix that was failing only on the CI
          # runner. See pytest-run.yml header.
          # provenance-consumer-guard promoted to REQUIRED on 2026-07-30, in the
          # same PR that made it green: a provenance signal with a writer and no
          # consumer is what let +$247,683.78 of mark-price PnL accumulate
          # unnoticed through several clean line-by-line audits. Advisory-only
          # would reproduce the exact failure it exists to prevent — a signal
          # everyone can walk past. Its four previously-write-only keys
          # (pnl_source / exit_reason_source / close_exec_type /
          # unrealizedPnlSource) all gained real consumers in that PR, so it is
          # green on merge, NOT waivered green.
          # diagnostic-provenance-guard promoted to REQUIRED on 2026-07-30, same
          # reasoning one level up: provenance-consumer-guard asks whether a
          # STORED value's provenance is read; this asks whether a HUMAN-FACING
          # diagnostic states the derivation of what it printed. Advisory-only
          # is self-defeating for both — a check everyone can walk past is the
          # failure mode, not the mitigation.
          #
          # Green on merge, NOT waivered green: it has run and passed on every
          # push to this PR, it is diff-scoped (pre-existing sites grandfathered,
          # same contract as silent-empty-guard), and — the part that matters for
          # trusting a green — the workflow SELF-TESTS its own failure path on
          # every run, feeding the guard a known-bad diagnostic and failing the
          # job unless it returns exit 1. A guard whose failure path is never
          # exercised is exactly the "green that checked nothing" this defect
          # class is about.
          # layer-guard / json-extract-guard / soak-doctrine-guard /
          # artifact-validity-guard promoted to REQUIRED on 2026-07-31 (P2.1 of
          # the full-system-audit plan): all four run on every PR (no `paths:`
          # filter, so no permanently-pending trap), all four carry the
          # merge_group trigger, and all four were green on the audit-era PRs
          # (#8163/#8185) — green on merge, not waivered green. artifact-validity
          # is the direct preventer for the vacuous-artifact class
          # (BL-20260730-M1-PRICE-JOIN-DEAD); advisory-only reproduces the
          # walk-past failure mode it exists to stop. NOTE its context is
          # "artifact-validity-guard" — the job id was renamed from the
          # ambiguous "guard" in the same PR that promoted it.
          # 2026-08-06 — CI fan-out consolidation.
          # BL-20260806-CI-FANOUT-AMPLIFIES-ACTIONS-OUTAGES (kept on ONE line: a
          # tracking id wrapped across two comment lines resolves to nothing and
          # check_backlog_refs.py correctly calls it a dangling reference).
          # The 13 individual guard contexts that used to be
          # required are now ONE context, `guards`, because all 30 fast static
          # guards run in one job (.github/workflows/guards.yml, registry in
          # scripts/ci/run_guards.py). The retired contexts were:
          #   secret-scan · ruff-lint · dry-run-guard · env-gate-guard ·
          #   silent-empty-guard · canonical-config-loaders · canonical-db-resolver ·
          #   provenance-consumer-guard · diagnostic-provenance-guard · layer-guard ·
          #   json-extract-guard · soak-doctrine-guard · artifact-validity-guard
          # Each still runs, with the same command and the same relevance
          # condition — only the packaging changed. This list MUST be updated in
          # the SAME commit that deletes those workflows: a required context whose
          # workflow no longer exists is never reported, so every PR would hang
          # "Expected — Waiting for status to be reported" forever with no way to
          # merge. That failure mode is why this edit is not a follow-up.
          # pytest-collect / pytest-run stay separate contexts (the test suite is a
          # different kind of check, and long enough that folding it in would
          # serialise every guard behind it).
          REQUIRED_CONTEXTS='["pytest-collect","pytest-run","guards"]'

          # Use the CURRENT canonical repo path from the Actions context, NOT a
          # hardcoded owner/repo. The 2026-07-23 rename (ict-trading-bot ->
          # Metis-Insights) made the hardcoded `repos/benbaichmankass/ict-trading-bot`
          # path 301-redirect, and neither the GET nor the PUT curl follows
          # redirects (no `-L`), so this workflow started FAILING on every push to
          # main with `GET protection returned HTTP 301: Moved Permanently`
          # (BL-20260728-BRANCHPROT-RENAME-301 — a real bug, not the "admin-token
          # noise" it was first guessed to be). ${{ github.repository }} resolves
          # to the live canonical name, so the redirect never happens and any
          # residual PAT/scope issue surfaces cleanly instead of being masked.
          BRANCH="main"
          API="https://api.github.com/repos/${{ github.repository }}/branches/${BRANCH}/protection"

          # GET current protection so we can preserve any existing
          # PR-review / restrictions / admin-enforcement values that
          # this workflow does not own.
          curl_get=$(mktemp)
          http_code=$(curl -sS -o "$curl_get" -w '%{http_code}' \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API")

          if [ "$http_code" = "200" ]; then
            ENFORCE_ADMINS=$(jq -r '.enforce_admins.enabled // false' "$curl_get")
            REVIEW_ENFORCE=$(jq -c '.required_pull_request_reviews // null' "$curl_get")
            RESTRICTIONS=$(jq -c '.restrictions // null' "$curl_get")
            LINEAR_HISTORY=$(jq -r '.required_linear_history.enabled // false' "$curl_get")
            ALLOW_FORCE=$(jq -r '.allow_force_pushes.enabled // false' "$curl_get")
            ALLOW_DELETE=$(jq -r '.allow_deletions.enabled // false' "$curl_get")
            echo "::notice::Existing protection found; preserving non-status-checks fields."
          elif [ "$http_code" = "404" ]; then
            ENFORCE_ADMINS=false
            REVIEW_ENFORCE=null
            RESTRICTIONS=null
            LINEAR_HISTORY=false
            ALLOW_FORCE=false
            ALLOW_DELETE=false
            echo "::notice::No existing protection on ${BRANCH}; creating from scratch."
          else
            echo "::error::GET protection returned HTTP ${http_code}:"
            cat "$curl_get"
            exit 1
          fi
          rm -f "$curl_get"

          # 2026-05-21: enforce required checks on admins too. Without
          # this, repo admins — and admin-scoped API merges, which is how
          # every merge in this repo actually happens — bypass required
          # status checks entirely, leaving REQUIRED_CONTEXTS above
          # cosmetic. Forcing true is what makes "checks gate merges"
          # real. Emergency-merge escape hatch: temporarily set this to
          # false (or toggle Settings → Branches) and push to main.
          ENFORCE_ADMINS=true

          BODY=$(jq -n \
            --argjson contexts "$REQUIRED_CONTEXTS" \
            --argjson enforce_admins "$ENFORCE_ADMINS" \
            --argjson review "$REVIEW_ENFORCE" \
            --argjson restrictions "$RESTRICTIONS" \
            --argjson linear "$LINEAR_HISTORY" \
            --argjson force "$ALLOW_FORCE" \
            --argjson delete "$ALLOW_DELETE" \
            '{
              required_status_checks: { strict: true, contexts: $contexts },
              enforce_admins: $enforce_admins,
              required_pull_request_reviews: $review,
              restrictions: $restrictions,
              required_linear_history: $linear,
              allow_force_pushes: $force,
              allow_deletions: $delete
            }')

          curl_put=$(mktemp)
          put_code=$(curl -sS -o "$curl_put" -w '%{http_code}' \
            -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$BODY" \
            "$API")

          if [ "$put_code" != "200" ]; then
            echo "::error::PUT protection returned HTTP ${put_code}:"
            cat "$curl_put"
            rm -f "$curl_put"
            exit 1
          fi

          FINAL=$(jq -c '.required_status_checks.contexts' "$curl_put")
          echo "::notice::Branch protection updated. Required contexts now: ${FINAL}"
          rm -f "$curl_put"
