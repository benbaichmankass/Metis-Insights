name: econ-event-study

# ROADMAP_MACRO M1 — the economic-surprise → forward-price event study.
#
# The M1 gate wants a CLEAN JOINED DATASET: point-in-time release history joined to
# the traded price series so M2 can calibrate surprise → forward returns. The
# calendar/consensus/surprise half is landed daily by econ-calendar-produce.yml
# (comms/macro/econ_calendar_snapshots.jsonl). This workflow is the JOIN: it fetches
# the daily-close price panels off-VM (yfinance→Stooq, keyless) and runs
# scripts/macro/econ_event_study.py — IC(H)=Spearman(surprise, forward return) across
# trading-day horizons — then lands the scorecard.
#
# OBSERVE-ONLY: reads the PIT snapshots + prices, writes a scorecard JSON. No order
# path, no live-VM mutation. The price fetch runs on the hosted runner (never the
# live trading VM) exactly like the M28 macro-candle backfill.
#
# HONEST small-n: the free calendar feeds start with a shallow PIT-consensus window,
# so the scorecard verdict caps at `insufficient_history` until enough releases
# accrue. The cadence is WEEKLY (the study only moves as new releases land — a daily
# run would re-land an identical scorecard).
#
# HOW IT LANDS ON PROTECTED main: checks out with the BRANCH_PROTECTION_TOKEN PAT and
# hands off to ./.github/actions/commit-to-main (PAT-authored auto-merge PR — same as
# econ-calendar-produce / the macro-*-backfill cluster).
#
# Triggers:
#   1. schedule          — weekly, Sunday 23:10 UTC (after the week's prints landed).
#   2. workflow_dispatch — operator "Run workflow".
#   3. issues.opened w/ label `econ-event-study-now` — Claude-driven (owner only).
#
# Tier-1: observability producer.

on:
  schedule:
    - cron: "10 23 * * 0"
  workflow_dispatch:
    inputs:
      kinds:
        description: "CSV of event kinds to study (blank = the two energy defaults)"
        default: ""
      snapshots:
        description: "PIT snapshots JSONL (blank = the forward producer's file)"
        default: ""
      start:
        description: "Price-panel start date"
        default: "2005-01-01"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: econ-event-study
  cancel-in-progress: false

jobs:
  study:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'econ-event-study-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 47
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        # yfinance is the PRIMARY price feed, not an optional extra. It was missing
        # here, so `_resolve_fetchers` caught the ImportError and silently degraded to
        # Stooq on every run — half of why the study never joined a bar
        # (BL-20260730-M1-PRICE-JOIN-DEAD).
        run: python -m pip install --upgrade pip "pyyaml>=6.0" "yfinance>=0.2.40" "pandas>=2.0"

      # Resolve kinds -> symbols from the SAME map the study uses, so the fetch can
      # never silently omit a panel the study will then ask for. Previously both the
      # kind list and the symbol list were hardcoded to the two energy cases and had
      # to be kept in sync by hand.
      - name: Resolve kinds + symbols
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          IN_KINDS: ${{ github.event.inputs.kinds }}
          IN_SNAPS: ${{ github.event.inputs.snapshots }}
          IN_START: ${{ github.event.inputs.start }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF' >> "$GITHUB_ENV"
          import importlib.util, os, re
          spec = importlib.util.spec_from_file_location(
              "ees", "scripts/macro/econ_event_study.py")
          ees = importlib.util.module_from_spec(spec); spec.loader.exec_module(ees)

          def from_body(field, default=""):
              body = os.environ.get("ISSUE_BODY") or ""
              m = re.search(rf'^{field}:\s*(.+)$', body, re.I | re.M)
              return (m.group(1).strip() if m else "") or default

          kinds = (os.environ.get("IN_KINDS") or from_body("kinds")
                   or "eia_natgas_storage,eia_crude_stocks")
          snaps = (os.environ.get("IN_SNAPS") or from_body("snapshots")
                   or "comms/macro/econ_calendar_snapshots.jsonl")
          start = (os.environ.get("IN_START") or from_body("start") or "2005-01-01")

          # Validate rather than interpolate: an unmapped kind or a path outside
          # comms/macro would otherwise reach the shell.
          klist, syms = [], []
          for k in [x.strip() for x in kinds.split(",") if x.strip()]:
              if not re.fullmatch(r'[a-z0-9_]+', k):
                  raise SystemExit(f"::error::bad kind {k!r}")
              sym = ees.KIND_DEFAULT_SYMBOL.get(k)
              if not sym:
                  raise SystemExit(
                      f"::error::kind {k!r} has no symbol in KIND_DEFAULT_SYMBOL — "
                      "add it there and to config/macro_econ_series.yaml")
              klist.append(k)
              if sym not in syms:
                  syms.append(sym)
          if not re.fullmatch(r'comms/macro/[A-Za-z0-9_.-]+\.jsonl', snaps):
              raise SystemExit(f"::error::snapshots path not allowed: {snaps!r}")
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', start):
              raise SystemExit(f"::error::bad start date {start!r}")

          print(f"EES_KINDS={','.join(klist)}")
          print(f"EES_SYMBOLS={','.join(syms)}")
          print(f"EES_SNAPSHOTS={snaps}")
          print(f"EES_START={start}")
          PYEOF
          echo "resolved: kinds=${EES_KINDS:-?} symbols=${EES_SYMBOLS:-?}" || true

      - name: Fetch price panels off-VM (yfinance→Stooq, keyless)
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -euo pipefail
          # --start was pinned at 2023-01-01, which capped the JOIN at ~3 years while
          # the reconstructed release history runs to DECADES (ICSA: 3031 weekly rows).
          # The study could not have used the history even once the backfill landed.
          python scripts/macro/fetch_macro_candles.py \
            --symbols "${EES_SYMBOLS}" \
            --start "${EES_START}" \
            --out-dir /tmp/econ_event_candles

      - name: Assert the panels are non-empty
        # A load-bearing fetch may NOT degrade to a warning. This step is the
        # tripwire that the previous `|| echo "::warning::"` removed: if the panels
        # are missing or trivially short, fail here with a legible message rather
        # than letting the study publish a vacuous scorecard on a green run.
        run: |
          set -euo pipefail
          IFS=',' read -ra SYMS <<< "${EES_SYMBOLS}"
          for sym in "${SYMS[@]}"; do
            f="/tmp/econ_event_candles/${sym}.csv"
            if [ ! -s "$f" ]; then
              echo "::error::no price panel for ${sym} — the event-study join would measure nothing"
              exit 1
            fi
            rows=$(( $(wc -l < "$f") - 1 ))
            echo "${sym}: ${rows} daily closes"
            if [ "$rows" -lt 100 ]; then
              echo "::error::${sym} panel has only ${rows} rows (<100) — fetch is degraded"
              exit 1
            fi
          done

      - name: Run the event study (natural gas + crude)
        id: study
        run: |
          set -euo pipefail
          # Back-compat scorecard paths for the two original kinds (they are registered
          # in scripts/ops/check_artifact_validity.py); any other kind gets its own file.
          IFS=',' read -ra KINDS <<< "${EES_KINDS}"
          for k in "${KINDS[@]}"; do
            case "$k" in
              eia_natgas_storage) out=comms/macro/econ_event_study_scorecard.json ;;
              eia_crude_stocks)   out=comms/macro/econ_event_study_crude_scorecard.json ;;
              *) out="comms/macro/econ_event_study_${k}_scorecard.json" ;;
            esac
            echo "--- ${k} -> ${out}"
            python scripts/macro/econ_event_study.py \
              --kind "$k" --candles-dir /tmp/econ_event_candles \
              --snapshots "${EES_SNAPSHOTS}" \
              --json "$out"
          done
          # Summarize the kinds THIS RUN produced (it once hardcoded the natgas scorecard).
          #
          # THE HEREDOC AND ITS BODY SIT AT THIS BLOCK'S BASE INDENT, DELIBERATELY.
          # YAML strips a block scalar's COMMON indent, so base-indent lines land at column 0 in
          # the real script — which is the only place bash accepts a heredoc terminator (`<<-`
          # strips TABS, not spaces) and the only place Python can start a module-level line.
          # Nesting this inside a `{ }` group added two spaces, so the terminator was never
          # found and bash read to EOF: the study computed every scorecard and the results were
          # then DISCARDED because the reporting step could not parse. Do not re-indent.
          python3 - <<'SUMEOF' > /tmp/ees_summary.json
          import json, os
          out = {}
          for k in os.environ["EES_KINDS"].split(","):
              k = k.strip()
              if not k:
                  continue
              path = {"eia_natgas_storage": "comms/macro/econ_event_study_scorecard.json",
                      "eia_crude_stocks": "comms/macro/econ_event_study_crude_scorecard.json",
                      }.get(k, f"comms/macro/econ_event_study_{k}_scorecard.json")
              try:
                  d = json.load(open(path))
              except Exception as exc:  # noqa: BLE001
                  out[k] = {"error": f"scorecard unreadable: {exc}"}
                  continue
              out[k] = {"summary": d.get("summary"), "meta": d.get("meta")}
          print(json.dumps(out, indent=2))
          SUMEOF
          { echo "summary<<EOF"; cat /tmp/ees_summary.json; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Land the scorecards on main (auto-merge PR)
        id: commit
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          # Was hardcoded to the two energy scorecards, so a run over any other kind
          # produced real results and then threw them away ("nothing to commit"). Glob so
          # every per-kind scorecard this run wrote is actually landed.
          paths: comms/macro/econ_event_study_scorecard.json comms/macro/econ_event_study_crude_scorecard.json comms/macro/econ_event_study_*_scorecard.json
          message: "chore(m1): econ-surprise event-study scorecard"
          pr-title: "chore(m1): econ-surprise event-study scorecard (auto)"
          pr-body: "Economic-surprise → forward-price event-study scorecards (econ-event-study). Observe-only, data-only; auto-merge. Verdict caps at insufficient_history until PIT-consensus history accrues."
          branch-prefix: automation/econ-event-study
          # ⚠️ NOT decoration: without this the step exits 0 the moment the PR
          # OPENS, and "the push succeeded" is silently treated as "the rows
          # arrived". They are different claims and only one is what a later
          # session depends on. The action owns the bounded wait — do not copy
          # a timeout here.
          verify-merged: "true"

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ steps.study.outputs.summary }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          PR: ${{ steps.commit.outputs.pr }}
        with:
          script: |
            const summary = process.env.SUMMARY || '(no summary captured)';
            const committed = process.env.COMMITTED || 'unknown';
            const pr = process.env.PR || '';
            const body = [
              '📈 **econ-event-study** — surprise → forward-price IC(H) scorecard.',
              '',
              '```json', summary.trim(), '```',
              '',
              committed === 'true' ? `landed via auto-merge PR: ${pr}` : 'no scorecard change this run.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
