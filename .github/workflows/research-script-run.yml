name: research-script-run

# THE TOKEN-FREE RESEARCH RUNNER (lane RQ-RUN, 2026-09-28).
#
# WHY. MEASURED on origin/main at 17:45Z the same day: the dispatcher's dry run
# over 27 queue units gave would_dispatch=7, and five of the seven declared
# `run.workflow: "none — session-local ..."`. `_fire` then ran
# `gh workflow run "none — ..."`, which fails — research-queue-dispatch run
# 36434038723 ended red on exactly that. Every session-local unit was waiting
# on a Claude session, i.e. on tokens, while Claude usage was capped and
# 4-core runners sat idle. Operator, 2026-09-28: "keep the research queue
# moving through the slowdown, even if we're out of tokens we should still be
# making the most of the other resources available."
#
# WHAT IT DOES. Takes ONE input that names a queue unit, reads that unit's
# `run.command`/`run.commands` FROM THE CHECKED-OUT REF, runs it on the
# runner, lands the outputs under comms/research/<unit>/<run_id>/ and then an
# E5 result record via the shared research-result action. The command is
# never a dispatch input: the only way to make this runner execute something
# is to land a YAML change on main through the same review everything else
# gets. scripts/research/script_run.py owns the contract and refuses:
#   * any script not under scripts/research/ or scripts/backtest*.py,
#   * any argv[0] other than python3/python (no shell, no -c, no -m),
#   * any token carrying `..`, a newline or NUL.
# scripts/ci/check_research_script_run.py re-checks every unit that targets
# this file on every PR, and checks that this file still declares ONLY the
# two inputs below.
#
# SECRETS. The `run` job holds nothing beyond the ambient GITHUB_TOKEN and
# checks out with persist-credentials: false — the unit's script cannot reach
# a PAT. The PAT (BRANCH_PROTECTION_TOKEN) is used ONLY by the separate `land`
# job, which never executes the unit's command; it needs the PAT because a PR
# opened with GITHUB_TOKEN never receives its required checks and auto-merge
# waits forever (see .github/actions/commit-to-main/action.yml).
#
# `power_state` is the dispatcher's COMPUTED R4 safety label, passed through
# verbatim to the record (see .github/actions/research-result): `accruing`
# means "do not read this run's output as a test result". It is a label, not
# a command, and the runner never branches on it.
#
# Tier-1: runs on the GitHub-hosted runner, reads the repo, writes only
# comms/research/** and research/results/**. No live path, no order path,
# no VM.

on:
  workflow_dispatch:
    inputs:
      research_unit:
        description: "The queue unit to run (RQ-YYYYMMDD-NNN). Its run.command is read from research/queue/<id>.yaml on this ref."
        required: true
      power_state:
        description: "Pass-through dispatcher power-state label, if any (never a command)"
        default: ""

permissions:
  contents: read

concurrency:
  # One run per unit at a time: two runs of the same unit would race on the
  # same comms/research/<unit>/ landing PR. Different units run in parallel.
  group: research-script-run-${{ github.event.inputs.research_unit }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 360 = the runner brain's MAX_TIMEOUT_MIN (330) + install/checkout/upload.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          # The unit's script must not be able to reach any credential.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyyaml requests
      - name: Check the unit's declared command against the allowlist
        env:
          UNIT: ${{ inputs.research_unit }}
        run: |
          set -euo pipefail
          python3 scripts/research/script_run.py --self-test
          python3 scripts/research/script_run.py --unit "${UNIT}" --run-id "${GITHUB_RUN_ID}" --check
      - name: Run the unit's command(s)
        id: run
        # continue-on-error so a failing script still lands its manifest and
        # logs as a `producer_failed` record — a run that exits red having
        # landed nothing is the invisible failure this runner exists to end.
        # The `land` job re-asserts the failure at the very end.
        continue-on-error: true
        env:
          UNIT: ${{ inputs.research_unit }}
        run: |
          set -euo pipefail
          python3 scripts/research/script_run.py --unit "${UNIT}" --run-id "${GITHUB_RUN_ID}" --run
      - name: Upload the run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-script-run-${{ inputs.research_unit }}-${{ github.run_id }}
          path: comms/research/${{ inputs.research_unit }}/${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn

  land:
    needs: [run]
    if: always()
    runs-on: ubuntu-latest
    # Two commit-to-main waits (outputs, then the record), 30 min each by the
    # action's own default, + slack — the same arithmetic
    # research-queue-dispatch.yml records for its two calls.
    timeout-minutes: 75
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so the landing PRs receive their required checks.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - uses: actions/download-artifact@v4
        id: fetch
        continue-on-error: true
        with:
          name: research-script-run-${{ inputs.research_unit }}-${{ github.run_id }}
          path: comms/research/${{ inputs.research_unit }}/${{ github.run_id }}
      - name: Land the run outputs on main
        id: outputs
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/research/${{ inputs.research_unit }}/${{ github.run_id }}
          message: "research: ${{ inputs.research_unit }} outputs from research-script-run ${{ github.run_id }}"
          pr-title: "research outputs: ${{ inputs.research_unit }} (run ${{ github.run_id }})"
          pr-body: >-
            Automated landing of `comms/research/${{ inputs.research_unit }}/${{ github.run_id }}/`
            (run-manifest.json, verdict.json if the script graded itself, logs/)
            from the token-free research runner. The E5 result record follows
            in a second PR from the same run.
          branch-prefix: automation/research-script-outputs
          verify-merged: "true"
      - name: Derive the result record from what the run wrote
        id: derive
        env:
          UNIT: ${{ inputs.research_unit }}
        run: |
          set -euo pipefail
          python3 scripts/research/script_run.py --unit "${UNIT}" --run-id "${GITHUB_RUN_ID}" --derive-record
      - name: Land the E5 result record
        uses: ./.github/actions/research-result
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          research-unit: ${{ inputs.research_unit }}
          power-state: ${{ inputs.power_state }}
          decision-rule-id: ${{ steps.derive.outputs.decision_rule_id }}
          decision-rule-registered-at: ${{ steps.derive.outputs.decision_rule_registered_at }}
          verdict: ${{ steps.derive.outputs.verdict }}
          read-state: ${{ steps.derive.outputs.read_state }}
          population: ${{ steps.derive.outputs.population }}
          n: ${{ steps.derive.outputs.n }}
          measurement-file: ${{ steps.derive.outputs.measurement_file }}
          records-file: ${{ steps.derive.outputs.records_file }}
          min-rows: ${{ steps.derive.outputs.min_rows }}
          artifact-store: ${{ steps.derive.outputs.artifact_store }}
          artifact-locator: ${{ steps.derive.outputs.artifact_locator }}
          tool: ${{ steps.derive.outputs.tool }}
          note: ${{ steps.derive.outputs.note }}
      - name: Summarize
        if: always()
        env:
          UNIT: ${{ inputs.research_unit }}
        run: |
          {
            echo "### research-script-run — ${UNIT}"
            echo
            echo "* run job: \`${{ needs.run.result }}\`"
            echo "* outputs: \`comms/research/${UNIT}/${GITHUB_RUN_ID}/\` (PR: ${{ steps.outputs.outputs.pr }})"
            echo "* verdict / read-state: \`${{ steps.derive.outputs.verdict }}\` / \`${{ steps.derive.outputs.read_state }}\`"
            echo
            echo '```'
            cat "comms/research/${UNIT}/${GITHUB_RUN_ID}/run-manifest.json" 2>/dev/null || echo "(no run-manifest.json)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Re-assert the failure the `run` job swallowed with continue-on-error,
      # now that the manifest, logs and the producer_failed record have landed.
      - name: Fail if the unit's command failed
        if: always() && needs.run.result != 'success'
        run: |
          echo "::error::the unit's command did not complete (run job: ${{ needs.run.result }}) — its manifest/logs and a producer_failed record landed above."
          exit 1
