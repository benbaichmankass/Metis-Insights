name: m28-value-grade

# M28 Phase B — grade the D3 VALUE-sleeve cross-section on a GitHub-hosted runner.
#
# The value sleeve needs FRED (keyless) + ETF/metal daily closes (Yahoo/Stooq). Those
# equity price sources are flaky/blocked from datacenter IPs (the trainer VM gets HTTP
# 404 from Stooq and has no yfinance), so — unlike the Bybit-geo-blocked crypto sleeve —
# the value grade runs BEST on a GitHub-hosted US runner with real yfinance installed,
# exactly like sysdyn-gas-calibrate.yml fetches its UNG candles.
#
# Runs entirely off-VM (ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). No SSH, no
# live-VM touch, no order path. Comment-back only — the verdict is posted to the issue;
# nothing is committed (a research grade, not a persisted artifact).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (horizon/fee overrides).
#   2. issues.opened w/ label `m28-value-grade-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      horizons:
        description: "CSV of S2 horizon days"
        required: false
        default: "30,60,90,180"
      pnl_horizon:
        description: "S3 hold horizon (days)"
        required: false
        default: "90"
      fee_frac:
        description: "Per-position round-trip cost fraction"
        required: false
        default: "0.001"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: m28-value-grade-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  grade:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'm28-value-grade-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0" yfinance pandas

      - name: M28 Phase B — grade the D3 value-sleeve cross-section
        id: grade
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          mkdir -p /tmp/m28-value-candles
          python scripts/macro/construction_sweep.py \
            --input value \
            --candles-dir /tmp/m28-value-candles \
            --rebalance-every 7 \
            --horizons "${{ github.event.inputs.horizons || '30,60,90,180' }}" \
            --pnl-horizon "${{ github.event.inputs.pnl_horizon || '90' }}" \
            --fee-frac "${{ github.event.inputs.fee_frac || '0.001' }}" \
            --json /tmp/m28-value.json | tee /tmp/m28_value_card.txt
          echo "--- candle CSV row counts ---" | tee -a /tmp/m28_value_card.txt
          wc -l /tmp/m28-value-candles/*.csv 2>/dev/null | tee -a /tmp/m28_value_card.txt || \
            echo "no CSVs written" | tee -a /tmp/m28_value_card.txt

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(grade output unavailable)';
            try { card = fs.readFileSync('/tmp/m28_value_card.txt', 'utf8'); } catch (e) {}
            const body = [
              '🧪 **m28-value-grade** — D3 value-sleeve cross-section (SPY←ERP, TLT←real-yield, SLV←GSR).',
              '',
              '```', card.trim(), '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
