name: m28-value-grade

# M28 Phase B — grade the D3 VALUE-sleeve cross-section on a GitHub-hosted runner.
#
# The value sleeve needs FRED (keyless) + ETF/metal daily closes (Yahoo/Stooq). Those
# equity price sources are flaky/blocked from datacenter IPs (the trainer VM gets HTTP
# 404 from Stooq and has no yfinance), so — unlike the Bybit-geo-blocked crypto sleeve —
# the value grade runs BEST on a GitHub-hosted US runner with real yfinance installed,
# exactly like sysdyn-gas-calibrate.yml fetches its UNG candles.
#
# Runs entirely off-VM (ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). No SSH, no
# live-VM touch, no order path. Comment-back only — the verdict is posted to the issue;
# nothing is committed (a research grade, not a persisted artifact).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (horizon/fee overrides).
#   2. issues.opened w/ label `m28-value-grade-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      horizons:
        description: "CSV of S2 horizon days"
        required: false
        default: "30,60,90,180"
      pnl_horizon:
        description: "S3 hold horizon (days)"
        required: false
        default: "90"
      fee_frac:
        description: "Per-position round-trip cost fraction"
        required: false
        default: "0.001"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: m28-value-grade-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  grade:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'm28-value-grade-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0" yfinance pandas

      - name: M28 Phase B — grade the D3 value-sleeve cross-section
        id: grade
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          mkdir -p /tmp/m28-value-candles
          python scripts/macro/construction_sweep.py \
            --input value \
            --candles-dir /tmp/m28-value-candles \
            --rebalance-every 7 \
            --horizons "${{ github.event.inputs.horizons || '30,60,90,180' }}" \
            --pnl-horizon "${{ github.event.inputs.pnl_horizon || '90' }}" \
            --fee-frac "${{ github.event.inputs.fee_frac || '0.001' }}" \
            --json /tmp/m28-value.json | tee /tmp/m28_value_card.txt
          echo "--- candle CSV row counts ---" | tee -a /tmp/m28_value_card.txt
          wc -l /tmp/m28-value-candles/*.csv 2>/dev/null | tee -a /tmp/m28_value_card.txt || \
            echo "no CSVs written" | tee -a /tmp/m28_value_card.txt

      - name: M28 value-construction sweep — P4 lifecycle gate (D1/D2/D3)
        id: p4sweep
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          # The D3 grade above only fetches the 3 distinct drivers (SPY/TLT/SLV); the P4
          # sweep's universe is the full 5 (SPY/TLT/IEF/GLD/SLV), so fetch the complete set
          # explicitly (idempotent per-symbol <SYMBOL>.csv writes, augments what's there).
          # fetch_macro_candles exits non-zero ONLY on TOTAL failure (0 usable symbols); the
          # block runs without `set -e`, so guard explicitly — a total fetch failure must
          # FAIL rather than let value_construction_sweep grade an empty dir and emit a false
          # "n=0" (BL-20260730-CANDLE-FETCH-DEGRADES-TO-N0). Partial coverage still proceeds.
          if ! python scripts/macro/fetch_macro_candles.py \
            --out-dir /tmp/m28-value-candles --symbols SPY,TLT,IEF,GLD,SLV; then
            echo "::error::P4 candle fetch produced 0 usable symbols — refusing to grade (would emit a false n=0). BL-20260730-CANDLE-FETCH-DEGRADES-TO-N0"
            exit 1
          fi
          python scripts/macro/value_construction_sweep.py \
            --out-dir /tmp/m28-constructions \
            --candles-dir /tmp/m28-value-candles \
            --rebalance-every 30 --horizon-days 30 --fee-frac 0.001 \
            --json /tmp/m28_value_construction_scorecard.json \
            | tee /tmp/m28_p4_card.txt || echo "(P4 sweep failed — see run log)" | tee -a /tmp/m28_p4_card.txt

      - name: Commit fetched candle CSVs (hermetic local reproducibility)
        id: commitcandles
        run: |
          set -uo pipefail
          mkdir -p data/macro_candles
          copied=0
          for f in /tmp/m28-value-candles/*.csv; do
            [ -e "$f" ] || continue
            cp "$f" data/macro_candles/ && copied=$((copied+1))
          done
          echo "copied=$copied" >> "$GITHUB_OUTPUT"
          if [ "$copied" -gt 0 ] && ! git diff --quiet -- data/macro_candles; then
            branch="chore/macro-candles-${{ github.run_id }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b "$branch"
            git add data/macro_candles/*.csv
            git commit -m "chore(macro): commit ~21yr ETF candle CSVs for the M28 P4 gate (hermetic local reproducibility)"
            git push origin "$branch"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "branch=" >> "$GITHUB_OUTPUT"
          fi

      - name: Open candles PR
        if: steps.commitcandles.outputs.branch != ''
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ steps.commitcandles.outputs.branch }}';
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner, repo: context.repo.repo,
              head: branch, base: 'main', draft: true,
              title: 'chore(macro): commit ~21yr ETF candle CSVs for the M28 P4 gate',
              body: [
                'Commits the ETF daily-close CSVs the `m28-value-grade` runner fetched into',
                '`data/macro_candles/`, so the M28 P4 value-thesis gate + construction sweep',
                'run **hermetically/locally/reproducibly** without a live market-data fetch',
                '(Stooq/Yahoo are proxy-blocked from the research sessions).',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
            core.notice(`opened candles PR #${pr.data.number}`);

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(grade output unavailable)';
            try { card = fs.readFileSync('/tmp/m28_value_card.txt', 'utf8'); } catch (e) {}
            let p4 = '(P4 sweep output unavailable)';
            try { p4 = fs.readFileSync('/tmp/m28_p4_card.txt', 'utf8'); } catch (e) {}
            const body = [
              '🧪 **m28-value-grade** — value-sleeve construction grades (two arbiters).',
              '',
              '**(A) D3 cross-section via the horizon-IC/S2+S3 grader** (entry-12 arbiter):',
              '```', card.trim(), '```',
              '',
              '**(B) D1/D2/D3 constructions via the P4 net-of-cost LIFECYCLE gate** '
                + '(the operator-directed arbiter; a construction clears iff edge_vs_baseline > 0 & calibration_rank > 0, OOS):',
              '```', p4.trim(), '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
