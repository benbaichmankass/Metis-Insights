name: training-rerun-5m

# Re-runs experiment 2026-05-07-vwap-accuracy at the production 5m
# timeframe. The original run used a local 1h archive because the
# sandbox blocked all live market-data hosts; this workflow runs on a
# GitHub Actions runner that has outbound internet, so it can call the
# yfinance / Coinbase / Bybit fallback chain in
# `scripts/training/data_loader.load_candles` to pull a real 5m series.
#
# Public market data only — no API keys required.
#
# Triggers:
#   * push to `main` touching `experiments/2026-05-07-vwap-accuracy/run_5m.py` or this
#     workflow file (so editing either re-triggers a run).
#   * workflow_dispatch (manual button in the Actions UI).
#
# Auto-commits results back to the triggering push's branch (main only, see
# the `branches:` filter below), tagging the commit message with `[skip ci]` to prevent re-trigger
# loops.

on:
  push:
    # main only: the last step git-pushes results back to the triggering ref, so
    # a push filter without `branches:` fires on every PR branch that edits this
    # file (PI-20260929-SASEC-0003) and lands unreviewed results commits there.
    branches: [main]
    paths:
      - "experiments/2026-05-07-vwap-accuracy/run_5m.py"
      - "experiments/2026-05-07-vwap-accuracy/fetch_data.py"
      - ".github/workflows/training-rerun-5m.yml"
  workflow_dispatch:

# FIX-SA-13: workflow-level default is read-only. The `run` job below keeps its
# own `contents: write` on purpose — its last step `git push`es the results back
# to the triggering branch, which a read-only token cannot do.
permissions:
  contents: read

concurrency:
  group: training-rerun-5m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyarrow yfinance pyyaml

      - name: Fetch BTCUSDT 5m + 1h candles
        run: PYTHONPATH=. python experiments/2026-05-07-vwap-accuracy/fetch_data.py

      - name: Run experiment + robustness sweep
        env:
          VWAP_EXPERIMENT_TIMEFRAME: "5m"
        run: PYTHONPATH=. python experiments/2026-05-07-vwap-accuracy/run_5m.py

      - name: Upload run artifacts (for archival)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-5m-results
          path: |
            experiments/2026-05-07-vwap-accuracy/results/5m/
          retention-days: 7

      - name: Commit results back to branch
        if: github.event_name != 'pull_request'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/2026-05-07-vwap-accuracy/results/5m/SUMMARY.md \
                  experiments/2026-05-07-vwap-accuracy/results/5m/H*/summary.md \
                  experiments/2026-05-07-vwap-accuracy/results/5m/H*/metrics.json \
                  experiments/2026-05-07-vwap-accuracy/results/5m/robustness/robustness.json \
                  || true
          if git diff --cached --quiet; then
            echo "No artifacts to commit (data fetch failed?)"
            exit 0
          fi
          msg="TRAINING-RESULTS: 2026-05-07-vwap-accuracy 5m re-run [skip ci] — $RUN_URL"
          git commit -m "$msg"
          git push origin HEAD:${{ github.ref_name }}

# no-durable-result: ML training experiment rerun tracked by the model registry, not the research/results queue
