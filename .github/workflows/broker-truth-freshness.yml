name: broker-truth-freshness

# LEDGER-REFRESH. Grades comms/broker_truth_ledger.json freshness every 6h via
# scripts/ops/broker_truth_freshness.py and raises ONE tracking issue: body
# rewritten every run (a stale "Last checked" means this schedule died), a
# comment only when the graded state moves. Also records the daily
# journal-vs-wallet delta for bybit_1 / bybit_portfolio in the same issue.
# Tier 1: read-only GETs, one GitHub issue written.

on:
  schedule:
    - cron: '25 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: broker-truth-freshness
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read and grade
        id: grade
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
          BOT_API_BASE: https://ict-bot.duckdns.org
        run: |
          set -uo pipefail
          curl -sS --fail --max-time 60 "${BOT_API_BASE}/api/bot/pnl/broker-truth" > /tmp/bt.json \
            || echo '{"error":"unreachable"}' > /tmp/bt.json
          set +e
          python3 scripts/ops/broker_truth_freshness.py --broker-truth-json /tmp/bt.json > /tmp/render.txt; rc=$?
          python3 scripts/ops/broker_truth_freshness.py --broker-truth-json /tmp/bt.json --fingerprint > /tmp/fp.txt
          set -e
          # Daily journal-vs-wallet delta. A failed read prints could_not_look, never 0.
          bash scripts/ops/diag_fetch.sh 'bybit_wallet_truth?days=14&by_day=true' > /tmp/wt.json || echo '{}' > /tmp/wt.json
          for a in bybit_1 bybit_portfolio; do
            curl -sS --max-time 60 "${BOT_API_BASE}/api/bot/trades/closed?account_id=${a}&include_paper=true&include_demo=true&limit=200&since=$(date -u -d '14 days ago' +%F)" > /tmp/c_${a}.json || echo '[]' > /tmp/c_${a}.json
            python3 scripts/ops/journal_vs_wallet_delta.py --account "$a" --wallet-json /tmp/wt.json --closed-json /tmp/c_${a}.json >> /tmp/render.txt 2>&1 || true
          done
          cat /tmp/render.txt
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "digest=$(head -1 /tmp/fp.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          RC: ${{ steps.grade.outputs.rc }}
          DIGEST: ${{ steps.grade.outputs.digest }}
        with:
          script: |
            const fs = require('fs');
            const LABEL = 'broker-truth-freshness';
            const render = fs.readFileSync('/tmp/render.txt', 'utf8').slice(0, 20000);
            const digest = process.env.DIGEST, rc = process.env.RC;
            const now = new Date().toISOString();
            const body = [
              `<!-- broker-truth-freshness: ${digest} -->`,
              `**Last checked: ${now}** · exit \`${rc}\` (0 clean · 1 stale ledger · 3 could not look)`,
              ``, '```', render.trim(), '```',
              ``, `Grader: \`scripts/ops/broker_truth_freshness.py\`. Read-only.`,
            ].join('\n');
            const found = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: LABEL, per_page: 10 });
            const issue = found.data.find(i => !i.pull_request);
            if (!issue) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
                title: '🧾 Broker-truth ledger freshness', body, labels: [LABEL] });
              return;
            }
            const prev = ((issue.body || '').match(/broker-truth-freshness: (\w+)/) || [])[1];
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
            if (prev === digest) return;
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
              body: `### Graded state changed \`${prev || 'none'}\` → \`${digest}\`\n\n\`\`\`\n${render.trim()}\n\`\`\`\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_` });
