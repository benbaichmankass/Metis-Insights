name: Guards

# ONE job for every fast static guard in the repo.
#
# BL-20260806-CI-FANOUT-AMPLIFIES-ACTIONS-OUTAGES. Each guard used to be its own
# workflow, so one PR asked GitHub for ~29 separate hosted runners. That is free
# when the runner pool is healthy and catastrophic when it is not: during the
# 2026-08-06 Actions incident, 28 of 29 jobs sat `queued` with no runner for over
# an hour, and because almost none of those workflows declared a `concurrency:`
# group, every re-run STACKED instead of superseding the last — 75 queued runs
# from ~3 attempts at the same PR. The PR read red for reasons unrelated to its
# diff, and "CI failed" was indistinguishable from "CI never ran".
#
# This is a PACKAGING change and nothing else. Every guard runs the same command
# against the same relevance condition with the same assertions; the registry
# lives in `scripts/ci/run_guards.py` and the failure-path self-tests (which used
# to be inline heredocs in five of the retired YAML files) in
# `scripts/ci/guard_selftests.py`. Nothing was softened, skipped or downgraded to
# advisory in the move.
#
# WHAT STAYED SEPARATE, and why:
#   * pytest-collect / pytest-run — the test suite is a different kind of check
#     and long enough that folding it in would serialise everything behind it.
#   * repo-inventory — explicitly advisory ("not gating PR merge") and uploads an
#     artifact; folding it into a REQUIRED job would silently start gating on it.
#
# REQUIRED-CHECK CONTRACT: the job id below (`guards`) is the required status
# check. It replaces the 13 individual guard contexts that used to be required;
# `branch-protection-sync.yml` is updated in the same commit, because a required
# context that no longer exists leaves every PR hanging forever.
#
# The trigger deliberately carries NO `paths:` filter — a required check must
# never be left permanently "pending" on a non-matching PR
# (MB-20260706-CI-MINUTES). Relevance is decided inside the job, per guard,
# where it can be reported instead of being invisible.

on:
  # Dormant until the native merge queue is enabled (BL-20260726); a required
  # check MUST run on the merge_group ref or the queue stalls.
  merge_group:
  pull_request:
    # ⚠️ `ready_for_review` is deliberately ABSENT. Every Claude PR is opened
    # as a draft (harness rule), and a draft ALREADY runs these checks here via
    # `opened` + `synchronize` — so re-running on the ready transition re-tests
    # an IDENTICAL sha. It is not merely redundant: the fresh runs reset the
    # head's status to pending, and GitHub then refuses the merge with
    # "3 of 3 required status checks are in progress" for a PR that was green.
    # The trigger CREATED the block it looks like it guards against.
    # Measured 2026-08-31: four PRs, ~15 min of wall clock each.
    # Introduced with no recorded rationale (#1644, 2026-05-21 — copied in with
    # the trigger set when pytest-run was created), so nothing is being undone.
    # ⚠️ This does NOT change REQUIRED_CONTEXTS in branch-protection-sync.yml
    # (still pytest-collect / pytest-run / guards), which is the operation
    # CLAUDE.md warns can deadlock every open PR.
    # ⚠️ RE-ADD IT if drafts ever stop running checks: a draft with no runs and
    # no ready trigger would be unmergeable forever.
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# THE STACKING FIX. Without this, a re-run of a PR whose jobs are still queued
# leaves the old batch queued too, and both compete for the same scarce runners.
# Superseding is always what we want here: only the newest commit's verdict is
# meaningful. Never group `push`/`merge_group` by ref alone without the event —
# cancelling a main-branch run would lose the post-merge signal.
concurrency:
  group: guards-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install guard dependencies
        # One install for all guards instead of ~10 separate ones. ruff and
        # import-linter come from requirements-dev.txt (pinned there for a
        # reason — see its header on the ruff 0.16 default-ruleset expansion).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "pyyaml>=6.0" pytest
          # ⚠️ CORRECTED 2026-09-02: this comment first read "`requests` is a
          # RUNTIME dep (requirements.txt), not a dev one". THAT IS FALSE, and
          # false in the direction this repo calls "prose asserting what the
          # field does not say". MEASURED over the four requirements files:
          # `requests>=2.31.0` appears in requirements-backtest.txt ONLY -- it
          # is absent from requirements.txt, requirements-dev.txt and
          # requirements-test.txt. It is satisfied on the live VM only
          # TRANSITIVELY (anthropic / ccxt / huggingface_hub), which is the
          # same shape as the `pybit` note in requirements.txt that the
          # 2026-06-14 Ampere migration caught the hard way -- and it is not
          # only the ping path: src/units/accounts/{alpaca,oanda}_client.py
          # import it too. Found by session_01PcirVtpMXJGiKm2548nkrR on the
          # coordination board and verified here rather than taken on trust;
          # the one-line fix in requirements.txt is THEIRS, not this PR's.
          #
          # This line is still needed regardless: pending-pings-render imports
          # scripts/notify_on_pull.py
          # to ask it whether a queued ping renders a body — the emptiness
          # predicate has ONE owner and the guard imports it rather than
          # re-deriving it. notify_on_pull imports requests at module scope for
          # its Telegram transport, which the guard never reaches.
          #
          # Installed here rather than making that import lazy: notify_on_pull
          # runs on the live VM and carries CRITICAL safety pages, so a one-line
          # CI dependency is the cheaper side of that trade.
          pip install requests

      - name: Fetch the base ref
        # `git fetch --depth=1` would SHALLOW origin/main back to its tip,
        # overriding the full history `fetch-depth: 0` just gave us, and the
        # three-dot diff would then fail with "no merge base".
        run: git fetch origin "${{ github.base_ref || 'main' }}"

      - name: Compute the PR diff
        run: |
          git diff "origin/${{ github.base_ref || 'main' }}"...HEAD > /tmp/pr.diff
          wc -l /tmp/pr.diff

      - name: Run guards
        id: guards
        env:
          GUARDS_BASE_REF: ${{ github.base_ref || 'main' }}
          GUARDS_PR_DIFF: /tmp/pr.diff
          GUARDS_NOTIFY_FILE: /tmp/guards-notify.txt
        run: |
          set +e
          # On push / workflow_dispatch there is no PR diff to scope relevance
          # by, so run every GUARD.
          #
          # Read that precisely: `--all` disables relevance at the GUARD level.
          # A guard's individual STEPS may still carry their own `when`, and
          # those are evaluated against the changed-file list, which is EMPTY
          # here — so a step gated that way does not run on this event. That is
          # deliberate, not an oversight: every such step today consumes
          # `{pr_diff}`, and on push that file is empty, so running it would
          # report a green having scanned nothing. `run_guards.py` prints those
          # steps under "NOT SCANNED on this event" rather than letting them
          # look covered. A guard that needs genuine push-time coverage carries
          # an UNGATED whole-tree step (see `api-tier-policy-guard`).
          #
          # This comment previously read "stricter than the retired
          # per-workflow push behaviour, never weaker", which was wrong in that
          # one respect and is corrected here
          # (BL-20260809-GUARD-STEP-WHEN-SKIPS-ON-PUSH).
          EXTRA=""
          case "${{ github.event_name }}" in
            push|workflow_dispatch) EXTRA="--all" ;;
          esac
          python3 scripts/ci/run_guards.py $EXTRA
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Notify operator on a tripped guard
        # Six guards used to Telegram the operator on a hit, one message each.
        # Same trigger, same audience — now one message naming all of them.
        if: steps.guards.outputs.exit != '0' && github.event_name == 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -s /tmp/guards-notify.txt ]; then
            echo "::notice::no notify-class guard tripped; skipping ping."
            exit 0
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured; skipping ping."
            exit 0
          fi
          TRIPPED=$(tr '\n' ' ' < /tmp/guards-notify.txt)
          MESSAGE="🚨 guards tripped on PR #${{ github.event.pull_request.number }}
          ${{ github.event.pull_request.html_url }}
          Tripped: ${TRIPPED}
          Review before merging — see the job output for the exact line and fix."
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" >/dev/null

      - name: Fail the check on any guard failure
        if: steps.guards.outputs.exit != '0'
        run: |
          echo "::error::one or more guards failed — every failing guard is named \
          in the 'Run guards' step summary above."
          exit 1
