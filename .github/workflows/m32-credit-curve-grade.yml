name: m32-credit-curve-grade

# M32 — grade the CREDIT / RATES risk-premium sleeve on a GitHub-hosted runner.
#
# The untested free-FRED macro inputs the M28 program skipped when it declared
# "free macro exhausted": credit spreads (HY/IG OAS), the yield-curve slope
# (10Y-2Y / 10Y-3M), and the Chicago Fed financial-conditions index (NFCI) —
# each → SP500 forward returns (credit-leads-equity). All keyless fredgraph.csv,
# US-reachable, so — like the value + implied-vol sleeves — this runs on a
# GitHub-hosted US runner; no trainer relay, no geo-block. Reuses the exact
# Track A honest funnel (S2 non-overlapping IC → S3 OOS/cost → S4-prep walk-forward).
#
# Runs entirely off-VM (ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). No SSH,
# no live-VM touch, no order path. Comment-back only — the verdict is posted to the
# issue; nothing is committed (a research grade, not a persisted artifact).
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (horizon override).
#   2. issues.opened w/ label `m32-credit-curve-grade-now` — Claude-driven.

on:
  workflow_dispatch:
    inputs:
      horizons:
        description: "CSV of forward horizons (trading days)"
        required: false
        default: "10,21,42,63"
      t_flag:
        description: "|ic_t| significance flag"
        required: false
        default: "2.0"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: m32-credit-curve-grade-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  grade:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'm32-credit-curve-grade-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: M32 — grade the credit/rates sleeve
        id: grade
        # --mode defaults to `all` → the card emits S2 (honest non-overlapping IC),
        # S3 (OOS split + cost-aware conviction), AND the walk-forward robustness
        # pass in one run; no per-mode flag needed.
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -uo pipefail
          python scripts/macro/credit_curve_probe.py \
            --horizons "${{ github.event.inputs.horizons || '10,21,42,63' }}" \
            --t-flag "${{ github.event.inputs.t_flag || '2.0' }}" \
            | tee /tmp/m32_credit_card.txt

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let card = '(grade output unavailable)';
            try { card = fs.readFileSync('/tmp/m32_credit_card.txt', 'utf8'); } catch (e) {}
            const body = [
              '🧪 **m32-credit-curve-grade** — credit/rates risk-premium sleeve (HY/IG OAS · curve slope · NFCI → SP500).',
              '',
              '```', card.trim(), '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
