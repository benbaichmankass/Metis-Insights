name: constraint-readout

# A1's readout, on a real cadence. The operating model classifies A1 as trigger
# `Cadenced`, autonomy `Full`; until this file landed it had NEITHER.
#
# WHY IT EXISTS
#   scripts/ops/constraint_readout.py shipped in Phase D and nothing ever ran it
#   on a schedule: `grep -rn constraint_readout .github/workflows/` returned 0
#   hits, and its CI registration is `--self-test` only, whose own note reads
#   "the readout itself is generated on demand, not in CI". So
#   docs/claude/READOUT.md was only ever as fresh as the last session that
#   remembered to type the command — measured 2026-09-02, its CONSTRAINT.json
#   carried generated_at 2026-09-01T23:15:16Z.
#
#   That is the work_digest.py defect recurring inside one day, in the function
#   with the largest blast radius: A1 feeds A2 (the operator's cycle priority),
#   and the CLAUDE.md session brief inlines the readout's headline WITH ITS
#   DATE. A readout that ages silently is worse than an absent one, because the
#   brief presents a dated snapshot most readers will not diff against today.
#   Evidence: docs/audits/operating-layer-skills-workflows-inventory-2026-09-02.md
#   § 3.1, which names this the highest-leverage item in the document.
#
# ⚠️ WHY A CRON AND DELIBERATELY NOT A STALENESS GUARD.
#   A `--check`-style freshness guard would red every open PR whenever the world
#   moved, which is the transient-red-strands-an-automerge-branch failure
#   (BL-20260830-A-TRANSIENT-RED-BASE-PERMANENTLY-STRANDS-AN-AUTOMERGE-BRANCH)
#   that forced session-brief-guard to be diff-scoped against origin/main. Do
#   not "strengthen" this by adding one.
#
# ⚠️ IT REGENERATES THE SESSION BRIEF TOO, AND THAT IS NOT HOUSEKEEPING.
#   render_session_brief.py READS docs/claude/CONSTRAINT.json. A cron that
#   advanced the readout without re-rendering CLAUDE.md would leave the brief
#   quoting the previous headline under a new file's date — i.e. it would
#   RELOCATE the staleness this file exists to end, into the one surface that
#   reaches a session before it acts. The two are regenerated and committed
#   together, always.
#
# ⚠️ A SCHEDULED WORKFLOW IN THIS REPO IS NOT EVIDENCE THAT IT FIRES ON TIME.
#   probes.yml's first-ever scheduled run (#34, event=schedule, success,
#   2026-09-01T10:12:17Z) came ~4h50m LATE against its `20 5 * * *` cron, and
#   once rather than daily; replay-pregate-nightly's recent schedule runs fired
#   between 08:29 and 15:56 UTC against a `0 4 * * *` cron. So the slot ordering
#   below is DECLARED INTENT, not a guarantee, and this file being green on the
#   day it lands says nothing. The readout is DEPLOYED, and stays that way until
#   a run with event=schedule is OBSERVED. The `workflow_dispatch` exists so
#   that observation can be forced rather than waited for — but a dispatch run
#   is NOT a cron run, and reading one as the other is exactly the substitution
#   that left two Routines dead in plain sight for four months.
#
# Tier-1: a read-only diagnosis producer. No order path, no live-VM mutation,
# no strategy config, no risk cap. The one secret is the PAT that opens the
# auto-merge PR, plus a read-only diag bearer for the money item.

on:
  schedule:
    # 06:05 UTC daily. The slot is chosen, not decorative: it lands after
    # probes (05:20) and due-list (05:50) have refreshed the registers the
    # brief renders from, and before work-digest's 06:20 slot reads them. See
    # the lateness warning above — this ordering is intent, not a promise.
    - cron: "5 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # `actions: read` + `pull-requests: read` (implied by write) are what §5's two
  # GitHub-backed sources need — red_crons lists workflow runs, unlanded_automation
  # lists open PRs. Without them both report `could_not_read`, which is HONEST but
  # permanent, and a cron nobody is waiting on would never surface here.
  actions: read
  pull-requests: write

concurrency:
  group: constraint-readout
  cancel-in-progress: false

jobs:
  readout:
    runs-on: ubuntu-latest
    # BUDGET = work + wait + slack. commit-to-main's verify-merged waits up to
    # 30m for the auto-merge PR to land, so a budget at or under 30 kills the
    # job mid-wait and reports a failure for a merge that was about to succeed.
    # 40 = ~5m of work + the 30m wait + 5m slack. tests/test_commit_to_main_callers.py
    # pins this floor across every caller.
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          # ⚠️ FULL HISTORY IS LOAD-BEARING HERE, not a convenience.
          # checklist_routing_age.py derives how long each FILED checklist row
          # has sat unrouted from the GIT HISTORY of MANAGER-CHECKLIST.json —
          # the register carries no `state_since` and adding one by hand is a
          # habit, not a mechanism (MI-246 / MI-237). On the default
          # `fetch-depth: 1` the derivation REFUSES (history_state
          # `could_not_read`) rather than reporting every row as young, so the
          # failure would be honest but the mechanism would be inert.
          # BL-20260730-SHALLOW-CLONE-DEFEATS-HISTORY-RULE is the same trap one
          # level up: git answers a truncated question with no error at all.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ⚠️ THIS STEP IS WHY THE CRON HAD NEVER SUCCEEDED. Measured 2026-09-08
      # over the workflow's COMPLETE run history — all 6 runs, every one
      # event=schedule, no dispatch run has ever existed — 6 of 6 concluded
      # `failure`, each in ~14s, i.e. at the self-test gate below.
      #
      # `setup-python` installs a bare interpreter and this file installed
      # NOTHING, so PyYAML was absent on the runner. constraint_readout.py
      # tolerates that (`yaml = None`), but scripts/ci/check_wip_ceiling.py
      # imports yaml at module scope, so the ceiling import raised, the
      # `except Exception` set WIP_CEILING = None, and the self-test printed
      #   FAIL — the WIP ceiling is imported from the enforcing guard (got None, want 8)
      # Reproduced locally by blocking `import yaml`: same single failure,
      # byte-for-byte; with yaml present the same command is ALL PASS.
      #
      # ⚠️ THE GATE WAS NOT THE BUG — IT WORKED. Without yaml the work store
      # is unreadable, so a run that skipped the self-test would have
      # committed a readout diagnosing nothing over the one surface the
      # session brief inlines. Do not "fix" a future failure here by
      # loosening the gate.
      #
      # ⚠️ AND A GREEN RUN OF THIS FILE IS NOT A CRON THAT FIRES. These 6 runs
      # fired 4.4–6.2 HOURS after their declared `5 6 * * *` slot (observed
      # 10:28Z, 10:47Z, 11:05Z, 11:07Z ×2, 12:18Z). Installing a dependency
      # fixes the FAILURE, not the LATENESS, and neither is evidence the next
      # slot fires at all — read the run history, never the cron expression.
      #
      # Only PyYAML, deliberately: nothing else this job runs leaves the
      # stdlib (render_due_list.py and render_session_brief.py are stdlib-only,
      # which is why due-list.yml needs no install step and succeeds). The
      # pinned spelling matches the 10 sibling workflows that already use it.
      - name: Install PyYAML — the work store is YAML and the runner has none
        run: python3 -m pip install --quiet --upgrade pip "pyyaml>=6.0"

      - name: Self-test both generators before trusting their output
        run: |
          set -euo pipefail
          # E1's whole job is to REFUSE rather than name a stage over unassessed
          # edges. Committing a readout whose refusal logic is broken would put a
          # fabricated constraint in front of the operator on a daily cadence,
          # which is strictly worse than the stale one this file replaces.
          python3 scripts/ops/constraint_readout.py --self-test
          python3 scripts/ops/render_session_brief.py --self-test
          # MI-246. Its refusal branches are the load-bearing ones — a
          # `could_not_read` that silently graded as "nothing is stalled" would
          # put an all-clear in the session brief on a daily cadence.
          python3 scripts/ops/checklist_routing_age.py --self-test

      - name: Regenerate the readout
        env:
          # The money item reads /api/bot/performance over the public Caddy
          # host. It is NOT required: money_block() reports read_state
          # `unreachable` with every figure None rather than zeroing them, so a
          # diag outage degrades the item honestly instead of asserting a flat
          # book. That is why there is no `|| echo '{}'` anywhere here.
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
          # Read-only; only §5's two GitHub-backed sources use it. Absent → those
          # report `could_not_read` and §5's completeness degrades to `partial`,
          # which is the honest outcome, not a failure. Same contract as
          # due-list.yml, which passes the same secret for the same two sources.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/ops/constraint_readout.py --write

      - name: Re-derive how long filed checklist rows have been unrouted
        run: |
          set -euo pipefail
          # MUST run BEFORE the brief re-render below, for the same reason the
          # readout does: the brief inlines this register, so rendering it from
          # the OLD file would ship a fresh timestamp over a stale reading.
          # ⚠️ NO `|| true`. This step writing nothing is a real outcome the
          # register records as `history_state: could_not_read`; swallowing a
          # crash instead would leave yesterday's file in place and the brief
          # would present it as today's answer.
          python3 scripts/ops/checklist_routing_age.py --write

      - name: Re-render the session brief from the new readout
        run: |
          set -euo pipefail
          # MUST run after --write above: the brief inlines CONSTRAINT.json's
          # headline, so rendering it from the OLD file would ship a fresh
          # timestamp over a stale diagnosis.
          python3 scripts/ops/render_session_brief.py --write

      - name: Report what changed
        run: |
          set -euo pipefail
          # Printed rather than asserted. An UNCHANGED readout is a legitimate
          # outcome (the work store did not move today) and must not be graded
          # as a failure — but a run that silently changes nothing for weeks is
          # the shape a reader needs to be able to see in the run log.
          git --no-pager diff --stat -- \
            docs/claude/CONSTRAINT.json docs/claude/READOUT.md CLAUDE.md \
            || true
          python3 -c "
          import json
          d = json.load(open('docs/claude/CONSTRAINT.json'))
          c = d['constraint']
          print('verdict         :', c.get('verdict'))
          print('assessed_coverage:', c.get('assessed_coverage'))
          print('money read_state:', d['money'].get('read_state'))
          print('generated_at    :', d.get('generated_at'))
          "

      - name: Land the readout on main (auto-merge PR)
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          # CLAUDE.md rides with them deliberately — see the header. Committing
          # the readout without the brief is what would make this file a
          # relocation of the bug rather than a fix for it.
          paths: docs/claude/CONSTRAINT.json docs/claude/READOUT.md CLAUDE.md
          # ⚠️ WITHOUT THIS THE STALE-BRANCH REFRESH IS INERT FOR THIS CALLER,
          # and that is why this workflow has concluded `success` ZERO times in
          # its entire life. Its output is DERIVED FROM the registers it merges:
          # generation takes ~31 minutes on a repo that merges several times an
          # hour, so by the time the checks run the base has moved and
          # `session-brief-guard` fails with `verdict=introduced_registers_
          # changed` (run 34592532948 -> PR #11789). The refresh merged main in,
          # minted a new sha, re-triggered the checks — and pushed the SAME
          # stale brief, so the same guard failed one sha later. Re-running the
          # checks is not the remedy; RE-DERIVING is. This is the same pair of
          # commands the generation step above runs.
          refresh-command: >-
            python3 scripts/ops/constraint_readout.py --write &&
            python3 scripts/ops/render_session_brief.py --write
          message: "chore(ops): refresh the A1 constraint readout"
          pr-title: "chore(ops): refresh the A1 constraint readout (auto)"
          pr-body: >-
            Automated daily regeneration of the A1 constraint readout
            (docs/claude/READOUT.md + docs/claude/CONSTRAINT.json) and the
            CLAUDE.md session brief that inlines its headline. Generated
            artifacts only; auto-merge.
          branch-prefix: automation/constraint-readout
          # "the PR opened" is not "the readout landed", and only the second is
          # what a session reads before it acts.
          verify-merged: "true"
