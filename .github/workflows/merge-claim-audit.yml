name: merge-claim-audit

# NON-BLOCKING post-merge detector for the coordination-board merge-slot protocol.
#
# WHY THIS SHAPE, and why NOT a required status check (decided 2026-08-20 with the
# operator, closing the enforcement half of BL-20260819-MERGE-SLOT-GUARD-DOES-NOT-FIRE):
#
#   * The PreToolUse guard that was supposed to enforce the claim is NEVER INVOKED on
#     Claude Code on the web -- that runtime registers zero project hooks. See
#     BL-20260820-PROJECT-HOOKS-INERT-ON-WEB. So on the web there is no enforcement at all.
#   * The obvious replacement -- a REQUIRED check verifying a claim comment -- was
#     considered and REJECTED. It is presence-only, so it would be cheaper to satisfy by
#     posting a formulaic comment than by doing the actual work of reading the board for a
#     collision: it would enforce the ARTIFACT of the protocol, not the protocol. That is
#     the new-table-wiring-guard lesson ("a guard cheaper to lie to than to satisfy is worse
#     than no guard"). It would also change the required-check set on every PR, which
#     CLAUDE.md documents as the operation that can deadlock every open PR.
#   * And the harm is UNMEASURED. Ten merges without a claim on 2026-08-20 alone, three
#     sessions over three days -- and zero reported collisions. Shipping a hard gate before
#     establishing the harm rate is the exposure-ceiling mistake
#     (gross-exposure-governance-DESIGN.md section 6: a ceiling with no distribution behind
#     it silently throttles correct work).
#
# So this MEASURES instead of gating. It cannot block a merge, cannot fail a PR, and has
# nothing to game because it gates nothing. Once there is a distribution -- how often, and
# whether an unclaimed merge ever coincides with a real collision -- the enforcement
# question can be decided on evidence.
#
# WHY pull_request_target AND NOT pull_request: a fork PR's GITHUB_TOKEN is read-only, so
# `issues: write` would silently fail to post. This job NEVER checks out or executes PR-authored
# code -- it only calls github-script against the API -- so it carries none of the usual
# pull_request_target risk, which comes entirely from running untrusted checkout content.
#
# THIS IS A HEURISTIC DETECTOR, NOT A PROOF, and the failure direction is known: the matcher
# requires the PR number to appear AFTER a CLAIM token on the same line, so a combined
# "RELEASE #A ... CLAIM #B" comment does not register as a claim for A. A's own earlier claim
# comment normally still matches inside the window, but a false "unclaimed" is possible.
# Read the counts as a rate, never as a verdict on a specific session.
#
# THREE STATES, NEVER COLLAPSED (collapsed-state discipline): claimed / unclaimed /
# could_not_check. A read failure must never render as "unclaimed", which would be a
# confident accusation built on an unasserted denominator (diagnostic-provenance sub-class C).

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: merge-claim-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The BASE ref, never the PR head — trusted content only, the same
      # rationale scope-overlap-audit.yml states for its own checkout. This job
      # gained a checkout on 2026-09-08 for one reason: the board issue number is
      # no longer hardcoded here. It was, and that is how this workflow spent
      # ~20h posting audits into a board at GitHub's 2500-comment cap that could
      # not accept them (issue #6927, frozen 2026-09-07T11:28:17Z — and the last
      # comment it ever accepted was THIS workflow's own post).
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Resolve the live coordination board
        id: board
        run: |
          set -uo pipefail
          python3 scripts/ci/board_pointer.py --self-test || exit 1
          num="$(python3 scripts/ci/board_pointer.py --number)"; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "issue=$num" >> "$GITHUB_OUTPUT"
            echo "stale_after=$(jq -r .stale_after_hours docs/claude/board-pointer.json)" >> "$GITHUB_OUTPUT"
          else
            # NOT a failure of this job, and NOT "no claim". No board resolved
            # means WE DID NOT LOOK — the third state, carried forward intact.
            echo "::warning::merge-claim-audit: could_not_check — no live board resolved (rc=$rc)"
          fi

      - name: Check for a merge-slot claim on the coordination board
        uses: actions/github-script@v7
        env:
          BOARD_ISSUE: ${{ steps.board.outputs.issue }}
          BOARD_RC: ${{ steps.board.outputs.rc }}
          STALE_AFTER_HOURS: ${{ steps.board.outputs.stale_after }}
          LOOKBACK_HOURS: '48'
        with:
          script: |
            const pr = context.payload.pull_request;
            const prNum = pr.number;
            const mergedAt = new Date(pr.merged_at);
            const since = new Date(mergedAt.getTime() - Number(process.env.LOOKBACK_HOURS) * 3600e3);

            // state is one of: claimed | unclaimed | could_not_check -- never inferred from a null
            let state = 'could_not_check';
            let reason = '';
            let comments = [];

            // NO BOARD RESOLVED is could_not_check and it STOPS HERE. It is not
            // "unclaimed" -- that would be an accusation built on a denominator
            // nobody asserted (diagnostic-provenance sub-class C).
            const board = Number(process.env.BOARD_ISSUE);
            if (!Number.isInteger(board) || board <= 0) {
              reason = `no live coordination board resolved from docs/claude/board-pointer.json `
                     + `(rc=${process.env.BOARD_RC}) — nothing was checked`;
              core.warning(`could_not_check — ${reason}`);
              core.setOutput('state', state);
              return;
            }

            try {
              comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: board, since: since.toISOString(), per_page: 100,
              });
            } catch (e) {
              reason = `board read failed: ${e.message}`;
              core.warning(`could_not_check — ${reason}`);
              core.setOutput('state', state);
              return;
            }

            // DENOMINATOR ASSERTION — and since 2026-09-08 it rests on an INVARIANT
            // rather than on an observation about traffic. `board-heartbeat.yml` posts a
            // 💓 HEARTBEAT every 6h, so a LIVE board cannot be silent. A 48h window
            // returning zero comments is therefore positive evidence of a broken board,
            // not evidence of a quiet one. Treating 0 as a clean negative is the exact
            // failure this guard exists to refuse.
            if (comments.length === 0) {
              state = 'could_not_check';
              reason = `zero comments in the last ${process.env.LOOKBACK_HOURS}h on board #${board}, `
                     + `which posts a heartbeat every 6h — so this is a dead or unreadable board, `
                     + `not "no claim"`;
              core.warning(`could_not_check — ${reason}`);
              core.setOutput('state', state);
              return;
            }

            // STALENESS. The #6927 failure in one check: reads succeeded, the tail was
            // valid, and the board had been frozen for ~20h. A frozen board is only
            // detectable against a clock, so it is checked against one.
            const staleH = Number(process.env.STALE_AFTER_HOURS || 18);
            const newest = comments.reduce(
              (m, c) => Math.max(m, Date.parse(c.created_at)), 0);
            const ageH = (Date.now() - newest) / 3600e3;
            if (newest && ageH > staleH) {
              state = 'could_not_check';
              reason = `board #${board}'s newest comment is ${ageH.toFixed(1)}h old and the `
                     + `heartbeat runs every 6h — the board is FROZEN or write-blocked. Reads `
                     + `still succeed, which is why this needs saying out loud. Rotate via `
                     + `board-rotate.yml.`;
              core.error(`could_not_check — ${reason}`);
              core.setOutput('state', state);
              return;
            }

            // A claim names the PR. Match #<n> / "PR <n>" / bare <n> on a claim line only,
            // with a word boundary so #1001 never satisfies a check for #100.
            const claimRe = new RegExp(
              String.raw`(MERGE SLOT CLAIM|CLAIM)[^\n]*?(?:#|PR\s*|\bpull/)0*${prNum}\b`, 'i');
            const hit = comments.find(c => claimRe.test(c.body || ''));
            state = hit ? 'claimed' : 'unclaimed';
            core.setOutput('state', state);
            core.info(`PR #${prNum}: ${state} (scanned ${comments.length} comments since ${since.toISOString()})`);

            if (state === 'claimed') return;   // silent on the happy path — no noise

            const body = [
              `### 📋 merge-slot audit — PR #${prNum} merged with no claim found`,
              ``,
              `**This is an observation, not an accusation, and nothing was blocked.** ` +
              `[#${prNum}](${pr.html_url}) merged at \`${pr.merged_at}\` and no ` +
              `\`MERGE SLOT CLAIM\` naming it appears in the last ${process.env.LOOKBACK_HOURS}h ` +
              `of this board (${comments.length} comments scanned).`,
              ``,
              `If you are on **Claude Code on the web**, this is expected rather than a lapse: ` +
              `the \`PreToolUse\` guard is never invoked there (that runtime registers zero ` +
              `project hooks — \`BL-20260820-PROJECT-HOOKS-INERT-ON-WEB\`), so nothing stops an ` +
              `unclaimed merge. **A merge going through is not evidence the protocol ran.**`,
              ``,
              `This workflow exists to build the number nobody has: how often this happens, and ` +
              `whether it ever coincides with a real collision. It deliberately does **not** gate ` +
              `merging — see the rationale at the top of \`.github/workflows/merge-claim-audit.yml\`.`,
              ``,
              `Author: \`${pr.user.login}\` · head \`${pr.head.sha.slice(0, 8)}\` · base \`${pr.base.ref}\``,
              ``,
              `---`,
              `_Generated by [Claude Code](https://claude.ai/code)_`,
            ].join('\n');

            // ⚠️ THE POST IS CHECKED. Until 2026-09-08 this was a bare `await`, so when
            // #6927 hit the 2500-comment cap every audit of an unclaimed merge threw into
            // a post-merge run nobody watches — the audit stopped existing and said
            // nothing. A detector whose own output channel can fail silently is not a
            // detector. This names the likeliest cause instead of a bare stack trace.
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: board, body,
              });
            } catch (e) {
              core.setFailed(
                `merge-claim-audit: the audit for PR #${prNum} COULD NOT BE POSTED to board `
                + `#${board}: ${e.message}. If this is a 403, the board is very likely at `
                + `GitHub's ${'2500'}-comment cap — reads keep succeeding, writes do not. `
                + `Rotate via board-rotate.yml. This finding is otherwise LOST: state was `
                + `'${state}'.`);
            }
