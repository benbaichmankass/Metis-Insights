# Proves the NON-CRYPTO candle lane on a real network, which the sandbox cannot.
#
# Yahoo returns HTTP 429 to the dev sandbox, so `--source yfinance` is
# implementable but UNVERIFIABLE there. The M20 readiness note is explicit that
# the source must be proven on a GitHub runner; this is that proof, and it is
# dispatch-only so it never runs on a push.
#
# It is also the lane's smoke test: it asserts a real CSV with a sane schema,
# and REPORTS THE SPAN OBTAINED against the span requested — yfinance caps
# intraday history (~730 d at 1h, ~60 d at 15m), and a truncated window that
# nobody printed reads exactly like a complete one.
name: yfinance-lane-proof

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Bot symbol (must be mapped in yf_symbols._DEFAULT_TICKER_MAP)"
        default: "SPY"
      interval:
        description: "Kline code: 1 / 5 / 15 / 60 / D"
        default: "D"
      days:
        description: "Trailing days to request"
        default: "365"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ⚠️ DELIBERATELY MINIMAL — DO NOT ADD `pyyaml` HERE.
      # The first proof run failed with "No module named 'yaml'" because
      # reading a dict of ticker strings imported `ml.datasets` -> `.registry`
      # -> fourteen dataset-family builders, one of which imports yaml.
      # Installing pyyaml would have made the run green while leaving the
      # coupling in place for the next transitive import to break. The map now
      # lives in the import-free `ml/datasets/adapters/yf_symbols.py`, loaded
      # by file path, so this two-package install is ALSO the decoupling
      # proof: widen it and the job stops proving that.
      - name: Install (pandas + yfinance ONLY — see the note above)
        run: pip install pandas yfinance

      - name: Fetch via the yfinance lane
        run: |
          set -euo pipefail
          mkdir -p data
          python scripts/ops/fetch_backtest_candles.py \
            --symbol "${{ inputs.symbol }}" \
            --interval "${{ inputs.interval }}" \
            --days "${{ inputs.days }}" \
            --source yfinance \
            --output data/yf_proof.csv

      - name: Assert the result is a real book, not an empty green
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import pandas as pd
          df = pd.read_csv("data/yf_proof.csv", parse_dates=["timestamp"])
          # A zero-row CSV would exit 0 from the fetch and prove nothing --
          # the whole point of this job is that "it ran" is not "it worked".
          assert len(df) > 0, "REFUSED: 0 rows -- the lane produced no book"
          need = {"timestamp", "open", "high", "low", "close", "volume"}
          missing = need - set(df.columns)
          assert not missing, f"REFUSED: missing columns {sorted(missing)}"
          bad = df[~(df["high"] >= df["low"])]
          assert bad.empty, f"REFUSED: {len(bad)} bars with high < low"
          assert df["close"].notna().all(), "REFUSED: NaN closes survived the filter"
          span = (df["timestamp"].max() - df["timestamp"].min()).days
          print(f"rows={len(df)}  span={span} d  "
                f"{df['timestamp'].min().date()} -> {df['timestamp'].max().date()}")
          # Reported, never asserted: a SHORT span is the documented yfinance
          # cap doing its job, not a failure -- but it must be visible.
          req = int("${{ inputs.days }}")
          if span < req * 0.8:
              print(f"NOTE: obtained {span} d against {req} d requested -- "
                    f"treat this as a PARTIAL window (yfinance intraday cap).")

          # AFFORDABILITY PROBE (2026-08-25). The job proved the lane WORKS but
          # reported nothing a reader could size a position from, so the one
          # question a small real-money account actually asks -- "can this
          # symbol trade on $N?" -- still needed a separate data path, and from
          # the dev sandbox there isn't one (Yahoo resets the connection here;
          # measured, not assumed).
          #
          # On a WHOLE-UNIT venue like alpaca (risk.WHOLE_UNIT_QTY_EXCHANGES) a
          # sub-1-share size is a REFUSAL, not a fractional fill, so a symbol is
          # reachable only if BOTH hold: one share fits the cash, AND one
          # share's stop distance fits the risk budget. Two independent
          # constraints -- SPY fails the first, GDX fails the second -- and a
          # probe reporting only price would answer half the question.
          #
          # ATR14 is a PROXY for the stop distance, NOT the strategy's own
          # geometry: each leg computes its stop its own way. It is the right
          # order of magnitude for a go/no-go screen and must not be quoted as
          # the leg's actual risk. Printed, never asserted -- an unaffordable
          # symbol is a fact about the account, not a failure of the lane.
          # ⚠️ A PRICE IS NOT SOUND JUST BECAUSE A ROW EXISTS. Measured the
          # first time this probe ran: SPLG returned `rows=1 span=0 d` on a
          # 120-day DAILY request, one bar dated 2026-07-17 — 39 days stale —
          # and the job went GREEN and printed `last_close=87.4800` with no
          # caveat. The existing assert catches ZERO rows; it cannot catch ONE.
          # That is this job's own stated sin ("it ran" is not "it worked")
          # reappearing one row above the floor, in the number a human would
          # size a real position from. Sibling symbols were fine on the same
          # request (SH/PSQ/TBF/TBX all returned 83 bars), so this is a
          # per-symbol venue data gap, not a lane failure — which is exactly
          # why it must be REPORTED per symbol rather than asserted globally.
          # The caveat rides ON the last_close line: a reader who copies one
          # number must not be able to leave the warning behind.
          last = float(df["close"].iloc[-1])
          last_ts = df["timestamp"].max()
          age_d = (pd.Timestamp.utcnow().tz_localize(None).normalize()
                   - last_ts.tz_localize(None).normalize()).days
          thin = len(df) < 15
          stale = age_d > 5
          if thin or stale:
              why = []
              if thin:
                  why.append(f"only {len(df)} bar(s)")
                  if stale:
                      why.append(f"newest is {age_d} d old")
              elif stale:
                  why.append(f"newest bar is {age_d} d old")
              print(f"last_close={last:.4f}  ⚠️ UNSOUND ({'; '.join(why)}) — "
                    f"DO NOT SIZE A POSITION FROM THIS NUMBER")
              print(f"as_of={last_ts.date()}  bars={len(df)}")
          else:
              print(f"last_close={last:.4f}  as_of={last_ts.date()}  bars={len(df)}")
          _printed_last = True
          tr = pd.concat([
              df["high"] - df["low"],
              (df["high"] - df["close"].shift()).abs(),
              (df["low"] - df["close"].shift()).abs(),
          ], axis=1).max(axis=1)
          atr = float(tr.rolling(14).mean().iloc[-1]) if len(df) >= 15 else float("nan")
          if atr == atr:  # not NaN
              print(f"atr14={atr:.4f}  atr14_pct={100 * atr / last:.3f}%")
              print(f"AFFORDABILITY: 1 share costs ${last:.2f}; "
                    f"~${atr:.2f} of stop distance per share (ATR14 proxy)")
          else:
              print("atr14=unavailable (fewer than 15 bars) -- "
                    "stop-distance proxy NOT computed, do not infer one")
          PY
