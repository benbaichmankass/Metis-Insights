# Proves the NON-CRYPTO candle lane on a real network, which the sandbox cannot,
# and MEASURES what a small whole-share account can actually afford.
#
# Yahoo returns HTTP 429 to the dev sandbox, so `--source yfinance` is
# implementable but UNVERIFIABLE there. The M20 readiness note is explicit that
# the source must be proven on a GitHub runner; this is that proof, and it is
# dispatch-only so it never runs on a push.
#
# It is also the lane's smoke test: it asserts a real CSV with a sane schema,
# and REPORTS THE SPAN OBTAINED against the span requested — yfinance caps
# intraday history (~730 d at 1h, ~60 d at 15m), and a truncated window that
# nobody printed reads exactly like a complete one.
#
# BATCHED 2026-08-25 (operator-directed). `symbol` takes a COMMA-SEPARATED LIST.
# One dispatch per symbol made a real candidate sweep impossible — the question
# "which of these 50 instruments can a $200 whole-share account hold?" needs one
# run, not fifty. Every symbol still goes through `fetch_backtest_candles.py
# --source yfinance`, so this measures THE LANE and never bypasses it.
name: yfinance-lane-proof

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Bot symbol, or a COMMA-SEPARATED LIST (must be mapped in yf_symbols._DEFAULT_TICKER_MAP)"
        default: "SPY"
      interval:
        description: "Kline code: 1 / 5 / 15 / 60 / D"
        default: "D"
      days:
        description: "Trailing days to request"
        default: "365"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ⚠️ DELIBERATELY MINIMAL — DO NOT ADD `pyyaml` HERE.
      # The first proof run failed with "No module named 'yaml'" because
      # reading a dict of ticker strings imported `ml.datasets` -> `.registry`
      # -> fourteen dataset-family builders, one of which imports yaml.
      # Installing pyyaml would have made the run green while leaving the
      # coupling in place for the next transitive import to break. The map now
      # lives in the import-free `ml/datasets/adapters/yf_symbols.py`, loaded
      # by file path, so this two-package install is ALSO the decoupling
      # proof: widen it and the job stops proving that.
      - name: Install (pandas + yfinance ONLY — see the note above)
        run: pip install pandas yfinance

      # Per-symbol fetch through the REAL lane. A symbol that fails is RECORDED
      # as failed, never silently skipped: a table missing the rows that did not
      # fetch reads exactly like a table where every candidate succeeded, which
      # is the unasserted-denominator failure this repo has a guard for.
      - name: Fetch each symbol via the yfinance lane
        run: |
          set -uo pipefail
          mkdir -p data/probe
          : > data/probe/_failed.txt
          IFS=',' read -ra SYMS <<< "${{ inputs.symbol }}"
          for raw in "${SYMS[@]}"; do
            sym="$(echo "$raw" | tr -d '[:space:]')"
            [ -z "$sym" ] && continue
            echo "--- fetching $sym"
            if python scripts/ops/fetch_backtest_candles.py \
                 --symbol "$sym" \
                 --interval "${{ inputs.interval }}" \
                 --days "${{ inputs.days }}" \
                 --source yfinance \
                 --output "data/probe/${sym}.csv"; then
              echo "    ok"
            else
              echo "    FETCH FAILED (recorded, not skipped)"
              echo "$sym" >> data/probe/_failed.txt
            fi
          done

      - name: Affordability table (reports inputs; the SIZER is authoritative)
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, os, sys
          import pandas as pd

          requested = [s.strip() for s in """${{ inputs.symbol }}""".split(",") if s.strip()]
          failed = []
          if os.path.exists("data/probe/_failed.txt"):
              failed = [l.strip() for l in open("data/probe/_failed.txt") if l.strip()]

          NEED = {"timestamp", "open", "high", "low", "close", "volume"}
          rows = []
          for sym in requested:
              path = f"data/probe/{sym}.csv"
              if sym in failed or not os.path.exists(path):
                  rows.append({"sym": sym, "state": "fetch_failed"})
                  continue
              df = pd.read_csv(path, parse_dates=["timestamp"])
              if len(df) == 0:
                  rows.append({"sym": sym, "state": "empty_book"})
                  continue
              missing = NEED - set(df.columns)
              if missing:
                  rows.append({"sym": sym, "state": f"bad_schema:{sorted(missing)}"})
                  continue
              bad = df[~(df["high"] >= df["low"])]
              if not bad.empty:
                  rows.append({"sym": sym, "state": f"bad_bars:{len(bad)}"})
                  continue

              last = float(df["close"].iloc[-1])
              last_ts = df["timestamp"].max()
              age_d = (pd.Timestamp.utcnow().tz_localize(None).normalize()
                       - last_ts.tz_localize(None).normalize()).days
              span = (df["timestamp"].max() - df["timestamp"].min()).days

              # ⚠️ A PRICE IS NOT SOUND JUST BECAUSE A ROW EXISTS. Measured when
              # this probe first ran: SPLG returned rows=1 span=0 on a 120-day
              # DAILY request, one bar 39 days stale, and the job went GREEN
              # printing last_close=87.4800 with no caveat. A zero-row assert
              # cannot catch ONE row. The verdict rides WITH the price so a
              # reader copying the number cannot leave the warning behind.
              thin, stale = len(df) < 15, age_d > 5
              state = "sound"
              if thin and stale:
                  state = f"UNSOUND(thin {len(df)}b; stale {age_d}d)"
              elif thin:
                  state = f"UNSOUND(thin {len(df)}b)"
              elif stale:
                  state = f"UNSOUND(stale {age_d}d)"

              tr = pd.concat([
                  df["high"] - df["low"],
                  (df["high"] - df["close"].shift()).abs(),
                  (df["low"] - df["close"].shift()).abs(),
              ], axis=1).max(axis=1)
              atr = float(tr.rolling(14).mean().iloc[-1]) if len(df) >= 15 else float("nan")

              rows.append({"sym": sym, "state": state, "last": last, "atr": atr,
                           "bars": len(df), "span": span, "as_of": last_ts.date()})

          # ⚠️ ATR14 IS A PROXY FOR THE STOP DISTANCE, NOT THE STRATEGY'S OWN
          # GEOMETRY — each leg computes its stop its own way. And this job
          # deliberately does NOT compute an affordability verdict: duplicating
          # RiskManager.position_size here would be a SECOND definition of
          # "can this trade", free to drift from the one that governs. It
          # reports the INPUTS; the sizer decides. (Hand arithmetic on these
          # numbers is also wrong — it cannot see risk.py::_ROUND_UP_BUDGET_MULT.)
          print()
          print(f"{'sym':7s} {'state':26s} {'last':>10s} {'atr14':>9s} {'atr%':>7s} {'bars':>6s} {'span':>6s}  as_of")
          for r in sorted(rows, key=lambda x: (x.get("last") is None, x.get("last") or 0)):
              if "last" not in r:
                  print(f"{r['sym']:7s} {r['state']:26s} {'—':>10s} {'—':>9s} {'—':>7s} {'—':>6s} {'—':>6s}  —")
                  continue
              a = r["atr"]
              atr_s = f"{a:9.4f}" if a == a else "        —"
              pct_s = f"{100*a/r['last']:6.3f}%" if a == a else "      —"
              print(f"{r['sym']:7s} {r['state']:26s} {r['last']:10.4f} {atr_s} {pct_s} "
                    f"{r['bars']:6d} {r['span']:6d}  {r['as_of']}")

          # THE DENOMINATOR, always. A table that lists only what worked reads
          # as complete coverage of what was asked for.
          sound = [r for r in rows if r.get("state") == "sound"]
          unsound = [r for r in rows if "last" in r and r.get("state") != "sound"]
          nodata = [r for r in rows if "last" not in r]
          print()
          print(f"requested={len(requested)}  sound={len(sound)}  "
                f"unsound_price={len(unsound)}  no_data={len(nodata)}")
          if nodata:
              print("  no_data (NOT silently dropped): "
                    + ", ".join(f"{r['sym']}={r['state']}" for r in nodata))
          if unsound:
              print("  unsound price — DO NOT SIZE FROM THESE: "
                    + ", ".join(f"{r['sym']}({r['state']})" for r in unsound))

          req_days = int("${{ inputs.days }}")
          short = [r for r in sound if r["span"] < req_days * 0.8]
          if short:
              print(f"  PARTIAL window (yfinance cap), obtained < 80% of {req_days}d: "
                    + ", ".join(f"{r['sym']}={r['span']}d" for r in short))

          # Failure rule, stated rather than implied: a SINGLE-symbol dispatch is
          # the original lane PROOF, so no data is a real failure. A multi-symbol
          # SWEEP is a measurement — an individual ticker with no data is a fact
          # about that ticker, and only a total wipeout means the lane is broken.
          if len(requested) == 1:
              if not sound and not unsound:
                  sys.exit("REFUSED: the single requested symbol produced no book")
          elif not sound and not unsound:
              sys.exit("REFUSED: every requested symbol produced no book — lane failure")
          PY
