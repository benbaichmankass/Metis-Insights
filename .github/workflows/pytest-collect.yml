name: pytest-collect

# Runs `pytest --collect-only` against the test tree on every PR.
# This is a structural check, not a test run: it surfaces import
# resolution / pytest collection failures without paying the cost
# of full test execution.
#
# **BLOCKING** as of S-045 (PR #438). Until S-045, the workflow rode
# advisory because `tests/conftest.py` stubbed `telegram` /
# `telegram.ext` as bare `MagicMock()` modules (no `telegram.error`
# / `telegram.constants` submodules), and `tests/test_bot_web_sweep.py`
# stubbed `fastapi` with the wrong "is it in sys.modules" guard.
# 45 telegram-failures + 7 fastapi-failures = 52 collection errors on
# `main`. S-045 T1 fixed both stubs (BUG-062); S-045 T2 (this file)
# drops the `|| true` shim and `--continue-on-collection-errors`. The
# workflow now fails any PR that introduces a collection regression.
# See `docs/claude/ci-status-checks.md` § pytest-collect.
#
# **2026-07-06 (Actions-minutes billing cap, MB-20260706-CI-MINUTES):**
# this is a REQUIRED status check (branch-protection-sync.yml
# REQUIRED_CONTEXTS), so its trigger can NEVER carry a `paths:` filter —
# GitHub would leave the check permanently "pending" on any PR that
# doesn't touch a matching path, blocking that PR from ever merging.
# Instead the job always runs (cheap: checkout + a `git diff --name-only`)
# but SKIPS the expensive steps (pip install of the full dependency set +
# the actual collect) when nothing python/test-relevant changed — see the
# "Determine relevant changed files" step. A doc-only / config-only PR
# still gets a green required check, just without paying for the install.

on:
  # Dormant until the native merge queue is enabled (BL-20260726 merge-queue enablement);
  # required checks MUST run on the merge_group ref or the queue stalls.
  merge_group:
    # NOTE (P2.1, 2026-07-31 audit): on merge_group events github.base_ref is
    # EMPTY — every base_ref expression in this file falls back to 'main'
    # (the only branch the queue serves; pull_request trigger is main-scoped).
  pull_request:
    # ⚠️ `ready_for_review` is deliberately ABSENT. Every Claude PR is opened
    # as a draft (harness rule), and a draft ALREADY runs these checks here via
    # `opened` + `synchronize` — so re-running on the ready transition re-tests
    # an IDENTICAL sha. It is not merely redundant: the fresh runs reset the
    # head's status to pending, and GitHub then refuses the merge with
    # "3 of 3 required status checks are in progress" for a PR that was green.
    # The trigger CREATED the block it looks like it guards against.
    # Measured 2026-08-31: four PRs, ~15 min of wall clock each.
    # Introduced with no recorded rationale (#1644, 2026-05-21 — copied in with
    # the trigger set when pytest-run was created), so nothing is being undone.
    # ⚠️ This does NOT change REQUIRED_CONTEXTS in branch-protection-sync.yml
    # (still pytest-collect / pytest-run / guards), which is the operation
    # CLAUDE.md warns can deadlock every open PR.
    # ⚠️ RE-ADD IT if drafts ever stop running checks: a draft with no runs and
    # no ready trigger would be unmergeable forever.
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  # Manually dispatchable so a FEATURE BRANCH can always run collection —
  # the same remedy `pytest-run.yml` and `guards.yml` already carry for
  # BL-20260730-PR-CI-NOT-ATTACHING, which this file never received. That gap
  # is not cosmetic: when a `pull_request` delivery drops, the two siblings can
  # be dispatched by hand and this one CANNOT, so it stays the single required
  # check with no way to run — and a check that silently did not run renders
  # identically to green. Re-confirmed live on 2026-08-07: PR #8608 sat at
  # 0 check runs across an `opened`, a `synchronize` (force-push) and a
  # `ready_for_review`, and only the two dispatchable workflows could be
  # recovered.
  workflow_dispatch:

# Concurrency (2026-08-10, BL-20260810-REQUIRED-WORKFLOWS-NO-CONCURRENCY-GROUP).
# Without a group, a re-queue (a second push to the same PR, or the
# `opened`+`synchronize` double-fire) STACKS a second full run instead of
# superseding the first — for pytest-collect that is a wasted ~full dependency install against the
# 2,000-minute free-tier cap this repo already hit once (MB-20260706-CI-MINUTES).
# Observed live on PR #8733: a second commit queued a second full suite while
# the first was still running.
#
# `github.event_name` is IN THE GROUP KEY deliberately: a `merge_group` run must
# NEVER be cancelled by a `pull_request` run on the same ref, or the merge queue
# stalls on a required check that reports `cancelled`. Same shape as guards.yml.
concurrency:
  group: pytest-collect-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changed files
        id: changed
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref || 'main' }}" --quiet
            RANGE="origin/${{ github.base_ref || 'main' }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "::notice::No prior commit to diff against — running the full check."
              exit 0
            fi
            RANGE="$BEFORE...${{ github.sha }}"
          fi
          FILES=$(git diff --name-only $RANGE || true)
          echo "Changed files ($RANGE):"
          echo "$FILES"
          if echo "$FILES" | grep -Eq '\.py$|requirements(-test)?\.txt$|pytest\.ini$|setup\.cfg$|pyproject\.toml$|\.github/workflows/pytest-collect\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .py/test-config files changed — skipping the pip install + collect steps (short-circuit, MB-20260706-CI-MINUTES)."
          fi

      - name: Set up Python 3.11
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + test dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Collect tests (no execution; blocking)
        if: steps.changed.outputs.relevant == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # --ignore=tests/test_main_loop.py mirrors CLAUDE.md "Default
          # verification" + sprint-completion guidance: that module imports
          # the live trading entrypoint and is excluded from sandbox runs.
          # No `--continue-on-collection-errors` and no `|| true` — the
          # workflow MUST fail on the first collection error so CI gates
          # the PR. If a future PR introduces a regression, fix the stub
          # / dep / import in the PR (see BUG-062 for the canonical
          # "stub if missing" pattern).
          pytest --collect-only -q tests/ \
            --ignore=tests/test_main_loop.py
