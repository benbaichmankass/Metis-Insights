name: set-diag-token

# Push the DIAG_READ_TOKEN repo secret onto the live VM and restart the
# read-only web-api so the new value takes effect. Use it to (re)sync the
# diag bearer between GitHub and /etc/ict-trader/web-api.env — e.g. when
# enabling direct /api/diag/* access from a Claude Code on the web
# environment, or rotating the token.
#
# SECURITY — why this never "hands the token back":
#   The token flows ONE way: GitHub secret -> VM. The workflow reads
#   secrets.DIAG_READ_TOKEN (auto-masked in logs), writes it into the VM
#   env file, and validates by HTTP status code only. It NEVER prints,
#   comments, or uploads the token. Every output channel a GitHub Action
#   has is wrong for a secret — logs are secret-masked, issue comments
#   and artifacts are repo-visible — so DELIVERY is the operator's job:
#   you choose the value, set it as the repo secret AND wherever you
#   consume it (e.g. the web-session DIAG_READ_TOKEN env var). This
#   workflow only propagates that same value to the VM.
#
# Operator flow:
#   1. Generate a token:   openssl rand -hex 32
#   2. Settings -> Secrets and variables -> Actions -> set the
#      DIAG_READ_TOKEN repo secret to it.
#   3. Run this workflow (Actions -> set-diag-token -> Run workflow),
#      or open an issue labelled `set-diag-token`.
#   4. Use the SAME value wherever you read the diag API — e.g. the
#      DIAG_READ_TOKEN environment variable of your cloud environment.
#
# Trust contract:
#   * Fixed-form remote script — no freeform shell from the issue body.
#   * Mutates exactly one key (DIAG_READ_TOKEN) in
#     /etc/ict-trader/web-api.env, backs the file up first, restarts
#     ict-web-api.service ONLY. Does NOT touch ict-trader-live.service,
#     accounts.yaml, strategies.yaml, risk caps, or order code.
#   * Tier-2 live-VM config mutation — operator-directed. Keep it
#     scoped to this one key; do not widen it to write arbitrary env.
#
# Required repo secrets:
#   * VM_SSH_KEY        — same key as vm-diag-snapshot / vm-web-api-recover
#   * DIAG_READ_TOKEN   — the bearer to install (operator sets this)
#
# Optional repo variables:
#   * VM_SSH_HOST       — defaults to 141.145.193.91 (Ampere live trader; was the
#                         x86 micro 158.178.210.252 pre-2026-06-14 cutover)
#   * VM_SSH_USER       — defaults to ubuntu

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run is happening (audit only)."
        required: false
        default: "manual operator dispatch"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write   # required to comment + close the request issue

concurrency:
  # Share the web-api target lock with vm-web-api-recover so a token
  # install and a self-heal restart never race on the same unit.
  group: vm-web-api-recover
  cancel-in-progress: false

jobs:
  set-token:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'set-diag-token'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VM_SSH_HOST: ${{ vars.VM_SSH_HOST || '141.145.193.91' }}
      VM_SSH_USER: ${{ vars.VM_SSH_USER || 'ubuntu' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validate secrets
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -eu
          fail=0
          if [ -z "${VM_SSH_KEY}" ]; then
            echo "::error::VM_SSH_KEY secret is unset. Add it under Settings → Secrets → Actions."
            fail=1
          fi
          if [ -z "${DIAG_READ_TOKEN}" ]; then
            echo "::error::DIAG_READ_TOKEN secret is unset. Set it under Settings → Secrets → Actions before running."
            fail=1
          fi
          # Guard against installing a typo / weak token.
          if [ -n "${DIAG_READ_TOKEN}" ] && [ "${#DIAG_READ_TOKEN}" -lt 16 ]; then
            echo "::error::DIAG_READ_TOKEN is shorter than 16 chars — refusing to install a weak token."
            fail=1
          fi
          # The remote script wraps the token in single quotes, so a
          # single quote in the value would break it. Hex/base64 tokens
          # never contain one; reject it explicitly rather than corrupt
          # the env file.
          case "${DIAG_READ_TOKEN}" in
            *\'*)
              echo "::error::DIAG_READ_TOKEN contains a single quote — use a hex/base64 token (e.g. openssl rand -hex 32)."
              fail=1
              ;;
          esac
          [ "$fail" -eq 0 ] || exit 1

      - name: Set up SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa,ecdsa,ed25519 "${VM_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install token on VM + restart web-api
        id: exec
        env:
          DIAG_READ_TOKEN: ${{ secrets.DIAG_READ_TOKEN }}
        run: |
          set -euo pipefail
          # The remote script is a QUOTED heredoc (no runner-side
          # expansion — every $ runs on the VM). The token is injected
          # via a bash string replacement of the __TOKEN__ placeholder,
          # NOT via argv or interpolation, so it never lands in a
          # process command line on the runner or the VM. The validate
          # step above already rejected a single quote in the value.
          template="$(cat <<'REMOTE'
          set -euo pipefail
          NEW_TOKEN='__TOKEN__'
          ENVFILE=/etc/ict-trader/web-api.env
          UNIT=ict-web-api.service

          # 0. FINGERPRINT WHAT THE VM SERVES, BEFORE WE TOUCH ANYTHING.
          #    BL-20260818-SET-DIAG-TOKEN-REPORTS-NEW-ON-UNCHANGED-VALUE:
          #    this script used to validate only that the installed token
          #    AUTHORIZES, and then print "authorized with the new token".
          #    That sentence is equally true of a value that never changed,
          #    and on 2026-08-18 it was printed over exactly that -- run
          #    32117038449 was green, the secret was unchanged, and a live
          #    public token exposure stayed open behind the green.
          #    "Does it work?" and "did it CHANGE?" are different questions,
          #    and rotation is the one operation where the second IS the
          #    question. So we measure it instead of labelling it.
          #    Fingerprints only, never the value: a 12-hex prefix of a
          #    sha256 over a >=128-bit token carries nothing recoverable
          #    (the same form the backlog row itself used).
          _fp() { printf '%s' "$1" | sha256sum | cut -c1-12; }

          _read_served_token() {
            # Prefer the RUNNING process environment over the env file: the
            # file is what a restart WOULD serve, the process is what is
            # being served right now. Echoes "<source>:<value>"; a source of
            # `unresolved` means WE COULD NOT LOOK -- which is a different
            # fact from "the token is empty" and must not collapse into it.
            local pid out=""
            pid="$(pgrep -f 'ict.web.api|web.api.main|uvicorn' 2>/dev/null | head -1 || true)"
            if [ -n "$pid" ]; then
              out="$(sudo cat "/proc/$pid/environ" 2>/dev/null | tr '\0' '\n' | grep -m1 '^DIAG_READ_TOKEN=' | cut -d= -f2- || true)"
              if [ -n "$out" ]; then printf 'process:%s' "$out"; return 0; fi
            fi
            if sudo test -f "$ENVFILE" 2>/dev/null; then
              out="$(sudo grep -m1 '^DIAG_READ_TOKEN=' "$ENVFILE" 2>/dev/null | cut -d= -f2- || true)"
              if [ -n "$out" ]; then printf 'envfile:%s' "$out"; return 0; fi
            fi
            printf 'unresolved:'
          }

          before_raw="$(_read_served_token)"
          before_src="${before_raw%%:*}"
          before_val="${before_raw#*:}"
          if [ -z "$before_val" ]; then before_src=unresolved; fi
          if [ "$before_src" = unresolved ]; then before_fp=""; else before_fp="$(_fp "$before_val")"; fi
          new_fp="$(_fp "$NEW_TOKEN")"
          unset before_val before_raw
          echo "before_token_source: $before_src"
          echo "before_token_fp: ${before_fp:-(unresolved)}"
          echo "incoming_token_fp: $new_fp"

          # 1. Back up the existing env file (or create it 600 root:root).
          if sudo test -f "$ENVFILE"; then
            sudo cp -a "$ENVFILE" "$ENVFILE.bak.$(date +%s)"
            echo ">>> backed up $ENVFILE"
          else
            echo ">>> $ENVFILE did not exist — creating it"
            sudo install -m 600 -o root -g root /dev/null "$ENVFILE"
          fi

          # 2. Replace-or-append DIAG_READ_TOKEN atomically, preserving
          #    all other keys. Temp file is 600 + user-owned, removed
          #    immediately after install.
          tmp="$(mktemp)"; chmod 600 "$tmp"
          sudo grep -v '^DIAG_READ_TOKEN=' "$ENVFILE" > "$tmp" 2>/dev/null || true
          printf 'DIAG_READ_TOKEN=%s\n' "$NEW_TOKEN" >> "$tmp"
          sudo install -m 600 -o root -g root "$tmp" "$ENVFILE"
          rm -f "$tmp"
          echo ">>> DIAG_READ_TOKEN updated in $ENVFILE (mode 600 root:root)"

          # 3. Restart web-api so the new EnvironmentFile is read.
          WRAPPER=/home/ubuntu/ict-trading-bot/scripts/ops/restart_web_api.sh
          if [ -x "$WRAPPER" ]; then
            echo ">>> restarting via wrapper"
            bash "$WRAPPER" || true
          else
            echo ">>> wrapper absent — inline restart"
            sudo systemctl restart "$UNIT"
            sleep 5
          fi

          # 4. Validate by HTTP status ONLY. The token goes into a 600
          #    curl config so it never appears in /proc/<pid>/cmdline;
          #    the response body is discarded — only the code is logged.
          post="$(systemctl is-active "$UNIT" 2>/dev/null || echo unknown)"
          echo "post-restart is-active: $post"
          cfg="$(mktemp)"; chmod 600 "$cfg"
          printf 'header = "Authorization: Bearer %s"\n' "$NEW_TOKEN" > "$cfg"
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 -K "$cfg" http://127.0.0.1:8001/api/diag/status || echo 000)"
          rm -f "$cfg"
          echo "diag_status_http: $code"

          # 5. Re-read what the VM serves NOW, then grade rotation as its
          #    own question. FOUR states, never collapsed into one label:
          #      rotated        - the served fingerprint changed AND it authorizes
          #      unchanged      - the fingerprint is identical; a NO-OP, said loudly
          #      unknown_before - the install worked but we could not read the
          #                       pre-state, so we CANNOT say which of the two
          #                       above happened. Not "rotated" by default.
          #      failed         - the unit is not active, or the token does not
          #                       authorize
          after_raw="$(_read_served_token)"
          after_src="${after_raw%%:*}"
          after_val="${after_raw#*:}"
          if [ -z "$after_val" ]; then after_src=unresolved; fi
          if [ "$after_src" = unresolved ]; then after_fp=""; else after_fp="$(_fp "$after_val")"; fi
          unset after_val after_raw
          echo "after_token_source: $after_src"
          echo "after_token_fp: ${after_fp:-(unresolved)}"

          if [ "$post" != active ] || [ "$code" != 200 ]; then
            state=failed
          elif [ "$before_src" = unresolved ]; then
            state=unknown_before
          elif [ "$before_fp" = "$new_fp" ]; then
            state=unchanged
          else
            state=rotated
          fi
          printf 'ROTATION_STATE=%s\n' "$state"

          if [ -n "$after_fp" ] && [ "$after_fp" != "$new_fp" ]; then
            echo "WARNING: the running process serves ${after_fp}, not the value we installed (${new_fp}) - the restart may not have picked up the env file."
          fi

          case "$state" in
            rotated)
              echo "RESULT: rotated - served fingerprint ${before_fp} -> ${new_fp}, web-api active, /api/diag/status authorized."
              echo "  The OLD value is now dead. Update every consumer that still holds it."
              exit 0
              ;;
            unchanged)
              echo "RESULT: unchanged - NO-OP. The repo secret holds the SAME value the VM was already serving (fingerprint ${new_fp} before and after)."
              echo "  NOTHING WAS ROTATED. If you intended to rotate, the new value did NOT reach the REPOSITORY Actions secret named DIAG_READ_TOKEN"
              echo "  (Settings -> Secrets and variables -> Actions). Check it is repo-scoped, not an environment secret, and that the edit was saved."
              exit 0
              ;;
            unknown_before)
              echo "RESULT: unknown_before - the install succeeded (web-api active, /api/diag/status authorized with fingerprint ${new_fp}),"
              echo "  but the token the VM served BEFORE could not be read, so we CANNOT say whether this was a rotation or a no-op."
              echo "  Do NOT record this as a rotation. To settle it, probe the OLD value directly: it must now return 401."
              exit 0
              ;;
            *)
              echo "RESULT: failed - is-active=$post diag_status_http=$code"
              echo "  (401 = token mismatch, 503 = DIAG disabled on VM, 000 = web-api unreachable)"
              exit 1
              ;;
          esac
          REMOTE
          )"
          remote_script="${template//__TOKEN__/$DIAG_READ_TOKEN}"

          set +e
          ssh -i ~/.ssh/id_rsa \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              "${VM_SSH_USER}@${VM_SSH_HOST}" \
              "bash -s" <<<"$remote_script" \
              > action-output.txt 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >>"$GITHUB_OUTPUT"
          # Lift the remote verdict out of the transcript. Default
          # `unknown` when the sentinel is absent (an old VM copy of the
          # script, or a failure before it printed) -- an absent verdict
          # is its own state and must never default to `rotated`.
          state="$(sed -n 's/^ROTATION_STATE=//p' action-output.txt | head -1)"
          echo "rotation_state=${state:-unknown}" >>"$GITHUB_OUTPUT"
          # action-output.txt carries NO token -- only HTTP codes, messages
          # and 12-hex sha256 PREFIXES (not the value); the secret is
          # masked even if something slipped.
          cat action-output.txt
          exit "${rc}"

      # ────────────────────────────────────────────────────────────
      # Issue-driven path: comment status (no token) + close the issue.
      # ────────────────────────────────────────────────────────────

      - name: Reply to issue with success
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.exec.outputs.exit_code }}
          ROTATION_STATE: ${{ steps.exec.outputs.rotation_state }}
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('action-output.txt', 'utf8');
            const MAX_BODY = 50_000;
            const tail = output.length > MAX_BODY ? output.slice(-MAX_BODY) : output;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // The headline states the MEASURED rotation verdict, not the
            // fact that the run was green. A green run over an unchanged
            // secret is exactly what happened on 2026-08-18, and the old
            // headline ("authorized with the new token") made it read as a
            // completed rotation -- BL-20260818-SET-DIAG-TOKEN-REPORTS-NEW-ON-UNCHANGED-VALUE.
            const state = process.env.ROTATION_STATE || 'unknown';
            const HEAD = {
              rotated: '✅ **set-diag-token — ROTATED.** The value the VM serves CHANGED and the new one authorizes. The old token is now dead; update every consumer that still holds it.',
              unchanged: '⚠️ **set-diag-token — UNCHANGED (no-op).** The repo secret holds the SAME value the VM was already serving. **Nothing was rotated.** If you meant to rotate, the new value did not reach the *repository* Actions secret `DIAG_READ_TOKEN` (Settings → Secrets and variables → Actions) — check it is repo-scoped, not an environment secret, and that the edit saved.',
              unknown_before: '⚠️ **set-diag-token — INSTALLED, rotation UNVERIFIED.** The token authorizes, but the value the VM served *before* could not be read, so this run cannot say whether anything changed. **Do not record it as a rotation** — settle it by probing the old value directly (it must return 401).',
              unknown: '⚠️ **set-diag-token — verdict MISSING.** The run finished but printed no `ROTATION_STATE`. Treat rotation as unverified.',
            };
            const body =
              `${HEAD[state] || HEAD.unknown}\n\n` +
              `Run: ${runUrl}\n` +
              `Exit code: ${process.env.EXIT_CODE} · rotation_state: \`${state}\`\n\n` +
              `Set the SAME value as the \`DIAG_READ_TOKEN\` env var wherever you ` +
              `consume the diag API. The transcript below carries 12-hex sha256 ` +
              `**prefixes** for comparison — never the token itself.\n` +
              `\n\`\`\`\n${tail}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });

      - name: Reply to issue with failure
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.exec.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('action-output.txt', 'utf8');
            } catch (_) {
              output = '(no action-output.txt — failure happened before SSH ran; likely an unset secret)';
            }
            const MAX_BODY = 50_000;
            const tail = output.length > MAX_BODY ? output.slice(-MAX_BODY) : output;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body =
              `❌ **set-diag-token run failed.**\n` +
              `Run: ${runUrl}\n` +
              `Exit code: ${process.env.EXIT_CODE || '(failed before exec)'}\n\n` +
              `Common causes: DIAG_READ_TOKEN or VM_SSH_KEY secret unset; SSH host ` +
              `unreachable; web-api didn't return active; /api/diag/status not 200 ` +
              `(401 token mismatch / 503 DIAG disabled). No token is ever printed.\n` +
              `\n\`\`\`\n${tail}\n\`\`\``;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });
