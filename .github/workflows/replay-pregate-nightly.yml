name: replay-pregate-nightly

# Durable, session-INDEPENDENT runner for the ML replay pre-gate (RG3).
#
# Baselines the shadow-stage regime fleet through the point-in-time replay
# pre-gate (scripts/ml/replay_pregate_fleet.py) on the trainer VM and commits
# the report back to the repo, so the result survives a dead Claude session.
# This is the overnight "run through the trainings" substrate: it runs on a
# nightly schedule, on manual dispatch, and on a labelled issue — no session,
# no keep-alive cron required.
#
# What it does (all read-only research, Tier-1):
#   1. SSH the trainer VM, fast-forward the working tree to the requested ref,
#      and LAUNCH the driver DETACHED (setsid+nohup -> files on the VM). The
#      launch call returns immediately.
#   2. Run scripts/ml/replay_pregate_fleet.py over every shadow-stage regime
#      head, scoring each through the LIVE predict path vs the dataset's own
#      regime_label (true market_features parity — no threshold guessing).
#   2b. POLL for the completion sentinel with short, disposable SSH calls, then
#      fetch stdout/stderr and THE DRIVER'S OWN exit code. ⚠️ The run no longer
#      rides one long-lived interactive channel: a transport drop mid-run costs
#      one retried poll instead of the whole fleet run. See "WHY THE RUN IS
#      DETACHED" on the launch step for the measurement that forced this.
#   3. Classify the run by the STAGE that failed (scripts/ml/pregate_stream.py),
#      NEVER by guessing: the exit code plus a line-anchored OpenSSH client
#      signature separate a broken transport from a crashed driver from output
#      that genuinely did not parse -- and `undetermined` stays available for
#      "we could not tell", which is now also what a driver that never exited
#      grades as (there is no exit code to report, and inventing 255 would
#      assert a transport failure nobody observed). Run #4365 (2026-09-01)
#      reported a PARSING error for a `client_loop: send disconnect: Broken
#      pipe`, because this step used to end in `|| true` and threw the exit code
#      away. ⚠️ THAT FIX MADE THE FAILURE REPORT CORRECTLY AND DID NOT MAKE IT
#      STOP — it changed nothing about the run, and the nightly stayed red.
#   4. On a COMPLETE run: write the report under runtime_logs/replay_pregate/,
#      advance latest.json + latest.md, and commit.
#      On a TRUNCATED run: commit the salvaged heads as <TS>.partial.json --
#      never as latest.json, so a partial baseline can never pass for a complete
#      one -- and FAIL the job anyway. Preserving evidence and reporting success
#      are different things.
#   5. On the issue path, post the summary as a comment and close the issue.
#
# Three trigger paths:
#   1. schedule          — nightly 04:00 UTC (the unattended overnight run).
#   2. workflow_dispatch — operator/Claude "Run workflow" with optional ref +
#                          model-ids inputs.
#   3. issues.opened with label `replay-pregate-now` — the Claude-driven path;
#      optional body lines `ref: <branch>` and `models: <id,id,...>`.
#
# Required repo secrets:  VM_SSH_KEY  (authorized on the trainer ubuntu account)
# Required repo vars (or defaults): TRAINER_VM_IP (158.178.209.121),
#                                   TRAINER_VM_USER (ubuntu)
# Required repo label:    replay-pregate-now  (bootstrap-labels.yml)

on:
  schedule:
    # 04:00 UTC nightly — after the daily dataset builds / trainer cycles.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to run the pre-gate from (branch/sha)"
        required: false
        default: "main"
      models:
        description: "Comma-separated model ids (blank = all shadow regime heads)"
        required: false
        default: ""
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: replay-pregate-nightly
  cancel-in-progress: false

jobs:
  pregate:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'replay-pregate-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve run parameters
        id: params
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_MODELS: ${{ inputs.models }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # 2026-07-26 full-system audit (WS-B): default the pre-gate ref to `main`.
          # It previously defaulted to the long-dead feature branch
          # `claude/ml-strategies-deep-review-51n3cw`, so the nightly cron ran the
          # pre-gate off a stale ref (or failed the checkout once the branch was
          # deleted). Overridable per-run via workflow_dispatch `ref:` or an issue
          # body `ref:` line.
          REF="main"
          MODELS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ -n "${DISPATCH_REF:-}" ] && REF="${DISPATCH_REF}"
            MODELS="${DISPATCH_MODELS:-}"
          elif [ "$EVENT" = "issues" ]; then
            body_ref="$(printf '%s' "${ISSUE_BODY:-}" | awk -F': *' '/^ref:/{print $2; exit}')"
            body_models="$(printf '%s' "${ISSUE_BODY:-}" | awk -F': *' '/^models:/{print $2; exit}')"
            [ -n "${body_ref}" ] && REF="${body_ref}"
            MODELS="${body_models}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "models=${MODELS}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref=${REF} models='${MODELS}'"

      - name: Checkout (for commit-back)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.ref }}
          fetch-depth: 0

      - name: Set up SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY}" ]; then
            echo "::error::VM_SSH_KEY secret is unset."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key
          chmod 600 ~/.ssh/trainer_key
          ssh-keyscan -t ed25519,ecdsa,rsa "${TRAINER_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build remote command
        env:
          REF: ${{ steps.params.outputs.ref }}
          MODELS: ${{ steps.params.outputs.models }}
        run: |
          set -euo pipefail
          # MODELS is data, injected via env on the remote side — never inlined
          # into the script, so an issue body can't smuggle shell metacharacters.
          #
          # DETACHED, not interactive. The driver is started with setsid+nohup
          # writing to files on the VM, and this SSH call returns immediately.
          # See the "WHY THE RUN IS DETACHED" note on the launch step below.
          cat > /tmp/pregate_cmd.sh <<'EOS'
          set -e
          cd ~/ict-trading-bot 2>/dev/null || cd /opt/ict-trading-bot || cd "$(find ~ -maxdepth 3 -name ict-trading-bot -type d | head -1)"
          git fetch origin "$PG_REF" >/dev/null 2>&1
          git reset --hard "origin/$PG_REF" >/dev/null 2>&1 || git reset --hard "$PG_REF" >/dev/null 2>&1
          PY=python3
          for c in .venv/bin/python venv/bin/python ../.venv/bin/python ~/.venv/bin/python; do [ -x "$c" ] && PY="$c" && break; done
          ARGS=""
          [ -n "${PG_MODELS:-}" ] && ARGS="--models $PG_MODELS"
          D="/tmp/pregate.$PG_RUNID"
          rm -rf "$D" && mkdir -p "$D"
          # The `.rc` file is the COMPLETION SENTINEL and is written by the same
          # subshell that runs the driver, AFTER it exits. Its presence means the
          # driver reached an exit; its absence means it did not. Nothing else is
          # allowed to create it, so "still running" and "finished" can never be
          # confused by the poller.
          setsid nohup bash -c \
            "$PY scripts/ml/replay_pregate_fleet.py $ARGS --json - > '$D/out' 2> '$D/err'; echo \$? > '$D/rc'" \
            </dev/null >/dev/null 2>&1 &
          echo "launched pid=$! dir=$D"
          EOS
          echo "remote command staged"

      # WHY THE RUN IS DETACHED (2026-09-02, MI-66).
      #
      # MEASURED, and state the population: of the 8 most recent `event=schedule`
      # runs, 7 concluded `failure` and 1 `cancelled`. Two were read in full
      # (#4330 2026-08-31, #4365 2026-09-01) and they are not merely similar —
      # they are IDENTICAL: both died after ~8m55s, both at the SAME head,
      # `(10/22) btc-regime-5m-lgbm-v2`, both with
      # `client_loop: send disconnect: Broken pipe`, both surfacing as
      # `no JSON object in driver output`. Heads 1-9 scored fine in both.
      #
      # ⚠️ SO THIS IS NOT A FLAKY NETWORK, AND THE PREVIOUS FIX AIMED AT THE
      # WRONG HALF. The 2026-09-01 change (keep the ssh exit code, classify by
      # STAGE via pregate_stream.py) made the failure REPORT correctly. It could
      # not make it stop, because it changed nothing about the run. Detection was
      # raised, disposition never happened — the exact pattern due-list.yml's own
      # header names this workflow as the motivating example of.
      #
      # ⚠️ WHAT IS ESTABLISHED AND WHAT IS NOT. Established: the failure is
      # deterministic and reproduces at one specific head. NOT established: WHY
      # the remote end goes away there. The trainer is a 1-OCPU / 6-GB Ampere box
      # and an OOM kill of the process group would look exactly like this, but no
      # kernel evidence has been read, so this file does not assert it — see the
      # evidence-capture step below, which exists to settle it on the next
      # failure rather than leaving a fourth session to guess.
      #
      # WHY DETACHING IS THE RIGHT REPAIR UNDER EITHER CAUSE:
      #   * If the transport is at fault, the run no longer depends on one
      #     long-lived interactive channel surviving ~18 minutes. A drop costs
      #     one short poll, which is retried.
      #   * If the DRIVER is being killed, the run still fails — correctly — but
      #     its stdout, stderr and exit code are already on disk on the VM, so
      #     the failure is ATTRIBUTED to the driver instead of arriving as an
      #     unattributable "no JSON object". An alarm that fires nightly with an
      #     unknowable cause is the desensitized-alarm P1; that is what has been
      #     ringing here since 2026-08-26.
      # Either way the transport stops being a confound, which is the thing that
      # made five consecutive red nights un-actionable.
      - name: Launch the fleet pre-gate on the trainer VM (detached)
        env:
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
          PG_REF: ${{ steps.params.outputs.ref }}
          PG_MODELS: ${{ steps.params.outputs.models }}
        run: |
          set -euo pipefail
          # A LAUNCH failure is fatal and must stay fatal: if the driver never
          # started there is nothing to poll for, and polling anyway would burn
          # the whole budget before reporting a failure that was known in the
          # first ten seconds.
          ssh -i ~/.ssh/trainer_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              "${TRAINER_USER}@${TRAINER_IP}" \
              "PG_REF='${PG_REF}' PG_MODELS='${PG_MODELS}' PG_RUNID='${GITHUB_RUN_ID}' bash -s" \
              < /tmp/pregate_cmd.sh

      - name: Poll for completion, then fetch stdout/stderr/rc
        id: run
        env:
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
        run: |
          set -uo pipefail
          D="/tmp/pregate.${GITHUB_RUN_ID}"
          SSH="ssh -i $HOME/.ssh/trainer_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          # 30 minutes of budget against a fleet that scored 9 heads in ~9
          # minutes, i.e. a full 22-head run of roughly 20. The job timeout is
          # 45, so the poll can never be the thing that kills the job.
          DEADLINE=$(( SECONDS + 30*60 ))
          done_=0
          poll_fail=0
          while [ $SECONDS -lt $DEADLINE ]; do
            sleep 30
            # A FAILED POLL IS NOT A FAILED RUN. This is the whole point of
            # detaching: the driver keeps going while the transport is down, so
            # a poll error is counted and retried, never treated as a verdict.
            #
            # THREE OUTCOMES, KEPT APART — the rc is captured into a variable
            # rather than read from `$?` after an `if`, so the transport case
            # can never be silently read as "not finished yet":
            #   0   -> the sentinel exists; the driver has exited.
            #   1   -> `test -f` said no; still running. Normal, keep waiting.
            #   255 -> ssh itself failed; WE DID NOT LOOK. Counted, then retried.
            prc=0
            $SSH "${TRAINER_USER}@${TRAINER_IP}" "test -f '$D/rc'" >/dev/null 2>&1 || prc=$?
            if [ "$prc" = "0" ]; then
              done_=1; break
            elif [ "$prc" != "1" ]; then
              poll_fail=$(( poll_fail + 1 ))
            fi
          done
          echo "poll_failures=${poll_fail}"
          # Always try to fetch whatever exists — a partial `err` is the evidence
          # pregate_stream.py salvages rows from, and it is worth strictly more
          # than nothing even when the run did not finish.
          : > /tmp/pregate_out.txt; : > /tmp/pregate_err.txt
          $SSH "${TRAINER_USER}@${TRAINER_IP}" "cat '$D/out' 2>/dev/null" > /tmp/pregate_out.txt || true
          $SSH "${TRAINER_USER}@${TRAINER_IP}" "cat '$D/err' 2>/dev/null" > /tmp/pregate_err.txt || true
          if [ "$done_" = "1" ]; then
            # THE DRIVER'S OWN EXIT CODE, not ssh's. This is a real improvement
            # on top of the robustness: the old value conflated "the transport
            # broke" with "the remote command failed", and 255 is legitimately
            # both. Now 0 means the driver exited clean and anything else is the
            # driver's verdict, so `remote_command_failed` finally means it.
            rc="$($SSH "${TRAINER_USER}@${TRAINER_IP}" "cat '$D/rc' 2>/dev/null" | tr -dc '0-9')"
            [ -n "$rc" ] || rc=""
          else
            # DELIBERATELY BLANK -> pregate_stream.py grades `undetermined`.
            # The driver never exited, so there is no exit code to report, and
            # inventing 255 would assert a transport failure nobody observed.
            rc=""
            echo "::warning::pre-gate driver did not finish within the poll budget."
          fi
          echo "${rc}" > /tmp/pregate_rc.txt
          echo "driver_exit_code='${rc}' completed=${done_}"
          echo "completed=${done_}" >> "$GITHUB_OUTPUT"
          echo "=== stderr tail ==="; tail -c 4000 /tmp/pregate_err.txt || true
          # Best-effort cleanup; never fails the run.
          $SSH "${TRAINER_USER}@${TRAINER_IP}" "rm -rf '$D'" >/dev/null 2>&1 || true

      # Exists so the NEXT failure names its own cause instead of a fourth
      # session re-deriving it from run logs. It runs ONLY on the failure path,
      # so a healthy night costs nothing, and it is `continue-on-error` because
      # evidence collection must never itself become the reported failure.
      #
      # ⚠️ It PRINTS, it does not CONCLUDE. An empty OOM grep is "we looked and
      # the kernel log has no kill in range", which is genuinely useful — but it
      # is not proof the driver was not killed, and nothing downstream branches
      # on it.
      - name: Capture kernel/memory evidence when the run did not complete
        if: steps.run.outputs.completed != '1'
        continue-on-error: true
        env:
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
        run: |
          set -uo pipefail
          ssh -i ~/.ssh/trainer_key -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
              "${TRAINER_USER}@${TRAINER_IP}" \
              'echo "--- free -m ---"; free -m;
               echo "--- oom kills (dmesg) ---";
               (sudo dmesg -T 2>/dev/null || dmesg -T 2>/dev/null || true) \
                 | grep -iE "out of memory|killed process|oom-kill" | tail -20;
               echo "--- oom kills (journal, 2h) ---";
               (journalctl --since "-2 hours" 2>/dev/null || true) \
                 | grep -iE "out of memory|killed process|oom-kill" | tail -20;
               echo "--- end evidence ---"' || \
            echo "::warning::could not collect kernel evidence — this is 'we did not look', not 'no OOM occurred'."

      - name: Classify run outcome by failure STAGE
        id: outcome
        run: |
          set -euo pipefail
          # Always exits 0: the JOB's verdict is decided by the explicit fail
          # step below, so the commit step can still preserve salvaged rows.
          python3 scripts/ml/pregate_stream.py \
            --exit-code "$(cat /tmp/pregate_rc.txt)" \
            --stdout /tmp/pregate_out.txt \
            --stderr /tmp/pregate_err.txt \
            --report-out /tmp/pregate.json \
            --partial-out /tmp/pregate_partial.json \
            --outcome-out /tmp/pregate_outcome.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Write report + markdown summary, commit back
        id: commit
        if: steps.outcome.outputs.wrote_report == 'true' || steps.outcome.outputs.wrote_partial == 'true'
        env:
          STATE: ${{ steps.outcome.outputs.state }}
          WROTE_REPORT: ${{ steps.outcome.outputs.wrote_report }}
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          DIR="runtime_logs/replay_pregate"
          mkdir -p "$DIR"
          if [ "${WROTE_REPORT}" = "true" ]; then
            # COMPLETE run: it alone may advance the fleet baseline.
            cp /tmp/pregate.json "$DIR/${TS}.json"
            cp /tmp/pregate.json "$DIR/latest.json"
            SRC="$DIR/latest.json"
            MSG="chore(ml): replay pre-gate fleet report ${TS} [skip ci]"
          else
            # PARTIAL run: preserved as evidence, but deliberately NEVER written
            # to latest.json. A partial baseline that could pass for a complete
            # one is worse than no baseline -- readers of latest.json would
            # silently lose the heads the run never reached.
            cp /tmp/pregate_partial.json "$DIR/${TS}.partial.json"
            SRC="$DIR/${TS}.partial.json"
            MSG="chore(ml): PARTIAL replay pre-gate report ${TS} (${STATE}) [skip ci]"
          fi
          python3 scripts/ml/replay_pregate_summary.py "$SRC" > /tmp/pregate_summary.md || \
            echo "(summary renderer unavailable)" > /tmp/pregate_summary.md
          if [ "${WROTE_REPORT}" = "true" ]; then
            cp /tmp/pregate_summary.md "$DIR/latest.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "${MSG}"
            git push origin "HEAD:${{ steps.params.outputs.ref }}"
          fi

      - name: Fail the job when the run did not complete
        if: steps.outcome.outputs.state != 'ok'
        env:
          LINE: ${{ steps.outcome.outputs.summary_line }}
        run: |
          echo "::error::pre-gate run did not complete -- ${LINE}"
          echo "Stage vocabulary + evidence: scripts/ml/pregate_stream.py"
          exit 1

      - name: Post summary to issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('/tmp/pregate_summary.md', 'utf8').slice(0, 55000);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**replay-pregate-nightly** result\nRun: ${runUrl}\n\n${md}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed', state_reason: 'completed',
            });

      - name: Post failure note to issue
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        env:
          PG_STATE: ${{ steps.outcome.outputs.state }}
          PG_LINE: ${{ steps.outcome.outputs.summary_line }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **replay-pregate-nightly failed.**\nRun: ${runUrl}\n\nFailure stage: \`${process.env.PG_STATE || 'unknown'}\`\n${process.env.PG_LINE || ''}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed', state_reason: 'not_planned',
            });
