name: replay-pregate-nightly

# Durable, session-INDEPENDENT runner for the ML replay pre-gate (RG3).
#
# Baselines the shadow-stage regime fleet through the point-in-time replay
# pre-gate (scripts/ml/replay_pregate_fleet.py) on the trainer VM and commits
# the report back to the repo, so the result survives a dead Claude session.
# This is the overnight "run through the trainings" substrate: it runs on a
# nightly schedule, on manual dispatch, and on a labelled issue — no session,
# no keep-alive cron required.
#
# What it does (all read-only research, Tier-1):
#   1. SSH the trainer VM, fast-forward the working tree to the requested ref.
#   2. Run scripts/ml/replay_pregate_fleet.py over every shadow-stage regime
#      head, scoring each through the LIVE predict path vs the dataset's own
#      regime_label (true market_features parity — no threshold guessing).
#   3. Classify the run by the STAGE that failed (scripts/ml/pregate_stream.py),
#      NEVER by guessing: the ssh exit code plus a line-anchored OpenSSH client
#      signature separate a broken transport from a crashed driver from output
#      that genuinely did not parse -- and `undetermined` stays available for
#      "we could not tell". Run #4365 (2026-09-01) reported a PARSING error for
#      a `client_loop: send disconnect: Broken pipe`, because this step used to
#      end in `|| true` and threw the exit code away.
#   4. On a COMPLETE run: write the report under runtime_logs/replay_pregate/,
#      advance latest.json + latest.md, and commit.
#      On a TRUNCATED run: commit the salvaged heads as <TS>.partial.json --
#      never as latest.json, so a partial baseline can never pass for a complete
#      one -- and FAIL the job anyway. Preserving evidence and reporting success
#      are different things.
#   5. On the issue path, post the summary as a comment and close the issue.
#
# Three trigger paths:
#   1. schedule          — nightly 04:00 UTC (the unattended overnight run).
#   2. workflow_dispatch — operator/Claude "Run workflow" with optional ref +
#                          model-ids inputs.
#   3. issues.opened with label `replay-pregate-now` — the Claude-driven path;
#      optional body lines `ref: <branch>` and `models: <id,id,...>`.
#
# Required repo secrets:  VM_SSH_KEY  (authorized on the trainer ubuntu account)
# Required repo vars (or defaults): TRAINER_VM_IP (158.178.209.121),
#                                   TRAINER_VM_USER (ubuntu)
# Required repo label:    replay-pregate-now  (bootstrap-labels.yml)

on:
  schedule:
    # 04:00 UTC nightly — after the daily dataset builds / trainer cycles.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to run the pre-gate from (branch/sha)"
        required: false
        default: "main"
      models:
        description: "Comma-separated model ids (blank = all shadow regime heads)"
        required: false
        default: ""
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: replay-pregate-nightly
  cancel-in-progress: false

jobs:
  pregate:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'replay-pregate-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve run parameters
        id: params
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_MODELS: ${{ inputs.models }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          # 2026-07-26 full-system audit (WS-B): default the pre-gate ref to `main`.
          # It previously defaulted to the long-dead feature branch
          # `claude/ml-strategies-deep-review-51n3cw`, so the nightly cron ran the
          # pre-gate off a stale ref (or failed the checkout once the branch was
          # deleted). Overridable per-run via workflow_dispatch `ref:` or an issue
          # body `ref:` line.
          REF="main"
          MODELS=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ -n "${DISPATCH_REF:-}" ] && REF="${DISPATCH_REF}"
            MODELS="${DISPATCH_MODELS:-}"
          elif [ "$EVENT" = "issues" ]; then
            body_ref="$(printf '%s' "${ISSUE_BODY:-}" | awk -F': *' '/^ref:/{print $2; exit}')"
            body_models="$(printf '%s' "${ISSUE_BODY:-}" | awk -F': *' '/^models:/{print $2; exit}')"
            [ -n "${body_ref}" ] && REF="${body_ref}"
            MODELS="${body_models}"
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "models=${MODELS}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref=${REF} models='${MODELS}'"

      - name: Checkout (for commit-back)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.ref }}
          fetch-depth: 0

      - name: Set up SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
        run: |
          set -euo pipefail
          if [ -z "${VM_SSH_KEY}" ]; then
            echo "::error::VM_SSH_KEY secret is unset."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key
          chmod 600 ~/.ssh/trainer_key
          ssh-keyscan -t ed25519,ecdsa,rsa "${TRAINER_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build remote command
        env:
          REF: ${{ steps.params.outputs.ref }}
          MODELS: ${{ steps.params.outputs.models }}
        run: |
          set -euo pipefail
          # MODELS is data, injected via env on the remote side — never inlined
          # into the script, so an issue body can't smuggle shell metacharacters.
          cat > /tmp/pregate_cmd.sh <<'EOS'
          set -e
          cd ~/ict-trading-bot 2>/dev/null || cd /opt/ict-trading-bot || cd "$(find ~ -maxdepth 3 -name ict-trading-bot -type d | head -1)"
          git fetch origin "$PG_REF" >/dev/null 2>&1
          git reset --hard "origin/$PG_REF" >/dev/null 2>&1 || git reset --hard "$PG_REF" >/dev/null 2>&1
          PY=python3
          for c in .venv/bin/python venv/bin/python ../.venv/bin/python ~/.venv/bin/python; do [ -x "$c" ] && PY="$c" && break; done
          ARGS=""
          [ -n "${PG_MODELS:-}" ] && ARGS="--models $PG_MODELS"
          $PY scripts/ml/replay_pregate_fleet.py $ARGS --json -
          EOS
          echo "remote command staged"

      - name: Run fleet pre-gate on trainer VM
        id: run
        env:
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
          PG_REF: ${{ steps.params.outputs.ref }}
          PG_MODELS: ${{ steps.params.outputs.models }}
        run: |
          set -euo pipefail
          # KEEP THE EXIT CODE. This step used to end in `|| true`, discarding
          # the one piece of evidence that separates a broken transport from a
          # crashed driver from malformed output -- so the next step could only
          # ever report "no JSON object in driver output", a PARSING label for
          # whatever had actually happened. Run #4365 (2026-09-01) was a
          # `client_loop: send disconnect: Broken pipe` reported as a parse
          # failure. `rc` is now carried to the classifier as evidence.
          rc=0
          ssh -i ~/.ssh/trainer_key \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -o SendEnv=PG_REF -o SendEnv=PG_MODELS \
              "${TRAINER_USER}@${TRAINER_IP}" \
              "PG_REF='${PG_REF}' PG_MODELS='${PG_MODELS}' bash -s" \
              < /tmp/pregate_cmd.sh \
              > /tmp/pregate_out.txt 2>/tmp/pregate_err.txt || rc=$?
          echo "ssh_exit_code=${rc}"
          echo "=== stderr tail ==="; tail -c 4000 /tmp/pregate_err.txt || true
          echo "${rc}" > /tmp/pregate_rc.txt

      - name: Classify run outcome by failure STAGE
        id: outcome
        run: |
          set -euo pipefail
          # Always exits 0: the JOB's verdict is decided by the explicit fail
          # step below, so the commit step can still preserve salvaged rows.
          python3 scripts/ml/pregate_stream.py \
            --exit-code "$(cat /tmp/pregate_rc.txt)" \
            --stdout /tmp/pregate_out.txt \
            --stderr /tmp/pregate_err.txt \
            --report-out /tmp/pregate.json \
            --partial-out /tmp/pregate_partial.json \
            --outcome-out /tmp/pregate_outcome.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Write report + markdown summary, commit back
        id: commit
        if: steps.outcome.outputs.wrote_report == 'true' || steps.outcome.outputs.wrote_partial == 'true'
        env:
          STATE: ${{ steps.outcome.outputs.state }}
          WROTE_REPORT: ${{ steps.outcome.outputs.wrote_report }}
        run: |
          set -euo pipefail
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          DIR="runtime_logs/replay_pregate"
          mkdir -p "$DIR"
          if [ "${WROTE_REPORT}" = "true" ]; then
            # COMPLETE run: it alone may advance the fleet baseline.
            cp /tmp/pregate.json "$DIR/${TS}.json"
            cp /tmp/pregate.json "$DIR/latest.json"
            SRC="$DIR/latest.json"
            MSG="chore(ml): replay pre-gate fleet report ${TS} [skip ci]"
          else
            # PARTIAL run: preserved as evidence, but deliberately NEVER written
            # to latest.json. A partial baseline that could pass for a complete
            # one is worse than no baseline -- readers of latest.json would
            # silently lose the heads the run never reached.
            cp /tmp/pregate_partial.json "$DIR/${TS}.partial.json"
            SRC="$DIR/${TS}.partial.json"
            MSG="chore(ml): PARTIAL replay pre-gate report ${TS} (${STATE}) [skip ci]"
          fi
          python3 scripts/ml/replay_pregate_summary.py "$SRC" > /tmp/pregate_summary.md || \
            echo "(summary renderer unavailable)" > /tmp/pregate_summary.md
          if [ "${WROTE_REPORT}" = "true" ]; then
            cp /tmp/pregate_summary.md "$DIR/latest.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "${MSG}"
            git push origin "HEAD:${{ steps.params.outputs.ref }}"
          fi

      - name: Fail the job when the run did not complete
        if: steps.outcome.outputs.state != 'ok'
        env:
          LINE: ${{ steps.outcome.outputs.summary_line }}
        run: |
          echo "::error::pre-gate run did not complete -- ${LINE}"
          echo "Stage vocabulary + evidence: scripts/ml/pregate_stream.py"
          exit 1

      - name: Post summary to issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('/tmp/pregate_summary.md', 'utf8').slice(0, 55000);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**replay-pregate-nightly** result\nRun: ${runUrl}\n\n${md}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed', state_reason: 'completed',
            });

      - name: Post failure note to issue
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        env:
          PG_STATE: ${{ steps.outcome.outputs.state }}
          PG_LINE: ${{ steps.outcome.outputs.summary_line }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **replay-pregate-nightly failed.**\nRun: ${runUrl}\n\nFailure stage: \`${process.env.PG_STATE || 'unknown'}\`\n${process.env.PG_LINE || ''}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed', state_reason: 'not_planned',
            });
