name: research-queue-replenish

# THE QUEUE REFILLS ITSELF (operator, 2026-09-28, relayed by the manager):
# "The research queue should be running 24/7 with or without Claude, we need
# to make sure the queue has enough tests to run and keep replenishing it."
#
# Runs scripts/research/queue_replenish.py, which expands the PRE-REGISTERED
# families under research/templates/ into concrete units until >= 25 runnable
# units are queued (dedupe by generated.key; families drawn by the operator's
# 30/25/20/15/10 weights), and lands the new files through commit-to-main.
# The landing PR self-lands ONLY because check_pr_landing.py re-runs
# `queue_replenish.py --verify` at the merge-base and demands the same bytes
# (a hand-edited or non-template unit holds for a human, as before).
#
# Daily at 05:50 UTC -- half an hour before the dispatcher's 06:20 slot, so
# the first dispatch of the day sees a full queue. schedule-keeper covers a
# dropped slot; the `dedupe` job skips GitHub's late duplicate.
#
# Tier-1: reads config + committed evidence, writes research/queue/RQ-*.yaml
# only. No live path, no order path, no VM.

on:
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Runnable units to keep queued"
        default: "25"

concurrency:
  group: research-queue-replenish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dedupe:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.d.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops/schedule_keeper.py
          sparse-checkout-cone-mode: false
      - id: d
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ops/schedule_keeper.py dedupe
          --run-id "${{ github.run_id }}" --schedule "${{ github.event.schedule }}"

  replenish:
    needs: dedupe
    if: |
      !cancelled() && needs.dedupe.outputs.skip != 'true' && (
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    # one commit-to-main wait (30) + slack, per tests/test_commit_to_main_callers.py
    timeout-minutes: 65
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: Generate the missing units
        id: gen
        env:
          # An input reaches the shell through env, never by interpolation
          # into `run:` (review fix 2026-09-29).
          TARGET: ${{ inputs.target || '25' }}
        run: |
          set -euo pipefail
          python3 scripts/research/queue_replenish.py --self-test
          python3 scripts/research/queue_replenish.py --write --target "${TARGET}" | tee /tmp/replenish.txt
          python3 scripts/research/dispatch_queue.py | tail -3
          echo "count=$(git status --porcelain research/queue | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Land the new units on main
        if: steps.gen.outputs.count != '0'
        uses: ./.github/actions/commit-to-main
        with:
          verify-merged: "true"
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: research/queue
          message: "research-queue: replenish from templates (run ${{ github.run_id }})"
          pr-title: "research-queue: replenish from templates (auto)"
          pr-body: >-
            Units generated by scripts/research/queue_replenish.py from
            research/templates/*.yaml (pre-registered families; rules registered
            before any run). Self-lands only while `queue_replenish.py --verify`
            reproduces every added unit byte-for-byte at the merge-base
            (check_pr_landing.py E58).
          branch-prefix: automation/research-queue-replenish
      - name: Summarize
        if: always()
        run: |
          { echo "### research-queue replenish"; echo; echo '```'; cat /tmp/replenish.txt 2>/dev/null || echo "(no output)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
