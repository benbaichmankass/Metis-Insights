name: e35-bracket-sweep

# Shard the E3.5 bracket-geometry sweep ONE LEG PER JOB on free GitHub runners.
#
# WHY THIS EXISTS. Run as a single serial pass the sweep is a multi-hour job, and
# on 2026-08-20 an interactive session had it killed THREE times mid-run by its
# ephemeral sandbox being recycled. Measured at the time: 30 GB disk free, 799 MB
# of 16 GB memory in use, no OOM lines in dmesg, and a dmesg head showing
# `crng reseeded due to virtual machine fork` — i.e. a container re-provision,
# NOT resource exhaustion. Nothing was lost (per-leg reports persist and the
# resume skips completed legs) but each recycle cost wall-clock.
#
# The fix is not a bigger box, and it is NOT the GPU burst: this is CPU-bound
# single-threaded backtesting (~1.1 s per harness run), so a GPU buys nothing and
# `gpu-burst-train.yml` would spend against the $10/month cap in
# comms/gpu_spend_ledger.json for no gain. The fix is to run it where a recycle
# cannot reach it, sharded so a failure costs ONE leg.
#
# Same shape as `m20-exit-lever-sweep.yml`, with ONE deliberate difference: that
# workflow scp's its frames from the trainer VM. This one fetches from
# data.binance.vision instead — proven this session to reproduce the trainer
# substrate exactly — which removes an SSH dependency AND the trainer contention
# `docs/claude/vm-resource-management.md` warns about. Free lane, no VM touched.
#
# Tier-1 throughout: research tooling only. Writes no config, runs no order path.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "CSV of leg names. Empty = every runnable leg."
        required: false
        default: ""
      days:
        description: "Trailing days of candles to fetch per leg."
        required: false
        default: "1830"
      gate_top:
        description: "Surface cells per axis sent to the IS/OOS + walk-forward gate."
        required: false
        default: "2"
      singles_only:
        description: "true = one-axis-at-a-time grid only (fast smoke)."
        required: false
        default: "false"
      max_parallel:
        description: "Concurrent legs. Keep modest to stay a good citizen."
        required: false
        default: "6"

      research_unit:
        description: >-
          Queue unit id that dispatched this run (RQ-...). Stamped onto every
          corpus row so a later reader can tell WHICH unit produced it.
          Empty for a manual run — which means NOT QUEUE-DISPATCHED, never
          "this was a test".
        required: false
        default: ""
      split_target_oos:
        description: "How many OOS trades the derived IS/OOS boundary AIMS AT. Empty = the script default (50). ⚠️ THE TARGET IS NOT THE ACHIEVED COUNT: the harness windows CANDLES, so boundary loss lands the achieved n BELOW the target. Measured on the 9 capable legs of the 2026-08-31 run, target 50 achieved 46-50 (shortfall 0-4), so 50 leaves 8 of 9 legs UNDER the 49.06 power floor. Set ABOVE the floor by more than the observed shortfall — do not set it AT the floor, which is BL-20260814-SPLIT-TARGETS-EXACTLY-THE-FLOOR-SO-BOUNDARY-LOSS-ALWAYS-FAILS."
        required: false
        default: ''
      power_state:
        description: >-
          That unit's R4 power verdict. `accruing` means the unit declared up
          front it cannot answer yet, so its rows must never be read as a test
          result. Stamped beside research_unit for exactly that reason.
        required: false
        default: ""
permissions:
  contents: read

concurrency:
  group: e35-bracket-sweep
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        # NO dukascopy-python here, deliberately. The planner only needs the
        # adjudicated symbol MAP (scripts/ops/dukascopy_instruments.py imports
        # nothing but `typing`), never the venue client — installing a package
        # this job cannot use would imply the plan step talks to Dukascopy.
        run: pip install --quiet pandas numpy requests pyyaml

      # The planner resolves legs through the sweep's OWN plan_legs, so this job
      # cannot disagree with the sweep about which legs exist.
      #
      # ⚠️ It EXITS NON-ZERO on an empty matrix, deliberately. GitHub reports a
      # matrix that expands to zero jobs as SUCCESS, so without this the whole
      # workflow would go green having tested nothing — indistinguishable from
      # "all 19 legs passed". `set -e` propagates that refusal.
      - name: Plan the shards
        id: plan
        run: |
          set -euo pipefail
          # --ignore-missing-data is REQUIRED here and is not a convenience:
          # leg CSVs are gitignored (.gitignore `data/*.csv`) and each per-leg
          # job fetches its OWN candles, so on this fresh checkout every leg
          # resolves data=None. Without the flag the planner correctly refuses
          # with `0 job(s); 55 not scheduled (data_missing=43,
          # out_of_scope_family=12)` and exits 1 -- which is why this workflow
          # had NEVER run (BL-20260824-E35-SHARD-PLANNER-CANNOT-PLAN-ON-A-FRESH-CHECKOUT).
          # The flag drops ONLY the data-presence gate; the family filter and
          # every other scope rule still apply (measured: 43 scheduled, 12 still
          # refused as out_of_scope_family).
          python scripts/research/e35_shard_plan.py \
            ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }} \
            --ignore-missing-data \
            --out matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json;print(len(json.load(open("matrix.json"))["include"]))')" >> "$GITHUB_OUTPUT"
      - name: Show the plan
        run: |
          echo "### e35 bracket sweep — ${{ steps.plan.outputs.count }} shard(s)" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import json
          m = json.load(open('matrix.json'))['include']
          print('| leg | symbol | tf | family |'); print('|---|---|---|---|')
          for r in m: print(f\"| \`{r['leg']}\` | {r['symbol']} | {r['tf']} | {r['family']} |\")
          " >> "$GITHUB_STEP_SUMMARY"

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330          # < the 6h GH ceiling
    strategy:
      # ONE LEG FAILING MUST NOT CANCEL THE OTHERS — the whole point of sharding
      # is that a lost leg costs a leg. fail-fast would give back exactly the
      # property this workflow exists to buy.
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '6') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        # Each venue client is needed by only SOME legs, but a single
        # unconditional install keeps one step and costs a few seconds.
        #
        # ⚠️ `yfinance` IS LOAD-BEARING — DO NOT DROP IT AS "unused".
        # `PROXY_DATA` legs (MES/MGC/MHG/XAUUSD) route to the yfinance lane, and
        # this step previously installed `dukascopy-python` alone. Measured on
        # run 32972018506, the first dispatch after that routing landed:
        #   BACKTEST_FEED_SOURCE: yfinance
        #   Fetching MES D candles 2021-08-22 -> 2026-08-26 (source=yfinance) …
        #   dependency missing (nothing was fetched): the yfinance package is
        #   not installed (No module named 'yfinance')
        # i.e. a route to a feed the job could not run. Caught by dispatching
        # ONE leg before the full matrix, which is the cheap habit here: the
        # same mistake across 22 shards is 22 wasted runners.
        #
        # Note the fetcher said "dependency missing (NOTHING WAS FETCHED)"
        # rather than "fetch failed" — the three-stage YfDependencyMissing /
        # YfRefused / YfFetchFailed split doing its job. A single "fetch
        # failed" label would have sent the reader to Yahoo, the ticker and the
        # span before the dependency.
        run: pip install --quiet pandas numpy requests pyyaml dukascopy-python yfinance

      # THE SOURCE IS PER-LEG, RESOLVED BY THE PLANNER
      # (BL-20260824-E35-SWEEP-FEED-IS-BINANCE-ONLY-FOR-A-MOSTLY-NON-CRYPTO-MATRIX).
      # It used to be `binance_vision` for the WHOLE matrix. GitHub runners are
      # US Azure IPs and Bybit geoblocks the US
      # (BL-20260727-BYBIT-USGEOBLOCK-GHRUNNER), so pinning away from `auto` was
      # right — but Binance lists no
      # ETFs, so on the first-ever run (32783849276) GLD and GDX each spent TEN
      # MINUTES in a retry loop before failing, 24 of 43 legs, ~4 runner-hours
      # per dispatch on work that could not succeed.
      #
      # `matrix.feed_source` now carries the planner's decision: crypto ->
      # binance_vision, adjudicated non-crypto -> dukascopy (MEASURED to carry
      # every mapped instrument past this workflow's own 1830 d request, run
      # 32788423940). A leg no feed can serve is REFUSED AT PLAN TIME by name
      # and never reaches a runner — it is not re-routed, because a leg quietly
      # served by a feed carrying a DIFFERENT instrument is a wrong backtest
      # that looks fine.
      #
      # The interval code likewise comes from the planner, which REFUSES an
      # unmapped timeframe rather than defaulting: a wrong interval does not
      # error, it silently measures a different population.
      - name: Fetch this leg's candles (free lane — no VM, no trainer)
        env:
          BACKTEST_FEED_SOURCE: ${{ matrix.feed_source }}
        run: |
          set -euo pipefail
          mkdir -p data
          # ⚠️ THE STEM COMES FROM THE PLANNER, NEVER FROM `symbol` + `tf` HERE.
          # It used to be built inline as `{symbol}_{tf}`, which is a SECOND
          # opinion about where a leg's candles live — and it disagreed with
          # the sweep's. `m20_fleet_exit_sweep.resolve_data` applies
          # `PROXY_DATA` (MES->ES_F, MGC/XAUUSD->GC_F, MHG->HG_F) with no
          # native fallback, so it looked for `ES_F_1d.csv` and never for the
          # `MES_1d.csv` this step had just written. The leg then read
          # `data_missing`, the sweep exited 0 with an empty `legs` list, and
          # the job went GREEN having measured nothing.
          # `e35_shard_plan.data_basename` derives it from that same map.
          OUT="data/${{ matrix.data_basename }}.csv"
          python scripts/ops/fetch_backtest_candles.py \
            --symbol "${{ matrix.symbol }}" \
            --interval "${{ matrix.fetch_interval }}" \
            --days "${{ inputs.days || '1830' }}" \
            --output "${OUT}"
          n=$(( $(wc -l < "${OUT}") - 1 ))
          echo "rows=${n}"
          # A silent-empty here would make the leg read data_missing and the
          # sweep would report "no cells evaluated" as though that were a verdict.
          if [ "${n}" -lt 100 ]; then
            echo "::error::only ${n} rows fetched for ${{ matrix.symbol }} ${{ matrix.tf }} — the sweep would be a false negative"
            exit 1
          fi

      - name: Sweep this leg
        run: |
          set -euo pipefail
          python scripts/research/e35_bracket_geometry_sweep.py \
            --only "${{ matrix.leg }}" \
            --gate-top "${{ inputs.gate_top || '2' }}" \
            ${{ inputs.singles_only == 'true' && '--singles-only' || '' }} \
            ${{ inputs.split_target_oos && format('--split-target-oos "{0}"', inputs.split_target_oos) || '' }} \
            --out "out/${{ matrix.leg }}"

      # A leg's result must outlive this runner, and the artifact is what makes
      # the shard model safe: a recycled/failed job loses its own leg and nothing
      # else, because every other leg already uploaded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e35-bracket-${{ matrix.leg }}
          path: out/${{ matrix.leg }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [plan, sweep]
    # `always()`: a partially-failed matrix still produced real rows for the legs
    # that DID finish, and throwing them away because one leg died is the
    # opposite of what sharding is for. The summary states the denominator.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: e35-bracket-*
          merge-multiple: false
      - name: Roll up
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          planned = int("${{ needs.plan.outputs.count }}" or 0)
          reports = sorted(pathlib.Path("collected").rglob("report.json"))

          # ⚠️ COUNT LEGS MEASURED, NOT REPORTS RETURNED. This used to read
          # `len(reports) of {planned} leg(s) returned a report`, and a report
          # can be REAL AND EMPTY: a leg whose data did not resolve makes the
          # sweep exit 0 with `legs: []`, which still uploads a `report.json`.
          # So the file count could equal `planned` while legs measured nothing,
          # the shortfall warning never fired, and the table below — which
          # iterates `legs` — simply printed no row for them. Four legs vanished
          # from a summary that read as complete coverage
          # (BL-20260826-E35-RUNNER-WRITES-A-FILENAME-THE-SWEEP-NEVER-READS).
          # `measured` and `skipped_in_report` are counted separately because
          # "the runner died" and "the runner ran and the leg had no data" are
          # different failures with different fixes.
          measured, skipped_in_report = [], []
          for path in reports:
              d = json.loads(path.read_text())
              measured.extend(d.get("legs", []))
              skipped_in_report.extend(d.get("skipped", []))

          print(f"### e35 bracket sweep — {len(measured)} of {planned} leg(s) MEASURED\n")
          if len(measured) < planned:
              print(f"> ⚠️ **{planned - len(measured)} leg(s) produced no measurement** — "
                    f"read every number below as covering {len(measured)}/{planned} legs. "
                    f"({len(reports)} report file(s) returned; "
                    f"{len(skipped_in_report)} leg(s) were skipped INSIDE a report.)\n")
          # Name them. A count says how many are missing; only the reasons say
          # whether it was a dead runner or a leg the sweep refused.
          for sk in skipped_in_report:
              print(f"> - `{sk.get('leg')}` skipped: `{sk.get('reason')}`")
          if skipped_in_report:
              print()

          print("| leg | base net_R | grid min | grid max | **spread** | best cell |")
          print("|---|---|---|---|---|---|")
          for leg in measured:
              surf = leg.get("surface")
              if not surf:
                  print(f"| `{leg.get('leg')}` | ERROR | | | | |"); continue
              print(f"| `{leg['leg']}` | {surf['base_net_r']} | {surf['net_r_min']} | "
                    f"{surf['net_r_max']} | **{surf['net_r_spread']}** | `{surf['best_cell']}` |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e35-bracket-ALL
          path: collected
          retention-days: 90

  # ------------------------------------------------------------------ corpus
  # WHY THIS JOB EXISTS. Until 2026-08-23 this workflow ended at the artifact
  # above, and a PM-side session has NO artifact download (root CLAUDE.md). So
  # 3,781 measured cells were write-only: re-interrogating ANY of them — a
  # dispersion test, a different gate, wins_effective beside wins — meant
  # re-running the whole multi-hour sweep from candles. A session did exactly
  # that on 2026-08-23, which is what surfaced it.
  # BL-20260823-E35-SWEEP-EVIDENCE-HAS-NO-DURABLE-PATH
  #
  # This is the same cure m20_corpus_extract.py already gives the LEVER sweep,
  # and this job deliberately mirrors that workflow's corpus job rather than
  # inventing a second shape.
  corpus:
    needs: [plan, sweep, aggregate]
    # `always()` for the same reason `aggregate` uses it: the legs that DID
    # finish produced real rows, and discarding them because one leg died is
    # the opposite of what sharding buys.
    if: always()
    runs-on: ubuntu-latest
    # ⚠️ MUST OUTLAST `commit-to-main`'s `verify-merged` wait (30m default).
    # A job budget shorter than the wait cancels the step mid-wait and reports
    # a timeout for a PR that was merging correctly — the run then looks broken
    # on a healthy landing. Was 20 while the wait was absent.
    timeout-minutes: 45
    permissions:
      # The ONLY job here that writes. Kept off the workflow's top-level
      # `contents: read` so the sweep shards stay read-only.
      contents: write
      pull-requests: write   # commit-to-main opens the landing PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: e35-bracket-*
          merge-multiple: false

      - name: Extract per-cell rows into the committed corpus
        id: extract
        env:
          # ⚠️ THIS IS WHAT MAKES `accruing` MEAN ANYTHING DOWNSTREAM. The
          # extractor stamps both onto every row; without them a row from a
          # job that declared it cannot answer yet is byte-indistinguishable
          # from a real test's row, and research_disposition grades it as an
          # ordinary unit. Empty is NOT-QUEUE-DISPATCHED, never "was a test".
          RESEARCH_UNIT: ${{ inputs.research_unit }}
          RESEARCH_POWER_STATE: ${{ inputs.power_state }}
        run: |
          set -euo pipefail
          # The extractor REFUSES an empty scan rather than exiting 0, so a run
          # that produced no report cannot land here as a silent success.
          python3 scripts/research/e35_corpus_extract.py collected | tee extract.out

      # ------------------------------------------------------------ landing
      # ⚠️ THIS PUSHED A SIDE BRANCH AND OWED THE MERGE TO A HUMAN UNTIL
      # 2026-08-31. It landed rows nobody read.
      #
      # The old step committed to `claude/e35-bracket-corpus-${GITHUB_RUN_ID}`
      # and printed a loud, honest hand-off saying a human or a session had to
      # open the PR — accurate, and still a broken pipeline: this workflow is
      # driven by the research queue on a monthly cadence, so "a human finishes
      # it" means the rows accumulate on unmerged branches and no later session
      # can read them. Measured on run 33361845836: all 14 legs green, the
      # aggregate green, the extract green, the push green, 2,786 rows written,
      # and `assert the corpus rows landed` correctly failed `pending_merge`
      # with 0 rows on main. The hand-off note was true and nothing acted on it.
      #
      # THE TWO REFUSALS THAT SHAPED THE OLD STEP ARE REAL AND ARE NOT REGRESSED
      # by this change — do not "simplify" back to a direct push:
      #   * a dispatch on the default branch CANNOT push there (branch
      #     protection declines a bare commit it cannot give required checks to,
      #     GH006 — BL-20260812-SWEEP-CORPUS-CANNOT-PUSH-TO-MAIN); and
      #   * a FIXED side-branch name diverges and makes the push a
      #     non-fast-forward that no retry can clear (measured 2026-08-29 at
      #     3,625 branch-only commits, discarding a 43-minute 41-leg sweep).
      # Both are structural refusals, so the fix is to retarget, never to retry.
      #
      # `commit-to-main` satisfies both by construction — it commits to a
      # per-run throwaway branch (empty until this push creates it, so it cannot
      # diverge) and opens an auto-merge PR with a PAT. The PAT is the whole
      # point: a GITHUB_TOKEN push starts no workflows, which is precisely why
      # the old step could not open or green its own PR
      # (BL-20260813-CORPUS-RETARGET-CANNOT-OPEN-ITS-OWN-PR). This is the same
      # mechanism `gld-compat-matrix` already lands through.
      - name: Land the corpus on main
        id: land
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: docs/research/e35-bracket-corpus.jsonl
          message: "corpus: e35 bracket sweep run ${{ github.run_id }}"
          pr-title: "corpus: e35 bracket sweep (run ${{ github.run_id }})"
          pr-body: |
            Automated landing of `docs/research/e35-bracket-corpus.jsonl`.
            R2 — the run is not done when it exits 0, it is done when its rows
            are readable on `main`.
          branch-prefix: automation/e35-bracket-corpus
          # ⚠️ NOT decoration, and NOT copied from the caller: the action owns
          # the bounded wait. Without it this step exits 0 the moment the PR
          # OPENS, and the assertion below then always reads `pending_merge` on
          # a perfectly healthy run — the check would be permanently red and
          # would be switched off, which is the desensitized-alarm failure.
          verify-merged: "true"

      # ------------------------------------------------------------- landing
      # WHY THIS STEP EXISTS. Until 2026-08-27 this job ended above, and "the
      # push succeeded" was treated as "the rows arrived". Those are different
      # claims, and only one of them is what a later session depends on.
      #
      #   A job that exits 0 having landed nothing is a FAILED job.
      #
      # ⚠️ THE MOTIVATING EXAMPLE ORIGINALLY GIVEN HERE WAS FALSE, AND THE
      # RETRACTION IS KEPT BECAUSE IT IS THE BETTER LESSON. This comment used to
      # read that the corpus job shipped 08-23, the sweep ran 08-26, and
      # m20-sweep-corpus.jsonl was "still 1,379 rows with ZERO cells naming a
      # stop". Every one of those numbers is real and the CONCLUSION was wrong:
      # this sweep does not write that file. It writes
      # docs/research/e35-bracket-corpus.jsonl, which on origin/main holds 8,211
      # rows / 6,581 stop cells / 41 legs, 4,378 of them from the 08-26 run. The
      # rows landed on the day they were measured.
      #
      # The author probed the LEVER corpus for BRACKET cells because a backlog
      # row's resolution_criteria SUGGESTED that filename, and read a suggested
      # criterion as a description of the implementation. A positive control was
      # run (`--contains trail` -> 212 rows) — but in that same wrong file, so it
      # controlled for the PROBE and not for the POPULATION.
      #
      # THAT IS EXACTLY THE FAILURE THIS STEP CATCHES, which is why it is worth
      # having anyway: the assertion below names the store THIS WORKFLOW WRITES,
      # taken from the `git add` above rather than from prose. The first version
      # of this step pointed at m20-sweep-corpus.jsonl and would have graded a
      # perfectly healthy sweep `absent`, forever.
      #
      # `--pushed-ref` is what makes the verdict fair rather than merely strict.
      # The landing step commits to a per-run branch and opens an auto-merge PR,
      # so between the commit and the merge the rows are genuinely written and
      # genuinely unreadable. That is `pending_merge` — its own state, non-zero,
      # and deliberately NOT reported as `absent`, which would blame the job for
      # work it actually did.
      #
      # ⚠️ THIS PARAGRAPH DESCRIBED A RETARGETED SIDE-BRANCH PUSH UNTIL
      # 2026-08-31 and is kept corrected rather than deleted: with
      # `verify-merged` the rows are normally on main BY THE TIME this runs, so
      # a `pending_merge` here is no longer the expected steady state — it now
      # means the wait timed out, and the PR's own checks are the thing to read.
      - name: assert the corpus rows landed
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LAND_COMMITTED: ${{ steps.land.outputs.committed }}
          LAND_BRANCH: ${{ steps.land.outputs.branch }}
          LAND_PR: ${{ steps.land.outputs.pr }}
        run: |
          set -uo pipefail
          # ⚠️ RUN-SCOPED, AND THAT IS THE WHOLE POINT.
          #
          # This asserted `--field cell --contains sm --min-rows 1` until
          # 2026-08-30. `e35-bracket-corpus.jsonl` is CUMULATIVE, so that
          # predicate was satisfied by HISTORY and the check could never fail —
          # `assert_rows_landed`'s `pending_merge` branch was unreachable.
          # Measured on run 33306805155: it reported
          #   `landed — 6624 rows with cell containing 'sm' (need >= 1) of 8289`
          # while EVERY ONE of that run's rows sat on an unmerged side branch.
          # All 6,624 predate the run. One-way failure: it could only ever
          # over-report `landed`, which is the direction that matters, because
          # R2 is credited as wired on this workflow and its green read as
          # evidence the rows had arrived.
          #
          # `sweep_generated_at` is the ONLY run-distinguishing field these rows
          # carry — `run_id` is absent from all 8,294 of them (it exists only in
          # the m20 corpus, where it holds a timestamp, not a GitHub run id).
          if [ ! -f extract.out ]; then
            echo "::error::extract.out is missing — the extract step did not run, so there is nothing to assert. NOT falling back to a cumulative predicate."
            exit 1
          fi
          STAMP="$(sed -n 's/^run-stamp: //p' extract.out | tail -1)"
          if [ -z "${STAMP}" ]; then
            echo "::error::no run-stamp in extract.out — the assertion cannot be scoped to THIS run. Falling back to the cumulative predicate is the defect this replaced, so this fails instead."
            exit 1
          fi
          # ⚠️ `committed` AND `branch`, NOT just one. `committed=false` is the
          # legitimate no-op (the corpus was byte-identical, so there was
          # nothing to land); an EMPTY branch alongside `committed=true` is a
          # broken landing. Collapsing them would let a failed push read as a
          # quiet success, which is the one direction that matters here.
          if [ "${LAND_COMMITTED:-}" != "true" ] || [ -z "${LAND_BRANCH:-}" ]; then
            echo "::error::the landing step did not commit (committed='${LAND_COMMITTED:-}' branch='${LAND_BRANCH:-}'), so 'pending_merge' cannot be told from 'absent'. The extractor emitted a fresh run stamp, so there was something to commit."
            exit 1
          fi
          TARGET="${LAND_BRANCH}"
          echo "asserting THIS run's rows: sweep_generated_at=${STAMP}"
          # ⚠️ TWO FETCHES, NOT ONE, AND THE FIRST MUST SUCCEED.
          # `git fetch` aborts ATOMICALLY on an unknown refspec, so one fetch
          # naming both refs updates NEITHER when the second is gone — and the
          # `|| true` swallows the fatal, leaving the assertion to read a
          # checkout-time origin/main and report `absent` for rows that landed.
          # ⚠️ THIS SAID THE BUG WAS "LATENT here rather than active, because
          # this workflow pushes TARGET without a PR, so nothing deletes it".
          # THAT IS NO LONGER TRUE AS OF 2026-08-31: the landing step now goes
          # through commit-to-main, which merges with --delete-branch, so the
          # branch IS deleted on the happy path and the second fetch fails on
          # every healthy run. This is the ACTIVE case now — exactly the shape
          # that cost gld-compat-matrix a false failure on run 33340468235.
          # The two-fetch form below is what makes that a non-event.
          git fetch origin "${DEFAULT_BRANCH:-main}"
          PUSHED=()
          if git fetch origin "${TARGET}" 2>/dev/null; then
            PUSHED=(--pushed-ref "origin/${TARGET}")
          else
            echo "target branch ${TARGET} is gone — its rows must be on ${DEFAULT_BRANCH:-main}"
          fi
          python3 scripts/ci/assert_rows_landed.py \
            --store docs/research/e35-bracket-corpus.jsonl \
            --ref "origin/${DEFAULT_BRANCH:-main}" \
            "${PUSHED[@]}" \
            --field sweep_generated_at --contains "${STAMP}" --min-rows 1
