name: e35-bracket-sweep

# Shard the E3.5 bracket-geometry sweep ONE LEG PER JOB on free GitHub runners.
#
# WHY THIS EXISTS. Run as a single serial pass the sweep is a multi-hour job, and
# on 2026-08-20 an interactive session had it killed THREE times mid-run by its
# ephemeral sandbox being recycled. Measured at the time: 30 GB disk free, 799 MB
# of 16 GB memory in use, no OOM lines in dmesg, and a dmesg head showing
# `crng reseeded due to virtual machine fork` — i.e. a container re-provision,
# NOT resource exhaustion. Nothing was lost (per-leg reports persist and the
# resume skips completed legs) but each recycle cost wall-clock.
#
# The fix is not a bigger box, and it is NOT the GPU burst: this is CPU-bound
# single-threaded backtesting (~1.1 s per harness run), so a GPU buys nothing and
# `gpu-burst-train.yml` would spend against the $10/month cap in
# comms/gpu_spend_ledger.json for no gain. The fix is to run it where a recycle
# cannot reach it, sharded so a failure costs ONE leg.
#
# Same shape as `m20-exit-lever-sweep.yml`, with ONE deliberate difference: that
# workflow scp's its frames from the trainer VM. This one fetches from
# data.binance.vision instead — proven this session to reproduce the trainer
# substrate exactly — which removes an SSH dependency AND the trainer contention
# `docs/claude/vm-resource-management.md` warns about. Free lane, no VM touched.
#
# Tier-1 throughout: research tooling only. Writes no config, runs no order path.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "CSV of leg names. Empty = every runnable leg."
        required: false
        default: ""
      days:
        description: "Trailing days of candles to fetch per leg."
        required: false
        default: "1830"
      gate_top:
        description: "Surface cells per axis sent to the IS/OOS + walk-forward gate."
        required: false
        default: "2"
      singles_only:
        description: "true = one-axis-at-a-time grid only (fast smoke)."
        required: false
        default: "false"
      max_parallel:
        description: "Concurrent legs. Keep modest to stay a good citizen."
        required: false
        default: "6"

permissions:
  contents: read

concurrency:
  group: e35-bracket-sweep
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet pandas numpy requests pyyaml

      # The planner resolves legs through the sweep's OWN plan_legs, so this job
      # cannot disagree with the sweep about which legs exist.
      #
      # ⚠️ It EXITS NON-ZERO on an empty matrix, deliberately. GitHub reports a
      # matrix that expands to zero jobs as SUCCESS, so without this the whole
      # workflow would go green having tested nothing — indistinguishable from
      # "all 19 legs passed". `set -e` propagates that refusal.
      - name: Plan the shards
        id: plan
        run: |
          set -euo pipefail
          python scripts/research/e35_shard_plan.py \
            ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }} \
            --out matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(python -c 'import json;print(len(json.load(open("matrix.json"))["include"]))')" >> "$GITHUB_OUTPUT"
      - name: Show the plan
        run: |
          echo "### e35 bracket sweep — ${{ steps.plan.outputs.count }} shard(s)" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import json
          m = json.load(open('matrix.json'))['include']
          print('| leg | symbol | tf | family |'); print('|---|---|---|---|')
          for r in m: print(f\"| \`{r['leg']}\` | {r['symbol']} | {r['tf']} | {r['family']} |\")
          " >> "$GITHUB_STEP_SUMMARY"

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330          # < the 6h GH ceiling
    strategy:
      # ONE LEG FAILING MUST NOT CANCEL THE OTHERS — the whole point of sharding
      # is that a lost leg costs a leg. fail-fast would give back exactly the
      # property this workflow exists to buy.
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '6') }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --quiet pandas numpy requests pyyaml

      # GitHub runners are US Azure IPs and Bybit geoblocks the US
      # (BL-20260727-BYBIT-USGEOBLOCK-GHRUNNER), so the source is PINNED to
      # Binance's public archive rather than left to `auto` — pinning also skips
      # the doomed ~14s Bybit retry loop. The interval code comes from the
      # planner, which REFUSES an unmapped timeframe rather than defaulting: a
      # wrong interval does not error, it silently measures a different
      # population.
      - name: Fetch this leg's candles (free lane — no VM, no trainer)
        env:
          BACKTEST_FEED_SOURCE: binance_vision
        run: |
          set -euo pipefail
          mkdir -p data
          OUT="data/${{ matrix.symbol }}_${{ matrix.tf }}.csv"
          python scripts/ops/fetch_backtest_candles.py \
            --symbol "${{ matrix.symbol }}" \
            --interval "${{ matrix.fetch_interval }}" \
            --days "${{ inputs.days || '1830' }}" \
            --output "${OUT}"
          n=$(( $(wc -l < "${OUT}") - 1 ))
          echo "rows=${n}"
          # A silent-empty here would make the leg read data_missing and the
          # sweep would report "no cells evaluated" as though that were a verdict.
          if [ "${n}" -lt 100 ]; then
            echo "::error::only ${n} rows fetched for ${{ matrix.symbol }} ${{ matrix.tf }} — the sweep would be a false negative"
            exit 1
          fi

      - name: Sweep this leg
        run: |
          set -euo pipefail
          python scripts/research/e35_bracket_geometry_sweep.py \
            --only "${{ matrix.leg }}" \
            --gate-top "${{ inputs.gate_top || '2' }}" \
            ${{ inputs.singles_only == 'true' && '--singles-only' || '' }} \
            --out "out/${{ matrix.leg }}"

      # A leg's result must outlive this runner, and the artifact is what makes
      # the shard model safe: a recycled/failed job loses its own leg and nothing
      # else, because every other leg already uploaded.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e35-bracket-${{ matrix.leg }}
          path: out/${{ matrix.leg }}
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [plan, sweep]
    # `always()`: a partially-failed matrix still produced real rows for the legs
    # that DID finish, and throwing them away because one leg died is the
    # opposite of what sharding is for. The summary states the denominator.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: e35-bracket-*
          merge-multiple: false
      - name: Roll up
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          planned = int("${{ needs.plan.outputs.count }}" or 0)
          reports = sorted(pathlib.Path("collected").rglob("report.json"))
          print(f"### e35 bracket sweep — {len(reports)} of {planned} leg(s) returned a report\n")
          # STATE THE DENOMINATOR. A table of the legs that finished, with no
          # count of the ones that did not, reads as a complete sweep.
          if len(reports) < planned:
              print(f"> ⚠️ **{planned - len(reports)} leg(s) produced no report** — "
                    f"read every number below as covering {len(reports)}/{planned} legs.\n")
          print("| leg | base net_R | grid min | grid max | **spread** | best cell |")
          print("|---|---|---|---|---|---|")
          for p in reports:
              d = json.loads(p.read_text())
              for leg in d.get("legs", []):
                  s = leg.get("surface")
                  if not s:
                      print(f"| `{leg.get('leg')}` | ERROR | | | | |"); continue
                  print(f"| `{leg['leg']}` | {s['base_net_r']} | {s['net_r_min']} | "
                        f"{s['net_r_max']} | **{s['net_r_spread']}** | `{s['best_cell']}` |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: e35-bracket-ALL
          path: collected
          retention-days: 90

  # ------------------------------------------------------------------ corpus
  # WHY THIS JOB EXISTS. Until 2026-08-23 this workflow ended at the artifact
  # above, and a PM-side session has NO artifact download (root CLAUDE.md). So
  # 3,781 measured cells were write-only: re-interrogating ANY of them — a
  # dispersion test, a different gate, wins_effective beside wins — meant
  # re-running the whole multi-hour sweep from candles. A session did exactly
  # that on 2026-08-23, which is what surfaced it.
  # BL-20260823-E35-SWEEP-EVIDENCE-HAS-NO-DURABLE-PATH
  #
  # This is the same cure m20_corpus_extract.py already gives the LEVER sweep,
  # and this job deliberately mirrors that workflow's corpus job rather than
  # inventing a second shape.
  corpus:
    needs: [plan, sweep, aggregate]
    # `always()` for the same reason `aggregate` uses it: the legs that DID
    # finish produced real rows, and discarding them because one leg died is
    # the opposite of what sharding buys.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # The ONLY job here that writes. Kept off the workflow's top-level
      # `contents: read` so the sweep shards stay read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: collected
          pattern: e35-bracket-*
          merge-multiple: false

      - name: Extract per-cell rows into the committed corpus
        id: extract
        run: |
          set -euo pipefail
          # The extractor REFUSES an empty scan rather than exiting 0, so a run
          # that produced no report cannot land here as a silent success.
          python3 scripts/research/e35_corpus_extract.py collected | tee extract.out

      - name: Commit + push the corpus
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/e35-bracket-corpus.jsonl
          if git diff --cached --quiet; then
            echo "corpus byte-identical to the committed copy — this run"
            echo "superseded rows that matched what was already recorded."
            exit 0
          fi
          # WHERE IT LANDS. A dispatch on the default branch cannot push there:
          # branch protection declines a bare commit it cannot give required
          # checks to (GH006). That is STRUCTURAL, so the fix is to retarget,
          # never to retry — measured on the lever sweep as four dispatches
          # that swept every leg and then threw every row away at this step
          # (BL-20260812-SWEEP-CORPUS-CANNOT-PUSH-TO-MAIN).
          TARGET="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          RETARGETED=0
          if [ "$TARGET" = "${DEFAULT_BRANCH:-main}" ]; then
            TARGET="claude/e35-bracket-corpus"
            RETARGETED=1
            echo "::notice::dispatched on ${DEFAULT_BRANCH:-main} (protected) — routing the corpus to '$TARGET' to preserve the rows."
          fi
          echo "corpus target branch: $TARGET (retargeted=$RETARGETED)"
          {
            echo "corpus: e35 bracket sweep run $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            cat extract.out
            echo
            echo "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          } > .commitmsg
          git commit -F .commitmsg
          # A push can lose a genuine race with a concurrent dispatch, which IS
          # retryable — unlike the protection refusal above.
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/${TARGET}"; then
              echo "pushed to ${TARGET} on attempt ${attempt}"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::could not push the corpus to ${TARGET} after 3 attempts — the rows are in this run's artifact and are NOT lost, but nothing has recorded them"
              exit 1
            fi
            git fetch origin "${TARGET}" || true
            git rebase "origin/${TARGET}" || git rebase --abort || true
            sleep $((attempt * 5))
          done
          if [ "$RETARGETED" = "1" ]; then
            # ⚠️ NO CLAIM THAT ANYTHING DOWNSTREAM FINISHES THIS. A push made
            # with GITHUB_TOKEN starts no workflows (the recursion guard), so
            # this job cannot open or green its own PR — measured on the lever
            # sweep's first default-branch dispatch, which landed rows and
            # triggered ZERO runs (BL-20260813-CORPUS-RETARGET-CANNOT-OPEN-ITS-OWN-PR).
            # A loud, accurate hand-off beats a claim that is not true.
            echo "::notice::corpus rows are on '${TARGET}'. A HUMAN OR A SESSION must open the PR — this job cannot, and no workflow will fire from its push."
          fi
