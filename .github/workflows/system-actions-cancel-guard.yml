name: system-actions-cancel-guard

# A system-action cancelled before it ran is never silent (OA-17, 2026-10-04).
#
# GitHub keeps ONE pending run per concurrency group; a newer request in the
# shared (mutating) lane cancels an older pending one. Before this guard the
# requester's issue stayed open with zero comments and the action never happened
# (#16251 / #16263, both de-risk steps). On every system-actions run that
# concludes `cancelled`, this reads the issue number the run's `route` job
# recorded and runs scripts/ops/system_action_cancel_guard.py:
#   main job never started + issue open -> comment "CANCELLED, NOT RUN" naming
#     the displacing run + ONE direct Telegram alert; issue left open;
#   main job started, then cancelled   -> comment only (may have partially applied);
#   issue closed                       -> nothing (closing is how to withdraw).
# It NEVER re-queues: the run was displaced by a NEWER request, so re-filing it
# would run it AFTER that one and invert their order (an old `=live` would undo
# a newer `=read_only` de-risk). The alert is a direct Telegram call, not a
# send-ping system-action, which would sit in the same droppable lane.

on:
  workflow_run:
    workflows: [system-actions]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  guard:
    if: github.event.workflow_run.conclusion == 'cancelled' && github.event.workflow_run.event == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ops/system_action_cancel_guard.py
          sparse-checkout-cone-mode: false
      - name: Fetch the cancelled run's request record
        id: req
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: system-action-request
          path: request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment and alert (never re-queue)
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANCELLED_RUN_ID: ${{ github.event.workflow_run.id }}
          CANCELLED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -f request/issue_number ]; then
            export ISSUE_NUMBER="$(head -c 20 request/issue_number | tr -dc '0-9')"
          else
            echo "::warning::cancelled run ${CANCELLED_RUN_ID} has no system-action-request artifact (cancelled before its route job ran); cannot name its issue"
            export ISSUE_NUMBER=""
          fi
          python3 scripts/ops/system_action_cancel_guard.py
