name: gitleaks-history-weekly

# FIX-SA-13 / SA-AUD-7-secret-scan-head-only (system audit 2026-09-29).
#
# scripts/secret_scan.py (guard `secret-scan`) reads HEAD's tracked files with
# three patterns, so it cannot see history and knows no GitHub / Alpaca / AWS /
# PEM shape. This runs gitleaks' default ruleset over FULL history, weekly.
#
# THE OUTPUT OF THIS WORKFLOW IS PUBLIC (public repo). A matched secret value
# must never reach a log, a job summary, an artifact or a comment:
#   * gitleaks runs with --redact=100, no -v, --log-level error;
#   * its JSON report goes to $RUNNER_TEMP and is read ONLY by
#     scripts/ops/gitleaks_summarize.py, which prints an allowlist of keys
#     (rule, file, commit, line) and then deletes the report;
#   * there is no upload-artifact step and no issue/PR comment step.
#
# Why the gitleaks BINARY and not gitleaks/gitleaks-action: the action's
# verbosity, summary and comment behaviour is not ours to pin down, and the
# requirement here is "never echo a matched value". The binary is pinned by
# version AND sha256 (verified below); checkout is pinned by commit sha.
#
# FIRST RUN IS EXPECTED TO BE RED. Default rules over 6.6k commits found 356 on
# 2026-09-29 (296 of them `generic-api-key` in docs/claude/work/ — entropy
# matches on ids). A finding here is a REPORT, not proof of a live secret: triage
# per row, then commit `.gitleaks-baseline.json` (a redacted gitleaks report;
# picked up automatically below) so later runs fail only on NEW findings. Do not
# baseline before triage. See PIPELINE row filed with this workflow.

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-history-weekly
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.24.3"
  # sha256 of gitleaks_8.24.3_linux_x64.tar.gz, from the release's own
  # gitleaks_8.24.3_checksums.txt (checked 2026-09-29).
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version + sha256)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full history (values redacted, never printed)
        run: |
          set -euo pipefail
          args=(detect --source . --redact=100 --no-banner --log-level error
                --exit-code 0 --report-format json --report-path "$RUNNER_TEMP/gitleaks-report.json")
          if [ -f .gitleaks-baseline.json ]; then
            args+=(--baseline-path .gitleaks-baseline.json)
          fi
          "$RUNNER_TEMP/gitleaks" "${args[@]}"

      - name: Report file / commit / rule only, fail on findings
        run: python3 scripts/ops/gitleaks_summarize.py "$RUNNER_TEMP/gitleaks-report.json"

# no-durable-result: weekly detector; its result is the run's pass/fail and job summary, not the research/results queue
