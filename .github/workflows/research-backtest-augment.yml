name: research-backtest-augment

# A1 research-backtest-augment runner (WORK-PLAN-2026-08-02 W1.2) on a free
# GitHub-hosted runner. Runs the pinned pooled harness roster (trend_donchian@1h,
# squeeze_breakout_4h@4h, htf_pullback_trend_2h@2h) per symbol (BTCUSDT/ETHUSDT/
# SOLUSDT), --emit-trades, and records the trades as `is_backtest=1` rows into ONE
# backtest_trades.db artifact — the W1.2 → W2.1 handoff. Crypto (`*USDT`) rides
# Binance-vision (keyless; the US runner's Bybit geoblock doesn't matter).
# Engine: scripts/ml/backtest_augment_runner.py (composition of
# scripts/research/regime_debt_matrix.emit_trades_for + record_harness_trades).
# Scope: docs/research/A1-backtest-augment-runner-SCOPE-2026-08-02.md.
#
# Triggers:
#   1. workflow_dispatch — inputs: only (CSV of strategy names, blank=roster),
#      symbols (CSV, blank=BTCUSDT,ETHUSDT,SOLUSDT), days, run_tag
#   2. issues.opened with label `research-backtest-augment-request` (owner-guarded);
#      optional issue-body lines `only: a,b`, `symbols: BTCUSDT,ETHUSDT`,
#      `days: 730`, `run_tag: a1-crypto-<date>`
#
# Safety: READS the repo + fetches PUBLIC candles (Binance-vision) + runs the
# read-only backtest harnesses + records ONLY `is_backtest=1` rows into a TEMP
# artifact DB (NEVER the production money DB) + uploads it. It does NOT push,
# deploy, touch config/, or write any live DB — it authors no cell. The trainer-
# side W2.1 (dataset build + live-holdout eval) is the FIFO-lane follow-on.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "CSV of harness strategy names (blank = pooled roster)"
        default: ""
      symbols:
        description: "CSV of symbols to replay each strategy on (blank = BTCUSDT,ETHUSDT,SOLUSDT)"
        default: ""
      days:
        description: "Trailing days of candles"
        default: "730"
      run_tag:
        description: "notes tag on every recorded row (blank = a1-crypto-<UTC-date>)"
        default: ""
  issues:
    types: [opened]
  # DURABILITY (BL-20260731-BACKTEST-AUGMENTATION-NEVER-FED follow-up, 2026-08-04):
  # weekly refresh so the standing backtest_trades.db the trainer nightly build
  # merges (build_trainer_datasets.sh, include_backtest) is never a one-shot that
  # silently goes stale/absent → journal-only. Runs on the FREE runner (the 1-OCPU
  # trainer never does this heavy backtest) and SSH-lands the db onto the trainer.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: research-backtest-augment-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  augment:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'research-backtest-augment-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue body
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          only=$(printf '%s' "$ISSUE_BODY" | grep -iE '^only:' | head -1 | cut -d: -f2- | xargs || true)
          symbols=$(printf '%s' "$ISSUE_BODY" | grep -iE '^symbols:' | head -1 | cut -d: -f2- | xargs || true)
          days=$(printf '%s' "$ISSUE_BODY" | grep -iE '^days:' | head -1 | cut -d: -f2- | xargs || true)
          run_tag=$(printf '%s' "$ISSUE_BODY" | grep -iE '^run_tag:' | head -1 | cut -d: -f2- | xargs || true)
          echo "A1_ONLY=${only}" >> "$GITHUB_ENV"
          echo "A1_SYMBOLS=${symbols}" >> "$GITHUB_ENV"
          echo "A1_DAYS=${days:-730}" >> "$GITHUB_ENV"
          echo "A1_RUN_TAG=${run_tag}" >> "$GITHUB_ENV"

      - name: Set params from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "A1_ONLY=${{ github.event.inputs.only }}" >> "$GITHUB_ENV"
          echo "A1_SYMBOLS=${{ github.event.inputs.symbols }}" >> "$GITHUB_ENV"
          echo "A1_DAYS=${{ github.event.inputs.days || '730' }}" >> "$GITHUB_ENV"
          echo "A1_RUN_TAG=${{ github.event.inputs.run_tag }}" >> "$GITHUB_ENV"

      - name: Set params for the weekly schedule
        # Scheduled refresh: pooled roster + all three crypto symbols + 730d (the
        # runner's own defaults), so the standing backtest_trades.db stays fresh.
        if: github.event_name == 'schedule'
        run: |
          echo "A1_ONLY=" >> "$GITHUB_ENV"
          echo "A1_SYMBOLS=" >> "$GITHUB_ENV"
          echo "A1_DAYS=730" >> "$GITHUB_ENV"
          echo "A1_RUN_TAG=a1-crypto-weekly" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        # `requests` is required by scripts/ops/fetch_backtest_candles.py (the
        # binance_vision crypto fetch). A1 is crypto-only so it drops yfinance —
        # which is what transitively supplied `requests` in the sibling
        # regime-debt-matrix / adx-cutpoint workflows — so name it explicitly here
        # (else every fetch fails `import requests`, all legs 0 rows).
        run: pip install --quiet pyyaml pandas numpy requests

      - name: Run the augment runner
        run: |
          set +e
          mkdir -p artifacts/a1
          ONLY_ARG=""
          if [ -n "${A1_ONLY}" ]; then ONLY_ARG="--only ${A1_ONLY}"; fi
          SYM_ARG=""
          if [ -n "${A1_SYMBOLS}" ]; then SYM_ARG="--symbols ${A1_SYMBOLS}"; fi
          TAG_ARG=""
          if [ -n "${A1_RUN_TAG}" ]; then TAG_ARG="--run-tag ${A1_RUN_TAG}"; fi
          echo "days=${A1_DAYS} only='${A1_ONLY}' symbols='${A1_SYMBOLS}' run_tag='${A1_RUN_TAG}'"
          python scripts/ml/backtest_augment_runner.py \
            --db artifacts/a1/backtest_trades.db \
            --workdir artifacts/a1/work \
            --out-dir artifacts/a1 \
            --days "${A1_DAYS}" ${ONLY_ARG} ${SYM_ARG} ${TAG_ARG} \
            > artifacts/a1/run.stdout 2> artifacts/a1/run.log
          echo "rc=$?"; tail -25 artifacts/a1/run.log || true

      - name: Land backtest_trades.db onto the trainer (durability)
        # The trainer nightly build (scripts/ops/build_trainer_datasets.sh) merges
        # ${DATASETS_ROOT}/backtest_trades.db for the include_backtest pooled builds
        # ONLY `if [ -f ]`. Uploading the db as an artifact alone left it a one-shot
        # that silently went stale/absent → journal-only. This lands the freshly-
        # regenerated db onto the trainer atomically each run so the merge stays
        # live. Heavy compute stays on THIS free runner; the trainer only receives
        # the file. Best-effort: an unset key / SSH failure warns, never fails the
        # run (the artifact is still uploaded next). BL-20260731 durability follow-up.
        if: always()
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
        run: |
          DB="artifacts/a1/backtest_trades.db"
          if [ ! -s "$DB" ]; then
            echo "::warning::backtest_trades.db absent/empty — nothing to land on the trainer this run."
            exit 0
          fi
          if [ -z "${VM_SSH_KEY}" ]; then
            echo "::warning::VM_SSH_KEY unset — cannot land backtest_trades.db on the trainer (db still uploaded as artifact)."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key && chmod 600 ~/.ssh/trainer_key
          ssh-keyscan -t ed25519,ecdsa,rsa "${TRAINER_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          DEST="/home/ubuntu/ict-trading-bot/datasets-out"
          # Atomic: scp to a temp path, then mv into place on the trainer so the
          # nightly build never reads a half-copied db.
          if scp -i ~/.ssh/trainer_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
               "$DB" "${TRAINER_USER}@${TRAINER_IP}:${DEST}/backtest_trades.db.tmp" && \
             ssh -i ~/.ssh/trainer_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
               "${TRAINER_USER}@${TRAINER_IP}" \
               "mkdir -p ${DEST} && mv -f ${DEST}/backtest_trades.db.tmp ${DEST}/backtest_trades.db && ls -la ${DEST}/backtest_trades.db"; then
            echo "Landed backtest_trades.db on the trainer (${TRAINER_IP}:${DEST})."
          else
            echo "::warning::failed to land backtest_trades.db on the trainer (SSH/scp error) — db still uploaded as artifact; the trainer keeps its previous copy."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-backtest-augment-${{ github.run_id }}
          path: |
            artifacts/a1/backtest_trades.db
            artifacts/a1/backtest_augment_result.json
            artifacts/a1/SUMMARY.md
            artifacts/a1/run.log
            artifacts/a1/work/*__trades.jsonl
          retention-days: 14
          if-no-files-found: warn

      - name: Comment summary on issue
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '_(summary not produced — read run.log in the artifact)_';
            try { body = fs.readFileSync('artifacts/a1/SUMMARY.md', 'utf8'); } catch (e) {}
            body += `\n\n_Artifact: \`backtest_trades.db\` (+ per-strategy JSONLs) uploaded to run ${context.runId} — the W2.1 trainer step pulls it._`;
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000) + footer,
            });
