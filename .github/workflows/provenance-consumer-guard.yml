name: provenance-consumer-guard

# Fails the PR check when a provenance signal gains a WRITER but no CONSUMER.
#
# Motivation (2026-07-30): `notes.exit_price_source` was written in 12 files and
# branched on in exactly one — for an unrelated value. The whole `ml/` tree
# referenced it zero times. So the journal faithfully recorded whether each PnL
# was measured or manufactured, and every consumer — /performance, the report
# renderer, the three review skills, every ML label builder — treated the two as
# identical.
#
# The cost, once measured: 226 closed rows carrying +$247,683.78 of mark-price
# PnL, 247 more with no provenance at all, and a fabricated share of closed
# trades running 0.0% (May) -> 30.5% (June) -> 64.9% (July). It also produced a
# "-$6,358 scalp exit leak" that did not exist.
#
# A field that is written and never read is WORSE than a missing field:
# reviewers see it and assume something acts on it. That false assurance is what
# let the defect survive several thorough line-by-line audits — every individual
# component was correct; the defect lived at the seams.
#
# Rules and documentation did not prevent this. A guard can. Same shape as
# canonical-db-resolver / env-gate-guard / silent-empty-guard.
#
# **Actions-minutes billing cap (MB-20260706-CI-MINUTES):** this is intended as
# a REQUIRED status check, so the trigger can NEVER carry a `paths:` filter
# (that would leave the check permanently "pending" on a non-matching PR).
# Instead the job always runs (cheap: checkout + `git diff --name-only`) and
# skips the guard script itself when no `.py` file changed — a provenance
# writer or consumer can only appear in Python.

on:
  # Dormant until the native merge queue is enabled (BL-20260726 merge-queue
  # enablement); required checks MUST run on the merge_group ref or the queue
  # stalls.
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  provenance-consumer-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changed files
        id: changed
        run: |
          set -e
          git fetch origin "${{ github.base_ref }}" --quiet
          RANGE="origin/${{ github.base_ref }}...HEAD"
          FILES=$(git diff --name-only $RANGE || true)
          echo "Changed files ($RANGE):"
          echo "$FILES"
          if echo "$FILES" | grep -Eq '\.py$|\.github/workflows/provenance-consumer-guard\.yml$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No .py files changed — skipping the guard (short-circuit, MB-20260706-CI-MINUTES)."
          fi

      - name: Set up Python
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run guard
        if: steps.changed.outputs.relevant == 'true'
        run: python scripts/check_provenance_consumers.py --verbose
