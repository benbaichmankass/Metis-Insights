name: pr-queue-watch

# THE CLOCK THE MANAGER DOES NOT OWN.
#
# Operator directive 2026-09-02: "I want actual guards and mechanisms in the
# repo/vm themselves that watch the manager and enforce the rules on him."
#
# WHY IT IS A WORKFLOW AND NOT SOMETHING A SESSION RUNS.
#   A check invoked by the actor it checks cannot catch that actor failing.
#   `manager_preflight.py` is a preflight and therefore has the exact failure it
#   was built to fix: a manager that skipped step 3 of its sweep will skip the
#   preflight too. Measured across this cycle -- every mechanism the manager had
#   to CHOOSE to run went unused; every mechanism that STOOD IN THE WAY worked.
#   So this is not reachable from a prompt, a skill, or a checklist step.
#
# WHY IT IS NOT THE MCP WATCHER.
#   `scripts/ops/queue_latency.py` asks the same question about SESSIONS and
#   answers it from `list_sessions` -- an mcp__* tool CI does not hold. It
#   reports `unknown` permanently and refuses, correctly, to substitute a stale
#   registry snapshot. This is the narrower question GITHUB_TOKEN alone can
#   answer, and the two are complements, not substitutes.
#
# ⚠️ A CRON IS NOT EVIDENCE OF A RUN, AND THIS ONE IS UNPROVEN UNTIL OBSERVED.
#   `probes.yml`'s first-ever scheduled run fired ~4h50m LATE and once instead
#   of daily. `session-reaper.yml` failed five times before its first success.
#   So the cadence is not trusted: every run writes a dated receipt
#   (`docs/claude/work/PR-QUEUE-WATCH.json`) and
#   `scripts/ci/check_pr_queue_watch.py` grades that receipt's AGE in
#   `run_guards.py` on every PR. A watcher that stops therefore announces itself
#   in everybody's CI instead of going quiet. Read `generated_at`, never the cron.
#
# ⚠️ NO `push:` TRIGGER, DELIBERATELY. This workflow COMMITS its receipt to
#   `main`; a push trigger would retrigger it, which would stamp again -- the
#   unbounded loop `reconcile-open-prs.yml` documents closing in exactly one hop.
#   `workflow_dispatch` is here so a run can be FORCED rather than waited for.
#
# BLAST RADIUS. Reads the open-PR list and `origin`'s branch tips; writes ONE
# generated JSON file under docs/claude/work/. It NEVER merges, closes,
# un-drafts, comments on, or otherwise touches a pull request -- which is what
# makes it safe to grade on branch quiescence, a PROXY for hand-back that it
# cannot verify. Tier-1: no order path, no strategy config, no risk caps, no VM.

on:
  schedule:
    # Every 6 hours, offset off the hour so it does not pile into the :00 rush.
    # CHOSEN against the watcher's own 6h escalation threshold: a cadence slower
    # than the threshold would let a PR cross it and sit a full extra period
    # before anything looked. NOT tuned -- see the threshold's own basis note in
    # scripts/ops/pr_queue_latency.py.
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      threshold_hours:
        description: 'Hours of branch quiescence before a PR counts as waiting'
        required: false
        default: '6'

permissions:
  contents: write
  pull-requests: read

concurrency:
  # One watcher at a time. Two concurrent runs would race the same receipt and
  # the loser's assessment would be silently overwritten.
  group: pr-queue-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ MUST be the PAT, not GITHUB_TOKEN: `commit-to-main` pushes its
          # branch with whatever credential the checkout configured, and a PR
          # opened by GITHUB_TOKEN does NOT trigger the on:pull_request required
          # checks -- so it would stall auto-merge forever.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          # ⚠️ LOAD-BEARING. Branch quiescence is read from `origin`'s commit
          # times. On a shallow clone every head would fail to resolve and the
          # watcher would grade `undateable` -- which it reports honestly, but
          # the run would then measure nothing at all.
          fetch-depth: 0

      - name: Fetch every origin branch
        run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Self-test the grading policy before trusting a live run
        # The policy is a pure function precisely so it is arguable here rather
        # than against a live queue. A watcher whose grading is broken must fail
        # loudly, not write a confident receipt.
        run: |
          python3 scripts/ops/pr_queue_latency.py --self-test
          python3 scripts/ci/check_pr_queue_watch.py --self-test
          # The manager-state half and the Routine's liveness guard, same rule:
          # a watcher whose grading is broken must fail loudly, not write a
          # confident receipt.
          python3 scripts/ops/manager_state_watch.py --self-test
          python3 scripts/ci/check_manager_queue_watch.py --self-test
          # The blocked-lane grading policy, for the same reason and in the same
          # place. ⚠️ IT LIVES HERE RATHER THAN IN ITS OWN STEP BECAUSE A FAILING
          # SELF-TEST MUST NOT TAKE DOWN THE PR-QUEUE ESCALATION. Run inside the
          # lanes step with `|| exit 2` it skipped `Land the receipt on main`,
          # `Watch the MANAGER STATE` and `Report the verdict` -- the channel this
          # workflow exists for -- while that step's own comment promised it
          # never fails the job (MI-235 review lane, 2026-09-11).
          python3 scripts/ops/blocked_lane_watch.py --self-test

      - name: Read the open-PR list
        # ⚠️ ON FAILURE THIS WRITES NOTHING AND THE WATCHER GRADES
        # `no_observation`. It deliberately does NOT fall back to an empty list:
        # "we could not look" and "no PR is open" are opposite facts, and the
        # `curl ... || echo '{}'` idiom that collapses them is a named failure
        # class in this repo (a 403 read as `0 checks`).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > /tmp/open-prs.json
          echo "read $(jq 'length' /tmp/open-prs.json) open PR(s)"

      - name: Assess the queue
        id: assess
        # Exit 3 (escalate) and 4 (unknown) are NOT step failures here -- the
        # receipt must land before the job reports, or a backed-up queue would
        # also lose the record of itself. The job fails at the end instead.
        #
        # ⚠️ DO NOT PIPE THIS INTO `tee`. `$?` after a PIPELINE is the exit status
        # of the LAST command in it, so `python3 ... | tee f` makes `$?` read
        # `tee`'s status -- which is ALWAYS 0. That is not a style nit: it shipped
        # on 2026-09-02 and made the escalation channel DEAD ON ARRIVAL. The very
        # first live run (33666587546) measured 6 waiting PRs, worst 110.5h,
        # stamped `last_paged_at` in its own receipt -- and concluded `success`,
        # so `claude-run-failure-alert.yml` never paged the operator. The watcher
        # counted the CALL and not its EFFECT, which is the exact class
        # `BL-20260825-PLACE-PROTECTIVE-COUNTS-THE-CANCEL-CALL-NOT-ITS-EFFECT`
        # names, reproduced in a shell one-liner. A self-test case in
        # `scripts/ci/check_pr_queue_watch.py` now asserts this file never
        # reintroduces the pipe.
        run: |
          set +e
          python3 scripts/ops/pr_queue_latency.py \
            --open-prs /tmp/open-prs.json \
            --threshold-hours "${{ github.event.inputs.threshold_hours || '6' }}" \
            --write-state > /tmp/digest.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/digest.txt

      - name: Watch the BLOCKED LANES — has what each is waiting for happened?
        id: lanes
        # MI-235. A lane blocked on a manager action has no mechanism that tells
        # it the action happened: measured at 13h (MI-222), 3.5 days (MI-139) and
        # 33 minutes (MI-238, which announced its blocker in a machine-readable
        # field that nothing read). All three were freed only because a manager
        # happened to read the roster by hand.
        #
        # ⚠️ IT LIVES HERE RATHER THAN IN A NEW WORKFLOW BECAUSE THIS CLOCK IS
        # THE ONE THAT DEMONSTRABLY FIRES. Measured 2026-09-11 over the last 12
        # landings of this workflow's own receipt: a continuous dated series from
        # 2026-09-06T20:49:05Z to 2026-09-11T05:14:26Z, 2-3 per day. Against that,
        # `probes.yml` was 67.7h stale and `session-reaper.yml`'s ledger carries
        # no `generated_at` at all. A new cron nobody has seen fire is the
        # looks-armed-is-not failure MI-235 exists to end, so this reuses the
        # proven one — and the open-PR listing it already fetched IS the input.
        #
        # ⚠️ THIS STEP NEVER FAILS THE JOB. Its verdict is reported by a separate
        # `if: always()` step at the end, so it can neither skip nor mask the
        # PR-queue escalation this workflow already owns.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          # The blocked-lane watch needs every repo a lane may be waiting on.
          # ⚠️ A REPO WE CANNOT LIST IS NOT A REPO WITH NOTHING OPEN. The combiner
          # below tags each row with its repo and the watcher only applies the
          # absent-therefore-closed inference to repos the listing actually
          # enumerates; anything else grades `could_not_look` and PAGES. That is
          # not hypothetical — MI-238 was blocked on ict-trader-dashboard#215.
          gh api --paginate \
            "repos/benbaichmankass/ict-trader-dashboard/pulls?state=open&per_page=100" \
            > /tmp/dash-prs.json 2>/tmp/dash-err.txt \
            || { echo "::warning::could not list ict-trader-dashboard open PRs — \
          lanes blocked on that repo will grade could_not_look and PAGE, which is \
          the honest degradation, not a silent pass. $(head -c 300 /tmp/dash-err.txt)"; \
                 rm -f /tmp/dash-prs.json; }
          python3 - <<'COMBINE'
          import json, pathlib
          rows = []
          for path, repo in (("/tmp/open-prs.json", "benbaichmankass/Metis-Insights"),
                             ("/tmp/dash-prs.json", "benbaichmankass/ict-trader-dashboard")):
              f = pathlib.Path(path)
              if not f.exists():
                  continue
              try:
                  data = json.loads(f.read_text())
              except Exception:
                  # NOT `[]`. An unparseable listing must not read as "nothing open".
                  continue
              for r in data if isinstance(data, list) else []:
                  rows.append({"number": r.get("number"), "repo": repo,
                               "state": r.get("state"), "merged_at": r.get("merged_at")})
          pathlib.Path("/tmp/lane-pr-state.json").write_text(json.dumps(rows))
          print(f"blocked-lane watch: open-PR listing covers {len(rows)} PR(s)")
          COMBINE
          python3 scripts/ops/blocked_lane_watch.py \
            --pr-state /tmp/lane-pr-state.json \
            --write-receipt > /tmp/lanes.txt 2>&1
          lane_rc=$?
          echo "rc=$lane_rc" >> "$GITHUB_OUTPUT"
          cat /tmp/lanes.txt

      - name: Land the receipt on main (auto-merge PR)
        # `main` is protected and rejects a direct workflow push (GH006). The
        # action no-ops cleanly when the receipt is unchanged, which is the
        # ordinary outcome of a quiet run inside the refresh floor.
        # `verify-merged: true` because exiting 0 the moment a PR is OPENED
        # would make a green run mean "a PR exists", never "the receipt is on
        # main" -- and this repo carried five stranded automation branches from
        # exactly that.
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          # ⚠️ TWO receipts, ONE landing. The blocked-lane receipt is also the
          # PAGING LATCH: a blocker pages on the run that first grades it
          # `cleared` and not again. If this landing fails the latch does not
          # advance and the next run pages again — failing toward waking,
          # deliberately, which is the safe direction for this alarm.
          paths: |
            docs/claude/work/PR-QUEUE-WATCH.json
            docs/claude/work/BLOCKED-LANE-WATCH.json
          message: 'chore(ops): PR-queue watcher receipt (auto)'
          pr-title: 'chore(ops): PR-queue watcher receipt (auto)'
          pr-body: |
            Generated by `.github/workflows/pr-queue-watch.yml`.

            This is the dated liveness receipt `scripts/ci/check_pr_queue_watch.py`
            grades on every PR. Read `generated_at`, never the cron expression.
          verify-merged: 'true'

      - name: Watch the MANAGER STATE that needs no MCP
        # THE REPO-ANCHORED HALF OF THE MANAGER QUEUE WATCH.
        #
        # Operator direction 2026-09-03: "I don't think it's a good idea for that
        # mechanism to rely on having another routine session running. It would be
        # better if we can hard code that into the repo or the VM instead."
        #
        # ⚠️ PART OF IT CAN MOVE HERE AND PART OF IT PROVABLY CANNOT, and the
        # split is stated rather than engineered around. Session LIVENESS needs
        # `list_sessions`, an mcp__* tool CI does not hold -- `queue_latency.py`
        # reports `unknown` permanently for exactly that reason. What DOES move is
        # everything answerable from committed files: a lease held but no longer
        # heartbeated, and registry rows asserting live work long past their spawn.
        # Those now run on a clock nothing can forget, beside the PR-quiescence
        # half this workflow already owned.
        #
        # ⚠️ IT REPORTS AND DOES NOT FAIL THE JOB, DELIBERATELY. The escalation
        # channel here is latched (band + cooldown) precisely because 202 of 376
        # CRITICALs in one measured window were a single un-latched alarm. Adding a
        # SECOND, un-latched failure path would page on a standing condition every
        # 6h and train the operator past the channel -- the exact defect this
        # workflow's own header warns about. Its findings are printed in the run and
        # annotated; wiring them into the latched channel is deliberately left as a
        # separate decision rather than smuggled in here.
        continue-on-error: true
        run: |
          set +e
          # ⚠️ THIS STEP DELIBERATELY DOES NOT SPELL THE ASSESS STEP'S CAPTURE
          # TOKEN, and neither does this comment.
          # `check_pr_queue_watch.py` asserts that token appears EXACTLY ONCE in
          # this file, so the assess step's not-a-pipeline capture cannot be
          # diluted by a second match. It is a SUBSTRING test, so a merely
          # different PREFIX still collides (a first attempt here used one and
          # broke the guard, which caught it). `_rc` shares no substring with it,
          # and naming the token even inside a comment would break it again.
          # The invariant is kept intact rather than loosened.
          python3 scripts/ops/manager_state_watch.py > /tmp/manager-state.txt 2>&1
          mstate_rc=$?
          cat /tmp/manager-state.txt
          case "$mstate_rc" in
            0) echo "::notice::Manager state is clean on every repo-answerable check." ;;
            3) echo "::warning::MANAGER-STATE FINDINGS -- see the output above. REPORTED, not escalated: adding a second un-latched paging path is how 202 of 376 CRITICALs became one ignored alarm." ;;
            4) echo "::warning::MANAGER-STATE UNKNOWN -- a register could not be read. This is NOT a clean manager state." ;;
            *) echo "::warning::unexpected exit code $mstate_rc from manager_state_watch.py" ;;
          esac

      - name: Report the verdict
        # ⚠️ FAILING THE JOB IS THE ESCALATION CHANNEL. A cron'd run that dies or
        # fails is picked up by `claude-run-failure-alert.yml` and reaches the
        # operator -- deliberately the OPERATOR and not the manager, because when
        # the manager IS the bottleneck a notification routed to the manager is
        # one more thing the failing component has to notice.
        #
        # ⚠️ AND IT ONLY FAILS WHEN THE PAGE IS DUE. The watcher's band/cooldown
        # latch decides that, so a standing backlog does not fail every 6h --
        # 202 of 376 CRITICALs in one measured window here were a single
        # un-latched alarm, and that trained the operator past the channel.
        run: |
          cat /tmp/digest.txt
          case "${{ steps.assess.outputs.code }}" in
            0) echo "::notice::PR queue is quiet." ;;
            3) echo "::error::PR-QUEUE ESCALATION -- open PRs are waiting on a merge decision past the threshold. See the digest above and docs/claude/work/PR-QUEUE-WATCH.json."; exit 1 ;;
            4) echo "::error::PR-QUEUE WATCHER COULD NOT LOOK -- the open-PR list was unreadable. This is NOT an empty queue; the sensor is blind and that is a defect."; exit 1 ;;
            *) echo "::error::unexpected exit code from pr_queue_latency.py"; exit 1 ;;
          esac

      - name: Report the BLOCKED-LANE verdict
        # ⚠️ `always()` so this can neither be skipped by the PR-queue
        # escalation above nor mask it. Two independent alarms, two independent
        # reports.
        #
        # ⚠️ AND UNLIKE THE MANAGER-STATE STEP, THIS ONE IS ALLOWED TO FAIL THE
        # JOB, because the objection that step records does not apply to it.
        # That step reports rather than escalating precisely because it is
        # UN-LATCHED, and a second un-latched path would page on a standing
        # condition every 6h — which is how 202 of 376 CRITICALs in one measured
        # window became a single ignored alarm. This alarm IS latched, durably,
        # in the receipt that just landed: a blocker pages ONCE, on the run that
        # first grades it cleared. A standing condition is therefore silent by
        # construction, so the fatigue argument does not transfer.
        if: always()
        run: |
          case "${{ steps.lanes.outputs.rc }}" in
            0) echo "::notice::Blocked-lane watch: nothing new. ⚠️ NOT 'no lane is stuck' — a lane that declared no blocker is invisible to this sweep." ;;
            3) echo "::error::BLOCKED-LANE WAKE DUE — a lane is waiting for something that has already happened, or for something nothing can grade. See the step log and docs/claude/work/BLOCKED-LANE-WATCH.json, then fire_trigger a poke-only Routine bound to each session listed."; exit 1 ;;
            4) echo "::error::BLOCKED-LANE WATCH COULD NOT READ THE REGISTER — this is NOT an empty roster, the sensor is blind and that is a defect."; exit 1 ;;
            # ⚠️ There is deliberately no `2)` arm. THIS step invokes the watcher
            # WITHOUT `--self-test`, and on that path `main()` returns 0, 3 or 4 and
            # nothing else; the self-test moved to the shared self-test step, which
            # fails the whole job loudly and long before this. An arm naming a cause
            # no code path can produce is the unprovenanced-diagnostic class this
            # repo has a guard for -- `*)` below catches the unexpected, loudly.
            # ⚠️ CORRECTED 2026-09-11: this comment read "`main()` returns 0, 3 or 4
            # and NOTHING else", which is FALSE of `main()` and true only of the call
            # THIS step makes. `main()` returns `_self_test()` when `--self-test` is
            # passed, and that returns 1 on failure. MEASURED, not read: a policy
            # break was planted into CLEARS_WHEN_BY_KIND and `main(["--self-test"])`
            # returned 1. That is precisely why `*)` must stay -- restore
            # `--self-test` to this step and rc=1 becomes reachable here, where no
            # named arm would catch it.
            "") echo "::warning::blocked-lane watch did not run (its step was skipped or died before reporting). That is 'we did not look', not a clean roster." ;;
            *) echo "::error::unexpected exit code '${{ steps.lanes.outputs.rc }}' from blocked_lane_watch.py"; exit 1 ;;
          esac
