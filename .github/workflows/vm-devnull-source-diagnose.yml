name: vm-devnull-source-diagnose
# Identify (and set up to identify) WHAT strips /dev/null's write bit on the
# live trader VM — the recurring perms-regression source behind the
# ict-devnull-guard self-heal (BL-20260629-DEVNULL-OCI-SOURCE-KILL / RISK-4).
#
# The guard (ict-devnull-guard.timer) keeps us resilient by re-asserting
# /dev/null = char(1,3) mode 0666 every 60s, but it treats the SYMPTOM. This
# workflow gathers the EVIDENCE needed to kill the cause, replacing the
# long-standing "suspected oracle-cloud-agent oci-wlp / Cloud Guard FIM" guess
# with a definitive attribution.
#
# Three modes (issue body line `mode: <x>`; default `inspect`):
#   inspect     READ-ONLY. Dump the oracle-cloud-agent unit/plugin list +
#               config + logs (grepped for dev/null / remediat / world-writable),
#               the current /dev/null state, and any auditd rules/events already
#               present. Zero mutation. Often enough on its own — an agent that
#               remediates world-writable files logs what it "fixed".
#   arm-audit   Tier-2 MUTATION. Install auditd if absent, then install a
#               PERSISTENT watch rule (/etc/audit/rules.d/devnull.rules:
#               `-w /dev/null -p wa -k devnull`) + load it, so the NEXT flip is
#               captured with the acting pid/exe/comm. Survives reboot.
#   read-audit  READ-ONLY. `ausearch -k devnull -i` — report captured chmod
#               events. The CULPRIT is whatever SYSCALL sets mode 0444 (strips
#               the write bit); the guard's own 0666 restores are expected noise,
#               distinguishable by the mode argument + exe (the guard oneshot).
#   udev-watch  READ-ONLY, BOUNDED LIVE CAPTURE (~5 min). Rounds 5-7 of read-audit
#               (2026-07-14) found ZERO chmod/fchmod/fchmodat/fchmodat2/setxattr/
#               mount syscalls at the moment of a strip, on both auditd's own log
#               AND the journald audit transport — the mode-strip mechanism is
#               invisible to every syscall class audited so far. This mode polls
#               `stat -c %a /dev/null` every 0.5s while concurrently streaming
#               `udevadm monitor --udev --kernel` for up to 295s, so a captured
#               mode-change timestamp can be correlated against whether a kernel/
#               udev device-recreation event fired in the same window (the
#               remaining untried hypothesis — a udev coldplug/hotplug re-trigger
#               recreating the node with a rule-default mode, which wouldn't show
#               as a userspace chmod syscall at all). No mutation, no rule
#               installed — pure observation for the duration of one job run.
#   fanotify-arm  Tier-2. ROUND 8 (2026-08-02): after oci-wlp was EXONERATED (disabled+
#               exited, no reboot, clobber still recurs) and every b64 chmod syscall rule
#               stayed silent across 7 rounds, install + start a read-only fanotify
#               FAN_ATTRIB watcher on /dev/null as a resource-capped transient systemd
#               unit. fanotify fires at the VFS notify_change layer that EVERY mode change
#               funnels through (incl. a compat/b32 chmod a b64 audit rule can't see) and
#               reports the culprit's TGID — the one net not yet tried. Names pid/comm/exe.
#   fanotify-read READ-ONLY. Dump the watcher status + captured attribute-change events +
#               the guard restores in the same window (correlate a 0666 restore ⇒ a strip).
#   fanotify-disarm Tier-2. Stop + remove the watcher (log kept). Run once the culprit is named.
#
# Blast radius: `inspect`/`read-audit`/`udev-watch`/`fanotify-read` touch nothing.
# `arm-audit` installs the auditd package (a standard, lightweight daemon) + one
# narrow watch rule on a single inode. `fanotify-arm` (round 8, 2026-08-02) installs
# one read-only Python watcher (scripts/ops/devnull_attrib_watch.py) + runs it as a
# resource-capped TRANSIENT systemd unit (CPUQuota 5%, MemoryMax 64M, Nice 19) that
# blocks on fanotify FAN_ATTRIB for /dev/null and logs the acting pid/comm/exe on any
# mode change — no /dev/null mutation, no trade path, no other unit; `fanotify-disarm`
# stops + removes it. All Tier-2 arm/disarm actions are operator-approved. Fixed-form
# remote script.
#
# Trigger: workflow_dispatch (mode input), or an issue labeled
# `vm-devnull-diagnose` (mode parsed from the body, default inspect).
# Secrets: VM_SSH_KEY. inspect/read-audit/udev-watch are Tier-1 (read-only,
# bounded); arm-audit is Tier-2 (operator-approved — a package install + daemon
# on the live VM).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect | arm-audit | read-audit | udev-watch | fanotify-arm | fanotify-read | fanotify-disarm | bpftrace-arm | bpftrace-read | bpftrace-disarm'
        required: false
        default: 'inspect'
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: vm-devnull-source-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'vm-devnull-diagnose'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VM_SSH_HOST: ${{ vars.VM_SSH_HOST || '141.145.193.91' }}
      VM_SSH_USER: ${{ vars.VM_SSH_USER || 'ubuntu' }}
    steps:
      - name: Checkout (needed to copy the fanotify watcher script)
        uses: actions/checkout@v4

      - name: Dedup — bail if a bot comment already exists
        if: github.event_name == 'issues'
        id: dedup
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            core.setOutput('skip',
              comments.some(c => c.user && c.user.login === 'github-actions[bot]') ? 'true' : 'false');

      - name: Resolve mode
        if: steps.dedup.outputs.skip != 'true'
        id: mode
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          MODE="inspect"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MODE="${DISPATCH_MODE:-inspect}"
          else
            # Parse a `mode: <x>` line from the (untrusted) issue body via env — never inline-interpolated.
            PARSED="$(printf '%s' "${ISSUE_BODY:-}" | grep -iE '^[[:space:]]*mode:' | head -1 | sed -E 's/^[[:space:]]*[Mm][Oo][Dd][Ee]:[[:space:]]*//' | tr -d '\r' | tr '[:upper:]' '[:lower:]' | awk '{print $1}')"
            [ -n "${PARSED}" ] && MODE="${PARSED}"
          fi
          case "${MODE}" in
            inspect|arm-audit|read-audit|udev-watch|fanotify-arm|fanotify-read|fanotify-disarm|bpftrace-arm|bpftrace-read|bpftrace-disarm) : ;;
            *) echo "::error::unknown mode '${MODE}' (want inspect|arm-audit|read-audit|udev-watch|fanotify-arm|fanotify-read|fanotify-disarm|bpftrace-arm|bpftrace-read|bpftrace-disarm)"; exit 1 ;;
          esac
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: ${MODE}"

      - name: Set up SSH key
        if: steps.dedup.outputs.skip != 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -z "${VM_SSH_KEY}" ] && { echo "::error::VM_SSH_KEY unset"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa,ecdsa,ed25519 "${VM_SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy fanotify watcher to VM (fanotify-arm only)
        if: steps.dedup.outputs.skip != 'true' && steps.mode.outputs.mode == 'fanotify-arm'
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 scripts/ops/devnull_attrib_watch.py \
              "${VM_SSH_USER}@${VM_SSH_HOST}:/tmp/devnull_attrib_watch.py"
          echo "copied watcher to /tmp/devnull_attrib_watch.py on the VM"

      - name: Diagnose on the VM
        if: steps.dedup.outputs.skip != 'true'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # MODE is validated against a fixed allowlist above (inspect|arm-audit|read-audit|udev-watch|
          # fanotify-arm|fanotify-read|fanotify-disarm|bpftrace-arm|bpftrace-read|bpftrace-disarm), so interpolating it into the remote command is
          # injection-free (not from the issue body).
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 "${VM_SSH_USER}@${VM_SSH_HOST}" "MODE='${MODE}' bash -s" > out.txt 2>&1 <<'REMOTE' || true
          set +e
          MODE="${MODE:-inspect}"
          echo "===== mode: ${MODE} ====="
          echo "===== /dev/null state now ====="
          ls -l /dev/null; stat -c 'inode=%i type=%F mode=%a major:minor=%t:%T' /dev/null 2>/dev/null

          if [ "${MODE}" = "inspect" ]; then
            echo; echo "===== oracle-cloud-agent units ====="
            systemctl list-units --all --no-legend --no-pager 2>/dev/null | grep -iE 'oracle|oci|wlp|cloud-agent|osms|cloud-guard' || echo "(no matching units)"
            echo; echo "===== oracle-cloud-agent plugins (snapshot.d / config) ====="
            for d in /etc/oracle-cloud-agent /var/lib/oracle-cloud-agent /etc/osms /opt/oracle-cloud-agent; do
              [ -e "$d" ] && { echo "--- $d ---"; sudo ls -la "$d" 2>/dev/null; }
            done
            echo; echo "===== agent config mentioning FIM / remediation / world-writable ====="
            sudo grep -rIiEl 'remediat|world.?writable|file.?integrity|/dev/null|permission' /etc/oracle-cloud-agent /var/lib/oracle-cloud-agent /opt/oracle-cloud-agent 2>/dev/null | head -20
            echo; echo "===== agent logs referencing /dev/null or a perms remediation (last hits) ====="
            for L in /var/log/oracle-cloud-agent /var/log/osms; do
              [ -d "$L" ] || continue
              echo "--- ${L} tree ---"; sudo ls -la "$L" 2>/dev/null | head -40
              echo "--- grep dev/null|remediat|0444|world-writable in ${L} ---"
              sudo grep -rIiE 'dev/null|remediat|0444|world.?writable|chmod' "$L" 2>/dev/null | tail -40
            done
            echo; echo "===== auditd present? existing devnull rule/events? ====="
            command -v auditctl >/dev/null 2>&1 && echo "auditctl: present" || echo "auditctl: ABSENT (arm-audit will install)"
            sudo auditctl -l 2>/dev/null | grep -i devnull || echo "(no devnull audit rule yet)"
            [ -f /etc/audit/rules.d/devnull.rules ] && { echo "--- /etc/audit/rules.d/devnull.rules ---"; sudo cat /etc/audit/rules.d/devnull.rules; }
            echo; echo "===== ict-devnull-guard recent journal (correlate its 0666 restores) ====="
            sudo journalctl -u ict-devnull-guard.service --no-pager -n 20 2>/dev/null || echo "(no guard journal)"
            # ROUND 8 (2026-08-02, BL re-opened): the 2026-07-28 "culprit = oci-wlp" was
            # circumstantial + the console-disable regressed (clobber recurred on the
            # 2026-08-02 deploy). Capture the DECISIVE state the earlier inspect missed:
            # is a workload-protection/FIM plugin actually enabled+running NOW, did the
            # box reboot (a reboot re-enables a console-disabled plugin), and what is the
            # snap confinement (a strict snap can't chmod the HOST /dev/null; classic can).
            echo; echo "===== uptime / last boot (a reboot re-enables a console-disabled OCA plugin) ====="
            uptime -p 2>/dev/null; echo "boot: $(uptime -s 2>/dev/null)"; who -b 2>/dev/null || true
            echo; echo "===== OCA desired plugin state (agent.yml) ====="
            sudo cat /etc/oracle-cloud-agent/agent.yml 2>/dev/null || echo "(agent.yml unreadable)"
            echo; echo "===== OCA installed/enabled plugin dirs ====="
            echo "--- /etc/oracle-cloud-agent/plugins ---"; sudo ls -la /etc/oracle-cloud-agent/plugins 2>/dev/null
            echo "--- /var/lib/oracle-cloud-agent/plugins ---"; sudo ls -la /var/lib/oracle-cloud-agent/plugins 2>/dev/null
            echo "--- /var/log/oracle-cloud-agent/plugins (which plugins have logged) ---"; sudo ls -la /var/log/oracle-cloud-agent/plugins 2>/dev/null
            echo; echo "===== RUNNING processes that could remediate a device node (wlp/fim/workload/falcon/scan/osquery) ====="
            ps -eo pid,ppid,user,comm,args 2>/dev/null | grep -iE 'wlp|hostfim|fim|workload|falcon|osquery|hostscan|clamav|scan|remediat' | grep -v grep || echo "(no FIM/scan/workload-protection process running)"
            echo; echo "===== snap confinement (classic ⇒ sees HOST /dev/null; strict ⇒ private /dev) ====="
            snap list oracle-cloud-agent 2>/dev/null || echo "(snap list failed)"
            snap connections oracle-cloud-agent 2>/dev/null | grep -iE 'system-files|mount-control|hardware-observe|kernel-module|system-backup|classic' || echo "(no broad interfaces / not classic)"
            grep -E '^confinement:' /snap/oracle-cloud-agent/current/meta/snap.yaml 2>/dev/null || sudo grep -E '^confinement:' /var/lib/snapd/snaps/*oracle-cloud-agent*/meta/snap.yaml 2>/dev/null || echo "(confinement unknown)"
            echo; echo "===== OCA agent.log: oci-wlp / workload-protection / plugin start-stop references ====="
            sudo zgrep -hiE 'oci-wlp|workload.?protection|hostfim|Cloud Guard' /var/log/oracle-cloud-agent/agent*.log* 2>/dev/null | tail -25 || echo "(no oci-wlp / workload-protection references in agent logs)"
            echo; echo "===== OCA agent.log: plugin lifecycle / remediation lines (any time) ====="
            sudo grep -hiE 'plugin|remediat|enable|disable|start|stop' /var/log/oracle-cloud-agent/agent.log 2>/dev/null | grep -iE 'wlp|workload|fim|remediat|enabl|disabl|starting plugin|stopping plugin' | tail -30 || echo "(no plugin-lifecycle/remediation lines in agent.log)"
            echo; echo "===== other schedulers that touch /dev or run hardening (cron/timers/tmpfiles) ====="
            sudo ls -la /etc/cron.d /etc/cron.daily /etc/cron.hourly 2>/dev/null | grep -iE 'dev|perm|hard|cis|scan|oci' || echo "(no suspicious cron entries)"
            systemctl list-timers --all --no-pager 2>/dev/null | grep -iE 'oci|oracle|cloud|scan|fim|tmpfiles|hard' || echo "(no suspicious timers)"
            grep -rIiE '/dev/null|/dev ' /usr/lib/tmpfiles.d /etc/tmpfiles.d 2>/dev/null | grep -v '^#' | head -10 || echo "(no tmpfiles.d entries touching /dev)"

          elif [ "${MODE}" = "arm-audit" ]; then
            echo; echo "===== ensure auditd installed ====="
            if ! command -v auditctl >/dev/null 2>&1; then
              echo "installing auditd..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y auditd audispd-plugins && echo "auditd: installed" || echo "auditd: INSTALL FAILED"
            else
              echo "auditd already present"
            fi
            echo; echo "===== install persistent watch rule ====="
            sudo mkdir -p /etc/audit/rules.d
            # ROUND 6 (2026-07-14): the -w/-p wa watch verifiably does NOT
            # capture chmod on this kernel — the guard's own chmod-0666 heals
            # at known timestamps (guard journal) produced zero attr records.
            # Add explicit chmod-family SYSCALL rules (aarch64 has only
            # fchmod/fchmodat) pinned to /dev/null under a separate key so the
            # culprit of the recurring chmod-644 strips is named directly.
            # ROUND 7 (2026-07-14): two post-arming strip windows produced ZERO
            # fchmod/fchmodat/setxattr captures — the change rides a syscall
            # those rules don't cover. Add fchmodat2 (aarch64 #452, kernel
            # >=6.6 — this box runs an HWE kernel; modern Go/coreutils use it)
            # by NUMBER (older auditctl doesn't know the name).
            printf '%s\n' \
              '## RISK-4 BL-20260629-DEVNULL-OCI-SOURCE-KILL — attribute /dev/null perm strips' \
              '-w /dev/null -p wa -k devnull' \
              '-a always,exit -F arch=b64 -S fchmod,fchmodat -F path=/dev/null -k devnullmode' \
              '-a always,exit -F arch=b64 -S 452 -F path=/dev/null -k devnullmode' \
              '-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr -F path=/dev/null -k devnullmode' \
              | sudo tee /etc/audit/rules.d/devnull.rules >/dev/null
            echo "wrote /etc/audit/rules.d/devnull.rules:"; sudo cat /etc/audit/rules.d/devnull.rules
            sudo systemctl enable --now auditd 2>/dev/null; sudo augenrules --load 2>/dev/null || sudo auditctl -R /etc/audit/rules.d/devnull.rules 2>/dev/null
            echo; echo "===== active rules ====="; sudo auditctl -l 2>/dev/null | grep -i devnull || echo "(rule not active — check auditd)"
            echo "ARMED. Re-run with mode: read-audit after the next flip (guard journal shows a restore ⇒ a flip happened)."

          elif [ "${MODE}" = "read-audit" ]; then
            echo; echo "===== ausearch -k devnull (interpreted) ====="
            command -v ausearch >/dev/null 2>&1 || { echo "ausearch ABSENT — run arm-audit first"; exit 0; }
            sudo ausearch -k devnull -i 2>/dev/null | tail -120 || echo "(no devnull events captured yet — wait for the next flip)"
            # An EMPTY ausearch with the rule loaded (seen 2026-07-14: strip at
            # ~10:15Z under an armed watch, zero events) usually means the
            # auditd DAEMON isn't writing /var/log/audit — the kernel rule
            # matches but records go nowhere ausearch reads. Diagnose why.
            echo; echo "===== why-empty diagnostics ====="
            echo "--- auditd daemon state ---"
            systemctl is-active auditd 2>&1 || true
            sudo systemctl status auditd --no-pager -n 5 2>&1 | head -12
            echo "--- auditctl -s (kernel audit status: enabled flag / lost counter / backlog) ---"
            sudo auditctl -s 2>&1
            echo "--- /var/log/audit ---"
            sudo ls -la /var/log/audit 2>&1 | head -10
            echo "--- journald audit transport (fallback sink when auditd is not writing) ---"
            sudo journalctl _TRANSPORT=audit --no-pager -n 40 -g 'devnull|dev/null' 2>&1 | tail -40 || echo "(no audit records in journald)"
            # THE HUNT (2026-07-14): journald IS capturing keyed devnull events
            # (verified — auditd active, lost=0, yet ausearch reads empty; the
            # transport is the reliable sink). The `-p wa` watch also fires on
            # every WRITE-OPEN of /dev/null, so the log is dominated by openat
            # noise (a3=1b6). The culprit is the chmod-family SYSCALL whose mode
            # arg is 0444 = hex 124 (guard restores are 1b6 — expected noise).
            echo "--- journald: 0444 mode-strip SYSCALLs (a1/a2/a3=124), last 48h ---"
            sudo journalctl _TRANSPORT=audit --since "48 hours ago" --no-pager 2>&1 \
              | grep 'key="devnull"' | grep -E 'a[123]=124\b' | tail -30 \
              || echo "(no 0444 strip events captured in journald window)"
            echo "--- journald: /dev/null node replacement (PATH DELETE/CREATE), last 48h ---"
            sudo journalctl _TRANSPORT=audit --since "48 hours ago" --no-pager 2>&1 \
              | grep 'name="/dev/null"' | grep -E 'nametype=(DELETE|CREATE)' | tail -20 \
              || echo "(no node-replacement events captured)"
            # ROUND 5 (2026-07-14): a strip at 15:11:26Z was re-hunted at 15:13Z —
            # journald transport verifiably live, yet ZERO chmod-124 and ZERO
            # DELETE/CREATE events. The node itself may never change: an EACCES
            # on the redirect's open() can come from PROCESS-CONTEXT denial
            # (device-cgroup DeviceAllow / LSM) rather than a file mutation.
            # The failing opens ARE path events on the watched inode — hunt
            # success=no records (full exe=/ppid=/subj= context of the DENIED
            # process), plus AVC/AppArmor denials, plus a shadow-mount check.
            echo "--- journald: chmod-family syscalls on /dev/null (key=devnullmode), last 48h ---"
            sudo journalctl _TRANSPORT=audit --since "48 hours ago" --no-pager 2>&1 \
              | grep 'key="devnullmode"' | tail -30 \
              || echo "(no devnullmode events — rule not armed yet, or no chmod since arming)"
            echo "--- raw /var/log/audit: devnullmode events ---"
            sudo grep -h 'key="devnullmode"' /var/log/audit/audit.log* 2>/dev/null | tail -30 \
              || echo "(no devnullmode events in raw audit files)"
            echo "--- journald: DENIED opens on /dev/null (success=no, keyed), last 48h ---"
            sudo journalctl _TRANSPORT=audit --since "48 hours ago" --no-pager 2>&1 \
              | grep 'key="devnull"' | grep 'success=no' | tail -40 \
              || echo "(no denied-open events captured — the EACCES may bypass the watch entirely)"
            echo "--- raw /var/log/audit: DENIED keyed events (ausearch is broken; raw grep, ~7.5h retention) ---"
            sudo grep -h 'key="devnull"' /var/log/audit/audit.log* 2>/dev/null | grep 'success=no' | tail -40 \
              || echo "(no denied events in raw audit files)"
            echo "--- raw /var/log/audit: chmod-124 + DELETE/CREATE sweep (belt-and-suspenders vs journald) ---"
            sudo grep -h 'key="devnull"' /var/log/audit/audit.log* 2>/dev/null | grep -E 'a[123]=124\b' | tail -20 \
              || echo "(no 0444 strips in raw audit files)"
            sudo grep -h 'name="/dev/null"' /var/log/audit/audit.log* 2>/dev/null | grep -E 'nametype=(DELETE|CREATE)' | tail -20 \
              || echo "(no node replacement in raw audit files)"
            echo "--- LSM denials (AVC/AppArmor) mentioning dev/null, last 48h ---"
            sudo journalctl --since "48 hours ago" --no-pager 2>&1 \
              | grep -Ei 'apparmor="?denied|avc: *denied' | grep -i 'dev/null' | tail -20 \
              || echo "(no LSM denials on /dev/null)"
            echo "--- shadow-mount check: is anything mounted ON /dev/null? ---"
            grep ' /dev/null ' /proc/mounts || echo "(nothing mounted on /dev/null now)"
            findmnt /dev/null 2>/dev/null || echo "(findmnt: /dev/null is not a mountpoint now)"
            echo "--- journald: mount syscalls touching /dev/null, last 48h ---"
            sudo journalctl _TRANSPORT=audit --since "48 hours ago" --no-pager 2>&1 \
              | grep 'name="/dev/null"' | grep -Ei 'syscall=(40|165|mount)' | tail -10 \
              || echo "(no mount events on /dev/null)"
            echo; echo "===== CULPRIT HINT ====="
            echo "The SYSCALL that sets /dev/null to mode 0444 (0x124, write bit stripped) is the SOURCE."
            echo "Its exe=/comm=/ppid names the process. The guard's own restores set 0666 (0x1b6) — expected noise."
            echo "If mutation hunts stay empty but success=no opens appear: the denial is process-context"
            echo "(device cgroup / LSM), not a file change — check the denied record's subj= and cgroup."

          elif [ "${MODE}" = "udev-watch" ]; then
            echo; echo "===== udev-watch: bounded live capture (~295s) ====="
            echo "Rounds 5-7 of read-audit found ZERO chmod/fchmod/fchmodat/fchmodat2/setxattr/mount"
            echo "syscalls at strip-time on either auditd's own log or the journald audit transport."
            echo "This mode polls /dev/null's mode every 0.5s while concurrently streaming"
            echo "'udevadm monitor --udev --kernel' so a captured mode-change can be correlated"
            echo "against a kernel/udev device-recreation event. Pure observation, no mutation."
            echo "--- BEFORE: /dev/null state ---"
            stat -c 'mode=%a major:minor=%t:%T' /dev/null
            UDEV_LOG="/tmp/udev_capture_$$.log"
            timeout 300 udevadm monitor --udev --kernel > "${UDEV_LOG}" 2>&1 &
            MONPID=$!
            PREV_MODE="$(stat -c '%a' /dev/null 2>/dev/null)"
            echo "starting mode: ${PREV_MODE}"
            START_TS=$(date +%s)
            while [ $(( $(date +%s) - START_TS )) -lt 295 ]; do
              CUR_MODE="$(stat -c '%a' /dev/null 2>/dev/null)"
              if [ "${CUR_MODE}" != "${PREV_MODE}" ]; then
                echo "$(date -u +%Y-%m-%dT%H:%M:%S.%NZ) MODE CHANGE: ${PREV_MODE} -> ${CUR_MODE}"
                PREV_MODE="${CUR_MODE}"
              fi
              sleep 0.5
            done
            wait "${MONPID}" 2>/dev/null
            echo "--- udevadm monitor output (--udev --kernel, full window) ---"
            cat "${UDEV_LOG}" 2>/dev/null || echo "(no udev capture output)"
            rm -f "${UDEV_LOG}"
            echo "--- AFTER: /dev/null state ---"
            stat -c 'mode=%a major:minor=%t:%T' /dev/null
            echo; echo "===== CORRELATION HINT ====="
            echo "If a MODE CHANGE line has NO matching UDEV/KERNEL event within a second or two of"
            echo "its timestamp, the strip is not udev-driven either — narrows further to a direct"
            echo "syscall this box's audit transport still isn't recording, or process-context denial."

          elif [ "${MODE}" = "fanotify-arm" ]; then
            # ROUND 8 (2026-08-02, BL-20260629 reopened after oci-wlp EXONERATED): every b64
            # chmod-family SYSCALL rule captured nothing across 7 rounds, and the previously-blamed
            # FIM plugin is disabled+exited. fanotify FAN_ATTRIB fires at the VFS notify_change layer
            # — the funnel EVERY mode change passes through, incl. a compat/b32 chmod a b64 audit rule
            # can't see — and reports the culprit's TGID. Install the (scp'd) watcher + run it as a
            # bounded, resource-capped TRANSIENT systemd unit (no repo unit file, no reboot survival —
            # this is a temporary diagnostic soak, disarmed once it names the culprit). Tier-2:
            # installs one script + runs one read-only observing process; NO trade path, NO mutation
            # of /dev/null, NO other unit.
            echo; echo "===== fanotify-arm: install + start the /dev/null attribute watcher ====="
            [ -f /tmp/devnull_attrib_watch.py ] || { echo "ERROR: /tmp/devnull_attrib_watch.py not present (scp step failed)"; echo "(done)"; exit 0; }
            sudo install -m 0755 /tmp/devnull_attrib_watch.py /usr/local/bin/devnull_attrib_watch.py && rm -f /tmp/devnull_attrib_watch.py
            echo "installed /usr/local/bin/devnull_attrib_watch.py:"; sudo ls -l /usr/local/bin/devnull_attrib_watch.py
            # Idempotent: stop any prior instance first so a re-arm never stacks two watchers.
            sudo systemctl reset-failed ict-devnull-attrib-watch.service 2>/dev/null || true
            sudo systemctl stop ict-devnull-attrib-watch.service 2>/dev/null || true
            PY="$(command -v python3 || echo /usr/bin/python3)"
            sudo systemd-run --unit=ict-devnull-attrib-watch --collect \
              --property=Description='ICT round-8 /dev/null fanotify attribute watcher (BL-20260629, diagnostic soak)' \
              --property=Restart=on-failure --property=RestartSec=5 \
              --property=Nice=19 --property=CPUQuota=5% --property=MemoryMax=64M \
              --setenv=DEVNULL_ATTRIB_LOG=/var/log/ict-devnull-attrib.jsonl \
              "${PY}" /usr/local/bin/devnull_attrib_watch.py
            sleep 2
            echo; echo "===== watcher unit status ====="
            sudo systemctl --no-pager --full status ict-devnull-attrib-watch.service 2>&1 | head -20
            echo; echo "===== watcher log (startup line proves fanotify armed) ====="
            sudo tail -5 /var/log/ict-devnull-attrib.jsonl 2>/dev/null || echo "(no log yet)"
            echo; echo "ARMED. It blocks on fanotify (~0 CPU) until /dev/null's mode changes, then logs the acting pid+comm+exe."
            echo "Re-run mode: fanotify-read after the next clobber (guard journal shows a 0666 restore ⇒ a strip happened)."
            echo "Disarm with mode: fanotify-disarm once the culprit is named."

          elif [ "${MODE}" = "fanotify-read" ]; then
            echo; echo "===== fanotify-read: watcher status + captured attribute-change events ====="
            sudo systemctl --no-pager --full status ict-devnull-attrib-watch.service 2>&1 | head -15
            echo; echo "===== /var/log/ict-devnull-attrib.jsonl (all captured events) ====="
            sudo cat /var/log/ict-devnull-attrib.jsonl 2>/dev/null || echo "(no watcher log — is it armed? run fanotify-arm)"
            echo; echo "===== ict-devnull-guard restores in the same window (correlate: a 0666 restore ⇒ a strip preceded it) ====="
            sudo journalctl -u ict-devnull-guard.service --no-pager -n 15 2>/dev/null || echo "(no guard journal)"
            echo; echo "===== CULPRIT HINT ====="
            echo "An 'attrib_change' whose devnull_after.mode is NOT 0o666 (e.g. 0o644/0o444) is the STRIP — its"
            echo "proc.comm/exe/pid/parent_comm NAMES the mutator. A 0o666 event is the guard's own restore (noise)."
            echo "If the guard journal shows a restore but the watcher logged NO strip event, the change bypasses the"
            echo "VFS notify path entirely ⇒ kernel-internal/devtmpfs mechanism, not a userspace process."

          elif [ "${MODE}" = "fanotify-disarm" ]; then
            echo; echo "===== fanotify-disarm: stop + remove the watcher (log kept for the record) ====="
            sudo systemctl stop ict-devnull-attrib-watch.service 2>/dev/null && echo "stopped ict-devnull-attrib-watch.service" || echo "(unit not running)"
            sudo systemctl reset-failed ict-devnull-attrib-watch.service 2>/dev/null || true
            sudo rm -f /usr/local/bin/devnull_attrib_watch.py && echo "removed /usr/local/bin/devnull_attrib_watch.py"
            echo "watcher log at /var/log/ict-devnull-attrib.jsonl is left in place (read it with fanotify-read first if needed)."
            echo; echo "final /dev/null state:"; stat -c 'mode=%a inode=%i' /dev/null

          elif [ "${MODE}" = "bpftrace-arm" ]; then
            # ROUND 9 (2026-08-02, operator-approved): the fanotify soak proved the strip is a userspace
            # chmod-to-0644 correlated with deploys, but pid-reuse during the deploy's own rapid chmod burst
            # made the fanotify pid untrustworthy for naming the EXACT actor. bpftrace reads comm/pid/uid
            # SYNCHRONOUSLY in the acting task at syscall entry — zero pid-reuse ambiguity (the exact gap
            # fanotify left). Round 9b uses SYSCALL TRACEPOINTS (chmod/fchmodat/fchmodat2 filtered to the
            # path "/dev/null") not kprobes: bpftrace 0.14.0 on this VM cannot resolve the kernel struct
            # casts a notify_change/security_path_chmod kprobe needs, but tracepoint args are typed by the
            # kernel's own format and compile cleanly. Read-only trace; Tier-2 (bpftrace install + one
            # transient tracepoint unit). Decisive both ways: a captured path line names the mutator; a
            # confirmed strip with NO captured line proves it is not a path-chmod syscall (kernel-internal).
            echo; echo "===== bpftrace-arm: install bpftrace + start the /dev/null chmod tracer ====="
            if ! command -v bpftrace >/dev/null 2>&1; then
              echo "installing bpftrace..."
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y bpftrace && echo "bpftrace: installed" || { echo "bpftrace: INSTALL FAILED"; echo "(done)"; exit 0; }
            else
              echo "bpftrace already present: $(bpftrace --version 2>&1 | head -1)"
            fi
            [ -r /sys/kernel/btf/vmlinux ] && echo "BTF: present (/sys/kernel/btf/vmlinux)" || echo "BTF: ABSENT"
            echo "kernel: $(uname -r)"
            # ROUND 9b (2026-08-02): the kprobe form (round 9a) FAILED to compile on this VM's bpftrace 0.14.0
            #   — "Unknown struct/union: 'struct dentry'/'struct iattr'" (0.14's BTF struct-cast resolution is
            #   incomplete). Switch to SYSCALL TRACEPOINTS: their args are typed by the kernel's own tracepoint
            #   format, so NO struct casts / BTF resolution are needed and it compiles on 0.14. Coreutils
            #   chmod / install / GNU / python os.chmod all issue fchmodat(AT_FDCWD,"/dev/null",mode), so we
            #   filter by the path STRING "/dev/null" and read comm/pid/uid IN the acting task at syscall entry
            #   — zero pid-reuse ambiguity (the exact gap the fanotify soak left). Each tracepoint is included
            #   only if the kernel exposes it, so a missing one can never break the compile.
            # ROUND 9b-fix2 (2026-08-02): enumerate available tracepoints via `bpftrace -l` (run under sudo)
            #   NOT by stat-ing /sys/kernel/debug/tracing — debugfs is drwx------ root, so an unprivileged
            #   `[ -d ]` always false-negatives (round-9b arm hit "no tracepoints exposed" for exactly this).
            #   bpftrace -l is mount-path- and privilege-agnostic: if it lists a probe, attach works. It also
            #   naturally omits the legacy `chmod` syscall, which does NOT exist on arm64 (only fchmodat/
            #   fchmodat2/fchmod) — emitting it unconditionally would error the whole program.
            AVAIL=$(sudo bpftrace -l 'tracepoint:syscalls:sys_enter_*chmod*' 2>/dev/null || true)
            echo; echo "----- chmod-family tracepoints bpftrace can see -----"; echo "${AVAIL:-(none)}"
            BT=/usr/local/bin/devnull_chmod_trace.bt
            {
              echo '// devnull_chmod_trace.bt — BL-20260629: name the process that chmods /dev/null (by path).'
              echo 'BEGIN { printf("devnull_chmod_trace armed %s\n", strftime("%Y-%m-%dT%H:%M:%SZ", nsecs)); }'
              # path-based chmod syscalls: filter to the exact target string.
              # ROOT CAUSE (round 9b-fix5, live-confirmed #8386): on bpftrace 0.14.0 the tracepoint `args`
              # builtin is a POINTER, so fields MUST be read with `args->field` (arrow), NOT `args.field`
              # (dot — the dot syntax was added in a later bpftrace release). Every earlier round used dot
              # and failed identically ("access field on ...* — use '->'" / str() got nothing); bpftrace
              # surfaces the error on only the LAST probe and aborts, which is why dropping probes made the
              # error appear to "move" (chmod->fchmod->fchmodat2->fchmodat) and looked like a per-syscall
              # limitation — it was the shared dot-vs-arrow bug the whole time. Arrow fixes all of them, so
              # fchmodat2 is back in the list. `chmod` covers x86 (bpftrace -l filters it out on arm64).
              for tp in chmod fchmodat fchmodat2; do
                if printf '%s\n' "$AVAIL" | grep -qx "tracepoint:syscalls:sys_enter_$tp"; then
                  echo "// sys_enter_$tp(..., filename, mode) — coreutils chmod/install/os.chmod path here"
                  echo "tracepoint:syscalls:sys_enter_$tp /str(args->filename) == \"/dev/null\"/ {"
                  echo "  printf(\"%s $tp /dev/null mode(dec)=%d comm=%s pid=%d uid=%d\\n\", strftime(\"%H:%M:%S\", nsecs), args->mode & 0777, comm, pid, uid);"
                  echo '}'
                fi
              done
              # NOTE: an fd-based sys_enter_fchmod probe was DROPPED (round 9b-fix3, 2026-08-02). bpftrace
              # 0.14.0 resolves sys_enter_fchmod's args as a raw pointer (not the struct the path tracepoints
              # give), so `args.fd`/`args.mode` fail to compile ("access field on ... * — use '->'") and take
              # the whole program down with them (live-confirmed, issue #8379). It was only a marginal net
              # (fd-based, could not even confirm the target was /dev/null). The path-based fchmodat/fchmodat2
              # probes above ARE the attribution net: coreutils chmod / install / os.chmod("/dev/null") all
              # issue fchmodat(AT_FDCWD,"/dev/null",mode) — exactly the fanotify-observed comm=chmod suspect.
              # Consequence for the decisive-negative read: a confirmed strip with NO captured line now means
              # "not a path-chmod syscall" INCLUDING the (unlikely) fd-based-fchmod case, still a useful result.
            } | sudo tee "$BT" >/dev/null
            echo; echo "----- generated $BT -----"; sudo cat "$BT"
            if ! grep -q 'tracepoint:' "$BT"; then
              echo "ERROR: bpftrace lists no chmod-family syscall tracepoints — cannot arm. Diagnostics:"
              echo "--- tracefs/debugfs mounts ---"; grep -E 'tracefs|debugfs' /proc/mounts || echo "(neither tracefs nor debugfs mounted — tracepoints unusable; would need a kprobe fallback)"
              echo "--- bpftrace -l for chmod/fchmod (raw) ---"; sudo bpftrace -l 'tracepoint:syscalls:sys_enter_fchmod*' 2>&1 | head -8 || true
              echo "(done)"; exit 0
            fi
            sudo systemctl reset-failed ict-devnull-bpftrace.service 2>/dev/null || true
            sudo systemctl stop ict-devnull-bpftrace.service 2>/dev/null || true
            sudo systemd-run --unit=ict-devnull-bpftrace --collect \
              --property=Description='ICT round-9 /dev/null chmod bpftrace tracer (BL-20260629, diagnostic soak)' \
              --property=Restart=on-failure --property=RestartSec=10 \
              --property=Nice=19 --property=MemoryMax=256M \
              /bin/sh -c "exec bpftrace ${BT} >> /var/log/ict-devnull-bpftrace.log 2>&1"
            sleep 3
            echo; echo "===== tracer unit status ====="
            sudo systemctl --no-pager --full status ict-devnull-bpftrace.service 2>&1 | head -18
            echo; echo "===== tracer log (an 'armed' line proves the kprobe attached) ====="
            sudo tail -8 /var/log/ict-devnull-bpftrace.log 2>/dev/null || echo "(no log yet — bpftrace may still be compiling the probe)"
            echo; echo "ARMED. Re-run mode: bpftrace-read after the next deploy strip (guard journal shows a 0666 restore ⇒ a strip happened)."

          elif [ "${MODE}" = "bpftrace-read" ]; then
            echo; echo "===== bpftrace-read: tracer status + captured /dev/null chmod events ====="
            sudo systemctl --no-pager --full status ict-devnull-bpftrace.service 2>&1 | head -12
            echo; echo "===== /var/log/ict-devnull-bpftrace.log (every chmod that hit /dev/null, kernel-context) ====="
            sudo cat /var/log/ict-devnull-bpftrace.log 2>/dev/null || echo "(no tracer log — is it armed? run bpftrace-arm)"
            echo; echo "===== ict-devnull-guard restores in the same window (correlate a 0666 restore ⇒ a strip preceded it) ====="
            sudo journalctl -u ict-devnull-guard.service --no-pager -n 12 2>/dev/null || echo "(no guard journal)"
            echo; echo "===== CULPRIT HINT ====="
            echo "Each line is captured IN the kernel at syscall entry (no pid-reuse): comm/pid/uid = the exact"
            echo "mutator, mode = what it set (DECIMAL — 420=0644 & 292=0444 are STRIPs; 438=0666 is the"
            echo "guard/heal restore). A path line at 420/292 names the culprit. DECISIVE NEGATIVE: if the"
            echo "guard journal shows a 0666 restore (⇒ a strip"
            echo "happened) but this log has NO matching path line in that window, the strip did NOT come from a"
            echo "userspace fchmodat/fchmodat2 on the path '/dev/null' — pointing at a kernel-internal or"
            echo "fd-based mechanism (an fd-based fchmod probe is not armed; see the arm-block note) rather than"
            echo "any path-chmod process."

          elif [ "${MODE}" = "bpftrace-disarm" ]; then
            echo; echo "===== bpftrace-disarm: stop the tracer (bpftrace pkg + log kept) ====="
            sudo systemctl stop ict-devnull-bpftrace.service 2>/dev/null && echo "stopped ict-devnull-bpftrace.service" || echo "(unit not running)"
            sudo systemctl reset-failed ict-devnull-bpftrace.service 2>/dev/null || true
            sudo rm -f /usr/local/bin/devnull_chmod_trace.bt && echo "removed /usr/local/bin/devnull_chmod_trace.bt"
            echo "tracer log at /var/log/ict-devnull-bpftrace.log left in place; bpftrace package left installed (harmless)."
            echo; echo "final /dev/null state:"; stat -c 'mode=%a inode=%i' /dev/null
          fi
          echo "(done)"
          REMOTE
          echo "ssh exit=$?"

      - name: Post result to issue
        if: github.event_name == 'issues' && steps.dedup.outputs.skip != 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '(no output)';
            try { out = fs.readFileSync('out.txt','utf8'); } catch {}
            const mode = '${{ steps.mode.outputs.mode }}' || 'inspect';
            const body = [`**vm-devnull-source-diagnose** (mode: ${mode}) result`, '', '```', out.slice(0,55000), '```'].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
            await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,state:'closed'});

      - name: Summary (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.dedup.outputs.skip != 'true'
        run: |
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
