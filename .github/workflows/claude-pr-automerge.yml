name: claude-pr-automerge

# Reusable autonomy path for PM-side Claude sessions whose GitHub MCP integration is
# READ-ONLY for issues/PRs (403 "Resource not accessible by integration" on PR create /
# merge / issue comment). `git push` works and a GitHub Actions workflow's own GITHUB_TOKEN
# HAS write perms — so this workflow does the PR-open + auto-merge the session can't call
# directly. Generalized from the one-off m28-value-grade/merge-push workflows (2026-07-27).
#
# TWO GATES, and the `paths:` filter is the WEAK one. A push to a `claude/**` branch
# reaches this job only if it touches `.github/pr-automerge-requests/*.txt` — but that
# filter matches a branch that merely MERGED `main` while somebody else's request file
# was on it, which is how three PRs were armed on 2026-09-02 having asked for nothing.
# So the job's FIRST action is the REQUEST GATE: it establishes that THIS branch asked,
# by proving `.github/pr-automerge-requests/<branch-slug>.txt` is present at the pushed
# head and is ADDED-OR-MODIFIED relative to `main`. Nothing else in this job runs until
# that holds. The file's CONTENTS are still never read — its PATH is the signal, and the
# path now names the branch, so no other branch's ask can stand in for yours.
#
# On a passing gate:
#   1. finds or CREATES the branch's PR to `main` (title = head-commit subject),
#   2. enables native auto-merge (squash) — GitHub merges ONLY when the required checks
#      pass and the branch is up to date (branch-protection is the safety net; this never
#      bypasses CI),
#   3. falls back to a bounded poll-then-squash-merge if auto-merge isn't allowed.
#
# ⚠️ IT NEVER UN-DRAFTS A PR IT DID NOT ITSELF CREATE. A draft is what every Tier-2 and
# Tier-3 convention in this repo uses to mean "prepared, not approved", and this workflow
# used to call `markPullRequestReadyForReview` unconditionally — silently deleting that
# marker, after which the PR merged on green with no human in the loop. A PR it creates is
# born ready (that IS the request being fulfilled); a draft somebody else opened is
# REFUSED, loudly, and left exactly as it was.
#
# ⚠️ TWO CHANGES, 2026-09-12 (MI-280 U2) — A PR OPENED HERE USED TO BE BORN WITH
# NO CHECKS, AND WAS THEN ARMED ANYWAY.
#
# GitHub deliberately suppresses workflow triggers for actions taken with the
# built-in GITHUB_TOKEN (recursion prevention). This job opened the PR with
# exactly that token, so the `pull_request` event never fired and the repo's
# required checks were never created. That is not inferred — `pr-opener.yml`'s
# own header isolates it on PR #10079 and re-measures it on #10683, where a head
# pushed with the caller's own credentials STILL returned `total_count: 0`.
# Arming is not a request to merge, it IS the merge, so arming such a PR hands
# the outcome to a head nothing is measuring; six instances were observed on
# 2026-09-08 alone (#11356, #11392, #11395, #11407, #11419, #11424), and the
# 2026-09-12 one dropped the commit carrying a LIVE lane's registry row, leaving
# that lane running unrecorded on `main` for nine minutes.
#
#   (a) THE PR IS OPENED UNDER A PAT when `BRANCH_PROTECTION_TOKEN` is present,
#       so the `pull_request` event fires and the checks attach on the FIRST
#       head. Falling back to GITHUB_TOKEN is still allowed — a missing secret
#       must not take the relay down — but it is announced LOUDLY and (b) then
#       refuses to arm, so the fallback degrades to "PR opened, not merged"
#       rather than to the silent hazard.
#   (b) ARMING IS GATED ON A CHECK HAVING ATTACHED, decided by
#       `scripts/ci/automerge_arming.py` — a pure function, so the policy is
#       arguable in tests rather than against a live PR.
#       ⚠️ THE SUBTLETY THAT MAKES A NAIVE GATE VACUOUS: a zero-check PR does
#       not report zero check runs. It reports ONE — this job's own
#       `open-and-automerge` run, green because it succeeded at opening the PR.
#       `check_runs.length > 0` is therefore TRUE on precisely the PR the gate
#       must refuse. The self job is excluded BY NAME, and a planted defect that
#       stops excluding it fails that module's suite.
#
# NEITHER CHANGE CAN MERGE ANYTHING THE OLD ONE WOULD NOT HAVE. Both are strictly
# subtractive: (a) changes who opens the PR, (b) only ever WITHHOLDS arming.
#
# Observe/CI-only — opens + merges a PR, touches no runtime, no order path. The merge still
# obeys every required status check + branch-protection rule.

on:
  push:
    branches: ["claude/**"]
    # PER-REQUEST FILE, matching every sibling relay in this repo
    # (BL-20260821-AUTOMERGE-TRIGGER-IS-A-SINGLE-SHARED-FILE).
    #
    # This used to be the single shared path `.github/pr-automerge-request`, so
    # EVERY PR wanting auto-merge had to modify THE SAME FILE and any two of them
    # collided by construction. Hit live 2026-08-21: #10083 merged as 932f0a54,
    # and #10086 — branched before it — came back `mergeable_state: dirty` with
    # that file as the ONLY conflicted path. Cost: a merge commit plus a full
    # ~10-minute CI cycle, in a repo that has already hit the free-tier
    # CI-minutes cap once (MB-20260706-CI-MINUTES).
    #
    # The conflict was pure ceremony: the file's CONTENT is never read (verified
    # by whole-file grep — the path appears exactly twice in this workflow, in
    # the comment above and in the filter below), so the resolution was always
    # "take the requesting PR's line" and carried no information.
    #
    # Every sibling relay already had this right: pr-opener takes
    # `automation/pr-requests/<name>.json`, board-post
    # `automation/board-posts/<name>.md`, pr-close
    # `automation/pr-close-requests/<name>.json`. Only this one kept a shared file.
    #
    # The legacy shared path is GONE from this list (and the file is deleted from
    # the tree), per its own instruction to remove it once no open PR carried it.
    # ⚠️ BUT THAT WAS NEVER THE BUG, AND REMOVING IT FIXES NOTHING ON ITS OWN.
    # Measured on the three mis-fires of 2026-09-02T13:19Z (`9cf89802`,
    # `5449ef6c`, `31cff960`): the legacy path is in ZERO of the three push
    # diffs — it had not been modified on `main` since 2026-08-21, so it could
    # not match. What matched is THIS GLOB. Nine `*.txt` request files landed on
    # `main` on 2026-09-02 alone, and GitHub computes a push's changed-file set
    # as the before-head→after-head diff, so ANY branch that merges or rebases
    # `main` drags other branches' request files into its own push diff.
    #
    # ⚠️ SO A `paths:` FILTER CANNOT BE THE GATE, AND MUST NEVER AGAIN BE THE
    # ONLY ONE. It cannot distinguish "I asked for auto-merge" from "I merged
    # somebody else's ask" — the two produce an identical changed-file set. The
    # repo's own merge protocol tells branches to sync to `main`, so the
    # condition fires most readily on the branches doing the right thing. This
    # filter is now only a cheap pre-filter that saves runner minutes; the
    # REQUEST GATE in the job body is what decides, and it is scoped to THIS
    # branch's own request file.
    # ⚠️ `*.txt`, NOT `**`. The first version of this fix used `**` and armed
    # auto-merge on THIS VERY PR by matching the directory's own README.md —
    # observed live 2026-08-22T10:46:15Z, `auto_merge_enabled` by
    # github-actions[bot], on a commit whose only new file there was
    # documentation. A trigger path that a doc edit can fire is a trigger that
    # merges PRs nobody asked to merge. Requests are `<branch-slug>.txt`; prose
    # in this directory must never be a signal.
    # ⚠️ THE LEGACY SHARED PATH IS REMOVED (2026-09-02). The header above says it
    # stayed "for a transition window ... Remove it once no open PR carries that
    # file" -- and that window closed in the worst possible way: the file was
    # COMMITTED TO `main` (by #10786), so from then on it was carried by every
    # branch in the repo and an ordinary `git merge origin/main` "touched" it.
    # MEASURED the same day on #10788: a DRAFT PR held draft on an explicit
    # operator instruction was un-drafted and armed for squash auto-merge by a
    # merge commit that requested nothing -- job `open-and-automerge` took FOUR
    # SECONDS, the early-return path taken only when `enablePullRequestAutoMerge`
    # SUCCEEDS, and the PR flipped `draft: true -> false`.
    # A trigger that a doc edit could fire was already rejected above; a trigger
    # that MERGING MAIN can fire is the same defect with a wider blast radius,
    # because every branch merges main. Requests are `<branch-slug>.txt` only.
    # ⚠️ THE STALE FILE IS DELIBERATELY LEFT ON DISK, and that is not an
    # oversight. Removing it from THIS list is what makes it inert -- nothing
    # reads its contents (the header above establishes that), so it is now dead
    # weight and nothing more. Deleting it would create a merge conflict for
    # every open branch that already modified it, which is the exact collision
    # the per-request split was made to end; and the deleting push would itself
    # touch this path one last time under whatever workflow version the pushed
    # ref carries. Delete it in a quiet window, not alongside other work.
    paths:
      - ".github/pr-automerge-requests/*.txt"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: claude-pr-automerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-and-automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: "Request gate, then open-or-find the PR and enable auto-merge"
        id: automerge
        uses: actions/github-script@v7
        env:
          # Optional. Absent -> the PR is opened under GITHUB_TOKEN, the checks do
          # not attach, and the gate in step 3 refuses to arm. Loud, not silent.
          PR_OPEN_PAT: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          ARMING_INPUT: ${{ runner.temp }}/automerge-arming.json
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner, repo = context.repo.repo;
            const subject = (context.payload.head_commit?.message || 'chore: automated PR').split('\n')[0];

            // ---------------------------------------------------------------
            // 0. THE REQUEST GATE — did THIS branch ask?
            //
            // The `paths:` filter cannot answer that. GitHub computes a push's
            // changed-file set as before-head→after-head, so merging or rebasing
            // `main` drags in every request file that landed on `main` in the
            // meantime and the filter matches on somebody else's ask. Measured on
            // the three mis-fires of 2026-09-02T13:19Z: all three matched OTHER
            // branches' request files, and the repo's own merge protocol is what
            // told those branches to sync to `main` in the first place.
            //
            // So the ask is proven here instead, against the branch's own name:
            //   present at the pushed head  AND  (absent on `main` OR differing
            //   from `main`)  ==  a commit on THIS branch put it there.
            // A file merely inherited from `main` is identical to `main`'s copy and
            // fails the second clause, which is exactly the mis-fire case.
            //
            // Two `getContent` calls, deliberately, rather than reading the push
            // event's file list: the event's list is the thing that is wrong.
            const slug = head.replace(/^claude\//, '').replace(/\//g, '-');
            const reqPath = `.github/pr-automerge-requests/${slug}.txt`;

            const blobSha = async (ref) => {
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path: reqPath, ref });
                return Array.isArray(r.data) ? null : (r.data.sha || null);
              } catch (e) {
                if (e.status === 404) return null;
                throw e;   // a read we could not make is NOT proof of absence.
              }
            };

            const atHead = await blobSha(context.sha);
            if (!atHead) {
              core.notice(`NO REQUEST — ${reqPath} is absent at ${context.sha.slice(0,8)}. ` +
                          `This push matched the paths filter through another branch's ` +
                          `request file (a merge or rebase of main). Doing nothing: no PR ` +
                          `opened, no draft changed, no auto-merge, no merge.`);
              return;
            }
            const atMain = await blobSha('main');
            if (atMain === atHead) {
              core.notice(`NO REQUEST — ${reqPath} exists but is byte-identical to main's ` +
                          `copy, so this branch inherited it rather than asking. Doing ` +
                          `nothing: no PR opened, no draft changed, no auto-merge, no merge.`);
              return;
            }
            core.notice(`request gate PASSED — ${reqPath} is ${atMain ? 'modified' : 'added'} by this branch`);

            // ---------------------------------------------------------------
            // 1. find or create the PR.
            //
            // ⚠️ CREATED UNDER A PAT WHEN ONE IS AVAILABLE. GitHub does not fire
            // workflow triggers for actions taken with the built-in GITHUB_TOKEN
            // (recursion prevention), so a PR opened with it never emits the
            // `pull_request` event and the required checks are never created —
            // measured in `pr-opener.yml`'s header on #10079 and #10683. Opening
            // under `BRANCH_PROTECTION_TOKEN` makes the checks attach on the
            // FIRST head, which is what step 3's gate then looks for.
            //
            // THREE STATES, never collapsed, because the third is the one a
            // reader needs: `pat` (the event will fire) · `github_token` (it
            // will not, and step 3 will refuse to arm) · `adopted` (we did not
            // open this PR at all, so neither statement is about us — a PR the
            // caller opened themselves already carries its own checks, which is
            // why adopting is the documented workaround).
            const patToken = process.env.PR_OPEN_PAT || '';
            // `@actions/github` is bundled with actions/github-script; getOctokit
            // gives a client authenticated as the PAT's owner rather than as
            // github-actions[bot], which is the whole point — the event fires for
            // a human/PAT actor and does not for the bot.
            const opener = patToken
              ? require('@actions/github').getOctokit(patToken)
              : github;

            let pr = (await github.rest.pulls.list({
              owner, repo, head: `${owner}:${head}`, state: 'open',
            })).data[0];
            let created = false;
            let openerKind = 'adopted';
            if (!pr) {
              openerKind = patToken ? 'pat' : 'github_token';
              if (!patToken) {
                core.warning(
                  'BRANCH_PROTECTION_TOKEN is NOT set, so this PR is being opened ' +
                  'with GITHUB_TOKEN. GitHub suppresses the `pull_request` event ' +
                  'for that token, so the required checks will NOT attach to the ' +
                  'first head and step 3 will REFUSE to arm auto-merge. The PR is ' +
                  'still opened — the relay does not go down over a missing secret ' +
                  '— but it will need one ordinary push before it can merge.');
              }
              const createArgs = {
                owner, repo, head, base: 'main', draft: false,
                title: subject,
                body: [
                  'Opened by the `claude-pr-automerge` workflow (the session\'s GitHub MCP integration is read-only for PRs — 403).',
                  'Auto-merge (squash) is enabled: GitHub merges only when the required checks pass and the branch is up to date.',
                  '',
                  '---',
                  '🤖 Generated with [Claude Code](https://claude.com/claude-code)',
                ].join('\n'),
              };
              // ⚠️ AN UNUSABLE PAT MUST NOT TAKE THE RELAY DOWN.
              // Whether `BRANCH_PROTECTION_TOKEN` carries PR-create scope is NOT
              // established — it cannot be read from a session, and it is the one
              // open question on this change. Without this fallback the answer
              // decides whether the relay works at all: a token lacking the scope
              // returns 403 here, the whole script throws, and NO PR is opened —
              // strictly worse than the GITHUB_TOKEN behaviour this change
              // replaces. With it, the unknown degrades to the SAME state a
              // missing secret already degrades to: PR opened, checks absent,
              // arming refused by step 3. The question stops being load-bearing.
              // Only the PAT attempt is guarded; a GITHUB_TOKEN failure is a real
              // failure and still propagates.
              try {
                pr = (await opener.rest.pulls.create(createArgs)).data;
              } catch (e) {
                if (opener === github) { throw e; }
                core.warning(
                  `opening the PR under BRANCH_PROTECTION_TOKEN FAILED (${e.status || '?'}: ` +
                  `${e.message}). Falling back to GITHUB_TOKEN. The PR will still be ` +
                  `opened, but GitHub suppresses the \`pull_request\` event for that ` +
                  `token, so the required checks will NOT attach to the first head and ` +
                  `step 3 will REFUSE to arm auto-merge. If this is a 403, the PAT is ` +
                  `missing PR-create scope — grant it, or expect one ordinary push per PR.`);
                openerKind = 'github_token';
                pr = (await github.rest.pulls.create(createArgs)).data;
              }
              created = true;
              core.notice(`opened PR #${pr.number} (opener: ${openerKind})`);
            } else {
              core.notice(`found open PR #${pr.number} (draft: ${pr.draft})`);
            }

            // ---------------------------------------------------------------
            // 2. THE DRAFT REFUSAL — never un-draft a PR this workflow did not open.
            //
            // A draft is this repo's marker for "prepared, not approved"; Tier-2 and
            // Tier-3 both depend on it, and branch protection does not help because
            // it gates on CHECKS and the checks were green. This job used to run
            // `markPullRequestReadyForReview` unconditionally, so a request file
            // (or, before the gate above, no request at all) silently removed the
            // one signal holding a PR back. #10788 and #10764 were both armed this
            // way on 2026-09-02 while their own bodies read "Not for merge" and
            // "Left as a DRAFT. The manager owns the merge."
            //
            // A PR this run CREATED is born ready — that is the request being
            // fulfilled, and there is no human intent to override. Anything else
            // that is a draft is refused and left untouched.
            if (!created && pr.draft) {
              core.notice(`REFUSING — #${pr.number} is a DRAFT this workflow did not open. ` +
                          `A draft means "prepared, not approved" in this repo, so the ` +
                          `request file does not override it. Left as-is: not un-drafted, ` +
                          `no auto-merge, no merge. Open the PR ready (pr-opener's ` +
                          `"draft": false) or ask the manager to merge it.`);
              return;
            }

            // ---------------------------------------------------------------
            // 3. THE ARMING GATE — has anything actually attached to this head?
            //
            // Arming is not a request to merge, it IS the merge, so arming a head
            // that no check is measuring hands the outcome to nothing. The
            // DECISION is a pure function in `scripts/ci/automerge_arming.py` so
            // the policy is arguable in tests rather than against a live PR; this
            // step only gathers the evidence and obeys the verdict.
            //
            // ⚠️ THE COUNT THAT LOOKS RIGHT AND IS VACUOUS: a zero-check PR
            // reports ONE check run — this very job, green because it opened the
            // PR. `check_runs.length > 0` is TRUE on exactly the PR this gate
            // must refuse. The module excludes the self job BY NAME.
            //
            // A FAILED READ IS NOT AN EMPTY READ. `checks_read_ok: false` grades
            // `unreadable`, which refuses — an unread head is the head the gate
            // exists to protect, not a safe one.
            const armHead = pr.head?.sha || context.sha;
            let checkRuns = null, checksReadOk = false;
            try {
              const r = await github.rest.checks.listForRef({
                owner, repo, ref: armHead, per_page: 100 });
              checkRuns = r.data?.check_runs ?? null;
              checksReadOk = Array.isArray(checkRuns);
            } catch (e) {
              core.warning(`could not read check runs for ${armHead.slice(0,8)}: ${e.message}`);
            }
            require('fs').writeFileSync(process.env.ARMING_INPUT,
              JSON.stringify({ check_runs: checkRuns, checks_read_ok: checksReadOk }));

            const gate = require('child_process').spawnSync(
              'python3', ['scripts/ci/automerge_arming.py', '--input', process.env.ARMING_INPUT],
              { encoding: 'utf-8' });
            let verdict;
            try { verdict = JSON.parse(gate.stdout); }
            catch (e) {
              // The gate could not be RUN or could not be PARSED. That is not a
              // licence to arm: the one thing a broken gate must never do is
              // degrade to the behaviour it was added to prevent.
              core.setFailed(
                `the arming gate could not be evaluated (exit ${gate.status}: ` +
                `${(gate.stderr || e.message || '').slice(0, 400)}). NOT arming ` +
                `auto-merge. PR #${pr.number} is open and untouched; push one ` +
                `ordinary commit and let CI decide, or merge it by hand.`);
              return;
            }
            core.notice(`arming gate: ${verdict.state} — ${verdict.why}`);
            if (!verdict.arm) {
              core.notice(
                `NOT ARMING #${pr.number} (opener: ${openerKind}). The PR is open ` +
                `and left exactly as it is — nothing un-drafted, nothing merged. ` +
                `This is the gate working, not a failure.`);
              return;
            }

            // ---------------------------------------------------------------
            // 3b. enable native auto-merge.
            try {
              await github.graphql(`mutation($id:ID!){ enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:SQUASH}){ pullRequest{ number } } }`, { id: pr.node_id });
              core.notice(`auto-merge enabled on #${pr.number} — merges when CI is green`);
              return;
            } catch (e) {
              core.notice(`enableAutoMerge failed (${e.message}); falling back to poll-then-merge`);
            }

            // 4. fallback: poll ~8 min for checks, then squash-merge directly.
            const sha = pr.head.sha;
            for (let i = 0; i < 16; i++) {
              await new Promise(r => setTimeout(r, 30000));
              const checks = (await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 })).data.check_runs || [];
              const pending = checks.filter(c => c.status !== 'completed');
              const failed = checks.filter(c => c.conclusion && !['success','neutral','skipped'].includes(c.conclusion));
              core.notice(`poll ${i}: ${checks.length} checks, ${pending.length} pending, ${failed.length} failed`);
              if (failed.length) { core.setFailed(`checks failed: ${failed.map(c=>c.name).join(', ')}`); return; }
              if (checks.length && !pending.length) {
                try {
                  await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
                  core.notice(`merged #${pr.number} (squash)`);
                } catch (e) { core.setFailed(`direct merge failed: ${e.message} (PR is ready + green; operator can click Merge)`); }
                return;
              }
            }
            core.notice('checks still pending after poll window; PR left ready (auto-merge or operator completes it)');
