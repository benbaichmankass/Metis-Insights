name: claude-pr-automerge

# Reusable autonomy path for PM-side Claude sessions whose GitHub MCP integration is
# READ-ONLY for issues/PRs (403 "Resource not accessible by integration" on PR create /
# merge / issue comment). `git push` works and a GitHub Actions workflow's own GITHUB_TOKEN
# HAS write perms — so this workflow does the PR-open + auto-merge the session can't call
# directly. Generalized from the one-off m28-value-grade/merge-push workflows (2026-07-27).
#
# Trigger: a git push to any `claude/**` branch that touches
# `.github/pr-automerge-requests/<branch>.txt` — one file PER REQUEST, so two PRs never
# collide (the old single shared `.github/pr-automerge-request` is still accepted during a
# transition window). The file's contents are ignored — touching it is the
# opt-in signal; the PR title/body derive from the head commit. On fire, this workflow:
#   1. finds or CREATES the branch's PR to `main` (title = head-commit subject),
#   2. marks it ready + enables native auto-merge (squash) — GitHub then merges ONLY when
#      the required checks pass and the branch is up to date (branch-protection is the
#      safety net; this never bypasses CI),
#   3. falls back to a bounded poll-then-squash-merge if auto-merge isn't allowed.
#
# Observe/CI-only — opens + merges a PR, touches no runtime, no order path. The merge still
# obeys every required status check + branch-protection rule.

on:
  push:
    branches: ["claude/**"]
    # PER-REQUEST FILE, matching every sibling relay in this repo
    # (BL-20260821-AUTOMERGE-TRIGGER-IS-A-SINGLE-SHARED-FILE).
    #
    # This used to be the single shared path `.github/pr-automerge-request`, so
    # EVERY PR wanting auto-merge had to modify THE SAME FILE and any two of them
    # collided by construction. Hit live 2026-08-21: #10083 merged as 932f0a54,
    # and #10086 — branched before it — came back `mergeable_state: dirty` with
    # that file as the ONLY conflicted path. Cost: a merge commit plus a full
    # ~10-minute CI cycle, in a repo that has already hit the free-tier
    # CI-minutes cap once (MB-20260706-CI-MINUTES).
    #
    # The conflict was pure ceremony: the file's CONTENT is never read (verified
    # by whole-file grep — the path appears exactly twice in this workflow, in
    # the comment above and in the filter below), so the resolution was always
    # "take the requesting PR's line" and carried no information.
    #
    # Every sibling relay already had this right: pr-opener takes
    # `automation/pr-requests/<name>.json`, board-post
    # `automation/board-posts/<name>.md`, pr-close
    # `automation/pr-close-requests/<name>.json`. Only this one kept a shared file.
    #
    # The OLD path stays in the list for a transition window so an in-flight
    # branch that already wrote it still fires. Remove it once no open PR carries
    # that file.
    paths:
      - ".github/pr-automerge-requests/**"
      - ".github/pr-automerge-request"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: claude-pr-automerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open-and-automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: "Open-or-find the PR, mark ready, enable auto-merge (fallback poll-then-merge)"
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.ref.replace('refs/heads/', '');
            const owner = context.repo.owner, repo = context.repo.repo;
            const subject = (context.payload.head_commit?.message || 'chore: automated PR').split('\n')[0];

            // 1. find or create the PR.
            let pr = (await github.rest.pulls.list({
              owner, repo, head: `${owner}:${head}`, state: 'open',
            })).data[0];
            if (!pr) {
              pr = (await github.rest.pulls.create({
                owner, repo, head, base: 'main', draft: false,
                title: subject,
                body: [
                  'Opened by the `claude-pr-automerge` workflow (the session\'s GitHub MCP integration is read-only for PRs — 403).',
                  'Auto-merge (squash) is enabled: GitHub merges only when the required checks pass and the branch is up to date.',
                  '',
                  '---',
                  '🤖 Generated with [Claude Code](https://claude.com/claude-code)',
                ].join('\n'),
              })).data;
              core.notice(`opened PR #${pr.number}`);
            } else {
              core.notice(`found open PR #${pr.number}`);
            }

            // 2. mark ready (un-draft) + enable native auto-merge.
            try {
              await github.graphql(`mutation($id:ID!){ markPullRequestReadyForReview(input:{pullRequestId:$id}){ pullRequest{ number } } }`, { id: pr.node_id });
            } catch (e) { core.notice(`markReady: ${e.message}`); }
            try {
              await github.graphql(`mutation($id:ID!){ enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:SQUASH}){ pullRequest{ number } } }`, { id: pr.node_id });
              core.notice(`auto-merge enabled on #${pr.number} — merges when CI is green`);
              return;
            } catch (e) {
              core.notice(`enableAutoMerge failed (${e.message}); falling back to poll-then-merge`);
            }

            // 3. fallback: poll ~8 min for checks, then squash-merge directly.
            const sha = pr.head.sha;
            for (let i = 0; i < 16; i++) {
              await new Promise(r => setTimeout(r, 30000));
              const checks = (await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 })).data.check_runs || [];
              const pending = checks.filter(c => c.status !== 'completed');
              const failed = checks.filter(c => c.conclusion && !['success','neutral','skipped'].includes(c.conclusion));
              core.notice(`poll ${i}: ${checks.length} checks, ${pending.length} pending, ${failed.length} failed`);
              if (failed.length) { core.setFailed(`checks failed: ${failed.map(c=>c.name).join(', ')}`); return; }
              if (checks.length && !pending.length) {
                try {
                  await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
                  core.notice(`merged #${pr.number} (squash)`);
                } catch (e) { core.setFailed(`direct merge failed: ${e.message} (PR is ready + green; operator can click Merge)`); }
                return;
              }
            }
            core.notice('checks still pending after poll window; PR left ready (auto-merge or operator completes it)');
