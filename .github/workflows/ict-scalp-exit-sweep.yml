name: ict-scalp-exit-sweep

# M27 ict_scalp crypto exit-lever sweep (PR #7849 follow-up). One matrix job per
# live crypto ict_scalp leg, run in PARALLEL on free 4-core runners (public repo)
# so the heavy sweep stays OFF the 1-core trainer (vm-resource-management). Each
# job scp's just its leg's config-exact M27 candle CSV from the trainer's
# /home/ubuntu/m27_data, runs the config-exact IS/OOS lever sweep, and posts the
# verdict back as a comment on PR #7849.
#
# Trigger: a push to a listed branch that touches `.github/exit-sweep-request`
# (the push runs the workflow version ON the branch, with same-repo secrets — the
# issue-label path can't be used because issue-triggered workflows load only from
# the default branch). Re-trigger by committing a new value to that sentinel.
#
# DATASET (load-bearing, verified 2026-08-09): the scp source /home/ubuntu/m27_data
# is NOT the same data as the trainer's ~/ict-trading-bot/data. m27_data starts
# 2023-01-01 (ETHUSDT_15m = 124,497 rows); data/ starts 2021-03 (184,443 rows),
# different md5. Every M27 exit-lever verdict in the coverage matrix was measured
# on m27_data, so a new lever cell MUST use it too or the matrix row silently
# mixes two populations — and the yearly walk-forward differs as well (folds
# 2021/2022 are empty on m27_data, so `usable` is 4 and `need` is 3, not 4/6).

on:
  push:
    # 2026-09-02 (MI-66): was pinned to literal branch(es) that have since been
    # DELETED from origin, so this push trigger could not fire at all — the
    # workflow was reachable only by `workflow_dispatch`. Generalised to the
    # `claude/**` namespace rather than dropped, because the `paths:` sentinel
    # below is the real trigger (the branch list was only ever a convenience)
    # and the header's documented "re-trigger by committing a new value to that
    # sentinel" had been silently untrue since those branches went away.
    # Enforced by scripts/ci/check_workflow_trigger_reachability.py.
    branches:
      - 'claude/**'
    paths:
      - '.github/exit-sweep-request'
  workflow_dispatch:
    inputs:
      cells:
        description: "Matrix lever(s) to sweep, CSV (e.g. exit_ladder). Empty = the legacy cells. GEOM-B1: `tp_revision` (= tp_extend + tp_retarget, a take-profit that MOVES, on the live tp_at_r bracket) or either one alone; these cells are OPT-IN and exist only when named here."
        required: false
        default: 'exit_ladder'
      # ⚠️ THESE FOUR EXIST SO THE QUEUE CAN FIRE THIS WORKFLOW AND SO ITS RESULT
      # LANDS. `scripts/research/dispatch_queue.py` REFUSES an `accruing` unit that
      # does not declare `run.inputs.research_unit`, and `gh workflow run -f
      # <input-the-workflow-never-declared>` ERRORS -- the same reason
      # m20-exit-lever-sweep.yml declares them. Until 2026-10-07 this workflow's
      # only output was a PR comment and an expiring artifact, so no queue unit
      # could satisfy a `lands:` clause on it. A run with `research_unit` empty is
      # NOT queue-dispatched and behaves exactly as before (comment only).
      research_unit:
        description: "Queue unit id that dispatched this run (RQ-...). Empty = NOT queue-dispatched: the verdict is posted as a PR comment only, no result is landed."
        required: false
        default: ""
      power_state:
        description: "That unit's computed R4 power verdict, supplied by the dispatcher. `accruing` means its numbers must never be read as a test result."
        required: false
        default: ""
      decision_rule_id:
        description: "The unit's pre-registered decision rule id (e.g. RULE-RQ1007-004-SCALP-TARGET-REVISION). Required to LAND a result."
        required: false
        default: ""
      decision_rule_registered_at:
        description: "When that rule was registered (ISO date). Required to LAND a result."
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 7
      # All 7 data-reachable live crypto ict_scalp legs, one runner each.
      # `name` is the config/strategies.yaml leg id — passed as --leg so the
      # sweep resolves that leg's OWN declared exit levers into the base
      # (only ict_scalp_eth_15m declares any: stale_exit_bars 12). Without it
      # that one leg would be swept against a baseline it does not run live.
      # The 8th leg, ict_scalp_mgc_15m, is deliberately absent: no MGC/XAUUSD
      # 15m data exists (blocked:data_missing,
      # BL-20260809-XAU-PROXY-DATASET-GONE-VERDICTS-UNREPRODUCIBLE).
      matrix:
        leg:
          - { name: ict_scalp_eth_15m, sym: ETHUSDT,  tf: 15m }
          - { name: ict_scalp_sol_15m, sym: SOLUSDT,  tf: 15m }
          - { name: ict_scalp_xrp_15m, sym: XRPUSDT,  tf: 15m }
          - { name: ict_scalp_5m,      sym: BTCUSDT,  tf: 5m  }
          - { name: ict_scalp_sol_5m,  sym: SOLUSDT,  tf: 5m  }
          - { name: ict_scalp_xrp_5m,  sym: XRPUSDT,  tf: 5m  }
          - { name: ict_scalp_avax_5m, sym: AVAXUSDT, tf: 5m  }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch leg data from trainer (scp)
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
          SYM: ${{ matrix.leg.sym }}
          TF: ${{ matrix.leg.tf }}
        run: |
          set -e
          if [ -z "${VM_SSH_KEY}" ]; then echo "::error::VM_SSH_KEY unset"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key
          chmod 600 ~/.ssh/trainer_key
          ssh-keyscan -t ed25519,ecdsa,rsa "${TRAINER_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p data
          scp -i ~/.ssh/trainer_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=25 \
              "${TRAINER_USER}@${TRAINER_IP}:/home/ubuntu/m27_data/${SYM}_${TF}.csv" \
              "data/${SYM}_${TF}.csv"
          echo "rows: $(wc -l < data/${SYM}_${TF}.csv)"

      - name: Run config-exact exit-lever sweep
        env:
          LEG: ${{ matrix.leg.name }}
          SYM: ${{ matrix.leg.sym }}
          TF: ${{ matrix.leg.tf }}
          CELLS: ${{ inputs.cells || 'exit_ladder' }}
        run: |
          set -o pipefail
          python3 scripts/research/m27/ict_scalp_exit_sweep.py \
            --leg "${LEG}" \
            --data "data/${SYM}_${TF}.csv" \
            ${CELLS:+--cells "${CELLS}"} \
            --split 2025-07-01 --walkforward \
            --out "out/${SYM}_${TF}" 2>&1 | tee sweep.out
          echo "---VERDICTS_JSON---"
          cat "out/${SYM}_${TF}/verdicts.json" >> verdicts_raw.json || true

      # The per-leg verdicts, kept for the `research_result` job below (and for a
      # reader: an expiring artifact is not the record, the landed result is).
      - name: Upload this leg's verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scalp-sweep-${{ matrix.leg.name }}
          path: out/${{ matrix.leg.sym }}_${{ matrix.leg.tf }}/verdicts.json
          if-no-files-found: ignore

      - name: Post verdict comment on PR
        if: always()
        uses: actions/github-script@v7
        env:
          LEG: ${{ matrix.leg.name }}
          SYM: ${{ matrix.leg.sym }}
          TF: ${{ matrix.leg.tf }}
        with:
          script: |
            const fs = require('fs');
            let out = '';
            try { out = fs.readFileSync('sweep.out', 'utf8'); }
            catch (e) { out = '(no sweep output — job failed before/at the sweep step; see run logs)'; }
            const sym = process.env.SYM, tf = process.env.TF;
            const leg = process.env.LEG || `${sym}_${tf}`;
            // The branch that triggered this run — never a hardcoded one, or a
            // re-use posts its verdicts onto an unrelated PR.
            const branch = context.ref.replace('refs/heads/', '');
            // Resolve the PR from the COMMIT, not from a head-filter query.
            // The `pulls.list({head: 'owner:branch'})` form silently returned
            // an empty list for this branch on 2026-08-10 — all 7 legs computed
            // their verdicts and then dropped them on the floor, each logging a
            // warning and exiting 0. listPullRequestsAssociatedWithCommit is the
            // direct question ("which PR contains this sha?") and needs no
            // guess about the head-ref string format.
            let num = null;
            try {
              const byCommit = await github.rest.repos
                .listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner, repo: context.repo.repo,
                  commit_sha: context.sha,
                });
              const open = byCommit.data.filter(p => p.state === 'open');
              num = open[0] && open[0].number;
            } catch (e) { core.warning(`commit->PR lookup failed: ${e.message}`); }
            if (!num) {   // fall back to the head-filter form
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner, repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`, state: 'open',
              });
              num = prs.data[0] && prs.data[0].number;
            }
            const body = [
              `**exit-sweep verdict — \`${leg}\` (${sym} ${tf})** (run ${context.runId})`,
              `Dataset: \`m27_data/${sym}_${tf}.csv\` — the SAME population every other M27 exit-lever verdict in this row was measured on.`,
              '',
              '```',
              out.slice(-3500),
              '```',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            if (num) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: num, body,
              });
            } else {
              // FAIL, do not warn. A sweep that computed a verdict and could
              // not deliver it is a lost result, and a green job that produced
              // nothing is exactly the "green is not evidence" shape — on
              // 2026-08-10 all 7 legs did this and the run still read as a
              // clean success.
              core.setFailed(
                `Verdict for ${leg} could NOT be posted: no open PR found for ` +
                `commit ${context.sha} or branch ${branch}. The result is in ` +
                `this job's log and must be collected manually.`);
            }

  # ---------------------------------------------------------------- landing
  # Lands ONE RECORD PER DISPATCHED LEG on `main` through the shared
  # `research-result` action, so a queue unit routed here (RQ-20261007-004) can
  # satisfy its `lands:` clause. Only for a queue-dispatched run
  # (`research_unit` set); a manual run keeps its old comment-only behaviour.
  #
  # `if: always()` because a failed or partial sweep is itself a result: a
  # dropped leg becomes a visible `no_data` / `producer_failed` record.
  #
  # ⚠️ THIS JOB IS NOT YET PROVEN END-TO-END. The mapper
  # (scripts/research/m27/scalp_sweep_result.py) has a self-test and its parts are
  # checked against research_result.validate(); the commit-to-main half is a nested
  # composite no CI run exercises, so the first real proof is the first dispatch
  # (the same caveat the research-result action states for itself).
  research_result:
    needs: sweep
    if: always() && inputs.research_unit != '' && inputs.decision_rule_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # `continue-on-error` is BRANCHED ON, not swallowed: when every shard died
      # there is nothing to download, and the mapper then emits `producer_failed`
      # per dispatched leg -- the case this job exists to make visible.
      - uses: actions/download-artifact@v4
        id: fetch
        continue-on-error: true
        with:
          pattern: scalp-sweep-*
          path: sweep_out
          merge-multiple: false
      - name: Map this run onto one record per dispatched leg
        id: derive
        env:
          SWEEP_RESULT: ${{ needs.sweep.result }}
          UNIT: ${{ inputs.research_unit }}
        run: |
          set -euo pipefail
          mkdir -p rr sweep_out
          # The DISPATCHED population is the static matrix above, read from this
          # file so the two cannot drift.
          LEGS="$(python3 - <<'PY'
          import re
          txt = open(".github/workflows/ict-scalp-exit-sweep.yml").read()
          print(",".join(re.findall(r"- \{ name: (\w+),", txt)))
          PY
          )"
          echo "dispatched legs: ${LEGS}"
          python3 scripts/research/m27/scalp_sweep_result.py \
            --verdicts-dir sweep_out \
            --legs "${LEGS}" \
            --out rr/records.jsonl \
            --measurements-dir "research/results/${UNIT}/measurements" \
            --sweep-result "${SWEEP_RESULT}"
      - name: Land the per-leg results on main
        uses: ./.github/actions/research-result
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          research-unit: ${{ inputs.research_unit }}
          power-state: ${{ inputs.power_state }}
          decision-rule-id: ${{ inputs.decision_rule_id }}
          decision-rule-registered-at: ${{ inputs.decision_rule_registered_at }}
          records-file: rr/records.jsonl
          # The FAN-OUT WIDTH, not 1: a result covering fewer legs than were
          # dispatched FAILS here instead of grading green on a partial.
          min-rows: ${{ steps.derive.outputs.min_rows }}
          extra-paths: ${{ steps.derive.outputs.extra_paths }}
          # Unused when `records-file` is set (each part carries its own), but the
          # action requires them.
          verdict: not_applicable
          read-state: not_attempted
          population: per-leg; see each record
          n: 'null'
          tool: scripts/research/m27/ict_scalp_exit_sweep.py + scripts/research/m27/scalp_sweep_result.py
