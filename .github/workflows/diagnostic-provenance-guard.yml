name: Diagnostic-provenance guard

# Fails the PR check when a change to the DIAGNOSTIC SURFACE (scripts/ml,
# scripts/research, scripts/ops, scripts/macro, scripts/reports, and the guard
# scripts) adds a human-facing claim that does not carry the provenance of what
# it computed:
#
#   A  a predictor-class-dependent value (`score` / bare `.predict()`) read in
#      a file that prints a probability-shaped label — `score` is
#      max(proba) for a multiclass head, so a confidently-CALM regime prints
#      HIGH under a "P(volatile)" label;
#   B  the newest / alphabetically-last discovered input picked instead of the
#      declared or pinned one, with no path printed;
#   C  a universal claim ("every/all/no/none/clean") with no denominator, so an
#      empty or truncated result reads as a clean negative.
#
# Seven instances of this class landed on 2026-07-30, every one caught by luck
# or paranoia rather than by a check. See scripts/check_diagnostic_provenance.py
# for the full incident record, and BL-20260730-DIAGNOSTIC-PROVENANCE-CLASS.
#
# DIFF-SCOPED on purpose: pre-existing sites are grandfathered, exactly like
# silent-empty-guard. Run `python3 scripts/check_diagnostic_provenance.py --all`
# for the standing audit of the whole surface.
#
# Actions-minutes discipline (MB-20260706-CI-MINUTES): trigger carries no
# `paths:` filter (a required check must never be left pending), so the scan
# step short-circuits on a PR touching no relevant file.

on:
  # Dormant until the native merge queue is enabled (BL-20260726); a required
  # check MUST run on the merge_group ref or the queue stalls.
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic-provenance-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute diff against base
        # Full fetch + three-dot: see the note in dry-run-guard.yml — a
        # `--depth=1` clone shallows origin/main and breaks the merge-base.
        run: |
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff
          wc -l /tmp/pr.diff

      - name: Determine relevance
        id: changed
        run: |
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          if echo "$FILES" | grep -Eq '^scripts/.*\.py$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No scripts/**.py changes — skipping the scan."
          fi

      - name: Scan changed diagnostics for unprovenanced output
        id: scan
        if: steps.changed.outputs.relevant == 'true'
        run: |
          set +e
          python3 scripts/check_diagnostic_provenance.py /tmp/pr.diff
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Fail the check on hit
        if: steps.changed.outputs.relevant == 'true' && steps.scan.outputs.exit != '0'
        run: |
          echo "::error::diagnostic-provenance guard tripped — a diagnostic \
          asserts something it did not compute. See the job output for the \
          exact line and the three fixes."
          exit 1
