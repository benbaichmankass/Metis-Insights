name: pytest-run

# Executes the test suite on every PR (and on push to main).
#
# This is the companion to `pytest-collect`, which only *imports* the
# test tree (`--collect-only`) and never runs a single assertion. That
# collect-only gate let real regressions through whenever the broken
# code still imported cleanly — e.g. the system-action allowlist guard
# silently drifting to 14/30 actions, the dead `_RUNTIME_LOGS` test
# fixture, and the shadow-prediction wiring gap (all had green CI).
# `pytest-run` closes that hole by actually executing the suite.
#
# **REQUIRED (blocking) as of 2026-05-22.** It shipped advisory first
# (the suite had never run in CI, so its pass/fail state on `main` was
# unknown — shipping advisory surfaced that without a wall of red), then
# was promoted by adding `"pytest-run"` to `branch-protection-sync.yml`'s
# `REQUIRED_CONTEXTS` (#1721) once the baseline went green on `main`:
# #1658-1667 cleared the failure backlog, #1681 the order-dependent +
# post-IB-merge regressions, #1717 the non-root sudo-stub fix that failed
# only on the CI runner. Same advisory→blocking path `pytest-collect`
# followed in S-045.
#
# `tests/test_main_loop.py` is excluded for the same reason
# `pytest-collect` excludes it: it imports the live trading entrypoint
# (`src.main`) and is not sandbox/CI-safe. See CLAUDE.md "Default
# verification". Any other module that proves CI-unsafe should be fixed,
# not blanket-ignored — add a narrow `--ignore` with a comment if truly
# unavoidable.
#
# **2026-07-06 (Actions-minutes billing cap, MB-20260706-CI-MINUTES):**
# this is a REQUIRED status check, so its trigger can NEVER carry a
# `paths:` filter — GitHub would leave the check permanently "pending" on
# a non-matching PR, blocking it from merging forever. Instead the job
# always runs (cheap: checkout + `git diff --name-only`) but SKIPS the
# expensive steps (full pip install + the actual test run — the bulk of
# the cost) when nothing python/test-relevant changed. See "Determine
# relevant changed files" below.

on:
  # Dormant until the native merge queue is enabled (BL-20260726 merge-queue enablement);
  # required checks MUST run on the merge_group ref or the queue stalls.
  merge_group:
    # NOTE (P2.1, 2026-07-31 audit): on merge_group events github.base_ref is
    # EMPTY — every base_ref expression in this file falls back to 'main'
    # (the only branch the queue serves; pull_request trigger is main-scoped).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  # Manually dispatchable so a FEATURE BRANCH can always run the suite.
  # Without this, `push` is main-only and `pull_request` is the sole event that
  # can run these tests on a branch — so the one confirmed dropped
  # `pull_request` delivery (BL-20260730-PR-CI-NOT-ATTACHING) left a branch with
  # NO way to run its tests in CI at all. That is the part worth fixing
  # regardless of whether the delivery flakiness recurs: the failure mode is not
  # "a check went red", it is "a check silently did not run", which renders
  # identically to green.
  workflow_dispatch:

# Concurrency (2026-08-10, BL-20260810-REQUIRED-WORKFLOWS-NO-CONCURRENCY-GROUP).
# Without a group, a re-queue (a second push to the same PR, or the
# `opened`+`synchronize` double-fire) STACKS a second full run instead of
# superseding the first — for pytest-run that is a wasted ~9-minute test suite against the
# 2,000-minute free-tier cap this repo already hit once (MB-20260706-CI-MINUTES).
# Observed live on PR #8733: a second commit queued a second full suite while
# the first was still running.
#
# `github.event_name` is IN THE GROUP KEY deliberately: a `merge_group` run must
# NEVER be cancelled by a `pull_request` run on the same ref, or the merge queue
# stalls on a required check that reports `cancelled`. Same shape as guards.yml.
concurrency:
  group: pytest-run-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine relevant changed files
        id: changed
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref || 'main' }}" --quiet
            RANGE="origin/${{ github.base_ref || 'main' }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              echo "::notice::No prior commit to diff against — running the full check."
              exit 0
            fi
            RANGE="$BEFORE...${{ github.sha }}"
          fi
          FILES=$(git diff --name-only $RANGE || true)
          echo "Changed files ($RANGE):"
          echo "$FILES"
          # Run the full suite when the diff touches code/test-config OR
          # config/** OR any workflow — the latter two because the suite ASSERTS
          # over them (e.g. test_strategy_execution_gate reads config/strategies.yaml;
          # test_system_actions_workflow reads .github/workflows/system-actions.yml).
          # Before this, a config-only / workflow-only PR short-circuited past the
          # test run and merged GREEN while it had actually reddened main's full
          # suite (BL-20260707-FASTCI-CONFIG-DRIFT: #5850 config demote + #5851
          # system-action both slipped through).
          # scripts/ + deploy/ + comms/ added 2026-08-13 — the THIRD recurrence of
          # this exact class. The filter enumerates what the suite READS, and it
          # keeps missing trees: config/ and .github/workflows/ were added after
          # BL-20260707-FASTCI-CONFIG-DRIFT let two config-only PRs merge green
          # while reddening main. The same hole was still open for:
          #   scripts/  — tests/ops/test_system_actions_workflow.py reads
          #               scripts/ops/*.sh (OPS_DIR) and asserts every wrapper
          #               uses `set -euo pipefail` and sources _lib.sh. 201 test
          #               references to scripts/ in total.
          #   deploy/   — tests/test_s012_service_consolidation.py asserts the
          #               deploy/*.service set matches the canonical list, and
          #               tests/test_check_diag_unit_allowlist.py over the units.
          #   comms/    — schema templates the suite validates against.
          #   .github/actions/ — added 2026-08-30, the FOURTH tree-shaped
          #               recurrence. `.github/workflows/` was covered and its
          #               SIBLING was not, so a PR touching only a shared
          #               composite action — code every workflow that calls it
          #               executes — short-circuited the suite. Found the moment
          #               it mattered: tests/test_gld_compat_landing.py became the
          #               tree's first reader in the same PR that taught
          #               commit-to-main to verify its own merge, and
          #               test_every_committed_tree_the_suite_reads_is_covered
          #               failed on that push. The guard is the general form of
          #               this list and it earned its keep; the list is still the
          #               thing that has to be edited.
          # PROVEN, not theorised: PR #8994 changed only scripts/ops/purge_vm_runner.sh,
          # short-circuited to a 9-SECOND green pytest-run, and merged to main
          # without executing a single test. A required check that reports success
          # without running is, at the merge button, indistinguishable from a real
          # pass ("green is not evidence").
          #
          # docs/ and data/ are DELIBERATELY still excluded: they are large and
          # change on nearly every PR, and the suite's assertions over them are
          # owned by the separate `guards` job (canonical-doc-coherence et al.),
          # which does not short-circuit. That is a stated trade-off against
          # MB-20260706-CI-MINUTES, not an oversight — tests/test_pytest_run_filter.py
          # pins both the inclusions and these exclusions.
          # THE docs/ EXCEPTIONS — FIVE FILES, ENUMERATED MECHANICALLY, not a
          # tree (2026-08-14,
          # BL-20260814-COVERAGE-MATRIX-SHORTCIRCUITS-THE-SUITE-THAT-READS-IT).
          #
          # The exclusion above is justified by "the suite's assertions over
          # them are owned by the separate `guards` job". That premise is
          # PER-FILE and had only ever been applied per-TREE. Measured: PR #9208
          # changed only the exit-coverage matrix, short-circuited to a
          # TEN-SECOND green pytest-run, merged, and left main RED — the fourth
          # instance of the class this filter's own header enumerates.
          #
          # So the set below was derived by SCANNING tests/ for a docs/ path
          # joined onto the repo root, rather than by thinking hard about it —
          # hand-enumeration is the failure mode that produced instances 1-4.
          # Test files carrying a docs/ path literal are re-derived on every
          # run by test_docs_committed_readers_are_all_covered; these are the
          # ones reading a COMMITTED docs/ file (the rest write fixtures
          # under tmp_path):
          #
          #   docs/research/exit-refinement-coverage.json  test_exit_head_per_leg
          #   docs/research/m20-sweep-corpus.jsonl         test_m20_regime_book_provenance
          #   docs/claude/system-actions.md                tests/ops/test_system_actions_workflow
          #   docs/ARCHITECTURE-CANONICAL.md               test_audit_verification_checklist
          #   docs/research/m20-exit-head-rounds.jsonl     test_exit_head_round_emits_evidence
          #   docs/claude/impossibility-claim-baseline.json
          #                                               test_impossibility_claim_ratchet —
          #     the baseline records the ALLOWED per-file claim counts, so a docs-only
          #     PR that RAISES them is precisely the diff that must not short-circuit.
          #
          # THE COST IS REAL AND IS BEING PAID DELIBERATELY. ARCHITECTURE-
          # CANONICAL.md is edited by many docs-only PRs, and each now pays a
          # full ~8-min suite. It is included anyway because
          # `test_live_repo_checklist_clean` asserts the live doc has no drift
          # and the ONLY other check of that property is the WEEKLY
          # doc-audit-weekly.yml — `arch-doc-guard` runs a different script and
          # does not cover it. A check that a docs PR can silently skip is not a
          # check. The cheaper alternative — move those four assertions into the
          # `guards` job, which never short-circuits — is the recorded follow-up
          # on the backlog row; it is a bigger change than this one.
          #
          # Pinned in tests/test_pytest_run_filter.py::COVERED.
          if echo "$FILES" | grep -Eq '\.py$|requirements(-test)?\.txt$|pytest\.ini$|setup\.cfg$|pyproject\.toml$|^config/|^\.github/workflows/|^\.github/actions/|^scripts/|^deploy/|^comms/|^docs/research/exit-refinement-coverage\.json$|^docs/research/m20-sweep-corpus\.jsonl$|^docs/claude/system-actions\.md$|^docs/ARCHITECTURE-CANONICAL\.md$|^docs/research/m20-exit-head-rounds\.jsonl$|^docs/research/m20-fold-dispersion-arms-consolidated\.jsonl$|^docs/research/m20-fold-dispersion-2026-08-15\.md$|^docs/claude/impossibility-claim-baseline\.json$|^ml/|^automation/|^research/|^\.claude/|^\.env\.example$|^tests/|^data/backtest_candles\.csv$|^data/btc_1m_sample\.csv$|^data/ict_validate_manifest\.csv$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No code/config/workflow files changed — skipping the pip install + test-run steps (short-circuit, MB-20260706-CI-MINUTES)."
          fi

      - name: Set up Python 3.11
        if: steps.changed.outputs.relevant == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime + test dependencies
        if: steps.changed.outputs.relevant == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        if: steps.changed.outputs.relevant == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Real execution (no --collect-only, no `|| true`): the job
          # reports honest pass/fail so the advisory signal is truthful.
          # --ignore=tests/test_main_loop.py mirrors pytest-collect: that
          # module imports the live trading entrypoint.
          # --junitxml feeds the failure-summary step below so the failing
          # test names land in the GitHub job summary. The run log is not
          # readable from a web Claude session, so without this a failure is
          # a multi-round guess (the 2026-05-28 time-bomb-test incident: a
          # clock-relative insights test reddened pytest-run and it took a
          # full local-repro to name it).
          pytest -q tests/ \
            --ignore=tests/test_main_loop.py \
            --junitxml=pytest-report.xml

      - name: Summarize failing tests in the job summary
        if: failure()
        run: |
          # Parse the JUnit report into the Checks-tab job summary so the
          # culprit test(s) are visible in one click — no log-diving, no
          # local repro. Always exits 0 so it never masks the real failure.
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, html, sys, xml.etree.ElementTree as ET

          print("### pytest-run failures\n")
          reports = glob.glob("pytest-report.xml")
          if not reports:
              print("_No JUnit report produced — the job failed before tests ran "
                    "(collection / import / dependency error). See the raw step log._")
              sys.exit(0)

          fails = []
          for path in reports:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  bad = tc.find("failure")
                  if bad is None:
                      bad = tc.find("error")
                  if bad is None:
                      continue
                  name = "::".join(p for p in (tc.get("classname"), tc.get("name")) if p)
                  lines = (bad.get("message") or "").strip().splitlines()
                  fails.append((name, lines[0] if lines else ""))

          if not fails:
              print("_JUnit report listed no failing testcases — the job likely "
                    "failed at a non-test step._")
          else:
              print(f"**{len(fails)} failing test(s):**\n")
              for name, msg in fails:
                  print(f"- `{name}` — {html.escape(msg)[:200]}")
          PY
