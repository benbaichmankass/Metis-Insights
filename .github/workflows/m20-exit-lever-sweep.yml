name: m20-exit-lever-sweep

# M20 exit-lever sweep — the DESIGN pass the capture census (2026-08-10) sized.
#
# The census is the reason this workflow exists and the reason its defaults look
# the way they do. Two things it established, both of which change how a sweep
# must be run:
#
#  1. TARGETED, NOT FLEET-WIDE. 2,443R of giveback sits at the 1R rung across 44
#     trail legs, and it is CONCENTRATED: the ten legs defaulted below carry
#     ~1,400R of it. `trend_donchian_1h` alone is 316R at a 40.1% lose-after-+1R
#     rate with NEGATIVE R-weighted capture. Sweeping all 44 at once buys ~40%
#     more coverage for ~4x the wall-clock and dilutes the read.
#
#  2. LIVE-PARITY GEOMETRY IS THE DEFAULT HERE (tp_cap_pct 0.099), which is the
#     opposite of the census default and deliberate.
#     BL-20260810-BACKTEST-DOES-NOT-MODEL-THE-LIVE-CAPPED-TP: production places
#     tp = min(entry*1.099, entry + tp_r*risk) with NO venue branch in any of the
#     four units, and the harnesses modelled no TP at all. A lever tuned against
#     a book that cannot take profit is tuned against a book production does not
#     run — `tqqq_trend_long_1d` goes 32 -> 75 trades and median capture +0.40 ->
#     +1.05 once the real geometry is modelled. Every pre-2026-08-10 verdict was
#     measured on the wrong exit; this workflow does not repeat that.
#     Pass tp_cap_pct=0 only to reproduce a historical verdict.
#
# WHAT IT DOES NOT DO: grade anything Path B. `net_r_per_capital_day` is REPORTED
# for every cell (including Path-A rejects — those ARE the Path B population), and
# the two Path B thresholds stay deliberately UNSET until the operator sets them
# from the measured distribution. Same discipline as scripts/capital_efficiency.py.
#
# FREE RUNNERS, NOT THE TRAINER (docs/claude/vm-resource-management.md): one job
# per leg, $0, and the 1-core trainer stays free for ML work.

on:
  workflow_dispatch:
    inputs:
      legs:
        description: "CSV of leg names to sweep. Empty = the census-identified top-10 by R-left-at-1R."
        required: false
        default: ''
      tp_cap_pct:
        description: "TP geometry. 0.099 = LIVE PARITY (default, what production places). 0 = the legacy no-TP geometry every pre-2026-08-10 verdict used."
        required: false
        default: '0.099'
      levers:
        description: "CSV of matrix lever columns to sweep (stale_stop,giveback_stop,trail_geometry,trail_decay,vol_trail). Empty = all."
        required: false
        default: ''
      split:
        description: "IS/OOS boundary DATE — but read split_mode first: under the default oos-trades mode this is only the FALLBACK, not the boundary. Set split_mode=date to make this the actual split."
        required: false
        default: '2025-07-01'
      split_mode:
        description: "How the boundary is placed. oos-trades (default) DERIVES a per-leg date targeting DEFAULT_SPLIT_TARGET_OOS (50 since #9748, NOT the 25 floor — see split_target_oos below), so a low-frequency leg is gradeable — the `split` input above is then only a fallback. date = the legacy fixed calendar split, and the ONLY way to reproduce or compare against a pre-2026-08-13 row."
        required: false
        type: choice
        options: ['oos-trades', 'date']
        default: 'oos-trades'
      split_target_oos:
        description: "How many OOS trades the derived boundary AIMS AT (oos-trades mode only). Empty = the script default DEFAULT_SPLIT_TARGET_OOS, which is 50 (operator Tier-3 decision, #9748, 2026-08-16). The TARGET (where do we cut?) and the FLOOR MIN_OOS_TRADES=25 (is this cell gradeable?) are deliberately two different numbers — do NOT re-couple them. They used to share one value, and that WAS the bug: targeting exactly the floor meant a shortfall of one trade landed below it, and the lever-OFF arm measured OOS 23/24/24/24/23 on five legs (all ungradeable) against 25 on the one that passed (BL-20260814-SPLIT-TARGETS-EXACTLY-THE-FLOOR-SO-BOUNDARY-LOSS-ALWAYS-FAILS). Raising the TARGET to 50 drops nothing; raising the FLOOR to 50 would drop 32 legs to 20, which is a separate question this input cannot reach. ⚠️ Empty NO LONGER reproduces a pre-2026-08-14 run — pass 25 explicitly for that."
        required: false
        default: ''
      fee_bps_roundtrip:
        description: "Roundtrip fee in bps. Empty = the harness default (7.5). Set 15 for the fee-SURVIVAL arm — SRQ-20260618-003 rejected the 5m scalp alts because they were +50R at 7.5bps and -38R at 15bps, and the entire corpus is 7.5bps, so that arm was unrunnable until now."
        required: false
        default: ''
      min_confidence_override:
        description: "Entry-selectivity floor imposed on EVERY leg, replacing its config-declared min_confidence. Empty = config-exact (each leg keeps its own). The surviving arm of SRQ-20260618-003: the 15bps run showed halving the trade COUNT does not clear the fee band, leaving 'raise the edge per trade' untested. Note an explicit 0 is NOT empty — it imposes a zero floor on legs that declare one."
        required: false
        default: ''
      without_declared_levers:
        description: "LEVER-OFF ARM. CSV of declared levers (stale_stop,giveback_stop,trail_decay,vol_trail) to REMOVE from each leg's config-exact base, measuring ONE cell that puts each back at the leg's own live values. Empty = the ordinary arm. This is the only way to grade a SHIPPED lever: the shipped lever IS the base, so a normal cell reproducing it measures the base against itself — 31 of 860 corpus rows are exactly that, all-zero deltas labelled `is_oos_fail`/`insufficient_base` (BL-20260813-SWEEP-GRADES-SHIPPED-LEVERS-AGAINST-THEMSELVES). trail_geometry is not offerable: trail_mult has no OFF state."
        required: false
        default: ''
  # A workflow_dispatch-ONLY workflow is not resolvable by filename until it
  # exists on the DEFAULT branch — the dispatch API 404s on a feature branch.
  # This sentinel path is the same escape hatch m20-capture-census.yml uses:
  # touching it registers the workflow and fires the first run from the branch,
  # so the sweep does not have to wait on a merge it is meant to inform.
  push:
    # 2026-09-02 (MI-66): was pinned to literal branch(es) that have since been
    # DELETED from origin, so this push trigger could not fire at all — the
    # workflow was reachable only by `workflow_dispatch`. Generalised to the
    # `claude/**` namespace rather than dropped, because the `paths:` sentinel
    # below is the real trigger (the branch list was only ever a convenience)
    # and the header's documented "re-trigger by committing a new value to that
    # sentinel" had been silently untrue since those branches went away.
    # Enforced by scripts/ci/check_workflow_trigger_reachability.py.
    branches:
      - 'claude/**'
    paths:
      - '.github/exit-lever-sweep-request'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Same shape as m20-capture-census's plan job, and for the same reason: a
  # static matrix cannot be filtered by an input, and an input that is declared
  # but never read is worse than no input (it reports a full result under a
  # narrowed label). An unknown leg name FAILS rather than silently sweeping the
  # default set.
  plan:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.build.outputs.legs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - id: build
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys, yaml
          # DATASET VINTAGE IS LOAD-BEARING (BL-20260809, and the note atop
          # m20-capture-census.yml): /home/ubuntu/m27_data is NOT the trainer's
          # ~/ict-trading-bot/data -- different start dates, different md5.
          # Every ict_scalp verdict was measured on m27_data; every
          # trend/pullback/squeeze/fvg verdict on data/. This job resolves the
          # source PER LEG so a mixed dispatch cannot silently sweep one family
          # against the other family's frames, and the leg's row carries which.
          #
          # The family split is imported from the sweep script rather than
          # restated here. A second copy of `classify` would be free to drift
          # from the one that actually picks the harness, and the failure it
          # would produce -- a scalp leg fetched from data/ -- looks like a
          # clean `data_missing`, not like a bug.
          sys.path.insert(0, "scripts/research")
          from m20_fleet_exit_sweep import classify
          SRC = {"scalp": "/home/ubuntu/m27_data"}
          DEFAULT_SRC = "/home/ubuntu/ict-trading-bot/data"
          # MEASURED default: the ten legs carrying the most R at the giveback
          # ladder's 1R rung, from the 2026-08-10 census at live-parity geometry
          # (docs/research/M20-exit-capture-census-2026-08-10.md). Ordered by
          # R-left so a partial run still covers the biggest pools first.
          #   trend_donchian_1h       316.5R  150/374 (40.1%)  Rwt -0.0150
          #   trend_donchian_eth      189.9R  106/273 (38.8%)
          #   trend_donchian          154.1R   73/181 (40.3%)
          #   trend_donchian_eth_prop 152.2R  103/357 (28.9%)
          #   htf_pullback_trend_2h   111.1R   66/207 (31.9%)
          #   spy_pullback_1h         106.5R   50/137 (36.5%)   <- alpaca, tests
          #   eth_pullback_2h         101.4R   49/136 (36.0%)      cross-venue
          #   qqq_pullback_1h          94.3R   45/144 (31.2%)   <- alpaca
          #   avax_pullback_2h         88.4R   43/126 (34.1%)
          #   trend_donchian_sol       81.8R   47/127 (37.0%)
          DEFAULT = [
              "trend_donchian_1h", "trend_donchian_eth", "trend_donchian",
              "trend_donchian_eth_prop", "htf_pullback_trend_2h",
              "spy_pullback_1h", "eth_pullback_2h", "qqq_pullback_1h",
              "avax_pullback_2h", "trend_donchian_sol",
          ]
          cfg = yaml.safe_load(open("config/strategies.yaml"))
          declared = set(cfg.get("strategies", cfg))
          want = [s.strip() for s in os.environ.get("LEGS", "").split(",") if s.strip()]
          # A `push` to the sentinel carries no dispatch inputs, so `legs` is
          # empty and the run would fall through to the donchian/pullback
          # DEFAULT — silently sweeping ten legs nobody asked for while the
          # sentinel's own prose says "scalp family". The sentinel is therefore
          # authoritative for the run it fires: a `legs:` line in it is read as
          # the selection. An explicit dispatch input still wins, and a sentinel
          # with no `legs:` line still means "the census default", stated rather
          # than inferred.
          src_of_selection = "dispatch input"
          if not want:
              try:
                  for line in open(".github/exit-lever-sweep-request"):
                      line = line.strip()
                      if line.startswith("legs:"):
                          want = [s.strip() for s in line.split(":", 1)[1].split(",")
                                  if s.strip()]
                          src_of_selection = "sentinel file"
                          break
              except OSError:
                  pass
          sel = want or DEFAULT
          if not want:
              src_of_selection = "census default"
          # Validate against config, not against the default list — a leg renamed
          # in config must fail loudly here rather than sweep nothing downstream.
          unknown = [s for s in sel if s not in declared]
          if unknown:
              print(f"::error::legs not declared in config/strategies.yaml: {unknown}",
                    file=sys.stderr)
              raise SystemExit(1)
          # A leg the sweep cannot classify has no harness and no data source.
          # Failing here beats fetching the default vintage and reporting the
          # resulting empty run as a swept leg.
          unclassified = [s for s in sel if classify(s) is None]
          if unclassified:
              print(f"::error::legs with no family/harness: {unclassified}",
                    file=sys.stderr)
              raise SystemExit(1)
          out = [{"leg": s, "family": classify(s),
                  "src": SRC.get(classify(s), DEFAULT_SRC)} for s in sel]
          for row in out:
              print(f"  {row['leg']:26s} family={row['family']:9s} src={row['src']}",
                    file=sys.stderr)
          print(f"sweeping {len(out)} leg(s) — selection from {src_of_selection}",
                file=sys.stderr)
          print("legs=" + json.dumps(out))
          PY

  sweep:
    needs: plan
    runs-on: ubuntu-latest
    # 330 min, not 150. Measured, not padded: the 2026-08-10 census timed one
    # full-history ict_scalp_5m run at 955s, and a sweep of that leg is base
    # IS+OOS (1 full history) + 5 cells x 2 windows (5) + a 2-full-history
    # walk-forward per candidate. Five candidates puts the worst case near
    # 4.5h. The hourly/daily donchian and pullback legs finish in minutes and
    # are unaffected by a ceiling they never approach; a job that dies at 150
    # having produced nothing is the outcome worth avoiding, and the runner is
    # free either way.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        leg: ${{ fromJSON(needs.plan.outputs.legs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch this leg's frames from the trainer (scp)
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
          SRC: ${{ matrix.leg.src }}
          FAMILY: ${{ matrix.leg.family }}
        run: |
          set -e
          if [ -z "${VM_SSH_KEY}" ]; then echo "::error::VM_SSH_KEY unset"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key
          chmod 600 ~/.ssh/trainer_key
          ssh-keyscan -t ed25519,ecdsa,rsa "${TRAINER_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p sweep_data
          # SRC is resolved per-leg by the plan job from the leg's FAMILY, not
          # hardcoded here: scalp legs need /home/ubuntu/m27_data, everything
          # else the trainer's data/. Sweeping a scalp leg against data/ would
          # not error — it would quietly measure a different population.
          echo "family=${FAMILY} src=${SRC}"
          scp -i ~/.ssh/trainer_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=25 \
              "${TRAINER_USER}@${TRAINER_IP}:${SRC}/*.csv" \
              sweep_data/ || true
          n=$(ls sweep_data/*.csv 2>/dev/null | wc -l)
          echo "frames fetched: ${n}"
          # A silent-empty here would make the leg read data_missing and the sweep
          # would report "no cells evaluated" as though that were a verdict.
          if [ "${n}" -eq 0 ]; then
            echo "::error::no frames fetched — the sweep would be a false negative"
            exit 1
          fi

      - name: Sweep this leg
        env:
          LEG: ${{ matrix.leg.leg }}
          TP_CAP_PCT: ${{ inputs.tp_cap_pct || '0.099' }}
          FEE_BPS: ${{ inputs.fee_bps_roundtrip }}
          MIN_CONF: ${{ inputs.min_confidence_override }}
          LEVERS: ${{ inputs.levers }}
          SPLIT: ${{ inputs.split || '2025-07-01' }}
          # WHY this is plumbed (2026-08-13): the sweep's --split-mode
          # defaults to `oos-trades`, so it DERIVES a per-leg boundary and
          # `--split` is only the fallback. This workflow passed --split and
          # never --split-mode, so a caller asking for 2025-07-01 silently got
          # a derived date instead, and the corpus row could not say which
          # (it recorded `split: null` until the extractor fix). Measured on
          # trend_donchian_sol_prop at one tp_cap: derived OOS 24 vs fixed OOS
          # 65, which crossed the 25-trade floor and turned every gradeable
          # cell `insufficient_base`. Exposing the mode is what makes a
          # pre-2026-08-13 row reproducible at all.
          SPLIT_MODE: ${{ inputs.split_mode || 'oos-trades' }}
          # WHY this is plumbed (2026-08-14): the sweep's --split-target-oos
          # DEFAULTS TO MIN_OOS_TRADES ITSELF, so the derived boundary aims at
          # exactly the number the verdict requires and any shortfall lands
          # below the floor. That is not a hypothetical: the nine-pair lever-OFF
          # arm dispatched this morning returned base OOS 23/24/24/24/23 on the
          # five legs it could measure -- ALL FIVE `insufficient_base` -- while
          # the single leg that reached 25 (trend_donchian_avax_4h) returned a
          # PASS. Six measured cells, one gradeable, and the difference was one
          # or two trades. Until this input existed the workflow could not ask
          # for a margin at all: the CLI flag has existed since #8965 and only
          # the relay path could reach it, so the autonomous path was locked to
          # the value most likely to produce no verdict.
          # Empty = the script's own default (the floor), which is what every
          # pre-2026-08-14 run used -- so an omitted value REPRODUCES history
          # rather than silently changing it.
          SPLIT_TARGET_OOS: ${{ inputs.split_target_oos }}
          WITHOUT: ${{ inputs.without_declared_levers }}
        run: |
          set -o pipefail
          # The CLI takes --without-declared-lever REPEATABLY (argparse append),
          # so the CSV input is expanded into one flag per lever. It cannot ride
          # the `${VAR:+--flag "$VAR"}` idiom the other inputs use: that would
          # pass "stale_stop,vol_trail" as a single value, which argparse would
          # refuse against its choices list — a loud failure, but only after the
          # data fetch, and only for multi-lever runs.
          WDL_ARGS=()
          if [ -n "${WITHOUT}" ]; then
            IFS=',' read -ra _levs <<< "${WITHOUT}"
            for _l in "${_levs[@]}"; do
              _l="$(echo "${_l}" | tr -d '[:space:]')"
              [ -n "${_l}" ] && WDL_ARGS+=(--without-declared-lever "${_l}")
            done
            echo "LEVER-OFF ARM: ${WDL_ARGS[*]}"
          fi
          python3 scripts/research/m20_fleet_exit_sweep.py \
            --data-dir sweep_data \
            --only "${LEG}" \
            --split "${SPLIT}" \
            --split-mode "${SPLIT_MODE}" \
            ${SPLIT_TARGET_OOS:+--split-target-oos "${SPLIT_TARGET_OOS}"} \
            --tp-cap-pct "${TP_CAP_PCT}" \
            ${FEE_BPS:+--fee-bps-roundtrip "${FEE_BPS}"} \
            ${MIN_CONF:+--min-confidence-override "${MIN_CONF}"} \
            ${LEVERS:+--levers "${LEVERS}"} \
            "${WDL_ARGS[@]}" \
            --out "out/${LEG}" 2>&1 | tee sweep.out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exit-lever-sweep-${{ matrix.leg.leg }}
          path: out/${{ matrix.leg.leg }}
          if-no-files-found: warn

      - name: Post the sweep back onto the PR
        if: always()
        uses: actions/github-script@v7
        env:
          LEG: ${{ matrix.leg.leg }}
          TP_CAP_PCT: ${{ inputs.tp_cap_pct || '0.099' }}
          SPLIT: ${{ inputs.split || '2025-07-01' }}
          SPLIT_MODE: ${{ inputs.split_mode || 'oos-trades' }}
          SPLIT_TARGET_OOS: ${{ inputs.split_target_oos }}
          FEE_BPS: ${{ inputs.fee_bps_roundtrip }}
          MIN_CONF: ${{ inputs.min_confidence_override }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const leg = process.env.LEG;
            const dir = `out/${leg}`;
            // Branch on the actual STAGE, never a single confident label — the
            // census's first version posted "this is a FAILED run" over five
            // runs that had all succeeded (diagnostic-provenance sub-class A).
            let body = '', stage = 'unknown', summaryPath = null;
            try {
              const dated = fs.readdirSync(dir)
                .map(d => path.join(dir, d))
                .filter(p => fs.existsSync(path.join(p, 'SUMMARY.md')))
                .sort();
              if (dated.length) summaryPath = path.join(dated[dated.length - 1], 'SUMMARY.md');
              else if (fs.existsSync(path.join(dir, 'SUMMARY.md')))
                summaryPath = path.join(dir, 'SUMMARY.md');
              stage = summaryPath ? 'ok' : 'ran_no_summary';
            } catch (e) { stage = 'no_output_dir'; }
            if (stage === 'ok') {
              body = fs.readFileSync(summaryPath, 'utf8');
            } else {
              let tail = '';
              try { tail = fs.readFileSync('sweep.out', 'utf8').slice(-3000); }
              catch (e2) { tail = '(no sweep output captured)'; }
              const why = stage === 'no_output_dir'
                ? `no \`${dir}\` directory — the sweep did not get far enough to create one`
                : `\`${dir}\` exists but contains no SUMMARY.md — the sweep ran and did not write one`;
              body = `**No SUMMARY to post** (${why}). Sweep stdout below; read it before calling this a failed measurement.\n\n\`\`\`\n${tail}\n\`\`\``;
            }
            const {data: prs} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha,
            });
            const pr = prs.find(p => p.state === 'open') || prs[0];
            if (!pr) {
              core.setFailed(`no PR found for ${context.sha} — sweep for ${leg} computed but has nowhere to go`);
              return;
            }
            // The banner states what the run REQUESTED, never what was applied.
            // `base_args` applies --tp-cap-pct only to LIVE_TP_CAPPED_FAMILIES
            // (only those units carry _TP_SENTINEL_CAP_PCT), so this banner used
            // to print "LIVE-PARITY (capped TP 0.099)" on the 8 ict_scalp legs
            // and fvg_range_15m, whose units carry no cap at all — asserting a
            // geometry the code did not apply, on the one line whose entire job
            // is to say which geometry produced the numbers below it.
            // The APPLIED, per-leg truth is emitted by the sweep (which owns the
            // family and the allowlist) as a `- geometry (leg): ...` line in the
            // SUMMARY embedded below; duplicating the allowlist here would be a
            // second source of truth free to drift from the deciding one.
            const cap = process.env.TP_CAP_PCT;
            const geom = (cap && cap !== '0')
              ? `capped TP \`${cap}\` REQUESTED — applied only to families whose unit carries the cap; see the per-leg \`geometry\` line below for what this leg actually ran`
              : `legacy (no TP cap) requested — the geometry every pre-2026-08-10 verdict used, NOT what production runs`;
            // EVERY AXIS THAT MOVES THE NUMBERS BELONGS ON THIS LINE. The banner
            // named only geometry + split, so a fee arm and a config-exact run
            // posted visually identical comments and the reader had to know which
            // dispatch produced which. That bit on 2026-08-12: three confidence
            // arms plus a 15bps control were in flight at once, indistinguishable
            // from the comment alone. A label that does not state what varied is
            // the unprovenanced-diagnostic class this repo already guards for.
            // "(harness default)" / "(config-exact per leg)" are STATED rather
            // than left blank -- an omitted axis reads as "not applicable", which
            // is a different claim from "not overridden".
            // SPLIT IS A REQUEST, NOT A BOUNDARY -- the same correction the
            // geometry line above already carries, applied to the axis next to
            // it. Under the default `--split-mode oos-trades` the boundary is
            // resolved PER LEG by `resolve_split()` and `--split` is only the
            // fallback date, so printing it bare asserted one shared calendar
            // cut across every leg's comment. Measured on the 2026-08-15
            // pullback re-sweep: 17 comments said "IS/OOS split `2025-07-01`"
            // and 16 legs had run at a different derived boundary; the one that
            // matched did so because its derivation FAILED and fell back.
            // The APPLIED, per-leg boundary is emitted by the sweep (which is
            // where resolve_split runs) as a `- split (leg): ...` line in the
            // SUMMARY embedded below -- same single-source rule as geometry.
            const splitTxt = (process.env.SPLIT_MODE && process.env.SPLIT_MODE !== 'date')
              ? `IS/OOS split DERIVED per leg (split_mode \`${process.env.SPLIT_MODE}\``
                + (process.env.SPLIT_TARGET_OOS ? `, targeting \`${process.env.SPLIT_TARGET_OOS}\` OOS trades` : '')
                + `; \`${process.env.SPLIT}\` is only the FALLBACK date) — legs do NOT share a boundary, `
                + `see the per-leg \`split\` line below for what this leg actually cut at`
              : `IS/OOS split \`${process.env.SPLIT}\` (split_mode \`date\` — the same fixed boundary for every leg)`;
            const feeTxt = process.env.FEE_BPS
              ? `\`${process.env.FEE_BPS}\` bps roundtrip`
              : '`(harness default)`';
            const confTxt = process.env.MIN_CONF
              ? `min_confidence floor \`${process.env.MIN_CONF}\` IMPOSED on every leg`
              : 'min_confidence `(config-exact per leg)`';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number,
              body: `### Exit-lever sweep — \`${leg}\`\n\nGeometry: ${geom}. ${splitTxt}. `
                  + `Fee: ${feeTxt}. Entry selectivity: ${confTxt}. `
                  + `\`net_r_per_capital_day\` is REPORTED for every cell, including Path-A rejects — Path B's thresholds stay unset.\n\n`
                  + `${body}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });

  # ------------------------------------------------------------------ corpus
  # THE EVIDENCE WAS BEING DISCARDED EVERY RUN. `verdicts.json` carries exactly
  # what a Path B threshold has to be derived from — per-cell IS/OOS deltas,
  # capital rates, the derived drawdown allowance, walk-forward folds — and it
  # went to an Actions **artifact**, which no Claude session can download
  # (CLAUDE.md § PM-side session capabilities). The PR comment carries a top-30
  # slice of one table. So every sweep restarted the population from zero, and
  # the operator's standing ask for a number derived from capital-utilisation +
  # PnL data had no accumulating corpus to derive it from.
  #
  # ONE aggregate job, not a commit per matrix leg: ten parallel jobs pushing to
  # the same branch would race, and the loser's rows would be lost — silently,
  # which is the failure mode least likely to be noticed. `download-artifact`
  # works INSIDE the workflow even though a session cannot reach it from outside.
  corpus:
    needs: sweep
    # `always()`: a partially-failed matrix still produced real rows for the legs
    # that finished, and those are evidence. The extractor FAILS on zero verdicts
    # files, so an empty run cannot be committed as a no-op — "the sweep added
    # nothing" and "nothing was extracted" are different statements.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: exit-lever-sweep-*
          path: sweep_out
          merge-multiple: false
      - name: Merge this run into the corpus
        run: |
          set -o pipefail
          python3 scripts/research/m20_corpus_extract.py \
            --in sweep_out \
            --corpus docs/research/m20-sweep-corpus.jsonl | tee extract.out
      - name: Commit the corpus
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # PRESERVE THE EXTRACTOR THIS RUN WAS DISPATCHED WITH, before any git
          # operation below can revert it.
          #
          # `rebase_onto_target`'s conflict path does `git reset --hard
          # origin/$TARGET` and then re-runs the extractor. That reset reverts
          # the ENTIRE worktree — including `m20_corpus_extract.py` itself — to
          # the corpus branch's copy, so the re-derive runs the TARGET BRANCH's
          # extractor, not this run's. Every field added to the extractor since
          # that branch last moved is then silently absent from the rows, and
          # nothing says so: the job is green, the summary reports the full row
          # count, and the rows look complete.
          #
          # MEASURED (2026-08-16, run 31976325152): the conflict path fired, the
          # reset landed on 9a085926 — 123 commits behind main — and all 52 rows
          # came back missing the eight `live_tp_reach_r_*` keys #9037 added.
          # The verdicts were unaffected (those are computed upstream, in
          # verdicts.json); the loss is confined to the corpus row schema.
          #
          # This is NOT a rare concurrency edge. The corpus branch never merges
          # main, so a main-dispatched run rebases main's whole history onto a
          # long-diverged branch and takes add/add conflicts across dozens of
          # unrelated files EVERY time. The conflict path is the normal path,
          # which is exactly why the downgrade went unnoticed.
          #
          # The extractor is stdlib-only and imports nothing from the repo
          # (verified: argparse/json/sys/pathlib), so running it from outside
          # the worktree is safe. Copied rather than `git checkout`-ed so it
          # never enters the index — the corpus branch must receive the JSONL,
          # not a scripts change.
          cp scripts/research/m20_corpus_extract.py "$RUNNER_TEMP/extract_dispatched.py"
          # THE UNION SCRIPT IS **NOT** STDLIB-ONLY — it imports
          # `measurement_key` from the extractor BY NAME, deliberately, so the
          # two can never disagree about what counts as the same measurement.
          # That breaks the invariant stated directly above, so the extractor is
          # ALSO copied under its REAL module name: the union script inserts its
          # own directory on `sys.path`, and `extract_dispatched.py` is not an
          # importable `m20_corpus_extract`. Two copies of one small file, each
          # with a distinct job — the mangled name is what the re-derive CALLS,
          # the real name is what the union script IMPORTS.
          cp scripts/research/m20_corpus_extract.py "$RUNNER_TEMP/m20_corpus_extract.py"
          cp scripts/research/m20_corpus_union.py "$RUNNER_TEMP/union_dispatched.py"
          # The extractor FAILS on zero verdicts files, so reaching this step
          # means rows were produced. If the file is nonetheless absent, the
          # extractor and this step disagree about where it writes — a wiring
          # bug, not an empty run, and it must not exit 0.
          if [ ! -s docs/research/m20-sweep-corpus.jsonl ]; then
            echo "::error::the extractor reported success but "
            echo "docs/research/m20-sweep-corpus.jsonl is missing or empty."
            exit 1
          fi
          # STAGE FIRST, then diff the INDEX.
          #
          # `git diff --quiet -- <path>` compares the worktree to the index and
          # is silent about a file git is not tracking — so on the run that
          # CREATES the corpus it reports "no change" and this step exits 0
          # having committed nothing, under a message asserting there was
          # nothing to commit. That is exactly the unasserted-denominator shape
          # (an empty result read as a clean negative), and it happened: the
          # first corpus run (2026-08-10, run 31437165771) went green across all
          # 12 jobs, produced all 10 artifacts, and left the branch untouched.
          git add docs/research/m20-sweep-corpus.jsonl
          if git diff --cached --quiet -- docs/research/m20-sweep-corpus.jsonl; then
            echo "corpus byte-identical to the committed copy — this run "
            echo "superseded rows that matched what was already recorded."
            exit 0
          fi
          # WHERE the corpus lands. A sweep dispatched on the default branch
          # cannot push its rows there: branch protection declines the write
          # with `GH006 ... 3 of 3 required status checks are expected`, and a
          # bare commit has no way to satisfy a required check. That is
          # STRUCTURAL, not a race — so retargeting is the fix and retrying is
          # not (see the push loop below).
          #
          # Measured 2026-08-12: four dispatches (runs 31647462929, 31648068353,
          # 31648088122, 31648666524), 11 of 12 jobs green each, all ten legs
          # swept, every artifact uploaded — and every row discarded at this one
          # step. The sweep looked like it failed; it had actually succeeded and
          # then thrown the evidence away, which is the more expensive shape
          # because the compute is spent before the loss.
          # Tracked as BL-20260812-SWEEP-CORPUS-CANNOT-PUSH-TO-MAIN
          # (kept on ONE line: check_backlog_refs stops at the first
          # non-alphanumeric, so a wrapped id resolves to nothing).
          #
          # So: a PR-branch dispatch pushes to its own branch as before; a
          # default-branch dispatch is retargeted onto a corpus branch, which
          # PRESERVES THE ROWS. That is the whole job of this path.
          #
          # ⚠️ IT DOES NOT OPEN THE PR, AND CANNOT. This block used to claim it
          # did, via `claude-pr-automerge.yml`'s request file. MEASURED
          # 2026-08-13 on the first real default-branch dispatch (run
          # 31657293634): the push landed 72 rows on the corpus branch and
          # triggered **ZERO** workflow runs — not the automerge (3 lifetime
          # runs, newest 2026-08-04), and not CI either. Every run that branch
          # has is `event=pull_request`, created the moment a SESSION opened the
          # PR by hand.
          #
          # Cause: GitHub does not start workflows from events produced with a
          # workflow's own `GITHUB_TOKEN` (the recursion guard). So the opt-in
          # file is written and never read, and — the part that kills every
          # variant of this — a PR opened by this job would get no checks
          # either, leaving it permanently un-mergeable behind required checks.
          # Having the job call the PR API instead would look MORE automatic
          # and be no more automatic.
          #
          # A fully-automatic path therefore needs a credential that is not
          # `GITHUB_TOKEN` (a PAT with repo write). Originating that value is
          # the operator's, not this workflow's — so until it exists this path
          # ends with a LOUD, accurate hand-off rather than a claim that
          # something downstream will finish the job.
          # BL-20260813-CORPUS-RETARGET-CANNOT-OPEN-ITS-OWN-PR
          TARGET="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          RETARGETED=0
          if [ "$TARGET" = "${DEFAULT_BRANCH:-main}" ]; then
            TARGET="claude/m20-sweep-corpus"
            RETARGETED=1
            echo "::notice::dispatched on ${DEFAULT_BRANCH:-main} (protected) — "
            echo "routing the corpus to '$TARGET' to preserve the rows."
            # ⚠️ The file is named for the TARGET BRANCH, and must stay that way.
            # `claude-pr-automerge` now proves the ask against the branch's own
            # name (`claude/m20-sweep-corpus` -> `m20-sweep-corpus.txt`) because a
            # `paths:` filter cannot tell "I asked" from "I merged someone else's
            # ask" — three PRs were armed through that gap on 2026-09-02. A file
            # under any other name here would be silently ignored.
            mkdir -p .github/pr-automerge-requests
            {
              echo "m20 exit-lever sweep corpus — run ${GITHUB_RUN_ID:-unknown}"
              echo "Opt-in marker for claude-pr-automerge.yml. NOTE: a push made"
              echo "with GITHUB_TOKEN does not start workflows, so this file is"
              echo "NOT read on this path — it is written so the branch is ready"
              echo "the moment a credential that CAN trigger it exists."
            } > .github/pr-automerge-requests/m20-sweep-corpus.txt
            git add .github/pr-automerge-requests/m20-sweep-corpus.txt
          fi
          echo "corpus target branch: $TARGET (retargeted=$RETARGETED)"
          # Message via a FILE, not an inline -m: the extractor's summary is
          # multi-line, and embedding it inline here breaks out of this block
          # scalar (which is a YAML parse error, not a runtime one — it fails
          # the whole workflow at load).
          # ONE writer for the message, called again after any re-derive.
          #
          # The message must describe the extraction whose output is actually
          # being committed. It used to be built ONCE here and then REUSED by
          # the conflict path below, which re-runs the extractor — so every
          # conflict-path commit carried the counts of a computation whose
          # result had been discarded by the intervening `reset --hard`.
          #
          # MEASURED (2026-08-17, corpus commit 54e9b63e): the message read
          # `superseded: 0 ... corpus now: 1316 rows` while the file it
          # committed held 998 rows with 52 rows superseded. Both numbers were
          # real; only one described the commit. That is the unprovenanced-
          # diagnostic class — a confident label over a different computation —
          # and it is the reason verifying that repair had to read the FILE and
          # could not trust the message.
          write_commitmsg() {
            {
              echo "corpus: merge exit-lever sweep run $(date -u +%Y-%m-%dT%H:%MZ)"
              echo
              cat extract.out
              echo
              echo "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            } > .commitmsg
          }
          write_commitmsg
          git commit -F .commitmsg
          # .commitmsg is deliberately NOT removed here — the re-derive path
          # below rewrites it from ITS OWN extract.out before committing. It is
          # cleaned on the success exit, and it is untracked either way so it
          # cannot reach a commit.
          # The branch may have moved while the sweep ran (hours, in the scalp
          # case). Rebase-and-retry rather than force: another session's commits
          # on this branch are not ours to discard.
          #
          # A rebase CONFLICT here is not a failure to recover from by hand —
          # the corpus is append-only JSONL, so "both sides added rows" is the
          # NORMAL concurrent outcome and the union of the two is the right
          # answer. Re-running the extractor on top of their copy produces
          # exactly that union, and `sweep_out/` is still in the workspace, so
          # it costs nothing. Aborting instead would discard this run's rows for
          # the same reason the push did.
          rebase_onto_target() {
            git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1 || return 0
            git pull --rebase origin "$TARGET" && return 0
            echo "::notice::rebase conflicted on the corpus — re-deriving the "
            echo "union from their copy rather than dropping this run's rows."
            git rebase --abort || true
            git fetch origin "$TARGET"
            git reset --hard "origin/$TARGET"
            # ---- restore what the reset just discarded, BEFORE extracting ----
            #
            # The reset above replaced the worktree corpus with the CORPUS
            # BRANCH's copy. That branch never merges the default branch, so
            # every row the default branch has and it does not is gone — and
            # extracting on top of it would commit that loss as the new state.
            #
            # MEASURED 2026-08-17, before this union existed: default branch
            # 1264 rows, corpus branch 1004, with **360 rows on the default
            # branch alone**. #9823 closed that by hand; without this step the
            # very next dispatch re-opened it. The hand union is not repeatable
            # and the divergence is structural, so it is fixed here.
            #
            # ⚠️ THE MERGE RULE IS `sweep_generated_at`, NOT "the default branch
            # wins" and NOT "the corpus branch wins". Measured on that same
            # pair: 904 shared keys, 19 differ, and on ALL 19 the DEFAULT branch
            # was newer and complete (8 `live_tp_reach_r_*` keys vs 0). A
            # side-wins union re-drops exactly the schema the dispatched-extractor
            # fix above exists to protect. The script refuses (exit 2) rather
            # than guessing when a timestamp cannot order two rows, and that
            # exit is deliberately NOT swallowed — a corpus it cannot merge
            # unambiguously must stop the job, not silently pick.
            git fetch origin "${DEFAULT_BRANCH:-main}"
            if git show "origin/${DEFAULT_BRANCH:-main}:docs/research/m20-sweep-corpus.jsonl" \
                 > "$RUNNER_TEMP/default_corpus.jsonl" 2>/dev/null; then
              python3 "$RUNNER_TEMP/union_dispatched.py" \
                --into docs/research/m20-sweep-corpus.jsonl \
                --from "$RUNNER_TEMP/default_corpus.jsonl"
            else
              # The default branch carries no corpus yet (first-ever run). That
              # is a real state, not a failure — say so rather than letting a
              # silent skip read as a completed union.
              echo "::notice::no corpus on ${DEFAULT_BRANCH:-main} to union in "
              echo "(first run?) — proceeding with the corpus branch's copy."
            fi
            # THE DISPATCHED extractor, not the one the reset just restored.
            # See the cp at the top of this step for why: re-deriving with
            # `scripts/research/m20_corpus_extract.py` here reads the corpus
            # branch's long-stale copy and silently drops every field added
            # since, producing rows that look complete and are not.
            python3 "$RUNNER_TEMP/extract_dispatched.py" \
              --in sweep_out \
              --corpus docs/research/m20-sweep-corpus.jsonl | tee extract.out
            git add docs/research/m20-sweep-corpus.jsonl
            # RE-CREATE, don't re-add. The `reset --hard` above drops a file
            # that was staged-but-new from both the index and the worktree, so
            # a bare `git add` here would fail on a path that no longer exists
            # and the retargeted push would land WITHOUT its automerge opt-in —
            # a corpus branch nobody opens a PR for, which looks like success.
            #
            # `if`, not `A && B`: under `set -e` a false test or a clean
            # `--quiet` diff returns 1 and would abort the whole step.
            if [ "$RETARGETED" = "1" ]; then
              # Named for the target branch — see the note at the first writer.
              mkdir -p .github/pr-automerge-requests
              {
                echo "m20 exit-lever sweep corpus — run ${GITHUB_RUN_ID:-unknown}"
                echo "Touching this file is the opt-in signal for claude-pr-automerge.yml;"
                echo "its contents are ignored. The NAME is the signal, and it must"
                echo "match the target branch slug or the relay ignores it."
              } > .github/pr-automerge-requests/m20-sweep-corpus.txt
              git add .github/pr-automerge-requests/m20-sweep-corpus.txt
            fi
            if git diff --cached --quiet; then
              echo "their copy already contains this run's rows"
              return 0
            fi
            # REBUILD from THIS re-derive's extract.out. Committing the message
            # written before the reset would report the discarded extraction's
            # counts over the rows actually landing here — see write_commitmsg.
            write_commitmsg
            git commit -F .commitmsg
          }
          # `git commit` consumed .commitmsg above; keep it for the re-derive path.
          for i in 1 2 3 4; do
            rebase_onto_target || true
            if git push origin HEAD:"$TARGET" 2>push.err; then
              rm -f .commitmsg push.err
              echo "corpus pushed to $TARGET"
              # A retargeted push is NOT done — the rows are safe but still off
              # `main`, and nothing downstream will move them (see the comment
              # above the retarget). Say so where it cannot be missed: a green
              # job that silently needs a human step is the shape this whole
              # fix exists to stop.
              if [ "$RETARGETED" = "1" ]; then
                {
                  echo "### ⚠️ Corpus rows are on \`$TARGET\`, NOT on ${DEFAULT_BRANCH:-main}"
                  echo
                  echo "Branch protection declined the direct push, so the rows were"
                  echo "retargeted. **They are preserved, and a human/session step remains:**"
                  echo "open a PR from \`$TARGET\` to \`${DEFAULT_BRANCH:-main}\`."
                  echo
                  echo "This job cannot open it: a push or PR made with \`GITHUB_TOKEN\`"
                  echo "starts no workflows, so the PR would carry no checks and could"
                  echo "never satisfy branch protection. Measured 2026-08-13, run"
                  echo "31657293634 — that push triggered ZERO runs."
                  echo
                  echo "Tracked: BL-20260813-CORPUS-RETARGET-CANNOT-OPEN-ITS-OWN-PR"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                echo "::warning::corpus rows are on '$TARGET' and NOT on ${DEFAULT_BRANCH:-main} — open the PR; this job cannot (GITHUB_TOKEN starts no workflows)."
              fi
              exit 0
            fi
            cat push.err
            # A protected-branch decline is not a race. Retrying it four times
            # with backoff burns two minutes to arrive at the same answer and,
            # worse, reports the outcome as a flaky push — which is how this
            # step's real cause stayed hidden across four runs. Fail loudly and
            # immediately, naming the fix.
            if grep -qiE 'GH006|protected branch' push.err; then
              echo "::error::'$TARGET' is protected — a commit cannot satisfy "
              echo "its required checks, so this push can never succeed. Rows "
              echo "are NOT lost: re-dispatch from a claude/** branch, or let "
              echo "the retarget path above route them through a PR."
              exit 1
            fi
            sleep $((2 ** i))
          done
          echo "::error::could not push the corpus to '$TARGET' after 4 attempts"
          exit 1
