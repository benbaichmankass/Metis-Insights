name: Harness-lever-coupling guard

# Fails the PR check when a config/strategies.yaml key on an ENABLED,
# harness-classified strategy is in NONE of the family's PLAIN / LEVER_FLAG
# maps, _UNREPLAYABLE, or the guard's UNMODELLED registry — i.e. a new tuning
# key would silently degrade the strategy's backtest fidelity to `approximate`
# with nobody deciding whether it should be modelled.
# See scripts/check_harness_lever_coupling.py + scripts/research/regime_debt_matrix.py.
# BL-20260730-HARNESS-LEVER-MAP-COUPLING-GUARD.
#
# WHOLE-STATE check (not diff-scoped): it validates the full current
# config/strategies.yaml against the lever maps every run, so it also catches a
# strategy or map change that lands in a different PR — cheap (yaml + one module
# import). No `paths:` filter (a required check must never leave a non-matching
# PR permanently pending — same rule as env-gate-guard).

on:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  harness-lever-coupling-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run the coupling guard
        run: python3 scripts/check_harness_lever_coupling.py

      - name: Self-test (guard detects an injected unclassified key)
        # Belt to the main check: prove the guard still FAILS on a gap, so a
        # future edit that neuters detection can't pass silently.
        run: |
          python3 - <<'PY'
          import importlib.util, sys
          s = importlib.util.spec_from_file_location("g", "scripts/check_harness_lever_coupling.py")
          g = importlib.util.module_from_spec(s); s.loader.exec_module(g)
          strat = {"x": {"donchian": 20, "enabled": True, "symbols": ["BTCUSDT"],
                         "timeframe": "1h", "brand_new_unclassified_lever": 3}}
          gaps = g.find_coupling_gaps(strat)
          assert gaps == [("x", "trend", "brand_new_unclassified_lever")], gaps
          print("self-test OK — guard detects an injected unclassified key")
          PY
