name: research-queue-dispatch

# R5 of docs/research/RESEARCH-WORKFLOW-ARCHITECTURE-2026-08-27.md — the
# scheduler. Reads research/queue/*.yaml, grades each job against the R4 power
# gate, routes it by its DECLARED resource needs, and dispatches.
#
# ⚠️ THE SCHEDULE FIRES FOR REAL as of 2026-08-30 (operator-directed: the point
# of the queue is that experiments run without a session poking them, and a cron
# that only ever reports has not achieved that). A manual `workflow_dispatch`
# still defaults to a DRY RUN — `fire` is opt-in there, so a human poking the
# button by hand does not spend.
#
# ⚠️ THE FIRE DECISION IS MADE EXACTLY ONCE, in the job-level `FIRE` env below,
# and read twice. It MUST stay that way. Before this change the `--fire` flag and
# the "Land the dispatch stamps" step each tested `inputs.fire` independently,
# and on a `schedule` event the `inputs` context is EMPTY — so arming the cron by
# adding `--fire` alone would have fired every due job every day and stamped
# NOTHING, because the stamp step's `if:` could never be true. An unstamped job
# re-fires: that is a runaway, and it is the "one typo away from spending" hazard
# this header used to describe in the abstract.
#
# ⚠️ THE SCHEDULE BRANCH IS UNPROVEN UNTIL IT RUNS. `oci-inventory.yml` records
# the same class (2026-08-20): `github.event_name == 'schedule'` had never once
# been evaluated by GitHub on that workflow, and they proved it with throwaway
# probe crons rather than assuming. Expect ~15 min of GitHub scheduling lag and
# never read a late run as a missed one.
#
# ROLLBACK is one line: drop `github.event_name == 'schedule'` from FIRE below and
# the cron is a dry run again, exactly as before.
#
# Why a dry cron is still worth running: it is the only thing that surfaces a
# queue that has gone invalid, unroutable, or quietly all-blocked. The dispatcher
# exits non-zero on an invalid job and on a queue it could not READ (exit 2,
# distinct from an empty one) — so a broken queue shows up as a red scheduled run
# instead of as silence.
#
# Tier-1: reads the repo, grades, and (only when fired) dispatches other
# workflows. It writes nothing to the live VM and touches no order path.

on:
  schedule:
    # 06:20 UTC daily — after the IB gateway's 06:05 reset window, so a red run
    # here is never just the gateway restarting.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      fire:
        description: "Actually dispatch (default: dry run that reports only)"
        type: boolean
        default: false
      only:
        description: "Dispatch just this job id (e.g. RQ-20260827-001)"
        default: ""
      max_gpu:
        description: "Per-run cap on GPU bursts"
        default: "1"

concurrency:
  # Two dispatchers running at once could fire the same job twice — the ledger
  # cap is monthly and would not stop it inside one window.
  group: research-queue-dispatch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # `gh workflow run` on the routed workflow

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # 35, not 15: `verify-merged` below blocks until the stamp PR merges, and a
    # budget under that wait kills the job mid-wait and reports a timeout for a
    # stamp that was about to land.
    #
    # ⚠️ THIS COMMENT SAID "waits up to 18 min" AND WAS STALE. The wait is
    # `commit-to-main`'s `verify-timeout-minutes`, which this workflow does not
    # set — so it takes that action's DEFAULT, and the default moved 18 -> 30.
    # The arithmetic a reader would do from the old text was wrong by 12 min.
    #
    # MEASURED on run 33388490432 (2026-08-31), rather than estimated:
    #   job total                                    16m04s
    #   set-up + checkout + pip + grade + dispatch      14s
    #   "Land the dispatch stamps on main" (the wait) 15m45s
    # So the budget is 30 (wait) + ~0.2 (everything else) and 35 leaves ~5 min
    # of real headroom. It is NOT thin — an earlier read of this called it
    # 32-34 of 35 by assuming minutes of startup; startup is fourteen seconds.
    #
    # The 30-min default is also vindicated by that run: 15m45s is 52.5% of 30
    # but 87.5% of the old 18, i.e. this exact shape of run was a coin-flip
    # before the default was raised. Raise this number only if the WAIT's own
    # default rises above ~33.
    #
    # ⚠️ RAISED 35 -> 70 (RQ-OPS-2, 2026-09-28), AND THE OLD FIGURE WAS ALREADY
    # STALE THE DAY IT SHIPPED. MEASURED on the two runs that actually
    # cancelled here (36239222079, 35996108860): the stamp PR's required
    # `pytest-run` check took ~13m of GitHub QUEUE TIME before it even
    # started, plus ~20m to RUN — ~33m total just to resolve the check,
    # already past `verify-merged`'s own 30m poll deadline before that
    # deadline's failure message could ever fire. The outer 35m job ceiling
    # then killed the wait mid-poll, reporting an ambiguous `cancelled`
    # instead of `commit-to-main`'s own clear pass/fail. This is a TIMING
    # fix only — it does not change what `verify-merged` waits FOR, does not
    # touch the FIRE decision, and does not widen what merges: a genuinely
    # failing check still fails, just with commit-to-main's own diagnosable
    # error message instead of an outer-timeout cancellation.
    #
    # ⚠️ AND THE JOB NOW HOLDS TWO `commit-to-main` CALLS, NOT ONE — the
    # liveness receipt (added the same day, see below) also sets
    # `verify-merged: true`, because tests/test_commit_to_main_callers.py
    # allows no exemption for a "low-stakes" caller. `test_every_caller_
    # budget_outlasts_the_merge_wait` only checks a FLOOR (budget >= one
    # wait + 5m slack) and does not sum multiple calls in one job — sizing
    # for the real worst case is this job's own responsibility. 70 = 30
    # (receipt wait) + 30 (stamp wait) + ~10 (observed queue+run overhead on
    # top of either wait, per the ~33m measured above), covering both waits
    # maxing out sequentially. Root-caused in PI-20260928-RQOPS2-0001.
    timeout-minutes: 70
    env:
      # THE ONE FIRE DECISION. Both consumers below read THIS, never `inputs`
      # directly — see the header. A scheduled run fires; a hand dispatch fires
      # only when explicitly asked.
      FIRE: ${{ github.event_name == 'schedule' || inputs.fire == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT so the stamp auto-merge PR (commit-to-main) triggers checks —
          # mirrors gpu-burst-train.yml's checkout for the same reason.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      - name: Grade and dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--ref "${{ github.ref_name }}" --max-gpu-dispatches-per-run "${{ inputs.max_gpu || '1' }}")
          if [ "${FIRE}" = "true" ]; then ARGS+=(--fire); fi
          if [ -n "${{ inputs.only }}" ]; then ARGS+=(--only "${{ inputs.only }}"); fi
          python3 scripts/research/dispatch_queue.py "${ARGS[@]}" | tee /tmp/dispatch.txt

      # RQ-OPS-2 (PI-20260928-RQOPS2-0001): the cron itself can go silent the
      # same way any scheduled job can, invisibly. This writes a small
      # receipt on EVERY run that reaches this point (fired or dry — no
      # `if: env.FIRE` here, unlike the stamp step below), so
      # check_research_queue_dispatch_liveness.py has something to grade.
      # Runs only if "Grade and dispatch" actually succeeded — that is the
      # "successful dispatcher run" this receipt attests to. Placed BEFORE
      # the (heavier, data-touching) stamp step deliberately: this diff is
      # one small json file under docs/claude/work, so its own required
      # checks are cheap and its `verify-merged` wait should resolve fast,
      # leaving the stamp step the greater share of the job's budget.
      #
      # ⚠️ `verify-merged: true`, NOT skipped. tests/test_commit_to_main_
      # callers.py::test_every_caller_verifies_its_rows_merged requires EVERY
      # caller to confirm its rows landed, with no exemption for "low
      # stakes" — an earlier draft of this step set verify-merged: false to
      # dodge a second wait, and that is exactly the "twelve of thirteen
      # callers never check" defect that test exists to catch. `timeout-
      # minutes` below is sized for two sequential worst-case waits instead.
      - name: Write the liveness receipt
        run: |
          set -euo pipefail
          mkdir -p docs/claude/work
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          import os
          payload = {
              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "conclusion": "success",
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "event_name": os.environ.get("GITHUB_EVENT_NAME", "unknown"),
              "fired": os.environ.get("FIRE", "false"),
          }
          with open("docs/claude/work/research-queue-dispatch-receipt.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2)
              fh.write("\n")
          PY
      - name: Land the liveness receipt
        uses: ./.github/actions/commit-to-main
        with:
          verify-merged: "true"
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: docs/claude/work/research-queue-dispatch-receipt.json
          message: "chore(research-queue): liveness receipt for run ${{ github.run_id }}"
          pr-title: "chore(research-queue): liveness receipt (auto)"
          pr-body: >-
            Automated liveness receipt from the research-queue dispatcher.
            Data-only; graded by
            scripts/ci/check_research_queue_dispatch_liveness.py so a
            silently-stopped cron is detectable instead of invisible.
          branch-prefix: automation/research-queue-receipt

      # The dispatcher stamps `last_dispatched_at` on any job it fired. `main`
      # is branch-protected, so this lands through the shared commit-to-main
      # action as an auto-merge PR rather than a direct push — the same wire
      # BL-20260706-GPU-BURST-LEDGER-PUSH-RACE established for the spend ledger
      # after a direct `git push HEAD:main` was rejected (GH006) and silently
      # dropped billed rows.
      #
      # ⚠️ Only on a REAL fire. A dry run stamps nothing, so there is nothing to
      # land and this step is skipped rather than opening an empty PR.
      # ⚠️ THE STAMP IS THIS WORKFLOW'S ONLY IDEMPOTENCY, AND UNTIL 2026-08-30 IT
      # WAS UNVERIFIED. The comment below correctly warns that a fired-but-
      # unstamped job "re-fires forever" — and then guards only ONE of the two
      # routes to that state. The other is this step: `commit-to-main` exits 0
      # when the PR is OPENED, so a stranded stamp PR means `last_dispatched_at`
      # never reaches main and the dispatcher re-fires the SAME job every single
      # day, indefinitely, burning a runner each time (and, for a GPU-routed job,
      # real money against the spend ledger). That is not theoretical: origin
      # carried 5 stranded `automation/*` branches the day this was armed, the
      # oldest 10 weeks. `verify-merged` closes it.
      - name: Land the dispatch stamps on main
        # Reads the SAME `FIRE` as the flag above. If these two can disagree, a
        # fired job goes unstamped and re-fires forever.
        if: env.FIRE == 'true'
        uses: ./.github/actions/commit-to-main
        with:
          verify-merged: "true"
          # A PAT, not GITHUB_TOKEN: a PR authored by GITHUB_TOKEN does not
          # trigger checks, so its auto-merge would sit forever waiting on
          # required checks that never start. Same reason gpu-burst-train.yml
          # passes it for the spend ledger.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: research/queue
          message: "chore(research-queue): stamp last_dispatched_at for run ${{ github.run_id }}"
          pr-title: "chore(research-queue): dispatch stamps (auto)"
          pr-body: >-
            Automated `last_dispatched_at` stamps from the research-queue
            dispatcher. Data-only; it drives the cadence check so a recurring
            job does not re-fire every run.
          branch-prefix: automation/research-queue-stamp

      # `if: always()` — a stale/never_ran verdict must be checked and
      # PINGED however the steps above went, including when "Grade and
      # dispatch" itself failed (the exact case a receipt cannot update
      # for). `continue-on-error: true` so the alarm mechanism can never
      # itself be the reason this job's own conclusion goes red or cancels.
      - name: Alarm if the dispatcher has gone stale
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if ! python3 scripts/ci/check_research_queue_dispatch_liveness.py; then
            echo "::warning::research-queue-dispatch liveness is stale or never_ran — dispatching send-ping."
            gh workflow run system-actions.yml \
              -f action=send-ping \
              -f message="research-queue-dispatch has not had a successful run in 48h+ (or never committed a receipt). Check the last runs: https://github.com/${{ github.repository }}/actions/workflows/research-queue-dispatch.yml" \
              -f priority=high \
              -f target=claude \
              || echo "::error::could not dispatch the send-ping system-action — see the step log above."
          fi

      - name: Summarize in the job summary
        if: always()
        run: |
          {
            echo "### research-queue dispatch"
            echo
            echo '```'
            cat /tmp/dispatch.txt 2>/dev/null || echo "(the dispatcher produced no output — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
