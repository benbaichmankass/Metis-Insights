name: m20-capture-census

# M20 exit-capture CENSUS — the measure-first pass the operator directed on
# 2026-08-10 ("measure first, go ahead").
#
# WHAT IT IS NOT: a sweep. It applies NO lever and grades NOTHING. It runs each
# live leg's CONFIG-EXACT base and reports, per leg, the MFE-capture
# distribution plus the near-miss-to-target rate. The point is to size the prize
# and order the legs BEFORE a lever is designed — the alternative being to
# design from one remembered trade.
#
# WHY IT EXISTS AT ALL: capture_ratio has been computed in this repo since
# src/research/excursions.py landed and is read by ZERO gates
# (BL-20260810-EXIT-GATE-BLIND-TO-CAPTURE-AND-CAPITAL). M20's gate optimises
# net_R and maxDD, both indifferent to handing a winner back, which is how 266
# of 400 coverage cells came to be graded honest_negative against an objective
# function that could not see the complaint.
#
# FREE RUNNERS, NOT THE TRAINER (docs/claude/vm-resource-management.md): six
# parallel 4-core public-repo runners, $0, and the 1-core trainer stays free for
# ML work. Each shard scp's only the frames its family needs.
#
# DATASET VINTAGE IS LOAD-BEARING (BL-20260809, and the note atop
# ict-scalp-exit-sweep.yml): /home/ubuntu/m27_data is NOT the trainer's
# ~/ict-trading-bot/data — different start dates, different md5. Every M27
# ict_scalp verdict was measured on m27_data; the trend/pullback/squeeze fleet
# verdicts were measured on data/. Each shard therefore pulls the source ITS
# family's existing rows used, and the census records which, so a later
# comparison is never silently across two populations.

on:
  workflow_dispatch:
    inputs:
      families:
        description: "CSV of families to census (scalp,pullback,donchian,squeeze,fvg). Empty = all."
        required: false
        default: ''
      tp_cap_pct:
        description: "Live-parity TP cap. 0 = the geometry every pre-2026-08-10 verdict used; 0.099 = what production actually places. Run BOTH to get the A/B."
        required: false
        default: '0'
  push:
    # 2026-09-02 (MI-66): was pinned to literal branch(es) that have since been
    # DELETED from origin, so this push trigger could not fire at all — the
    # workflow was reachable only by `workflow_dispatch`. Generalised to the
    # `claude/**` namespace rather than dropped, because the `paths:` sentinel
    # below is the real trigger (the branch list was only ever a convenience)
    # and the header's documented "re-trigger by committing a new value to that
    # sentinel" had been silently untrue since those branches went away.
    # Enforced by scripts/ci/check_workflow_trigger_reachability.py.
    branches:
      - 'claude/**'
    paths:
      - '.github/capture-census-request'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # The shard table lives HERE, in one place, and the `families` input actually
  # filters it. It previously did not: `families` was declared on the dispatch
  # form and referenced nowhere, so a run asking for `scalp` silently censused
  # all eleven shards and reported a full result under a narrowed label. That is
  # the declared-but-never-read shape `provenance-consumer-guard` exists for,
  # and the reason this is a plan job rather than a static matrix: a static
  # matrix cannot be filtered by an input, so the honest choices were to wire it
  # or to delete the control. An UNKNOWN family name FAILS the run — silently
  # censusing everything because a name was misspelled is the same lie in a
  # different costume.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.build.outputs.shards }}
    steps:
      - id: build
        env:
          FAMILIES: ${{ inputs.families || '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          # `src` names the trainer dir this family's prior verdicts used.
          #
          # SCALP IS SHARDED PER-LEG, the others per-family. Measured 2026-08-10:
          # donchian did 23 legs in 51s and pullback 19 in 39s, while the single
          # scalp shard ran 68 MINUTES without finishing. Its frames are the
          # m27_data 5m/15m series (~370k rows vs the hourly/daily frames the
          # other families use) and its per-bar work is heavier (FVG + sweep
          # lookbacks). The arithmetic says one job cannot be trusted to finish:
          # run_census allows 1800s PER LEG, so 8 legs is up to 240 min against
          # a 150 min job timeout -- a job that dies having produced nothing.
          # One leg per job caps the worst case at 30 min, well inside the
          # timeout, and the 7 run in parallel for the same $0.
          # ict_scalp_mgc_15m is deliberately absent (blocked:data_missing).
          SCALP = "/home/ubuntu/m27_data"
          DATA = "/home/ubuntu/ict-trading-bot/data"
          SHARDS = [
              {"family": "scalp", "src": SCALP, "only": leg} for leg in (
                  "ict_scalp_5m", "ict_scalp_sol_5m", "ict_scalp_xrp_5m",
                  "ict_scalp_avax_5m", "ict_scalp_eth_15m", "ict_scalp_sol_15m",
                  "ict_scalp_xrp_15m",
              )
          ] + [
              {"family": f, "src": DATA, "only": ""}
              for f in ("pullback", "donchian", "squeeze", "fvg")
          ]
          known = {s["family"] for s in SHARDS}
          want = {f.strip() for f in os.environ.get("FAMILIES", "").split(",") if f.strip()}
          unknown = sorted(want - known)
          if unknown:
              print(f"::error::unknown families {unknown}; known={sorted(known)}", file=sys.stderr)
              raise SystemExit(1)
          sel = [s for s in SHARDS if not want or s["family"] in want]
          print(f"selected {len(sel)} of {len(SHARDS)} shards "
                f"(families={sorted(want) or 'ALL'})", file=sys.stderr)
          print("shards=" + json.dumps(sel))
          PY

  census:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch this family's frames from the trainer (scp)
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          TRAINER_IP: ${{ vars.TRAINER_VM_IP || '158.178.209.121' }}
          TRAINER_USER: ${{ vars.TRAINER_VM_USER || 'ubuntu' }}
          SRC: ${{ matrix.shard.src }}
        run: |
          set -e
          if [ -z "${VM_SSH_KEY}" ]; then echo "::error::VM_SSH_KEY unset"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${VM_SSH_KEY}" > ~/.ssh/trainer_key
          chmod 600 ~/.ssh/trainer_key
          ssh-keyscan -t ed25519,ecdsa,rsa "${TRAINER_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          mkdir -p census_data
          # Pull the CSVs wholesale for this family's source. Cheap relative to
          # the backtests, and it avoids a per-symbol resolution here that would
          # be a SECOND copy of the resolver already in m20_fleet_exit_sweep.py.
          scp -i ~/.ssh/trainer_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=25 \
              "${TRAINER_USER}@${TRAINER_IP}:${SRC}/*.csv" census_data/ || true
          n=$(ls census_data/*.csv 2>/dev/null | wc -l)
          echo "frames fetched: ${n} from ${SRC}"
          # A silent-empty here would make every leg read data_missing and the
          # census would report "0 legs measured" as though that were a finding.
          if [ "${n}" -eq 0 ]; then
            echo "::error::no frames fetched from ${SRC} — census would be a false negative"
            exit 1
          fi

      - name: Run the capture census for this family
        env:
          FAMILY: ${{ matrix.shard.family }}
          SRC: ${{ matrix.shard.src }}
          ONLY: ${{ matrix.shard.only || '' }}
          TP_CAP_PCT: ${{ inputs.tp_cap_pct || '0' }}
        run: |
          set -o pipefail
          # --census applies no lever; --only is resolved from the family by the
          # driver's own classify(), so the leg list is never hardcoded here.
          python3 scripts/research/m20_fleet_exit_sweep.py \
            --census \
            --data-dir census_data \
            --family "${FAMILY}" \
            ${ONLY:+--only "${ONLY}"} \
            --tp-cap-pct "${TP_CAP_PCT:-0}" \
            --out "out/${FAMILY}${ONLY:+/$ONLY}" 2>&1 | tee census.out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-census-${{ matrix.shard.family }}${{ matrix.shard.only && format('-{0}', matrix.shard.only) || '' }}
          path: out/${{ matrix.shard.family }}${{ matrix.shard.only && format('/{0}', matrix.shard.only) || '' }}
          if-no-files-found: warn

      - name: Post the census back onto the PR
        if: always()
        uses: actions/github-script@v7
        env:
          FAMILY: ${{ matrix.shard.family }}
          SRC: ${{ matrix.shard.src }}
          ONLY: ${{ matrix.shard.only || '' }}
          TP_CAP_PCT: ${{ inputs.tp_cap_pct || '0' }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const family = process.env.FAMILY;
            // The driver writes to out/<family>/<UTC-date>/SUMMARY.md, not
            // out/<family>/SUMMARY.md. The first version of this step read the
            // undated path, found nothing, and posted "census did not produce a
            // SUMMARY — this is a FAILED run" over FIVE runs that had all
            // SUCCEEDED (each log ends `census -> out/<family>/2026-08-10`).
            // That is sub-class A of the diagnostic-provenance rule in CLAUDE.md:
            // a failure message naming a cause no code path tested. Fixed by
            // branching on the actual STAGE — did the dir exist, did the file
            // exist, or did the census never run — not by rewording the label.
            let body = '', stage = 'unknown';
            const only = process.env.ONLY || '';
            const famDir = only ? `out/${family}/${only}` : `out/${family}`;
            let summaryPath = null;
            try {
              const dated = fs.readdirSync(famDir)
                .map(d => path.join(famDir, d))
                .filter(p => fs.existsSync(path.join(p, 'SUMMARY.md')))
                .sort();
              if (dated.length) summaryPath = path.join(dated[dated.length - 1], 'SUMMARY.md');
              else if (fs.existsSync(path.join(famDir, 'SUMMARY.md')))
                summaryPath = path.join(famDir, 'SUMMARY.md');
              stage = summaryPath ? 'ok' : 'ran_no_summary';
            } catch (e) {
              stage = 'no_output_dir';
            }
            if (stage === 'ok') {
              body = fs.readFileSync(summaryPath, 'utf8');
            } else {
              let tail = '';
              try { tail = fs.readFileSync('census.out', 'utf8').slice(-3000); }
              catch (e2) { tail = '(no census output captured)'; }
              const why = stage === 'no_output_dir'
                ? `no \`${famDir}\` directory — the census step did not get far enough to create one`
                : `\`${famDir}\` exists but contains no SUMMARY.md — the census ran and did not write one`;
              body = `**No SUMMARY to post** (${why}). Census stdout below; read it before calling this a failed measurement.\n\n\`\`\`\n${tail}\n\`\`\``;
            }
            // Resolve the PR from the COMMIT. `pulls.list({head})` silently
            // returned [] on 2026-08-10 and seven jobs went green having posted
            // nothing — the exact failure this comment exists to not repeat.
            const {data: prs} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs.find(p => p.state === 'open') || prs[0];
            if (!pr) {
              core.setFailed(`no PR found for ${context.sha} — census for ${family} computed but has nowhere to go`);
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: pr.number,
              body: `### Exit-capture census — \`${only || family}\`  ·  tp_cap_pct=\`${process.env.TP_CAP_PCT || '0'}\`\n\nDataset: \`${process.env.SRC}\` (the vintage this family's existing verdicts used). **Geometry: ${(process.env.TP_CAP_PCT && process.env.TP_CAP_PCT !== '0') ? 'LIVE-PARITY (capped TP)' : 'legacy (no TP — what every pre-2026-08-10 verdict used)'}.**\n\n${body}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`,
            });
