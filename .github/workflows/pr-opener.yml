name: pr-opener

# Git-push-triggered PR opener — the MCP-independent PR-creation path.
#
# Companion to vm-driver.yml. When the GitHub MCP is unavailable, a sandbox
# session can `git push` (the git proxy is independent) but cannot create PRs
# (that needs the GitHub API). This workflow turns a pushed request file into a
# PR opened by the runner (which has GITHUB_TOKEN + the `gh` CLI), and writes
# the resulting URL back to the repo so the session reads it via `git fetch`.
#
# Contract:
#   * Drop a JSON file at `automation/pr-requests/<name>.json` and push it:
#       {"head": "<branch with the changes>",
#        "base": "main",            # optional, default main
#        "title": "...",
#        "body":  "...",            # markdown
#        "draft": false}            # optional, DEFAULT FALSE since 2026-09-03
#
# ⚠️ THE `draft` DEFAULT FLIPPED TO **false** ON 2026-09-03, BY OPERATOR RULING:
#   "Going into github to marke drafts ready is not something we can include in
#    the workflow". A draft is a hold that its own author cannot lift -- a
#   sub-session 403s on `update_pull_request` -- so every draft it opened became
#   a manual click for someone else. Measured that morning: 4 of 15 open PRs were
#   drafts waiting on a hand-clear, and the day manager hand-un-drafted three.
#   A PR is now held by its LANDING DECLARATION (.github/pr-landing/<slug>.json),
#   which is machine-readable and which `check_pr_landing.py` enforces, never by
#   the draft flag, which is a UI state.
# ⚠️ THIS DOES NOT MAKE ANYTHING MERGE. Opening ready is READINESS, not landing:
#   `claude-pr-automerge.yml` arms only on `.github/pr-automerge-requests/*.txt`,
#   so a PR that writes no request file still merges only when a human clicks.
#   An armed PR that declares `landing: "hold"` is FAILED by that guard's R10.
#   Callers wanting a draft may still pass `"draft": true` explicitly.
#   * The runner runs `gh pr create`, writes the URL (or error) to
#     `automation/pr-results/<name>.txt`, and commits that result back to the
#     pushed branch. The request file is LEFT IN PLACE and re-runs skip it,
#     because the result file -- not the deletion -- is the idempotency key.
#
# ⚠️ WHY THE REQUEST IS NOT DELETED (fixed 2026-08-20). An earlier version
# `git rm`'d it. `git rm` STAGES the deletion, so the results commit touched
# `automation/pr-requests/**` -- this workflow's OWN trigger path -- and needed
# `[skip ci]` to avoid retriggering itself. (The old header blamed
# `pr-results/**` not being a trigger path; that is true and was never the
# reason.) `[skip ci]` suppresses EVERY workflow for that commit, so whenever
# the results commit was the last one on a branch it became the PR head and
# the PR it had just opened started life with ZERO required checks -- blocked
# from merging, but rendering as no-red rather than red, which
# `pytest-collect.yml`'s own header calls out as indistinguishable from green.
# Measured on PRs #10077 and #10078, whose heads were both
# `pr-opener: results [skip ci]` with `get_check_runs` total_count 0.
# Now the commit touches only `automation/pr-results/**`, which is outside the
# trigger path -- no self-retrigger and no skip directive. That removes
# ONE of the two causes; see the note below for the other.
#
#
# ⚠️ REMOVING THE SKIP DIRECTIVE IS NECESSARY BUT **NOT SUFFICIENT** — MEASURED.
# GitHub deliberately does NOT trigger workflows for pushes made with the
# built-in `GITHUB_TOKEN` (recursion prevention). This results commit is pushed
# by `github-actions[bot]` using exactly that token, so when it lands last it
# becomes the PR head and the PR STILL shows zero checks even with no skip
# directive anywhere. Isolated on PR #10079: head `04e75c8a`
# (`pr-opener: results`, author `github-actions[bot]`, no skip directive) →
# `get_check_runs` total_count **0**, while every head on the same branches
# pushed by a session's own credentials got its checks normally.
# So there are TWO independent causes and the skip directive was only the first.
#
# WHAT THIS MEANS FOR A CALLER: after a relay run leaves its results commit as
# the branch head, **push one ordinary commit yourself** to arm CI. Do not read
# a zero-check PR as green — it is blocked, not passing.
#
# ⚠️ AND THE WORKAROUND ABOVE IS NOT ENOUGH EITHER — MEASURED 2026-09-01 ON
# PR #10683. That caller did everything the paragraph above asks: the request
# was pushed from a DIFFERENT branch, so the results commit never touched the
# PR's head branch, and the head was the caller's OWN commit (`b2fb88a4`,
# pushed with the session's own credentials). `get_check_runs` still returned
# total_count **0** and `mergeable_state: blocked`.
#
# The reason is that BOTH of the causes above are about the results COMMIT, and
# neither is the binding one here. Most of this repo's required checks trigger
# on `pull_request`, not `push` — and the PR is OPENED by `github-actions[bot]`
# via `gh pr create` with GITHUB_TOKEN, so GitHub's recursion prevention
# suppresses the `pull_request` event itself. The branch push that preceded it
# could not arm those checks because no PR existed yet to attach them to.
#
# So the rule is stronger than "keep the results commit off the head branch":
# **EVERY PR opened through this relay starts with zero checks, however clean
# the head is, and needs one ordinary push AFTER the PR exists.** Pushing from
# a separate branch is still correct — it removes one failure mode — it is just
# not sufficient on its own.
# A durable fix needs either a PAT/app token for the commit-back, or a
# `workflow_run`/`pull_request_target` trigger; both are larger changes than
# this one and neither is attempted here.
# ⚠️ Consequence of result-file idempotency: REUSING a request filename that
# already has a result is a NO-OP, logged and skipped. Use a fresh name per PR.
#
# Blast radius: opens PRs only (PRs never auto-merge). contents+pull-requests
# write. The head branch must already exist on origin.

on:
  push:
    paths: ['automation/pr-requests/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-opener
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Open pending PR requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p automation/pr-results
          shopt -s nullglob
          for req in automation/pr-requests/*.json; do
            base="$(basename "$req" .json)"
            if [ -f "automation/pr-results/${base}.txt" ]; then
              echo ">>> ${base}: already processed, skipping ($(head -1 "automation/pr-results/${base}.txt"))"
              continue
            fi
            head="$(jq -r '.head' "$req")"
            target="$(jq -r '.base // "main"' "$req")"
            title="$(jq -r '.title' "$req")"
            jq -r '.body // ""' "$req" > /tmp/pr_body.md
            draft_flag=""
            # DEFAULT FALSE -- see the ⚠️ note in this file's header for the
            # operator ruling and why the hold now lives in the declaration.
            # `// false` is deliberate and is NOT the `jq // treats false as
            # empty` trap: that trap bites `.x // true` when `.x` IS false, and
            # here the fallback and the falsy value are the same, so an absent
            # key and an explicit `false` both yield "false" -- no draft.
            [ "$(jq -r '.draft // false' "$req")" = "true" ] && draft_flag="--draft"
            out="automation/pr-results/${base}.txt"
            if [ -z "$head" ] || [ "$head" = "null" ]; then
              echo "ERROR: request $base has no .head branch" > "$out"
            else
              url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$head" --base "$target" \
                       --title "$title" --body-file /tmp/pr_body.md $draft_flag 2>&1)" \
                && echo "$url" > "$out" \
                || printf 'FAILED:\n%s\n' "$url" > "$out"
            fi
            echo ">>> ${base}: $(head -1 "$out")"
          done

      - name: Commit results back to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ONLY the results dir -- see the header. Staging anything under
          # automation/pr-requests/** would put this commit back on the trigger
          # path and force a skip directive, which is what stranded PR CI.
          git add -A automation/pr-results
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "pr-opener: results"
          git push origin HEAD:${{ github.ref_name }}
