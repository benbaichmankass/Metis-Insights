name: pr-opener

# Git-push-triggered PR opener — the MCP-independent PR-creation path.
#
# Companion to vm-driver.yml. When the GitHub MCP is unavailable, a sandbox
# session can `git push` (the git proxy is independent) but cannot create PRs
# (that needs the GitHub API). This workflow turns a pushed request file into a
# PR opened by the runner (which has GITHUB_TOKEN + the `gh` CLI), and writes
# the resulting URL back to the repo so the session reads it via `git fetch`.
#
# Contract:
#   * Drop a JSON file at `automation/pr-requests/<name>.json` and push it:
#       {"head": "<branch with the changes>",
#        "base": "main",            # optional, default main
#        "title": "...",
#        "body":  "...",            # markdown
#        "draft": true}             # optional, default true
#   * The runner runs `gh pr create`, writes the URL (or error) to
#     `automation/pr-results/<name>.txt`, and commits that result back to the
#     pushed branch. The request file is LEFT IN PLACE and re-runs skip it,
#     because the result file -- not the deletion -- is the idempotency key.
#
# ⚠️ WHY THE REQUEST IS NOT DELETED (fixed 2026-08-20). An earlier version
# `git rm`'d it. `git rm` STAGES the deletion, so the results commit touched
# `automation/pr-requests/**` -- this workflow's OWN trigger path -- and needed
# `[skip ci]` to avoid retriggering itself. (The old header blamed
# `pr-results/**` not being a trigger path; that is true and was never the
# reason.) `[skip ci]` suppresses EVERY workflow for that commit, so whenever
# the results commit was the last one on a branch it became the PR head and
# the PR it had just opened started life with ZERO required checks -- blocked
# from merging, but rendering as no-red rather than red, which
# `pytest-collect.yml`'s own header calls out as indistinguishable from green.
# Measured on PRs #10077 and #10078, whose heads were both
# `pr-opener: results [skip ci]` with `get_check_runs` total_count 0.
# Now the commit touches only `automation/pr-results/**`, which is outside the
# trigger path -- no self-retrigger, no skip directive, PR keeps its CI.
#
# ⚠️ Consequence of result-file idempotency: REUSING a request filename that
# already has a result is a NO-OP, logged and skipped. Use a fresh name per PR.
#
# Blast radius: opens PRs only (PRs never auto-merge). contents+pull-requests
# write. The head branch must already exist on origin.

on:
  push:
    paths: ['automation/pr-requests/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-opener
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Open pending PR requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p automation/pr-results
          shopt -s nullglob
          for req in automation/pr-requests/*.json; do
            base="$(basename "$req" .json)"
            if [ -f "automation/pr-results/${base}.txt" ]; then
              echo ">>> ${base}: already processed, skipping ($(head -1 "automation/pr-results/${base}.txt"))"
              continue
            fi
            head="$(jq -r '.head' "$req")"
            target="$(jq -r '.base // "main"' "$req")"
            title="$(jq -r '.title' "$req")"
            jq -r '.body // ""' "$req" > /tmp/pr_body.md
            draft_flag=""
            [ "$(jq -r '.draft // true' "$req")" = "true" ] && draft_flag="--draft"
            out="automation/pr-results/${base}.txt"
            if [ -z "$head" ] || [ "$head" = "null" ]; then
              echo "ERROR: request $base has no .head branch" > "$out"
            else
              url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$head" --base "$target" \
                       --title "$title" --body-file /tmp/pr_body.md $draft_flag 2>&1)" \
                && echo "$url" > "$out" \
                || printf 'FAILED:\n%s\n' "$url" > "$out"
            fi
            echo ">>> ${base}: $(head -1 "$out")"
          done

      - name: Commit results back to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # ONLY the results dir -- see the header. Staging anything under
          # automation/pr-requests/** would put this commit back on the trigger
          # path and force a skip directive, which is what stranded PR CI.
          git add -A automation/pr-results
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "pr-opener: results"
          git push origin HEAD:${{ github.ref_name }}
