name: artifact-validity-guard

# Structural guard against the "green while measuring nothing" bug class
# (2026-07-30: four instances in one day, plus an S-067 audit of the same class from
# 2026-05-10 that recurred anyway).
#
# TWO checks, because the class has two halves and the existing guards cover neither:
#
#   1. VACUOUS ARTIFACTS — scripts/ops/check_artifact_validity.py asserts every
#      registered research artifact actually measured something (non-zero
#      load-bearing inputs), and heuristically flags unregistered comms/** JSON whose
#      every known input count is zero. This catches the OUTPUT side: a verdict
#      computed from an empty input set. `econ_event_study_scorecard.json` published
#      exactly that for its entire life (BL-20260730-M1-PRICE-JOIN-DEAD).
#
#   2. SWALLOWED FETCH FAILURES — a load-bearing fetch step in a workflow must not
#      end in `|| echo` / `|| true`. That idiom is what kept the price-join failure
#      GREEN: the fetch degraded to a warning, the study treated an empty panel as a
#      soft zero, and the run exited 0 with a plausible-looking verdict. This catches
#      the INPUT side.
#
# Why the existing guards don't cover it: `silent-empty-guard`
# (scripts/check_silent_empty_in_diff.py) is a diff-scoped Python-`except` scanner
# over three src/ paths. It can see neither the research/producer layer, nor shell,
# nor an output-side contract. A guard scoped to three paths and one language's
# syntax is not a guard against a bug class.
#
# Tier-1 CI guard: read-only, no VM, no order path.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artifact-validity-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # The backlog-ref guard diffs against the PR base, so it needs real history --
          # a depth-1 clone would make every added line look new. (Same class as
          # BL-20260730-SHALLOW-CLONE-DEFEATS-HISTORY-RULE: a truncated clone yields a
          # plausible wrong answer rather than an error.)
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- 1. no vacuous research artifact may be committed -------------------
      # --allow-missing: a producer that has never run is legitimately absent; the
      # bug class is a PRESENT artifact that measured nothing.
      - name: Assert committed research artifacts measured something
        run: python3 scripts/ops/check_artifact_validity.py --allow-missing

      # --- 2. no load-bearing fetch may swallow its own failure ---------------
      - name: Forbid `|| echo` / `|| true` on a load-bearing fetch step
        run: |
          set -uo pipefail
          # Look for a producer/fetch invocation whose failure is swallowed, scoped to
          # the commands that actually run our producer scripts so ordinary shell
          # tolerance elsewhere (optional cleanup, etc.) is unaffected.
          #
          # MULTILINE-AWARE. A first cut used a line-based grep and was trivially
          # evaded by a shell line continuation:
          #     python scripts/macro/fetch_macro_candles.py \
          #       --start 2005-01-01 || \
          #       echo "::warning::degraded"
          # ...which is the real shape already present in macro-valuation-backfill.yml.
          # A guard that only catches the single-line form would be decorative on
          # exactly the instances that exist. So: join continuations first, then match.
          #
          # An intentional exception carries `# allow-degraded: <reason>` anywhere in
          # the joined command — the explicit-override shape silent-empty-guard uses.
          python3 - <<'PY'
          import pathlib, re, sys

          # WIDENED 2026-07-30. The first pattern only matched fetch_*/_produce/_backfill/
          # _snapshot, which missed the entire RESEARCH producer family — build_*_panel.py
          # and analyze_*.py. Those are precisely the scripts whose output a verdict is
          # read out of, and both research workflows were swallowing them: the exit-head
          # build + analyze (so an empty panel still rendered a VERDICT.md) and five more
          # in research-panel-build.yml. A guard that names a bug class but matches only
          # one naming convention is scoped-wrong in exactly the way the class describes.
          PRODUCER = re.compile(
              r'(fetch_[a-z0-9_]*\.py'
              r'|build_[a-z0-9_]*\.py'
              r'|analyze_[a-z0-9_]*\.py'
              r'|_produce\.py|_backfill\.py|_snapshot\.py|_resolve\.py)')
          SWALLOW  = re.compile(r'\|\|\s*(echo|true)\b')
          hits = []
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              raw = p.read_text(encoding='utf-8', errors='replace').splitlines()
              # Fold shell line-continuations into one logical command, remembering
              # the line the command STARTED on so the error points somewhere useful.
              buf, start = '', None
              for i, line in enumerate(raw, 1):
                  if start is None:
                      start = i
                  stripped = line.rstrip()
                  if stripped.endswith('\\'):
                      buf += stripped[:-1] + ' '
                      continue
                  buf += stripped
                  if PRODUCER.search(buf) and SWALLOW.search(buf) \
                     and 'allow-degraded:' not in buf:
                      hits.append(f'{p}:{start}: {buf.strip()[:200]}')
                  buf, start = '', None

          if hits:
              print('::error::A load-bearing producer/fetch step swallows its own '
                    'failure. This is the idiom that kept BL-20260730-M1-PRICE-JOIN-DEAD '
                    "green for the producer's entire life: the fetch degraded to a "
                    'warning, the study read an empty panel as a soft zero, and the run '
                    'exited 0 with a plausible verdict.')
              for h in hits:
                  print('  ' + h)
              print('')
              print('Fix: let the step fail (set -e) and assert the fetched inputs are '
                    'non-empty before using them. If a degraded fetch is genuinely '
                    "acceptable, annotate the command with '# allow-degraded: <reason>'.")
              sys.exit(1)
          print('OK — no load-bearing producer/fetch step swallows its failure.')
          PY

      # --- 3. the research capability index must stay complete ----------------
      # A session cannot route to a tool it cannot find. On 2026-07-30, 47 of 51
      # scripts/research/ tools were in no skill, and a session consequently reported
      # six live regime gates as permanently un-auditable when the tool to measure them
      # already existed. An index only helps while it is complete, and a stale index that
      # LOOKS complete is the same false-completeness that caused the incident.
      - name: Assert every research script is routed in the capability index
        run: python3 scripts/ops/check_research_index.py --list

      # --- 4. no NEW dangling tracking reference ------------------------------
      # A doc saying "tracked by BL-X" where BL-X was never filed reads as tracked while
      # being tracked by nobody. Four such ids existed on 2026-07-30 -- including
      # BL-20260730-M1-PRICE-JOIN-DEAD, the canonical example in the "Green is not
      # evidence" rule, cited from four workflows, resolving to nothing.
      # DIFF-SCOPED on purpose: ~109 pre-existing dangling refs would make an alarm every
      # session walks past, which the rules name as itself a P1 bug. The debt is measured
      # and attributed in BL-20260730-CITED-BUT-UNFILED-BACKLOG-IDS instead.
      - name: Forbid a NEW tracking reference that resolves to nothing
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=0 origin "${{ github.event.pull_request.base.ref }}" \
            2>/dev/null || git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          python3 scripts/ops/check_backlog_refs.py \
            --base "origin/${{ github.event.pull_request.base.ref }}"

      # Report-only visibility on the pre-existing debt, so it stays a known number
      # rather than quietly growing.
      - name: Report pre-existing dangling references (non-blocking)
        run: python3 scripts/ops/check_backlog_refs.py --all | head -20

      # --- 5. the guard's own tests ------------------------------------------
      # A guard against 'green while doing nothing' must not itself be able to go
      # green while doing nothing.
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest

      - name: Test the guard itself
        run: |
          python3 -m pytest tests/test_check_artifact_validity.py \
                            tests/test_check_research_index.py \
                            tests/test_check_backlog_refs.py -q
