name: econ-calendar-backfill

# ROADMAP_MACRO M1 — reconstruct DECADES of point-in-time economic-release snapshots
# from FRED history, so the M1/M2 event study can be graded now instead of waiting
# for the forward-only producer to accrue n=12.
#
# This is the runner for scripts/macro/econ_calendar_snapshot_backfill.py — the
# backfill sibling the econ-calendar producer was missing. It is the direct fix for
# the 2026-07-30 "wait for accrual" error: the forward producer capped the study at
# n=7 per event kind, which had been read as "no verdict until mid-September" and
# scheduled around. The repo already implements this pattern three times
# (macro-valuation-backfill / cot-positioning-backfill / crypto-signals-backfill);
# the econ calendar simply never got its sibling. Rationale:
# docs/research/RESEARCH-PROGRAM-2026-07-30.md §1-§2.
#
# Runs entirely off-VM on a GitHub-hosted runner (FRED's fredgraph.csv is KEYLESS;
# ICT_OFFVM_BUILD_HOST=1 gates the guarded fetcher). No SSH, no live-VM touch, no
# order path. One-shot / occasional — the DAILY forward accrual stays with the
# separate econ-calendar-produce producer, and the two land in different files so a
# reconstructed row is never confused with a forward-observed one (every backfilled
# row carries `backfilled: true` + `expectation_source` + `pit_basis`).
#
# ⚠️ FIRST-RUN PURPOSE — this run VERIFIES the unverified.
# The FRED series ids in config/macro_econ_series.yaml are declared from FRED's
# published catalogue and have NEVER been fetched (the planning sandbox firewalls
# fred.stlouisfed.org — confirmed empty for DFII10/ICSA). The backfill hard-fails
# per series with the offending id named and writes NO output, so a wrong id cannot
# produce a partial-looking success. Correcting one is a CONFIG edit, not a code
# change. Owning row: BL-20260730-BUILT-BUT-UNVERIFIED-ON-RUNNER.
#
# NO SWALLOWED FAILURES. Per the binding "Green is not evidence" rule
# (docs/CLAUDE-RULES-CANONICAL.md), the fetch/backfill step may not degrade to a
# warning: a run that reconstructs nothing must NOT look like a run that
# reconstructed a little. `set -euo pipefail`, no `|| echo`, and an explicit
# non-empty assertion on the output before it is committed.
#
# Triggers:
#   1. workflow_dispatch — operator "Run workflow" (with kind/param overrides).
#   2. issues.opened w/ label `econ-calendar-backfill-now` — Claude-driven (owner only).
#
# Tier-1: observability producer. Lands on protected main via the shared
# ./.github/actions/commit-to-main (PAT auto-merge PR).

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "CSV subset of event kinds (blank = every kind in the config)"
        required: false
        default: ""
      min_train:
        description: "Minimum training rows before an expectation is emitted"
        required: false
        default: "24"
      harmonics:
        description: "Fourier harmonic pairs of seasonal phase"
        required: false
        default: "2"
      mode:
        description: "backfill (default) | probe — probe only REPORTS which FRED ids resolve"
        required: false
        default: "backfill"
      probe_extra:
        description: "CSV of CANDIDATE FRED ids to probe (probe mode only; never auto-adopted)"
        required: false
        default: ""
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: econ-calendar-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'econ-calendar-backfill-now'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The backfill + expectation model are stdlib-only by design (they run on a
      # bare runner); only the config loader needs PyYAML.
      - name: Install deps
        run: python -m pip install --upgrade pip "pyyaml>=6.0"

      - name: Parse issue body (Claude-driven path)
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -uo pipefail
          kinds=$(printf '%s' "$ISSUE_BODY" | grep -iE '^kinds:' | head -1 | cut -d: -f2- | xargs || true)
          mt=$(printf '%s' "$ISSUE_BODY" | grep -iE '^min_train:' | head -1 | cut -d: -f2- | xargs || true)
          hm=$(printf '%s' "$ISSUE_BODY" | grep -iE '^harmonics:' | head -1 | cut -d: -f2- | xargs || true)
          md=$(printf '%s' "$ISSUE_BODY" | grep -iE '^mode:' | head -1 | cut -d: -f2- | xargs || true)
          # Only `probe` is accepted; anything else falls back to a real backfill so a typo
          # can never silently turn a backfill into a no-op diagnostic.
          case "${md}" in probe) md=probe ;; *) md=backfill ;; esac
          # Candidate ids to PROBE (never adopted). Restricted to FRED's own id charset so an
          # untrusted issue body cannot reach the shell through this value.
          pe=$(printf '%s' "$ISSUE_BODY" | grep -iE '^probe_extra:' | head -1 | cut -d: -f2- | xargs || true)
          pe=$(printf '%s' "${pe}" | tr -d '[:space:]')
          printf '%s' "${pe}" | grep -qE '^[A-Za-z0-9_,]*$' || pe=""
          echo "ECB_PROBE_EXTRA=${pe}" >> "$GITHUB_ENV"
          echo "ECB_KINDS=${kinds}"      >> "$GITHUB_ENV"
          echo "ECB_MIN_TRAIN=${mt:-24}" >> "$GITHUB_ENV"
          echo "ECB_HARMONICS=${hm:-2}"  >> "$GITHUB_ENV"
          echo "ECB_MODE=${md}"          >> "$GITHUB_ENV"

      - name: Set params (dispatch path)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "ECB_KINDS=${{ github.event.inputs.kinds }}"                  >> "$GITHUB_ENV"
          echo "ECB_MIN_TRAIN=${{ github.event.inputs.min_train || '24' }}"  >> "$GITHUB_ENV"
          echo "ECB_HARMONICS=${{ github.event.inputs.harmonics || '2' }}"   >> "$GITHUB_ENV"
          echo "ECB_MODE=${{ github.event.inputs.mode || 'backfill' }}"       >> "$GITHUB_ENV"
          echo "ECB_PROBE_EXTRA=${{ github.event.inputs.probe_extra }}"      >> "$GITHUB_ENV"

      # Deliberately NO `|| echo` here. A failure to reconstruct is a failure of the
      # run — that is the whole point (BL-20260730-M1-PRICE-JOIN-DEAD).
      # PROBE MODE — answers "is this FRED id real?" on a host that can actually reach FRED.
      # The sandbox is firewalled from fred.stlouisfed.org, so this question is NOT answerable
      # where the config is edited, and guessing an id there is how two EIA `dnav` codes ended
      # up in a FRED-series config and 404'd for the producer's entire life
      # (BL-20260730-EIA-SERIES-IDS-NOT-FRED). Reports only; writes NO output; never adopts an
      # alternate id. Exits non-zero when any configured id fails to resolve.
      - name: Probe the configured FRED series ids (diagnostic only)
        if: env.ECB_MODE == 'probe'
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -euo pipefail
          EXTRA=""
          if [ -n "${ECB_PROBE_EXTRA:-}" ]; then EXTRA="--probe-extra ${ECB_PROBE_EXTRA}"; fi
          python scripts/macro/econ_calendar_snapshot_backfill.py --probe-ids ${EXTRA} \
            | tee /tmp/probe.txt
          {
            echo "probe<<PROBEEOF"
            cat /tmp/probe.txt
            echo "PROBEEOF"
          } >> "$GITHUB_OUTPUT"
        id: probe

      - name: Reconstruct PIT release snapshots from FRED history
        if: env.ECB_MODE != 'probe'
        env:
          ICT_OFFVM_BUILD_HOST: "1"
        run: |
          set -euo pipefail
          KINDS_ARG=""
          if [ -n "${ECB_KINDS}" ]; then KINDS_ARG="--kinds ${ECB_KINDS}"; fi
          python scripts/macro/econ_calendar_snapshot_backfill.py \
            --out comms/macro/econ_calendar_snapshots_backfill.jsonl \
            --min-train "${ECB_MIN_TRAIN}" \
            --harmonics "${ECB_HARMONICS}" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ${KINDS_ARG} | tee /tmp/backfill.txt

      - name: Assert the reconstruction is non-empty
        if: env.ECB_MODE != 'probe'
        id: assert
        run: |
          set -euo pipefail
          f=comms/macro/econ_calendar_snapshots_backfill.jsonl
          if [ ! -s "$f" ]; then
            echo "::error::backfill wrote no rows — the M1 study would measure nothing"
            exit 1
          fi
          rows=$(wc -l < "$f")
          kinds=$(python3 -c "
          import json,collections,sys
          c=collections.Counter()
          for l in open('$f'):
              l=l.strip()
              if l: c[json.loads(l)['kind']] += 1
          print(' '.join(f'{k}={v}' for k,v in sorted(c.items())))
          ")
          echo "rows=${rows}"        >> "$GITHUB_OUTPUT"
          echo "per_kind=${kinds}"   >> "$GITHUB_OUTPUT"
          echo "reconstructed ${rows} rows :: ${kinds}"
          # A per-kind count of 1-2 is not a usable sample; surface it loudly rather
          # than letting a technically-non-empty file read as success.
          if [ "$rows" -lt 50 ]; then
            echo "::warning::only ${rows} rows reconstructed — check the series ids resolved the FULL history, not a short tail"
          fi

      - name: Land the reconstructed history on main (auto-merge PR)
        if: env.ECB_MODE != 'probe'
        id: commit
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: comms/macro/econ_calendar_snapshots_backfill.jsonl
          message: "chore(m1): PIT release-history backfill (FRED)"
          pr-title: "chore(m1): PIT release-history backfill (FRED) (auto)"
          pr-body: |
            Reconstructed point-in-time economic-release snapshots from FRED history
            (`econ-calendar-backfill`). Observe-only, data-only; auto-merge.

            Every row carries `backfilled: true`, `expectation_source`
            (the pinned expectation SPEC_VERSION) and `pit_basis`
            (`fred_current_vintage` — keyless FRED serves the CURRENT vintage, NOT
            first prints; ALFRED is the documented upgrade path). A model
            expectation must never be read as an archived survey consensus.
          branch-prefix: automation/econ-calendar-backfill
          # ⚠️ NOT decoration: without this the step exits 0 the moment the PR
          # OPENS, and "the push succeeded" is silently treated as "the rows
          # arrived". They are different claims and only one is what a later
          # session depends on. The action owns the bounded wait — do not copy
          # a timeout here.
          verify-merged: "true"

      - name: Comment + close issue (issue-driven path)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          ROWS: ${{ steps.assert.outputs.rows }}
          PER_KIND: ${{ steps.assert.outputs.per_kind }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
          PR: ${{ steps.commit.outputs.pr }}
          MODE: ${{ env.ECB_MODE }}
          PROBE: ${{ steps.probe.outputs.probe }}
        with:
          script: |
            // Probe mode skips the assert/commit steps, so their outputs are empty. Reporting
            // the backfill template here would post a blank "Rows: ?" that reads like a failed
            // backfill instead of a successful diagnostic.
            if (process.env.MODE === 'probe') {
              const pbody = [
                '🔎 **econ-calendar-backfill — ID PROBE** (diagnostic only, nothing written).',
                '',
                '```', (process.env.PROBE || '(no output)').trim(), '```',
                '',
                'A **FAIL** here is a CONFIG question, not a code change:',
                '- `HTTP 404` → the id is wrong or the series is not on FRED at all. Note',
                '  `WNGSTUS` / `WCESTUS1` are EIA `dnav` codes, **not** FRED ids — for those the',
                "  answer may be a different SOURCE (EIA's keyless weekly feed, or the keyed",
                '  API), not a different id. `BL-20260730-EIA-SERIES-IDS-NOT-FRED`.',
                '- `HTTP 200 but EMPTY history` → the id resolves but serves nothing; a data',
                '  question, not a typo.',
                '',
                'The probe never tries candidate ids and adopts whichever resolves — that would',
                'backfill from whatever happened to work.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: pbody,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed',
              });
              return;
            }
            const body = [
              '📚 **econ-calendar-backfill** — PIT release history reconstructed from FRED.',
              '',
              `Rows: **${process.env.ROWS || '?'}**`,
              '',
              '```', `per kind: ${process.env.PER_KIND || '(none)'}`, '```',
              '',
              process.env.COMMITTED === 'true'
                ? `landed via auto-merge PR: ${process.env.PR}`
                : 'no change to land this run.',
              '',
              'Next: run the event study against this file to get an M1/M2 read at real n —',
              '`--snapshots comms/macro/econ_calendar_snapshots_backfill.jsonl`. Then **M3**:',
              'validate model-surprise against the captured survey consensus on the overlap.',
              'M3 is a **precondition** of the operator-approved gate, not a follow-up.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });
