name: gld-compat-matrix

# GLD Track B (M36) per-account compatibility gate on a free GitHub-hosted
# runner (operator-approved 2026-08-02). Emits the config-exact gld_pullback_1h
# harness trades on GLD (Yahoo candles; the sandbox firewalls Yahoo so this only
# runs here) at the CORRECTED commission-free fee (0 bps), then scores that
# ledger against EVERY account's ruleset via scripts/prop/account_compat_matrix.py
# --ledger. The ROUTE verdict for `alpaca_portfolio` (the paper-money portfolio
# mirror) is the evidence gate for routing gld_pullback_1h deeper into the
# portfolio. gld_pullback_1h is NOT in the BTC-system ROSTER, so the compat
# matrix's --ledger path (not --strategy) is the correct entrypoint — the emit
# JSONL round-trips exactly through src.prop.montecarlo.ledger_to_r_sequence.
#
# Emit reuses scripts/research/regime_debt_matrix.emit_trades_for (the same
# config-exact harness path the debt matrix + walk-forward use), fee forced to 0.
#
# Triggers:
#   1. workflow_dispatch — inputs: strategy (default gld_pullback_1h), symbol
#      (default GLD), fee_bps (default 0), days (default 730)
#   2. issues.opened with label `gld-compat-matrix-request` (owner-guarded);
#      optional issue-body lines `strategy:`, `symbol:`, `fee_bps:`, `days:`
#
# Safety: READS the repo + fetches PUBLIC candles + runs the read-only harness +
# the read-only compat matrix + comments/uploads the verdict, and LANDS the
# flattened verdicts on main via a commit-to-main PR (see the landing steps
# below). It does NOT deploy and does NOT touch config/accounts.yaml — routing
# gld_pullback_1h onto an account is a Tier-3 config edit the operator approves
# separately (this only produces the evidence).
#
# ⚠️ THIS HEADER SAID "It does NOT push" UNTIL 2026-08-30 AND THAT IS NO LONGER
# TRUE. The landing steps were added the same day, so the workflow now opens a PR
# against main carrying docs/research/gld-compat-matrix-verdicts.jsonl. The write
# is to a research corpus only — never to config/, src/, or a unit file — but a
# reader reasoning from the old sentence would conclude this workflow cannot
# change the repo, which is the dangerous direction. Field beats comment.

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Harness strategy name"
        default: "gld_pullback_1h"
      symbol:
        description: "Instrument symbol"
        default: "GLD"
      fee_bps:
        description: "Round-trip fee (bps) — GLD is commission-free on Alpaca, so 0"
        default: "0"
      days:
        description: "Trailing days of candles"
        default: "730"
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write   # commit-to-main opens the landing PR

concurrency:
  group: gld-compat-matrix-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  compat:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.issue.user.login == github.repository_owner ||
        github.event.issue.user.login == 'github-actions[bot]') &&
       contains(github.event.issue.labels.*.name, 'gld-compat-matrix-request'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT, not GITHUB_TOKEN: `commit-to-main` pushes a branch and opens a
          # PR that must TRIGGER the required checks, and a PR authored by
          # GITHUB_TOKEN does not — its auto-merge would wait forever. Same
          # reason the research-queue dispatcher checks out this way.
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}

      - name: Parse issue body
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          strat=$(printf '%s' "$ISSUE_BODY" | grep -iE '^strategy:' | head -1 | cut -d: -f2- | xargs || true)
          symbol=$(printf '%s' "$ISSUE_BODY" | grep -iE '^symbol:' | head -1 | cut -d: -f2- | xargs || true)
          fee_bps=$(printf '%s' "$ISSUE_BODY" | grep -iE '^fee_bps:' | head -1 | cut -d: -f2- | xargs || true)
          days=$(printf '%s' "$ISSUE_BODY" | grep -iE '^days:' | head -1 | cut -d: -f2- | xargs || true)
          echo "GC_STRAT=${strat:-gld_pullback_1h}" >> "$GITHUB_ENV"
          echo "GC_SYMBOL=${symbol:-GLD}" >> "$GITHUB_ENV"
          echo "GC_FEE=${fee_bps:-0}" >> "$GITHUB_ENV"
          echo "GC_DAYS=${days:-730}" >> "$GITHUB_ENV"

      - name: Set params from dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "GC_STRAT=${{ github.event.inputs.strategy || 'gld_pullback_1h' }}" >> "$GITHUB_ENV"
          echo "GC_SYMBOL=${{ github.event.inputs.symbol || 'GLD' }}" >> "$GITHUB_ENV"
          echo "GC_FEE=${{ github.event.inputs.fee_bps || '0' }}" >> "$GITHUB_ENV"
          echo "GC_DAYS=${{ github.event.inputs.days || '730' }}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet pyyaml pandas numpy yfinance

      - name: Emit the config-exact harness trades (fee forced to GC_FEE)
        env:
          GC_STRAT: ${{ env.GC_STRAT }}
          GC_SYMBOL: ${{ env.GC_SYMBOL }}
          GC_FEE: ${{ env.GC_FEE }}
          GC_DAYS: ${{ env.GC_DAYS }}
        run: |
          set +e
          mkdir -p artifacts/gld/work
          python - <<'PYEOF' > artifacts/gld/emit.json 2> artifacts/gld/emit.log
          import json, os
          from scripts.research.regime_debt_matrix import emit_trades_for, resolve_strategy
          name = os.environ["GC_STRAT"]; sym = os.environ["GC_SYMBOL"]
          fee = float(os.environ["GC_FEE"]); days = int(os.environ["GC_DAYS"])
          cfg = resolve_strategy(name)
          if cfg is None:
              print(json.dumps({"error": f"{name} not declared in strategies.yaml"})); raise SystemExit(0)
          row = emit_trades_for(name, cfg, "artifacts/gld/work", days,
                                symbol_override=sym, fee_override=fee)
          print(json.dumps(row, default=str))
          PYEOF
          echo "emit rc=$?"; cat artifacts/gld/emit.json; tail -20 artifacts/gld/emit.log || true

      # Give the runner a REAL balance source, so the standard arm is not inert.
      # There is no journal DB here, so load_balance_snapshots() returns None and
      # every standard account resolves `unreadable` -> the whole standard arm
      # grades UNGRADED. This fetches the balances the bot already publishes.
      #
      # ⚠️ IT IS NOT A DEFAULT SIZE. The synthetic $10,000 Lane P removed must
      # not come back through this door: the payload is the venue-derived
      # snapshot the live VM recorded, and every freshness / api_ok check in
      # resolve_standard_account_size still applies downstream — a stale row
      # still grades STALE and REFUSES. Verified by planted control.
      #
      # ⚠️ A FETCH FAILURE MUST LEAVE NO FILE. `curl -o` writes the file even on
      # an HTTP error, so a 502 body would be handed to the matrix as if it were
      # balances; --fail-with-body + an explicit rm on failure keeps
      # "we could not look" distinct from "we looked and got balances".
      - name: Fetch live account balances (the standard arm's size source)
        run: |
          set +e
          mkdir -p artifacts/gld
          BAL=artifacts/gld/balances.json
          curl -fsS --max-time 30 \
            "https://ict-bot.duckdns.org/api/bot/accounts/balances" -o "$BAL"
          rc=$?
          if [ $rc -ne 0 ] || [ ! -s "$BAL" ]; then
            echo "balances fetch FAILED (rc=$rc) — the standard arm will grade UNGRADED."
            echo "That is the honest state: we could not look, not that the accounts are unreadable."
            rm -f "$BAL"
            exit 0
          fi
          python - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path("artifacts/gld/balances.json").read_text())
          b = d.get("balances") or {}
          # STATE THE DENOMINATOR: an empty payload is a successful read of
          # nothing, which is NOT the same as a failed fetch, and the matrix
          # reports the two differently.
          print(f"balances: {len(b)} account(s); source={d.get('source')} as_of={d.get('as_of')}")
          for k, v in sorted(b.items()):
              print(f"  {k:22s} balance={v.get('balance')} api_ok={v.get('api_ok')} ts={v.get('ts')}")
          if not b:
              print("payload carried ZERO accounts — standard arm will still grade UNGRADED")
          PY

      - name: Score the ledger against every account's ruleset
        run: |
          set +e
          EMIT=$(python -c "import json; print(json.load(open('artifacts/gld/emit.json')).get('emit_path') or '')")
          if [ -z "${EMIT}" ] || [ ! -s "${EMIT}" ]; then
            echo "no emit ledger produced — the emit step failed (see emit.log)"; exit 0
          fi
          echo "ledger: ${EMIT}"
          BAL_ARG=""
          if [ -s artifacts/gld/balances.json ]; then
            BAL_ARG="--balances artifacts/gld/balances.json"
          else
            echo "no balances file — standard accounts will grade UNGRADED (we could not look)"
          fi
          python scripts/prop/account_compat_matrix.py \
            --ledger "${EMIT}" --symbol "${GC_SYMBOL}" --fee-bps-roundtrip "${GC_FEE}" \
            ${BAL_ARG} \
            --out-dir artifacts/gld \
            > artifacts/gld/compat.stdout 2> artifacts/gld/compat.log
          echo "compat rc=$?"; tail -20 artifacts/gld/compat.log || true

      - name: Render summary
        run: |
          python - <<'PYEOF' | tee artifacts/gld/SUMMARY.md
          import glob, json, os
          # emit provenance
          try:
              emit = json.load(open("artifacts/gld/emit.json"))
          except Exception as e:
              emit = {"error": f"emit.json unreadable: {e}"}
          L = ["# GLD Track B — per-account compat gate", ""]
          if emit.get("error") or not emit.get("emit_path"):
              L += [f"**EMIT FAILED:** {emit.get('error') or 'no ledger produced'} — read emit.log in the artifact.",
                    "", "_No compat verdict: the harness emitted no ledger to score._"]
              print("\n".join(L)); raise SystemExit(0)
          L += [f"`{emit.get('strategy')}` · {emit.get('symbol')} {emit.get('timeframe')} · "
                f"{emit.get('harness')} harness · feed {(emit.get('feed') or {}).get('source')} · "
                f"fidelity **{emit.get('fidelity')}** · fee **{emit.get('fee_bps_roundtrip')} bps** · "
                f"**{emit.get('n_emitted')}** emitted trades", ""]
          if emit.get("omitted_levers"):
              L += [f"_omitted levers (approximate): {', '.join(emit['omitted_levers'])}_", ""]
          # compat matrix
          cand = sorted(glob.glob("artifacts/gld/compat_*.json"))
          if not cand:
              L += ["**COMPAT DID NOT RUN** — read compat.log in the artifact.",
                    ""]
              print("\n".join(L)); raise SystemExit(0)
          m = json.load(open(cand[-1]))
          rows = m.get("rows", [])
          L += [f"_Scored {m.get('n_ledger_trades')} ledger trades against {len(rows)} accounts "
                f"({m.get('symbol')} · {m.get('asset_class')}; standard gate: survival ≥ "
                f"{m.get('min_survival')}, P(breach) ≤ {m.get('max_p_breach')})_", "",
                "| account | kind | class | verdict | metric | value | extra |",
                "|---|---|---|---|---|---|---|"]
          def _fmt(r):
              v = r.get("value")
              if v is None:
                  val = "—"
              elif r.get("metric") == "ev_net_usd":
                  val = f"${v:,.0f}"
              else:
                  val = f"{v*100:.1f}%"
              extra = (f"P(net>0)={r.get('p_profitable')}" if r.get("kind") == "prop"
                       else f"P(breach)={r.get('p_breach')}, surv={r.get('survival')}")
              return val, extra
          for r in sorted(rows, key=lambda x: (x.get("account") != "alpaca_portfolio", x.get("account"))):
              val, extra = _fmt(r)
              star = " ⭐" if r.get("account") == "alpaca_portfolio" else ""
              L.append(f"| `{r.get('account')}`{star} | {r.get('kind')} | {r.get('class')} | "
                       f"**{r.get('verdict')}** | {r.get('metric')} | {val} | {extra} |")
          # ⚠️ THE NARRATIVE BELOW USED TO HARDCODE `gld_pullback_1h` WHILE THE TABLE
          # ABOVE WAS PARAMETERISED. Run for iaum_pullback_1d on 2026-08-25, it
          # printed an IAUM table under prose making claims about gld_pullback_1h
          # and its `trending.gld_pullback_1h {short: off}` cell — the label naming
          # a quantity the code did not compute (unprovenanced-diagnostic sub-class
          # A, CLAUDE.md). It also ASSERTED "is ALREADY in alpaca_portfolio's
          # roster", a fact about one strategy that the run never checked for
          # whichever strategy was passed. Both are fixed: the name comes from the
          # emit, and the roster claim is READ, with "we could not look" kept
          # distinct from "it is not there".
          strat = emit.get("strategy") or os.environ.get("GC_STRAT") or "(unknown)"
          roster_state, roster_note = "unknown", "could not read config/accounts.yaml"
          try:
              import yaml
              _acc = yaml.safe_load(open("config/accounts.yaml").read())["accounts"]
              _r = (_acc.get("alpaca_portfolio") or {}).get("strategies") or []
              roster_state = "in" if strat in _r else "absent"
              roster_note = ("already in `alpaca_portfolio`'s roster"
                             if roster_state == "in" else
                             "NOT in `alpaca_portfolio`'s roster")
          except Exception as e:
              roster_note = f"could not read the roster ({e}) — this is 'we did not look', not 'absent'"
          ap = next((r for r in rows if r.get("account") == "alpaca_portfolio"), None)
          L += [""]
          if ap is None:
              L += ["⚠️ **`alpaca_portfolio` not in the account set** — cannot grade the Track-B gate."]
          elif ap.get("verdict") == "ROUTE":
              L += [f"## ⭐ `alpaca_portfolio`: **ROUTE** for `{strat}`.",
                    "",
                    f"`{strat}` is {roster_note}. A ROUTE verdict means the ledger clears that "
                    "account's OWN ruleset at the stated cost — it confirms existing routing where the "
                    "roster already carries the strategy, and is evidence FOR routing where it does not. "
                    "It is not itself a routing decision."]
          elif ap.get("verdict") == "UNGRADED":
              # UNGRADED is "we could not establish what to measure against", NOT "it failed".
              # Conflating them is the defect Lane P (#10364) removed from the EVALUATOR, and this
              # summary used to re-introduce it -- under a Tier-3 de-routing suggestion, which is
              # what a human actually acts on. Backlog row:
              # BL-20260829-GLD-COMPAT-SUMMARY-CALLS-UNGRADED-A-REJECTION-AND-ITS-STANDARD-ARM-IS-INERT-ON-A-RUNNER
              _st = ap.get("size_state") or "unresolved"
              _why = ap.get("size_reason") or "no reason recorded"
              L += [f"## ⭐ `alpaca_portfolio`: **UNGRADED** for `{strat}` — this is NOT a rejection.",
                    "",
                    f"`{strat}` is {roster_note}. **UNGRADED means the gate could not be COMPUTED — "
                    "it does NOT mean the account's ruleset rejects the strategy.** Those are different "
                    "verdicts, and conflating them is exactly the defect Lane P removed from the "
                    "evaluator.",
                    "",
                    f"Missing input: account size is `{_st}` ({_why}).",
                    "",
                    "**No routing conclusion follows in either direction.** This is not evidence for "
                    "keeping the routing and not evidence against it. Fix the input and re-run — do "
                    "not read it as a pass or a fail.",
                    "",
                    "⚠️ On a GitHub runner this is the EXPECTED state unless a balance source is "
                    "supplied: there is no journal DB here, so `load_balance_snapshots()` returns "
                    "`None` and every standard account resolves `unreadable`. The fix is to give the "
                    "runner real balances (available unauthenticated from `/api/bot/accounts/balances`) "
                    "— NOT to restore the synthetic $10,000 default, which is the fabricated size Lane P "
                    "removed."]
          else:
              L += [f"## ⭐ `alpaca_portfolio`: **{ap.get('verdict')}** (measured — does NOT clear) for `{strat}` — FLAG.",
                    "",
                    f"`{strat}` is {roster_note}. This verdict WAS computed against the account's real "
                    "size and did not clear its ruleset. If the strategy IS in the roster, that is a "
                    "paper book trading a strategy its own ruleset rejects — a genuine Tier-3 flag: "
                    "consider whether to keep the routing."]
          L += ["", f"**No config edit is made by this run.** Routing/de-routing `{strat}` on an "
                "account is a Tier-3 config/accounts.yaml decision the operator owns."]
          print("\n".join(L))
          PYEOF

      # ---------------------------------------------------------------- landing
      # R2: "A job that exits 0 having landed nothing is a FAILED job."
      #
      # This workflow ended at `upload-artifact`, and a PM-side session has NO
      # artifact download (root CLAUDE.md) — so every verdict it had ever computed
      # died with the run. It is one of the eighteen in
      # BL-20260827-EIGHTEEN-EVIDENCE-WORKFLOWS-UPLOAD-AND-LAND-NOTHING.
      #
      # That became blocking on 2026-08-30: research/queue/RQ-20260827-001.yaml
      # routes here and declares `lands.store` +`min_rows: 1`, and it is the FIRST
      # job an armed cron fires. Arming without this would have produced, on day
      # one, precisely the unlandable result the disposition ledger exists to find.
      #
      # ⚠️ THE LANDING PR INHERITS A KNOWN OPEN BUG:
      # BL-20260830-A-TRANSIENT-RED-BASE-PERMANENTLY-STRANDS-AN-AUTOMERGE-BRANCH.
      # `commit-to-main` opens an `automation/*` PR whose checks run ONCE; if the
      # base is transiently red at that moment, nothing ever re-runs them and the
      # rows sit unmerged. Measured 2026-08-30: 7 of 7 automation/* branches were
      # unmerged, three ~68 days old. `scripts/ops/stuck_automation_branches.py`
      # REPORTS that state; nothing yet repairs it. So a `pending_merge` verdict
      # below is expected-and-actionable, NOT a failure of this workflow.
      - name: Extract the verdicts into the committed corpus
        id: extract
        run: |
          set -euo pipefail
          python3 scripts/research/gld_compat_extract.py --in-dir artifacts/gld \
            | tee extract.out

      - name: Land the corpus on main
        id: land
        uses: ./.github/actions/commit-to-main
        with:
          token: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
          paths: docs/research/gld-compat-matrix-verdicts.jsonl
          message: "gld-compat: land per-account verdicts from run ${{ github.run_id }}"
          pr-title: "gld-compat: per-account verdicts (run ${{ github.run_id }})"
          pr-body: |
            Automated landing of `docs/research/gld-compat-matrix-verdicts.jsonl`.
            R2 — the run is not done when it exits 0, it is done when its rows are
            readable on `main`.
          branch-prefix: automation/gld-compat-verdicts
          # Owned by the action, not copied here — see its `verify-merged` docs.
          verify-merged: "true"

      # ⚠️ SCOPED ON *THIS RUN'S* STAMP, NEVER ON A FIELD THE STORE ALREADY HOLDS.
      # The store is cumulative, so `--field account_id --contains bybit` would be
      # satisfied by history and could never fail. That is not hypothetical: the
      # e35 assertion reported `landed - 6624 rows, exit 0` for a run whose rows
      # were entirely on an unmerged branch (fixed in #10487, same shape).
      #
      # ⚠️ `--pushed-ref` IS WHAT MAKES THE VERDICT FAIR RATHER THAN MERELY STRICT,
      # and omitting it is the defect this step shipped with. `commit-to-main`
      # opens an AUTO-MERGE PR: the merge waits on required checks (~11 min), so
      # at the instant this step runs the rows are ALWAYS still on the side
      # branch and never yet on main. Measured on run 33331071521 — the first
      # real execution of this path — the assertion reported:
      #   `absent — only 0 rows ... among 0 total rows`
      # for a run that had emitted 124 trades, scored every account, and pushed
      # a perfectly good commit. `absent` blames the job for work it did. The
      # true state is `pending_merge`, and it is unreachable without naming the
      # ref the rows were pushed to — so the two collapsed into one. That is the
      # same conflation this repo files as a bug class everywhere else, and the
      # step's own comment block already called `pending_merge`
      # "expected-and-actionable" while making it impossible to report.
      #
      # `pending_merge` is still NON-ZERO, deliberately: R2 says the run is done
      # when the rows are readable on main, and they are not yet. It just names
      # the owed merge instead of alleging the run produced nothing.
      - name: Assert the rows actually landed
        if: always()
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LAND_COMMITTED: ${{ steps.land.outputs.committed }}
          LAND_BRANCH: ${{ steps.land.outputs.branch }}
          LAND_PR: ${{ steps.land.outputs.pr }}
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f extract.out ]; then
            echo "::error::extract.out is missing — the extract step did not run, so there is nothing to assert. NOT falling back to a cumulative predicate."
            exit 1
          fi
          STAMP="$(sed -n 's/^run-stamp: //p' extract.out | tail -1)"
          if [ -z "${STAMP}" ]; then
            echo "::error::no run-stamp in extract.out — cannot scope the assertion"
            exit 1
          fi
          # Every extracted row carries the payload's own `generated_at`, so a
          # run that produced rows ALWAYS produces a diff. `committed=false`
          # therefore means the landing did not happen, not that it was a
          # harmless no-op — and without a branch `pending_merge` cannot be told
          # from `absent`, so this refuses rather than guessing.
          if [ "${LAND_COMMITTED:-}" != "true" ] || [ -z "${LAND_BRANCH:-}" ]; then
            echo "::error::the landing step did not commit (committed='${LAND_COMMITTED:-}' branch='${LAND_BRANCH:-}'), so 'pending_merge' cannot be told from 'absent'. The extractor emitted a fresh run stamp, so there was something to commit."
            exit 1
          fi
          # The bounded wait for the owed auto-merge now lives in
          # `commit-to-main` (verify-merged), so by the time this step runs the
          # PR has merged or that step has already failed the job. This keeps
          # only the question the action cannot answer: are THIS RUN'S rows in
          # the file? `if: always()` means it still reports honestly when the
          # landing step failed — `pending_merge`, naming the owed merge, rather
          # than `absent`, which would allege the run produced nothing.
          # ⚠️ TWO FETCHES, NOT ONE, AND THE FIRST MUST SUCCEED.
          #
          # This was `git fetch origin main "${LAND_BRANCH}" ... || true` and it
          # produced a FALSE NEGATIVE on a run that fully succeeded (33340468235).
          # `commit-to-main` merges with --delete-branch, so on the SUCCESS path
          # the landing branch is GONE by the time this runs. `git fetch` aborts
          # atomically on an unknown refspec — verified, not assumed: with a real
          # deleted branch it prints `fatal: couldn't find remote ref` and does
          # NOT update origin/main — so `main` was never fetched either, the
          # assertion read the checkout-time ref that PREDATES the merge, and
          # reported `absent` for rows that were already on main. The `|| true`
          # swallowed the fatal.
          #
          # An assertion built to stop false "landed" claims was manufacturing
          # false "absent" ones, which is the worse direction here: it fails a
          # correct run and trains the reader to ignore it.
          git fetch origin "${DEFAULT_BRANCH:-main}"

          # The landing branch may legitimately be absent — that IS the merged
          # case. Fetch it separately and tolerantly, and only claim a pushed-ref
          # when we actually hold one; passing a ref that does not resolve would
          # make `pending_merge` unreadable again.
          PUSHED=()
          if git fetch origin "${LAND_BRANCH}" 2>/dev/null; then
            PUSHED=(--pushed-ref "origin/${LAND_BRANCH}")
            echo "landing branch still present — pending_merge is distinguishable"
          else
            echo "landing branch is gone (deleted on merge) — its rows must be on ${DEFAULT_BRANCH:-main}"
          fi
          echo "asserting THIS run's rows: run_generated_at=${STAMP}"
          python3 scripts/ci/assert_rows_landed.py \
            --store docs/research/gld-compat-matrix-verdicts.jsonl \
            --ref "origin/${DEFAULT_BRANCH:-main}" \
            "${PUSHED[@]}" \
            --field run_generated_at --contains "${STAMP}" --min-rows 1

      # `if: always()` — a failed landing assertion must not also destroy the
      # evidence. Run 33331071521 skipped this step because the assertion above
      # failed, so the one run that most needed its compat_*.json kept none.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gld-compat-matrix-${{ github.run_id }}
          path: |
            artifacts/gld/SUMMARY.md
            artifacts/gld/emit.json
            artifacts/gld/emit.log
            artifacts/gld/compat_*.json
            artifacts/gld/compat_*.md
            artifacts/gld/compat.log
            artifacts/gld/work/*__trades.jsonl
          retention-days: 14
          if-no-files-found: warn

      - name: Comment summary on issue
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '_(summary not produced — read the logs in the artifact)_';
            try { body = fs.readFileSync('artifacts/gld/SUMMARY.md', 'utf8'); } catch (e) {}
            const footer = '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.slice(0, 60000) + footer,
            });

      # ONE machine-readable line, LAST in the job, so a reader sweeping N legs
      # pulls the verdict with a 10-line tail instead of an 85-line one.
      # It RE-READS the compat JSON rather than echoing the summary step's prose,
      # so it cannot drift from the graded rows, and it names the leg it read so
      # a verdict is never attributed to the wrong strategy by dispatch order.
      #
      # ⚠️ It carries `dd` (dd_model_state) because account_compat_matrix.py says
      # to read it BESIDE p_breach: on a `refusal`-consequence drawdown it reads
      # `not_terminal`, meaning the drawdown limit did not contribute to p_breach
      # at all — so a low p_breach there is NOT evidence of a durable account.
      # A compact line that dropped it would be the more dangerous summary.
      - name: One-line verdict (VERDICT_LINE)
        if: always()
        run: |
          set +e
          python - <<'PYEOF'
          import glob, json, os
          strat = os.environ.get("GC_STRAT", "(unset)")
          files = sorted(glob.glob("artifacts/gld/compat_*.json"))
          if not files:
              # "we could not look" — NOT "every account refused".
              print(f"VERDICT_LINE strategy={strat} state=no_compat_json")
              raise SystemExit(0)
          try:
              d = json.loads(open(files[0]).read())
          except Exception as exc:                          # noqa: BLE001
              print(f"VERDICT_LINE strategy={strat} state=unreadable detail={exc}")
              raise SystemExit(0)
          rows = d.get("rows") or []
          if not rows:
              print(f"VERDICT_LINE strategy={strat} state=no_rows")
              raise SystemExit(0)
          def cell(acct):
              r = next((x for x in rows if x.get("account") == acct), None)
              if r is None:
                  return f"{acct}=ABSENT"
              return (f"{acct}={r.get('verdict')}|ret={r.get('value')}"
                      f"|surv={r.get('survival')}|pb={r.get('p_breach')}"
                      f"|dd={r.get('dd_model_state')}|size={r.get('size_state')}")
          print(f"VERDICT_LINE strategy={d.get('strategy', strat)} state=read "
                f"n={d.get('n_ledger_trades')} sym={d.get('symbol')} "
                f"{cell('alpaca_portfolio')} {cell('alpaca_live')}")
          PYEOF
