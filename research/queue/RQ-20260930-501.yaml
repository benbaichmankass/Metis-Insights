id: RQ-20260930-501
title: 'HyroTrader fit, Stage 0: does the ict_scalp 15m book (ETH+SOL+XRP) clear a pre-registered edge AND rule-fit gate over ~5 years? (lane HYRO-STRATS)'
status: done
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment

question: >-
  The 365-day cost-complete records (comms/strategy_evidence/, 2026-09-25) show
  ict_scalp_eth_15m / sol_15m / xrp_15m at net R +9.12 / +4.86 / +4.08 (n = 117 /
  132 / 129; pooled 378, PF ~1.16). Over the pooled ledger the exploratory
  HyroTrader Monte Carlo (docs/research/hyro-strategy-feasibility-2026-09-30.md,
  run BEFORE this unit and therefore NOT evidence for it) gives P(pass both
  evaluation phases) about 0.27 at 1% risk, best case. Does that survive a
  ~5-year window that the 365-day record did not see: is the pooled full-cost net R
  positive, and does the HyroTrader pass probability still clear the registered bar
  under the strict ruleset?

why_this_matters: >-
  Operator, ~05:40Z 2026-09-30: HyroTrader "is looking better" but "we don't have
  a lot of strategies geared towards it" (same-UTC-day closes, short timeframes).
  The 15m ict_scalp legs are the only committed crypto legs that both close
  same-day (92-97%) and are net-positive under the full cost stack. Their evidence
  is one 365-day window with parameter_selection "not_established", and every 15m
  leg's final fold is negative. Buying an evaluation ($59, refundable only with
  the first payout) on that alone would be a live-money decision on n = 378 and one
  regime. This unit is the cheap test that decides whether anything further is worth
  building for HyroTrader on the existing families.

power:
  expected_n: 1200
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d = 0.3 needs (1.96 + 0.8416)^2 / 0.3^2 = 87.2 -> 88 trades (the repo's standing
    floor, RQ-20260928-011/-012). The registered N_FLOOR is 300 pooled trades, not 88,
    because the statistic that gates is a pass PROBABILITY, which is far noisier than a
    mean. expected_n = 1200 is an INFERENCE: the committed 15m ledgers run 0.33-0.38
    trades/day/leg, so 3 legs x ~5 years is about 1.06 x 1830 = 1,940 trades before the
    builder's fold trimming; 1200 is set below that. It is not a measurement of the
    5-year window, which nobody has run.
  feasibility:
    source: none
    accrual_basis: >-
      Historical re-run; nothing accrues. Candles: the builder's own fetch for the
      window (RQ-20260929-401 documents the trainer staging dir for 2020/21-2026 SOL /
      ETH / XRP 15m). If the runner cannot reach 1830 days of candles the builder
      returns coverage_state harness_failed and this unit reads producer_failed (never
      FAIL).

decision_rule:
  id: RULE-RQ0930-501-HYRO-15M-BOOK-STAGE0
  registered_at: '2026-09-30'
  registered_before_run: true
  statistic: >-
    scripts/research/hyro_fit_verdict.py --leg ict_scalp_eth_15m --leg ict_scalp_sol_15m
    --leg ict_scalp_xrp_15m --days 1830: builds cost-complete per-trade ledgers with
    scripts/ops/build_strategy_evidence.py (fee 7.5 bps round trip + venue slippage +
    funding per window, execution_costs), pools them by entry time, and reports (n, pooled
    full-cost net R, and P(pass BOTH evaluation phases) from scripts/research/hyro_passprob_mc.py
    under config/prop_rulesets/hyrotrader.yaml [STRICT: 4% daily trailing on floating equity,
    5% static max, 40% single-day cap, 5 qualifying days, reading A], risk 1.0% of balance per
    trade, 1500 paths x seeds 1,2,3, 720-day per-phase horizon, flag_frac 0.0).
  rule: >-
    UNDERPOWERED (indeterminate) IF pooled n < 300. NOT_APPLICABLE (producer_failed) IF the builder
    emits no ledger for any named leg. ELSE PASS IF (A) pooled full-cost net R > 0 AND
    (B) P(both) >= 0.25 on ALL 3 seeds AND (C) with every sampled R shifted by -0.03, P(both) >= 0.10
    on ALL 3 seeds. ELSE FAIL. 0.25 is the break-even pass probability at the $59 deposit
    (refundable on first payout; ~$200 net of split in the first 90 funded days): 59 / (200 + 59) =
    0.228, rounded up. A PASS is Stage-0 evidence for the book only: it authorises the blocked
    unit RQ-20260930-502 (maker entries), NOT a purchase and NOT a roster change. A FAIL is one
    pass and re-queues for a confirmatory run before it is read as a kill.
  what_it_does_not_do: >-
    Does not test the demo-realism flag: gate B assumes NO fill is flagged (best case), and the
    verdict also prints, informationally only, P(both) if half the fills were flagged (0.03-0.05 on the
    exploratory run). Does not touch config/strategies.yaml, config/accounts.yaml or any prop
    account. Does not establish that the funded phase venue matches the evaluation's.

routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 45
  basis: >-
    Three 15m legs x 1830 days through the harness (RQ-20260929-401's census ran the same legs
    on the trainer), plus ~6 Monte Carlo runs of 1500 paths (about 5 s each locally at 720d).

run:
  workflow: research-script-run.yml
  timeout_minutes: 120
  command:
  - python3
  - scripts/research/hyro_fit_verdict.py
  - --leg
  - ict_scalp_eth_15m
  - --leg
  - ict_scalp_sol_15m
  - --leg
  - ict_scalp_xrp_15m
  - --days
  - '1830'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20260930-501

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

related:
  - docs/research/hyro-strategy-feasibility-2026-09-30.md
  - docs/research/hyrotrader-bybit-deep-dive-2026-09-30.md
  - config/prop_rulesets/hyrotrader.yaml
  - RQ-20260930-502 (blocked) and RQ-20260930-503 (blocked)
last_dispatched_at: '2026-09-30T08:05:41+00:00'
