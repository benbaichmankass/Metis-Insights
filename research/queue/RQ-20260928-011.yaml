  the pre-registered rule, from committed results only; the run was token-free (research-script-run on main a5533f9,
  fired by research-queue-dispatch run 36485344972 at 21:20Z). VERDICT: PASS = CUSHION_FIT_WINS on BOTH legs
  (RULE-RQ0928-011, grade cushion_vs_flat, overall all; run 36485452757;
  comms/research/RQ-20260928-011/36485452757/verdict.json + grid.json on main, E5 rows
  research/results/RQ-20260928-011/36485452757.jsonl). POPULATION: trend_donchian_eth_prop n=169 committed trades
  (comms/strategy_evidence/runs/2026-09-26), trend_donchian_sol_prop n=65 (runs/2026-09-25), --book breakout_1
  resolution, 5 arms x 5 seeds = 50 cells, path mode, --ruleset breakout.yaml --costs breakout --funded-start fresh
  --swap-model dxtrade. MEASURED ev_net_usd_per_life ranges over seeds 1-5: ETH arm A (balance 1.5%) +128.0..+139.9 with
  P(net>0) 0.299..0.323, B (start) +122.8..+137.2 / 0.303..0.329, C-0.25 (room 25%) +235.1..+254.3 / 0.510..0.535,
  C-0.33 +197.3..+212.7 / 0.431..0.441, C-0.5 +156.3..+161.7 / 0.346..0.362; SOL A +109.6..+121.8 / 0.345..0.363, B
  +111.5..+118.4 / 0.340..0.357, C-0.25 +96.3..+107.2 / 0.420..0.431, C-0.33 +135.5..+144.7 / 0.422..0.443, C-0.5
  +109.1..+123.0 / 0.347..0.366. Best cushion arm beats A on ev with >= survival on all 5 seeds: ETH C-0.25, SOL C-0.33.
  CAVEAT THAT GATES THE DELIVERABLE: this unit's rule was gated on RQ-20260928-015 REPRODUCED, and -015 landed
  NOT_REPRODUCED (both legs' graduation figures are ~75-85% above what the committed evidence gives;
  PI-20260928-PEVRECON-0001, ask_operator). The dispatcher fired both in one batch, so this is a valid RELATIVE
  comparison on the committed-evidence baseline and NOT a confirmation of the graduation baseline; even the best arm
  leaves ETH at P(net>0) ~0.52 and SOL ~0.43, below the 0.70 pass floor RQ-20260928-012 uses. No Tier-3 sizing proposal
  is filed from this unit until the operator resolves PEVRECON; when that clears, the proposal is 'room-fraction cushion
  sizing, ETH 0.25 / SOL 0.33, risk 1.5%', re-run on whichever population the operator names as the baseline.
