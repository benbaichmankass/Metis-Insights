id: RQ-20261005-808
title: 'Tradeify 247 1-Step prop fit, LONGER WINDOW (730d): trend_donchian_sol_prop at sizing flat 0.75% of balance (lane
  PROP-FIT-POWER, RULE-TRADEIFY-FIT)'
status: queued
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 2
question: 'Does trend_donchian_sol_prop (SOLUSDT 1h) clear the operator''s prop bar -- E[net $ banked before the account dies]
  > 0 with P(net>0) >= 0.70 on every seed -- under Tradeify 247 1-Step''s own rules (config/prop_rulesets/tradeify_247_1step.yaml:
  3% daily / 6% static max, 12% target, 22:00 UTC reset, 5:1 BTC/ETH and 2:1 alt notional cap, hedging banned, 0.04%/side
  commission, prorated swap) when sized flat 0.75% of balance? Re-prices the leg''s committed trade evidence; no new backtest.
  Prices the 730d committed evidence record''s 132 trades (comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_sol_prop__trades.jsonl),
  not the 365d record that held fewer.'
why_this_matters: RQ-20261004-755..764 returned UNDERPOWERED or NULL because prop_ev_grid priced the newest committed 365d
  record (fewer trades than the memo n). This unit re-asks the same question on the 730d record, pinned by path, so n is at
  or above the 88 floor and the verdict is an answer rather than 'could not answer'.
power:
  expected_n: 132
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (floor registered by RQ-20260928-011/-012). expected_n=132
    is the row count of comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_sol_prop__trades.jsonl, counted before
    this unit was registered; below 88 the unit grades UNDERPOWERED, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-grading of a committed 730d trade record; nothing accrues.
decision_rule:
  id: RULE-RQ1005-TRADEIFY-FIT-LONG-trend_donchian_sol_prop-f075
  registered_at: '2026-10-05'
  registered_before_run: true
  statistic: 'Per seed: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over trend_donchian_sol_prop''s 730d
    committed trades (comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_sol_prop__trades.jsonl), under config/prop_rulesets/tradeify_247_1step.yaml,
    --lev-cap trend_donchian_sol_prop=2, --no-hedge, sizing flat 0.75% of balance.'
  rule: PASS IF ev_net_usd_per_life > 0 on ALL 5 seeds AND P(net>0) >= 0.70 on ALL 5 seeds. UNDERPOWERED (indeterminate) IF
    n < 88. FAIL IF ev <= 0 on any seed. NULL (indeterminate) otherwise. A PASS is a Tier-3 roster proposal for tradeify_1
    and is NOT applied by this unit; a FAIL is one pass and re-queues for a confirmatory run before it is read as a kill.
  what_it_does_not_do: Does not touch config/accounts.yaml, config/strategies.yaml or the tradeify_1 roster. Prices committed
    trades from a longer-window backtest (full cost stack, fee 7.5 + slippage 3.0 + funding 1.0 bps); not a live-parity check.
    The longer window includes an earlier year, so it measures a longer period, not a corrected one.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 20
  basis: 1 leg x 1 arm x 5 seeds of prop_ev_sim, same shape and cost as the generated Breakout prop-fit units.
run:
  workflow: research-script-run.yml
  timeout_minutes: 90
  command:
  - python3
  - scripts/research/prop_ev_grid.py
  - --leg
  - trend_donchian_sol_prop=comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_sol_prop__trades.jsonl
  - --arm
  - A=--sizing balance --risk-pct 0.0075
  - --common
  - --ruleset config/prop_rulesets/tradeify_247_1step.yaml --lev-cap trend_donchian_sol_prop=2 --no-hedge --swap-model prorated
    --funded-start fresh
  - --seeds
  - 1,2,3,4,5
  - --grade
  - pass_all_seeds
  - --p-floor
  - '0.70'
  - --n-floor
  - '88'
  - --out
  - '{out_dir}'
  - --jobs
  - '4'
  inputs:
    research_unit: RQ-20261005-808
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- docs/research/tradeify-portfolio-feasibility-2026-09-30.md
- config/prop_rulesets/tradeify_247_1step.yaml
- research/queue/RQ-20261004-758.yaml
- comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_sol_prop.json
