question: 'RQ-20261014-f0e2-10 PASSED (VH95: dR +3.07 R, 3/4 folds, n(B)=75, 2024-10-05..2026-10-04) as the best of three arms. Re-ask the single
  chosen arm against the declared leg on the disjoint preceding window 2022-10-05 .. 2024-10-04 23:59: dR >= 2.0 R, no worse drawdown, >= 3 of
  4 calendar folds. Two arms only (B, VH95).'
why_this_matters: 'Same discipline as 470a-01: a best-of-3 single-window pass is a lead. trend_donchian_sol_4h is on no roster (config/accounts.yaml
  2026-10-14); a CONFIRMED feeds the regime-selectivity skill''s walk-forward-before-Tier-3 rule and the P5 breadth pool, never a config change
  here.'
power:
  expected_n: 70
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo's standing E35 floor). expected_n=70 is an ESTIMATE from f0e2-10's n(B)=75
    over the same 730-day length, not a measurement of this window. Below 39 baseline trades the unit grades indeterminate (underpowered), never
    FAIL. The R bar is a MATERIALITY bar over the whole window, not a significance test; the 3-of-4 calendar-fold majority refuses a one-period
    artifact.
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing
      accrues.
decision_rule:
  id: RULE-RQ20261014470a10
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd plus the arm''s tokens; full
    cost stack: fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r, max_drawdown_r,
    plus net_r per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared; VH95 = --vol-skip-above-pctl 0.95.
    No other arm.. Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B. Also reported
    per arm, not graded: net_r_per_capital_day (the programme''s headline measure).'
  rule: 'indeterminate IF the positive control fails (no committed record exists on this window, so no control is passed: the B arm is reported
    and is itself the baseline) or n(B) < 39 (underpowered: no verdict; never FAIL on thin n). A candidate C PASSES iff dR >= 2.0 R AND dDD <=
    0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR). FAIL IF none passes: the declared value stands and the axis is
    recorded honest_negative on this window for this leg. PASS reads CONFIRMED (both windows); FAIL reads NOT CONFIRMED and f0e2-10 is recorded
    as a selection/period artifact; indeterminate re-asks once on 2020-10-05 .. 2022-10-04 23:59, nothing else changed. The 2.0 R bar, the drawdown
    clause, the 3-of-4 fold majority and the 39 floor are not changed after any result.'
  what_it_does_not_do: Does not re-select, does not pool windows, does not edit config/regime_policy.yaml or any roster.
