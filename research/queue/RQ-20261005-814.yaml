id: RQ-20261005-814
title: 'Breakout 1-Step Turbo $5k prop fit (730d): trend_donchian_sol_prop at FLAT sizing (0.5% and 1.0% of the $5k start) (lane PHONE-EXEC-1B, roster for the
  phone-executed Breakout account)'
status: queued
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 1
question: 'Does trend_donchian_sol_prop clear the operator''s prop bar -- E[net $ banked before the account dies] > 0 with
  P(net>0) >= 0.70 on every seed -- under Breakout 1-Step Turbo''s own rules (config/prop_rulesets/breakout_turbo_1step.yaml:
  3% daily from 00:30 UTC balance, 3% STATIC max drawdown = $150 on $5k, 9% target) sized the way a fresh Breakout instance
  is sized (room: min(1.5% x balance, 0.33 x binding cushion), skip below $10)? Re-prices the 730d committed trades.'
why_this_matters: Companion to the room-sizing unit for the same leg; this one picks the FLAT cap. The operator directed a phone-executed live Breakout Turbo account carrying breakout_1's legs. The Turbo
  max drawdown is half the Classic's ($150 vs $300), so the Classic verdicts do not transfer; SOL already failed Tradeify's
  rules (RQ-20261005-807). A leg that FAILS here stays off the new account (Tier-3, data-backed).
power:
  expected_n: 132
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 needs ~87-90 observations (floor registered by RQ-20260928-011/-012). expected_n is the row count of the
    730d trades file, counted before this unit was registered; below 88 the unit grades UNDERPOWERED, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-grading of a committed 730d trade record; nothing accrues.
decision_rule:
  id: RULE-RQ1005-BREAKOUT-TURBO-FIT-trend_donchian_sol_prop-flat
  registered_at: '2026-10-05'
  registered_before_run: true
  statistic: 'Per seed: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over the 730d committed trades, under
    config/prop_rulesets/breakout_turbo_1step.yaml, --costs breakout --funded-start fresh --swap-model prorated, sizing start (FLAT
    $ per ticket = risk_pct x $5,000), two arms: F050 risk_pct 0.005 ($25) and F100 risk_pct 0.010 ($50).'
  rule: Graded PER ARM. PASS IF ev_net_usd_per_life > 0 on ALL 5 seeds AND P(net>0) >= 0.70 on ALL 5 seeds. UNDERPOWERED (indeterminate) IF
    n < 88. FAIL IF ev <= 0 on any seed. NULL (indeterminate) otherwise. FAIL keeps the leg OFF the Turbo account's roster
    (Tier-3, data-backed under the 2026-09-27 standing authorization); PASS or NULL keeps it ON (the operator's direction is
    to carry breakout_1's legs; NULL is not a fail). SIZING CHOICE (registered
    before the run) -- the phone account trades FLAT because room sizing needs a live balance read the phone does not have
    yet; the flat cap is the arm with the larger MIN-over-seeds ev_net_usd_per_life among arms with ev > 0 on all seeds;
    if neither arm has ev > 0 on all seeds, the smaller arm ($25).
  what_it_does_not_do: Does not prove edge on a live book. Fee $20 is UNCONFIRMED (manager relay). Payout fields inherited
    from the Classic ruleset.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 20
  basis: 1 leg x 1 arm x 5 seeds of prop_ev_sim.
run:
  workflow: session-local
  note: Run SESSION-LOCAL by lane PHONE-EXEC-1B (go-live tonight per operator direction 2026-10-05 ~15:20Z).
  command:
  - python3
  - scripts/research/prop_ev_grid.py
  - --leg
  - trend_donchian_sol_prop=comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_sol_prop__trades.jsonl
  - --arm
  - F050=--sizing start --risk-pct 0.005
  - --arm
  - F100=--sizing start --risk-pct 0.010
  - --common
  - --ruleset config/prop_rulesets/breakout_turbo_1step.yaml --costs breakout --funded-start fresh --swap-model prorated
  - --seeds
  - 1,2,3,4,5
  - --grade
  - pass_all_seeds
  - --p-floor
  - '0.70'
  - --n-floor
  - '88'
  - --out
  - '{out_dir}'
  - --jobs
  - '4'
  inputs:
    research_unit: RQ-20261005-814
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- config/prop_rulesets/breakout_turbo_1step.yaml
- research/queue/RQ-20261005-807.yaml
- docs/integrations/breakout-phone-executor-DESIGN.md
