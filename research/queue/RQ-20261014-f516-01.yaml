id: RQ-20261014-f516-01
title: 'Programme 05 Q1 baseline: E[profit before the account dies] of velotrade_1''s CURRENT book (ETH+SOL prop legs) at its CURRENT
  sizing, switch armed, under velotrade_classic_1step'
status: done
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 1
roadmap:
- L-PROP
question: What is the expected $ banked per account life, P(net>0), P(pass) and P(breach) of velotrade_1 ($5k, velotrade_classic_1step)
  exactly as configured on main today -- roster trend_donchian_eth_prop + trend_donchian_sol_prop, 1.0% of realised balance per ticket
  (accounts.yaml risk_pct 0.01) with the daily-DD switch armed at 0.8 x the firm's 4% daily limit -- priced over the legs' committed
  730 d trades, net of the full cost stack? This is Programme 05's headline measure for this account and the dated baseline every later
  rung must beat.
why_this_matters: 'RESEARCH-MAP P5 measure is E[profit before the account dies] per account, and no record prices any live prop account
  as it is configured TODAY: the earlier fits priced single legs (RQ-20261005-801..810, -853/854) or books at other sizing (RQ-20261007-215..223),
  before per-account risk changed and before the daily-DD switch was armed (DAILY-DD-SWITCH). Without a dated per-account baseline,
  Q2 (sizing), Q3 (per-leg), Q4 (switch) and Q5 (breadth) have nothing to beat.'
power:
  expected_n: 355
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (the floor RQ-20260928-011/-012 registered and every prop fit since
    has used). prop_ev_grid grades on the --leg leg''s n: trend_donchian_eth_prop has 355 committed 730 d trades and trend_donchian_sol_prop
    132 (wc -l of the two trades files, counted 2026-10-14 before registration). Below 88 the grid grades UNDERPOWERED (indeterminate),
    never FAIL.'
  feasibility:
    source: none
    accrual_basis: Re-pricing of committed 730 d trade evidence under the firm's rules; nothing accrues.
decision_rule:
  id: RULE-RQ1014-F516-01-BASELINE-VELOTRADE_1
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: 'Per seed: prop_ev_sim path-mode ev_net_usd_per_life, p_net_positive, p_pass_eval, p_breach_daily_loss, p_breach_max_dd,
    p_pass_by_days{30,90,180} over the 2-leg book under config/prop_rulesets/velotrade_classic_1step.yaml, one arm CFG = ''--sizing
    balance --risk-pct 0.01 --dd-switch-frac 0.8''. Velotrade''s own stack (ruleset header, first-party 2026-10-04): 6 bps round-trip
    commission, 3 bps slippage, 0.05%/night swap (dxtrade model), --no-hedge, per-leg lev caps ETH 5x / SOL 5x, the $ evaluation fee
    and payout split from config/prop_rulesets/velotrade_classic_1step.yaml. The committed trade rows already carry the harness''s fee
    + slippage + funding via execution_costs.resolve_cost_policy() (D1-cleared trend harness); the sim then charges the venue''s own
    stack on top.'
  rule: 'PASS IF ev_net_usd_per_life > 0 AND P(net>0) >= 0.70 on ALL 5 seeds (the B6 V2 bar). UNDERPOWERED (indeterminate) IF n < 88.
    FAIL IF ev <= 0 on any seed. NULL (indeterminate) otherwise. WHAT EACH MEANS: the record IS the account''s baseline whatever the
    verdict (the grading session copies seed-median ev, P(net>0), P(pass by 90 d) into 05-PROP.md § 1). FAIL = the account''s current
    book is negative-EV as configured: velotrade_1''s Q2 sizing unit and Q5 breadth unit move to priority 1 and the manager is told
    the same day (a data task, never a popup and never a retire on this record alone). PASS or NULL = the account keeps trading as configured
    and Q2..Q5 must beat this record''s seed-median ev to propose any change.'
  what_it_does_not_do: Changes no config, roster, sizing or switch setting. Does not prove edge on a live book (a backtest re-priced
    under firm rules). Does not model per-symbol lot rounding or the phone/REST executor's fill latency. The daily-DD switch is modelled
    on the sim's day_start x daily-limit basis (realised + marks), an approximation of the firm-amount basis in src/units/accounts/daily_dd_switch.py.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 40
  basis: '2-leg prop_ev_sim book, 5 seeds x the unit''s arms at the default 4,000 lives, --jobs 4 (2026-10-14 smoke: 400 lives of the
    velotrade book in well under a minute).'
compute: cpu_long
value:
  bucket: own_losses
  usd_at_stake_per_month: 300
  confidence: 0.6
  basis: 'stand-in: three live prop evaluation accounts; the baseline gates every sizing/roster change on them. No balances stated.'
run:
  workflow: research-script-run.yml
  timeout_minutes: 120
  command:
  - python3
  - scripts/research/prop_ev_grid.py
  - --leg
  - trend_donchian_eth_prop=comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_eth_prop__trades.jsonl
  - --arm
  - CFG=--sizing balance --risk-pct 0.01 --dd-switch-frac 0.8
  - --common
  - --trades trend_donchian_sol_prop=comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_sol_prop__trades.jsonl --ruleset config/prop_rulesets/velotrade_classic_1step.yaml
    --costs breakout --commission-bps-rt 6 --slippage-bps-rt 3 --swap-daily 0.0005 --swap-model dxtrade --no-hedge --funded-start fresh
    --lev-cap trend_donchian_eth_prop=5 --lev-cap trend_donchian_sol_prop=5
  - --seeds
  - 1,2,3,4,5
  - --grade
  - pass_all_seeds
  - --p-floor
  - '0.70'
  - --n-floor
  - '88'
  - --out
  - '{out_dir}'
  - --jobs
  - '4'
  - --note
  - 'RQ-20261014-f516-01: Programme 05 Q1 baseline, velotrade_1 as configured 2026-10-14'
  inputs:
    research_unit: RQ-20261014-f516-01
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- docs/research/programmes/05-PROP.md
- docs/claude/work/checklist/B6.json
- scripts/research/prop_ev_sim.py
- scripts/research/prop_ev_grid.py
- config/prop_rulesets/velotrade_classic_1step.yaml
- docs/claude/work/checklist/DAILY-DD-SWITCH.json
