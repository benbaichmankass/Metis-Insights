id: RQ-20261004-666
title: 'Tradeify 247 1-Step prop fit: trend_donchian_eth_prop at sizing flat 0.35% of balance (follow-up to RQ-20261004-655/656
  NULL)'
status: done
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 2
question: RQ-20261004-655/656 (flat 0.5% / 0.75%) returned ev > 0 on all seeds but P(net>0) of only 0.47-0.51 against
  the 0.70 bar. Does a smaller flat risk per trade (0.35% of balance) lift P(net>0) to >= 0.70 on every seed while
  ev stays > 0, under the same Tradeify 1-Step ruleset?
why_this_matters: trend_donchian_eth_prop is the only Tradeify candidate leg with n >= 88 committed trades (169).
  The 2026-09-30 memo found the pessimistic bound turns negative as risk rises; 0.5% and 0.75% both missed the 0.70
  bar, so the question is whether a lower sizing clears it, and at what EV cost.
power:
  expected_n: 169
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (the floor the Breakout prop-fit family registered,
    RQ-20260928-011/-012). expected_n is the leg's committed trade count in the 2026-09-30 feasibility doc; below
    88 the unit grades UNDERPOWERED (indeterminate), never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-grading of committed trade evidence; nothing accrues.
decision_rule:
  id: RULE-RQ1004-TRADEIFY-FIT-trend_donchian_eth_prop-f0035
  registered_at: '2026-10-04'
  registered_before_run: true
  statistic: 'Per seed: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over trend_donchian_eth_prop''s
    committed trades, under config/prop_rulesets/tradeify_247_1step.yaml, --lev-cap trend_donchian_eth_prop=5, --no-hedge,
    sizing flat 0.35% of balance.'
  rule: PASS IF ev_net_usd_per_life > 0 on ALL 5 seeds AND P(net>0) >= 0.70 on ALL 5 seeds. UNDERPOWERED (indeterminate)
    IF n < 88. FAIL IF ev <= 0 on any seed. NULL (indeterminate) otherwise. A PASS is a Tier-3 roster proposal for
    tradeify_1 and is NOT applied by this unit; a FAIL is one pass and re-queues for a confirmatory run before it
    is read as a kill.
  what_it_does_not_do: Does not touch config/accounts.yaml, config/strategies.yaml or the tradeify_1 roster. Prices
    committed trades; it is not a fresh backtest and not a live-parity check.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 20
  basis: 1 leg x 1 arm x 5 seeds of prop_ev_sim, same shape and cost as the generated Breakout prop-fit units.
run:
  workflow: research-script-run.yml
  timeout_minutes: 90
  command:
  - python3
  - scripts/research/prop_ev_grid.py
  - --leg
  - trend_donchian_eth_prop
  - --arm
  - A=--sizing balance --risk-pct 0.0035
  - --common
  - --ruleset config/prop_rulesets/tradeify_247_1step.yaml --lev-cap trend_donchian_eth_prop=5 --no-hedge --swap-model
    prorated --funded-start fresh
  - --seeds
  - 1,2,3,4,5
  - --grade
  - pass_all_seeds
  - --p-floor
  - '0.70'
  - --n-floor
  - '88'
  - --out
  - '{out_dir}'
  - --jobs
  - '4'
  inputs:
    research_unit: RQ-20261004-666
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- docs/research/tradeify-portfolio-feasibility-2026-09-30.md
- config/prop_rulesets/tradeify_247_1step.yaml
- RQ-20261004-655
- RQ-20261004-656
result: 'GRADED 2026-10-04 by lane RESEARCH-RUN against RULE-RQ1004-TRADEIFY-FIT-trend_donchian_eth_prop-f0035. NULL (indeterminate): ev_net_usd_per_life > 0 on all 5 seeds (+80 to +94 USD per life) but P(net>0) is 0.360-0.378, below the 0.70 bar. Sizing curve for trend_donchian_eth_prop on Tradeify 1-Step, n=169 committed trades, 5 seeds each, P(net>0) / EV per life: 0.25% -> 0.15 / -$60; 0.35% -> 0.37 / +$85; 0.50% -> 0.51 / +$305 (RQ-20261004-655); 0.75% -> 0.48 / +$360 (RQ-20261004-656). P(net>0) peaks near 0.5 around 0.5% risk and never approaches the 0.70 bar, so sizing alone cannot clear it for this leg: smaller sizes cannot reach the 12% target before the fee and horizon bite (p_pass_eval 0.26 at 0.25%), larger ones raise death risk. Needs more edge or a multi-leg book, not a different flat size. Stage-0 evidence only; no roster proposal. Source: research-script-run 37219002275 artifact.'
