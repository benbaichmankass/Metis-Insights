theme: live_strategy
priority: 2
kind: experiment
question: 'On trend_donchian_eth_4h, does tightening the trail to 3.5/4.0 x ATR when ADX < 25 (M20_35 = the eba2-15 M3 cell as the control) replace
  the declared exit on net R by >= 0.01 R/trade in 5 of 6 folds over 2020-07..2026-10, at the venue cost stack? DIAGNOSIS of the first test (511e-01,
  eba2-15): MEASURED: RQ-20261022-eba2-15 on eth_4h M3 (ADX<20, tight 3.5) dR +1.56 in 6 of 6 folds but it changed only 4 of 275 trades (paired
  t 1.68): the trigger is almost never true while a trade is open, so the lever is inert in that region. RQ-20261022-511e-01 (ADX<25, tight 2.5)
  on sol_4h dR -7.78, folds 1 of 4, trail_stop exits 14 -> 55: that cell fires but is too tight. RQ-20261023-8961-01 on sol_4h M3 / M5 dR +3.24
  / +3.53 (5 folds each, bar 5.34, 9-12 differing trades, paired t about 0.5). Class: wrong parameter region at both ends (ADX<20 inert, ADX<25
  with 2.5 too tight); the middle cell (ADX<25, tight 3.5-4.0) was never tested. The bar here is 0.01 R/trade, half the parents'', registered
  NOW on legs whose result is not yet seen: the measured effects are 0.006-0.013 R/entry, so a 0.02 bar could not pass any real ADX effect. '
why_this_matters: 'Operator rule 2026-10-22: a first-test fail is diagnosed and re-asked, never retired. Lane EXIT-FAILED-LEVERS-DIAG (2026-10-24),
  row EXIT-FAILED-LEVERS-DIAG, serves 511e-01, eba2-15. Diagnosis and evidence: docs/research/exit-failed-levers-diag-2026-10-24.md. Looked before
  authoring (PLANNING s1): the queue was grepped for the same leg and lever family; no queued or done unit asks this exact arm set. Parents: research/queue/RQ-20261022-511e-01.yaml,
  research/queue/RQ-20261022-eba2-15.yaml.'
power:
  expected_n: 275
  min_detectable_effect: 0.17
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'n = 275 is the MEASURED baseline trade count of trend_donchian_eth_4h in the parent verdict(s). Unpaired one-sample MDE = 2.8/sqrt(n)
    = 0.17 sd. Arms share most trades, so the paired difference is far tighter than that (MEASURED in the diag doc: paired sd 0.06-0.5 R per entry);
    the unit''s bar is stated in R and is not claimed to be detectable at the unpaired MDE. A unit whose lever touches a handful of trades is
    reported with its differing-trade count.'
  feasibility:
    source: none
    accrual_basis: Replays history on freshly fetched public candles for a pinned window; nothing accrues.
decision_rule:
  id: RULE-F08C-12
  registered_at: '2026-10-24'
  registered_before_run: true
  statistic: scripts/research/exit_lever_ablation.py --grade replace on trend_donchian_eth_4h, window 2020-07-01 .. 2026-10-15 23:59, 6 calendar
    folds, net_r per arm net of the harness venue-aware stack (fee 7.5 bps round trip, slippage 3.0 bps round trip, funding 1.0 bps per 8h window;
    MEASURED in the parent verdicts' cost_stack); baseline A = the leg as declared.
  rule: 'INDETERMINATE IF n(A) < 39, or IF every C arm is byte-identical to A (the lever never fired). A candidate C PASSES iff net_r(C) > net_r(A)
    AND delta >= 0.01 R x n(A) AND folds_ge >= 5 of 6 AND maxDD(C) <= maxDD(A) x 1.35. PASS IF one or more pass: the best by net R is named and
    the follow-up is ONE confirmation unit on a disjoint partition (a PASS on one window is a discovery), never a config edit; before any Tier-3
    proposal the winner is re-run with stop fills gap-adjusted (see what_it_does_not_do). FAIL IF none passes: the declared exit stands for THESE
    arms on this leg; the idea is not retired (the operator''s 2026-10-22 rule) and the diagnosis in this unit decides the next variant. Thresholds
    are not changed after any result.'
what_it_does_not_do: 'Edits no config and places no order. Not a promotion case: a PASS is a discovery needing one disjoint-window confirmation.
  HARNESS CAVEAT (code-read 2026-10-24, scripts/backtest_pullback.py / backtest_trend.py): a stop or ratcheted trail that the bar trades through
  fills AT the stop price, not at a gap-open worse than it, and lever exits fill at the bar close; that flatters every arm in proportion to its
  stop exits, so it favours tight-trail arms. A PASS must be re-run gap-adjusted before any Tier-3 note. '
