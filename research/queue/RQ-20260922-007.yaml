id: RQ-20260922-007
title: Is trend_donchian's net-negative verdict the leg, or a harness blind to its exit head?
status: queued
cadence: once
kind: experiment

question: >-
  trend_donchian on bybit_2 flipped from fee-only-positive to net-negative
  under the full cost stack, and it is the leg with the most real-money
  history in the risk-bearing set. Its evidence record also declares
  `fidelity: approximate` and names three omitted levers, all of them the ML
  exit head. Does simulating the exit head recover the 6.65R the cost stack
  took away — i.e. is the fail a property of the strategy, or of a
  measurement that cannot see the lever the live leg actually trades with?

why_this_matters: >-
  MEASURED, comms/strategy_evidence/trend_donchian.json on main at f3746ab:
  net_r_oos -0.4245, net_r_oos_fee_only +6.2231, n_trades_oos 73,
  expectancy_r_oos -0.0058, folds_positive 2 of 4, cost_stack {7.5, 5.0, 1.0}
  bps, `fidelity: approximate`, `omitted_levers: [exit_head_action,
  exit_head_model, exit_head_threshold]`. The whole verdict hangs on 6.6476R
  over 73 trades — 0.0911R per trade — and the leg finishes 0.0058R per trade
  under water. That is a verdict decided in the fourth decimal place by a
  cost constant, on a leg whose exit logic the harness does not model. Under
  RULE-D1 this leg fails Stage 0 and is a demotion candidate for R2/D2. It
  should not be demoted on a number that omits its exits, and it should not
  be kept on the hope that the exits would have saved it. One of those is
  true and nobody has checked which.
  ⚠️ This is also the "tune before demote" case the canonical rules make
  mechanical: a losing leg gets a fine-tuning ATTEMPT before any demotion is
  proposed, and the evidence must be an ARTIFACT, not an assertion. This unit
  produces that artifact.

power:
  expected_n: 73
  min_detectable_effect: 0.35
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    PAIRED: the head-on and head-off arms score the same decision bars, so
    the unit is the per-trade difference and the design is one_sample. The
    floor at d=0.35 is (1.96+0.8416)^2 / 0.35^2 = 64.07, and expected_n = 73
    clears it by 8.93.
    ⚠️ expected_n is the ACHIEVED `n_trades_oos: 73` on the record, not a
    target. An exit head changes WHEN a trade closes, not whether it opens,
    so the count should be stable across arms — but read it off each arm
    rather than assuming, because a head that exits early can change what the
    next entry sees.
    ⚠️ The floor errs one-directionally (queue README): backtest sequences are
    autocorrelated and the true requirement is higher. A null is
    underpowered, never "the head does nothing".
  feasibility:
    source: none
    accrual_basis: >-
      n=73 is observed and committed (comms/strategy_evidence/trend_donchian.json,
      field n_trades_oos, generated 2026-09-22T05:35Z). It is declared
      `source: none` because comms/strategy_evidence is not one of the three
      registered corpora in research_disposition.CORPORA (e35, m20,
      gld_compat — read 2026-09-22), not because the number is unobserved.
      See PI-20260922-STRATEGY-EVIDENCE-IS-NOT-A-REGISTERED-CORPUS.

decision_rule:
  id: RULE-RQ0922-007-EXIT-HEAD-ATTRIBUTION
  registered_at: '2026-09-22'
  registered_before_run: true
  statistic: >-
    recovered_R = net_r_oos(exit head simulated, full cost stack) - (-0.4245),
    and the sign of net_r_oos in the head-simulated arm.
  rule: >-
    IF the head-simulated arm gives net_r_oos > 0, the leg's RULE-D1 fail is
    recorded `attributable_to: omitted_exit_head`, the fail is NOT carried to
    R2/D2 as a demotion input, and the deliverable is a request to re-run this
    leg's evidence record with the head simulated so the corpus stops
    misgrading it. The leg is not thereby promoted — a head-simulated pass at
    n=73 is a Stage-0 pass like any other and faces the same bar.
    IF the head-simulated arm still gives net_r_oos <= 0, the fail is recorded
    `attributable_to: strategy`, the tuning attempt is on record as an
    artifact, and the leg goes to R2/D2 as a demotion candidate WITH that
    artifact attached — which is what "tune before demote" requires before a
    demotion may be proposed at all.
    IF the exit head cannot be simulated at all on this leg — no trained head,
    no replay path — the outcome is `attributable_to: unestablishable`, which
    is NEITHER of the above. It blocks the demotion proposal (a demotion on an
    unmeasurable is a demotion on missing evidence, and the canonical rule is
    explicit that `None` is not `False`) and the finding becomes the missing
    replay path.
  what_it_does_not_do: >-
    It changes no exit-head threshold and flips no gate. Exit logic is Tier-3
    and belongs to exit-refinement; this unit measures, it does not ship.

routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 45
  basis: >-
    Trainer (rescoped 2026-09-26). The unit was originally routed to a free
    runner on the premise that `research-exit-head-build.yml` (a
    `backtest_system` harness fetching its own candles, no VM-resident state)
    was the tool that answers this question. VERIFIED FALSE this session by
    reading both the workflow YAML and the two scripts it calls
    (`scripts/research/build_intrabar_exit_panel.py`,
    `scripts/research/analyze_exit_head.py`): that workflow trains a brand-new
    discovery exit head from scratch and always lands against its own
    hardcoded `RULE-EXIT-HEAD-CLEARS-BAR` — a different model and a different
    statistic than this unit's `net_r_oos(exit head simulated, full cost
    stack) - (-0.4245)`. Both of its cost knobs (`--cost-r`, `--exit-fee-r`)
    default to `0.0` and are never wired from any input the unit could
    declare, which is why run 36239257289's population read
    `cost_r: 0.0, exit_fee_r: 0.0` regardless of run.inputs.
    `scripts/ml/exit_head_replay.py` (driven by
    `research-exit-head-replay-trainer.yml`) is the tool that actually
    replays trend_donchian's PUBLISHED `exit_head_model` and grades it net of
    the FULL venue cost stack. Its artifact
    (`runtime_logs/trainer_mirror/exit_head/*.json`) is published to the
    trainer + live VM and is NOT committed, so a free runner has no copy — the
    same reason `research-exit-head-replay-trainer.yml`'s own header gives for
    routing to the trainer over SSH (operator decision 2026-08-08). peak_memory_gb
    2.0 per that workflow's own header ("a light job — one symbol's backtest +
    a per-bar LightGBM scoring pass").
    If no head is servable for this (strategy, timeframe, symbol), the run
    honestly exits 2 (`COULD NOT MEASURE`) and the result lands
    `attributable_to: unestablishable` — a real outcome, not a failure.

