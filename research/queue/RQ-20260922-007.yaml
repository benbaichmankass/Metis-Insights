run:
  workflow: research-exit-head-build.yml
  inputs:
    research_unit: RQ-20260922-007
    harness: backtest_system
    roster: trend_donchian
    symbol: BTCUSDT
    timeframe: 1h
    clock_tf: 15m
    days: '1830'
    exit_threshold: '0.5'
  note: >-
    `exit_threshold: 0.5` is the workflow default and is used deliberately
    rather than tuned: the question is whether the head as configured recovers
    the gap, not what the best possible threshold would be. Sweeping the
    threshold here would be selecting a parameter on the data the verdict is
    read from — the exact contamination RQ-20260922-006 exists to detect.

lands:
  store: research/results/RQ-20260922-007/<run_id>.jsonl
  assert_field: read_state
  min_rows: 1
  note: >-
    ✅ RE-DECLARED 2026-09-22 (E5), AND THE ORIGINAL WAS WRONG — which is why
    the warning it carried was worth carrying. It read
    `docs/research/m20-sweep-corpus.jsonl`, "declared from the workflow's family,
    not verified by reading its own `git add`". VERIFIED this session by reading
