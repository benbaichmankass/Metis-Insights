question: 'Does a log-spread z-score mean-reversion on XRPUSDT vs ADAUSDT at 1h (scripts/backtest_pairs.py defaults: lookback
  20, entry_z 2.0, exit_z 0.5, stop_z 2.0, max_hold 20 bars, hedge_beta one) produce positive net R over the full fetchable
  window, after the venue-aware cost stack (fee 7.5 bps rt per leg; slippage 3 bps rt per leg (PERP default); funding 1 bps
  per 8 h window per leg, directionless drag)? Both legs are in fetch_backtest_corpus.py CANDIDATE_PAIRS at 1h with 1095 d
  windows (the longest crypto windows the table carries), neither is in the M22 sleeve, and both are rostered on paper books
  (ada_pullback_2h, XRP legs), so a pass would have a venue the executor already trades. Registered by lane ARB-RESEARCH session_01Aeyqvqf9sajCVDx9Ufef4u
  (PI-20261006-APBY4NTV-0005); family table and the feed/order-path/venue checks behind this unit: docs/research/relative-value-families-2026-10-07.md.'
why_this_matters: 'Operator 2026-10-06 ~08:20Z: ''other complex strategies (not just based on predicting movement, but arbitraging
  symbols, spreads, etc)''. Pairs / ratio / z-score spread mean reversion is the one relative-value family with a net-of-cost
  harness AND a dispatch route today; this unit is one of its first registered questions outside the four M22 crypto pairs,
  which were selected on a FEE-FREE number and go dollar-negative under taker fees (G2 2026-07-16).'
power:
  expected_n: 600
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.3 at alpha 0.05 / power 0.8 needs ~88 trades (normal approximation, the floor RQ-20260928-011/-012 registered).
    expected_n=600: the four M22 1h pairs produced ~2800 trades over ~3 years combined (~700 per pair) at lookback 15 (research/queue/blocked/RQ-20260922-011.yaml);
    lookback 20 over 1095 d is expected to produce several hundred.'
  feasibility:
    source: none
    accrual_basis: A new pair on this harness. The only 1h crypto pairs numbers in the repo are the M22 sleeve's (fee-free
      $ and R-space, G2 2026-07-16), on different legs; so the expected n is a shape argument, not a measurement. Below 88
      the verdict is indeterminate.
decision_rule:
  id: RULE-RQ1007-003-PAIRS-XRPUSDT-ADAUSDT-1H
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: 'The harness''s net_total_r (sum of per-trade net R; R = spread P&L / (stop_z x sigma at entry)) and total_trades
    over the aligned XRPUSDT/ADAUSDT 1h window, with BOTH legs charged fee 7.5 bps round trip (harness default, not overridden
    by the dispatch) plus the venue-aware slippage and funding execution_costs.resolve_cost_policy returns per leg. Also REPORTED,
    never graded on: net_expectancy_r, win_rate_pct, max_drawdown_r, net_total_r_fee_only.'
  rule: 'PASS IF net_total_r > 0 AND n_trades >= 88 -- Stage-0 evidence that the XRPUSDT/ADAUSDT 1h spread reverts net of
    the stack charged (fee 7.5 bps rt per leg; slippage 3 bps rt per leg (PERP default); funding 1 bps per 8 h window per
    leg, directionless drag); the deliverable is a Stage-0 evidence record, never a roster edit. FAIL IF net_total_r <= 0
    with n_trades >= 88 -- the grader re-queues once for a confirmatory run before closing. indeterminate IF n_trades < 88
    -- the window could not answer; lengthen the corpus window, do not lower the floor. The floor 88 is d=0.3 at alpha 0.05
    / power 0.8 and is not changed after seeing a result. MECHANICAL: scripts/research/harness_dispatch_result.py applies
    these three clauses to the harness''s own net_total_r / total_trades; queue_grade.py closes on them.'
  what_it_does_not_do: Does not edit config/pairs.yaml, config/accounts.yaml or config/strategies.yaml. A PASS is Stage-0
    evidence for a proposal, not a placement. Stage 1 for a passing crypto pair is a config/pairs.yaml addition on bybit_1
    -- Tier-3, operator-approved, and subject to the G2 dollar/lot check first; this unit does not make that proposal. Binance
    Vision candles are the Bybit proxy (Bybit REST is geoblocked from runners); the reader must say so beside any PASS. Does
    not model the dollar/lot floor (scripts/research/pairs_dollar_lots.py is the G2 instrument for that) and does not say
    anything about any prop venue.
