id: RQ-20260929-103
title: 'Stage-0 backtest: fade harness on BNBUSDT 4h (uncovered symbol)'
status: queued
cadence: once
priority: 40
kind: experiment

question: >-
  fade_breakout_4h (config/strategies.yaml:224) trades BTCUSDT only and is
  currently execution: shadow (demoted from live 2026-06-01, no live edge
  demonstrated: 16 closed trades, 44% win, net -86R). BNBUSDT is declared in
  config/instruments.yaml with no fade-harness history. Before proposing
  anything for the demoted BTCUSDT leg, does the SAME failed-breakout-fade
  entry show a different (better or equally poor) result on BNBUSDT 4h?

why_this_matters: >-
  A second symbol's read on the same entry logic separates "the fade
  mechanism does not work" from "BTC specifically does not fade well right
  now" -- useful context for any future re-promotion decision on
  fade_breakout_4h, and a genuinely new instrument question regardless of
  that leg's own history.

power:
  expected_n: 40
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Same E35/roster-walkforward floor: d=0.45 -> 39 trades at alpha 0.05 /
    power 0.8. expected_n=40 is a round-number placeholder -- no BNBUSDT
    fade-harness history exists to cite (see feasibility).
  feasibility:
    source: none
    accrual_basis: >-
      No prior fade-harness run against BNBUSDT exists anywhere in this repo
      (research/queue/, research/results/, docs/research/*.jsonl checked
      this session, zero hits). This run is the first observation.

decision_rule:
  id: RULE-RQ0929-103-BNBUSDT-FADE-STAGE0
  registered_at: '2026-09-29'
  registered_before_run: true
  statistic: >-
    net_total_r (net of the full cost stack) and n_trades from the fade
    harness's JSON summary, config-exact against fade_breakout_4h's own
    validated backtest params (donchian-20 / trail-3.5, ADX<20 chop filter)
    unless the harness's own defaults differ.
  rule: >-
    PASS IF net_total_r > 0 AND n_trades >= 39 -- Stage-0 evidence only. FAIL
    IF net_total_r <= 0 with n_trades >= 39 -- re-queues for a confirmatory
    run rather than being killed on one pass. indeterminate IF n_trades < 39.
  what_it_does_not_do: >-
    Does not touch config/strategies.yaml, does not re-promote
    fade_breakout_4h on BTCUSDT, and does not propose adding BNBUSDT to its
    symbols list -- any of those is a separate Tier-3 step.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 15
  basis: Single-symbol GitHub-runner harness dispatch, same shape as RQ-20260929-101/002.

run:
  workflow: research-harness-dispatch.yml
  inputs:
    harness: fade
    symbol: BNBUSDT
    timeframe: "4h"
    research_unit: RQ-20260929-103

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

related:
  - 'fade_breakout_4h (config/strategies.yaml:224) -- the BTCUSDT-only, currently-shadow leg this checks a second symbol against'
last_dispatched_at: null
