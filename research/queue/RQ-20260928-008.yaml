status_reason: >-
  BLOCKED, not queued: no existing workflow or script computes the
  off_cells-gated Stage-0 verdict for this leg. Checked before filing
  (impossibility-claim-guard discipline):
  (1) scripts/research/mi321_ict_scalp_seam.py — MEASURES the gap
  (off_cells: not_expressible, vol_spec: asymmetric_gate) and does not
  compute a gated backtest itself.
  (2) scripts/backtest_ict_scalp.py --stamp-regime labels each trade's
  decision-time (regime, vol_regime) but applies no off_cells SUPPRESSION —
  stamping and gating are different operations, and only the live variant
  builder (`_ict_scalp_variant_builder`, per the leg's own config comment)
  does the latter.
  (3) .github/workflows/ict-scalp-backtest.yml and ict-scalp-exit-sweep.yml
  take no off_cells/vol_spec/gated input.
  So this is a genuine harness capability gap, not a phantom gate — the
  decision-time state (which fold-quarters fall in [trending,volatile] or
  [chop,volatile]) is fully reconstructable from history (point-in-time,
  the regime detector is a pure function of past bars only), so building
  the capability is the right next step per "Research: backtest history
  first" rather than waiting on anything to accrue.

blocked_by: >-
  Either (a) locate/reproduce the original M27 k-fold gated backtest run
  the config comment cites (off_cells_5m 4/4 +34.3R) as a committed,
  re-runnable artifact — cheapest path, check first — or (b) extend
  scripts/backtest_ict_scalp.py (or a thin wrapper) to post-filter
  --stamp-regime --emit-trades output by the leg's own committed
  `off_cells` list before computing net_r_oos/folds_positive, then route
  that through build_strategy_evidence.py so the corpus's `fidelity` field
  for this leg can honestly flip from `approximate` to `faithful`.

decision_rule:
  id: RULE-D1-STAGE0-NET-OF-FULL-COST
  registered_at: '2026-09-22T05:34:08Z'
  registered_before_run: true
  statistic: >-
    net_r_oos -- pooled net_total_r from scripts/backtest_ict_scalp.py's
    out-of-sample time-folds for ict_scalp_xrp_5m, net of the full cost
    stack (fee 7.5bps + venue-aware slippage/funding for XRPUSDT, currently
    3.0/1.0bps roundtrip per src/runtime/execution_costs.py -- corrected
    2026-09-28 from this rule's original uniform 5.0bps slippage, same
    correction already applied to comms/strategy_evidence/ict_scalp_xrp_5m.json
    on 2026-09-25), computed over the GATED (off_cells-suppressed) trade
    population once a harness can produce it.
  rule: >-
    net_r_oos > 0 AND folds_positive a majority of folds, evaluated on the
    GATED arm once a harness can produce it. Applies to whichever arm
    (gated or ungated) this unit ends up grading; the RULE does not change,
    only which trade population it is applied to. The CURRENT committed
    record (comms/strategy_evidence/ict_scalp_xrp_5m.json, regenerated
    2026-09-25) grades the ungated arm: net_r_oos -0.9172, n=243, folds+ 1/4,
    fidelity=approximate -- superseding this unit's own earlier citation of
    the stale 2026-09-22 E28 number (-8.2061, n=245).

