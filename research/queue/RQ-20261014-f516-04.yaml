id: RQ-20261014-f516-04
title: 'Programme 05 Q3 (PROP-PER-LEG-EV-GRID): breakout_2 mixed-risk arm ETH $25 / SOL $50 under Breakout 1-Step Turbo, switch armed'
status: done
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 1
roadmap:
- L-PROP
question: Does breakout_2's book with PER-LEG flat risk -- trend_donchian_eth_prop at $25 and trend_donchian_sol_prop at $50 per ticket,
  the picks of RQ-20261005-853/854 -- clear the B6 V2 bar under config/prop_rulesets/breakout_turbo_1step.yaml when the two legs are
  priced TOGETHER (shared daily limit and static drawdown), net of the full cost stack, with the daily-DD switch armed at 0.8?
why_this_matters: 'Row PROP-PER-LEG-EV-GRID: the mechanism is merged (#16958, sizing.flat.per_leg_risk_usd, unset = unchanged) but the
  ETH $25 / SOL $50 config stays unapplied because both source records were single-leg and indeterminate (P(net>0) < 0.7). The operator''s
  2026-09-29 ruling makes it a data task: price the mixed arm as a book, rule registered before the run. Until 2026-10-14 the sim could
  not express per-leg $ risk; prop_ev_sim.py --leg-risk-usd (this PR, self-tested) mirrors the runtime field.'
power:
  expected_n: 355
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (the floor RQ-20260928-011/-012 registered and every prop fit since
    has used). prop_ev_grid grades on the --leg leg''s n: trend_donchian_eth_prop has 355 committed 730 d trades and trend_donchian_sol_prop
    132 (wc -l of the two trades files, counted 2026-10-14 before registration). Below 88 the grid grades UNDERPOWERED (indeterminate),
    never FAIL.'
  feasibility:
    source: none
    accrual_basis: Re-pricing of committed 730 d trade evidence under the firm's rules; nothing accrues.
decision_rule:
  id: RULE-RQ1014-F516-04-PER-LEG-MIX-BREAKOUT2
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: 'Per seed: path-mode ev_net_usd_per_life and p_net_positive over the 2-leg book, one arm MIX = ''--sizing start --risk-pct
    0.005 --leg-risk-usd trend_donchian_sol_prop=50 --dd-switch-frac 0.8''. Breakout 1-Step Turbo stack: --costs breakout (8 bps round-trip
    commission, 3 bps slippage, 0.033%/day swap prorated), lev caps 5x, the $ fee (UNCONFIRMED per RQ-20261005-854) and payout split
    from config/prop_rulesets/breakout_turbo_1step.yaml. The committed trade rows already carry the harness''s fee + slippage + funding
    via execution_costs.resolve_cost_policy() (D1-cleared trend harness); the sim then charges the venue''s own stack on top.'
  rule: 'The row''s own rule. PASS IF ev_net_usd_per_life > 0 AND P(net>0) >= 0.70 on ALL 5 seeds -> Tier-3 data-backed apply of per_leg_risk_usd
    {trend_donchian_sol_prop: 50} on breakout_2 under the 2026-09-27 standing authorization (manager decides, notifies the operator
    with this record and the revert). FAIL IF ev <= 0 on any seed -> the mixed config is KILLED (PROP-PER-LEG-EV-GRID closes, terminal
    reason this record). NULL (ev > 0 on all seeds, P < 0.70 on any) -> also KILLED as a P-bar proposal; the grading session records
    the mixed arm''s seed-median ev beside f516-03''s flat-$25 baseline so Q2''s EV ranking can still use it. UNDERPOWERED IF n < 88.'
  what_it_does_not_do: Applies nothing. Does not test other per-leg splits (a sweep is a later rung only if this passes). Phone executor
    lot rounding at $50 risk on SOL is not modelled.
