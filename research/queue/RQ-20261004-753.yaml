id: RQ-20261004-753
title: 'Confirm XRP exit candidate: trend_donchian_xrp_4h trail4 at a moved IS/OOS boundary (split_target_oos=60)'
status: done
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: trail4 passed the P2 gate on trend_donchian_xrp_4h on 2026-10-02 (d_net_r_OOS +0.358R, wf 6/6,
  OOS n=49 against a power floor of 49.06) but FAILED on 2026-08-10 (+0.66R, gate failed) and 2026-08-15
  (+0.26R, gate failed). Is the pass a property of the lever or of where the IS/OOS cut fell?
why_this_matters: The pass is borderline on n and sits between two earlier non-passes, so it is not yet
  evidence. A moved boundary with a larger OOS target is the cheapest test that is not just a re-read
  of the same cut.
power:
  expected_n: 50
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: MIN_OOS_TRADES=25 is the gate's floor; this unit requires 50 (the 2026-10-02 pass had 49, a hair
    under the d=0.45 floor of 49.06).
  feasibility:
    source: none
    accrual_basis: Runs on whatever history the trainer holds for the leg; nothing waits.
decision_rule:
  id: RULE-RQ1004-XRP-TRAIL4-CONFIRM-A
  registered_at: '2026-10-04'
  registered_before_run: true
  statistic: 'For cell trail4 of trend_donchian_xrp_4h in the landed m20 sweep record: is_oos_pass, d_net_r_OOS,
    wf_wins (walk-forward folds won), and the base book''s OOS trade count.'
  rule: 'CONFIRMED IF trail4 is_oos_pass AND d_net_r_OOS > 0 AND wf_wins >= 5 of the folds run AND base
    OOS trades >= 50 at a DIFFERENT IS/OOS boundary than the 2026-10-02 pass (split_target_oos=60 instead
    of the default 50, so the cut moves and ~10 trades change side). NOT CONFIRMED (re-queue, never kill
    on one pass) IF the cell fails the gate or d_net_r_OOS <= 0 with base OOS >= 50. INDETERMINATE IF
    base OOS < 50. A CONFIRMED result is Stage-0 exit evidence only: the Tier-3 declare is a separate
    step needing the exit-refinement live-parity check, and this unit ships nothing.'
  what_it_does_not_do: Does not touch config/strategies.yaml. Does not declare the trail geometry live.
    Does not replace the live-parity check.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 40
  basis: one leg, one lever family; the workflow scp's the leg's frames from the trainer and sweeps on
    the runner.
run:
  workflow: m20-exit-lever-sweep.yml
  inputs:
    legs: trend_donchian_xrp_4h
    levers: trail_geometry
    tp_cap_pct: '0.099'
    split_mode: oos-trades
    split_target_oos: '60'
    research_unit: RQ-20261004-753
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
