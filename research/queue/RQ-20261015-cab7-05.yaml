id: RQ-20261015-cab7-05
title: 'TP doctrine, real money: does a REGIME-CONDITIONED predictive TP (entry-vol tercile x ADX tercile) beat
  the unconditioned K* on the four Bybit real-money legs, pooled?'
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 2
roadmap:
- L-ATM
question: 'Pooled over ada_pullback_2h, xrp_pullback_2h, trend_donchian_xrp_4h and trend_donchian_eth_4h (each cut
  60/40 chronologically on its own trades so every leg is in both halves): with cells = entry-volatility tercile
  (stop distance / entry = atr_stop_mult x ATR% at entry) x ADX-at-entry tercile (falls back to vol only if < 90%
  of IS rows carry adx_at_entry), cut on IS only, and a per-cell K_c chosen on IS exactly as K* (cells with < 30
  IS trades use K*), does the conditioned target beat the unconditioned K* on OOS, net of cost, and stay calibrated?'
why_this_matters: Programme 01 Q2 rung 3 asks this on ML-LEG-CORPUS emits (blocked/RQ-20261014-9807-02); this unit
  asks the same conditioning question NOW on the uncapped config-exact replay, which needs no corpus. A conditioned
  target is the doctrine's 'prediction conditioned on current market conditions' at entry; it must EARN its complexity
  over the unconditioned K*, or the unconditioned answer stands (as ml2-predictive-bracket-2026-09-06 found).
power:
  expected_n: 200
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'Pooled OOS trades: 40% of ~800 uncapped trades (ada 222 measured 2026-10-15; xrp_pullback 268, xrp_4h
    146, eth_4h 167 from mi307 2026-09-18) ~= 320; declared 200 (= (1.96+0.8416)^2/0.2^2 = 196.2 -> 197, rounded
    up) so the run clears the floor even if the replay window yields ~35% fewer trades. Per-cell n is reported in
    the record; a cell under 30 IS trades falls back to K* by rule.'
  feasibility:
    source: corpus
    corpus: e35
    statistic: min_per_leg
    legs:
    - ada_pullback_2h
    - xrp_pullback_2h
    - trend_donchian_xrp_4h
    - trend_donchian_eth_4h
    basis: e35 min_per_leg over the four legs is the most conservative per-leg count the corpus holds; the pooled
      design multiplies it by four. Graded per leg by the gate, so it may read infeasible against the pooled expected_n;
      that runs (README) and the record carries the true pooled n.
decision_rule:
  id: RULE-RQ-20261015-cab7-05-CONDITIONED-TP
  registered_at: '2026-10-15'
  registered_before_run: true
  statistic: 'From the four legs'' config-exact UNCAPPED no-TP replays (tp_prediction_derive.py --pool --conditioned):
    each leg cut 60/40 by entry time; on pooled IS the unconditioned K* (as RQ-20261015-cab7-01..04) and the tercile
    cuts; per cell K_c = IS-best K with IS reach >= 0.10 and K <= the cell''s median cap_r (cells with < 30 IS trades
    use K*); on pooled OOS the paired per-trade delta net(K_c) - net(K*) with a seeded bootstrap 95% CI (2000, seed
    20261015), the trade-weighted calibration gap |reach_OOS_c - reach_IS_c|, cells_with_own_k, n_oos.'
  rule: 'INDETERMINATE IF n_oos < 39 OR fewer than 2 cells carry their own K (conditioning not estimable). FAIL
    IF CI upper <= 0 -> the regime conditioning adds nothing over the unconditioned K*: retire the conditioned entry
    target for these legs (the unconditioned K* of cab7-01..04 stays the answer), write the number back to Programme
    01 Q2 rung 3 and to blocked/RQ-20261014-9807-02 (which then needs a different conditioning to be worth unblocking).
    PASS IF CI lower > 0 AND weighted calibration gap <= 0.10 -> the conditioned per-cell target is the leg''s predictive
    TP at entry: the manager files the per-leg harness-native confirmation (needs a per-cell tp_r input on the harness,
    a Tier-1 build row) before any Tier-3 proposal on bybit_2 + bybit_portfolio. INDETERMINATE otherwise. NULL:
    any other landing is indeterminate.'
  what_it_does_not_do: 'Touches no config, roster or account. A PASS is a SCREEN, not a ship: the counterfactual
    ignores the entries an earlier TP exit would have freed (stated in the script), so the harness-native e35 confirmation
    is mandatory before any Tier-3 proposal. Does not grade the per-bar TP revision (Q3) and does not say the current
    bracket is profitable or not. A paper or live book is not evidence here.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 45
  basis: 'Runner. One tp_prediction_derive invocation: candle fetch + one uncapped harness replay per leg + stdlib
    grading. MEASURED 2026-10-15 for ada_pullback_2h in a session: 58 s wall for fetch + replay + grade; est_minutes
    carries headroom for runner fetch latency.'
run:
  workflow: research-script-run.yml
  command:
  - python3
  - scripts/research/tp_prediction_derive.py
  - --legs
  - ada_pullback_2h,xrp_pullback_2h,trend_donchian_xrp_4h,trend_donchian_eth_4h
  - --days
  - '1830'
  - --pool
  - --conditioned
  - --out
  - '{out_dir}'
  timeout_minutes: 120
  inputs:
    research_unit: RQ-20261015-cab7-05
  note: BRACKETS-AS-PREDICTIONS lane 2026-10-15. Thresholds in the decision_rule are the constants in scripts/research/tp_prediction_derive.py,
    written before any run.
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
  note: research/results/RQ-20261015-cab7-05/<run_id>.jsonl (E5 contract); uncapped emits + the full curve in verdict.json
    land under comms/research/RQ-20261015-cab7-05/<run_id>/.
related:
