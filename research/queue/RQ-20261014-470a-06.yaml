id: RQ-20261014-470a-06
title: 'Re-entry cooldown, real money, re-asked at power: does trend_donchian_xrp_4h''s post-exit cooldown (4, 8, 16 bars) beat the declared setting
  on the 1460-day window, net of the full cost stack?'
status: queued
cadence: once
theme: live_strategy
priority: 2
kind: experiment
question: 'RQ-20261014-f0e2-13 asked this on 730 days and graded indeterminate (n(B)=25 < 39). Its own rule''s branch is ''extend the window'':
  same three arms, same bars, on the committed 1460-day record''s window 2022-10-13 .. 2026-10-10 20:00 (n(B)=46). Does any arm beat the leg as
  declared by >= 2.0 R, no worse drawdown, >= 3 of 4 calendar folds?'
why_this_matters: trend_donchian_xrp_4h is a real-money leg (short-only). The hypothesis is unchanged from f0e2-13 (try-again changes the WINDOW,
  because the first answer was 'cannot answer', not 'no').
power:
  expected_n: 46
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=46 is MEASURED: the committed 1460d record''s
    n=46 on this exact window (the positive control asserts it). Below 39 baseline trades the unit grades indeterminate (underpowered), never
    FAIL. The R bar is a MATERIALITY bar over the whole window, not a significance test; the 3-of-4 calendar-fold majority refuses a one-period
    artifact.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing
      accrues.
decision_rule:
  id: RULE-RQ20261014470a06
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd plus the arm''s tokens; full
    cost stack: fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r, max_drawdown_r,
    plus net_r per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared; CD4 / CD8 / CD16 = --cooldown-bars
    4 / 8 / 16.. Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B. Also reported
    per arm, not graded: net_r_per_capital_day (the programme''s headline measure).'
  rule: 'indeterminate IF the positive control fails or n(B) < 39 (underpowered: no verdict; never FAIL on thin n). A candidate C PASSES iff dR
    >= 2.0 R AND dDD <= 0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR). FAIL IF none passes: the declared value stands
    and the axis is recorded honest_negative on this window for this leg. A PASS from a best-of-3 sweep is a LEAD, not a finding: it opens exactly
    one fresh-window confirmation unit (the passing arm alone vs B, on the disjoint window immediately preceding this one, same bars, no re-selection;
    03-STRATEGY-IMPROVEMENT.md rung S0-C), and no Tier-3 proposal is written until that unit reads CONFIRMED.  The 2.0 R bar, the drawdown clause,
    the 3-of-4 fold majority and the 39 floor are not changed after any result.'
  what_it_does_not_do: 'Does not edit config. Does not change f0e2-13''s arms or bars. A PASS is a LEAD for rung S0-C (fresh window: 2018-10..2022-10),
    never a promotion case.'
