  - --max-trades-per-leg
  - '400'
  - --entry-offset-bars
  - '1'
  - --control-max-breach
  - '0.05'
  - --min-n
  - '100'
  - --needed-frac
  - '0.02'
  - --not-needed-frac
  - '0.005'
  inputs:
    research_unit: RQ-20261014-da7a-01
lands:
