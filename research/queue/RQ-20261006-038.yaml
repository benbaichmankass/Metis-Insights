id: RQ-20261006-038
title: 'Breakout 1-Step Turbo prop fit on the 730d record: ict_scalp_sol_15m at flat 0.5% of balance, with days-to-target
  reported (PI-20261006-APBY4NTV-0001 slice 1)'
status: queued
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
question: 'Does ict_scalp_sol_15m (SOLUSDT 15m) clear the operator''s prop bar -- E[net $ banked before the account dies]
  > 0 with P(net>0) >= 0.70 on every seed -- under Breakout 1-Step Turbo (3% daily / 3% static max off the $5k start, 9% target,
  no min days) when sized flat 0.5% of balance, and how FAST does it pass: what are the simulator''s days_to_pass p50/p90
  and p_pass_eval? Prices the committed 730d evidence record (comms/strategy_evidence/runs/2026-10-02-730d/ict_scalp_sol_15m__trades.jsonl,
  158 trades, full cost stack); no new backtest. This (leg, ruleset) pair has no 730d prop fit on record (checked research/queue/
  2026-10-06: the leg''s only prior fits are the Breakout Classic generated units and the Tradeify 730d unit).'
why_this_matters: 'PI-20261006-APBY4NTV-0001: the binding constraint on the current prop book is PACE, not risk (velotrade_1
  sim median ~220 d to +10%). The operator wants +10% in about a month and no more than six. Every leg with a committed 730d
  record must be fitted to all three prop rulesets with days-to-target reported beside the risk gates, so the ranked candidate
  list the item asks for is built from records, not memos.'
power:
  expected_n: 158
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (floor registered by RQ-20260928-011/-012). expected_n=158
    is `wc -l comms/strategy_evidence/runs/2026-10-02-730d/ict_scalp_sol_15m__trades.jsonl` counted 2026-10-06 before this
    unit was registered; below 88 the unit grades UNDERPOWERED, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-grading of a committed 730d trade record; nothing accrues.
decision_rule:
  id: RULE-RQ1006-038-BRK-TURBO-FIT-ict_scalp_sol_15m-f050
  registered_at: '2026-10-06'
  registered_before_run: true
  statistic: 'Per seed: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over ict_scalp_sol_15m''s 730d committed
    trades (comms/strategy_evidence/runs/2026-10-02-730d/ict_scalp_sol_15m__trades.jsonl), under config/prop_rulesets/breakout_turbo_1step.yaml,
    sizing flat 0.5% of balance (--ruleset config/prop_rulesets/breakout_turbo_1step.yaml --costs breakout --funded-start
    fresh --swap-model prorated). Reported beside the verdict, from the same sims/ output: days_to_pass p50 and p90 (the simulator''s
    median days to the evaluation target) and p_pass_eval. P(pass by 30/90/180 d) is NOT emitted by prop_ev_sim today and
    is filed separately as a tooling item.'
  rule: PASS IF ev_net_usd_per_life > 0 on ALL 5 seeds AND P(net>0) >= 0.70 on ALL 5 seeds. UNDERPOWERED (indeterminate) IF
    n < 88. FAIL IF ev <= 0 on any seed. NULL (indeterminate) otherwise. A PASS is ranked by days_to_pass p50 in the candidate
    list (PI-20261006-APBY4NTV-0001) and is a Tier-3 roster proposal for the matching prop account, NOT applied by this unit;
    a PASS with days_to_pass p50 > 180 d is still a PASS on this rule and is marked 'too slow' in the ranking, not re-graded.
    A FAIL is one pass and re-queues for a confirmatory run before it is read as a kill.
  what_it_does_not_do: Does not touch config/accounts.yaml, config/strategies.yaml or any prop roster. Prices committed trades
    from a 730d backtest (fee + slippage + funding per the record's cost_stack); not a live-parity check. One sizing arm only,
    so it says nothing about whether a larger risk fraction would pass faster without breaching the daily-loss line.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 20
  basis: 1 leg x 1 arm x 5 seeds of prop_ev_sim, same shape and cost as RQ-20261005-801 and RQ-20261005-851.
run:
  workflow: research-script-run.yml
  timeout_minutes: 90
  command:
  - python3
  - scripts/research/prop_ev_grid.py
  - --leg
  - ict_scalp_sol_15m=comms/strategy_evidence/runs/2026-10-02-730d/ict_scalp_sol_15m__trades.jsonl
  - --arm
  - A=--sizing balance --risk-pct 0.005
  - --common
  - --ruleset config/prop_rulesets/breakout_turbo_1step.yaml --costs breakout --funded-start fresh --swap-model prorated
  - --seeds
  - 1,2,3,4,5
  - --grade
  - pass_all_seeds
  - --p-floor
  - '0.70'
  - --n-floor
  - '88'
  - --out
  - '{out_dir}'
  - --jobs
  - '4'
  inputs:
    research_unit: RQ-20261006-038
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
grading:
  auto: true
related:
- PI-20261006-APBY4NTV-0001
- config/prop_rulesets/breakout_turbo_1step.yaml
- comms/strategy_evidence/runs/2026-10-02-730d/ict_scalp_sol_15m.json
- RQ-20261005-801
- RQ-20261005-851
last_dispatched_at: null
