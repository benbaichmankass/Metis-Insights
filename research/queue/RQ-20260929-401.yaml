id: RQ-20260929-401
title: M19 S2-exit (re-registered) — does the shipped below_half_r exit head recover net R on the ict_scalp 15m family, graded on the FINAL per-year fold?
status: queued
cadence: once
kind: experiment

question: >-
  RQ-20260928-005 asked whether the exit head transfers from trend_donchian to
  the ict_scalp 15m family (SOL, XRP, ETH). It graded INDETERMINATE: at its
  registered 365-day window the final fold held ~20 trades per leg, so the
  n_oos >= 64 floor was unreachable, and the manager ruled (2026-09-29) that
  swapping the statistic after seeing the data would defeat pre-registration.
  A 2200-day supplementary run (not a verdict) pointed the same way (0 of 3 legs
  positive) but departed from the registration on four axes, one of which — the
  12-bar embargo — biases toward PASS. This unit is the SAME question, statistic
  and rule, re-registered BEFORE any run with the sample-size fix and the
  artifact's own policy: does the exit head — LightGBM P(holding pays), purged
  per-CALENDAR-YEAR walk-forward, 7-day embargo, the shipped
  {below_half_r, tau 0.10, below_r 0.5} policy — recover positive net R on each
  leg's OWN out-of-sample trades in the latest calendar year?

why_this_matters: >-
  S2 of the staged path (docs/research/M19-ai-trader-postmortem-and-staged-path-2026-09-28.md
  § 4) needs an exit policy that is a per-FAMILY property, not a donchian
  artefact. RQ-20260927-001 (donchian BTC 1h, recovered_R_oos +1.3127, n=119,
  one split) is the only genuine out-of-sample pass on record. A registered,
  adequately powered answer on ict_scalp decides whether the exit head is a
  reusable policy layer (S2 = veto + learned exit) or S2 = veto + fixed exits.
  Operator rule 2026-09-27: refinement before kill — three legs are registered,
  and one leg's failure is not a family verdict.

power:
  expected_n: 84
  min_detectable_effect: 0.35
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Paired design identical to RQ-20260927-001 / RQ-20260928-005: head-on and
    head-off arms score the SAME trades, so the unit is the per-trade difference
    and the test is one-sample on its mean. Floor = (1.96 + 0.8416)^2 / 0.35^2 =
    64.07, i.e. n_oos >= 64 (never lowered). expected_n = 84 is the SMALLEST of
    the three legs' FINAL-FOLD (calendar 2026 to 2026-09-28) harness trade counts,
    MEASURED on the trainer 2026-09-29 (issues #14398 / #14420, census tool
    scripts/research/exit_head_leg_trade_census.py, candle files staged at
    /home/ubuntu/refresh_15m_20260929): SOL 100, XRP 98, ETH 84 — all clear 64,
    ETH by 20. Full per-year harness trades (same census): SOL 2020..2026 =
    52/120/120/90/123/120/100 (sum 725), XRP 2021..2026 = 78/109/77/98/108/98
    (sum 568), ETH 2020..2026 = 25/126/97/83/99/115/84 (sum 629); the sums were
    re-added and equal the census totals. These are HARNESS trades emitted; the
    dataset build and fold gate (--min-fold-trades 50, train rows) can drop some,
    so n_oos is read from the report itself and the floor is applied to THAT — a
    leg that falls under 64 reads underpowered, never a failed head. The same
    tool measured the registered 365-day window at ~20 trades per fold, which is
    why RQ-20260928-005 could not be graded there.
  feasibility:
    source: none
    accrual_basis: >-
      `source: none`: the n values come from a one-off trainer census over
      history (the harness replayed on the staged candle files), not from one of
      research_disposition.CORPORA's registered JSONL corpora. The population is
      fixed by history through 2026-09-28 (XRP to 2026-09-29); nothing accrues.

decision_rule:
  id: RULE-RQ0929-401-EXIT-HEAD-FAMILY-TRANSFER-PER-YEAR
  registered_at: '2026-09-29'
  registered_before_run: true
  statistic: >-
    Per leg L in {ict_scalp_sol_15m (SOLUSDT), ict_scalp_xrp_15m (XRPUSDT),
    ict_scalp_eth_15m (ETHUSDT)}, timeframe 15m: recovered_R_oos(L) =
    head_net_r - baseline_net_r over the trades of the FINAL walk-forward fold —
    the latest CALENDAR YEAR in the data (2026) — as reported by
    scripts/ml/train_exit_head.py --fold-mode years for that leg's OWN family dir.
    Fold construction (train_exit_head.fold_blocks, mode years): the first year
    present is training-only; each later year is a test fold; a fold's training
    rows are every harness trade whose LAST bar is earlier than the test year's
    start minus the 7-day embargo (EMBARGO_S = 604800 s = 672 15m bars); the
    booster is train_model() (LightGBM, target holding_pays, base features),
    unchanged. baseline_net_r = fold["actual"]["net_r"] (each trade held to the
    harness exit). head_net_r = fold["model_cond"]["below_half_r_tau_0.1"]["net_r"]
    — the shipped donchian artifact's shape {policy below_half_r, tau 0.10,
    below_r 0.5} (src.runtime.exit_head_shadow.would_exit_for): exit at the first
    bar where P(holding pays) < 0.10 AND open_r < 0.5. ONE arm, fixed a priori:
    NOT the best of the other tau/shape arms in the same report and NOT
    `selected_tau` (either would be max-over-arms selection on the test block).
    n_oos(L) = fold["n_trades"], and the head and baseline arms must cover the
    same trades (asserted; a mismatch reads malformed, not graded). The fold's
    trades are cut by the harness at the live-parity TP cap (--tp-cap-pct 0.099,
    m20_exit_head_round default). The candle window is the trainer's staged
    Binance USD-M refresh: SOL/ETH from 2020-09-20, XRP from 2021-05-13, all to
    2026-09-28/29 (~6 years; the registered 365-day window is NOT used — it cannot
    reach the floor). The grading is scripts/research/exit_head_final_fold_grade.py
    (committed with this unit, tested).
  rule: >-
    Let Q = legs with n_oos >= 64, and P = legs in Q with recovered_R_oos > 0
    (strictly). IF |Q| < 2: verdict indeterminate (underpowered) — the floor is
    never lowered, and a leg under it is excluded rather than read as a failure.
    ELSE IF |P| >= 2: PASS — the exit head transfers across families at the
    registered design; the ict_scalp exit heads are candidates for the
    exit-refinement pipeline's E1 step (Tier-3 to flip live, NOT this unit's act),
    subject to the exit-fee caveat in what_it_does_not_do. ELSE IF |P| == 1:
    indeterminate (REFINE) — re-run that leg on the fold before the last before
    reading it as a family property; not a kill. ELSE (|P| == 0): FAIL — at the
    registered design the exit head does not recover R on ict_scalp; the S2-exit
    lever narrows to trend_donchian (post-mortem § 4). This is RQ-20260928-005's
    rule with its partition made complete (its "exactly 1 of 3" / "0 of 3" wording
    left |Q| = 2 undefined) and NO threshold changed. IF the round lands
    read_state producer_failed / no_data: record it as such with verdict
    not_applicable. A leg whose final-year fold is absent from the report reads
    final_fold_missing and is excluded from Q; an earlier year never stands in.
  what_it_does_not_do: >-
    Declares no exit_head_model in config/strategies.yaml, promotes no head,
    writes nothing under runtime_logs/trainer_mirror/, changes no live exit, and
    does NOT overwrite data/ (the refreshed candles live in a separate directory).
    Exit logic stays Tier-3 (exit-refinement skill). KNOWN LIMITATIONS, stated
    now rather than after the result: (1) the E1 policy replay exits at the bar's
    mark (open_r) and charges NO extra discretionary-exit fee or slippage over the
    resting bracket — analyze_exit_head applies exit_fee_bps 1.5 for that and E1
    does not — so both arms carry the harness's own per-trade cost identically and
    the head arm is if anything flattered; a PASS therefore supports the E1 step
    only and must be re-checked with the exit-fee haircut before any Tier-3
    proposal. (2) Whether the harness's emitted r is net of the full venue cost
    stack (fee + slippage + funding) was NOT re-verified in this session; it is
    inherited from RQ-20260928-005's statement that the ict_scalp harness's
    default cost policy applies since E3 (backtest_ict_scalp.py labels its primary
    arm net-of-full-cost), and the delta is cost-neutral either way. (3) The
    candle feed is Binance USD-M, and the trainer's older SOL/ETH files are a
    different feed (median close difference 1.6 / 1.2 bps over overlapping bars,
    maxima 1649 / 693 bps on isolated bars); results are not comparable to any
    study that read the older files.

routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 90
  basis: >-
    Trainer VM: the staged candle files (/home/ubuntu/refresh_15m_20260929) and
    the harness run live only there. MEASURED 2026-09-29: the harness-only census
    on those files took ~13 min per leg (~40 min for three legs) on the 1-OCPU
    box; the dataset build and six per-year LightGBM fits per leg are small next
    to that (the older pooled 15m ict_scalp dataset was 28,683 rows). est_minutes
    90 is an estimate, not a measurement. The trainer heavy-job queue is taken by
    the driver itself. Run detached (nohup) — a foreground relay command has a
    ~60-min ceiling that RQ-20260927-003 already hit.

run:
  workflow: 'trainer-vm-diag (issue label trainer-vm-diag-request)'
  inputs:
    legs: ict_scalp_sol_15m,ict_scalp_xrp_15m,ict_scalp_eth_15m
    tf: 15m
    data_dir: /home/ubuntu/refresh_15m_20260929
    fold_mode: years
    expect_year: 2026
    research_unit: RQ-20260929-401
  note: >-
    DO NOT DISPATCH BEFORE THIS UNIT IS MERGED. Step 1 (detached, flat command,
    no heredocs): `cd /home/ubuntu/ict-trading-bot && source .venv/bin/activate &&
    nohup python scripts/research/m20_exit_head_round.py --legs
    ict_scalp_sol_15m,ict_scalp_xrp_15m,ict_scalp_eth_15m --tf 15m --data-dir
    /home/ubuntu/refresh_15m_20260929 --out /home/ubuntu/rq20260929_401_round
    --fold-mode years > /home/ubuntu/rq20260929_401_round.log 2>&1 &`. The driver
    forwards --fold-mode since PR #14407. Step 2, when the log shows the round
    finished (poll `tail` of the log via a separate issue): `python
    scripts/research/exit_head_final_fold_grade.py --round-dir
    /home/ubuntu/rq20260929_401_round --legs
    ict_scalp_sol_15m,ict_scalp_xrp_15m,ict_scalp_eth_15m --expect-year 2026`.
    Step 3: land the verdict with scripts/research/research_result.py under
    research/results/RQ-20260929-401/ (rule id above), the per-leg n_oos and
    recovered_R_oos in the measurement block, and the run artifacts named in
    artifact.locator — the trainer's files are NOT durable, so copy the three
    e1_report.json fold blocks into the measurement. Apply the rule mechanically.

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
  note: >-
    research/results/RQ-20260929-401/<run_id>.jsonl, one row carrying all three
    legs (the rule counts legs, so a partial landing is indeterminate, never a
    failing leg).

related:
  - RQ-20260928-005 (the registered question; graded indeterminate at 365d — this unit is its sample-size fix, registered before any run)
  - RQ-20260927-001 (the one prior out-of-sample exit-head pass, trend_donchian BTC 1h)
  - docs/research/M19-ai-trader-postmortem-and-staged-path-2026-09-28.md (§ 4 S2-exit)
  - docs/research/M20-exit-refinement-2026-07-12.md § 8-9 (the walk-forward recipe and the below_half_r policy)
  - PI-20260929-FCJRWVAK-0001 (why the trainer's candles were stale; the refreshed dir and the open decision on data/)
  - PR #14407 (the --fold-mode passthrough and the trade census tool)
