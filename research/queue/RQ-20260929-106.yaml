id: RQ-20260929-106
title: 'Stage-0 backtest: pairs harness on SPY/QQQ 1h (pairs family has bybit-crypto history, zero alpaca-ETF history)'
status: queued
cadence: once
priority: 40
kind: experiment

question: >-
  The SPY/QQQ analog of RQ-20260929-105: both are already live alpaca
  instruments individually (spy_pullback_1h / qqq_pullback_1h,
  config/strategies.yaml) and the two indices are highly co-integrated
  broad-market proxies -- a cleaner, more liquid pairs candidate than
  GLD/GDX's commodity-vs-miner relationship. Does a mean-reversion pairs
  spread between SPY and QQQ clear the same net-of-cost bar the crypto pairs
  sleeve uses, at 1h (matching the existing spy/qqq_pullback_1h cadence
  rather than GLD/GDX's 1d)?

why_this_matters: >-
  Same reasoning as RQ-20260929-105, with a second, structurally different
  ETF pair (broad index vs sector/commodity) and a different (intraday)
  timeframe -- two independent reads on whether the pairs mechanism
  generalizes off bybit-crypto before anyone scopes an alpaca-side pairs
  executor.

power:
  expected_n: 40
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.45 -> 39 trades at alpha 0.05/power 0.8, this repo's standing E35
    floor -- used directly here (unlike RQ-20260929-105) because 1h bars
    over a multi-year window plausibly produce enough round-trips to meet
    it. expected_n=40 is a round-number guess just above the floor, not a
    measurement -- no SPY/QQQ pairs history exists to cite (see feasibility).
  feasibility:
    source: none
    accrual_basis: >-
      No pairs-harness run against SPY/QQQ (or any non-crypto pair) exists
      anywhere in this repo's queue, results, or config history. This run is
      the first observation.

decision_rule:
  id: RULE-RQ0929-106-SPY-QQQ-PAIRS-STAGE0
  registered_at: '2026-09-29'
  registered_before_run: true
  statistic: >-
    net_total_r (net of the full cost stack) and n_trades from the pairs
    harness's own JSON summary, symbol_a=SPY symbol_b=QQQ, timeframe=1h,
    harness defaults for lookback/entry-z/exit-z/stop-z/max-hold-bars unless
    a documented reason changes them.
  rule: >-
    PASS IF net_total_r > 0 AND n_trades >= 39 -- Stage-0 evidence only. FAIL
    IF net_total_r <= 0 with n_trades >= 39 -- re-queues for a confirmatory
    run, never killed on one pass. indeterminate IF n_trades < 39.
  what_it_does_not_do: >-
    Does not touch config/pairs.yaml or config/strategies.yaml, does not
    propose an alpaca pairs executor (a separate, larger build -- see
    RQ-20260929-105), and does not propose any live leg.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 15
  basis: Single-pair GitHub-runner harness dispatch, alpaca/yfinance 1h candles (already fetched for the individual spy/qqq_pullback_1h legs).

run:
  workflow: research-harness-dispatch.yml
  inputs:
    harness: pairs
    symbol: SPY
    symbol_b: QQQ
    timeframe: "1h"
    research_unit: RQ-20260929-106

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

related:
  - RQ-20260929-105 (the GLD/GDX commodity-vs-miner analog of this same question)
  - 'spy_pullback_1h / qqq_pullback_1h (config/strategies.yaml) -- the two legs already live on these symbols individually'
last_dispatched_at: null
