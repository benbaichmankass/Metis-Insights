id: RQ-20260930-503
title: 'HyroTrader fit: same-UTC-day-flat variant of the 1h trend_donchian ETH prop leg -- does forcing an intraday close keep the edge? (lane HYRO-STRATS)'
status: done
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment

question: >-
  trend_donchian_eth_prop (1h) is the best committed 1h crypto leg by n (169 trades/365d, net R +13.61,
  PF 1.19) but only 46.7% of its trades open and close on the same UTC day (median hold 12 h), so it
  earns few HyroTrader qualifying days. If every open position is force-closed at 23:45 UTC and no entry
  is taken after 20:00 UTC, does the leg keep a positive full-cost net R over 1830 days?

why_this_matters: >-
  A trend leg has the highest payoff (avg win +1.54R, 33% win rate) and the lowest breach coupling to
  the trailing daily rule, but its edge comes from holding winners. My prior (not evidence) is that a
  daily flatten removes most of it. The unit exists to falsify that prior cheaply before anyone designs
  a HyroTrader leg around it.

power:
  expected_n: 400
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Floor 88 for d = 0.3; expected_n INFERRED at ~0.47 trades/day x 1830 x an assumed 0.5 retained.
  feasibility:
    source: none
    accrual_basis: Historical re-run on staged candles; nothing accrues.

decision_rule:
  id: RULE-RQ0930-503-HYRO-TREND-DAYFLAT
  registered_at: '2026-09-30'
  registered_before_run: true
  statistic: >-
    backtest_trend.py with the NEW flags on ETHUSDT 1h at the trend_donchian_eth_prop config, --days 1830:
    (n, pooled full-cost net R, share of trades closing same UTC day), then RQ-20260930-501's gates B and C
    on the ledger.
  rule: >-
    UNDERPOWERED IF n < 300. ELSE PASS IF pooled full-cost net R > 0 AND same-day share >= 0.95 AND gates B
    and C hold. ELSE FAIL. Registered flatten time 23:45 UTC (realized at the last 1h bar boundary at or before it, 23:00) ON NATIVE 1h CANDLES, NO --resample (native stamps are bar OPENs, bar_label open; a --resample run would be close-stamped and is a different design) and last-entry 20:00 UTC are fixed now and are
    not to be swept after the run (a sweep would be a different, separately registered unit).
  what_it_does_not_do: Does not change config/strategies.yaml or the live trend legs.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 30
  basis: One leg, one window. Candles are fetched from Binance-vision on the runner (no resident data needed).

run:
  workflow: research-script-run.yml
  timeout_minutes: 120
  command:
  - python3
  - scripts/research/hyro_fit_verdict.py
  - --mode
  - dayflat
  - --leg
  - trend_donchian_eth_prop
  - --days
  - '1830'
  - --out
  - '{out_dir}'
  inputs:
    research_unit: RQ-20260930-503
  note: >-
    The harness levers (--flat-at-utc, --no-entry-after-utc, bar_label) are merged on main (#14583, #14618, #14630).
    --mode dayflat runs the leg at its live config parameters on native 1h candles, WITHOUT --resample, and
    grades the ledger with 501's gates plus the same-UTC-day share.

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

related:
  - RQ-20260930-501
  - docs/research/hyro-strategy-feasibility-2026-09-30.md
last_dispatched_at: '2026-09-30T14:51:18+00:00'
grading:
  auto: false
  evidence:
