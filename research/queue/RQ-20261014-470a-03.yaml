id: RQ-20261014-470a-03
title: 'Transfer, real money: does adx_min=22 (the f0e2-05 eth_pullback_2h lead) beat ada_pullback_2h''s declared adx_min=28 on its 730-day window,
  net of the full cost stack? One arm, no selection.'
status: queued
cadence: once
theme: live_strategy
priority: 1
kind: experiment
question: Does the single value adx_min=22, fixed in advance from RQ-20261014-f0e2-05 (not chosen on ada_pullback_2h), beat ada_pullback_2h as
  declared (adx_min=28) on 2024-10-05 .. 2026-10-04 23:59 by >= 1.0 R with no worse drawdown in >= 3 of 4 calendar folds?
why_this_matters: ada_pullback_2h is on the real-money roster (bybit_2) and its mirror; adx_min has never been measured on it (checked research/queue
  and research/results 2026-10-14). If the eth lead is a property of the 2h pullback family it should transfer; a single pre-fixed arm is an independent
  test, so a PASS here also corroborates 470a-01, and a FAIL says the eth lead is leg-specific.
power:
  expected_n: 110
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 at alpha 0.05 / power 0.8 needs 39 trades (the repo''s standing E35 floor). expected_n=110 is an ESTIMATE: the committed 365d
    record has n=57 (2025-09-25..2026-09-24), doubled for the 730-day window; no 730d record exists. Below 39 baseline trades the unit grades
    indeterminate (underpowered), never FAIL. The R bar is a MATERIALITY bar over the whole window, not a significance test; the 3-of-4 calendar-fold
    majority refuses a one-period artifact.'
  feasibility:
    source: none
    accrual_basis: Re-measurement on freshly fetched keyless Binance Vision candles over a pinned window; the harness replays history, nothing
      accrues.
decision_rule:
  id: RULE-RQ20261014470a03
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: 'Per arm, from the harness''s own --json summary (argv built by regime_debt_matrix.build_harness_cmd plus the arm''s tokens; full
    cost stack: fee + resolved slippage + funding via execution_costs.resolve_cost_policy, never a zero default): total_trades, net_total_r, max_drawdown_r,
    plus net_r per fold over FOUR equal calendar spans (same boundaries every arm). Arms: B = leg as declared (adx_min 28); A22 = adx_min=22.
    No other arm.. Per candidate C: dR = net_r(C) - net_r(B); dDD = maxDD(C) - maxDD(B); fold_wins = folds in which C out-earns B. Also reported
    per arm, not graded: net_r_per_capital_day (the programme''s headline measure).'
  rule: 'indeterminate IF the positive control fails (no committed record exists on this window, so no control is passed: the B arm is reported
    and is itself the baseline) or n(B) < 39 (underpowered: no verdict; never FAIL on thin n). A candidate C PASSES iff dR >= 1.0 R AND dDD <=
    0 AND fold_wins >= 3 of 4. PASS IF any candidate passes (best = highest dR). FAIL IF none passes: the declared value stands and the axis is
    recorded honest_negative on this window for this leg. PASS: a Tier-3 PROPOSAL note on the owning row only after 470a-01 has also read (a transfer
    PASS with a NOT CONFIRMED origin is reported as leg-specific and gets its own fresh-window confirmation, rung S0-C). FAIL: adx_min stays;
    honest_negative for this leg. The 1.0 R bar, the drawdown clause, the 3-of-4 fold majority and the 39 floor are not changed after any result.'
  what_it_does_not_do: Does not edit config/strategies.yaml or any roster (Tier-3). Does not search adx values. Does not test any other axis.
