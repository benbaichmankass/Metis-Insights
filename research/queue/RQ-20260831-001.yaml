id: RQ-20260831-001
title: Re-sweep the shipped bracket-geometry legs to capture an ACHIEVED OOS count
status: queued
cadence: once
kind: experiment

question: >-
  How many of the 70 e35 disposition units are actually POWERED, now that the
  corpus can record an achieved OOS sample size? Until 2026-08-31 the e35 corpus
  carried none, so R4's power gate could grade nothing and every unit read
  ungradeable. This re-sweep is the only way to find out, because the counts
  cannot be back-filled.

why_this_and_not_the_monthly_job: >-
  RQ-20260830-002 sweeps the same 14 legs monthly and its NEXT run (~2026-09-30)
  would also carry the counts. This one-shot exists because that is 30 days of
  every e35 verdict staying ungradeable, and because RQ-20260830-002's own
  power.basis already instructs a reader to "read per-leg base_trades_OOS before
  quoting any verdict from this job" — an instruction that was IMPOSSIBLE to
  follow, since the field did not exist in the corpus. The monthly job shipped
  with an unusable caveat. This run makes it usable.

power:
  expected_n: 50
  min_detectable_effect: 0.4
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Identical derivation to RQ-20260830-002, deliberately copied rather than
    re-derived: n is the sweep's own DEFAULT_SPLIT_TARGET_OOS = 50 and the gate
    is PAIRED (cell vs base over the same trade sequence), so the unit is the
    per-trade difference and the design is one_sample. The 49.06 floor is
    (1.96+0.8416)^2 / 0.4^2, so a leg reaching 50 clears by about one trade.
    ⚠️ THAT 50 IS A TARGET, WHICH IS THE ENTIRE POINT OF THIS JOB. Measured over
    the 8,321-row corpus on 2026-08-31, `split_target_oos` is non-null on 377
    rows (4.5%) with exactly one distinct value, 50 — a run setting, not a
    measurement. The achieved counts are what this run records, and a
    low-frequency leg (the 1d ones especially) may not reach 50 at all. Read the
    achieved `base_oos_trades` per leg; do not assume the target was met.
    ⚠️ ALPHA IS PER-CELL AND THIS SWEEPS 14 LEGS, so ~1 spurious verdict is
    expected by construction. Output is a WATCHLIST, never a disposition.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 90
  basis: >-
    Runner, same as RQ-20260830-002 — e35-bracket-sweep.yml shards ONE LEG PER
    JOB and fetches its own candles, so no VM is touched and peak memory is
    per-shard rather than cumulative. est_minutes is inherited from that job and
    is an ESTIMATE, not a measurement of this fan-out.

run:
  workflow: e35-bracket-sweep.yml
  inputs:
    only: ada_pullback_2h,iwm_trend_long_1d,mgc_pullback_1d,qqq_trend_long_1d,scha_trend_long_1d,spy_trend_long_1d,tlt_pullback_1h,trend_donchian,trend_donchian_ada_4h,trend_donchian_avax_4h,trend_donchian_eth_4h,trend_donchian_sol_4h,trend_donchian_xrp_4h,uso_trend_1h
    days: '1830'
    gate_top: '2'
    singles_only: 'false'
    max_parallel: '6'

lands:
  store: docs/research/e35-bracket-corpus.jsonl
  assert_field: leg
  min_rows: 1
  note: >-
    min_rows is 1, not 14, for the reason RQ-20260830-002 states: the sweep
    shards per leg and one leg's data fetch can fail, so requiring all 14 would
    grade a 13-of-14 run as a LANDING failure — a different defect from "nothing
    landed", and this gate only catches the latter. Per-leg completeness is read
    off the corpus.
    ⚠️ RE-EXTRACTION SUPERSEDES, NEVER APPENDS: e35_corpus_extract keys identity
    on (leg, cell, tp_cap_pct, split_mode, split_target_oos) and prefers the
    newer generated_at, so these rows REPLACE the count-less 2026-08 vintage for
    the same cells rather than doubling the population.

related:
  - 'BL-20260831-E35-CORPUS-HAS-NO-ACHIEVED-OOS-COUNT (the defect this run exists to clear)'
  - 'RQ-20260830-002 (the monthly job whose power.basis names a field that did not exist)'
