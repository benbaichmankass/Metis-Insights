id: RQ-20261007-008
title: 'Breakout 1-Step Turbo prop fit on the committed Stage-0 record: pullback_doge_1h at flat 0.5% of balance, with days-to-target
  reported (PI-20261006-APBY4NTV-0001 slice 1, follow-on to RQ-20261006-017 PASS)'
status: queued
cadence: once
theme: new_strategy_prop
priority: 1
kind: experiment
question: 'Does pullback_doge_1h (DOGEUSDT 1h, the trend-pullback entry (scripts/backtest_pullback.py), harness-default parameters)
  clear the operator''s prop bar -- E[net $ banked before the account dies] > 0 with P(net>0) >= 0.70 on every seed -- under
  Breakout 1-Step Turbo (3% daily / 3% static max drawdown, 9% target, no minimum trading days, 00:30 UTC reset; config/prop_rulesets/breakout_turbo_1step.yaml,
  the $5k account breakout_2 trades) when sized flat 0.5% of balance, and how FAST does it pass: what are the simulator''s
  days_to_pass p50/p90 and p_pass_eval? Prices the committed Stage-0 trade record comms/strategy_evidence/runs/2026-10-07-stage0-prop/pullback_doge_1h__trades.jsonl
  (384 trades, the verbatim --emit-trades artifact of research-harness-dispatch run 37546819573, whose net_total_r=69.0459
  cleared RQ-20261006-017''s pre-registered rule; Breakout''s own cost stack is recomputed from gross_r/entry/sl by prop_ev_sim
  --costs breakout); no new backtest. This (leg, ruleset) pair has no prop fit on record (checked research/queue/ 2026-10-07:
  the leg exists only as the Stage-0 cell RQ-20261006-017; it is on no roster and in no evidence record).'
why_this_matters: 'PI-20261006-APBY4NTV-0001: the binding constraint on the current prop book is PACE, not risk (velotrade_1
  sim median ~220 d to +10%). RQ-20261006-017 is one of five Stage-0 cells that PASSED on 2026-10-07 (net-of-cost edge, n
  >= 39) out of 27 graded; RQ-20261006-017''s own what_it_does_not_do says the NEXT unit prices the PASS under a prop ruleset
  with days-to-target as the headline. Breakout is the venue that lists DOGEUSD (Breakout DOGEUSD (100k max position; leverage
  unconfirmed)); Velotrade and Tradeify list only BTC/ETH/SOL/XRP. A PASS here is a ranked, record-backed candidate for breakout_2''s
  roster (Tier-3, proposed not applied); a FAIL closes the cell for this ruleset.'
power:
  expected_n: 384
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 needs ~87-90 observations at alpha 0.05 / power 0.8 (floor registered by RQ-20260928-011/-012). expected_n=384
    is `wc -l comms/strategy_evidence/runs/2026-10-07-stage0-prop/pullback_doge_1h__trades.jsonl` counted 2026-10-07 before
    this unit was registered and equals population.n on research/results/RQ-20261006-017/37546819573.jsonl; below 88 the unit
    grades UNDERPOWERED, never FAIL.
  feasibility:
    source: none
    accrual_basis: Re-pricing of a committed trade record; nothing accrues. The record is in-sample over the harness's default
      window on default parameters (see the sidecar).
decision_rule:
  id: RULE-RQ1007-008-BREAKOUT-TURBO-FIT-pullback_doge_1h-f050
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: 'Per seed: prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive over pullback_doge_1h''s committed Stage-0
    trades (comms/strategy_evidence/runs/2026-10-07-stage0-prop/pullback_doge_1h__trades.jsonl), under config/prop_rulesets/breakout_turbo_1step.yaml,
    sizing flat 0.5% of balance (--ruleset config/prop_rulesets/breakout_turbo_1step.yaml --costs breakout --lev-cap pullback_doge_1h=5
    --no-hedge --swap-model prorated --funded-start fresh). Reported beside the verdict, from the same sims/ output: days_to_pass
    p50 and p90 (the simulator''s median days to the evaluation target) and p_pass_eval. P(pass by 30/90/180 d) is NOT emitted
    by prop_ev_sim today (filed separately as a tooling item by the 034..045 intake).'
  rule: PASS IF ev_net_usd_per_life > 0 on ALL 5 seeds AND P(net>0) >= 0.70 on ALL 5 seeds. UNDERPOWERED (indeterminate) IF
    n < 88. FAIL IF ev <= 0 on any seed. NULL (indeterminate) otherwise. A PASS is ranked by days_to_pass p50 in the candidate
    list (PI-20261006-APBY4NTV-0001) and is a Tier-3 roster proposal for breakout_2, NOT applied by this unit; a PASS with
    days_to_pass p50 > 180 d is still a PASS on this rule and is marked 'too slow' in the ranking, not re-graded. A FAIL is
    one pass and re-queues for a confirmatory run before it is read as a kill.
  what_it_does_not_do: Does not touch config/accounts.yaml, config/strategies.yaml or any prop roster. Prices one committed
    in-sample record (harness-default parameters, DOGEUSDT 1h, the harness's full cost stack replaced by Breakout's own via
    --costs breakout); not a live-parity check and not an OOS test (the harness has no OOS split). The leverage cap of 5 mirrors
    the 034..045 fits and is UNCONFIRMED for this symbol on Breakout. One sizing arm only, so it says nothing about whether
    a larger risk fraction would pass faster without breaching the daily-loss line.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 20
  basis: 1 leg x 1 arm x 5 seeds of prop_ev_sim, same shape and cost as RQ-20261006-034..045; a 20-life smoke run of the same
    command on this record completed locally in under 3 minutes (lane RQ-RESULTS, 2026-10-07).
run:
  workflow: research-script-run.yml
  timeout_minutes: 90
  command:
  - python3
  - scripts/research/prop_ev_grid.py
  - --leg
  - pullback_doge_1h=comms/strategy_evidence/runs/2026-10-07-stage0-prop/pullback_doge_1h__trades.jsonl
  - --arm
  - A=--sizing balance --risk-pct 0.005
  - --common
  - --ruleset config/prop_rulesets/breakout_turbo_1step.yaml --costs breakout --lev-cap pullback_doge_1h=5 --no-hedge --swap-model
    prorated --funded-start fresh
  - --seeds
  - 1,2,3,4,5
  - --grade
  - pass_all_seeds
  - --p-floor
  - '0.70'
  - --n-floor
  - '88'
  - --out
  - '{out_dir}'
  - --jobs
  - '4'
  inputs:
    research_unit: RQ-20261007-008
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
grading:
  auto: true
related:
- PI-20261006-APBY4NTV-0001
- RQ-20261006-017
- research/results/RQ-20261006-017/37546819573.jsonl
- comms/strategy_evidence/runs/2026-10-07-stage0-prop/pullback_doge_1h__stage0.json
- config/prop_rulesets/breakout_turbo_1step.yaml
- RQ-20261006-034
- docs/integrations/breakout-instruments-2026-09-27.md
last_dispatched_at: null
