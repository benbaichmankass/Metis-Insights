why_this_matters: 'Operator 2026-10-06 (verbatim, PI-20261006-APBY4NTV-0001): "continue searching for new strategies ... specifically
  for the prop accounts, with an emphasis on shorter-timeframe strategies, or at least strategies that turn a profit faster"
  and "anything that we''re able to trade is fair game". Batch 1 (RQ-20261006-005..031) and batch 2 (RQ-20261007-224..239)
  found that pace comes from BREADTH at 1h-4h, not faster bars; batch 2 (RQ-20261007-224..239) landed 10 PASS / 6 FAIL (RESEARCH-NIGHT-1010 read,
  2026-10-10). This batch widens breadth to cells the queue has never run, led by the trend family (zero trend cells exist
  in research/queue/) because trend_donchian is the live prop book''s own family. The research queue was starved at 8 runnable
  units at 20:49Z; these refill it. A PASS is Stage-0 evidence for a prop-fit follow-on, not a placement.'
