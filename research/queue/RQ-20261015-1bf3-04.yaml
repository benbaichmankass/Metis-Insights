roadmap:
- L-PROP
question: Is there a Stage-0 edge for trend_donchian_sol_4h at its config/strategies.yaml params, over the 1095 d window 2023-10-13 .. 2026-10-10
  20:00, net of the prop venue's cost stack (fee 8 bps round trip (Breakout commission 0.04%/side, prop_ev_sim A4), slippage 3 bps round trip,
  swap 5 bps per 24h window (velotrade's 0.0005/day, the larger of the two firms' daily swaps)) rather than the Bybit stack its records carry?
  This is a 4h leg proposed for the prop books (RQ-20261015-6504-01/-02), whose only records are at the Bybit stack.
why_this_matters: 'Manager, 2026-10-15 (lane RESEARCH-GRADE-BACKLOG): the tradeify_1 / velotrade_1 4h-add decision (RQ-20261015-6504-02 strict
  FAIL at +EV, RQ-20261015-1bf3-02 equal-risk re-run) does not go to the operator until two caveats are closed: (a) neither 4h leg has a Stage-0
  record at the configured params under the prop venue''s costs, (b) the 4h legs were priced over 1095 d against the incumbent''s 730 d. This
  unit closes (a) for one 4h leg.'
power:
  expected_n: 116
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 needs ~88 trades at alpha 0.05 / power 0.8; the Stage-0 grade's own floor is 39 (n_floor). The committed 1095 d record has 116
    trades at the Bybit stack; the cost stack changes R per trade, not the trade set.
  feasibility:
    source: none
    accrual_basis: Re-measure of committed price history at a different cost stack; nothing accrues.
decision_rule:
  id: RULE-RQ-20261015-1bf3-04-STAGE0-PROP-STACK
  registered_at: '2026-10-15'
  registered_before_run: true
  statistic: 'Arm P (trend_donchian_sol_4h as declared in config/strategies.yaml, plus the prop stack flags --fee-bps-roundtrip=8 --slippage-bps-roundtrip=3
    --funding-bps-per-window=5 --funding-window-hours=24): net_total_r over the window, n trades, and net_r per each of 4 equal calendar folds
    (exit_lever_ablation.py --grade stage0). Arm R (no extra flags) is a POSITIVE CONTROL that must reproduce the committed 1095 d record (n within
    2%, net_r within 0.5 R).'
  rule: 'PASS IF net_total_r(P) > 0 AND n(P) >= 39 AND at least 3 of 4 calendar folds net > 0 -> the leg has a Stage-0 edge at the prop venue
    stack: an input to the prop-add decision for the manager (no roster change here). FAIL IF n(P) >= 39 and that does not hold -> the leg has
    no Stage-0 edge at prop costs; the 4h add (or the incumbent, for an incumbent unit) is reported to the manager as failing Stage 0 at prop
    costs, never auto-removed. INDETERMINATE IF n(P) < 39 OR the control arm R fails to reproduce the committed record (the corpus differs; nothing
    is read).'
  what_it_does_not_do: 'Changes no roster, params or risk. Is not a prop-fit (EV per life) result: that is prop_ev_grid''s job, re-run window-matched
    once these land. Does not change the Stage-0 bar; it applies it at a different, declared cost stack.'
