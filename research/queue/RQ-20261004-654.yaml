decision_rule:
  id: RULE-RQ1004-XRP-TRAIL4-CONFIRM-B-FEE15
  registered_at: '2026-10-04'
  registered_before_run: true
  statistic: 'For cell trail4 of trend_donchian_xrp_4h in the landed m20 sweep record: is_oos_pass, d_net_r_OOS,
    wf_wins (walk-forward folds won), and the base book''s OOS trade count. Run at fee_bps_roundtrip=15
    (double the 7.5 default) as the fee-SURVIVAL arm.'
  rule: SURVIVES IF trail4 d_net_r_OOS > 0 at 15 bps roundtrip AND base OOS trades >= 50 (the lever's
