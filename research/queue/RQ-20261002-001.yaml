id: RQ-20261002-001
title: 'ict_scalp evidence rebuild on the CAUSAL HTF harness (7 measured legs)'
status: running
cadence: once
kind: experiment
theme: live_strategy
priority: 1
question: What do the 7 committed ict_scalp evidence records (xrp_15m, eth_15m, sol_15m, avax_5m, 5m, sol_5m,
  xrp_5m) say once rebuilt with scripts/ops/build_strategy_evidence.py on the causal HTF harness (#15341), under
  the SAME bar and the SAME folds the original records used?
why_this_matters: 'The committed records were built on a harness whose HTF bias filter had lookahead (PI-20261001-JWZSVYVS-0001,
  fixed in #15341). On one leg the causal harness takes n=87 vs n=140 (PI-...-0003). config_fingerprint hashes leg
  YAML, not the harness, so nothing marks the old records stale; mandate_resolver would grade them as written (PI-...-0004:
  xrp_15m is blocked only by cost-fidelity data and could FIRE on a lookahead-built record).'
power:
  expected_n: 120
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 needs ~88 observations at alpha 0.05 / power 0.8 (the floor RQ-20260928-011/-012 registered). expected_n=120
    is the old committed range scaled down by the measured causal/lookahead ratio (87/140 on xrp_15m); an estimate.
    Below 88 a leg grades UNDERPOWERED, never FAIL.
  feasibility:
    source: none
    accrual_basis: Historical window fetched from data.binance.vision; nothing accrues. n is bounded by the --days argument,
      not the calendar, so an UNDERPOWERED primary run is escalated (pre-registered below) rather than the floor lowered.
decision_rule:
  id: RULE-ICTSCALP-CAUSAL-REBUILD
  registered_at: '2026-10-02T17:03:00Z'
  registered_before_run: true
  statistic: 'Per leg, on the record scripts/ops/build_strategy_evidence.py writes at --days 365 --folds 4 with the leg''s
    live config (no --ignore-yaml), against the causal HTF alignment already on main (scripts/backtest_ict_scalp.py::_build_htf_series
    label=right).'
  rule: 'SAME bar and folds as the original records, nothing added or relaxed. Folds: 4 contiguous equal-count time folds,
    365d window. Costs: the full stack the producer resolves (fee 7.5 bps roundtrip + venue slippage + funding), unchanged.
    The bar is the union of RULE-D1-STAGE0-NET-OF-FULL-COST (net_r_oos > 0) and MD-PROMOTE-S1-S2 bar (min_n_closed 30,
    expectancy_r_oos > 0, folds_positive a strict majority of folds). PASS iff coverage_state=measured AND n >= 88 AND
    net_r_oos > 0 AND expectancy_r_oos > 0 AND 2*folds_positive > folds. UNDERPOWERED iff n < 88 (never FAIL). FAIL iff
    n >= 88 and any other clause fails. NOT_APPLICABLE iff the feed or harness fails. POWER ESCALATION (pre-registered): a leg
    UNDERPOWERED at 365d is re-run at --days 730 --folds 4 with the SAME clauses; that run is reported beside the primary
    and decides the powered verdict, and the 365d record stays the committed superseding record. The 88 floor and every
    other threshold are NOT changed after seeing any result. Old records are kept under comms/strategy_evidence/superseded/
    and marked superseded, not deleted. Output is evidence only: no strategy config, roster or mandate change; any roster
    implication is a Tier-3 proposal, not applied.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.5
  est_minutes: 60
  basis: one data.binance.vision fetch + one harness run per leg (365d of 5m/15m, minutes each), session-local.
run:
  workflow: research-script-run.yml
  timeout_minutes: 90
  command:
  - python3
  - scripts/ops/build_strategy_evidence.py
  - --strategy
  - ict_scalp_xrp_15m
  note: 'Run SESSION-LOCAL by lane ICT-EVIDENCE-REBUILD (status: running so the dispatcher, which fires only queued units, does not double-run it).'
lands:
  store: comms/strategy_evidence/
  assert_field: coverage_state
  min_rows: 7
related:
- docs/claude/work/pipeline/20261001T231100000000Z-evrebuild.json
- docs/claude/work/pipeline/20261001T233500000000Z-mdexpo.json
- tests/test_backtest_ict_scalp_htf_causal.py
last_dispatched_at: null
