id: RQ-20260930-701
title: >-
  Regime impact scoping (TREND axis): if a classifier of accuracy A in {0.55, 0.60, 0.70, oracle} gates each
  leg's losing ADX-14 cells, what is the change in full-cost net R?
status: done
cadence: once
theme: regime
priority: 1
kind: experiment

question: >-
  On the committed per-trade ledgers (comms/strategy_evidence/runs/*/*__trades.jsonl, full cost stack in
  net_r), select each leg's losing (ADX-14 trend label x direction) cells on TRAINING blocks only, then drop
  test-block trades whose classifier-PREDICTED cell is selected. The predicted label equals the true
  ADX-14 label with probability A (A in {0.55, 0.60, 0.70}) or is noise-flipped by a fixed confusion model;
  A = oracle applies no noise. What is the change in net R (sum over test blocks), per leg and pooled, as the
  mean and 5th-95th percentile band over >= 200 seeds?

why_this_matters: >-
  UPPER-BOUND SCOPING INSTRUMENT, NOT A PROMOTION CASE. It exists so the operator can prioritise regime work.
  Known going in (manager survey 2026-09-30, re-verified): live regime cells cover only BTC-named legacy legs
  plus gld_pullback_1h; E38 (2026-09-25) is a power-bounded null on 22 crypto legs; the within-cell veto
  RQ-20260928-002 FAILED (veto_delta_r -0.0502, perm_p 0.996, n_oos 1857). Nothing has measured how much a
  PERFECT trend classifier could add, nor how fast that headroom decays with realistic accuracy. If the
  oracle has no headroom, trend-axis regime gating is not where the next engineering hour goes. If only the
  oracle has headroom, classifier accuracy is the bottleneck. If A = 0.70 already has headroom, regime work
  on the trend axis is worth prioritising - and still needs regime_cell_walkforward.py on the real 2-D cell
  plus a Tier-3 packet before any cell is authored (.claude/skills/regime-selectivity).
  VOL AXIS NOT COVERED: no vol labels are committed to the ledgers (adx_at_entry is null and the vol head
  output is not stored); covering it needs a head replay or frozen bucket edges. A result here says nothing
  about vol gating.

power:
  expected_n: 1775
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Unit of analysis is the test-block trade (blocks 1..3 of 4, per leg). d = 0.1 sd per-trade delta needs
    (1.96 + 0.8416)^2 / 0.1^2 = 784.9 trades. MEASURED on main 2026-09-30 by the harness's own population
    filter (newest committed ledger per leg, n >= 30, USDT perp with a resolvable timeframe): 22 legs,
    2,367 trades, 1,775 in test blocks - clears the floor on paper. The normal-approximation floor is optimistic
    here: legs sharing a symbol share regimes and trades (ETH has 7 legs, SOL 6), so the EFFECTIVE n is lower
    and the pooled band is optimistic; the verdict note says so. 7 further legs with n >= 30 (equity / futures:
    gld_pullback_1h, mgc_trend_1h, qqq_pullback_1h, ...) have no committed candle source and are
    not_attempted, not dropped silently.
  feasibility:
    source: none
    accrual_basis: >-
      Re-grading of committed trade ledgers with fetched public candles (Binance vision); nothing accrues.
      n is measured above, not assumed.

decision_rule:
  id: RULE-RQ0930-701-REGIME-HEADROOM-TREND
  registered_at: '2026-09-30'
  registered_before_run: true
  statistic: >-
    Pooled DeltaNetR per test trade under the ORDINAL confusion model (errors go to the adjacent class;
    transitional splits chop/trending evenly), pooled by re-sampling legs with replacement per seed, >= 200
    seeds (300 run). Reported for A = 0.55, 0.60, 0.70 and oracle; the UNIFORM confusion model is reported as
    a sensitivity arm and does not enter the verdict. Per-leg DeltaNetR is also reported (noise-only band).
    Cells: (ADX-14 label on the last bar CLOSED at entry [chop < 20, transitional < 25, trending >= 25] x
    direction). Selection: cell has train n >= 8 and train net R < 0, train = earlier blocks only (expanding,
    K = 4 chronological blocks).
  rule: >-
    IF fewer than 5 legs are measured -> could_not_measure (read_state no_data); no verdict.
    ELSE IF A=0.70 pooled mean >= 0.03 R per test trade AND its 5th percentile > 0 ->
      `headroom_at_realistic_accuracy` (verdict pass): trend-axis regime work is worth prioritising; the next
      unit is regime_cell_walkforward on the real cells, NOT a cell flip.
    ELSE IF oracle pooled mean >= 0.03 R per test trade AND 5th percentile > 0 ->
      `headroom_only_with_oracle` (verdict indeterminate): classifier accuracy is the bottleneck; prioritise
      the head-vs-ADX accuracy unit before any gating work.
    ELSE -> `no_headroom_trend_axis` (verdict fail): deprioritise trend-axis gating; the vol axis is untested.
    0.03 R per test trade is the bar because it is of the order of the per-trade fee+slippage stack the
    ledgers carry (cost_total_r 0.29 on the ict_scalp_5m sample row) - an effect below it is not worth a
    live-routing change even if it were real.
  min_n: >-
    5 measured legs; 30 trades per leg; 8 training trades per cell; 200 seeds. Below any of these the
    corresponding leg/cell is excluded and listed, never imputed.
  what_it_does_not_do: >-
    Cuts nothing and flips no live gate. NOT A PROMOTION CASE: an upper bound (selection is honest
    out-of-sample, but dropping a trade is assumed to leave later trades unchanged, the oracle uses the
    same ADX label the cells are defined on, and pooled legs on one symbol are not independent). It says
    nothing about the vol axis, about equity/futures legs, or about whether any specific cell generalizes.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 20
  basis: >-
    Committed ledgers + ~5 (symbol, timeframe) public candle series fetched from Binance vision on a runner
    (no VM-resident data); 300 seeds x 4 arms x 2 confusion models x 22 legs of a numpy loop.

run:
  workflow: research-script-run.yml
  timeout_minutes: 60
  command:
  - python3
  - scripts/research/regime_impact_scoping.py
  - --out
  - '{out_dir}'
  - --seeds
  - '300'
  inputs:
    research_unit: RQ-20260930-701

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

references:
  - RQ-20260928-002 (within-cell veto FAIL)
  - docs/research/e38-regime/ (E38 power-bounded null, 22 crypto legs)
  - .claude/skills/regime-selectivity/SKILL.md

