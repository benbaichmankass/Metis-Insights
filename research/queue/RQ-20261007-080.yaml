  - 'PI-20261006-5FUGHVX8-0001 (ranked TP-doctrine debt; this unit is build B1''s first rule)'
  - 'RQ-20261006-060 (the entry-side question for trend_donchian_eth_4h: a finite tp_r vs the sentinel)'
  - 'scripts/research/be_floor_sweep.py (the fold/gate machinery reused verbatim)'
  - '.claude/skills/exit-refinement/SKILL.md (harness lever -> E0 -> live parity; tests/test_tp_revision_donchian_rule.py pins harness/live parity)'
