id: RQ-20260929-302
title: >-
  POOLED over every leg the live pullback/donchian VARIANT builders evaluate
  on a forming bar — does evaluating the whole entry signal on the forming bar
  cost money robustly enough to move the family's live decision to the closed
  bar? And what does each real-money leg's CURRENT Stage-0 evidence record
  read under forming-bar mode? (PI-20260929-VOLSKIP-SIGNAL-0002)
status: queued
cadence: once
kind: deterministic

question: >-
  Manager dispatch 2026-09-29 13:05Z (lane VOLSKIP-SIGNAL). RQ-20260929-301
  graded HARNESS_MODELS_FORMING on ada_pullback_2h and trend_donchian_xrp_4h:
  trade sets share 18% / 42% of entries, forming is worse on both (-25.7R /
  -5.75R) but each leg alone is underpowered (MDE 62R / 31R). Pooling every
  leg on the same two builders gives the test power; the Tier-3 change the
  rule can call for is at the BUILDER, which all of them share.

why_this_matters: >-
  Four legs on these builders trade real money on bybit_2 (ada_pullback_2h,
  xrp_pullback_2h, trend_donchian_xrp_4h, trend_donchian_eth_4h — enumerated
  from config/accounts.yaml, not the two RQ-301 named), plus two prop legs on
  breakout_1. Their Stage-0 evidence records (comms/strategy_evidence/) were
  measured on the closed bar; the live legs trade the forming-bar set.

why_not_inferential: >-
  The per-leg trade sets are a deterministic census; the pooled net-R
  difference is inferential and carries a month-block bootstrap (months
  resampled jointly across legs, so cross-leg correlation is kept), an
  ex-max-year and an ex-max-leg sign check, and a stated MDE.

design:
  population: >-
    Every config/strategies.yaml leg routed through
    _htf_pullback_variant_builder or _trend_donchian_variant_builder with
    enabled: true, live or shadow (shadow legs are evaluated identically, only
    the order is suppressed), whose symbol has Binance USD-M 1m history:
    eth_pullback_2h, eth_pullback_prop_2h, sol_pullback_2h, xrp_pullback_2h,
    ada_pullback_2h, avax_pullback_2h, trend_donchian_sol,
    trend_donchian_eth, trend_donchian_sol_prop, trend_donchian_eth_prop,
    trend_donchian_eth_4h, trend_donchian_sol_4h, trend_donchian_xrp_4h,
    trend_donchian_ada_4h, trend_donchian_avax_4h (15 legs). The flagship
    htf_pullback_trend_2h / trend_donchian builders are OUT of this population
    (different builders; not established here that they read a forming bar).
  data: >-
    Binance USD-M perp 1m klines 2020-01 → latest, a LABELLED PROXY for Bybit
    (api.bybit.com geo-blocked from the research container); resampled with
    vol_skip_forming_bar_replay.build_bars.
  harness_kwargs: >-
    Generated from each leg's YAML block (every entry and exit key the
    harness models: lookbacks, atr_stop_mult, trail_mult, trail_decay_*,
    stale_exit_*, tp_r, adx_min, min_confidence, side_filter / long_only,
    skip_hours, vol_skip_*), plus the fixed live conventions tp_cap_pct 0.099
    (the resting Bybit TP clamp), timeout_bars 200, cooldown_bars 1. NOT
    modelled, stated: the ML exit head on trend_donchian_sol/eth
    (exit_head_model) — identical in both arms, so it cannot create the
    difference but can scale it.
  arms:
    A_closed: run_backtest(decision_bar="closed") — Stage 0 today.
    B_forming: >-
      run_backtest(decision_bar="forming") — the new harness mode, whose
      decision is scripts/research/forming_bar_entries.py (the same code
      RQ-20260929-301's arm B ran, now shared).
  costs: execution_costs full stack per symbol (fee, venue slippage, funding).
  evidence_restatement: >-
    For each real-money bybit_2 leg with a record in comms/strategy_evidence/:
    both arms' net R over the record's own window [data_start, data_end]
    (entries in that window; prior history available to both arms as the
    live 200-bar fetch has it), beside the record's net_r_oos. Graded by the
    record's own rule RULE-D1-STAGE0-NET-OF-FULL-COST (net R > 0).

decision_rule:
  id: RULE-RQ0929-302-POOLED-FORMING
  registered_at: '2026-09-29'
  registered_before_run: true
  statistic: >-
    Pooled over the 15 legs, entries on bars where the 200-bar live frame
    exists: dR = Σ net R(B_forming) − Σ net R(A_closed); 90% interval from a
    calendar-month block bootstrap of the per-month pooled dR (10,000
    resamples, seed 302); dR with the calendar year of largest |dR| removed
    (ex-max-year); dR with the leg of largest |dR| removed (ex-max-leg);
    pooled J = shared entries / union.
  rule: >-
    MOVE_LIVE_TO_CLOSED IF the 90% interval lies entirely below 0 AND
    ex-max-year dR < 0 AND ex-max-leg dR < 0 AND |dR| >= 10R: the forming-bar
    decision robustly costs money across the family, so the builders must
    decide on the closed bar (drop the forming row before order_package;
    entry at the first tick after the close) — a Tier-3 change proposed with
    this record as its evidence.
    ELSE FORMING_ROBUSTLY_BETTER IF the interval lies entirely above 0 AND
    both ex-max signs are > 0: no live change; Stage 0 for these legs must be
    re-based on decision_bar="forming".
    ELSE INCONCLUSIVE: no live change; the finding stands as a
    measured fidelity gap, and the per-leg restatement below decides whether
    any real-money leg's Stage-0 standing is in question.
    STANDING_AT_RISK (reported per real-money leg, whatever the pooled
    verdict): a leg whose forming-mode net R over its record window is <= 0
    while its record passes RULE-D1 — its Stage-0 pass does not describe
    what it trades; flagged to the manager for the demotion mandate's own
    clauses, not acted on here.
  power: >-
    Reported: MDE at 80% power, one-sided 5% = (1.645 + 0.842) × bootstrap SE.
  what_it_does_not_do: >-
    Changes no parameter or roster. Uses no live-book P&L as edge evidence.
    Does not grade legs outside the population.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 60
  basis: 15 legs × ~1-2 min of unit calls each on 4 workers.

run:
  workflow: research-script-run.yml
  timeout_minutes: 240
  inputs:
    research_unit: RQ-20260929-302
  commands:
  - - python3
    - scripts/research/forming_bar_pooled_regrade.py
    - --fetch
    - --klines-dir
    - '{out_dir}/klines'
    - --out
    - '{out_dir}/forming-bar-pooled.json'

lands:
  store: docs/research/evidence/forming-bar-pooled-2026-09-29.json
  assert_field: pooled

related:
  - PI-20260929-VOLSKIP-SIGNAL-0002
  - RQ-20260929-301 (two legs; HARNESS_MODELS_FORMING)
  - PR #14195
