id: RQ-20261011-9da8-01
title: 'Frontier: time-series foundation-model forecaster bake-off for the volatility-regime head (Chronos-2, TimesFM-2.5,
  TiRex-2, Kronos vs the shipped Chronos-Bolt-Tiny fc features, with a HAR-RV control)'
status: blocked
cadence: once
theme: regime
priority: 2
kind: experiment
question: Under purged 5-fold walk-forward CV and the SAME dataset rows, does ANY of Chronos-2 (119M, Apache-2.0), TimesFM-2.5
  (231M, Apache-2.0), TiRex-2 (82M, Apache-2.0), Tiny Time Mixers TTM-r2 (ibm-granite/granite-timeseries-ttm-r2, 805K params, Apache-2.0; ADDED 2026-10-15) or Kronos-base (102M, MIT, OHLCV-native) used as a frozen quantile forecaster
  (the same six scale-free fc_* columns build_forecasts.py emits) lift the BTC/ETH/SOL 15m volatility-regime head's macro_f1
  and f1_volatile over the incumbent fc features (Chronos-Bolt-Tiny, 9M) AND over a no-neural control (HAR-RV realised-vol
  forecast columns)?
why_this_matters: 'Only ONE TSFM (Chronos-Bolt-Tiny) has ever been tested, frozen, on the volatility head (T0.1/T0.4, 2026-07-01);
  its fc features are the one durable win and are advisory today (macro_f1 0.573 BTC / 0.541 SOL). Two things are UNTESTED,
  not closed: (1) larger / newer / finance-native forecasters; (2) whether fc beats a classical HAR-RV control at all (no
  record of that comparison was found in ROADMAP.md T0.4 or docs/research/T0.4-*). Operator 2026-10-11: do not let the first
  good thing dictate scope. Kronos is reported (secondary source, unverified) to be pretrained on 45 exchanges incl. crypto, so the registered rule also reads a post-2025-09-01
  holdout where overlap with pretraining is least likely (the pretraining cutoff is UNVERIFIED).'
power:
  expected_n: 3
  min_detectable_effect: 0.01
  effect_units: sd
  design: paired
  alpha: 0.05
  power: 0.8
  basis: 3 symbols x 5 purged folds on ~175k rows for BTC (dataset v003; ETH/SOL sizes not re-measured here); the registered quantity is the paired fold-level
    difference in macro_f1 vs the incumbent. 5 folds is thin for an interval, which is why the rule requires the SAME sign
    on all three symbols rather than a significance test on one.
  feasibility:
    source: none
    accrual_basis: ''
decision_rule:
  id: RULE-RQ1011-9DA8-01-TSFM-BAKEOFF
  registered_at: '2026-10-11'
  registered_before_run: true
  statistic: 'Per candidate forecaster and symbol: paired purged-CV delta macro_f1 and delta f1_volatile vs the incumbent
    fc (Chronos-Bolt-Tiny) head on identical rows, and vs the HAR-RV control; plus the same deltas on the post-2025-09-01
    holdout. Feature-lift gate only -- NOT a P&L figure.'
  rule: 'PASS IF for at least one candidate forecaster: delta macro_f1 >= +0.010 vs the incumbent fc AND >= +0.010 vs HAR-RV
    on BTC, the same sign (> 0) on ETH and SOL, AND the post-2025-09-01 holdout delta is > 0 on BTC. FAIL IF no candidate
    reaches delta macro_f1 > +0.005 vs the incumbent on any symbol (the incumbent stays; the family is not closed -- a FAIL
    closes only these checkpoints, zero-shot, on this head). If HAR-RV >= the incumbent fc on BTC, REPORT that as the headline
    (the neural forecaster adds nothing over a classical one) and re-route. INDETERMINATE otherwise. A PASS is a candidate-stage
    manifest only; any advisory use is judged downstream by the regime-cell walk-forward NET OF COST.'
  ttm_arms_addendum:
    registered_at: '2026-10-15'
    registered_before_run: true
    source: 'Operator decision 2026-10-15 (weekly walk-through, Approve all). Basis: arXiv 2607.05291 (Brini, 6 Jul 2026), body read 2026-10-15 (lane ML-FRONTIER-W42).'
    arms_added: 'TTM-r2 as a frozen forecaster emitting the same six scale-free fc_* columns, and a TTM+HAR-RV EQUAL-WEIGHT combination arm (average of the TTM and HAR-RV realised-vol forecasts before the fc_* columns are formed).'
    kill_rule: 'KILL the TTM arms (and close the TTM question on this head, these checkpoints, zero-shot) IF neither the TTM arm nor the TTM+HAR-RV arm beats the HAR-RV control by the registered margin (delta macro_f1 >= +0.010 vs HAR-RV on BTC) on BTC, ETH AND SOL 15m. The main rule above applies unchanged to every other candidate; the TTM arms add candidates, they do not loosen any bar.'
    what_the_paper_does_and_does_not_show: 'CONFIRMED in the body: on 50 assets (40 US equities, 5 FX, 5 futures; daily realised variance at 5-min sampling; h=1/5/22 days; VOLARE, 2009/2015-Jan 2026) only TTM of nine zero-shot TSFMs beats Log-HAR at every horizon on the equal-weighted average QLIKE ratio (0.982 / 0.986 / 0.987, i.e. 1.3-1.8% better); TTM+Log-HAR equal weight 0.977 / 0.984 / 0.982, significantly better than Log-HAR on 36 of 50 assets at h=1 but better than TTM itself on at most 12. NOT shown: (1) no crypto asset and no 15-minute horizon in the sample; (2) after a Mincer-Zarnowitz recalibration TTM falls to 8th at the daily and weekly horizons, so the short-horizon edge is mostly better SCALE, not better dynamics; a genuine gain remains only at h=22; (3) the target is a QLIKE loss on realised variance, ours is a macro-F1 on a 4.6%-base-rate volatile CLASS; (4) the paper concedes pretraining-contamination cannot be ruled out for some models (TTM: Monash + LOTSA subsets, <1% financial). The paper is therefore the reason to TEST TTM here, not evidence it will win; the HAR-RV control is what keeps the test honest.'
  what_it_does_not_do: 'Does not train, promote or serve anything; does not touch config/*.yaml; no live-box dependency (torch
    stays trainer-side, forecasts are mirror-published like fc). A feature-lift PASS is not edge: it earns a candidate manifest
    and the downstream net-of-cost regime-cell walk-forward, nothing more. Says nothing about fine-tuned (LoRA) variants --
    that is a separate unit only if zero-shot passes.'
blocked_on:
- kind: work_item
  ref: FRONTIER-LEVER-TSFM
  what: '[2026-10-15 ML-FRONTIER-W42: TTM added. It needs a `ttm-r2` backend in build_forecasts.py AND the granite-tsfm package (tsfm_public) in the trainer venv -- NOT installed (FRONTIER-LEVER-TRAINER-DEPS installed catboost/timesfm/tirex/tabpfn/tabicl only); a Tier-2 pip, pinned.] The RUNNER now exists (ML-RQ-RUNNER: scripts/research/ml_bakeoff.py via research-script-run-trainer.yml; the HAR-RV control is its `har_rv` feature block). Still missing, MEASURED on the trainer 2026-10-11: (1) no Chronos-2 / TimesFM / TiRex / Kronos forecast side-stream builder -- scripts/ml/build_forecasts.py is hard-wired to Chronos-Bolt-Tiny (chronos-forecasting 2.3.0 IS in the trainer venv, so Chronos-2 needs only a backend; timesfm, tirex and the Kronos code are NOT installed -- a Tier-2 pip or those arms report `unavailable`); (2) fc side-streams per backend for BTC/ETH/SOL 15m joined to a dataset (shards are datasets-out/market_features/<SYM>/15m/<vNNN>/data.jsonl; BTC has v002/v003, ETH v002/v003, SOL only v002/v530 -- confirm a v003 SOL shard); (3) the `ml_bakeoff:` block + run.* below filled in. NOTE routing.peak_memory_gb was 8.0 > the 6 GB trainer, which the router REFUSES (unroutable); lowered to 5.5 with the loader reading only declared columns (tail_rows) -- re-declare from the first run.'
  clears_when: build_forecasts.py takes --backend (chronos-2 at minimum) + a test pins the six fc_* names/shape per backend, a side-stream exists on the trainer for BTC/ETH/SOL 15m, and the unit carries an ml_bakeoff block. Then git mv to research/queue/ and fill run.workflow (research-script-run-trainer.yml), run.command, lands.store.

