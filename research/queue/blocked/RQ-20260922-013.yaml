id: RQ-20260922-013
title: Can avax_pullback_2h be refined into a leg whose edge is present in the RECENT window, or is the
  2026-07-22 demotion simply correct?
status: blocked
cadence: once
kind: inferential
question: avax_pullback_2h pools +12.6729R over n=45 net of the full cost stack and passes RULE-D1, while
  its most recent fold is -4.3601R over 12 trades and its last nine months are -2.72R. Is there a parameter
  or filter change, chosen on IN-SAMPLE data and validated OUT-OF-SAMPLE on the recent window, that makes
  this leg net-positive on the period since its demotion — or does a bounded search fail to find one,
  in which case the 2026-07-22 demotion stands and the leg should be proposed for a KILL rather than carried?
why_this_matters: "OPERATOR, 2026-09-22: \"wire ada only and send avax to the research que for refinement.\"\
  \ The leg was staged onto bybit_2 (REAL MONEY) and withdrawn before merge.\n⚠️ THE ARGUMENT THAT STAGED\
  \ IT WAS WRONG, AND THE ERROR IS THE POINT OF THIS UNIT. The manager argued the 2026-07-22 demotion\
  \ set its own re-promotion condition — \"Thin n (7 trades) — a 4-6wk shadow re-eval is expected before\
  \ any permanent kill decision\" — and that R7's +12.6729R over n=45 met it. But the demotion is dated\
  \ 2026-07-22 and the corpus's fold 4 runs 2026-07-09 -> 2026-09-20. THE RE-EVAL THE DEMOTION ASKED FOR\
  \ *IS* FOLD 4, and fold 4 is -4.3601R. The +12.6729 was discharged against ten months that PREDATE the\
  \ demotion. So the demotion's own condition has been tested and FAILED, not met.\nFold shape, from the\
  \ committed fold_detail (window_days 365):\n  +15.3895 (2025-09-26 -> 2025-12-04, n=11)\n   +1.0988\
  \ (2025-12-06 -> 2026-03-05, n=11)\n   +0.5447 (2026-03-11 -> 2026-07-09, n=11)\n   -4.3601 (2026-07-09\
  \ -> 2026-09-20, n=12)\nThe entire pooled result is fold 1. This is what a decaying leg looks like,\
  \ and it is why the unit asks whether refinement can recover it rather than assuming it can.\n⚠️ AND\
  \ A SECOND, INDEPENDENT FINDING ABOUT THIS LEG IS ALREADY ON RECORD: its declared `trail_decay_arm_r:\
  \ 4.86` is reachable on 2 of 45 backtest entries (4.4%; cap_R median 3.27 against an arm needing risk/entry\
  \ <= 2.037%). Whatever refinement is tried, that arm is close to decoration today — see config/lever_reachability.json\
  \ and checklist E41."
why_inferential: 'A parameter search over a finite grid IS a sample-and-estimate procedure and the multiple-comparisons
  exposure is the whole risk: searching hard enough on 45 trades will always find a variant that looks
  good in-sample. That is why the decision rule below fixes the grid, the split and the acceptance threshold
  BEFORE the run, declares the expected n, and makes "no variant clears the bar" a REPORTABLE, SUFFICIENT
  and expected outcome.'
power:
  expected_n: 45
  expected_n_oos: 12
  note: '⚠️ STATED PLAINLY BECAUSE IT BOUNDS EVERYTHING BELOW: the OOS window this unit actually cares
    about — the period since the demotion — holds TWELVE trades. Twelve trades cannot establish an edge
    at any conventional power. This unit is therefore honestly framed as a REFUTATION attempt: it can
    show that no variant in the grid recovers the recent window (a strong, cheap, useful negative), and
    it CANNOT license a promotion on its own. A variant that passes here earns a SHADOW re-soak with a
    stated trade target, never a real-money roster slot. Any deliverable that proposes bybit_2 off 12
    OOS trades is out of scope and should be refused.'
decision_rule:
  id: RULE-RQ0922-013-AVAX-RECENT-WINDOW
  registered_at: '2026-09-22'
  registered_before_run: true
  grid: 'Fixed BEFORE the run and not to be widened mid-unit: trend_lookback in {30, 40, 50}, pullback_lookback
    in {8, 10, 14}, plus the existing config''s values as the baseline cell. 9 variants + baseline = 10.
    Any additional axis makes this a different unit with its own registration.'
  split: IS  = 2025-09-26 -> 2026-07-08 (the three folds preceding the demotion) OOS = 2026-07-09 -> present     (the
    demotion's own re-eval window) Fixed by DATE, not by trade count, because the date is what the demotion
    named. Do not re-derive a split that happens to be kinder.
  costs: Net of the full cost stack — fees 7.5, slippage 5.0, funding 1.0 bps roundtrip, identical to
    the R7 corpus. A fee-only result does not answer this question and must not be reported as if it did.
  rule: 'A variant CLEARS only if ALL of: (1) OOS net_r > 0 on the window above; (2) it is not the single
    best of the 10 by IS net_r alone — i.e. it must also rank in the top half OOS, so an IS-overfit winner
    cannot pass; (3) OOS n >= 8, so a variant that clears by trading almost nothing is refused. IF >=
    1 VARIANT CLEARS: the deliverable is a SHADOW re-soak proposal for that variant with a stated trade
    target and a re-read date. NOT a promotion, and explicitly not a bybit_2 proposal — see `power` above.
    IF NO VARIANT CLEARS: that is the ANSWER, not a failure. The deliverable is a KILL proposal for avax_pullback_2h
    with the grid, the split and the per-variant table attached, for the operator to accept or decline.'
  what_it_does_not_do: 'Changes no config, flips no execution gate, and touches no roster. avax_pullback_2h
    stays `execution: shadow` on the paper accounts throughout, which is where it already is. Both outcomes
    are PROPOSALS.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 25
  basis: 10 backtest variants on one symbol (AVAXUSDT) at 2h over ~1 year. The R7 run measured a single
    config of this leg in well under a minute, so 10 variants plus candle fetch is a runner job, not a
    GPU one.
lands:
  store: comms/strategy_evidence/runs/<run-id>/
  assert_field: oos_net_r
  min_rows: 10
  note: 'min_rows 10 — one row per grid cell INCLUDING the baseline. A result missing cells is a partial
    run, not a partial success: the acceptance rule ranks variants against each other, so a missing cell
    changes the ranking.'
related:
- RQ-20260922-012 (the fold-recency question this leg surfaced)
- checklist R8 (the promotion that staged and then withdrew this leg)
- checklist E41 (its trail_decay_arm_r is reachable on 2/45 — a separate Tier-3 row)
- config/strategies.yaml::avax_pullback_2h (the 2026-07-22 demotion, preserved verbatim, now UNDISCHARGED)
last_dispatched_at: null
blocked_on:
- what: 'NO WORKFLOW ROUTES A PARAMETER GRID FOR THE PULLBACK FAMILY. MEASURED 2026-09-22 by reading the
    workflow''s own inputs rather than assuming: pullback-frac-cross-leg-sweep.yml accepts exactly `only`,
    `days` and `max_parallel` — it sweeps a fixed frac across legs and takes no trend_lookback/pullback_lookback
    axis and no IS/OOS split argument. e35-bracket-sweep.yml is a bracket sweep, m20-exit-lever-sweep.yml
    is an exit-lever sweep, and ict-scalp-* are the wrong family. So the 10-cell grid this unit registered
    BEFORE the run has nothing that can execute it.

    ⚠️ AND THE SPLIT IS THE HARDER HALF, not the grid. This unit fixes IS/OOS BY DATE (IS 2025-09-26 ->
    2026-07-08, OOS 2026-07-09 -> present) because the date is what the 2026-07-22 demotion named. Every
    existing sweep derives its split from a trade count (`split_mode: oos-trades`, `--split-target-oos`),
    which would silently answer a DIFFERENT question — and a split that happens to be kinder is exactly
    the drift the pre-registration exists to prevent.'
  ref: checklist E4 (a real corpus, and one way to get candles) / E7 (wire the orphan backtest harnesses)
  clears_when: A dispatchable workflow can run a named parameter grid on ONE pullback leg with a DATE-FIXED
    IS/OOS split, net of the full cost stack, and land per-variant rows. ⚠️ A workflow that only supports
    a trade-count split does NOT clear this — it answers a different question and must not be substituted.
run:
  workflow: null
  note: Null because it is TRUE, not as a placeholder. Verified by reading the inputs of every candidate
    sweep workflow (see blocked_on). Naming one that cannot run this grid, or cannot honour the date-fixed
    split, would be the false declaration the queue schema exists to refuse.
