id: RQ-20260930-504
title: 'Strategy development: is there ANY profitable <=1h crypto-perp strategy in the existing harness families, and does it fit HyroTrader? Two-stage, family-wise-corrected search (lane HYRO-STRATS, blocked on the sweep orchestrator)'
status: blocked
cadence: once
kind: experiment

question: >-
  Operator, 2026-09-30: "add a research unit to strategy development to look for some profitable
  shorter time frame strategies". The committed evidence (docs/research/hyro-strategy-feasibility-2026-09-30.md)
  has 15m ict_scalp legs at +0.03 to +0.08 R a trade after cost, every other <=1h family at or below zero,
  and no evidence at all for session-open, funding-window or VWAP-at-current-cost ideas. So: across a FIXED,
  pre-declared grid of (family x symbol x timeframe) cells drawn from the cost-complete harnesses, run at each
  family's LIVE-CONFIG parameters with no tuning, does any cell show a net-of-full-cost edge that survives a
  family-wise multiple-testing correction on data it was not screened on, and does it also fit HyroTrader's
  rules (same-day closes, >= 10 trades and >= 4 qualifying days a month)?

why_this_matters: >-
  This is the discovery half of the HyroTrader question. RQ-20260930-501 asks whether ONE known book clears a
  bar; this asks whether a better book exists in the space we can already measure honestly. Searching many
  cells and reporting the best is the classic way to manufacture an edge (the repo's own
  param_selection_provenance: not_established caveat), so the design is fixed here, before any run: a
  screen on the early window, a Bonferroni-corrected confirmation on the late window that the screen never
  saw, and a result of "nothing found" is a first-class outcome.

power:
  expected_n: 350
  min_detectable_effect: 0.2
  effect_units: sd
  design: one_sample
  alpha: 0.01
  power: 0.8
  basis: >-
    Stage B confirms at most S survivors of the Stage A screen at alpha = 0.05 / S one-sided; with S about 5
    that is 0.01, so z = 2.326 + 0.8416 = 3.17 and n = (3.17 / d)^2 = 251 for d = 0.2 and 113 for d = 0.3.
    expected_n = 350 is an INFERENCE: a 5m leg produced 193-259 trades per 365 days in the committed
    ledgers, so the 2-year confirmation window holds about 400-520 for 5m cells and about 240-260 for 15m
    cells. What this design CAN see is stated plainly: an edge of 0.2 sd of per-trade R (about 0.2 R at
    the observed spread of R) is detectable, while the 0.03-0.08 R edges observed on the 15m legs
    (about 0.05-0.1 sd) are NOT detectable individually at this n after correction. A "nothing survives"
    result therefore means "no LARGE edge", not "no edge"; it must not be quoted as the latter.
  feasibility:
    source: none
    accrual_basis: >-
      Historical re-run on staged candles (2021-01 to the latest complete day); nothing accrues. Cells whose
      candle history is shorter than the Stage A window are reported as not_applicable, never dropped.

decision_rule:
  id: RULE-RQ0930-504-SHORT-TF-DISCOVERY
  registered_at: '2026-09-30'
  registered_before_run: true
  statistic: >-
    GRID (fixed now, not extended after a run). Symbols BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, AVAXUSDT.
    Timeframes 5m and 15m (and 30m where a harness supports it). Families, each at its LIVE
    config/strategies.yaml parameters for that symbol where a leg exists, else the family's shared default:
    ict_scalp (scripts/backtest_ict_scalp.py), fvg_range, chop_scalp, pullback, squeeze, fade
    (scripts/backtest_*.py, all resolving venue-aware slippage and funding). Excluded until a cost-complete
    harness exists: scripts/backtest_orb.py (fee-only, points), src/backtest/backtester.py,
    scripts/backtest_xsec_momentum.py, scripts/backtest_vol_target.py (CLAUDE.md's four), and any
    session-open / funding-window / VWAP variant. K = the number of (family, symbol, timeframe) cells the
    orchestrator reports as runnable; K is printed before any cell is graded.
    STAGE A (screen) window 2021-01-01 to 2024-09-30: per cell, n_A, mean full-cost net R, one-sided
    t-test p_A. A cell SURVIVES if n_A >= 88 and mean > 0 and p_A < 0.05. S = number of survivors.
    STAGE B (confirm) window 2024-10-01 to the latest complete day, run ONCE with the identical
    parameters: per surviving cell, n_B, mean full-cost net R, one-sided p_B, folds positive of 4 equal
    time-folds, same-UTC-day share, trades per month, qualifying days per month (strict reading A of
    HyroTrader's +-1% test, as in hyro_passprob_mc.py / the feasibility memo).
  rule: >-
    NOT_APPLICABLE (producer_failed) IF the orchestrator cannot run at least half of the K cells.
    Otherwise a cell is CONFIRMED IF n_B >= 88 AND mean net R_B > 0 AND p_B < 0.05 / S AND folds positive
    >= 3 of 4. A confirmed cell is HYRO-FIT IF also same-UTC-day share >= 0.85 AND trades a month >= 10
    AND qualifying days a month >= 4. VERDICT: PASS IF at least one cell is CONFIRMED and HYRO-FIT.
    PARTIAL (a finding, not a pass) IF cells are CONFIRMED but none is HYRO-FIT. FAIL IF S >= 1 and no
    cell is CONFIRMED (the screen produced only candidates the late window rejects). NULL IF S = 0.
    INDETERMINATE for a cell with n_B < 88 (never FAIL). A PASS or PARTIAL cell is a candidate for
    hyro_fit_verdict.py on its own ledger (a separately registered unit), NOT a roster proposal.
    The grid, both windows, the thresholds and the survivor rule are not to be changed after seeing any
    Stage A output; a different grid is a different, separately registered unit.
  what_it_does_not_do: >-
    Does not tune any parameter, so it cannot find an edge by fitting one; it also therefore cannot
    find an edge that only exists after tuning. Does not test session-open, funding-window or VWAP ideas
    (no cost-complete harness). Does not touch config/strategies.yaml or accounts.yaml. Does not apply
    HyroTrader's demo-realism flag haircut (market fills assumed unflagged; the maker-entry unit
    RQ-20260930-502 is the answer to that).

routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 6.0
  est_minutes: 240
  basis: >-
    About 5 symbols x 2 timeframes x up to 6 families, two windows; the 2021-2026 5m frames are the
    heavy part (RQ-20260929-401's census ran three 15m legs on the trainer). Estimate is INFERRED.

blocked_on:
  - what: >-
      No orchestrator exists that runs a declared grid of harness cells, applies the Stage A screen and the
      Stage B Bonferroni confirmation, and writes verdict.json. The single-cell dispatcher
      (research-harness-dispatch.yml) runs one (harness, symbol, timeframe) per unit, and
      scripts/research/m20_fleet_exit_sweep.py sweeps exit levers, not entries. Needs
      scripts/research/short_tf_discovery_sweep.py that (1) enumerates the grid above and prints K before
      grading, (2) runs each cell through the harness's own CLI with --emit-trades, (3) computes the Stage A
      and Stage B statistics from the emitted per-trade net R, (4) writes verdict.json {verdict, read_state,
      population, K, S, cells[]} with every cell's n and p reported (survivors AND non-survivors), and a test
      on the committed fixture. About 1 to 1.5 lane-days (INFERRED).
    ref: PI-20260930-LJF2ZFXF-0001
    clears_when: >-
      the orchestrator is merged with its test, and RQ-20260930-501 has graded (so a PASS here can be
      compared against a known reference book).

run:
  workflow: null
  note: Deliberately null until the orchestrator exists; then research-script-run.yml with that script.

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

related:
  - RQ-20260930-501
  - RQ-20260930-502
  - RQ-20260930-503
  - docs/research/hyro-strategy-feasibility-2026-09-30.md
