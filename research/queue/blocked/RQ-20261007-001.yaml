  - 'PI-20261006-5FUGHVX8-0001 (TP-doctrine debt ranked by money at stake; BUILD B1 / B2)'
  - 'docs/ARCHITECTURE-CANONICAL.md § "TP doctrine" (clauses 2-3: the TP is a live prediction; a trail does not exempt a leg)'
  - 'docs/design/exit-mechanism-construction-PROCESS.md § E3.6 (points 1 and 4: extend has no implementation; revision conditioned on the thesis, never the path alone)'
