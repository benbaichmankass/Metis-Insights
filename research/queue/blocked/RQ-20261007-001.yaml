id: RQ-20261007-001
title: >-
  Active geometry, real money: does a thesis-conditioned TP EXTENSION (target placed
  at a calibrated finite R, pushed out while the Donchian/pullback thesis holds) beat
  bybit_2's trail-only exits on its four legs?
status: blocked
cadence: once
kind: experiment
theme: live_strategy
priority: 1

question: >-
  OPERATOR FRAMING 2026-10-06 ("active geometry", PI-20261006-APBY4NTV-0003): the whole
  bracket is managed state through the trade's life; observed, the SL moves and the TP
  never does. MEASURED 2026-10-07 from the live journal (diag journal?table=trades and
  journal?table=order_packages, pulled 2026-10-07 ~17:30Z; closed trades with
  timestamp >= 2026-09-01 and a matching package; SL amend = order_packages.sl differs
  from exit_plan.stop.price by > 0.05%, TP amend = the same test on order_packages.tp
  vs exit_plan.final.price): real_money 4 SL amends / 0 TP amends over 32 closes,
  mirror 16 / 0 over 52, paper 111 / 0 over 668; 0 TP amends over 748 closes with a
  readable entry-time target. The TP doctrine (docs/ARCHITECTURE-CANONICAL.md § "TP
  doctrine", clauses 2-3) requires a LIVE prediction that moves. On bybit_2's four
  legs -- trend_donchian_eth_4h (tp_r 50 sentinel, RQ-20261006-060 asks the finite
  entry-time question), trend_donchian_xrp_4h (3R), xrp_pullback_2h (3R),
  ada_pullback_2h (4R) -- does a target placed at a CALIBRATED finite R and EXTENDED by
  src/runtime/target_expectation.evaluate_extension (approach_frac, extend_r,
  max_extends) when the strategy's own thesis is intact clear the exit-refinement P2
  gate against the config-exact trail-only base, graded calibration-first?

why_this_matters: >-
  These are the only real-money routings whose exit path already forwards a TP amend
  (Bybit modify; check_tp_doctrine path_state=plumbed), so a passing cell is executable
  the day BUILD B1 (the `tp` verdict producer) deploys. INFERRED from the committed
  offline MFE artifact docs/research/mi307-offline-mfe-2026-09-18.json (uncapped
  harness book, scripts/research/mi307_offline_mfe.py, 2026-09-18): the DECLARED 3R on
  xrp_pullback_2h is reached by 24.6% of 268 trades and the venue clamp binds on 78.4%
  of them at 3R (cap_r p50 2.12); trend_donchian_xrp_4h 3R: reached 15.8% of 146,
  clamp binds 69.9%; ada_pullback_2h 4R: reached 24.1% of 253, clamp binds 71.1%. So
  "declared" on these legs mostly means "rests at the venue cap" -- the sentinel
  wearing a number -- and the predictive target the doctrine asks for is nearer
  (reach-rate 25-40% sits at 2.0-2.5R on all three) and must then EXTEND, or it gives
  up the trend tail that is the entire edge of a trail exit (E3.6 point 1: "extend the
  target has no implementation anywhere"). This unit is that missing comparison.

power:
  expected_n: 45
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    The lever touches only trades whose excursion reaches approach_frac x target. At a
    2.5R target and approach_frac 0.85 (~2.1R) the touched population per leg, from the
    mi307 uncapped reach-rates (2026-09-18): xrp_pullback_2h 268 x 0.317 = 85,
    ada_pullback_2h 253 x 0.360 = 91, trend_donchian_eth_4h 167 x 0.27 = 45,
    trend_donchian_xrp_4h 146 x 0.178 = 26. Declared as the MIN over the three legs
    that clear the floor; d=0.45 needs (1.96+0.8416)^2/0.45^2 = 38.76 -> 39, so
    trend_donchian_xrp_4h (26) grades unresolvable_at_current_n on this design and is
    reported, never failed.
  feasibility:
    source: none
    accrual_basis: >-
      Grounded on a committed artifact (mi307-offline-mfe-2026-09-18.json), not on a
      corpus key research_disposition.CORPORA knows, because the e35/m20 corpora hold
      cell aggregates with no MFE field (verified in scripts/research/m31_harness_mfe_dist.py's
      own docstring: zero `mfe` keys over 1,376 rows). Nothing accrues forward; the
      harness window is the whole history the free-lane feed serves.

decision_rule:
  id: RULE-RQ1007-001-TP-EXTEND-ON-THESIS
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: >-
    Per leg, per cell of {target_r in (the REACH_GRID value whose uncapped mi307
    reach-rate is nearest 0.25, and the leg's declared tp_r), approach_frac in
    (0.75, 0.85), extend_r in (0.5, 1.0), max_extends in (1, 3)}, thesis_intact
    computed by the harness from the strategy's OWN continuation test (donchian: the
    channel extreme that triggered entry has moved further in the trade direction
    since the approach bar; pullback: price still on the trend side of the HTF trend
    filter), with the extension decided by target_expectation.evaluate_extension
    IMPORTED, never re-implemented: (a) CALIBRATION FIRST -- the share of trades whose
    exit lands within +/-20% of their FINAL target (prediction matched), reported
    beside the same share for the base; (b) the exit-refinement P2 gate -- IS and OOS
    delta net_R and delta maxDD vs the config-exact trail-only base, Path A or Path B,
    MIN_OOS_TRADES 25, grant cap dN/N_b <= 1.0, then the yearly walk-forward; net of
    the full cost stack (fee + slippage + funding) by the harness's own venue-aware
    defaults.
  rule: >-
    PASS IF at least one cell clears (b) in BOTH IS and OOS with base_oos_trades >= 25
    AND its calibration share (a) is >= the base's -> a Tier-3 proposal to declare
    target_r + the extension params on that leg, in ONE PR covering bybit_2,
    bybit_portfolio and bybit_1 (tests/test_paper_portfolio_accounts.py forces roster
    and trade-shaping equality), gated on BUILD B1 being deployed first (a declared
    extension with no producer is a line nobody reads). honest_negative IF no cell
    clears (b): the thesis-conditioned extension does not recover what a finite target
    gives up on this leg, and the doctrine's answer for it stays the entry-time finite
    target from RQ-20261006-060 / the e35 grid, recorded on PI-20261006-5FUGHVX8-0001.
    insufficient_base IF base_oos_trades < 25 (never a fail). A cell that passes (b)
    but LOWERS the calibration share is reported as "P&L without prediction" and does
    not pass -- the doctrine grades calibration before P&L (E3.6's falsifier).
  what_it_does_not_do: >-
    Touches no config and ships nothing. Does not grade the mirror or bybit_1 copies
    separately (roster equality). Does not decide the entry-time target for the
    sentinel leg (RQ-20261006-060 does). Does not substitute for BUILD B1 (the
    producer) or B2 (the prop TP path): a passing cell here is the evidence those
    builds then carry, not a reason to skip them.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 90
  basis: >-
    Runner, once the lever exists: m20-exit-lever-sweep.yml already shards one leg per
    job and fetches candles on the free lane; 16 cells x 4 legs at the measured ~6 min
    per 199-cell e35 leg is well under the ceiling. Estimate, not a measurement.

blocked_on:
  - what: >-
      No harness implements a target extension. scripts/backtest_trend.py and
      scripts/backtest_pullback.py expose --tp-r (fixed at entry), --tp-cap-pct and
      --timeout-bars only (argparse read 2026-10-07); scripts/research/m20_fleet_exit_sweep.py's
      lever columns are stale_stop / giveback_stop / trail_geometry / trail_decay /
      vol_trail, and docs/research/exit-refinement-coverage.json has no revision
      column. E3.6 point 1 (docs/design/exit-mechanism-construction-PROCESS.md): "extend
      the target has no implementation anywhere in the harness or the live monitor".
    ref: PI-20261006-5FUGHVX8-0001 (BUILD B1, harness half) -- proposed checklist row GEOM-B1-HARNESS in the ACTIVE-GEOMETRY-PLAN lane report, 2026-10-07
    clears_when: >-
      `python3 scripts/backtest_trend.py --help` and `python3 scripts/backtest_pullback.py --help`
      list --tp-target-r / --tp-extend-r / --tp-approach-frac / --tp-max-extends /
      --tp-thesis, the extension is decided by src.runtime.target_expectation.evaluate_extension
      (imported), the emitted trades carry final_target_r and n_extends, AND
      .github/workflows/m20-exit-lever-sweep.yml accepts `tp_extend` in its `levers`
      input with a `tp_extend` column added to docs/research/exit-refinement-coverage.json.
      Then: move this file to research/queue/, set status queued, set
      run.workflow: m20-exit-lever-sweep.yml with inputs {legs: "trend_donchian_eth_4h,trend_donchian_xrp_4h,xrp_pullback_2h,ada_pullback_2h",
      levers: tp_extend, tp_cap_pct: '0.099', split_mode: oos-trades, research_unit: RQ-20261007-001}.

run:
  workflow: null
  note: >-
    Null until the harness lever lands (blocked_on). The intended dispatch is written in
    clears_when so the unblocking PR needs no re-derivation.

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

