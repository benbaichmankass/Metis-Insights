  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: null
  basis: 'est_minutes null rather than guessed: 36 monthly 5m zips x 2 markets through fetch_binance_vision.py has not been
    timed on a runner.'
run:
  workflow: null
  note: 'Deliberately null: no workflow builds a basis series or writes a verdict for one. Fill in when the blocker clears.'
lands:
