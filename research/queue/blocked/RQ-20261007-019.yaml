id: RQ-20261007-019
title: Stage-0 perp-vs-spot basis on BTCUSDT (basis z-score mean reversion / cash-and-carry) -- blocked until a basis verdict
  instrument exists
status: blocked
cadence: once
theme: new_strategy_prop
priority: 3
kind: experiment
question: 'Over >= 1095 d of 1h bars, how often does the BTCUSDT perpetual-vs-spot basis (log perp close - log spot close,
  both from Binance Vision: --market futures/um and --market spot) leave a +/-2 sigma band of its 20-bar rolling mean, and
  does a long-spot/short-perp (or the reverse) z-score reverter on it -- funding accrued on the PERP leg only, fee 7.5 bps
  rt and slippage 3 (perp) / 5 (spot) bps rt per leg -- produce positive net R? Does the funding RECEIVED on a short perp
  against spot pay more than the two-leg cost stack over a 1-3 day hold? Registered by lane ARB-RESEARCH session_01Aeyqvqf9sajCVDx9Ufef4u
  (PI-20261006-APBY4NTV-0005); family table: docs/research/relative-value-families-2026-10-07.md.'
why_this_matters: 'Operator 2026-10-06: arbitraging symbols and spreads. Perp-vs-spot basis is the canonical crypto arbitrage
  and the data is fetchable from runners today (spot and USD-M perp klines both answer 200 on data.binance.vision, probed
  2026-10-07), but NO instrument emits a basis verdict: scripts/backtest_pairs.py run on the two series approximates the spread
  trade but writes no verdict.json for research-script-run.yml, and research-harness-dispatch.yml''s pairs arm fetches both
  legs through fetch_backtest_corpus.py, whose table holds one series per (symbol, timeframe) and cannot name a spot BTCUSDT
  beside the perp. Execution would also need a spot leg: no account carries market_type spot (dormant since the 2026-05-10
  cutover) and the pairs executor is one category per account.'
power:
  expected_n: 150
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: d=0.3 at alpha 0.05 / power 0.8 needs ~88 trades. expected_n=150 over 1095 d of 1h bars at a 2-sigma entry on a 20-bar
    z-score is a shape argument from the M22 1h pairs (~700 trades per pair over ~3 years at lookback 15), haircut heavily
    because the basis is far less volatile than a cross-asset spread and spends most bars inside the band; a measurement,
    not this number, decides.
  feasibility:
    source: none
    accrual_basis: No basis series has ever been built in this repo. The first deliverable is the series and its band-exit
      count; below 88 trades the verdict is indeterminate.
decision_rule:
  id: RULE-RQ1007-019-PERP-SPOT-BASIS-NET
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: 'net_total_r and total_trades of the basis reverter with the per-leg stack above (funding on the perp leg signed
    by side, from the fundingRate archive once PI-20261007-X9UFEF4U-0001 lands; a directionless 1 bp/8h drag is NOT admissible
    for a trade whose edge IS the funding sign). Also REPORTED: band-exit count per year, median basis in bps, median hold
    hours.'
  rule: PASS IF net_total_r > 0 AND n_trades >= 88; FAIL IF net_total_r <= 0 with n_trades >= 88; indeterminate IF n_trades
    < 88. A PASS routes to an order-path build row (spot leg + cross-category pair placement), never to a placement; the stated
    expectation is that the two-leg stack exceeds the typical 1h basis and the question closes as FAIL cheaply -- registering
    that expectation here is what stops it being written after the result.
  what_it_does_not_do: 'No config or roster change. Does not cover calendar (dated-future) basis: our only dated futures are
    MES/MGC/MHG on IB, fetched as a front-month continuous proxy whose roll gaps make a calendar spread unmeasurable from
    the committed corpus. Not a prop question (no spot on any prop venue).'
blocked_on:
- kind: work_item
  ref: PI-20261007-X9UFEF4U-0001
  what: NO BASIS INSTRUMENT. Two fetchable series (Binance spot and USD-M perp klines) but nothing joins them into a basis
    series with a verdict.json, and the pairs dispatch arm cannot name a spot leg for a symbol the corpus table knows only
    as a perp. Signed per-leg funding also needs the fundingRate fetcher (same pipeline row).
  clears_when: A research-script-run.yml command list (or a harness-dispatch arm) fetches both series, builds the basis, runs
    the reverter with per-leg costs and signed perp funding, and writes verdict.json in the scripts/research/script_run.py
    contract. Then git mv to research/queue/ and fill run.*.
routing:
