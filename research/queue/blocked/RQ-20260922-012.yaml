id: RQ-20260922-012
title: Does a leg's OOS edge decay with time — and is the MOST RECENT fold, not the fold count, the statistic
  Stage 0 should read?
status: blocked
cadence: once
kind: deterministic
question: 'Across every leg in the R7 corpus with a complete `fold_detail`, does the sign and magnitude
  of `net_r` depend on fold ORDER? Specifically: (a) how many legs have their most recent fold negative
  while pooling positive, (b) what share of each leg''s pooled net_r_oos comes from its OLDEST fold, and
  (c) over the population, does a most-recent-fold-non-negative clause change which legs pass RULE-D1
  — and by how much?'
why_this_matters: "MEASURED 2026-09-22 on the four legs the R8 promotion considered, from the committed\
  \ `fold_detail` in comms/strategy_evidence/*.json (window_days 365, 4 folds each):\n\n  ada_pullback_2h\
  \        +8.87 -> +2.72 -> +6.84 -> +3.51   pooled +21.93\n  avax_pullback_2h      +15.39 -> +1.10 ->\
  \ +0.54 -> -4.36   pooled +12.67\n  fade_breakout_4h       +3.75 -> +3.17 -> +4.24 -> -5.05   pooled\
  \  +6.11\n  htf_pullback_trend_2h  +4.09 -> +0.58 -> +0.88 -> -2.75   pooled  +2.80\n\nALL THREE legs\
  \ that scored \"3 of 4 folds positive\" have the SAME shape, and in every one of them the negative fold\
  \ is the MOST RECENT. Excluding the oldest fold, avax_pullback_2h is -2.72R and htf_pullback_trend_2h\
  \ is -1.29R over the last nine months, while both pass RULE-D1 on the pooled sum.\n⚠️ THIS UNIT EXISTS\
  \ BECAUSE THE COUNT NEARLY ROUTED REAL MONEY. The manager selected R8's candidates on \"3/4 or 4/4 folds\
  \ positive\", staged avax_pullback_2h onto bybit_2, and only then read which fold was negative. The\
  \ operator withdrew it. A fold COUNT is order-blind by construction and the manager did not notice until\
  \ the promotion was written.\n⚠️ AND IT IS NOT A RESTATEMENT OF RQ-20260922-002. That unit asks whether\
  \ dropping the LARGEST fold flips the sign — a concentration question, blind to which fold is largest.\
  \ This one asks whether the DECAY is monotone in time. The two can disagree: a leg can be fold-concentrated\
  \ in its most recent fold (improving) or in its oldest (decaying), and only the second is a reason not\
  \ to promote. Run them together and report both."
why_not_inferential: 'A re-reduction over a fixed, committed `fold_detail` array — no sample is drawn,
  no effect estimated, same inputs give the same answer every time. A power declaration would be theatre.
  The honesty condition is that the fold set is complete and time-ordered; it is: every measured record
  carries `folds`, an equal-length `fold_detail`, and per-fold `start`/`end`. ⚠️ ONE REAL LIMIT, STATED:
  4 folds is a very short series. This unit can report a sign pattern; it CANNOT establish a trend at
  conventional power, and any deliverable that claims one is overreaching.'
decision_rule:
  id: RULE-RQ0922-012-FOLD-RECENCY
  registered_at: '2026-09-22'
  registered_before_run: true
  statistic: "Per leg, over `fold_detail` sorted by `start` ascending:\n  last_fold_net_r   = fold_detail[-1].net_r\n\
    \  drop_oldest       = net_r_oos - fold_detail[0].net_r\n  oldest_share      = fold_detail[0].net_r\
    \ / net_r_oos   (reported only\n                      when net_r_oos > 0, else null — a share of a\n\
    \                      non-positive denominator is not a share)\nPopulation: every record with coverage_state\
    \ == \"measured\" and a `fold_detail` of length == `folds`. Re-derive it at run time from the committed\
    \ corpus; do NOT carry a typed list, because the corpus grows."
  rule: "PER LEG, annotation only: `recency_negative: true` when last_fold_net_r < 0 while net_r_oos >\
    \ 0. This is REPORTING. It demotes nothing and promotes nothing. ACROSS THE POPULATION, and this is\
    \ the decision the unit exists for:\n  - if >= 40% of the measured, RULE-D1-passing legs are\n   \
    \ `recency_negative`, the finding is that a pooled Stage-0 sum\n    systematically admits decaying\
    \ legs, and the deliverable is ONE\n    amendment proposal to the operator — add a most-recent-fold\
    \ clause to\n    RULE-D1 — with the exact passing-set delta it would cause, stated as\n    a named\
    \ list of legs that would stop passing.\n  - if <= 15%, RULE-D1 stands as written on this axis and\
    \ the unit closes\n    `no_action_warranted`, with the counts stated.\n  - between 15% and 40%, the\
    \ result is reported INDETERMINATE and the unit\n    closes `no_action_warranted` with the counts\
    \ stated. A threshold that\n    can only say \"yes\" is not a decision rule; this one can say no,\
    \ and\n    can say it did not resolve."
  what_it_does_not_do: 'It does not amend RULE-D1, does not change any config, and cuts no leg. Amending
    a registered decision rule is the operator''s call and this unit produces the proposal. It also does
    NOT re-run any backtest: if the answer requires a fresh harness run, that is a different unit.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 2
  basis: Runner. Inputs are the 52 committed JSON records in comms/strategy_evidence/ (under 2 MB total).
    No candles, no harness, no VM. est_minutes is the checkout, not the arithmetic.
run:
  workflow: null
  note: 'Null on purpose, and the unit is BLOCKED rather than queued because of it: `run.workflow: null`
    means undispatchable, and the queue schema enforces that. Declaring an existing sweep workflow here
    would be false — none of them read comms/strategy_evidence/. It rides whatever unblocks RQ-20260922-002;
    they read the same files in the same pass and should be run together.'
lands:
  store: comms/strategy_evidence/<leg>.json
  assert_field: recency_negative
  min_rows: 42
  note: min_rows 42 — the count of records with coverage_state "measured" in the R7 corpus, not 52. The
    other 10 are `no_harness` or `harness_failed` and have no fold_detail to reduce; a result covering
    them would be fabricated.
