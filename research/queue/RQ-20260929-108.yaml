id: RQ-20260929-108
title: 'Stage-0 backtest: orb harness on ETHUSDT 5m (harness with zero live-roster or queue history; fee-only cost stack)'
status: queued
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment

question: >-
  scripts/backtest_orb.py (opening-range-breakout) is one of the ten E7
  harnesses research-harness-dispatch.yml can dispatch. No live strategy leg
  names it and no research/queue/ or research/results/ unit has ever
  dispatched `harness: orb` (checked this session, zero hits). Does an
  opening-range-breakout entry show edge on ETHUSDT 5m?

why_this_matters: >-
  ORB is a session-open-anchored entry, structurally different from every
  donchian/pullback/squeeze/fade leg currently live (none of which anchor to
  a session open). ETHUSDT rather than BTCUSDT is chosen deliberately as the
  second symbol in this session's batch (RQ-20260929-107 already covers
  BTCUSDT for chop_scalp) so this batch samples two different symbols across
  its two zero-history-harness units rather than defaulting to BTC twice.

  ⚠️ CLAUDE.md (root, "The real-money promotion mandate's D1 block") names
  scripts/backtest_orb.py as one of four harness families that computes fee
  ONLY, in points, with no slippage or funding term -- disconnected from
  execution_costs.resolve_cost_policy. This unit's result is therefore Stage-0
  EXPLORATORY ONLY and explicitly NOT eligible for any promotion corpus
  until that harness gap is fixed (see what_it_does_not_do). It is queued
  anyway because "does the entry idea show ANY edge, even on an incomplete
  cost model" is a legitimate cheap first look, and a PASS here would be the
  evidence that justifies spending effort fixing the harness's cost stack --
  a FAIL makes that fix low-priority.

power:
  expected_n: 60
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.45 -> 39 trades at alpha 0.05/power 0.8, this repo's standing E35
    floor. expected_n=60 is a round-number guess reflecting that a 5m ORB
    setup trades roughly once per session -- not a measurement, since no
    history exists (see feasibility).
  feasibility:
    source: none
    accrual_basis: >-
      The orb harness has NEVER been dispatched in this repo against any
      symbol (research/queue/, research/results/, config/strategies.yaml all
      checked this session, zero references). This run is the family's
      first observation.

decision_rule:
  id: RULE-RQ0929-108-ETHUSDT-ORB-STAGE0
  registered_at: '2026-09-29'
  registered_before_run: true
  statistic: >-
    net_total_r (FEE-ONLY per this harness's known gap, in points -- NOT the
    full venue cost stack) and n_trades from the orb harness's own JSON
    summary, harness-default parameters.
  rule: >-
    PASS IF net_total_r > 0 AND n_trades >= 39 -- an exploratory signal ONLY,
    read as "worth fixing the harness's cost stack and re-running", never as
    promotion-corpus evidence (see what_it_does_not_do). FAIL IF net_total_r
    <= 0 with n_trades >= 39 -- re-queues for a confirmatory run rather than
    being killed on one pass; a second FAIL deprioritizes fixing this
    harness's cost-stack gap rather than closing the strategy idea outright
    (the cost gap alone could be masking a real edge, so a fee-only FAIL is
    weaker evidence than an ordinary FAIL). indeterminate IF n_trades < 39.
  what_it_does_not_do: >-
    Does NOT produce promotion-corpus-eligible evidence (D1, CLAUDE.md) --
    scripts/backtest_orb.py's fee-only cost model is explicitly excluded
    from any promotion corpus until fixed. Does not touch
    config/strategies.yaml. Does not propose a new live leg under any
    verdict.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 2.0
  est_minutes: 15
  basis: Single-symbol GitHub-runner harness dispatch, same shape as every other research-harness-dispatch.yml unit.

run:
  workflow: research-harness-dispatch.yml
  inputs:
    harness: orb
    symbol: ETHUSDT
    timeframe: "5m"
    research_unit: RQ-20260929-108

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

related:
  - RQ-20260929-107 (the chop_scalp harness's own equivalent first-dispatch question)
  - 'CLAUDE.md § "The real-money promotion mandate''s D1 block" -- the four harness families (incl. backtest_orb.py) out of promotion-corpus scope'
last_dispatched_at: '2026-10-04T14:55:57+00:00'
