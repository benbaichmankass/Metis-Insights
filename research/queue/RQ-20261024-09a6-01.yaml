  what: first_passage.py has no --paths input (argparse takes --ledgers only; grep 2026-10-24). The as-traded label (exit_r - open_r_t
    vs exit cost), the room-to-stop/target reference and the momentum/ADX-slope feature set are part of that build's spec as amended
    2026-10-24 (lane ATM-AI-MERGE).
