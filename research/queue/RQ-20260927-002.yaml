id: RQ-20260927-002
title: exit-head-donchian-1h-v1 recovered_R, multi-fold embargoed walk-forward
status: done
cadence: once
kind: experiment

question: >-
  RQ-20260927-001 measured recovered_R_oos = +1.3127 over n=119 genuinely
  out-of-sample trades at ONE embargoed split (2025-01-06T16:00:00Z) and
  explicitly flagged its own caveat: "Single walk-forward split (one
  train/test boundary), not multiple folds -- the pre-registered rule is a
  sign test at one split, not a robustness-across-splits claim." Does the
  head still recover positive R across SEVERAL independent, sequential,
  embargoed splits, or was the one split RQ-20260927-001 used idiosyncratic?

why_this_matters: >-
  Operator decision 2026-09-27 (docs/claude/work/MANAGER-CHECKLIST.json row
  R4, "OPERATOR DECISIONS 2026-09-27" wave 6, lane M2): "exit-head multi-split
  walk-forward" is explicitly asked for, distinct from and in addition to
  RQ-20260927-001's single split. A single split cannot distinguish "the head
  has a real, generalizable edge" from "this particular 7-day-embargoed
  boundary happened to land favourably" -- the same distinction RQ-20260927-001
  itself drew against RQ-20260922-007's uncontrolled full-window figure.
  PI-20260926-96NDZSOD-0001 (twin-dedup mirror divergence) remains an
  INDEPENDENT precondition for any re-promotion regardless of this unit's
  verdict; this unit does not touch it.

power:
  expected_n: 264
  min_detectable_effect: 0.35
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Identical derivation to RQ-20260927-001 and RQ-20260922-007 (paired
    per-trade design: head-on vs head-off score the same decision bars, so the
    unit is the per-trade difference): (1.96+0.8416)^2 / 0.35^2 = 64.07 per
    fold, ceil'd to 64. RQ-20260927-001 measured the full baseline population
    at n_total_baseline_trades=352 (research/results/RQ-20260927-001/
    36298075573.jsonl). This unit's own driver
    (scripts/research/exit_head_walkforward_multifold.py::_fold_boundaries)
    partitions that same population into num_folds+1 equal blocks (mirroring
    train_exit_head.fold_blocks()'s "start at block_n, step by block_n"
    convention): at num_folds=3, block_n = 352 // 4 = 88, giving 3 test folds
    of 88 trades each (264 total OOS trades) plus one 88-trade block held out
    as a pure training seed with no trailing remainder. Every one of the 3
    folds clears 64.07 individually (88 > 64.07), not merely in aggregate.
    ⚠️ expected_n=264 is INFERRED from RQ-20260927-001's already-measured
    n_total_baseline_trades=352, not independently re-measured before
    registration -- the population is fixed by history (BTCUSDT bar count
    since ~2021-09-23) and will not have grown materially at run time, but the
    run's own output states the REAL n per fold rather than assuming this
    figure holds.
  feasibility:
    source: none
    accrual_basis: >-
      Same reasoning as RQ-20260927-001's own feasibility.accrual_basis: n is
      fixed by history (BTCUSDT trend_donchian trade count over the
      backtest_trend.py-resolved candle span), not accruing -- a one-shot
      historical replay, not a live soak. Declared source: none for the same
      reason RQ-20260922-007 and RQ-20260927-001 did (not one of
      research_disposition.CORPORA's three registered corpora).

decision_rule:
  id: RULE-RQ0927-002-EXIT-HEAD-OOS-MULTIFOLD
  registered_at: '2026-09-27'
  registered_before_run: true
  statistic: >-
    Per fold k (k=1..3): recovered_R_oos_k = sum(replayed_r_i) -
    sum(baseline_r_i) over trend_donchian BTCUSDT 1h trades in fold k's test
    block (scripts/backtest_trend.py trades, sorted by entry_time, blocked
    sequentially at block_n=88 per _fold_boundaries -- see power.basis).
    replayed_r_i comes from a WALK-FORWARD-RETRAINED exit head fit PER FOLD:
    scripts/ml/train_exit_head.py train_model() (unchanged recipe: LightGBM,
    target=holding_pays, features=base) fit ONLY on
    datasets-out/exit_head/1h/donchian/rows.jsonl rows with bar_t <= (fold
    k's test-block start minus a 7-day embargo -- the same embargo width
    RQ-20260927-001 and this model family's original training used), scored
    with the unchanged below_half_r @ tau=0.10 policy (shape {"policy":
    "below_half_r", "tau": 0.10, "below_r": 0.5}) via the imported, unmodified
    src.runtime.exit_head_shadow.would_exit_for / _feature_row and
    scripts/ml/exit_head_replay.py replay_trade -- byte-identical call
    convention to RQ-20260927-001, just re-run at 3 different (fold-specific)
    train cutoffs instead of 1. Net-of-full-cost BY CONSTRUCTION (identical
    per-trade fee_r on both arms), same convention as RQ-20260927-001.
    Aggregate statistics: pooled_recovered_R_oos = sum_k(recovered_R_oos_k)
    over every fold that clears its own n>=64 floor; mean_recovered_R_per_trade
    = pooled_recovered_R_oos / sum_k(n_oos_k); folds_positive = count of folds
    with recovered_R_oos_k > 0. Each retrained booster is a SCRATCH artifact
    (in-process only), never written to runtime_logs/trainer_mirror/exit_head/
    and never served live -- identical scratch-artifact discipline to
    RQ-20260927-001.
  rule: >-
    IF at least 2 of the 3 folds individually clear n_oos_k >= 64 (this unit's
    own power floor) AND, among those establishable folds, pooled
    mean_recovered_R_per_trade > 0 AND at least 2 of those establishable folds
    individually show recovered_R_oos_k > 0 (K=2 of N=3, majority-positive):
    PASS. attributable_to omitted_exit_head, and -- UNLIKE RQ-20260927-001 --
    this is a robustness-across-splits claim, not a single-split sign test.
    Usable as promotion-supporting evidence for exit-head-donchian-1h-v1's
    shadow->advisory decision, subject to every caveat already on record
    (drift ks/psi at demote time; the twin-dedup bug
    PI-20260926-96NDZSOD-0001, which must land first regardless of this
    unit's verdict).
    IF pooled mean_recovered_R_per_trade <= 0, OR fewer than 2 of the
    establishable folds are individually positive: FAIL.
    attributable_to strategy -- the head does not generalize across splits;
    RQ-20260927-001's single-split PASS should be read as one favourable draw,
    not decisive evidence, and exit-head-donchian-1h-v1 should NOT be
    promoted on this evidence.
    IF fewer than 2 of the 3 folds clear n_oos_k >= 64 at run time (a
    mechanical failure shrank the population, e.g. the candle fetch returns
    fewer bars than measured here): record read_state producer_failed /
    attributable_to unestablishable -- never silently lower the floor or drop
    to a smaller num_folds to manufacture a verdict.
  what_it_does_not_do: >-
    Changes no live exit-head artifact, threshold, gate, or config. Writes no
    file under runtime_logs/trainer_mirror/. Exit logic stays Tier-3
    (exit-refinement); this unit measures, it does not ship, and a PASS here
    does not itself promote anything -- PI-20260926-96NDZSOD-0001 (twin-dedup)
    is an independent precondition for any re-promotion regardless of this
    unit's verdict. Does not supersede or re-run RQ-20260927-001's own
    single-split result, which stands as its own (weaker) data point; this
    unit's pooled/multi-fold figure is the one to cite going forward for "does
    this generalize", per the operator's wave-6 ask for a multi-split
    walk-forward specifically.

routing:
  needs_trainer_resident_data: true
  needs_gpu: false
  peak_memory_gb: 2.5
  est_minutes: 60
  basis: >-
    Trainer (158.178.209.121), identical routing reason to RQ-20260927-001
    and RQ-20260922-007: datasets-out/exit_head/1h/donchian/rows.jsonl is not
    committed and lives only on the trainer. Three sequential LightGBM
    retrains (each on a subset of the same dataset RQ-20260927-001 already
    retrained once) is roughly 3x that unit's est_minutes=30, so 60-90 is a
    safe ceiling on the same 1-OCPU box.

cleared_blocker: >-
  Fold-boundary and floor-check logic (scripts/research/
  exit_head_walkforward_multifold.py::_fold_boundaries) was smoke-tested
  locally against the repo's committed 5,001-row/3.5-day BTC fixture
  (data/backtest_candles.csv) and a synthetic rows.jsonl before this rule was
  registered, to catch mechanical bugs (path handling, harness wiring,
  LightGBM training path, replay_trade scoring) BEFORE spending a real
  trainer dispatch -- confirmed the driver runs end-to-end (resolve candles ->
  run_backtest -> fold partition -> train_model -> replay_trade -> pooled
  aggregate) without error. That smoke test used fixture/synthetic data and
  asserts nothing about the real population or verdict; no run against this
  rule's statistic (real datasets-out/exit_head/1h/donchian/rows.jsonl +
  real BTCUSDT candle history) has been executed as of registration.

run:
  workflow: 'trainer-vm-diag (issue label trainer-vm-diag-request)'
  inputs:
    strategy: trend_donchian
    symbol: BTCUSDT
    timeframe: 1h
    num_folds: 3
    embargo_days: 7
    research_unit: RQ-20260927-002
  note: >-
    Dispatched by running the COMMITTED driver
    scripts/research/exit_head_walkforward_multifold.py on the trainer via a
    trainer-vm-diag issue (cmd: python3 scripts/research/
    exit_head_walkforward_multifold.py --strategy trend_donchian --symbol
    BTCUSDT --timeframe 1h --num-folds 3 --json <path>). Unlike
    RQ-20260927-001's one-off base64-embedded payload (never committed, so
    its exact driver text is unrecoverable beyond the issue comment), this
    unit's driver is a versioned repo file specifically so the run is
    reproducible and re-runnable without reconstructing it from a comment --
    an audit of that precedent under Generation Discipline Rule 2, fixed here
    rather than replicated.

lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
  note: >-
    Same contract as every other unit (scripts/ci/check_research_results.py):
    research/results/RQ-20260927-002/<run_id_or_manual-tag>.jsonl, built via
    scripts/research/research_result.py.

related:
  - RQ-20260927-001 (the single-split unit this one extends to multiple folds)
  - RQ-20260922-007 (the original, uncontrolled full-window attribution)
