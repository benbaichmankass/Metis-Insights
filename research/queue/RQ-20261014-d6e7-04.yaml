id: RQ-20261014-d6e7-04
title: >-
  In-trade exit line, rung 4: do momentum / ADX-slope / range / regime features in the in-trade state predict SL-before-TP beyond
  the distance-only reference -- the operator's 'momentum suddenly turns'?
status: queued
cadence: once
theme: ml_health
priority: 1
kind: experiment
requires_result:
  unit: RQ-20261014-d6e7-01
  verdict: pass
question: >-
  Same label, folds and reference as RQ-20261014-d6e7-02 (K = 2 R, Fixed-bracket reconstruction: each trade in the newest committed
  ledger per USDT leg is re-walked bar by bar over public Binance Vision candles from its entry bar, with the ledger's INITIAL
  stop at -1 R and a fixed TP at K R; SL before TP on a shared bar; timeout at H = max(10, p90 of the leg's realised holds); a
  leg enters only if >= 80% of its controllable trades re-walk to the ledger's own mfe_r within 0.05 R (n >= 10). Costs: every
  arm pays the trade's ledger cost_total_r (fee + slippage + funding via execution_costs.resolve_cost_policy()); an early exit
  pays cost_slippage_r once more.), with the rich state: the simple state plus 3- and 6-bar momentum in ATR, ADX14 and its 3-bar
  slope, the 3-bar range over ATR, close location in the bar, and the 100-bar ATR percentile (a volatility-regime proxy). Does
  it beat the calibrated distance-only reference on trade-weighted OOS log-loss?
why_this_matters: >-
  The operator: 'even if the TP is close, if the momentum suddenly turns ... what are the chances'. This is that question with
  the momentum features the candles carry today. It runs on the census PASS independently of rung 2, so a null simple state does
  not stop the momentum test. It is graded against the distance-only reference (not against the simple state) so the two rungs
  answer separately; the record reports both models' gains for the comparison.
power:
  expected_n: 1500
  min_detectable_effect: 0.1
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Unit = OOS test trade (its bar events share one weight). ~3,000 trades after the control, timeouts excluded from the label,
    4 of 5 time blocks tested -> ~1,500-2,000 OOS trades (estimate). A 0.1 sd per-trade log-loss gain needs ~785; the 300 floor
    in the rule is a floor.
  feasibility:
    source: none
    accrual_basis: >-
      Committed ledgers + public candles; nothing accrues. n is set by the corpus the census RQ-20261014-d6e7-01 re-walks: 3,926
      trades passed the MFE control in the lane authoring read of 2026-10-14; the OOS non-timeout share of those is the unit.
decision_rule:
  id: RULE-RQ20261014-D6E7-04-RICH-STATE-VS-DISTANCE
  registered_at: '2026-10-14'
  registered_before_run: true
  statistic: >-
    Per OOS trade: mean over its bar events of logloss(reference) - logloss(model), trade-weighted; pooled mean with a 1,000-draw
    trade bootstrap 95% CI; sign per fold (4 expanding, purged time folds); calibration slope of the label on the model's OOS logit.
    Reported: gain vs the train base rate, per-fold gains. Model: L2 logistic (numpy IRLS), features `rich`; reference: `dist`
    fitted on the same train folds.
  rule: >-
    PASS IF pooled gain >= 0.002 nats AND bootstrap CI lower bound > 0 AND gain > 0 in >= 3 of 4 folds AND calibration slope in
    [0.7, 1.3] -> the state carries information about SL-before-TP beyond where the trade is; a PASS releases RQ-20261014-d6e7-05
    (the policy on the rich state). FAIL IF the CI upper bound < 0.002 nats: this feature set adds nothing beyond the reference
    on this corpus -- close it, say so on IN-TRADE-EXIT-MODEL. INDETERMINATE otherwise or under n.
  min_n: 300 OOS trades with a first passage (timeouts excluded)
  what_it_does_not_do: >-
    Ships no exit rule. Flow (funding, OI, taker imbalance) is not in the state: the ledgers carry no flow and the public candles
    carry only volume -- a flow rung waits on Programme 02 Q5 information classes. Not the M23 entry meta-label.
compute: cpu_light
value:
  bucket: ai_trader
  usd_at_stake_per_month: 400
  confidence: 0.25
  basis: 'stand-in: the probability model behind the operator''s exit-now mechanism; not a P&L measurement.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 3.0
  est_minutes: 90
  basis: >-
    MEASURED 2026-10-14 in the lane sandbox -- with per-leg fetches the census's candle fetch did not finish inside 30 min (since
    fixed to one fetch per symbol x timeframe); budget 90 min, timeout 240 (runner cap 360). Same candle fetch as d6e7-01 (fresh
    runner, no shared cache); a few hundred thousand bar events through a numpy logistic, seconds per fold.
run:
  command:
  - python3
  - scripts/research/first_passage.py
  - --mode
  - baseline
  - --features
  - rich
  - --ref
  - dist
  - --policy-tp-r
  - '2.0'
  - --min-gain-nats
  - '0.002'
  - --min-folds
  - '3'
  - --min-n
  - '300'
  - --cache-dir
  - '{out_dir}/candles'
  - --out
  - '{out_dir}'
  timeout_minutes: 240
  inputs:
    research_unit: RQ-20261014-d6e7-04
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
