id: RQ-20261006-002
title: 'VELOTRADE-FIT: which roster and risk_pct can pass Velotrade CLASSIC 1-Step $5k (velotrade_1), with the 5-qualifying-day
  rule measured (lane VELOTRADE-FIT)'
status: queued
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 1
question: 'GO-LIVE GATE = the risk requirements (operator 2026-10-06 06:40Z). Over the admitted ETH/SOL prop legs (trend_donchian_eth_prop, trend_donchian_sol_prop; one leg per symbol, so
  ETH, SOL, ETH+SOL) and a flat-risk sweep of 0.5% / 1.0% / 1.5% of balance, which (book, risk) cell can pass the
  velotrade_classic_1step.yaml evaluation (+10% target AND 5 qualifying days at >= +0.8% of the initial balance realised,
  00:30-00:30 UTC) and survive the 4% daily / 7% static limits, under VELOTRADE''s own cost stack? Is the 5-qualifying-day
  rule binding for these low-frequency trend legs? Re-asks RQ-20261005-903 (which graded ETH+SOL 0.5% INACTIVITY_SAFE_IMPROVEMENT
  under the Breakout cost defaults, at 0.5%/0.75% only, and reported no qualifying-day measurement) because velotrade_1
  is to go live ASAP (operator, 2026-10-06) and the roster is empty.'
why_this_matters: 'velotrade_1 is a bought $54 evaluation (operator "Buy one ($54)", 2026-10-04) with an empty Tier-3 roster.
  The manager needs a roster + risk_pct proposal graded against a rule registered before the run, or "none passes" with
  the binding constraint named. The qualifying-day rule has never been measured on its own: prop_ev_sim applies it inside
  P(pass) and RQ-20261005-903 said so.'
power:
  expected_n: 487
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: Committed 730d records (ETH n=355, SOL n=132, from RQ-20261005-901/903). Cell verdicts are over 5 seeds x 2000
    lives + 50x100 evidence bootstrap of prop_ev_sim path mode (half the 903 size, chosen for wall-clock on a 4-core session;
    MC SE on EV is reported per cell). No new trades are generated.
  feasibility:
    source: none
    accrual_basis: Re-grading of committed 730d trade records.
decision_rule:
  id: RULE-RQ1006-VELOTRADE-FIT
  registered_at: '2026-10-06'
  registered_before_run: true
  statistic: 'Per cell (book B in {ETH, SOL, ETH+SOL}, flat risk r in {0.005, 0.010, 0.015} of balance): (G) book_max_gap
    = largest gap in days between consecutive trade ENTRIES of the union ledger, plus window edges, over the 730d window;
    (D) worst single 00:30-UTC day of summed realised net-R x r x $5000 over the union ledger, and the count of days at
    <= -80% of the $200 daily-loss limit; (S) prop_ev_sim path-mode ev_net_usd_per_life and p_net_positive on each of seeds
    1-5 under velotrade_classic_1step.yaml with --no-hedge, --lev-cap ETH 5 / SOL 5, funded-start fresh, sizing balance,
    and the VELOTRADE stack --commission-bps-rt 6 --slippage-bps-rt 3 --swap-daily 0.0005 --swap-model dxtrade (903 used
    the Breakout defaults 8 bps / 0.033% prorated); (Q) p_pass_eval on each seed, with the qualifying-day gate ON (the
    ruleset declares qualifying_day_profit_pct 0.008, min_trading_days 5). REPORTED, never graded on: results.path.qualifying_days
    (P(target reached in eval), P(pass | target reached), P(target reached and never passed) = the gate''s cost, median
    days from target to pass), pass_deferred_qual_days and payout_deferred_qual_days per life, min hold of the union ledger
    (the 60 s inactivity floor), mean pairwise daily-PnL correlation.'
  rule: 'RE-SCOPED 2026-10-06 ~06:45Z, BEFORE ANY CELL WAS GRADED, on the manager''s relay of the operator''s 06:40Z decision
    (verbatim): "if we have strategies that we know meet the risk requirements, even if we''re not sure yet about the trading
    days, we can still go live. That shouldn''t be a blocker. We can test that after the account is already live and then
    make adjustments." The v1 text (PASS = G+D+S+Q with S = P(net>0) >= 0.70 and Q = P(pass) >= 0.50 as gates) is in this
    file''s git history (commit a7763b65f). Disclosure: 15 v1 cells had run and 4 SOL-solo 0.5% cells were previewed (EV
    -21..-24, P(pass) 0.31) before the re-scope; all 15 were discarded and every cell is re-run with the timing fields.

    GO_LIVE (Tier-3 roster proposal, NOT applied by this unit) iff ALL: (G) book_max_gap <= 14d; (D) no 00:30-UTC day
    with realised loss > 80% of $200 in the 730d ledger at the arm risk; (B) P(daily-loss breach) per life <= 0.05 on
    ALL 5 seeds (the sizing-driven breach; the static 7% floor is where every prop life ends and is the accepted cost of
    the bet, B6); (R) ev_net_usd_per_life >= 0 on ALL 5 seeds.

    FAIL iff ev_net_usd_per_life < 0 on any seed. Otherwise NULL, with the first failing clause named in the order B, D, G
    as the binding constraint.

    REPORTED beside every verdict, never gated: P(max-DD breach) per life; P(net>0) and the prop-fit lanes'' edge bar
    (EDGE_PASS iff EV > 0 and P(net>0) >= 0.70 on all seeds, else EDGE_NULL); P(pass eval) within the 730d horizon and
    P(alive at horizon); the qualifying-day measurement: expected qualifying days per 30/60/90d, P(5 qualifying days by
    day 30/60/90/180), P(target reached), P(pass | target reached), P(target reached and never passed), median days from
    target to pass. The 5-qualifying-day rule is labelled QUAL_DAYS_BINDING for a cell iff P(target reached and never
    passed) >= 0.10 of lives; if any GO_LIVE cell carries that label the memo states one line on what would fix it (more
    legs or more frequency) as a follow-up research unit, not a blocker.

    Ranking (reported; ties never broken by looking at results): by class GO_LIVE > NULL > FAIL, then min-over-seeds
    p_net_positive, then mean EV, then the LOWER risk. The recommendation is the top cell iff its class is GO_LIVE, else
    "none passes" with that cell''s binding clause named. ETH+SOL at the account''s risk_pct (0.5%) is run and reported
    FIRST (operator: speed over breadth), then the sweep.

    The 14d margin, the 80% line, the 0.05 breach ceiling, the 0.70 edge bar and the 0.10 binding share are NOT changed
    after seeing any result. 1.5% is in the grid although (D) is expected to refuse it: the grid is the operator''s ask and
    the refusal is the measurement.'
  what_it_does_not_do: 'Does not edit config/accounts.yaml (the proposed diff goes in the PR body for the manager''s Tier-3
    call). Backtest gaps do not prove live gaps. The velotrade_classic_1step.yaml numbers are UNCONFIRMED desk research
    (unconfirmed: true in the ruleset) and the funded offer is discretionary (Terms 5.3(b)), neither modelled. A pilot
    account measures mechanics and cost, not edge.'
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 40
  basis: 9 cells x 5 seeds of prop_ev_sim at half size on 4 cores, session-local.
run:
  workflow: session-local
  note: Run SESSION-LOCAL by lane VELOTRADE-FIT via scripts/research/velotrade_fit_sweep.py (gap + daily-loss + prop_ev_sim
    per cell, Velotrade cost stack, qualifying-day observability).
  inputs:
    research_unit: RQ-20261006-002
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
related:
- research/queue/RQ-20261005-903.yaml
- research/queue/RQ-20261005-901.yaml
- config/prop_rulesets/velotrade_classic_1step.yaml
- docs/research/prop-firm-deepdive-2026-10-04.md
