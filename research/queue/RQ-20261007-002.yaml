id: RQ-20261007-002
title: 'Stage-0 pairs: 20y vs 7-10y Treasury ETFs (TLT/IEF 1d) -- relative-value family beyond the M22 sleeve, net of the
  full cost stack'
status: queued
cadence: once
theme: new_strategy_prop
priority: 2
kind: experiment
question: 'Does a log-spread z-score mean-reversion on TLT vs IEF at 1d (scripts/backtest_pairs.py defaults: lookback 20,
  entry_z 2.0, exit_z 0.5, stop_z 2.0, max_hold 20 bars, hedge_beta one) produce positive net R over the full fetchable window,
  after the venue-aware cost stack (fee 7.5 bps rt per leg -- the harness default, conservative against Alpaca''s zero commission
  and the only stand-in in the stack for the UNMODELLED borrow fee on the short leg; slippage 5 bps rt per leg; funding 0
  (non-perp))? Both are rostered Alpaca ETFs with 3650 d of 1d history; the long-vs-intermediate Treasury spread is a duration/curve
  spread with a shared issuer, the strongest a-priori cointegration case in our ETF universe. Registered by lane ARB-RESEARCH
  session_01Aeyqvqf9sajCVDx9Ufef4u (PI-20261006-APBY4NTV-0005); family table and the feed/order-path/venue checks behind this
  unit: docs/research/relative-value-families-2026-10-07.md.'
why_this_matters: 'Operator 2026-10-06 ~08:20Z: ''other complex strategies (not just based on predicting movement, but arbitraging
  symbols, spreads, etc)''. Pairs / ratio / z-score spread mean reversion is the one relative-value family with a net-of-cost
  harness AND a dispatch route today; this unit is one of its first registered questions outside the four M22 crypto pairs,
  which were selected on a FEE-FREE number and go dollar-negative under taker fees (G2 2026-07-16).'
power:
  expected_n: 140
  min_detectable_effect: 0.3
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.3 at alpha 0.05 / power 0.8 needs ~88 trades (normal approximation, the floor RQ-20260928-011/-012 registered).
    expected_n=140: the GLD/GDX 1d run on identical defaults produced 144 trades over the same 10-year yfinance window.'
  feasibility:
    source: none
    accrual_basis: A new (pair, timeframe) with no history on this harness. The only committed net-of-fee ETF pair on it is
      GLD/GDX 1d, n=144 over 2016-10-06..2026-10-02 (research/results/RQ-20260929-105/37188716030.jsonl); this pair uses the
      same defaults over the same yfinance 3650 d window, so ~100-200 trades is the expectation, not a measurement. Below
      88 the verdict is indeterminate.
decision_rule:
  id: RULE-RQ1007-002-PAIRS-TLT-IEF-1D
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: 'The harness''s net_total_r (sum of per-trade net R; R = spread P&L / (stop_z x sigma at entry)) and total_trades
    over the aligned TLT/IEF 1d window, with BOTH legs charged fee 7.5 bps round trip (harness default, not overridden by
    the dispatch) plus the venue-aware slippage and funding execution_costs.resolve_cost_policy returns per leg. Also REPORTED,
    never graded on: net_expectancy_r, win_rate_pct, max_drawdown_r, net_total_r_fee_only.'
  rule: 'PASS IF net_total_r > 0 AND n_trades >= 88 -- Stage-0 evidence that the TLT/IEF 1d spread reverts net of the stack
    charged (fee 7.5 bps rt per leg -- the harness default, conservative against Alpaca''s zero commission and the only stand-in
    in the stack for the UNMODELLED borrow fee on the short leg; slippage 5 bps rt per leg; funding 0 (non-perp)); the deliverable
    is a Stage-0 evidence record, never a roster edit. FAIL IF net_total_r <= 0 with n_trades >= 88 -- the grader re-queues
    once for a confirmatory run before closing. indeterminate IF n_trades < 88 -- the window could not answer; lengthen the
    corpus window, do not lower the floor. The floor 88 is d=0.3 at alpha 0.05 / power 0.8 and is not changed after seeing
    a result. MECHANICAL: scripts/research/harness_dispatch_result.py applies these three clauses to the harness''s own net_total_r
    / total_trades; queue_grade.py closes on them.'
  what_it_does_not_do: Does not edit config/pairs.yaml, config/accounts.yaml or config/strategies.yaml. A PASS is Stage-0
    evidence for a proposal, not a placement. No Alpaca two-leg order path exists (src/units/strategies/pairs_executor.py
    is Bybit-only, one account), so a PASS routes to an order-path build row, not to a Stage-1 soak; alpaca_live is side_filter
    long, so the short leg could only ever run on a paper book until that decision is reopened. Borrow cost on the short ETF
    leg is NOT modelled; the reader must say so beside any PASS. Does not model the dollar/lot floor (scripts/research/pairs_dollar_lots.py
    is the G2 instrument for that) and does not say anything about any prop venue.
