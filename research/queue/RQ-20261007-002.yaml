id: RQ-20261007-002
title: >-
  Active geometry, prop: can a CALIBRATED target (reach-rate >= 20%) plus thesis-conditioned
  extension match the 6R near-sentinel's EV per life on trend_donchian_{eth,sol}_prop
  under the prop rulesets -- or does doctrine compliance cost measurable EV?
status: queued
cadence: once
kind: experiment
theme: new_strategy_prop
priority: 1

question: >-
  The eight prop routings (tradeify_1, velotrade_1 live; breakout_1/2) declare tp_r 6.0
  and pass the TP-doctrine guard's entry_tp dimension (declared, finite). INFERRED from
  docs/research/mi307-offline-mfe-2026-09-18.json (uncapped harness book, 2026-09-18):
  6R is reached by 0.9% of trend_donchian_eth_prop's 1,004 trades and 1.9% of
  trend_donchian_sol_prop's 370 (3R: 9.3% / 15.7%; 2R: 17.1% / 26.8%), so the 6R
  target is a prediction almost no trade meets -- a near-sentinel the guard cannot see
  because it keys on 50R. Calibration-first, the predictive target for these 1h legs
  sits at 2.0-2.5R. E65 (docs/research/prop-exit-evidence-2026-09-24.json) already
  measured STATIC nearer brackets B1-B3 against B0 (6R + declared levers) and none was
  eligible (R5 false; account_net_r_per_capital_day B0 0.0876 vs B2 0.027, B1/B3
  negative) -- a nearer FIXED target loses the trend tail. The open question is the one
  the doctrine actually asks: a calibrated target that EXTENDS while the Donchian
  thesis holds (target_expectation.evaluate_extension) -- does it recover B0's EV per
  life under config/prop_rulesets/* (daily-loss and drawdown clauses on all 5 seeds,
  prop_ev_sim as RQ-20261006-062/071), and what is the EV cost, if any, of
  doctrine compliance on real prop money?

why_this_matters: >-
  Prop is the second money-at-stake tier (CLAUDE.md § "The TP doctrine": real-money
  and prop first) and the one where evaluations must pass fast, so the trade-off
  between "where momentum runs out" (a prediction) and "ride the tail" (the 6R
  near-sentinel the E65 numbers favour) is a live decision with a dollar figure on it.
  This unit turns the doctrine-vs-EV conflict into a measured number the operator can
  decide on, instead of a popup with no data behind it (operator directive 2026-09-29:
  either there is data to decide, or getting it is the task). The prop exit path today
  forwards no TP at all (prop_trail.run_trail_step passes take_profit=None;
  dxtrade_api.modify_bracket can PUT one; the breakout_2 phone path has only a
  human-reported amend ticket) -- BUILD B2 / PI-20261006-KX6ZKFNA-0002 -- so a passing
  cell here is also the evidence record B2 ships against.

power:
  expected_n: 75
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Touched trades per leg at a 2.5R target and approach_frac 0.85, from mi307's
    uncapped reach-rates (2026-09-18): eth_prop 1,004 x 0.126 = 127, sol_prop 370 x
    0.203 = 75. Declared as the MIN (sol). d=0.45 needs 38.76 -> 39; both legs clear.
    The prop_ev_sim clauses are graded per arm on the FULL book (n = 355 + 132 on the
    committed 730d records, RQ-20261006-071's population), not on the touched subset.
  feasibility:
    source: none
    accrual_basis: >-
      Committed artifacts (mi307 MFE distribution; comms/strategy_evidence/runs/2026-10-05-730d
      trade records with mfe_r) ground the counts; the run itself re-fetches the free-lane
      candles. Nothing accrues forward.

decision_rule:
  id: RULE-RQ1007-002-PROP-CALIBRATED-TARGET-PLUS-EXTENSION
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: >-
    Per leg, per cell of {target_r in (2.0, 2.5), approach_frac in (0.75, 0.85),
    extend_r in (0.5, 1.0), max_extends in (1, 3, unbounded-to-cap)} with the leg's
    declared levers kept (trail_mult 3.5, atr_stop_mult 2.5, eth: stale_exit_bars 12
    and trail_decay as declared), thesis_intact = the Donchian channel extreme has
    moved further in the trade direction since the approach bar, extension decided by
    target_expectation.evaluate_extension imported: (a) calibration share (exit within
    +/-20% of the FINAL target) vs B0; (b) harness net_R, maxDD, net_r_per_capital_day
    vs B0 (the leg's declared 6R geometry) in IS and OOS with the yearly walk-forward,
    full cost stack as the 730d records (fee + slippage + funding, prorated swap);
    (c) scripts/research/prop_ev_sim.py on the union ETH+SOL book per cell, seeds 1-5,
    on config/prop_rulesets/breakout_turbo_1step.yaml AND the Tradeify and Velotrade
    rulesets the live accounts run: ev_net_usd_per_life, p_net_positive, P(daily-loss
    breach), days_to_pass p50/p90.
  rule: >-
    PASS IF at least one cell has (a) >= B0's calibration share AND (c)
    ev_net_usd_per_life >= B0's on ALL 5 seeds on every ruleset AND P(daily-loss
    breach) <= B0's -> a Tier-3 proposal to re-declare tp_r + the extension params on
    both _prop legs (one PR, every prop account by roster), to ship only after BUILD
    B2 forwards a TP amend on the dxtrade_api and phone paths. COSTED-NULL IF every
    calibrated+extension cell loses to B0 on ev_net_usd_per_life: the result is the
    measured EV cost per life of doctrine compliance on these legs, reported per
    ruleset, and the disposition is an OPERATOR DECISION with that number attached
    (keep 6R and record `tp_intent: {mode: near_sentinel_by_evidence}` on the leg, or
    accept the cost) -- never a silent keep. FAIL IF any calibrated cell breaches a
    ruleset risk clause B0 does not. UNDERPOWERED IF touched n < 39 on both legs.
  what_it_does_not_do: >-
    Changes no config and no prop ticket. Does not re-ask E65's static-bracket question
    (answered, ineligible). Does not decide B2's design. Does not grade breakout_1/2
    separately from tradeify_1/velotrade_1 -- same legs, same records; the ruleset
    axis is inside the statistic.

routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 120
  basis: >-
    Runner, once the lever exists: research-script-run.yml running the harness per
    cell (RQ-20261006-071's shape) then prop_ev_sim per cell x ruleset x 5 seeds;
    24 cells x 2 legs x 3 rulesets x 5 seeds at the simulator's measured seconds per
    sim. Estimate, not a measurement.

run:
  workflow: m20-exit-lever-sweep.yml
  inputs:
    legs: trend_donchian_eth_prop,trend_donchian_sol_prop
    levers: tp_extend
    tp_cap_pct: '0.099'
    split_mode: oos-trades
    research_unit: RQ-20261007-002
  note: >-
    Unblocked 2026-10-07 by GEOM-B1-HARNESS, and ONLY HALF-DISPATCHED. This run covers
    statistics (a) calibration share vs the base and (b) the harness P2 gate (IS/OOS,
    walk-forward, net of the venue-aware cost stack) on the two prop legs. It does NOT
    cover (c), the scripts/research/prop_ev_sim.py union-book EV on the three prop
    rulesets: that needs per-cell emitted trades (--emit-trades) and a runner that can
    fetch the legs' candles, and the research-script-run runner holds no data source
    (it is token-free and sees only the checkout). (c) is filed as a pipeline row
    (filed as PI-20261007-HY7G7NYF-0001) -- until it lands this unit CANNOT grade `pass` or `costed_null`
    under its own rule, only report (a)+(b).
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1

