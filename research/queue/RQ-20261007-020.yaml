  workflow: research-script-run.yml
  timeout_minutes: 60
  command:
  - python3
  - scripts/research/exit_lever_ablation.py
  - --leg
  - trend_donchian_eth_prop
  - --arm
  - W=
  - --arm
  - X=-stale_exit_bars;-stale_exit_below_r;--timeout-bars=100000
  - --days
  - '760'
  - --start
  - '2024-10-05'
  - --end
  - '2026-10-03 23:59'
  - --control
  - W=comms/strategy_evidence/runs/2026-10-05-730d/trend_donchian_eth_prop__bt.json
  - --control-tol-n
  - '0.02'
  - --control-tol-r
  - '0.5'
  - --grade
  - parity
  - --baseline
  - W
  - --candidate
  - X
  - --delta-r
  - '2.0'
  - --fold-majority
  - '3'
