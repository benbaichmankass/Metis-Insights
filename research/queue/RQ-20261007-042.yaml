id: RQ-20261007-042
title: >-
  Momentum-conditioned stop (the operator's idea, literal form): on the four real-money
  bybit_2 legs and the two prop legs, does a Chandelier trail that TIGHTENS when Wilder ADX
  fades (and stays at the leg's wide base while momentum confirms) beat the config-exact
  price-path trail through the exit-refinement P2 gate?
status: queued
cadence: once
kind: experiment
theme: live_strategy
priority: 1
question: >-
  OPERATOR 2026-10-07 (paraphrased from voice): "a stop loss correlated to momentum instead
  of price movement". Every live stop today is price-path: the Chandelier trail ratchets off
  the since-entry price extreme scaled by ATR (scripts/backtest_trend.py:729-734,
  backtest_pullback.py:585-620), and the only exhaustion lever ever swept (P4.1
  trail_decay) arms off PRICE stalling (bars since a new extreme) or R reached -- it never
  reads a momentum series. The harnesses already compute Wilder ADX and +DI/-DI
  (backtest_trend.py:172 _directional_indicators, :196 _adx; backtest_pullback.py:163) but
  consume them only at ENTRY (adx_min/adx_max gates, the soft regime weight, the
  direction filter). Question: for each of trend_donchian_eth_4h, trend_donchian_xrp_4h,
  xrp_pullback_2h, ada_pullback_2h (bybit_2 + mirror), trend_donchian_eth_prop,
  trend_donchian_sol_prop (breakout_2 / tradeify_1 / velotrade_1), does tightening the
  trail mult to T on bars where ADX_j < A (and, in the second arm, ADX_j < ADX_{j-k}, i.e.
  falling) -- with the price-ratcheted stop never loosening -- clear Path A or Path B in
  BOTH IS and OOS and the yearly walk-forward against the config-exact base, net of the
  full cost stack? Grid, fixed now: A in {20, 25} (the detector's chop / trending
  cut-points, src/runtime/regime/detector.py:95), k in {0, 3}, T = max(1.5, trail_mult/2)
  (the same config-relative tight mult the decay and vol_trail cells use,
  m20_fleet_exit_sweep.cells_for).
why_this_matters: >-
  This is the operator's hypothesis in its literal form, and nothing in the repo can run it:
  the closest proxies (price-stall decay; the ADX-LABEL regime-flip EXIT, P4.5) have been
  swept and are honest negatives on nearly every leg, and the regime-flip replay's own
  finding -- "wherever the flip fires it guts the trend tail" -- is the specific risk a
  momentum-conditioned stop must beat: a tighten (not an exit) on a fading ADX is softer
  than a flip exit, which is exactly why it has to be measured rather than inferred from
  P4.5. Real-money and prop legs first because that is where the gate verdict changes a
  decision (operator 2026-10-05 "Prop first"). Memo § 3 carries the full feasibility
  matrix; § 5 says what would make the hypothesis FAIL.
power:
  expected_n: 32
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    d=0.45 -> 39 at alpha 0.05 / power 0.8; gate floor MIN_OOS_TRADES=25. expected_n is the
    MIN measured base OOS count over the six legs' most recent m20/e35 runs
    (trend_donchian_xrp_4h 32-40, xrp_pullback_2h 34, ada_pullback_2h 49,
    trend_donchian_eth_4h ~46, trend_donchian_eth_prop 33 after the 50-target fix,
    trend_donchian_sol_prop ~30 -- the last two from the 2026-08-13/14 coverage notes).
    A leg under 39 is reported as underpowered for d=0.45 and graded only on the gate's
    own insufficient_base / pass / fail read; legs are never pooled.
  feasibility:
    source: none
    accrual_basis: >-
      The lever touches only bars whose ADX sits below A, so the TREATED population per
      leg is unknown until the lever exists and is run once; the base OOS counts above
      bound it from above. Nothing accrues forward.
decision_rule:
  id: RULE-RQ1007-042-ADX-CONDITIONED-TRAIL
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: >-
    Per leg, per cell of {A in (20, 25)} x {k in (0, 3)} at T = max(1.5, trail_mult/2):
    IS and OOS delta net_R and delta maxDD vs the config-exact base with every declared
    lever present (m20_fleet_exit_sweep base_args), Path A (beats) or Path B
    (net_r_per_capital_day, grant cap dN/N_b <= 1.0), yearly walk-forward (FOLDS),
    base OOS trade count; net of fee + venue slippage + funding via
    execution_costs.resolve_cost_policy as resolved in each harness main. Beside it, the
    ATTRIBUTION read the P4.5 finding demands: per cell, net_R change split between trades
    whose exit reason became trail_stop on an ADX-tightened bar and all other trades, so
    "it fired and helped" is distinguishable from "it rarely fired".
  rule: >-
    PASS IF at least one cell clears the gate in BOTH IS and OOS with base_trades_OOS >= 25
    AND the yearly walk-forward wins >= 4 of 6 effective folds on that leg -> a Tier-3
    declare proposal for that leg (trail_adx_below A, trail_adx_falling_bars k,
    trail_adx_tight_mult T), prop legs in their own PR because tests/test_paper_portfolio_accounts.py
    binds only the bybit trio. honest_negative IF no cell clears on a leg with
    base_trades_OOS >= 25: a momentum-conditioned tighten does not beat the price-path
    trail on that leg; coverage row gains column momentum_trail = honest_negative.
    insufficient_base IF base_trades_OOS < 25 (never a fail). A cell that passes the gate
    while its ADX-tightened exits are net NEGATIVE in the attribution read is 'passes for
    the wrong reason' and does not pass (the lever's own exits must carry the gain).
    HYPOTHESIS-LEVEL READ, written now: the operator's idea is SUPPORTED if >= 2 of the 6
    legs pass; LEG-SPECIFIC if exactly 1; REFUTED IN THIS FORM if 0 pass with >= 4 legs
    gradeable. One pass per leg; a FAIL re-queues once with k=3 only before it is read as a kill.
  what_it_does_not_do: >-
    Builds nothing: the lever spec is a proposal in the memo and a build row is the
    manager's to open. Touches no config; a passing cell is a Tier-3 proposal. Does not
    test an ADX-triggered EXIT (that is P4.5's regime-flip replay, honest_negative) or a
    DI-cross exit (memo § 3, NEEDS-A-LEVER, lower priority). Does not grade the mirror or
    bybit_1 copies separately.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 120
  basis: >-
    Runner, once the lever exists: m20-exit-lever-sweep.yml shards one leg per job and
    scp's frames from the trainer; 4 cells x 6 legs at the measured ~2.5 min per cell
    incl. folds. Estimate, not a measurement.
run:
  workflow: m20-exit-lever-sweep.yml
  inputs:
    legs: "trend_donchian_eth_4h,trend_donchian_xrp_4h,xrp_pullback_2h,ada_pullback_2h,trend_donchian_eth_prop,trend_donchian_sol_prop"
    levers: momentum_trail
    tp_cap_pct: '0.099'
    split_mode: oos-trades
    research_unit: RQ-20261007-042
  note: >-
    Lever landed in #17042 (f111ec755); flags, cells_for cells and workflow input verified on
    main 2026-10-08 by lane ML-RESEARCH-W41. Moved from blocked/ on that basis.
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
