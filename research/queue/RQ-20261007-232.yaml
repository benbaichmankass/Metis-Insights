question: Does the squeeze harness (scripts/backtest_squeeze.py, harness-default parameters) show net-of-cost edge on ZECUSDT
  1h -- Breakout ZECUSD (100k cap); chosen because the strongest P2r2 trend cell (+40.7R); 1h is the fastest bar that cleared
  the cost stack in batch 1? No live leg exists for this (symbol, timeframe, harness) and none is proposed by this unit. Venue
  reachability is per docs/integrations/breakout-instruments-2026-09-27.md (operator screenshot, unverified against the live
  page), Tradeify "100+ cryptocurrency pairs" and Velotrade "104 crypto instruments on KuCoin perp feeds" (docs/research/prop-firm-deepdive-2026-10-04.md);
  only ETH/SOL/XRP/BTC/ADA have measured lots on any prop terminal, so every other symbol is a candidate for research, not
  yet an executable leg.
why_this_matters: 'Operator 2026-10-06 (verbatim, in PI-20261006-APBY4NTV-0001): "continue searching for new strategies ...
  specifically for the prop accounts, with an emphasis on shorter-timeframe strategies, or at least strategies that turn a
  profit faster (we would ideally want +10% monthly, not over more than 6 months)" and "we shouldn''t be stuck on eth and
  sol - anything that we''re able to trade is fair game". Batch 1 (RQ-20261006-005..031, Stage-0 net of each harness''s cost
  stack, research/results/RQ-20261006-0NN/*.jsonl, measurement block; the `wiring_only` verdict field is a grader bug being
  fixed by lane RQ-RESULTS): 5 PASS, all at 1h (ADA/DOGE/LINK pullback, DOGE squeeze, SLV fade); 17 FAIL including every 15m
  and 5m cell (BTC 15m fade -1820R over 4214 trades); the 5m/15m chop scalps indeterminate (n<39). READ: with these harnesses
  the cost stack kills 5m/15m; pace has to come from BREADTH (more 1h-4h legs on more instruments) and from stacking legs,
  not from faster bars. Batch 2 widens BREADTH at the bars that cleared the cost stack: squeeze passed on DOGE 1h in batch
  1 and failed on ADA/LINK/XRP. A PASS is Stage-0 evidence for a follow-on prop fit (the RQ-20261007-201 shape, which commits
  the rows); a FAIL re-queues once, then closes the cell.'
power:
  expected_n: 60
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: 'd=0.45 -> 39 trades at alpha 0.05 / power 0.8, the repo''s standing E35 floor (RQ-20261006-005..031 used the same).
    expected_n is a cadence guess, not a measurement: batch 1''s 1h cells landed n=375-555 for pullback/squeeze over 1095
    d, so the floor is comfortably reachable at 1h, but this (symbol, timeframe, harness) has never been run in this repo
    (see feasibility).'
  feasibility:
    source: none
    accrual_basis: 'First observation of squeeze on ZECUSDT 1h in this repo (research/queue/ and research/results/ hold no
      such cell; checked 2026-10-07). Data: binance_vision, 1095 d trailing window declared in scripts/ops/fetch_backtest_corpus.py
      CANDIDATE_PAIRS (added by this batch). Below the floor the unit grades indeterminate, never FAIL.'
decision_rule:
  id: RULE-RQ1007-232-ZECUSDT-1h-SQUEEZE-STAGE0
  registered_at: '2026-10-07'
  registered_before_run: true
  statistic: net_total_r (net of the harness's full cost stack via execution_costs.resolve_cost_policy) and total_trades from
    the harness's own JSON summary, harness-default parameters, as mapped by scripts/research/harness_dispatch_result.py (which
    applies THIS rule mechanically).
  rule: PASS IF net_total_r > 0 AND n_trades >= 39 -- Stage-0 evidence only. FAIL IF net_total_r <= 0 AND n_trades >= 39 --
    one pass; re-queues for a confirmatory run before it is read as a kill. indeterminate IF n_trades < 39.
  what_it_does_not_do: Does not touch config/strategies.yaml or config/accounts.yaml and does not propose a live or prop leg.
    A PASS is a backtest on default parameters; the next unit, not this one, commits the rows and prices them under the three
    prop rulesets (tradeify_247_1step, breakout_turbo_1step, velotrade_classic_1step) with days-to-target as the headline.
