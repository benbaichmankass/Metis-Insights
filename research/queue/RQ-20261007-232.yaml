id: RQ-20261007-232
title: 'Stage-0 backtest for a FASTER prop leg: squeeze harness on ZECUSDT 1h (PI-20261006-APBY4NTV-0001 batch 2 breadth)'
status: queued
cadence: once
theme: new_strategy_prop
