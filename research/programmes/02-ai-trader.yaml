        statistic: Paired purged-CV log-loss difference (lgbm_base minus lgbm_yz, positive = yz better) on identical rows,
          and the same on the holdout, for SOLUSDT_1h.
        rule: PASS IF lgbm_yz beats lgbm_base by >= +0.003 nats (CV mean) AND > 0 on the holdout. FAIL IF lgbm_yz does
          not reach >= +0.001 vs lgbm_base (CV mean). INDETERMINATE otherwise, or if folds < 3, the holdout has < 20 rows,
