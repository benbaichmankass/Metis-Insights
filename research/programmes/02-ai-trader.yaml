    needs_authoring: 'AUTHORED 2026-10-16: 9da8-03 is scoped to the 15m shadow log and needs two levers, so the 1h
      published-data variant was registered as blocked/RQ-20261016-65ff-25 (needs only the scorer, FRONTIER-LEVER-CONFORMAL).
      On its PASS: register the disjoint-window confirmation, then the Tier-3 proposal of abstention as a per-trade
      RiskManager refusal on the advisory heads (never a mode flip), and re-ask 9da8-03 on the 15m shadow log once
      ML-HEAD-AGREEMENT-JOIN lands.'
  - id: P2-Q1.5-fail
    goal: G4
    roadmap:
    - L-REGIME
    value:
      usd_at_stake_per_month: 100
      confidence: 0.2
    after:
    - unit: RQ-20261016-65ff-25
      verdict: fail
    unit:
      theme: ml_health
      priority: 2
      kind: experiment
      title: 'AI trader / conformal abstention at 1h, VARIANT (first test failed -> variant, P2-Q1.5-fail): does a GLOBAL
        (non-Mondrian) split-conformal rule beat the plain max-probability threshold at matched coverage on the BTC/ETH/SOL
        1h regime learner?'
      question: 'RQ-20261016-65ff-25 (Mondrian per predicted class, 3 symbols x 3 coverage levels) closed FAIL on two
        consecutive passes: conformal selective error was slightly HIGHER than the plain threshold at every level on BTC,
        and empirical set coverage ran ~8-9 points under nominal at the 90% level (e.g. 0.81 vs 0.90 on BTC), i.e. the
        calibration block does not stay exchangeable with the test block. Same shards, learner, folds, coverage levels
        and windows, one change -- mondrian: none (a single global quantile instead of one per predicted class, which
        halves the calibration rows per quantile): does the conformal rule give LOWER selective error than the plain threshold
        at matched coverage on >= 2 of 3 symbols at every level, with rolling-window coverage within 2 SE of nominal in
        >= 90% of windows?'
      why_this_matters: 'Operator 2026-10-22: an idea that failed one test is not dead, it failed the first test. This
        is a registered VARIANT, not a retry: per-class quantiles on a 2-class label with ~1000 calibration rows per class
        are noisy, and the class split is the one degree of freedom in the instrument that the FAIL did not rule out.
        Drift (the other candidate cause) is NOT addressed here -- an adaptive-conformal (ACI) arm needs an instrument
        change that does not exist; if this variant also FAILs on validity, the next variant is that lever, filed by the
        grader read. Prior: 65ff-25 (FAIL, Mondrian), 9da8-03 (trainer-log variant, still blocked on ML-HEAD-AGREEMENT-JOIN).
        Trials counted: 2 conformal configurations on this corpus including this one.'
      power:
        expected_n: 24000
        min_detectable_effect: 0.1
        effect_units: sd
        design: one_sample
        alpha: 0.05
        power: 0.8
        basis: 'The selective-error comparison is PAIRED over folds and rows: a paired comparison is a one-sample test
          on the differences, so design is one_sample (the queue''s power grader accepts one_sample | two_sample; ''paired''
          was refused on 2026-10-18 when the unit left blocked/). Rows: tail_rows 40000 at min_train_frac 0.4 leaves ~24,000
          OOS rows per symbol over 5 folds; d=0.1 paired needs ~785 rows, so rows are not the limit; bars are autocorrelated,
          so the rule also needs >= 2 of 3 symbols and >= 6 windows per symbol rather than one significance test. The
          earlier basis counted 3 symbols as n; that was the number of groups, not the sample.'
        feasibility:
          source: none
          accrual_basis: Fixed published shard; nothing accrues.
      decision_rule:
        id: RULE-P2-Q1.5-CONFORMAL-1H-GLOBAL
        statistic: 'Per symbol and coverage level c in {0.5, 0.7, 0.9}: selective error (misclassification among non-abstained
          OOS rows) of (a) the plain max-probability threshold tuned on the fold''s calibration block to keep share c
          and (b) the GLOBAL (mondrian: none) split-conformal rule whose alpha is tuned on the same calibration block
          to keep share c (rising branch); paired over folds. Validity: per non-overlapping 30-day window of OOS rows,
          |empirical set coverage - (1 - alpha)| <= 2 * sqrt(p(1-p)/n_window + p(1-p)/n_calibration). The fixed 3-point
          band is reported beside it as valid_share_tol.'
        rule: 'PASS IF on >= 2 of 3 symbols, at EVERY coverage level (50/70/90% kept) with coverage matched between the
          two rules, the conformal rule has LOWER selective error than the plain max-probability threshold AND the conformal
          set''s rolling-window coverage is within 2 SE of nominal in >= 90% of windows (SE combines the window''s binomial
          term and the calibration-set term; see amendments) -- a per-trade refusal signal worth a Tier-3 proposal note
          on FRONTIER-RESEARCH; family history conformal_calibration PASS. FAIL IF either condition fails on >= 2 symbols
          with coverage matched (no gain, or validity broken by drift: family history FAIL with this configuration). INDETERMINATE
          IF < 6 usable windows per symbol, the learner arm is unavailable, or coverage could not be matched at some level
          (the model cannot keep that many singleton sets: not a comparison).'
        min_n: 6 usable 30-day windows per symbol, >= 200 OOS rows each.
        what_it_does_not_do: Changes no head, threshold, stage or order path; abstention is measured offline on market
          labels only. A PASS is a lead for a disjoint-window confirmation unit and a Tier-3 proposal note, never a wiring
          change. Does not address drift (no ACI arm). Not a P&L claim.
      compute: auto
      value:
        bucket: ai_trader
        usd_at_stake_per_month: 100
        confidence: 0.2
        basis: 02 node P2-Q1.5 weight; a calibrated per-trade refusal signal for the advisory heads, not a measured P&L
      routing:
        needs_trainer_resident_data: false
        needs_gpu: false
        published_data: metis-market-data
        peak_memory_gb: 3.0
        est_minutes: 30
        basis: 'Estimate, NOT measured: the 65cc-10 fold plan (5 lightgbm fits per symbol) plus a 190-point alpha grid
          over each fold''s calibration block per level; Kaggle CPU via published data. Re-declare from the first run.'
      ml_bakeoff:
        dataset:
          kind: jsonl
