        of the 1h regime head and the one where the macro-F1 test 3a84-11 passed, so this is the symbol where a log-loss
        result is most informative: a PASS widens the lead to the full head, a FAIL says the macro-F1 pass was a metric
        artifact there. Trials counted: 4 range-vol comparisons on this feature block (3a84-09/-10/-11 macro-F1, a1f3-15
        log-loss) plus this one.'
