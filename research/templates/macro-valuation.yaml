family: macro-valuation
weight: 10
kind: deterministic
why_not_inferential: >-
  A backfill re-materialises point-in-time valuation snapshots from FRED; it
  produces rows, not a test statistic, and the grading is the M28 scorecard's
  own calibration read on the refreshed rows.
cadence: monthly
priority: 60
title: "M28 valuation snapshot backfill, cadence {cadence_days}d (generated, monthly)"
question: >-
  Are the M28 point-in-time valuation snapshots complete and current at a
  {cadence_days}-day cadence from {start_date}, so the value thesis can be
  re-scored on rows that never look ahead?
why_this_matters: >-
  The macro/value sleeve (weight 10 of 100) cannot be graded on stale
  snapshots; a monthly backfill keeps comms/macro current without a session.
power:
  expected_n: 1
  min_detectable_effect: 1.0
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    Deterministic producer (kind: deterministic, why_not_inferential above);
    the power block is present because the queue schema requires one, and
    the unit is graded on completeness, not on a test.
  feasibility:
    source: none
    accrual_basis: FRED is read on demand; nothing accrues.
decision_rule:
  id: "RULE-TPL-MACRO-VALUATION-BACKFILL-COMPLETE"
  statistic: >-
    The backfill's landed snapshot count and the newest snapshot's as-of date
    (comms/macro/), read after the run.
  rule: >-
    PASS IF the run lands snapshots whose newest as-of date is within
    {cadence_days} days of the run date. producer_failed / indeterminate
    otherwise; never a kill.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 1.0
  est_minutes: 15
  basis: the existing macro-valuation-backfill workflow on a GitHub runner.
run:
  workflow: macro-valuation-backfill.yml
  inputs:
    start_date: "{start_date}"
    cadence_days: "{cadence_days}"
  note: >-
    macro-valuation-backfill.yml declares no research_unit input, so its
    result lands unattributed; the grader matches it by run window.
lands:
  store: comms/macro/
  assert_field: as_of
  min_rows: 1
grid:
  start_date: ["2005-01-01"]
  cadence_days: ["7"]
