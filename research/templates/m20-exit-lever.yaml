family: m20-exit-lever
weight: 25
kind: experiment
cadence: monthly
priority: 60
title: "M20 exit-lever sweep: {leg} (generated, monthly)"
question: >-
  Which hard exit levers (stale_stop, giveback_stop, trail_geometry,
  trail_decay, vol_trail) clear the exit-refinement P2 gate on {leg}
  ({symbol} {timeframe}) on the data available now -- and does last month's
  answer still hold?
why_this_matters: >-
  Exit-lever evidence goes stale as new trades accrue; a monthly re-sweep per
  live leg keeps docs/research/exit-refinement-coverage.json honest and turns
  a passing cell into a Tier-3 declare proposal with a fresh record.
power:
  expected_n: 25
  min_detectable_effect: 0.45
  effect_units: sd
  design: one_sample
  alpha: 0.05
  power: 0.8
  basis: >-
    MIN_OOS_TRADES=25 is the gate's own floor (RULE-EXIT-REFINEMENT-P2-GATE);
    a leg below it grades insufficient_base, not fail. The sweep derives the
    IS/OOS boundary to target that OOS count (split_mode oos-trades).
  feasibility:
    source: none
    accrual_basis: >-
      Runs on whatever history the trainer holds for the leg; nothing waits.
decision_rule:
  id: "RULE-EXIT-REFINEMENT-P2-GATE"
  statistic: >-
    Per cell: IS and OOS delta net_R and delta maxDD vs the base book; base
    OOS trade count.
  rule: >-
    A cell PASSES iff it clears Path A (beats baseline on net_R AND maxDD in
    BOTH IS and OOS) OR Path B (improves net_r_per_capital_day in BOTH IS and
    OOS with maxDD not worsening and net_R not falling more than the declared
    floor), AND the base book holds >= 25 OOS trades, AND the drawdown grant
    is capped at the base book's own D_b. Below the floor grades
    insufficient_base. No cell is shipped by this unit.
routing:
  needs_trainer_resident_data: false
  needs_gpu: false
  peak_memory_gb: 4.0
  est_minutes: 40
  basis: one leg per unit; the workflow scp's the leg's frames from the trainer and sweeps on the runner.
run:
  workflow: m20-exit-lever-sweep.yml
  inputs:
    legs: "{leg}"
    tp_cap_pct: "0.099"
    split_mode: oos-trades
    research_unit: "{unit_id}"
lands:
  store: research/results/
  assert_field: read_state
  min_rows: 1
grid:
  legs: live_roster_legs
