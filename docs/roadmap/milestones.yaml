# The live roadmap, as data. ROADMAP.md's "Live roadmap" block is GENERATED from this file plus the
# `roadmap` field on checklist rows and research-queue units (scripts/ops/roadmap_map.py --write-roadmap).
# Contract: .claude/skills/manager/SKILL.md § "The roadmap loop". Guard: roadmap-map-guard.
#
# WHAT IS HAND-WRITTEN HERE: goal text, milestone status/where/next, the architecture sections it touches.
# WHAT IS NEVER TYPED HERE: row/unit counts and ids (computed from the `roadmap` field -- they cannot drift).
# `where` is a DATED claim about the field; re-measure it in the weekly pass, do not copy it forward.
# A milestone with no live row and no open unit MUST carry `no_rows_reason` (the guard enforces it).
#
# Other lanes (e.g. ML-ROADMAP-LOOP) add their milestones as new list items under their own goal;
# never reword another lane's entry in the same PR.
version: 1
reviewed: 2026-10-14          # date of the last full weekly pass (2026-10-14: the Wednesday planning dialogue, which replaces the Monday pass)
review_cadence_days: 8        # report flags a milestone whose `reviewed` is older than this
enforce_from_seq: 400         # checklist rows with _seq >= this must carry `roadmap` (+ `writeback` when closed) -- only when the diff touches them
row_fallback: docs/roadmap/backfill-2026-10-11.json  # rows without their own `roadmap` field resolve here (explicit field wins); `--backfill` materialises it
enforce_units_from: "20261012"  # new queue units with an id date >= this must carry `roadmap`

goals:
  G1:
    name: Real-money edge, decided offline
    measure: >-
      Net P&L per capital-day, in R and in $, on the real-money books (bybit_2 + bybit_portfolio, alpaca_live +
      alpaca_portfolio): PER STRATEGY (each leg pulls its own weight) and at PORTFOLIO level (capital-weighted).
      Operator decision 2026-10-14 (weekly planning), replacing net-of-cost expectancy as the headline. Every leg that
      reaches these books still clears Stage 0 (backtest, full cost stack) and Gate 1 (cost fidelity) per
      docs/plans/OPERATING-PLAN-2026-09-21.md; a live book never establishes edge, it checks mechanics and cost.
    baseline: >-
      To be measured by the 2026-10-15 perf-review prep (trigger 'Weekly review prep', Wed 18:53Z: net P&L per capital-day
      in R and $ per strategy and for the whole book, plus giveback and TP-rule compliance). Prior-measure history, NOT the
      new measure: lifetime real-money expectancy -0.3231R (n=431, profitFactor 0.68, 2026-09-21, before the roster cut);
      2026-10-04..10-10 window 4 priced real-money closes, +$2.10 (n=4, "caution"). Roster 2026-10-11 from
      config/accounts.yaml: bybit_2 4 legs, alpaca_live 3 legs. TP doctrine (python3 scripts/ci/check_tp_doctrine.py,
      2026-10-14 06:40Z): 0 of 50 routings compliant.
  G2:
    name: Prop-account income
    measure: >-
      Prop accounts (breakout_2, tradeify_1, velotrade_1; breakout_1 is dry_run with no roster) execute automatically,
      protect every position, and clear their evaluations; the bar is an expected-value question, not drawdown avoidance (row B6).
    baseline: >-
      3 prop accounts live with 2 legs each (config/accounts.yaml, 2026-10-11). First velotrade_1 ETH long closed 2026-10-11
      with exit_price/pnl null, so it is not gradable yet (PERF-REVIEW-W41 note, PI-20261011-MJ5KSFIO-0001).
  G3:
    name: Trustworthy plumbing
    measure: >-
      Every position protected, every close attributed with a real reason, every number carrying provenance
      (MEASURED/ESTIMATED/FABRICATED/UNVERIFIED), no pipeline self-halting (NO-HALT) except the sanctioned account daily-DD switch.
    baseline: >-
      The 2026-09-27 code audit produced FIX-CA-01..32 and the SA audit FIX-SA-*; most rows sit at landed_unproven
      (merged, deploy/observation still owed). Count them: python3 scripts/ops/roadmap_map.py --report.
  G4:
    name: AI trader (ML and regime knowledge)
    measure: >-
      ML heads and regime knowledge that demonstrably separate a strategy's good trades from its bad ones net of cost
      (advisory first, live only on a committed evidence record). The ML build/research/infra plan is owned by
      ML-ROADMAP-LOOP; this goal only holds the milestones that already exist.
    baseline: >-
      research/THEMES.yaml gives regime weight 5 and ml_health weight 3, but on 2026-10-11 the queue holds 0 queued units
      under theme regime and 1 under ml_health (measured from research/queue/*.yaml); 8 regime-question units exist but all sit BLOCKED (7 with no theme set)
      (RQ-20260927-006..009, RQ-20260928-006, RQ-20260929-109/110, RQ-20261008-904) -- the weights are not reaching work.
  G5:
    name: Learning machine (research queue, decisions, manager loop)
    measure: >-
      Evidence converts to decisions without the operator in the path: queue units run, results are graded against their
      pre-registered rule, mandates fire or refuse, and due work is routed the day it comes due.
    baseline: >-
      research/queue 2026-10-11: 475 units = 295 done, 138 queued, 36 blocked (research/queue/blocked/), 6 retired. Checklist: 415 rows =
      226 done, 104 landed_unproven, 57 queued, 20 dropped, 7 in_flight, 1 blocked. 15 mandates granted (config/mandates.yaml).
  G6:
    name: Macro and value sleeve
    measure: >-
      A thesis-driven, event-aware, weeks-horizon sleeve whose conviction axes are shown to add net R, expressed through
      defined-risk instruments (alpaca_options_paper).
    baseline: >-
      alpaca_options_paper runs 3 legs on paper (config/accounts.yaml, 2026-10-11). Conviction comes only from the
      valuation read today (row MACRO-RESHAPE).
  G7:
    name: Operator surfaces
    measure: The SPA and Telegram show the true state fast, render a missing field as "-", and need no operator relay to be read.
    baseline: Svelte SPA on GitHub Pages is the only live consumer since 2026-09-01; Workflow page serves the checklist and the daily brief.

