done_condition: >-
  The repo is GREEN: check_trainer_capture_watch.py exits 0 on main because a refreshed TRAINER-CAPTURE-WATCH.json is ON MAIN. Land #11488 (and the other stale automation PRs -- #11471, #11475, #11476, #11478, #11487, #11489, #11490, #11493, #11499, #11506 -- to the extent each is still valid; a superseded receipt should be CLOSED with a recorded reason, never merged to tick a box). Then fix the CLASS, which is the actual ask: an automation PR that falls behind main has no mechanism to catch up, so it rots into a permanent red. Say plainly which of these it is -- (a) the automation workflow should rebase-or-reopen rather than leave a stale branch; (b) commit-to-main should land directly and never open a PR for a receipt; or (c) the time-based guards should read the freshest receipt across open PRs rather than only main. A NULL IS AN ANSWER: if the honest finding is that these receipts should not gate every PR at all, say so with the evidence. NOT SUFFICIENT: landing #11488 and stopping -- that clears today's red and leaves the class, which is how this recurs tomorrow. ⚠️ NEVER skip, disable or quarantine a guard to get green, and never push an empty commit to kick CI.

why: >-
  MEASURED 2026-09-09T07:48Z. check_trainer_capture_watch.py exits 1 on CLEAN MAIN -- 'newest recorded run is 15.1h old (window 15h)'. It is repo-wide: every open PR is red on it. The refreshed receipt EXISTS, in automation PR #11488 (opened 04:54Z), which has been unmergeable since. So a guard that watches a cadence is now reporting the failure of the LANDING path rather than of the cadence, and nobody can clear it by fixing the watcher. The manager cannot land #11488: its branch is ~3h stale, so bringing main in creates a merge commit whose FIRST-PARENT diff carries scripts/ and tests/, which check_manager_scope R2 attributes to the manager as doing an item. That is MI-184 / BL-20260908-THE-MANAGER-MUST-RUN-THE-MERGE-QUEUE-BUT-R2-FORBIDS-IT-AUTHORING-THE-COMMIT-THAT-RESOLVES-A-REGISTER-CONFLICT exactly, hit live. #11494 fixed the R13 half of the automation deadlock and #11500 proved it, and #11509 fixed a second content half -- this is a THIRD, distinct cause: an automation PR that goes STALE cannot self-heal, because nothing re-bases it and its author is a bot that will never come back.

findings: >-
  THE CLASS ANSWER IS (a), AND THE FIX CANNOT LIVE WHERE (a) IMPLIES. The
  producing workflow already does everything (a) asks: all 25 of 25
  `commit-to-main` call sites set `verify-merged: true` (measured by parsing
  every workflow that references the action -- an earlier grep-based count of 7
  was a `-A12` window artefact and is retracted), and `refresh-stale-branch`
  merges main in and DOES work -- #11499's head is a `Merge main so the required
  checks re-run` commit. But every bit of that lives inside the PRODUCING RUN'S
  OWN LIFETIME: one `verify-timeout-minutes` window (default 30), one refresh
  attempt. When the job exits the branch has NO OWNER, and any blocker outliving
  that window strands it permanently while the producer's next cron opens
  another that strands identically. So the fix is a CADENCE JOB that outlives
  the producer, not another input to it -- `.github/workflows/stale-automation-sweep.yml`
  + `scripts/ops/sweep_stale_automation_prs.py`, 2h, refresh-only.
  (b) IS REFUSED AS NOT IMPLEMENTABLE: `main` is branch-protected and rejects a
  direct workflow push (GH006) -- that is the documented reason `commit-to-main`
  exists at all. "Land receipts directly" means removing branch protection from
  the path that writes to main most often, i.e. creating an unguarded lane, the
  polarity failure this repo already paid for with `new-table-wiring-guard`.
  (c) IS REFUSED AS WRONG ON PURPOSE: a time-based guard reading the freshest
  receipt across OPEN PRs would grade an unlanded receipt as if it had landed,
  so a watcher whose output can never merge would read `fresh` forever -- the
  guard going quiet in exactly the state it exists to announce. It would also
  make a required check depend on live GitHub API state at CI time, so the same
  commit grades differently on re-run.
  AND THE NULL IS REFUSED TOO, with evidence: the receipts SHOULD keep gating
  every PR. The guard did its job -- it went red at 07:44:31Z and the condition
  was visible repo-wide within minutes. What failed is that the REMEDY path is
  not as automatic as the alarm.

what_was_established: >-
  (1) `check_trainer_capture_watch.py` exits 1 on clean main was TRUE at
  07:4x-07:5xZ and is now FALSE: verified exit 0 on a clean `origin/main`
  checkout. Main was red for 12 minutes, 07:44:31Z -> 07:56:53Z.
  (2) IT WAS NOT #11488 THAT LANDED THE RECEIPT, AND IT WAS NOT LUCK EITHER.
  Commit d9059a0 (#11513) carried `docs/claude/work/TRAINER-CAPTURE-WATCH.json`
  in. ⚠️ I FIRST RECORDED THAT AS AN INCIDENTAL SIDE-EFFECT AND IT IS WRONG --
  corrected after reading #11513's pre-squash commits. Commit fcd152b9 by
  session_01DUBXxiaZ3PMERcAfcJce7P is titled `port the stranded
  trainer-capture-watch receipt: main went red on the clock`. That session hit
  the repo-wide red, established it was not its own PR's fault by reproducing it
  on a clean worktree of origin/main, checked the receipt's PROVENANCE rather
  than assuming (its producing run reads conclusion=failure, but the receipt was
  written 26s in and the failure came 31min later reading verbatim
  `commit-to-main: PR #11488 did not merge within 30m` -- the MEASUREMENT
  succeeded, only the LANDING failed), and ported it under the drive-to-green
  rule. THE DISTINCTION IS LOAD-BEARING AND CHANGES THE TRIAGE: an incidental
  side channel would mean receipts reach main unreliably and the open automation
  queue is partly phantom; a DELIBERATE PORT means the landing path is reliably
  broken and a human-equivalent actor had to stop its own work to hand-carry the
  payload. The second is what happened. It is the stronger case for the class
  fix, not a weaker one -- and it is the same defect that session recorded
  independently, from its own side, as `a self-blocking loop`. #11488 is
  therefore SUPERSEDED, not pending -- byte-identity verified twice, at d9059a0
  and again at c499481 -- and is now CLOSED with a recorded disposition.
  (2b) THE SWEEPER WOULD HAVE MADE THAT PORT UNNECESSARY, and this is checkable
  rather than asserted: before the port, main's receipt was 2026-09-08T16:44:31Z
  and #11488's was 2026-09-09T04:53:57Z, so #11488 graded `refresh` -- the one
  actionable state. The refresh path merges main in AND writes the R13
  merge-slot claim via claim_merge_slot.py, which is precisely what #11488
  lacked. Any sweep after 06:37:54Z (when that script reached main) would have
  unstranded it without a session touching it.
  (3) #11488 WAS NEVER RED ON `trainer-capture-watch`. Its guards run
  (34312758346) reads `PASS 53 - FAIL 1` and the 1 is `pr-landing-guard` on
  R13, reproduced locally on the real branch name. It was opened 04:54:00Z;
  MI-208/#11494 taught the action to write the claim at 06:37:54Z. A pre-fix
  branch.
  (4) THE THREE CAUSES ARE ONE RELAY ON ONE QUEUE, each becoming the blocker as
  the previous is fixed: R13 until 06:37:54Z (#11494); `session-registry-guard`
  06:38Z->~07:36Z (#11509); `trainer-capture-watch` 07:44:31Z->07:56:53Z
  (#11513, by side-effect).
  (5) POPULATION 50 open `automation/*` PRs of 52 open PRs. 47 carry no R13
  claim; the cut is exact and confirms #11494 works (#11493 opened 06:00:16Z has
  none, #11499 opened 06:38:14Z has one).
  (6) FOUR always-run guards grade a dated receipt that must LAND on main --
  check_digest_liveness (6h), check_trainer_capture_watch (15h),
  check_pr_queue_watch (30h), check_manager_queue_watch. The same trap is live
  on a second one now: #11490 carries a PR-queue-watch receipt that cannot land.

fourth_mechanism_measured_after_the_fix: >-
  ⚠️ MEASURED 2026-09-09T09:30Z, AFTER this WO's class fix was written, and it
  SHARPENS the class rather than contradicting it. PR #11518
  (`automation/work-digest-34327540243-1`, opened 08:21:03Z) POSTDATES #11494
  and carries a valid R13 claim, so it is NOT the cause #11494 fixed. Every step
  measured, not inferred: (1) `commit-to-main`'s stale-branch refresh FIRED AND
  WORKED -- its head 9ce35856 is literally `Merge main so the required checks
  re-run against the current base`, with a resolved session-board conflict;
  (2) all four required checks went GREEN on that sha at 08:31-08:33Z;
  (3) auto-merge was armed at open time; (4) it is STILL OPEN an hour later and
  a trial merge against current main CONFLICTS in BOTH
  docs/claude/session-board.json AND docs/claude/work/WORK-DIGEST.json.
  ⚠️ AUTO-MERGE DOES NOT RESOLVE CONFLICTS -- it waits silently and forever, and
  the producer's ONE refresh attempt is already spent with its run exited. So a
  PR can be green, armed, correctly claimed and STILL permanently stranded, and
  the strand is invisible because every signal on it reads healthy.
  THE CLASS THEREFORE HAS TWO SUB-CASES, and only one is mechanically fixable:
  (i) the only conflict is the R13 slot file -- the sweeper refreshes it, taking
  main's board and re-asserting the claim, and the PR lands; (ii) a DATA
  conflict between two generator runs -- no rule can settle it without
  discarding one run's output, so the sweeper REFUSES and reports, and the older
  PR must be closed with its append-only rows rescued first. That limit is
  written into the sweeper's own docstring rather than left to be discovered,
  and filed as
  BL-20260909-A-GREEN-ARMED-AUTOMATION-PR-STALLS-FOREVER-WHEN-MAIN-MOVES-BECAUSE-AUTO-MERGE-DOES-NOT-RESOLVE-CONFLICTS.
  ⚠️ AND THE RATE IS THE REAL PROBLEM: over the 75 minutes of this session the
  open `automation/*` queue went 50 -> 51 (two opened, #11518 and #11525; one
  closed, #11488, closed BY HAND). It grows faster than hand-triage drains it.

