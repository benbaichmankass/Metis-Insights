  `undated_payload` 13 · `carries_append_only` 10 · `superseded_by_open_pr` 1
  (#11458, beaten by #11490).

  SEVENTEEN of those 53 are `reconcile-open-prs` PRs and EVERY ONE grades
  `superseded_older`. Two of them -- #11499 (opened 06:38:14Z, twenty seconds
  after #11494 landed) and #11506 -- were run through `check_pr_landing.py`
  LOCALLY UNDER THEIR REAL BRANCH NAMES and both read
  `pr-landing: OK — state=declared_self_land`. So they carry a valid R13 claim,
  they COULD land, and they did not: they were SUPERSEDED WHILE WAITING. The
  reconciler opens a PR on every merge to `main`, so a receipt goes stale faster
  than the previous one clears the queue.

  This is a SECOND mechanism, distinct from the R13 strand and from the fourth
  mechanism above (a green armed PR stranded by a conflict auto-merge will not
  resolve). It is ALREADY FILED as
  BL-20260906-THE-OPEN-PRS-RECONCILER-FIRES-PER-MERGE-SO-A-BUSY-DAY-STACKS-N-STALE-PRS-FOR-ONE-DERIVED-EDIT,
  so no new row was opened -- filing a duplicate would make the backlog worse,
  which is the failure `backlog_append.py`'s duplicate check exists to stop. What
  is NEW here is the measurement against a stated population, and it belongs on
  that row rather than in a second one.

  ⚠️ THE SWEEPER DOES NOT FIX THIS AND MUST NOT BE READ AS DOING SO. It refuses
  to refresh a superseded PR on purpose -- refreshing one would REWIND `main`.
  These 17 need CLOSING with a recorded disposition, which is a human act.

