  are. What it cannot do is the "manually" part, and nothing else was going to.

  ⚠️ THE RATE LIMIT IS PLAUSIBLY SELF-INFLICTED AT THE ORG LEVEL AND I AM NOT
  GOING TO PRETEND OTHERWISE: every Claude session in this repo acts as user id
  119055177, so sessions polling CI through the MCP and `gh pr create` inside
  `commit-to-main` draw on ONE quota. This session has been making MCP calls
  against this repo throughout.

  ⚠️ THE BLIND SPOT IS IN THE CLASS FIX ITSELF. sweep_stale_automation_prs.py
  enumerates the OPEN-PR LIST, so a branch that never got a PR is invisible to
  it. The premise -- "the branch has no owner once the producing run exits" --
  is right; the INPUT SET is wrong. It should iterate BRANCHES, not PRs.
  MEASURED: 157 origin/automation/* branches exist and 48 have an open PR. That
  is NOT 109 strands (most are closed or merged PRs whose branch survived), but
  the correct denominator for this mode is branches, and the sweeper never looks
  at it. NOT FIXED HERE -- iterating branches changes what the sweeper may act
  on and deserves its own review, so it is recorded rather than rushed.

  WHAT WAS DONE: #11557 opened BY HAND for the newest stranded digest branch --
  the step the rate limit prevented -- because check_digest_liveness (6h) had
  main expiring at 17:39Z and this branch carries 13:08:15Z. Checked before
  opening: newer than main's (no rewind), pr-landing OK under the REAL branch
  name, one pending-pings row main lacks (landing PUTS it on main, which is the
  direction those rows want), and conflicting with main on session-board.json
  ALONE -- sub-case (i).

second_defect_in_my_own_fix_append_only_blocked_LANDING: >-
  ⚠️ AND OPENING #11557 IMMEDIATELY EXPOSED A SECOND DEFECT IN THE SWEEPER,
  worse than the first. It graded `carries_append_only`, which is NOT in
  ACTIONABLE -- so the sweeper REFUSED to refresh the very PR opened to save the
  clock.

  MEASURED, population = the 49 open automation/* PRs at 14:18Z: ALL TEN open
  work-digest PRs grade `carries_append_only`, because a work digest ALWAYS
  queues a ping row. So the sweeper could NEVER refresh a work-digest PR, and
  check_digest_liveness (6h) is the TIGHTEST repo-wide guard, carried by exactly
  that class. The one mechanism built to keep those clocks alive was
  structurally unable to touch the tightest one.

  THE STATE WAS RIGHT AND ITS SCOPE WAS WRONG. It exists so a PR holding an
  unread operator ping is never CLOSED as cleanly superseded -- the motivating
  mistake in the module docstring. It was also blocking the REFRESH, and
  refreshing is what LANDS those rows on main. The safety property was stranding
  precisely the PRs whose rows most needed to arrive.

  FIXED: it is now an ANNOTATION applied AFTER the register verdict and exempt
  on REFRESH, so it can still only move a PR toward "a human must look" and
  never toward actionable. `older` is also asked BEFORE `newer`, so a PR
  carrying one of each cannot be refreshed into a partial REWIND (0 of 49 mix
  the two today -- the hole is closed before it is reachable). Three tests, two
  mutation-checked; the FIRST motivating mistake is re-pinned separately, and
  the REWIND reason now survives the annotation instead of being replaced by it.

  EFFECT: #11557 moved carries_append_only -> refresh, was refreshed to
  6cefccb4, and VERIFIED as effect -- merge-base equals main's tip, the slot file
  is in the branch's own diff, the claim names that branch, the receipt
  13:08:15Z and the extra ping row are both preserved, and check_pr_landing.py
  passes in a worktree checked out UNDER THE REAL BRANCH NAME. The other nine
  work-digest PRs correctly stay put: their registers are older than main's.

  ⚠️ AND ONE OPERATIONAL LESSON FROM THE FIRST ATTEMPT, which FAILED: the
  sweeper reported `could not check the branch out` because MY OWN working tree
  was dirty. It reported the failure rather than claiming success -- the
  post-false-success machinery doing its job -- but it is also an argument for
  the sweeper living in CI, where the checkout is clean, rather than being
  hand-run from a session's tree.

one_strand_LEFT_deliberately_and_what_would_change_that: >-
  MEASURED 2026-09-09T15:38Z, population = 158 origin/automation/* branches
  compared against main: EXACTLY ONE carries a receipt newer than main's --
  automation/data-commit-34347588537-1, PR-QUEUE-WATCH 11:50:12Z against main's
  05:15:42Z. It has NO pull request (fifth mode), no OPEN PR carries a newer
  PR-QUEUE-WATCH, and check_pr_landing.py passes under its real branch name.

  ⚠️ AND IT COMPOUNDS WITH THE SWEEPER'S REFUSAL RULE. Its conflict against main
  is NOT slot-file-only: `docs/claude/session-board.json` AND
  `docs/claude/work/PR-QUEUE-WATCH.json`. `refresh()` aborts on any conflict
  outside the slot file, so even with a PR the sweeper would leave it alone.
  This is the first observed case of a stranded branch the sweeper refuses for a
  reason OTHER than supersession.

  I AM DELIBERATELY NOT LANDING IT, and this is a decision rather than an
  oversight. check_pr_queue_watch has a 30h window and main's margin is +19.6h;
  pr-queue-watch's cron (`41 */6 * * *`) next fires ~17:41Z, so a fresher
  receipt is due through the NORMAL route in about two hours. Hand-resolving a
  PAYLOAD conflict on an automation branch is a larger act than opening a PR,
  and it buys ~6.5h of margin on a clock that has 19.6h. The digest case was the
  opposite on every count -- 3.2h of margin, no other carrier -- which is why
  that one WAS hand-landed as #11557.

  WHAT WOULD CHANGE THIS, stated so it is checkable rather than a feeling:
  EITHER the 17:41Z pr-queue-watch run also fails to open a PR (two consecutive
  failures is a pattern, not an incident), OR the pr-queue margin drops below
  ~6h with no fresher receipt on main. Either one, land it by hand.

proposed_narrow_extension_NOT_shipped: >-
  The refusal above is right in general and over-conservative here, and the fix
  is small enough to state precisely: on a conflict, if EVERY conflicted payload
  path is one the classifier already graded `newer` AND this PR is the newest
  holder of each, take the branch's version; anything else, abort as today. That
  is not a new judgement -- it is the SAME decision `REFRESH` already makes, and
  the conflict is incidental (git cannot merge two whole-file rewrites of a
  receipt).

  ⚠️ NOT SHIPPED, deliberately. It expands what the sweeper may do to a PAYLOAD
  file, and this session has already found TWO defects in this file by moving
  quickly -- the `--no-edit` false success and the append-only scope error. A
  19.6h margin does not justify a third. Write it with tests, against a stated
  population, when it is the thing being worked rather than a detour.

