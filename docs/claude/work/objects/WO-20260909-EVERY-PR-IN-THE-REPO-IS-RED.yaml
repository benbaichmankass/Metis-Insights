second_mechanism_measured_1258Z: >-
  ⚠️ THE R13 FIX IS REAL AND IT IS NOT SUFFICIENT, AND A SESSION READING ONLY
  `what_was_established` WOULD CONCLUDE OTHERWISE. Second live sweep,
