a_defect_in_MY_OWN_scan_method: >-
  ⚠️ AND I NEARLY MISREAD THE RECOVERY AS SILENCE, THROUGH A FLAW IN MY OWN
  MEASUREMENT. Every check-in this session I have scanned
  `origin/automation/*` branches for one pushed since the last look, treating a
  new branch as evidence that a run reached the push step. At 19:46Z that scan
  returned ZERO branches pushed since 18:39Z and I wrote "no run reached the
  push step; `gh pr create` untested since 17:55Z".

  THAT INFERENCE IS INVALID. A branch that SUCCESSFULLY lands is DELETED on
  merge. So counting surviving branches measures STRANDS, never ATTEMPTS, and
  "zero new branches" is equally consistent with "no run fired" and with "runs
  fired and every one of them succeeded" -- opposite facts. The scan is a
  perfectly good strand detector and a useless liveness probe, and I had been
  using it as both.

  WHAT DISTINGUISHES THEM is the RECEIPT ON MAIN: main's digest had moved
  17:54:05Z -> 18:53:58Z with no action from me, which is only possible if a
  producer landed one. Read the receipt, then attribute it to a commit
  (`git log origin/main -- docs/claude/work/WORK-DIGEST.json`), then read the PR
  to see whether a human or the action opened it. That is the sequence that
  actually answers "is the producer working", and it is what a successor should
  use instead of the branch scan.

finding_five_CORRECTED_the_branch_instrument_already_exists: >-
  ⚠️ CORRECTING MY OWN FINDING 5. I recorded that the sweeper is blind to
  PR-less branches because it enumerates OPEN PRS, and recommended that "it
  should iterate BRANCHES". A BRANCH-ITERATING INSTRUMENT ALREADY EXISTS ON
  `main`: `scripts/ops/stuck_automation_branches.py`. Verified 2026-09-10 by
  `git cat-file -e origin/main:...` — present on main and on this branch.

  ⚠️ AND IT HAD ALREADY MEASURED THE FIFTH MODE, TEN DAYS BEFORE I "FOUND" IT.
  Its own docstring: "Measured 2026-08-30: 7 of 7 automation/* branches were
  unmerged into main, two of them carrying open PRs a day old, and FOUR CARRYING
  NO OPEN PR AT ALL. Nobody had noticed, because the only way to see it is to
  list branches." That is the mode I spent an afternoon rediscovering from a
  rate-limit log. My contribution to it is the CAUSE (`gh pr create` failing on
  the shared per-user GraphQL quota) and the DURATION (4h47m through several
  hourly resets), not the existence.

  ⚠️ THIS IS THE `RC-BUILT-A-MECHANISM-THAT-ALREADY-EXISTED` RISK, AND IT WAS
  ONLY NOT PAID BECAUSE I DECLINED TO BUILD. CLAUDE.md prescribes a one-line
  existence check (`grep -n <name> scripts/`) BEFORE writing a capability. I did
  not run it when I wrote finding 5; I ran it today, ten days late, and only
  because another lane's commit message named the file. I got the right outcome
  for the wrong reason: I deferred the branch-iteration work as "not to be
  rushed", which happened to avoid a duplicate build. Do not read that as
  judgement — read it as luck, and run the check first next time.

  SO THE RECOMMENDATION CHANGES. The sweeper should COMPOSE with
  `stuck_automation_branches.py`, not reimplement branch enumeration. What that
  tool LACKS is precisely what this WO's workflow supplies, and the two halves
  are complementary rather than competing:
    - it is MANUAL-ONLY by its own wiring comment ("a session or operator runs
      this when triaging why an automation branch never landed"), so it has NO
      CADENCE — nothing runs it, which is the same "the alarm has no automatic
      remedy" shape this WO is about, one level over;
    - it REPORTS and GATES NOTHING, deliberately ("the judgement about what to
      do with a stuck branch is a human one") — so it never refreshes, never
      lands, and never re-asserts an R13 claim.
  The sweeper has cadence and a verified action path and the wrong input set;
  that tool has the right input set and neither. Joining them is the real fix
  for finding 5.

  ⚠️ AND IT IS CURRENTLY BROKEN IN A WAY THAT WOULD POISON THAT JOIN. Filed by
  another lane the same day as
  BL-20260910-STUCK-AUTOMATION-BRANCHES-GRADES-LANDED-BY-ANCESTRY-SO-LANDED-IS-DEAD-CODE-AND-EVERY-MERGED-BRANCH-READS-STUCK:
  `classify` decides LANDED with `git merge-base --is-ancestor`, which is
  unreachable in a squash-merge repo, so measured over all 712 remote-tracking
  branches EXACTLY ONE grades LANDED and it is `origin/main` itself. Every real
  merged branch reads STUCK. A sweeper that consumed that verdict today would
  try to refresh branches that already landed. Fix that row FIRST, then join.

  ⚠️ NOTE WHAT THIS DOES NOT CHANGE. The sweeper's own input set is still
  open-PRs, and I have still not shipped the change — this is a correction to
  the RECOMMENDATION, not work delivered. And the deeper point stands: the
  repo already owned an instrument that had seen this failure, it ran nowhere,
  and nobody read it for ten days. That is the same sentence as the WO's thesis.

the_mechanism_is_DEPLOYED_and_its_first_scheduled_run_is_STILL_UNOBSERVED: >-
  ⚠️ CORRECTING THIS OBJECT, 2026-09-10T15:11Z. Throughout this WO — in
  `sweeper_first_verified_unstrand`, in #11519's body, and in its `hold_text` —
  I wrote: "Every run was hand-run. The workflow is not on `main`, so it has no
  cron: the SCRIPT is proven, the MECHANISM is not." Every one of those
  sentences was true when written and the first two clauses are now FALSE. A
  session reading this object top-to-bottom would otherwise carry a claim the
  merge falsified.

  WHAT IS NOW TRUE, verified on `main` rather than taken from the merge report.
  #11519 merged as a1ec4a5c0 at 2026-09-10T15:09:10Z. On `main`:
  `scripts/ops/sweep_stale_automation_prs.py`,
  `tests/test_sweep_stale_automation_prs.py` and
  `.github/workflows/stale-automation-sweep.yml` all present; the workflow
  carries `schedule: cron '17 */2 * * *'` and `workflow_dispatch`; both the
  workflow and the script are registered in `LANDING_MACHINERY`
  (`scripts/ops/check_pr_landing.py:296-297`), so the sweeper is itself covered
  by R8/R12 and cannot self-land a change to its own machinery; 1 catalog row
  names it. GitHub's own view agrees and is the part that could not be read from
  the tree: workflow id 355025104, path `.github/workflows/stale-automation-sweep.yml`,
  `state: active`, created 2026-09-10T15:09:12Z. So the cron is REGISTERED, not
  merely written down in a file.

  ⚠️ WHAT IS STILL NOT OBSERVED, AND THIS IS THE HALF THAT MUST NOT COLLAPSE
  INTO THE HALF ABOVE. POPULATION: every run of workflow 355025104, all events,
  all branches, no status filter — `list_workflow_runs` returns
  `total_count: 0`. ZERO. The mechanism is DEPLOYED and has NEVER RUN. Those are
  two different states and this repo's own doctrine is that "we could not look"
  and "we looked and found nothing" must stay distinguishable; so must "it is
  installed" and "it ran". The next scheduled slot after the merge is 15:17Z,
  ~8 minutes after registration, and a newly registered cron is not owed its
  first slot.

  HOW THE FIRST RUN MUST BE READ, stated now so a later session cannot grade it
  loosely. (1) The run must EXIST with `event: schedule` — a `workflow_dispatch`
  I fire by hand proves the workflow file parses and nothing about the cadence,
  which is the entire class fix. (2) Read the SWEEP JOB'S OWN conclusion, never
  the run's top-level `success`: this WO already records the trap — work-digest
  run 34383191261 concluded `success` with its `digest` job SKIPPED behind a
  gate. (3) The sweeper exits 2 for COULD NOT LOOK, so a non-zero exit is not
  automatically a failed sweep and a zero exit is not automatically a completed
  one; read which. (4) Any refresh it claims must be verified as EFFECT against
  the merge-base, as every hand-run refresh in this WO was, and never from the
  sweeper's own report.

  ⚠️ AND WHAT A CLEAN FIRST RUN WOULD STILL NOT PROVE. Today's live triage
  grades 0 PRs `refresh` (the actionable state), so the likely first scheduled
  run does nothing and reports nothing to do. That IS the mechanism observed
  running — it is not the refresh path observed running in CI, which needs a
  `refresh` PR to exist at a slot boundary. The refresh path has been verified
  seven times end to end, all seven HAND-RUN from this session's tree, on a
  checkout this session controlled. CI runs it on a clean checkout with a
  different token and different push rights; the one operational failure this
  session hit (a dirty working tree) is precisely the difference between those
  two environments, so it is the untested half.

  NOTHING HERE CHANGES THE CLASS ANSWER. It remains (a) — the automation
  workflow should rebase-or-reopen — with the qualification stated in
  `findings`: the actor must OUTLIVE the producing run, which is why it is a
  cadence job and not another input to `commit-to-main`. What changes is only
  the status line: the answer is now SHIPPED and awaiting its first
  self-triggered execution, rather than proven-in-principle and unshipped.

the_cadence_WAS_SIZED_AGAINST_DECLARED_SLOTS_AND_GITHUB_DELIVERS_ONE_EVERY_4_9H: >-
  ⚠️ A DEFECT IN THE FIX THIS WO SHIPPED, FOUND 2026-09-10T16:25Z WHILE WAITING
  FOR ITS FIRST RUN, AND IT IS IN THE PART I ARGUED HARDEST FOR. The workflow's
  own header says the 2h cadence was CHOSEN — not defaulted — against the 6h
  window of `check_digest_liveness`, the tightest of the four repo-wide receipt
  guards, "so a strand gets ~3 sweeps before" that clock expires. That
  arithmetic assumes GitHub runs a cron at roughly its declared time. In this
  repo it does not, and the repo already knew.

  MEASURED, by the method and the control that
  BL-20260830-SCHEDULED-WORKFLOW-LAG-WENT-FROM-1H-TO-6-12H-ON-2026-08-27 itself
  uses. POPULATION: purge-artifacts.yml (`0 3 * * *`), the 40 consecutive
  `event=schedule` runs from 2026-08-02 to 2026-09-10, lag = run_started_at
  minus the most recent 03:00Z, computed per run. Before 2026-08-27:
  0.66-3.42h. The break that row records reproduces to its own four figures
  (10.88, 12.01, 6.80, 5.98h). The eleven days SINCE are new: 6.43, 5.38, 4.70,
  4.85, 4.78, 4.47, 4.70, 5.01, 4.88, 4.93, 4.93h — not reverted, no longer
  drifting, SETTLED on a ~4.9h plateau.

  SO THE SWEEPER GETS ABOUT ONE SWEEP PER `check_digest_liveness` WINDOW, NOT
  THREE, and declaring 2h buys nothing a 4h declaration would not: 2h is BELOW
  the lag. Worse for a tight cadence, the slots do not merely arrive late, they
  COALESCE. POPULATION: error-feed-digest.yml, declared HOURLY at :35, its last
  40 `event=schedule` runs spanning 146.9h to 2026-09-10T14:37Z — 40 runs
  against ~147 declared slots is 27%, median gap 4.04h, fire minute scattered
  over 31 distinct values and essentially never :35. A constant lag would
