decision_requests:
  - id: DEC-20260909-CLOSED-FLAT-INVARIANT-CANNOT-SEE-A-FAILED-READ
    question: >-
      The closed->exchange-flat invariant - the one mechanism that can independently contradict
      'this trade is closed' - returns 0.0 (flat, no violation) when the exchange read FAILS, at
      5 of 5 early-return sites. It composes with F-12 (60s lookback against a >=101.9s
      invocation period, so >=41% of the timeline is examined by nobody) and F-13 (writes to a
      log on no read surface, pages at WARN which outcomes excludes from Telegram). Its 14.7-day
      zero is not evidence of anything. Tier-2.
    urgency: high
    asked_on: '2026-09-09'
    context: >-
      Audit F-11 + F-12 + F-13. F-11: closed_flat_invariant.py:243-244 `if not positions: return
      0.0`, whose input clients.py::account_open_positions returns None BY CONTRACT so callers
      can distinguish 'no positions' from 'could not read' - including an empty IB snapshot from
      a Gateway not verified logged-in. _exchange_residual_qty also returns 0.0 at :210, :223,
      :232 (account unresolvable; account_open_positions raised; fetcher() raised), and the
      caller reads residual == 0.0 as no violation. POSITIVE CONTROL that the convention is
      honoured elsewhere: hourly_report.py:335 `open_count = len(positions) if
      isinstance(positions, list) else None`. Of the 2 consumers of account_open_positions in
      src/ outside order_monitor, 1 is correct and 1 collapses. F-12: window
      DEFAULT_WINDOW_SECONDS = 60 at :62, never overridden (1 of 1 call sites), against a
      measured period of >=101.9s - two independent measurements, /api/diag/tick_cost implying
      124.3s mean and a durable 888-row WARN feed over 14.7 days whose once-per-tick
      inter-arrival gaps are n=140 with a MINIMUM of 101.9s and 0 of 140 at or under 60s. Only
      that minimum is a sound bound and that is what the claim uses. F-13:
      invariant_violations.jsonl is on no diag allowlist (57 names scanned vs 23 writers; 6
      unreadable, of which 4 have an alternate surface and this one has none) and the alert is
      Level.WARN while outcomes.py:76 restricts Telegram to ERROR and CRITICAL.
    options:
      - key: all_three
        label: Fix all three - F-11 + F-12 + F-13
        implication: >-
          Register closed_flat.residual_state (flat / residual / could_not_look) so a failed
          read grades unknown and does NOT clear the invariant; derive the lookback from the
          caller's own cadence so consecutive checks tile the timeline; put
          invariant_violations.jsonl on the diag allowlist and raise the alert to a level that
          reaches Telegram. The composition IS the finding. The guard F-11 needs already exists
          and already fails on a state no consumer branches on, so that half is a REGISTRATION,
          not a new instrument.
      - key: f11_only
        label: F-11 only, then soak
        implication: >-
          Smallest correct step. The invariant would then see a failed read but still miss ~41%
          of its own timeline and still write where nobody looks, so it would remain unable to
          produce evidence anyone could act on.
      - key: f13_first
        label: F-13 first - make it readable
        implication: >-
          Visibility before logic. It would then reliably report a number still blind to failed
          reads and still covering ~half the timeline - a readable figure that is not
          trustworthy, which this repo treats as worse than an unreadable one.
      - key: record_only
        label: Nothing yet - record the decision
        implication: >-
          All three stay filed as a deliberate decision rather than an omission, so the 14.7-day
          zero is never re-quoted as evidence the book is clean.
