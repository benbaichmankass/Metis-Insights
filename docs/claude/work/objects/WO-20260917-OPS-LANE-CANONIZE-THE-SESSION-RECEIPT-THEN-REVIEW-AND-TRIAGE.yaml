decision_requests:
  - id: DEC-20260917-SESSION-RECEIPT-CADENCE
    question: >-
      Is a session receipt generated ON DEMAND (when you ask for one) or WRITTEN
      AT SESSION END (every session, automatically)?
    urgency: routine
    asked_on: 2026-09-17
    asked_by: session_0178pRo8ZxrnrREzDzDzb9Zk
    context: >-
      MI-290 left this open in terms — "a decision that is NOT pre-made here" —
      and the OPS lane is not resolving it by building only one.

      THE TRADE-OFF, stated in both directions. ON DEMAND can measure a LIVE
      session (commit attribution and PR verification both read origin/main at the
      moment you ask, so the answer is current), and it produces nothing when
      nobody asks — which is most sessions. AT SESSION END survives the session's
      DEATH, which is when the record is worth most, and it cannot be produced by a
      session that died before writing it — so it is not a guarantee either, it is
      a better default.

      ⚠️ NEITHER IS BLOCKED AND THE UNION IS ALREADY SHIPPED. The generator runs
      on demand (it is a script) and `--write` lands the durable artifact; the
      Workflow page reads whatever has been written. So this decision sets the
      CADENCE a skill instructs, never whether the capability exists. Until it is
      answered the skill says: generate on demand AND --write when you wrap.

      ⚠️ MEASURED 2026-09-17 AND IT BEARS ON THE ANSWER — sessions do not
      reliably survive to write anything. Over the 8 in_flight work objects, 6
      carry a resolvable owner and 6 of 6 are IDLE or ARCHIVED, five reporting
      `completed` in their own summary while their object still reads in_flight.
      An at-session-end receipt would have been written by the five that completed
      and NOT by anything that died mid-turn, so it improves the record without
      guaranteeing it.

      ⚠️ AND A WARNING ABOUT HOW THIS QUESTION REACHES YOU. The Telegram decision
      channel is MEASURED FAILING: over 47 consecutive sweep runs recovered from
      the tail of runtime_logs/work_decision_sweep_receipt (2026-09-17T15:24:29Z to
      19:06:44Z, 3.70h), `candidates: 4` and `failed: 4` on 47 of 47, with
      `prompted_choice: 0` on 47 of 47 — while `checked: true`, `paused: false`,
      `held_route: 0`, `held_not_polled: 0`, `destination: claude` and
      `poll_state: polled_with_handler` throughout. So the channel reports itself
      healthy and routed and delivers nothing, and four pending decisions have been
      failing to send every run. This question is therefore ALSO being put to you
      through the manager in conversation, and must not be left to the channel.
      Filed as
      BL-20260917-THE-WORK-DECISION-SWEEP-REPORTS-ITSELF-HEALTHY-AND-ROUTED-WHILE-FAILING-TO-SEND-EVERY-CANDIDATE-ON-47-OF-47-RUNS.
    options:
      - key: on_demand
        label: On demand only
        implication: >-
          A receipt exists only when you ask for one. Cheapest, always current,
          and the record is absent for every session nobody asks about — which is
          most of them, and includes every session that died.
      - key: at_session_end
        label: Written at session end, every session
        implication: >-
          Every session that reaches its wrap leaves a record the Workflow page
          can serve. Costs one generator run per session and produces receipts
          nobody reads. Does NOT cover a session that dies mid-turn.
      - key: both
        label: Both — write at session end, and regenerate on demand
        implication: >-
          What the skill currently instructs, and what the 2026-09-17 delivery
          actually was. Most robust, and it means the page can serve a stale
          receipt for a live session, so the page must show the generated_at
          stamp (it does).
      - key: manager_sessions_only
        label: At session end for MANAGER sessions only
        implication: >-
          Targets the case the format was designed for — a manager accounting for
          the lanes it spawned — and leaves worker lanes to the on-demand path.
          Section B (SESSIONS SPAWNED) is empty for a worker lane anyway.
