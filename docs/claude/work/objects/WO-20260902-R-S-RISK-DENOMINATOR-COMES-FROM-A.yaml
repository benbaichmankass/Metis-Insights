decision_requests:
- id: DEC-20260902-R-METRIC-FALLBACK
  question: >-
    When the R-metric fix lands, what should r_multiple do for a row with no trustworthy
    initial-stop basis: keep using the trailed stop_loss, or return None?
  urgency: routine
  asked_on: 2026-09-02
  asked_by: session_011JWFxuYAaEQKCFCmG6gnHJ
  context: >-
    #10748 shipped the DETECTOR only and changed no existing number — totalR, expectancyR,
    rTradeCount and rCoverage are byte-identical, asserted by test. The Tier-3 fix is a 5-step
    sequence in its §5 and was deliberately NOT made; step 4 is this choice and the PR takes no
    position.
    MEASURED, n=1346 closed non-backtest rows: 118 contaminated, 156 confirmed_initial, 1051
    unverified (78.1%), 21 no_basis; worst row R = +3672.32. ~51% of history (682 rows) is
    BACKFILLABLE from order_packages.meta.risk_per_unit, so the fix is not forward-only; the other
    ~49% — including all 318 vwap real-money rows and all 283 pairs rows — has no independent record
    and is permanently ungradeable.
    ⚠️ CONTEXT THAT TRAVELS WITH EVERY R FIGURE: fleet pnlCoverage is 0.126, so 87% of this fleet's
    PnL is not a measurement and no R conclusion is firmer than that.
    ⚠️ AND THE SEVERITY IS LOWER THAN IT WAS BRIEFED: #10748 checked both automated gates and NEITHER
    reads R — the M7 packet keys on dollars/win-rate/n, the R4 gate on coverage. This reaches
    decisions through human and Claude REVIEW verdicts, not automated promotion.
  options:
  - key: keep_stop_loss_fallback
    label: Keep falling back to stop_loss, with the row flagged unverified
    implication: >-
      R stays computable for 100% of rows and rCoverage does not move, but ~78% of it is flagged
      unverifiable. Every consumer keeps working; the honesty lives in the flag, which only helps a
      reader who looks at the flag.
  - key: return_none
    label: Return None when there is no trustworthy basis
    implication: >-
      R becomes honest but thin — rCoverage drops toward the confirmed-plus-backfilled fraction, and
      review sessions lose R for most rows rather than reading a contaminated one. Surfaces that
      assume R is always present will need to render a gap.
  - key: decline_the_tier3_fix
    label: Do not do the Tier-3 fix at all; keep only the detector
    implication: >-
      The contamination stays and is now visible. Legitimate if R is not load-bearing enough to
      justify a money-DB migration and a backfill — and the finding that no automated gate reads R is
      the argument for it. Must be RECORDED as a decision rather than drifted into.
  allows_free_text: true
  answer:
    chosen: return_none
    free_text: null
    answered_at: '2026-09-03T07:07:08Z'
    answered_by: operator
    committed_by: manager session_01Nopk1HcpvWBSEbZxEmALkd (decision pop-up, relayed)
    submission_id: bdd225d7e4b5688d8d3f003c7d7c5464
    note: >-
      Operator, 2026-09-03, decision pop-up. r_multiple returns None where there is no trustworthy in
      itial-stop basis, rather than falling back to the trailed stop_loss. Consistent with the repo's
       own doctrine that 'we did not look' must never be collapsed into a measured value (CLAUDE-RULE
      S-CANONICAL § Collapsed states). ⚠️ THE COST IS ACCEPTED AND STATED: R coverage falls and some 
      surfaces render an em-dash instead of a number. That is the honest reading. The alternative man
      ufactures an R that reads as measured, and R feeds PROMOTION GATES -- so a fabricated R can pro
      mote a strategy. ⚠️ THE WORK IS PHASE 3 under the operator's 2026-09-03 sequencing (finish the 
      workflow build -> review the roadmap together -> then actual work). This answer UNBLOCKS it; it
       does not schedule it.
