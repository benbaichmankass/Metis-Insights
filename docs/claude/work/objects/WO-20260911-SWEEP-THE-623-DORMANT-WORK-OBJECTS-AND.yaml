decision_requests:
- id: DEC-20260911-WORK-STORE-BACKLOG-MIRRORS
  question: 554 dormant work objects are 1:1 mirrors of review-backlog rows that are still open.
    Should the work store keep carrying them?
  urgency: routine
  asked_on: '2026-09-11'
  context: 'MEASURED over all 710 work objects at `main` 4e9255acb on 2026-09-11: 622 were `dormant`,
    and 575 of those are Phase-C bulk migrants from 2026-09-01. All 575 join to a live backlog
    row (0 unmatched — the positive control). 21 have since had their backlog original reach a
    terminal status and were closed under a checkable rule. The remaining 554 mirror rows that
    still read `open` (325) or `kept_open` (229). THE TENSION IS IN THE MIGRATION''S OWN NOTE:
    "The backlog row remains the state of record for the FINDING and its updates; this object
    is the state of record for the WORK of dealing with it." For these 554 there is no work —
    no owner, no intent, nothing scheduled. So each is the state of record for work that does
    not exist, and 554 of them are the pile you saw on the Work page. ⚠️ NONE OF THE OPTIONS CLOSES
    A SINGLE FINDING. The backlogs (1446 + 117 + 109 + 19 rows) remain the state of record either
    way. The question is only whether the work store carries a second copy. Do not let any option
    be reported as "closing 554 items". ⚠️ AND THE SWEEP DELIBERATELY DID NOT PICK ONE: option
    (b) reverses a Phase-C decision, and enacting that on 554 rows on a session''s own judgement
    is the bulk-pass harm this item was told to avoid.'
  options:
  - key: keep_all
    label: Keep them — the pile is the honest state
    implication: 'The Work page keeps showing ~555 dormant rows and that number is CORRECT: there
      really are that many carried, unstarted findings. Nothing changes; the operator accepts
      the page as a census rather than a queue. Cheapest, and it leaves the original complaint
      ("it just doesn''t make sense that our workflow has this many dormant items") unaddressed.'
  - key: retire_mirrors
    label: Retire the mirrors — the backlog keeps the finding
    implication: 'The 554 migrant objects are removed from the work store; the backlog rows they
      mirror are untouched and remain the state of record. Dormant drops to ~1 and the Work page
      becomes a view of work someone has committed to. COST, stated: the Phase-C migration is
      reversed, and anything that later wants "which findings have work objects" must read the
      backlog instead. Nothing is lost — every one of the 554 was verified to join a live backlog
      row.'
  - key: promote_high_severity
    label: Keep only the high-severity ones, retire the rest
    implication: 'Of the 575 migrants, `severity` at migration was high 160 · critical 7 · medium
      252 · low 111 · unset 40. Keeping high+critical and retiring the rest leaves roughly 160
      dormant rows. ⚠️ WEAKEST OPTION ON ITS OWN TERMS: severity is a property of the FINDING,
      which the backlog already records, so this splits one register across two files by a field
      neither owns — and a low-severity finding would then be invisible in the store while a copy
      of it lives in the backlog.'
  - key: retire_and_render_backlog
    label: Retire the mirrors AND surface open backlog counts on the Work page
    implication: As `retire_mirrors`, plus the Work page gains a read-only count of open backlog
      rows per review backlog, so retiring the mirrors does not make the findings less visible
      than they are today. Most work; addresses both the pile and the visibility worry it would
      otherwise create. Requires a renderer change.
  allows_free_text: true
  asked_by:
    session_id: session_01LoZJDARzLr1REPnqQ5Kgbz
    recorded_at: '2026-09-11T00:00:00Z'
    note: MI-243 — the answer decides whether the remaining 554 dormant rows stay. Everything
      else in MI-243 is delivered and is not waiting on this.
  answer:
    chosen: retire_mirrors
    free_text: 'Operator answered directly in conversation, as a pop-up raised by the manager
      at 2026-09-11T05:5xZ. The 554 Phase-C migrant mirror objects leave the work store; the backlog
      rows they mirror are UNTOUCHED and remain the state of record for every finding. !! THIS
      CLOSES ZERO FINDINGS AND MUST NEVER BE REPORTED AS CLOSING 554 ITEMS -- the option said
      so and the answer does not change it. The backlogs (1446 + 117 + 109 + 19 rows) are unaffected.
      !! IT REVERSES THE PHASE-C MIGRATION OF 2026-09-01, deliberately and on the operator''s
      instruction. Anything that later wants ''which findings have work objects'' reads the BACKLOG,
      not this store. !! THE LICENCE IS NARROW: it covers the 554 rows verified to join a LIVE
      backlog row (all 575 migrants joined, 0 unmatched -- the positive control). A row that cannot
      be shown to join one is NOT covered and stays where it is; ''we did not look'' is not ''retire
      it''. !! AND IT IS NOT A LICENCE TO BULK-CLOSE ANYTHING ELSE. The work store''s README records
      the 2026-09-01 bulk pass doing real harm. Retiring a verified MIRROR is not the same act
      as closing a row nobody read.'
