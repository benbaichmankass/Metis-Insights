decision_requests:
  - id: DEC-20260918-INVERSE-PROXY-BUILD-ORDER
    asked_by: session_01Ex5Dx1TMYy46ncsp8eptpx
    question: >-
      The 2026-08-25 decision was to build SH (-1x SPY) and PSQ (-1x QQQ) first, because
      they were the most liquid AND because alpaca_live then routed four SPY/QQQ legs
      carrying 79 short packages. That roster was emptied on 2026-08-29 and rebuilt without
      SPY or QQQ; the account now routes TLT x2, IEF, SLV and IAUM. So the two sequenced
      first serve no leg here, and the two that do serve it -- TBF (-1x TLT) and TBX
      (-1x IEF) -- are the pair sequenced second, TBX being the one flagged as possibly too
      thin at ~$14M AUM. Each proxy is multi-session Tier-3 work. Which order?
    options:
      - key: reaffirm_sh_psq_first
        label: >-
          Keep SH+PSQ first. Proving the mirror-leg pattern on the most liquid pair has
          value independent of which legs route today, and the paper accounts that DO route
          spy/qqq_pullback_1h can exercise it. Costs: the first proxy built recovers no
          real-money flow, and the design blockers must be solved anyway.
      - key: reorder_tbf_first
        label: >-
          Build TBF (-1x TLT) first. It is the only candidate serving a routed leg at
          meaningful volume -- 11 of the 12 short packages the current roster produced --
          and at ~$80M AUM it is liquid enough to be a real test. Costs: a smaller fund
          than SH, so a liquidity failure here would be less informative about the pattern.
      - key: wait_for_the_roster
        label: >-
          Build nothing yet. The roster has changed three times in three weeks (16 -> 0 ->
          1 -> 5); sequencing a multi-session Tier-3 build against it is what produced this
          question. Revisit once the roster is stable. Legitimate, and must be RECORDED as
          a decision rather than left looking like work about to start.
      - key: drop_the_proxy_programme
        label: >-
          Record the short side as knowingly dead on alpaca_live and stop spending sessions
          on proxies. 41.4% of the current roster's flow is suppressed and stays suppressed.
          Legitimate; it must be RECORDED, with the suppressed share restated so no later
          session reads those legs' expected contribution at face value.
