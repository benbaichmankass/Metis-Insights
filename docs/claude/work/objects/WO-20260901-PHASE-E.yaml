  # EXISTS — has been satisfied since A's first commit. A false blocker is worse
  # than a missing one: it is exactly what E1's constraint computation would later
  # read, and it would have said "we are waiting" while two phases were available.
  # An edge must name the CONDITION, never the object that happened to create it.
