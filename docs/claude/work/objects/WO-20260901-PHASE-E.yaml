review_trigger: >-
  Re-read when the phase it depends on closes, or when the operator changes the cycle
  priority. A dormant phase is not a queued one — it is re-argued when it becomes reachable.

done_condition: >-
  Killing a session mid-work loses nothing, DEMONSTRATED by killing one. Not
  asserted from a test.

  # ⚠️ CORRECTED 2026-09-01, and the correction is the point. This edge read
  # `object: WO-20260901-PHASE-A`, which was WRONG in the direction that matters:
  # Phase A is `waiting` on a COLD SESSION'S OBSERVATION that may be days away,
  # so the graph reported this phase blocked when its real dependency — THE STORE
  # EXISTS — has been satisfied since A's first commit. A false blocker is worse
  # than a missing one: it is exactly what E1's constraint computation would later
  # read, and it would have said "we are waiting" while two phases were available.
  # An edge must name the CONDITION, never the object that happened to create it.
blocked_on:
  - kind: object
    ref: redesign the lease so it needs no session-held WRITE credential
    since: 2026-09-01
    note: >-
      ⚠️ THIS EDGE WAS `capability: DASHBOARD_API_TOKEN propagation` UNTIL 2026-09-01 AND
      THAT WAS WRONG. The operator decided the write token must NOT go into the session
      environment: that config field says in terms "don't add secrets or credentials" and
      is visible to anyone using the environment, and DASHBOARD_API_TOKEN also authorises
      prop-journal writes. So the blocker is not a credential waiting to be moved — it is
      a DESIGN question that has not been answered: where does the lease live if a session
      cannot hold a write credential? The likely answer is the repo, consistent with the
      wipe test, at the cost of commit noise. Recording it as a credential-propagation
      edge would have made this phase look one paste away from unblocked when it is not.

note: >-
  F2 close-out verification and F5 exit verification are ONE hook, not two:
  same moment, same mechanism, same session. close_session.py (354 ln) already
  does the right things but is SESSION-INVOKED, so a session that dies never
  runs it. ⚠️ The transit contract is part of the done-condition: three states
  never collapsed (not_submitted · in_transit · committed), and transit fails
  BACK never forward.

