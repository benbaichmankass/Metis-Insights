# ============================================================================
# THE BLOCKER IS ANSWERED. Operator-directed, 2026-09-01.
#
# The edge above read: "where does the lease live if a session cannot hold a
# write credential?" It is struck rather than deleted, because the reasoning
# that produced it is what makes the answer defensible.
#
# THE OPERATOR'S REQUIREMENT, which decides it:
#   - work runs continuously, across days
#   - EXACTLY ONE management session at a time, never two concurrent
#   - a NEW manager must be able to take over the previous manager's
#     sub-sessions
#   - sub-sessions must NOT be dependent on any particular manager
#
# THE ANSWER: THE REPO. Not by elimination — by the requirement. A lease that
# must survive its holder's DEATH and be readable by a session arriving COLD
# cannot live in any session's memory, and cannot live behind a credential no
# session is allowed to hold. The wipe test already pointed here; the operator's
# requirement removes the remaining choice. Commit noise is the accepted cost.
# ============================================================================

lease_design:
  # ⚠️ MEASURED CONSTRAINT, tested rather than assumed (2026-09-01): a manager
  # session CANNOT message a sub-session. SendMessage to a live sub-session id
  # returned `{"success": false, "No agent named ... is reachable"}`, and
  # ListAgents shows no reachable cloud peers. There is no send_message or
  # list_events tool in the manager's surface.
  #
  # ⚠️ AND IT IS SYMMETRIC — measured 2026-09-02 (MI-70), which this row did NOT
  # say and which changes what follows from it. A SUB-SESSION CANNOT MESSAGE ITS
  # MANAGER EITHER: SendMessage from a sub-session to its own `parent_session_id`
  # returns the SAME "No agent named ... is reachable". The one-directional
  # phrasing above invited the reading that a sub-session could at least REPORT
  # UPWARD — it cannot, so a sub-session with a finding, a blocker or a question
  # has NO channel to its manager except the coordination board and its PR. That
  # is why MI-70's ruling-relevant findings went to #6927 rather than to the
  # manager directly, and it is why the spawn prompt must tell a sub-session to
  # write upward-bound information into the board or the PR rather than "tell the
  # manager".
  #
  # THIS IS WHY THE HANDOFF IS CHEAP. There is no live connection to transfer —
  # "taking over" is purely a KNOWLEDGE problem, and knowledge goes in files.
  # A design that assumed a channel would have built a reconnect mechanism for
  # a channel that does not exist.

  manager_lease:
    where: docs/claude/work/MANAGER-LEASE.json
    holds: one session id, claimed_at, heartbeat_at, expires_at
    rule: >-
      A session reads this BEFORE managing anything. Held and FRESH -> it does
      not manage. Stale or released -> it may claim. This is what enforces
      "only ever one", and it enforces it without either session knowing the
      other exists.
    expiry_is_the_mechanism: >-
      ⚠️ Time-based expiry, NOT an explicit hand-off, and that is deliberate.
      A session that dies cannot run its own close-out — the same reason this
      phase needs a reaper at all. A design where handover depends on the
      OUTGOING manager doing something fails in exactly the case it exists for.
      An outgoing manager that is still alive discovers on its next heartbeat
      that it no longer holds the lease, and stands down.

  session_registry:
    where: docs/claude/work/SESSIONS.json
    holds: >-
      per live sub-session — id, the work object it owns, spawned_at,
      last_observed status and needs_action, and the branch it pushes to
    why: >-
      ⚠️ THIS IS THE ACTUAL HOLE TODAY, and it is not hypothetical. On
      2026-09-01 two sub-sessions (Phase B, Phase C) existed ONLY in the
      manager's context. Had that session ended, nothing in the repo named
      them, so no successor could have polled them and both would have been
      silently orphaned mid-work. The registry is what makes a cold manager
      able to resume rather than re-derive.

  sub_session_independence:
    rule: >-
      A sub-session keeps running with NO manager holding the lease. It is an
      independent session working its own branch. What stops while the lease is
      unheld is SUPERVISION — nobody polls it, nobody opens its PR — which is
      survivable for hours and is exactly what the registry lets the next
      manager pick up.

  needs_action_is_a_stale_snapshot:
    # Measured 2026-09-01: Phase C's needs_action still read "open PR ... 403"
    # at 13:15Z, its updated_at frozen at 12:40:48Z, LONG after the manager had
    # opened the PR and posted the board comment.
    rule: >-
      A sub-session's needs_action is written at ITS last turn and cannot be
      cleared by the manager handling the request — there is no inbox. So the
      operator must not read it as a live request. The manager POLLS it,
      absorbs capability gaps silently, and escalates only genuine decisions.
      A handled sub-session is cleared by ARCHIVING it once its work lands,
      which is the only mechanism that actually removes the flag.

  spawn_prompt_is_the_only_channel:
    rule: >-
      Since the manager cannot message a running sub-session, every rule a
      sub-session must follow has to be in its SPAWN PROMPT. It cannot be added
      later. In particular the prompt must forbid asking the operator directly:
      write the question into the PR or the coordination board, and let the
      manager escalate.
    must_push_before_reporting_done: >-
      ⚠️ THE PROMPT MUST REQUIRE A PUSHED BRANCH BEFORE A SUB-SESSION MAY REPORT
      DONE. Added 2026-09-01 because THIS PHASE'S OWN DONE-CONDITION FAILED a
      real test, by accident, on the day it was written.

      WHAT HAPPENED. A sub-session spawned to mirror Claude pings to the
      dedicated Telegram bot finished IDLE with status_detail "patch ready; 249
      tests pass; awaiting user push + gate conditions". It had never pushed a
      branch. `git ls-remote` showed no branch of its; `ListAgents` reported no
      reachable peers, confirming the measured constraint above — a manager
      CANNOT message a sub-session. So the work existed only inside a container
      nothing could reach, and the manager redid it by hand.

      WHY THIS IS THE PHASE FAILING AND NOT MERELY AN OPERATOR SLIP. The
      done-condition is "killing a session mid-work loses nothing, DEMONSTRATED
      by killing one". Nobody killed this one — it FINISHED — and the work was
      still lost. SESSIONS.json did its job exactly as designed: it proved a
      session EXISTED. It cannot preserve what that session MADE. A registry is
      not a durable store, and the two were being asked to be the same thing.

      THE RULE: a sub-session's report of "done" is not evidence of anything the
      manager can act on unless a branch exists on `origin`. The spawn prompt
      must say so, and a manager polling a `review_ready` sub-session must check
      for the branch rather than trusting the status line. ⚠️ Note the status
      line said "awaiting user push", i.e. the sub-session KNEW it had not
      pushed and reported ready anyway — so the prompt must make pushing a
      PRECONDITION of reporting, not a step the session may defer.

  the_lease_must_live_on_main:
    rule: >-
      ⚠️ WHILE THE LEASE FILE SITS ON A FEATURE BRANCH, EVERY HEARTBEAT RESTARTS
      THAT BRANCH'S CI. Found by doing it: at 2026-09-01T16:13Z a heartbeat push
      to claude/operating-layer-phase-e-lease discarded an in-flight pytest-run
      about two minutes from completing, for a lease that did not expire for
      another hour. Cost: one ~14-minute cycle, for nothing.

      The design treated "where does the lease live" as answered by "the repo",
      and did not notice that the repo has two very different places — a branch
      under review, where a write is a CI event, and `main`, where a heartbeat
      is an ordinary Tier-1 commit that perturbs nothing. Only the second is
      compatible with a heartbeat cadence measured in tens of minutes.

      RESOLVED by #10660 landing the file on `main`. Recorded rather than
      dropped because the same trap returns for any future coordination file
      introduced on a branch: a file that is WRITTEN on a cadence must not live
      where writing it triggers a pipeline.

  status_without_a_session_id_tells_the_holder_to_stand_down:
    rule: >-
      `manager_lease.py status` with no `--session-id` cannot identify its
      caller, so it prints the held-by-someone-else message — "DO NOT MANAGE" —
      even to the session that actually holds the lease. Measured 2026-09-01:
      the bare form said DO NOT MANAGE while `status --session-id <holder>` said
      "you hold it", about the same file at the same moment.

      ⚠️ THE POLARITY IS CORRECT AND MUST NOT BE FLIPPED: telling the holder to
      stand down is recoverable, telling a rival to proceed is the one outcome
      the operator forbade. The defect is the DOC, which tells a session to run
      the bare form (CLAUDE.md § "If you are MANAGING"), so the intended reader
      gets the wrong answer on the intended path. Either the doc names
      `--session-id`, or the CLI reads the session id from the environment when
      one is available.

  the_ttl_is_not_expensive_to_maintain_and_a_session_measured_it_wrong:
    rule: >-
      ⚠️ CORRECTION to what PR #10670 said about this object, filed by the
      session that said it. That PR argued the 90 min TTL is "shorter than the
      cost of maintaining it", because branch protection refuses a direct push
      to `main` so every heartbeat costs a commit, a PR and a CI run. The
      DIRECTION is right and the ARITHMETIC was wrong.

      Measured 2026-09-01 on this repo's own runs: a LEASE-ONLY PR completes
      `pytest-run` in **15 s** — `Determine relevant changed files` finds
      nothing test-relevant in a JSON state file — against **~950 s** for a PR
      touching `src/` and `tests/` in the same hour. The session had the
      mixed-PR figure in mind and generalised it to the heartbeat. End to end a
      heartbeat is ~2-3 min, which sits comfortably inside a 90 min TTL.

      ⚠️ WHY THIS IS WORTH A ROW RATHER THAN A QUIET EDIT: the wrong claim runs
      in the DANGEROUS direction. "Maintaining the lock costs more than the lock
      is worth" is precisely the argument that would justify lengthening the TTL
      or weakening the lease — on a cost that does not exist. A safety mechanism
      relaxed on an unmeasured premise is the shape this repo keeps paying for.

      WHAT REMAINS TRUE from #10670: the lease DID lapse for 215 min while its
      holder was alive and working, and no other session claimed it in that
      window, so the failure was a lease nobody held rather than two managers
      concurrently. The real cause is that nothing PROMPTS the heartbeat — it
      is remembered, not scheduled — which is a different defect from the one
      that PR named, and the one actually worth fixing.

note: >-
  F2 close-out verification and F5 exit verification are ONE hook, not two:
  same moment, same mechanism, same session. close_session.py (354 ln) already
  does the right things but is SESSION-INVOKED, so a session that dies never
  runs it. ⚠️ The transit contract is part of the done-condition: three states
  never collapsed (not_submitted · in_transit · committed), and transit fails
  BACK never forward.

the_kill_was_run_and_it_was_a_PARTIAL_loss:
  # ⚠️ THE DONE-CONDITION AS WRITTEN IS NOT MET, AND THE MEASUREMENT SAYS SO
  # RATHER THAN BEING SHAPED TO PASS. "Killing a session mid-work loses
  # NOTHING" is FALSE. What is true, and is now demonstrated rather than
  # asserted, is: **killing a session loses everything it had not pushed, and
  # nothing it had.**
  run_by: MI-70 (session_01NkekPZw73VYuynYhSdWLWm)
  subject: session_01NN97cVYW5dmiNNXHfsu7Nn
  subject_was: >-
    A PURPOSE-MADE, EXPENDABLE session doing throwaway doc work. No real work
    was killed. It was instructed to hold THREE tiers of state at the moment of
    death — pushed, committed-not-pushed, uncommitted — because a subject that
    pushes everything measures nothing.
  subject_was_deliberately_NOT_registered: >-
    It has no row in SESSIONS.json. That was a choice, and it makes the test
    HARDER in the direction that matters: the registry has been measured
    incomplete twice (3 of 6 on 2026-09-01; 26 of 55 on 2026-09-02), so a
    demonstration run on a registered session would have proved recovery only
    in the case that was never the problem.
  killed_at: 2026-09-02T13:49:13Z   # archive_session -> ARCHIVED, container released
  killed_while: >-
    SESSION_STATUS_RUNNING, mid-step. Not idle, not finished. Its own final
    status_detail — "pushed claude/mi70-kill-subject; local phase 2 commit
    held" — is the independent confirmation that unpushed state existed at the
    moment of death.

  what_survived:
    tier_1_pushed: >-
      ALL of it. Branch claude/mi70-kill-subject @ 4d9c0c48 on origin, one
      commit, docs/claude/work/kill-subject-notes.md intact, and the
      `Claude-Session:` trailer naming the dead session.
  what_was_lost:
    tier_2_committed_not_pushed: >-
      LOST. The phase-2 commit existed (the session said so) and is gone with
      the container. `git rev-list origin/main..origin/claude/mi70-kill-subject`
      = 1, and the pushed file contains no "phase 2" section.
    tier_3_uncommitted: >-
      LOST. docs/claude/work/kill-subject-scratch.md does not exist on origin.
    # ⚠️ NEITHER LOSS IS RECOVERABLE BY ANY REAPER, EVER. It lived in a
    # container nothing outside it can reach. This is not a gap a better
    # mechanism closes — it is why session_registry.py's spawn prompt makes a
    # PUSHED BRANCH a precondition of reporting done.

  by_which_mechanism_each_was_recovered:
    the_branch: >-
      NOT by SESSIONS.json — the subject has no row there, so the registry
      contributed nothing. Recovered by scripts/ops/session_reaper.py reading
      the `Claude-Session:` commit trailer, 62 s after the kill, with no
      cooperation from the dead session: it returned
      session_01NN97cVYW5dmiNNXHfsu7Nn -> ['claude/mi70-kill-subject'].
    what_it_was_FOR: >-
      NOT RECOVERED, and this is the honest boundary. `owns_object` exists only
      in the registry. The reaper can say WHOSE work a branch is; it cannot say
      what it was for. Recovery locates work and leaves it unattached.

  the_incremental_progress_mechanism_already_existed_and_nothing_read_it: >-
    ⚠️ The design asks for "state written as work happens". It is already
    written: every commit carries a `Claude-Session:` trailer. Nothing read it
    — the provenance-consumer-guard shape one level up, a signal WRITTEN and
    never READ. Measured 2026-09-02: 35 of 67 registry rows name NO branch at
    all (the registry is a spawn-time record nothing updates), and scanning the
    194 claude/** heads for that trailer located the work of 16 of them anyway.
    Live reap: `unreadable` 37 -> 21.

  what_the_reaper_cannot_see_stated_rather_than_hidden:
    - "LIVENESS. It cannot tell alive from dead — list_sessions is an MCP tool
       CI does not hold. It grades branch quiescence, a PROXY. That is safe
       ONLY because it records and never acts; a reaper that killed on the same
       proxy would have to be right about death, and it cannot be."
    - "UNPUSHED WORK. Zero visibility, by construction. See the two losses above."
    - "WHAT UNREGISTERED WORK WAS FOR. 187 claude/** heads carry no registry
       row; 98 session ids are attributable from trailers; none of them can be
       tied to a work object."
    - "`no_landing_evidence` IS NOT `lost`. The registry records PRs by hand, so
       a row whose work landed under an unrecorded PR grades there too — one of
       the 7 live rows in that state landed as #10789."

