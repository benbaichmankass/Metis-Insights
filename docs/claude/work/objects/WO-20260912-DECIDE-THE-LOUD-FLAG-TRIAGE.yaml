decision_requests:
- id: DEC-20260912-LOUD-FLAG-TRIAGE
  question: >-
    `loud: true` is set on 72 of 85 OPEN-ITEMS rows (84.7%), while the register's own rule is
    that EVERY loud row must be reported on in a session's closing summary. At that size the
    instruction cannot be followed, so in practice it is followed for none. How should the
    reporting duty be defined?
  urgency: blocking
  asked_on: '2026-09-13'
  asked_by:
    session_id: session_013iSqp4LsU1eq8K326eUtgj
    recorded_at: '2026-09-13T05:00:00Z'
    note: >-
      Filed to DISCHARGE a stranded blocked_on edge this same session created on 2026-09-12
      (MI-279 OPS lane, U4) and left pointing at nothing. The proposal it rests on is
      docs/design/open-items-loud-triage-PROPOSAL-2026-09-12.md, landed as 20e0b68cc (PR
      #11885). No figure here is newly derived except where the 2026-09-13 context paragraph
      says so explicitly.
  context: >-
    MEASURED over the whole register on three dates, same basis each time: 34 of 45 = 75.6%
    (2026-09-02), 61 of 72 = 84.7% (2026-09-10), 72 of 85 = 84.7% (2026-09-12). The COUNT has
    more than doubled while the SHARE rose ~9 points, which is the backlog row's own prediction
    ("every new row is filed by someone who thinks their row is important") observed rather than
    argued. || THE DECIDING ARITHMETIC: render_session_brief.py::due_items -- what the CLAUDE.md
    session brief actually serves -- selects on kind==monitoring AND cadence and IGNORES `loud`
    entirely. `due` is a STRICT SUBSET of `loud` today: due-but-not-loud 0, loud-but-not-due 56.
    So 56 rows the rule demands a session report are not in front of that session at all, and
    narrowing the duty to `due` would lose NOTHING a session can currently see. || NEW CONTEXT
    MEASURED 2026-09-13 (U17/U19) AND IT BEARS ON OPTION B: `loud` is enforced by NO guard --
    check_open_items.py removed it on 2026-08-26 recording in its own comment that it "enforced
    nothing, it was an adjective" -- is ignored by the session brief, and its ONE remaining
    rendering consumer (render_daily_brief.py::loud_open_items) is an unbounded filter producing
    72 rows / 146 lines / 36,001 BYTES under a header reading "must be REPORTED ON, not silently
    carried". That consumer has produced ONE artifact in its lifetime (comms/briefs/2026-09-02.md,
    eleven days ago). So wiring it up AS IS would put 36 KB in front of a manager every morning.
    || INDEPENDENT CORROBORATION FROM A SECOND SURFACE, same day: render_due_list.py returns 124
    due rows of which 99 are loud (79.8%), and the `duty` skill carries the identical
    report-on-every-loud-row rule. The saturation is not an artifact of one register.
  options:
  - key: derive_from_due
    label: Make the reporting duty the DERIVED due set and retire `loud` as a reporting trigger
    implication: >-
      RECOMMENDED in the proposal. Needs no new code -- due_items already computes it and the
      brief already renders it -- it satisfies the backlog row's criterion ("smaller than the
      register and derivable rather than authored") by construction, and unlike `loud` it SHRINKS
      as work lands, which is the property the flag was supposed to have. COST, stated: 1 of the
      26 rows in the derived set is not loud today, and 3 of 6 NEVER-OBSERVED rows are loud:FALSE
      -- so `loud` is not merely noisy, it also misses; the derived set would catch those three
      and drop any author-driven emphasis on the one.
  - key: budget_with_guard
    label: Keep `loud` but give it a BUDGET a guard enforces
    implication: >-
      NOT the cap that was tried and reversed: that capped how many BUGS may be TRACKED, which
      the operator rightly refused; this caps how many rows one closing summary must RECITE -- a
      different quantity with a different reason. Weakened by the 2026-09-13 measurement above:
      the flag has no guard and one barely-run renderer, so a budget would be enforced against a
      surface almost nobody reads.
  - key: derive_from_severity
    label: Derive `loud` from severity plus dueness instead of declaring it
    implication: >-
      Strictly more machinery than derive_from_due for the same output. Listed because it is the
      option a reader will think of, not because it is recommended.
  - key: decline_keep_as_is
    label: Decline -- `loud` stays as it is, and that is recorded as the decision
    implication: >-
      A REAL ANSWER THAT CLOSES THIS OBJECT. If the register reading this way is what is wanted,
      it must be written down rather than left looking like a change about to happen. The cost is
      stated rather than argued: the closing-summary rule then remains one no session can follow,
      and should probably be softened in CLAUDE.md so the repo is not carrying an instruction it
      knows is unfollowable.
  allows_free_text: true
  answer: null

