decision_requests:
  - id: DEC-20260909-ROLLBACK-BUILDER-REGISTRY
    question: >-
      The documented rollback MULTI_STRATEGY_INTENT_LAYER=false routes to a SECOND builder
      registry holding 16 of 55 strategies - so exercising it would silently stop 35 of 45 live
      legs (78%), logged as a warning and skipped. No test asserts the two registries agree.
    urgency: high
    asked_on: '2026-09-09'
    context: >-
      Audit F-28, re-verified by the audit lead from AST rather than taken from the agent.
      pipeline._STRATEGY_BUILDERS n=16; execution:live legs MISSING from the rollback registry:
      35 of 45 (78%). Sample: ada_pullback_2h, eth_pullback_2h, gdx_pullback_1d,
      gld_pullback_1d, gld_pullback_1h, iaum_pullback_1d, ict_scalp_avax_5m, ict_scalp_eth_15m.
      On a leg the rollback registry lacks, pipeline.py:506-509 logs a warning and CONTINUES.
      pipeline.py:671-684 documents this path as the rollback - 'export
      MULTI_STRATEGY_INTENT_LAYER=false to fall back to it without a code change' - and
      CLAUDE.md lists the var as 'the core intent-aggregation switch, default on'. A grep for a
      parity assertion over tests/ returns NO OUTPUT. The primary registry grew 16 -> 55 across
      2026-05 to 2026-07 and the rollback registry was never followed. !! THE FAILURE MODE IS
      THE WORST AVAILABLE: it looks like it worked.
    options:
      - key: collapse_to_one_registry
        label: Collapse to one registry
        implication: >-
          Deletes _STRATEGY_BUILDERS and routes the rollback through _resolve_builders(). One
          registry cannot drift from itself. Tier-2 - it touches the signal path.
      - key: parity_test_and_backfill
        label: Parity test plus backfill the 39
        implication: >-
          Syncs by hand now and guards it. Works today, preserves the duplication that caused
          it.
      - key: parity_test_only
        label: Parity test only
        implication: >-
          Tier-1. Fails loudly on the next drift but does NOT close today's 39-leg gap; the
          rollback stays an outage until someone acts on the red.
      - key: retire_the_rollback
        label: Retire the rollback path
        implication: >-
          Honest - it does not work - but there is then no env-flip rollback for the intent
          layer at all.
