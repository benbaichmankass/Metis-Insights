  [!] THE OWNERSHIP RULE IS ALREADY DECIDED AND MUST NOT BE RE-LITIGATED. The state/status merge has ONE
  owner, src/runtime/manager_status.py::effective_state, and `state` WINS a disagreement -- because `state`
