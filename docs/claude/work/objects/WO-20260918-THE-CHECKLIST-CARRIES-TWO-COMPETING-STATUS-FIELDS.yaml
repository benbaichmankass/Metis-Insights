  make the DATA agree with that owner, not to add a second owner or change which field wins.
  [!] DO NOT COLLAPSE `done` AND `landed_unproven`. CLAUDE.md: `done` means MERGED AND OBSERVED;
  `landed_unproven` means the code is in and its effect has NOT been seen on the fleet. A cleanup that
  flattens the two is a regression wearing a tidy-up, and it is the failure this repo keeps paying for.
done_condition: >-
