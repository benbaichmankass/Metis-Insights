review_trigger: 'Re-read when the four arms have run. ⚠️ Do NOT report a verdict from a single fold count:
  the whole reason this question is open is that a fold-majority gate passed a lever that lost 35R, because
  30-39% of its folds were INERT. ⚠️ THAT HAZARD FIRED HERE, EXACTLY AS PREDICTED: every comparison in
  both runs came back 2 of 6 folds INERT (33.3%) — inside the same band. The gate is a CONJUNCTION (pooled
  net R AND a majority of EFFECTIVE folds) and inertness is IMPORTED from scripts/research/m20_wf_effective.py::is_inert
  rather than restated; the reporter''s self-test plants the be_floor_r=1.5 shape (fold majority + pooled
  loss + a third inert) and requires a refusal.'
done_condition: scripts/backtest_system.py expresses N books and a swappable ranking key; the four declared
  arms (confidence_first / priority_first / recent_pnl_first / random_tiebreak) have run on the CONTESTED
  subset only, stratified by `decided_by`, reported against the ACHIEVED contested-tick count rather than
  the declared one; and a verdict is recorded either way. ⚠️ A NULL RESULT SATISFIES THIS. If confidence_first
  does not beat random_tiebreak, the finding is that arbitration ORDER does not drive outcome — publishable,
  and the signal to look at the confidence SCORE instead. That is an answer, not a failure to re-run until
  something wins.
done_condition_met: 'MET, with ONE deviation stated rather than smoothed over — see `deviation_from_done_condition`.
  The four arms ran on the contested subset only, stratified by `decided_by`, graded against the ACHIEVED
  contested count (1,270 elections / 138-206 trades) and NOT the declared 1,780, and a verdict is recorded:
  a NULL, which this condition''s own last sentence says satisfies it.'
deviation_from_done_condition: 'The done-condition says "scripts/backtest_system.py expresses N books
  and a swappable ranking key". The capability was built as a SIBLING — scripts/research/nbook_portfolio.py
  — that IMPORTS backtest_system rather than editing it. Two reasons, both structural: (1) scripts/backtest_system.py
  is OUTSIDE scripts/ci/check_pr_landing.py''s TIER1_SURFACE (which allows scripts/{ci,ops,research,reports}/**,
  not scripts/*.py), so touching it makes a Tier-1 measurement PR fail R5 and unable to self-land; widening
  TIER1_SURFACE is itself LANDING_MACHINERY and is held by R12, so there is no self-landing route through
  it. (2) The hazard that wording exists to prevent — a second portfolio engine free to drift — is closed
  by an EXECUTABLE assertion instead of by co-location: at N=1 with the full roster the N-book engine
  reproduces run_system_backtest TRADE-FOR-TRADE, and that test FAILS if its fixture stops producing trades
  so it cannot pass vacuously (tests/research/test_nbook_portfolio.py). A parity assertion is strictly
  stronger than sharing a file, which is what the two-expressions-of-one-ordering incidents in src/runtime/intents.py
  demonstrate. ⚠️ Recorded as a DEVIATION, not as compliance. A session that judges it unacceptable should
  say so; see `decision_requests`.'
what_shipped:
- scripts/research/ranking_keys.py — the four declared arms + the in-process installer. confidence_first
