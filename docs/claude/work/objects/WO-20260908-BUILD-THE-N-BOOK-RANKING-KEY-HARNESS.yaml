- '.github/workflows/ranking-key-ab.yml — fires it on a FREE GitHub runner, not the 1-core trainer (docs/claude/vm-resource-management.md).
  One job, four arms, deliberately not a matrix: the arms differ ONLY in the election key and share identical,
  expensive signal streams.'
- tests/research/test_ranking_keys.py and tests/research/test_nbook_portfolio.py
- docs/research/trade-prioritisation-ranking-key-AB-2026-09-08.md (the write-up) and the committed payloads
