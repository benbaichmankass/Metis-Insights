result: 'NO — and it is a NULL, which the done-condition says is a success. MEASURED (population stated):
  BTCUSDT 5m, Binance-vision archive, 2025-08-04 -> 2026-09-08 (400 calendar days, 115,200 bars), 15m
  clock (38,401 bars), 8 harness members, 1 book, seed 20260908, 6 fixed folds, fee+slippage+funding from
  the ONE shared cost model. PRIMARY at signal_ttl_bars=16 (live-faithful): 1,270 contested elections
  ACHIEVED against the design''s DECLARED 1,780; 138-206 contested TRADES per arm, i.e. UNDERPOWERED against
  the design''s own 393/group floor. All three deterministic arms beat the random control on the gate;
  NONE clears the declared Bonferroni alpha of 0.0167 (p 0.24-0.31). POWERED SECONDARY at signal_ttl_bars=96
  — deliberately NOT live-faithful, run ONLY to establish that the null is not an artefact of n (n=1,130-1,543,
  above the floor): it AGREES. HEAD-TO-HEAD AT POWER — the operator''s actual question — confidence_first
  grades `not_preferred` against BOTH priority_first (folds 2-2, p=0.583) and recent_pnl_first (folds
  2-2, p=0.937). ⚠️ THE ONE EFFECT THAT SURVIVES IS STABILITY, NOT THE CHOICE OF STABLE KEY: the control
  re-rolls per tick (deliberately — a frozen draw would be a NAME ranking in disguise) and flips 92 times
  (primary) / 331 (powered) against 18-34 for every deterministic arm. Most of the arm-vs-control gap
  is churn. Do not quote those deltas without the flip counts. ⚠️ EVERY expectancy in every stratum is
  NEGATIVE: on this population the contested subset loses money whoever wins the contest, which bounds
  what any ranking key can be worth here. ⚠️ Every p is a LOWER BOUND (iid normal approximation over autocorrelated
  backtest trades).'
what_this_does_not_establish: '(1) NOTHING about per-account fan-out — the primary is ONE book. The N-book
  and `global` modes are built and tested but the adjacent question needs its own population and write-up.
  (2) Nothing about symbols other than BTCUSDT, nor about the live 52-leg roster: the live conviction_arbitration
  soak''s 5.01 contests/day is a fleet-wide figure and is NOT comparable to eight BTCUSDT members. (3)
  NOTHING LIVE CHANGED and nothing is proposed — flipping the ranking key is Tier-3. (4) It does NOT say
  the live key is wrong; it says the correctness argument it shipped on has not been joined by an outcome
  result, and that no cheaper alternative was shown to be better either.'
defect_found_and_fixed_in_flight: '`decided_by` MISLABELLED THE CONTROL''S OWN DECIDING TERM. deciding_term
  names terms by zipping `(target_qty,) + ELECTION_TERMS` against the key tuple; the control originally
  omitted the target_qty slot, so its random draw was reported as `decided_by=target_qty` on 100 of 208
  contested trades in the first primary run — unprovenanced diagnostic output (sub-class A) in the exact
  field the whole analysis stratifies by, and my own first test allowed it. Fixed at the source with a
  CONSTANT placeholder in that slot (constant, so it can never itself decide) and pinned by test_the_control_can_never_report_target_qty_as_the_deciding_term.'
