context: 'CONFIDENCE HAS BEEN THE LIVE PRIMARY RANKING KEY ON REAL MONEY SINCE 2026-08-31 (PR #10544)
  and has never been shown to pick the better-performing trade. It went live on a CORRECTNESS argument
  — it is evidence about the trade, unlike the strategy NAME it replaced — not on an outcome result. Operator,
  2026-08-31: "the confidence score is a good start, but it isn''t proven that it''s necessarily what''s
  gonna give us the best trade every time." ⚠️ THE A/B COULD NOT BE RUN BECAUSE THE HARNESS CANNOT EXPRESS
  IT: backtest_system.py models ONE shared book, so neither global-vs-per-account arbitration nor a swapped
  ranking key is expressible. That is the gap this object closes, and it is why the question sat unmeasured
  from 2026-08-31 with verified_at and observation both null. ⚠️ THIS BUILD ALSO UNBLOCKS THE ADJACENT
  QUESTION — global vs per-account arbitration — which is blocked on the same missing capability. One
  build, two questions. ⚠️ PRIOR ART THAT SHAPES THE ARMS: M18''s allocator asked the adjacent question
  and the answer was NO (edge -$7, ranker OOS AUC ~0.51). random_tiebreak is therefore a DECLARED arm,
  not an afterthought — it is the floor the others must clear. ⚠️ AND IT WAS THE RIGHT CALL TO DECLARE
  IT: the control turned out to be the arm that carries the finding, because what it isolates is INSTABILITY
  rather than a worse ranking.'
