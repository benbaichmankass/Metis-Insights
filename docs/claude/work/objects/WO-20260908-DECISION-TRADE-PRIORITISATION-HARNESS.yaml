decision_requests:
  - id: DEC-20260908-TRADE-PRIORITISATION-HARNESS
    question: >-
      When two trades compete, the bot ranks them by CONFIDENCE — live on real money since
      2026-08-31, never shown to pick the better one. Do we build the harness that would settle it?
    urgency: routine
    asked_on: '2026-09-08'
    context: >-
      It went live on a CORRECTNESS argument, not an outcome result: confidence is evidence about
      the trade, unlike the strategy NAME it replaced. Your own words on 2026-08-31: "the
      confidence score is a good start, but it isn't proven that it's necessarily what's gonna
      give us the best trade every time." ⚠️ THE A/B CANNOT BE RUN TODAY. scripts/backtest_system.py
      models ONE shared book, so a per-account arbitration or a swapped ranking key cannot even be
      expressed. Settling it means first giving that harness an N-book mode and a ranking-key arm
      (the shape of its existing --flip-policy), then running four arms — confidence_first /
      priority_first / recent_pnl_first / random_tiebreak — reported on the CONTESTED subset only
      and stratified by `decided_by`, against the ACHIEVED contested-tick count rather than the
      declared one. ⚠️ A NULL RESULT IS A REAL ANSWER: if confidence_first does not beat a random
      tiebreak, the finding is that arbitration ORDER does not drive outcome — publishable, and the
      signal to stop investing here and look at the confidence SCORE itself. That is not
      hypothetical: M18's allocator asked the adjacent question and the answer was NO (edge −$7,
      ranker OOS AUC ~0.51), which is why random_tiebreak is a declared arm and not an afterthought.
      ⚠️ THIS ROW IS `loud` AND HAS NEVER BEEN OBSERVED — verified_at and observation are both null
      since 2026-08-31.
    options:
      - key: build_harness
        label: Build the N-book ranking-key harness and run the four arms
        implication: >-
          Engineering work on scripts/backtest_system.py plus a workflow to fire it, before any
          verdict. It also unblocks the ADJACENT open question (global vs per-account arbitration),
          which is blocked on the same missing capability — so one build answers two questions.
          Expect a real chance of a null result, which is still an answer.
      - key: accept_declared
        label: Accept confidence-first as a DECIDED but unproven choice, and record it as such
        implication: >-
          No build. The ranking key stays as it is on real money, and the row stops being a drifted
          state and becomes a declared one — which is the distinction this repo keeps insisting on.
          The cost is that we never learn whether arbitration order matters.
      - key: look_at_the_score
        label: Skip the ORDER question — investigate the confidence SCORE itself instead
        implication: >-
          Takes the M18 result seriously up front (an adjacent ranker scored OOS AUC ~0.51) and
          assumes order is not where the edge is. Cheaper, and it targets the thing the ordering
          depends on; but it leaves the live ranking key unproven by construction rather than by
          measurement.
