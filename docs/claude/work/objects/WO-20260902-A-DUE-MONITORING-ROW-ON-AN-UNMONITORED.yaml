id: WO-20260902-A-DUE-MONITORING-ROW-ON-AN-UNMONITORED
type: question
parent_intent: IN-20260901-OPERATING-LAYER
title: >-
  A due monitoring row on an unmonitored, un-re-derivable data stream has gone unobserved for 4 days
stage: OBSERVATION
lifecycle: done
owner: claude
opened_at: 2026-09-02
closed_at: 2026-09-03
review_trigger: >-
  Re-read at the next cycle. A captured idea is PARKED, not queued — it becomes
  work only when it is given an owner and moved out of `dormant`.
done_condition: >-
  The row's observation field carries what was actually SEEN on the trainer -- disk headroom, whether the capture is still writing, and how stale its newest data is -- with verified_at re-dated. If an alarm keyed on the DATA's freshness (never on the unit's ActiveState) can be built and SHOWN to fire against planted staleness, that is the row's own clears_when and it clears; if it cannot, say why and leave the row open. Disk headroom recovering on its own does NOT clear it.

why: >-
  OI-20260829-TRAINER-IS-NOW-A-DECIDED-DEPENDENCY-AND-IS-UNMONITORED is 4 days past a 3-day cadence. The operator DECIDED on 2026-08-29 to keep the trainer VM for L2 order-flow capture -- a forward-only stream nothing can re-derive -- and the row records the disk at 92% with NOTHING watching the capture. It is loud, it renders in the CLAUDE.md brief, and it has still not been observed, which makes it a live instance of the failure OI-20260826-SESSION-BRIEF-NEVER-READ-BY-A-FRESH-SESSION watches: the register surfaces it and nobody acts. That is a STEERING failure, not merely a trainer problem, which is why it sits under this intent.

source: >-
  operator (conversational)

blocked_on: []
blocked_on_basis: >-
  ASSESSED 2026-09-03. NOTHING BLOCKS THIS — the empty list is a CLAIM, made on
  evidence, not the migrated placeholder it started as. The one edge this object
  ever carried (external_event: PR #10893 merged by the manager) is SATISFIED,
  not stale: #10893 MERGED 2026-09-03T07:46Z and the rows were verified present
  on origin/main afterwards. Its own basis said "when #10893 merges this edge is
  SATISFIED, not merely stale — clear it rather than re-dating it", so it is
  cleared rather than carried. A satisfied edge left in place is read by the
  constraint computation as a live blocker, and a false blocker is worse than a
  missing one.
verdict: >-
  DONE_CONDITION MET, on both of its halves, and the object's own row CLEARED on
  the strength of it. (1) OBSERVE: the trainer's capture was read and what was
  SEEN is written into the row's `observation` — the watched path graded `fresh`
  at age=60s against a 1800s threshold. (2) ALARM: it was buildable after all,
  and was built and SHOWN to fire. The done_condition's escape hatch (“if it
  cannot, say why and leave the row open”) was not needed — the row's
  `probe_absent_reason` argued against the `probes.py` framework, which does not
  bind a WORKFLOW; a workflow can SSH the trainer exactly as `trainer-vm-diag.yml`
  does. So `OI-20260829-TRAINER-IS-NOW-A-DECIDED-DEPENDENCY-AND-IS-UNMONITORED`
  clears on its clause (a). ⚠️ WHAT IS NOT ESTABLISHED, carried forward as
  `OI-20260903-CAPTURE-WATCH-PROVED-ITSELF-ON-DEMAND-AND-ITS-SCHEDULE-HAS-NEVER-SUCCEEDED`
  rather than dropped with the cleared row: the proof came from a
  `workflow_dispatch`, the SCHEDULE has never produced a successful run (one
  attempt, 4.34h late, failed), and neither Telegram alert step has ever executed
  on any run. An alarm that runs only when a human presses a button monitors
  nothing, and that is a different fact from “the alarm works”.

evidence: >-
  POPULATION: every run of `.github/workflows/trainer-capture-watch.yml` in its
  life to date — three, read from the run history, not sampled. BASIS: MEASURED.
  Run 33719856283 (`workflow_dispatch`, success, 05:40:34Z→05:43:10Z) printed, in
  its `Grade freshness` step: `threshold_seconds=1800`, `controls_ok=True`,
  `[watched] capture: fresh age=60s`, `[control] control_stale: stale age=10800s`,
  `[control] control_fresh: fresh age=0s`. Quoted from the log — NOT inferred from
  step conclusions, which is a distinction this session got wrong once already and
  corrected. The controls are planted on the real trainer over the real SSH hop and
  graded by the same function that grades the watched path, so a green harness is
  not what this rests on. The receipt reached `main` at `generated_at`
  2026-09-03T05:41:00Z via commit-to-main's own PR #10892, exercising the SSH hop,
  the plant, the grader and commit-to-main for the FIRST time; all four worked.
  `scripts/ci/check_trainer_capture_watch.py` now grades `fresh` where it graded
  `never_ran`, so the guard armed itself. AGAINST: run 33716069132
  (`event: schedule`) fired 04:43:09Z against a first eligible slot of 00:23Z under
  cron `23 */6 * * *` — 4h20m09s late — and FAILED at the pre-fix missing-pytest
  step; its head_sha 42b8dbfc predates PR #10875 (merged 05:40:12Z), so it is
  evidence about the CADENCE and says nothing about the fix. Run 33686720280 (#1,
  dispatch, 2026-09-02T21:43:53Z) died at the same step. n=3 is the whole population, and one of the
  three was scheduled.
