    question: >-
      A real position has been carrying 56 unprotected shares for five days, and the only code
      path that could re-arm it would destroy a sibling trade's stop. How do you want it handled?
    urgency: blocking
    asked_on: '2026-09-08'
    context: >-
      MEASURED 2026-09-08T04:47:34Z, re-read identically at 04:50:13Z (per-account
      read_state: orders_read). alpaca_portfolio holds TLT SHORT 72 @ 82.309028. Exactly ONE
      protective OCO pair rests on TLT, for qty 16. Journal: trade 5266 (short 16) + trade 5414
      (short 56) = 72, matching the venue exactly. So 56 of 72 shares — trade 5414 — have been
      naked since ~2026-09-03. ⚠️ WHY IT CANNOT SIMPLY BE RE-ARMED: AlpacaClient.place_protective
      is the ONLY path that places an Alpaca protective leg, and it calls
      _cancel_open_orders_for_symbol() UNCONDITIONALLY — cancelling every open order on the
      symbol, i.e. BOTH of trade 5266's legs. Its caller passes oca_key specifically to scope
      that cancel; IB honours it, and the Alpaca implementation SILENTLY DROPS IT. The
      mitigation looks applied at the call site and is not. ⚠️ AND THE SAME DEFECT HAS ALREADY
      CORRUPTED THE SIBLING: trade 5266's resting stop sits at 82.33, which is trade 5414's
      declared level, not 5266's own 84.62 — because modify_protective PATCHes every stop on
      the symbol, so 5414's routine trailing amend rewrote 5266's protective level.
      ⚠️ AND IT WILL NEVER SELF-HEAL: the naked-position sweep grades stop coverage as a
      symbol-wide BOOLEAN, so 5266's resting leg makes the whole TLT symbol read "stop armed"
      and 5414 is skipped every pass.
    options:
      - key: build_scoped_write
        label: Authorise the scoped Alpaca write capability (Tier-2 order path)
        implication: >-
          One fix closes BOTH halves — the qty/trade-scoped protective attach that would re-arm
          5414, and the scoped modify that stops a trailing amend rewriting a sibling's stop.
          #11337 already carries the close/modify half and is written and green. This is a real
          order-path change on a real-money-adjacent account and needs your explicit approval.
      - key: flatten_5414
        label: Flatten trade 5414 instead — remove the exposure rather than protect it
        implication: >-
          Ends the naked exposure today with no new order-path code, at the cost of closing a
          position on a schedule the strategy did not choose. The symbol-wide cancel problem
          remains for every future trade on any Alpaca account.
      - key: accept_and_monitor
        label: Accept the exposure as declared, and leave it
        implication: >-
          The 56 shares stay unprotected until a scoped capability exists. This is the CURRENT
          state — it would simply become a DECIDED one rather than a drifted one, which is the
          distinction this repo keeps insisting on. The position can still only be closed
          manually or by the strategy's own exit.
