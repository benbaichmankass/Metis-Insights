done_condition: >-
  (1) A PR merging to main produces an operator ping, delivered by the EXISTING notify_on_pull drain, and it is OBSERVED arriving -- not inferred from a log line saying dispatched. (2) The hourly digest fires on a carrier that survives every session AND is measured to fire on its declared cadence over at least 3 consecutive slots. ⚠️ A Claude Routine does not satisfy (2) under any framing; the operator has refused it. ⚠️ And a cron expression is not evidence -- read the run history.

why: >-
  Operator, 2026-09-02: 'every time a PR merges, I'm supposed to get updated about that and other ongoing things, and I'm not getting any updates except the work digest, and even that isn't coming at the cadence it's supposed to.' MEASURED: PING_WORTHY = {in_flight, waiting, done, accepted} and the emitter walks transitions(base, head) over work-object LIFECYCLE fields -- so it pings on work-object state changes and NOT on PR merges. That is why notify_on_pull logged 'No pingable events in 90b541a9..2156e8a6' across a range containing five merges. Not a bug: a missing capability. Separately the hourly clock has no durable carrier -- GitHub cron does not honour its schedule (5 runs in a day against hourly, never on its declared minute) and the operator has EXPLICITLY REFUSED a Claude Routine: 'no cloud routine, we cannot have anything that is gonna die at the end of the session'.

