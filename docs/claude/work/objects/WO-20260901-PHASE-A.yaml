review_trigger: >-
  Re-read when the phase it depends on closes, or when the operator changes the cycle
  priority. A dormant phase is not a queued one — it is re-argued when it becomes reachable.

done_condition: >-
  A session that arrives COLD, pointed at nothing, states which phase this
  build is on and what the next step is, CITING the CLAUDE.md session brief as
  where it saw it. A passing test is not that observation, and neither is this
  session reporting on its own work.

blocked_on:
  - kind: external_event
    ref: a COLD session reporting on this work, citing the CLAUDE.md brief
    since: 2026-09-01
    note: >-
      Everything Phase A ships is BUILT and pushed. It is deliberately NOT `done`:
      its done_condition is an OBSERVATION nobody has made yet, and the channel it
      rides is itself unproven (OI-20260826). `waiting` is the honest state — a
      `done` here would be the collapse the six-state vocabulary exists to prevent,
      and would quietly convert "we deployed it" into "we verified it".

blocked_on_basis: >-
  ASSESSED. The edge(s) above were written deliberately by the session that built this
  phase, naming a specific, dated dependency — that IS an assessment, and this key
  records it so the FIELD and the readout stop disagreeing about the same row.
  ⚠️ RECORDED BY MI-63 ON 2026-09-02, WHICH IS A NARROWER CLAIM THAN IT LOOKS: MI-63
  established that an assessment was MADE, by reading the edge; it did NOT re-verify
  that the edge still HOLDS today. Those are different facts and only the first is
  claimed here. ⚠️ WHY IT WAS MISSING AT ALL: `scripts/ops/constraint_readout.py`
  counts a row with any edge as assessed (writing an edge is a positive statement),
  while the basis FIELD was absent — so the store read 6 assessed by the code and 2 by
  the field. Neither number was wrong; they answer different questions. The four rows
  that carried an edge and no basis were WO-20260901-PHASE-{A,B,C,H}, and this is one
  of them.
note: >-
  Rides scripts/ops/render_session_brief.py, which renders OPEN-ITEMS.json
  into CLAUDE.md — the only surface reaching a session before its first tool
  call. ⚠️ That channel is ITSELF unproven: OI-20260826-SESSION-BRIEF-NEVER-
  READ-BY-A-FRESH-SESSION is open and says no fresh session has ever been
  observed acting on it. So this object's done-condition is an OBSERVATION,
  not a deploy.

