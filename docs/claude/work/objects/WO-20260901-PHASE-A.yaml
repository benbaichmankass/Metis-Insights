review_trigger: >-
  Re-read when the phase it depends on closes, or when the operator changes the cycle
  priority. A dormant phase is not a queued one — it is re-argued when it becomes reachable.

done_condition: >-
  A session that arrives COLD, pointed at nothing, states which phase this
  build is on and what the next step is, CITING the CLAUDE.md session brief as
  where it saw it. A passing test is not that observation, and neither is this
  session reporting on its own work.

blocked_on:
  - kind: external_event
    ref: a COLD session reporting on this work, citing the CLAUDE.md brief
    since: 2026-09-01
    note: >-
      Everything Phase A ships is BUILT and pushed. It is deliberately NOT `done`:
      its done_condition is an OBSERVATION nobody has made yet, and the channel it
      rides is itself unproven (OI-20260826). `waiting` is the honest state — a
      `done` here would be the collapse the six-state vocabulary exists to prevent,
      and would quietly convert "we deployed it" into "we verified it".

blocked_on_basis: >-
  ASSESSED. The edge(s) above were written deliberately by the session that built this
  phase, naming a specific, dated dependency — that IS an assessment, and this key
  records it so the FIELD and the readout stop disagreeing about the same row.
  ⚠️ RECORDED BY MI-63 ON 2026-09-02, WHICH IS A NARROWER CLAIM THAN IT LOOKS: MI-63
  established that an assessment was MADE, by reading the edge; it did NOT re-verify
  that the edge still HOLDS today. Those are different facts and only the first is
  claimed here. ⚠️ WHY IT WAS MISSING AT ALL: `scripts/ops/constraint_readout.py`
  counts a row with any edge as assessed (writing an edge is a positive statement),
  while the basis FIELD was absent — so the store read 6 assessed by the code and 2 by
  the field. Neither number was wrong; they answer different questions. The four rows
  that carried an edge and no basis were WO-20260901-PHASE-{A,B,C,H}, and this is one
  of them.
note: >-
  Rides scripts/ops/render_session_brief.py, which renders OPEN-ITEMS.json
  into CLAUDE.md — the only surface reaching a session before its first tool
  call. ⚠️ That channel is ITSELF unproven: OI-20260826-SESSION-BRIEF-NEVER-
  READ-BY-A-FRESH-SESSION is open and says no fresh session has ever been
  observed acting on it. So this object's done-condition is an OBSERVATION,
  not a deploy.

carried_out_of_scope:
  - what: >-
      Delete the two dead Routines (Health Check Routine trig_015diTGEy9jATecSPMFmPyNF,
      Sprint Continue Work trig_01SvpLKYiTKgXkeLgV7Q3pEr) — both enabled:true with
      next_run_at 0001-01-01, never fired, naming the pre-rename repo and branches that no
      longer exist.
    why: >-
      OPERATOR-ONLY. Attempted 2026-09-01 and refused by the control plane: both were created
      via http_api, and an agent may only delete or disable routines it created itself.
      delete_trigger AND update_trigger(enabled=false) both refused. No runner path exists —
      this is the Claude Code Remote control plane, not a VM action.
    ⚠️: >-
      Until the operator removes them the register keeps two routines reading enabled:true
      that can never fire. Health Check Routine also holds an unused stored OAuth token from
      2026-05-10, retired with it.

attempted_2026_09_08: >-
  MI-194 (session_01W7CyS8ShLnZiNyUms3YYEp) ATTEMPTED THIS OBSERVATION AND COULD NOT
  MAKE IT. Recorded because "not yet observed" is a real result, and leaving the
  attempt unrecorded would let the next session believe nobody has tried.
  ⚠️ MI-194 IS DISQUALIFIED AS THE OBSERVER, by this edge's own terms — it says
  "neither is this session reporting on its own work", and MI-194 owns Phase F and was
  told about the brief and the cycle priority directly in its dispatch. Self-certifying
  here would be worthless.
  ⚠️ AND THE OBSERVATION WAS NOT MANUFACTURED. Pointing another live session at
  CLAUDE.md and asking it to cite the brief produces a session that was POINTED, which
  is precisely what this edge excludes. The manager's 2026-09-08 instruction said so in
  terms, and it is right. So the attempt was RETROSPECTIVE: look for a session that had
  ALREADY read the brief unprompted, from evidence it left behind.
  POPULATION: the three other cold sessions spawned this morning (MI-191, MI-192,
  MI-193), via their coordination-board posts and PR bodies, plus a commit-message
  probe over the last 300 commits on origin/main.
  RESULT: none of the three cites the CLAUDE.md session brief as where it read the
  phase, the priority or the next step. All three were dispatched with explicit briefs,
  and MI-192 attributes its framing to "my dispatch brief" in so many words. The commit
  probe finds 32 commits mentioning "session brief" and 7 mentioning
  CY-20260906-TRADING-TRUTH (positive controls: "manager-lease" 54, "OPEN-ITEMS" 114 —
  the probe finds positives), but a MENTION is not a CITATION BY A COLD SESSION, and
  separating them needs reading rather than counting. Most of those commits are from
  sessions writing ABOUT the brief, which is the opposite of the evidence wanted.
  ⚠️ THE HONEST READING OF THIS IS NARROW: it is NOT established that no session has
  ever read the brief unprompted — only that no such evidence was found in the
  population searched, and that population is one morning's sessions plus commit
  subjects. The observation this edge names remains OUTSTANDING.
  ⚠️ AND NOTE THE STRUCTURAL DIFFICULTY, since it is why this has sat since 2026-09-01:
  every session that could serve as the observer arrives with a dispatch prompt, and a
  dispatch that says nothing at all is not something a manager currently produces. If
  that is not going to change, the honest move is an operator decision to change the
  criterion rather than an edge that can never discharge —
  OI-20260826-SESSION-BRIEF-NEVER-READ-BY-A-FRESH-SESSION carries the same question.

