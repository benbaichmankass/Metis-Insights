        truthfulness rather than in usefulness" and STILL never names the mechanism, so
        the honest reading is that both arms fail the same bar and picking the better
        failure is not an answer.
      the_direction_to_TAKE: >-
        Keep this as an ACTIVE RESEARCH LINE on two axes, and note the second is the
        wider one: (1) BETTER MODELS -- a different checkpoint, not merely a larger one
        from the same family; (2) BETTER WAYS TO BUILD MODELS -- the operator said
        "ways to BUILD", which is not checkpoint shopping. That admits fine-tuning or
