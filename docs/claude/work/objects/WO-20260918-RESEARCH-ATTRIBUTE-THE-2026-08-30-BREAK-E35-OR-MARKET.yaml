  MET, and the answer is that one of the two terms is not decidable.
  ⚠️ THE MEASUREMENT WAS ALREADY RUN AND IS STRANDED: PR #12205 (MI-278 U41,
  2026-09-13) verdicted `both_contribute`, and is OPEN / mergeable_state dirty,
  conflicting on six shared registers and on NO code. It was NOT re-derived.
  What MI-301 established instead, on the population reachable today
  (trades ids 4887-5886, 1000 rows; e35 8 pre / 20 post packages,
  untouched_control 47 pre / 103 post, 0 skipped):
  (1) The verdict's stop-out term enters `verdict()` as a HAND-TYPED
      `--stop-did-pp 11.6` CLI scalar whose population and provenance its own
      artifact never states, and the verdict reads only its SIGN — so that sign is
      the whole difference between `both_contribute` and `market_regime`.
  (2) The sign is KNIFE-EDGE: on the declared-only basis the DiD is +5.31pp and
      ONE additional stop-out in the treated pre cell flips it negative. The
      treated pre cell is 8 packages holding 2 stop-outs, BOTH from one leg on one
      symbol (ada_pullback_2h/ADAUSDT). Wilson CI on that cell is (7.15, 59.07)
      and CONTAINS the control's pre rate on both bases — the arms are not
      distinguishable in the pre era, which is the DiD's own baseline.
  (3) PER-LEG, which the row demands and every published artifact reports
      per-ARM: ALL 13 e35 leg x era cells grade `insufficient_n`, largest n=5.
      The per-leg half is NOT ANSWERABLE on this population.
  (4) PROVENANCE: the fabrication concern is REFUTED — ZERO fabricated rows in
      all four cells (the 2026-07-30 anchoring fix and the 2026-08-24
      recorded_exit_price reclassification removed the class). The coverage
      ASYMMETRY is real and is measured-vs-ESTIMATED: e35 pre 12.5% against
      control post 70.9%, a 5.7x spread.
  (5) The term is UNSTABLE UNDER REPULL: same basis, same row selection, the
      declared-only DiD reads 13.2 (U15, 09-12) -> 11.57 (#12205, 09-13) -> 5.31
      (09-17), while the e35 pre cell fell 18 -> 8 packages. Cause is the 1000-row
      journal clamp rolling forward and stripping the PRE era preferentially, so
      the evidence for this Tier-3 question DECAYS and no reachable route recovers
      it (/api/diag/journal has no offset and no date filter; the Data Explorer
      has a real offset but refuses this lane's bearer).
  VERDICT: the market half STANDS and #12205 should land; the e35-on-top half is
  `cannot_discriminate` with a `knife_edge` sign. Recommendation: do NOT revert
  e35 on this evidence, and do not read that as exoneration either.
