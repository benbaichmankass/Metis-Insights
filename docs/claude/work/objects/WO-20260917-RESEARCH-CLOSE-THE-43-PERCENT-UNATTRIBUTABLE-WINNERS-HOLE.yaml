  docs/research/mi295-active-management-focus-2026-09-17.md (landed ecf7b12a6, #12471) reads: "that is the
  HIGHEST-VALUE RESEARCH LEFT and U23 says so too. It is NOT a sweep -- it needs the exit-label recovery
