  ⚠️ IT IS TAKEN BECAUSE THE LANE RECOMMENDED IT, NOT OVER ITS RECOMMENDATION. That same memo's finding is
  that the M20 premise did not survive its own measurement -- 175 cells over 7 legs in 5 arms, nothing tested
  makes a winner run longer AND survives the gate -- so commissioning another sweep on the same features is
  the failure mode this repo has a rule about. This unit is the opposite move: repair the MEASUREMENT before
  acting on what it says, which is verbatim what the cycle priority CY-20260906-TRADING-TRUTH asks for.
  What rests on the hole: 43% of winners are unattributable or contaminated, so every count in section 1.2 is
  computed over a population nobody can vouch for, and the two surviving cells (both NARROWING the trade, both
  on ict_scalp_xrp_15m, which routes to bybit_1 = account_class paper, mutually exclusive) are the first
  things a cleaner population could kill or confirm.
done_condition: >-
  THREE facts, and they are different -- the lane says WHICH it established. (1) The recovered-label
  population is MEASURED with a stated recovery rule, a stated window and a POSITIVE CONTROL (the recovery is
  shown to find a label on rows whose answer is already known, before it is trusted on rows whose answer is
  not). (2) The section 1.2 counts are RECOMPUTED on that population, with the direction and size of any move
  stated. (3) The two surviving cells are re-graded against it.
  ⚠️ A RECOMPUTE THAT CHANGES NO CONCLUSION SATISFIES THIS. If the 43% shrinks and the verdict holds, that is
  a real result and is worth as much as a reversal -- the object closes on the population being KNOWN, never
  on the answer being different.
  ⚠️ AND 'THE LABELS ARE NOT RECOVERABLE' CLOSES IT TOO, if it is established with its positive control and
  its denominator: that would mean the 43% is permanent from every surface this lane can reach, which is a
  harder fact than a number and forces a different decision. It must be RECORDED as that finding rather than
  left looking like a measurement about to happen.
