  FIXED in this session for the bare-marker case: system-actions.yml now refuses `message:` equal to a YAML block marker (| |- |+ > >- >+) with an error naming the single-line parse. REMAINING, and why this row stays open: the guard is enumerative, so it catches the shape that bit us and not the general case of a message that parses SHORTER than the author intended. The durable fix is for the wrapper to assert a plausible length -- or echo the queued body back -- so a truncated ping can never read as a delivered one. Also worth auditing whether `reason:` and other single-line fields have produced the same silent truncation elsewhere.
