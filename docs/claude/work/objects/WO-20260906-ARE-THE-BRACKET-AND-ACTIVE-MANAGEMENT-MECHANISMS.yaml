answer: >-
  Written 2026-09-06: docs/research/exit-lever-wiring-audit-2026-09-06.md.
  (1) IN THE ROADMAP: YES for the thesis, NO for the done-condition. M20 is literally
  titled "Active Trade Management" (renamed 2026-08-20 by operator directive) and
  docs/design/exit-mechanism-construction-PROCESS.md § E3.6 carries the thesis with a
  falsifier and a named ML track. BUT M20's done-condition is the coverage matrix
  ("no pending/blocked rows on live legs"), which grades whether a lever was SCREENED,
  not whether trades end at their brackets — so M20 can be declared DONE with the
  thesis 100% unmet (320 of 468 cells are already honest_negative). None of E3.6's
  three new capabilities has a matrix column. Replacement done-condition proposed in
  the memo.
  (2) IS IT BUILT: the whole post-entry toolkit lives in TWO units (trend_donchian 22
  legs, htf_pullback_trend_2h 19) plus ict_scalp's own stale_stop. exit_ladder has
  ZERO acting call sites (three observe-only tiers), regime_flip_exit has ZERO call
  sites (its own docstring says so, deliberately). 120 of 459 cells grade a lever as
  tested on a leg whose unit cannot run it; ~87 of those are DEFENSIBLE
  research-before-build (exit_ladder 45, regime_flip_exit 42) and 33 are a genuine
  mislabel where the correct status blocked:no_lever_consumer_in_unit already exists
  and is used on 5 sibling cells. The ict_scalp n/a cells are CORRECT as a status and
  ARE the operator's gap: n/a there means the family has no active management to
  refine at all.
  ⚠️ ROOT CAUSE FOUND: no strategy can EXTEND a target — every monitor() returns
  {"sl": ...} and `return {"tp": ...}` exists nowhere in src/units/strategies/. The
  channel is built end-to-end in order_monitor and has ONE producer, on shadow
  turtle_soup. And on 25 of 44 live legs there is no reachable take-profit at all
  (15 carry the 50R sentinel clamped by tp_venue_cap.TP_VENUE_CAP_PCT=0.099 — Bybit's
  rejection threshold — and 10 declare none). On 56.8% of the live fleet "it hit the
  take profit" is structurally impossible, so the giveback the operator observed is
  the ATR trail working as designed on legs whose design contains no profit-taking
  prediction.
  (3) IS IT APPLIED: YES — 46 of 46 shipped/shipped_gate_failed cells are armed on the
  running trader, zero drift. (An initial 1-cell disagreement was MY predicate being
  wrong, not the matrix: tlt_pullback_1h's shipped cell is `sm2`, a stop-mult cell.)
  But realised closes (n=120 directional, 2026-08-27→2026-09-06): bracket 29.2%, of
  which take-profit 5.8%; active-management levers 7.5% on three legs;
  reconciliation/plumbing 63.3%.
  RECOMMENDED FIRST BUILD: (1) split the matrix vocabulary + add a CI detector
  (Tier-1); (2) ship the exit head into ict_scalp.monitor() — the ONLY passed-gate
  cells blocked purely on missing code, 3 legs reproduce and 2 must be excluded
  (Tier-3); (3) give the 25 targetless live legs a reachable stated target, via
  E3.6's ML-2 calibration-first path (Tier-3); (4) build the extend-target producer,
  the one lever class that is free (Tier-3).

