  ['PREFER AN ANCESTRY TEST OVER BACKFILLING RECEIPTS (proposed by the author of board-post.yml, 2026-08-21): a request file that is reachable from origin/main is FINISHED BY DEFINITION, so the relay can skip it regardless of whether a receipt exists on the current branch. Backfilling makes each individual case correct; the ancestry test makes the class impossible. The 003 backfill already merged (#10086) is the instance fix and does not close this row.', "Make the skip decision independent of which branch is running -- e.g. resolve the receipt against origin/main as well as the current branch, or key idempotency on something durable (a marker committed alongside the request, or an existence check against the issue's own recent comments) rather than on a branch-local file.", 'Whatever is chosen, it must NOT reintroduce either known pathology: no [skip ci] on a commit that can become a PR head, and no unbounded self-retrigger.', 'PROVE it with a real two-branch exercise: leave a receipt-less request on main, push a NEW board post from a fresh branch, and confirm exactly ONE comment appears -- reading the board itself, never the receipt file (misreading the receipt as the post is the error that produced the earlier four duplicates).', 'Sweep automation/board-posts/ on main for any other receipt-less request before closing, and backfill or remove them; 003 was found only because it was about to fire a fourth time.', "Fix or correct the 'PR keeps its CI' claim in BOTH pr-opener.yml and board-post.yml headers -- staging outside the trigger path prevents the retrigger, NOT the zero-check head. Either stop the relay taking the head (e.g. push results to a side ref or an artifact rather than the PR branch), or state plainly in both headers that a relay run leaves the PR needing an ordinary commit to re-arm CI.", 'Treat the fix as covering ALL push-path relays, not board-post alone: pr-opener, pr-close, claude-pr-automerge and vm-driver share the identical results-commit-takes-the-head shape. A fix for one that leaves the others is not a fix.', "Handle the merge-from-main path explicitly: main permanently carries other PRs' spent request files under the trigger paths, so a routine sync re-fires a relay through no action of the author's. Either make the relays no-op WITHOUT committing when there is nothing pending, or stop them pushing to the PR branch at all."]
