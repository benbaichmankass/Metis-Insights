    candle_files_checked: 7
    flat: 5
    real: 2
    not_candle_data: 1
    detail: |-
      REAL (pass): data/backtest_candles.csv — 5000 rows, 4873 distinct closes,
      4999/4999 non-zero returns, sd 8.18e-4. data/btc_1m_sample.csv — 10080
