done_condition: |-
  Transcribed from the MI-157 dispatch. (1) Measure the POPULATION first and
  state it — every file under data/ohlcv/ and anywhere else committed candle
  fixtures live; per file: row count, distinct closes, distinct opens, whether
  the return series is degenerate; how many were checked and how many are flat,
  a census and not a sample. (2) Find every consumer, establishing which can
  actually reach these fixtures and which reach real fetched data instead, with
  a positive control before trusting any quiet probe. (3) Repair: each file
  either replaced with real fetched candle history shown to have a plausible
  number of distinct closes and a non-degenerate return distribution, or DELETED
  with its consumers made to fail loudly rather than silently read a flat
  series — chosen per file, with the reason stated. A silent fallback to a flat
  series is the defect and must not be reproduced in the fix. (4) Ship the
  regression test that asserts non-degeneracy so the class cannot come back.
