    The one thing definitely corrupted was the TEST, filed as
    BL-20260907-MANIFEST-BACKTEST-TEST-WAS-GREEN-OVER-A-FLAT-LINE-FOR-MONTHS
    and fixed in the same change.
  not_done: |-
    No strategy backtest was run, re-run or re-interpreted, per the dispatch —
    this repaired the instrument and deliberately produced no verdict from it.
    `config/`, `src/runtime/` and every order path are untouched.
