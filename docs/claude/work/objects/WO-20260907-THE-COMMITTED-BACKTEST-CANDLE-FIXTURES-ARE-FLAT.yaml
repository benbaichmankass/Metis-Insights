      just the close. MI-151 reported the close; the bar is worse.
  consumers: |-
    ⚠️ THE DISPATCH'S FRAMING WAS WRONG IN THE REASSURING DIRECTION AND IS
    CORRECTED HERE. It pointed at `BACKTEST_DATA_PATH` ("read by 23 files per
    CLAUDE.md") as the consumer set. Measured: 21 files reference that variable
    and EVERY ONE of them defaults it to `data/backtest_candles.csv`, which is
    REAL. The `BACKTEST_DATA_PATH` fleet never reaches `data/ohlcv/` at all, by
    default or otherwise — no file under `data/ohlcv/` is named as a default
    anywhere in that fleet. Acting on the dispatch's premise would have audited
    21 files that were never at risk and missed the one that was.
    THE ONLY ROUTE to the flat fixtures is `data/ict_validate_manifest.csv`,
    whose four rows name four of the five files, read by exactly two consumers:
      * `bin/backtest_ict.py --manifest` (its own reader, `_load_ohlcv` — a
        SECOND candle reader, distinct from `scripts/candle_io.py`);
      * `notebooks/ict_multi_symbol_backtest.ipynb`, whose Cell 4 FETCHES real
        candles over those paths before Cell 5 backtests them.
    The fifth file (`spy_5m_2026.csv`) is named by NOTHING — it is an orphan
    left over from the manifest's 5m→15m SPY upgrade.
    The live consumer that actually consumed the flatness was
    `tests/test_backtest_ict_cli.py::test_ict_validate_manifest_runs_all_pairs`,
    which ran the full ICT backtester over all four and asserted success. It
    passed, in CI, for months. Probes used a positive control throughout: the
    `data/ohlcv` reference search returns 12 files while the same probe returns
    66 for `backtest_candles.csv`, so the short list is a measurement.
  repair: |-
    ALL FIVE DELETED — one decision, applied uniformly, for three reasons.
    (a) `.gitignore` line 75 ALREADY declares `data/ohlcv/*.csv` ignored; the
    files were force-added past the repo's own stated intent in 29014899
    ("placeholder OHLCV data"). Deleting them restores the declared design
    rather than imposing a new one.
    (b) The one designed workflow that reads them fetches over them first, so
    they only ever served to make a path exist.
    (c) Replacement was possible for at most two of the five from this sandbox
    (`data.binance.vision` answers 200 for crypto; Bybit is 403 and Yahoo 429,
    so SPY/QQQ could not be fetched here) — and a mixed population of two real
    and three flat files is the ORIGINAL defect with better numbers, since you
    would again be unable to tell them apart without measuring.
    `data/ohlcv/README.md` replaces them: the path now declares what belongs
    there, why it is empty, exactly what the deleted files contained, and the
    two fetch commands that populate it.
  fail_loudly: |-
    The defect was the SILENCE, not the files, so the deletion is the smaller
    half. Both candle readers now refuse a degenerate series AT THE READ:
    `scripts/candle_io.py::load_candles` (9 research consumers) and
    `bin/backtest_ict.py::_load_ohlcv` (the manifest path). Both import the
    single grader `scripts/candle_variance.py::grade_close_variance` rather than
    re-deriving the rule — two definitions of degeneracy would drift exactly the
    way the two candle READERS already drifted on JSONL
    (BL-20260809-TWO-CANDLE-READERS-DIVERGE-ON-JSONL).
    THREE STATES, NEVER COLLAPSED: `non_degenerate` passes · `degenerate` raises
    `DegenerateSeriesError` · `not_gradeable` (fewer than 2 usable closes, so no
    return series EXISTS — *we could not look*) is warned and returned, never
    folded into a pass. A test asserts all three states are reachable, so the
    grade cannot decay back into a boolean.
    `test_ict_validate_manifest_runs_all_pairs` is replaced by
    `test_ict_validate_manifest_absent_data_fails_loudly`, which asserts the
    opposite contract: a manifest pair whose file is absent must produce a NAMED
    per-pair error, never a silent zero-trade success.
  detector: |-
    `scripts/ci/check_candle_fixture_variance.py`, registered in
    `scripts/ci/run_guards.py` as `candle-fixture-variance-guard` with
    `when: None` (UNGATED — the class is defined by a file's CONTENT, not its
    location, so a glob on `data/` would miss a flat corpus committed anywhere
    else). It censuses every tracked candle-shaped file and prints the
    population alongside the failures, so a run that graded nothing can never
    read as a clean pass. Its `--self-test` runs on EVERY invocation, because
    silence from a detector nobody has seen fail is the "green that checked
    nothing" this repo already has a rule about.
    ⚠️ WHY A DETECTOR AND NOT A NOTE: this finding ALREADY had a written record
    and the record did not stop it. BL-20260820-PLACEHOLDER-CANDLE-FIXTURES-CARRY-NO-MARKER measured the same five files on 2026-08-20 and they were
    still flat, still committed and still being read 18 days later when MI-151
    tripped over one. That row's own done_condition demanded the guard be shown
    to FIRE on one of the five AND stay silent on `data/backtest_candles.csv`;
    both are now asserted as tests, so it is satisfied and is closed by this
    object.
  what_this_calls_into_question: |-
    LESS THAN FEARED, and the reason is worth carrying. Both research artefacts
    that touched these files CAUGHT them and routed around them:
    `docs/research/ml2-predictive-bracket-2026-09-06.md` (MI-151, the finding
    that dispatched this) used the trainer's real corpus instead, and
    `docs/research/eth-regime-classweight-recalibration-2026-08-02.md` states
    outright that the fixtures "are synthetic ... and were not used". So NO
    research verdict is known to be corrupted, and the careful-session-does-
    arithmetic habit is what caught it both times — which is exactly the habit
    that should not have to be relied on, hence the guard.
    ONE GAP IS FILED, NOT INVESTIGATED (the dispatch forbade re-deriving any
    conclusion resting on a flat fixture):
    BL-20260907-S006-M7-GO-NO-GO-VERDICT-MAY-REST-ON-FLAT-FIXTURES — the S-006
    M7 go/no-go verdict records no provenance for the candles it scored, so
