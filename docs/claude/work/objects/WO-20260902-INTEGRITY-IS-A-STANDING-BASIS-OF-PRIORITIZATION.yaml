  The instruction hierarchy states how INTEGRITY relates to the cycle priority -- whether it PREEMPTS, sets a FLOOR, or is one of the stages the operator may name -- in a form a session can act on without asking. ⚠️ It must not resolve to 'integrity always wins': the design's own warning is that integrity can absorb unlimited effort while the chain moves nowhere, and that warning was written from measured evidence (45 governance/hardening sprints against 2 deployments in August). A rule that reproduces that ratio has failed even if it satisfies the words.

why: >-
  Operator, 2026-09-02: '[system] integrity, super important, and that should be, like, a basis of prioritization and work in general.' The operating-model design currently ranks NOTHING against anything -- A2 says the operator picks the held-up STAGE each cycle, and INTEGRITY is one of two SUPPORT functions that feed the chain rather than sitting on it, explicitly 'bounded, since it can absorb unlimited effort while the chain moves nowhere'. This directive is in tension with that bounding and the tension must be resolved deliberately rather than by drift. It is not hypothetical: today I spawned MI-81 on a four-days-overdue integrity row while the cycle priority was the STEERING half, and I recorded the priority call as arguable precisely because the model gave me no rule to appeal to.

