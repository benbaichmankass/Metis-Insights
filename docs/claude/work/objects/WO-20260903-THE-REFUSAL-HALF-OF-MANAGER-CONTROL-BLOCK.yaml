# ⚠️ THIS FILE WAS AUTHORED BY THE SUB-SESSION, NOT BY ITS MANAGER, AND THAT IS
# ITSELF THE FINDING. MI-93 was dispatched naming this object as its parent and
# NO FILE EXISTED — measured 2026-09-03 against `docs/claude/work/objects/`,
# where the three sibling units of the same wave (MI-88, MI-89, MI-90) all had
# one. `spawn_gate.grade` rule 2 REFUSES a spawn whose object id names no file
# ("a parent that does not exist is not a parent"), so this spawn would have
# been refused had it gone through the gate — which is the measured hole
# `spawn_gate.py`'s own docstring names: it binds only spawns that go through
# `register`, ~92% of them, and is routed around by writing a `create_session`
# prompt by hand.
#
# Authored here so the work is not an orphan the constraint readout cannot see.
# ⚠️ A MANAGER SHOULD CHECK THE `why`/`source` BELOW AGAINST WHAT IT ACTUALLY
# INTENDED: they are reconstructed from the dispatch brief and from
# CYCLE-PRIORITY.json, not from the manager's own words.

review_trigger: >-
  When PR #10905 merges or is closed. If it merges, the object moves to
  `landed_unproven` territory rather than `done` — see `done_condition`.

done_condition: >-
  A manager is OBSERVED running `scripts/ops/pr_action_gate.py` against a real
  action it was about to take, and either acting on a `permitted` or standing
  down on a `refused`. ⚠️ MERGING #10905 DOES NOT SATISFY THIS. The gate is
  manual-only and binds nobody until invoked; a merge is a deploy, and a deploy
  is not an observation. ⚠️ NEITHER DOES A GREEN SELF-TEST: 46 planted-failure
  cases pass in a harness, and the harness is precisely what cannot reach a
  manager's decision. ⚠️ AND IF A MANAGER RUNS IT AND ROUTES AROUND THE REFUSAL,
  that does NOT close this object either — it is a more useful finding than a
  clean pass, and belongs in the record rather than being scored as success.

why: >-
  Implements DEC-20260902-HOW-A-MANAGER-IS-HELD-TO-ITS-MANDATE -> `both`: the
  derived read AND the refusal that uses it. MI-89 (#10896) shipped the read.
  MEASURED, from docs/claude/CYCLE-PRIORITY.json :: current.why clause (3),
  operator-set 2026-09-02 — a manager "undrafted and armed #10857 while its
  author was still RUNNING, because there was no way to ask -- and nothing
  objected", and "a RUNNING session cannot be reached, an IDLE one CAN be woken,
  and nothing tells the manager which it is". Verified against the PR itself:
  #10857 (claude/mi83-per-merge-ping) created 2026-09-02T20:46:36Z, merged
  21:59:16Z.

