blocked_on:
  - kind: external_event
    ref: "PR #10905 merging, and then a manager actually invoking the gate"
    since: 2026-09-03
    note: >-
      MEASURED and INFERRED are separated here deliberately.
      MEASURED: the gate discriminates on live data. Population — all 8 open PRs
      on benbaichmankass/Metis-Insights plus a 100-row `list_sessions(mine=true)`
      page (91 idle, 6 archived, 3 running), read 2026-09-03T~07:2xZ. It REFUSED
      #10895, whose author session_018ruZdgEkPZ1XceWzLwuYUU was genuinely
      RUNNING, and PERMITTED the other 7 (two of them `no_author` automation
      PRs). `run_guards.py --base main` PASS 83 / FAIL 0 / SKIP 0 after
      committing; 46 self-test cases; 38 pytest cases.
      NOT MEASURED: that any manager will run it. That is what this edge names,
      and it is the whole risk — a refusal nobody invokes is indistinguishable
      from no refusal at all, which is the same shape as
      OI-20260901-CYCLE-PRIORITY-IS-RENDERED-BUT-NO-SESSION-HAS-ACTED-ON-IT.
      ⚠️ THE GATE IS DELIBERATELY NOT WIRED INTO CI, so nothing forces its use:
      CI holds no `mcp__*` tools and could only ever grade the liveness input
      `unknown`, and a permanently-amber check is one everyone learns to walk
      past. That trade is argued in the module docstring rather than assumed.

blocked_on_basis: >-
  ASSESSED 2026-09-03 by session_01A38DipTvNyB843X4gnmA23. The edge above is a
