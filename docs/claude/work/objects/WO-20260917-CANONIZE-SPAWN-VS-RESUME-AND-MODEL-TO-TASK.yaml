closed_observation: >-
  DONE 2026-09-17, done_condition MET, and VERIFIED BY THE MANAGER READING THE MERGED DIFF rather than accepted
  on the lane's own claim -- which is the distinction the checklist rule exists for. PR #12485 merged as
  5db8c47ad. CLAUDE.md gained ONE bullet in the manager section, placed between the lease bullet and the
  registry bullet, and it carries every clause this object required: the operator's words for both rules; the
  BENEFIT-not-subject-area test with the MI-295 (memo) / MI-298 (needed a PR BRANCH) discriminator spelled out;
  the measured 91.1M + 102.4M cache-read tokens and $125.05 WITH its population stated as n=2 lanes, one
  manager, one day, a reading of the default and not a fleet census; the at-dispatch clause with 'read what a
  session has produced before interrupting it'; the four model ids and the fact that create_session's `model`
  defaults to the CALLER's; and the requirement to record the choice AND ITS REASON in the SESSIONS.json row.
  docs/claude/work/README.md gained 74 lines of the operational detail beside the spawn contract.
  [!] THE explicitly_not_in_scope CLAUSE HELD: no enforcement mechanism was built, and the bullet states the
  refusal and its reason (CI cannot read a create_session call) rather than leaving it as an omission a
  successor would read as an oversight.
  [!] THE LANE WAS THE FIRST APPLICATION OF THE RULE IT WROTE: fresh rather than resumed, and on
  claude-sonnet-5 passed EXPLICITLY. Cost $12.43 / 46,984 output tokens, merged ~19 minutes after spawn,
  against $55.82 and $69.23 on the two Opus lanes the same day. n=1 lane on a doc unit -- that is a data point
  about THIS unit, not a general claim about the models.
  [!] WHAT THIS DOES NOT ESTABLISH, and why MI-300 stays `landed_unproven` on the checklist while this object
  closes: no manager has been OBSERVED reading either rule and acting on it before a spawn. The object's
  criterion was the EDIT and that is met; adoption is a different fact and belongs to whoever sees it first.
  [!] ONE INCIDENT WHILE MERGING, recorded rather than smoothed over: the lane and the manager filed the SAME
  TWO backlog ids independently, because the spawn prompt cited them as references while the manager's copies
  sat on an unmerged branch where backlog_append's duplicate probe could not see them. The register merged as a
  single whole-file conflict. Resolved through update_row/append_row, never by picking a side, and filed as
  BL-20260917-NAMING-A-BACKLOG-ID-IN-A-SPAWN-PROMPT-MAKES-THE-LANE-FILE-IT-SO-TWO-SESSIONS-LAND-THE-SAME-ID-WITH-DIFFERENT-BODIES.
