type: work_object
parent_intent: IN-20260903-TRADING-SYSTEM-HEALTH
title: >-
  Canonize the two spawn-economics rules a manager must apply: FRESH-vs-RESUME, and MATCH THE MODEL TO THE TASK
stage: BUILD
lifecycle: done
owner: session_01LuKhJhxiK1K8h1ZVPYJjZ9
opened_at: 2026-09-17
closed_at: 2026-09-17
why: >-
  OPERATOR-DIRECTED 2026-09-17, in two parts and in the operator's own words.
  (1) FRESH vs RESUME: "The only reason to reuse the session is if the next unit benefits from the context
  that the session developed while working on the previous task. But if it doesn't benefit, then we should
  start fresh." And then, explicitly, that it must not stop at this session: "we need to make sure that this
  is also canonized correctly for future manager sessions and not just left as a lesson that we learn here
  and then forget and don't apply it going forward."
  (2) MODEL TO TASK: "not every task requires Opus 5. Obviously the manager I want to be able to understand
  what's going on ... but the other one, if anything can be wrong, say Sonnet or Haiku, that's also fine.
  Let's just make sure we match the model to the task."
  [!] THE SECOND COMPOUNDS THE FIRST AND THAT IS THE MEASURED FACT: create_session's `model` parameter
  DEFAULTS TO THE CALLING SESSION'S MODEL, so a manager running on Opus spawns Opus lanes silently, without
  ever deciding to. MEASURED 2026-09-17 on both live lanes via get_session: session_017PQcFJne7qyuVHzH5RZtFC
  and session_01SzoZAiXJibakevDU9pbwxm both read configured_model 'claude-opus-5' and NEITHER was passed a
  model by the manager. The model was inherited, not chosen.
  [!] THE COST BASIS, so this does not read as a preference. Measured on those same two lanes at 2026-09-17
  ~21:38Z: cache_read_tokens 91,107,145 ($55.82) and 102,412,896 ($69.23) -- 193.5M cache-read tokens and
  $125.05 across two lanes, against 141,352 + 226,761 OUTPUT tokens. Essentially the entire spend is a
  resumed session re-reading its own accumulated context every turn. A fresh session starts at roughly 40k.
  [!] AND IT IS A CANON EDIT RATHER THAN A HABIT BECAUSE THE PROSE-ONLY ROUTE HAS ALREADY FAILED TWICE IN
  THIS REPO on the manager's own duties -- MI-15 (register the spawn) was restated and re-measured worse, and
  BL-20260903-MANAGER-CHECKLIST-GOES-STALE-SILENTLY-AND-STATUS-REPORTS-IT-AS-CURRENT is the same shape. A rule that lives only in one
  session's context dies with that session, which is the argument CLAUDE.md already makes for the lease, the
  registry and the checklist.
done_condition: >-
  BOTH rules are written where a manager reads them BEFORE it spawns -- CLAUDE.md's manager section and
  docs/claude/work/README.md -- each carrying its MEASURED basis rather than an assertion, and each stating
  the test to apply rather than a preference.
  RULE 1 (fresh vs resume): the test is whether the NEXT unit benefits from the context the session built.
  It must state the discriminator that made it non-obvious here: MI-295 landed a MEMO, not machinery, so its
  successor MI-298 depended on a PR BRANCH (#11933's sweep code) and not on the session's context -- i.e.
  'same subject area' is NOT the test.
  RULE 2 (model to task): the default is INHERITANCE, so choosing is an ACT. State that create_session's
  `model` defaults to the caller's, name the model ids, and give the shape of the choice the operator gave:
  the manager wants a strong model because it must understand the whole picture; a well-specified lane where
  a mistake is recoverable does not.
  [!] AND ONE THING THE CANON MUST NOT CLAIM, because this manager got it wrong today: the fresh-vs-resume
  test applies AT DISPATCH. Once a session is RUNNING the comparison is cost-per-unit-DELIVERED, not
  cost-per-turn, and an interrupt forfeits everything not yet landed. This manager read a cost meter, killed
  two RUNNING lanes without reading what they had produced, and both had landed complete deliverables in
  exactly those minutes. The canon must say READ WHAT A SESSION HAS PRODUCED BEFORE INTERRUPTING IT.
  [!] A RESTATEMENT IN CHAT DOES NOT SATISFY THIS. The artifact is the edit on main.
