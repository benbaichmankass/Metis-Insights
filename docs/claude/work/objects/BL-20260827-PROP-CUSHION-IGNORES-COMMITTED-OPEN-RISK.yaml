done_condition: |-
  compute_rule_distance publishes the account's COMMITTED OPEN RISK (sum over open prop positions of |entry - stop| x qty, via the existing find_open_prop_positions) as its own field beside the cushion, and prop_risk_gate subtracts it before grading a new ticket — so a ticket is graded against what is LEFT, not against the whole cushion. States must not be collapsed: a position whose stop is unknown makes the committed risk UNKNOWN (never 0.0 — that is the anti-conservative direction on an account-killer, the same error BL-20260823-PROP-DAILY-CUSHION-FABRICATED-FROM-A-MISSING-REALIZED-TODAY records), and it must be distinguishable from a genuinely flat book. Also publish the BALANCE-basis distance beside the equity-basis one rather than replacing it, and record which metric Breakout actually breaches on from a primary source. NOT sufficient: a bigger warning in the ticket text — the 2026-08-27 ticket ALREADY warned ('AS OF THE LAST REPORT this risk did NOT fit: $75.00 vs $64.00') and the trade was placed anyway; the number a decision reads has to change.
