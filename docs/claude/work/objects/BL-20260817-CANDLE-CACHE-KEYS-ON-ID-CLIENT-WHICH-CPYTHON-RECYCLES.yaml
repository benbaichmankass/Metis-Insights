next_action_at_migration: |-
  Replace `id(client)` with a per-object token that is unique for the object's LIFETIME rather than for the address: attach a lazily-assigned monotonic counter (e.g. `client._mkt_cache_token`) and fall back to NOT CACHING when it cannot be attached (a __slots__ client), since refusing to cache is always safe and guessing is not. Do NOT 'fix' it by holding a strong reference to the client in the cache entry — that would keep exchange sockets (and IB clientIds) alive past their intended lifetime, trading a correctness bug for a resource bug on the path BL-20260706-IBACCTUPDATES-COLLISION already governs.
