  - id: DEC-20260909-M20-EXIT-EVAL-NEAR-MISS
    question: >-
      M20's 60s exit-eval promise was BREACHED on 2026-09-07 - recorded fact from the alert
      latch, not inference - and today's worst interval clears it by 48.8 ms. The distribution
      body is unchanged since 2026-08-25; only the tail moved. Every instrument still reads
      'within' and 'breaches: 0'.
    urgency: routine
    asked_on: '2026-09-09'
    context: >-
      Audit F-50. exit_interval_soak n=989 intervals over 12 processes, 2026-09-09T08:36:14Z to
      16:54:41Z: mean 29880.6, median 29993.1, p95 34886.9, MAX 59951.2, over_requirement 0 of
      1000. exit_loop_health_alert_state carries requirement_breach_process
      2026-09-07T22:48:54Z, and exit_loop_health.py writes that field ONLY when a breach fires
      the alert - so the 2026-09-07 breach is recorded fact. Mechanism by arithmetic from the
      row's own neighbours: interval = (cadence - prev_pass) + cur_pass, so the requirement
      breaks whenever a pass is >30s slower than the one before. Here prev=1448.9ms,
      cur=31399.1ms, delta=29950.2ms - it missed by 49.8ms. One row in the window (pass_ms
      34691.6) would have produced a 63,050ms interval had it followed a median pass. Against
      2026-08-25 (n=991, same window shape): MAX 45034ms and 15.0s of margin, pass 2222ms mean /
      19481ms max; today MAX 59951.2ms, margin 48.8ms, pass 2921.4ms mean / 34691.6ms max. Body
      unmoved: mean 29879 -> 29880.6, median 29970 -> 29993.1. The 11 restart gaps were measured
      separately today at 25.3-53.9s, 0 of 11 over 60s, 1.3% of wall clock - clean, but
      unwatched.
    options:
      - key: near_miss_and_restart_gap
        label: Near-miss band plus grade the restart gap
        implication: >-
          Tier-2 observability; changes no order path. The binary grade cannot see a 48.8ms
          miss, and the restart gap is excluded by construction.
      - key: also_route_to_outcomes
        label: That, plus route breaches to the ERROR feed
        implication: >-
          Adds the delivery fix - the breach page never writes outcomes.jsonl, so it reaches
          neither Telegram nor /api/bot/logs. THIRD instance of that class after
          ib_stop_over_cover and bybit_over_cover.
      - key: investigate_the_tail
        label: Find the slow pass first
        implication: >-
          Establish what makes one pass 34.7s against a 2.9s mean before changing any
          instrument.
      - key: accept_the_margin
        label: Accept the margin, watch only
        implication: >-
          Records 48.8ms as acceptable and leaves the instruments as they are.
