  A quantitative claim about money names the SOURCE it was measured from, and a claim sourced from the journal for an account with a known broker-truth discrepancy is either cross-checked against that broker truth or is stated as a journal figure rather than as the account's result. The concrete, testable half: `comms/broker_truth_ledger.json` already records which accounts under-record, and nothing warns a reader who queries those accounts' journal rows - so surfacing that discrepancy ON the per-account read path (a flag on /api/bot/trades/closed or the Data Explorer when the account has a broker-truth record) would have caught member 1 mechanically. Members 2-4 share the narrower rule that a field SITTING IN THE ROW BEING READ (position_size, exit_price) outranks a label in the same row; that one is a review-discipline item and should be written where it will actually be read rather than added as a fifth bullet to a rule that already exists. NOT resolved by restating 'always verify' - that rule was in force and binding for all four.
