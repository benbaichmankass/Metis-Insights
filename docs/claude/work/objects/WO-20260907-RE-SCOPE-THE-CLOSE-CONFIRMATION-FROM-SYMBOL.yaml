done_condition: >-
  A reviewable Tier-3 diff exists for IBClient.close and both AlpacaClient close paths, the partial-reduction question is PRESENTED to the operator rather than silently decided, the failure branch keeps confirmed/not-confirmed/could-not-look distinguishable, and a regression test reproducing two-open-rows-one-symbol FAILS on today's code. Nothing merged into a live path.

why: >-
  IBClient.close and both AlpacaClient close paths confirm a close by requiring the whole SYMBOL to reach flat when the close is of a single TRADE, so any account holding other lots of that symbol can never confirm and the failure branch leaves the journal row open. 13 (account,symbol) pairs held 2+ simultaneously-open rows in 28 days. COUPLED TO MI-140: alpaca_live is immune only because it cannot place orders, so fixing MI-140 ARMS this on real money.

