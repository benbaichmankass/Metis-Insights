operator_coupling: |
  COUPLED TO WO-20260907-ALPACA-LIVE-S-ROUTED-REAL-MONEY-LEG (MI-140), operator decision 2026-09-07.
  alpaca_live (REAL MONEY) shares alpaca_client.py's identical symbol-scoped close confirmation and is
  immune TODAY for exactly one reason: it cannot place orders at all. FIXING MI-140 ARMS THIS DEFECT ON A
  REAL-MONEY ACCOUNT. The two must not be worked or landed independently.
  bybit_2 (REAL MONEY) is NOT exposed - Bybit has no close-confirmation at all (0 hits for
  BYBIT_CLOSE_CONFIRM; positive control returns IB + Alpaca). It escapes on a missing venue gate, not on
  its trade shape, so do NOT 'fix' Bybit by adding a confirmation as a side effect.

operator_steer: |
  OPERATOR STEER, 2026-09-07: "shouldn't we be able to mark the relevant trade as closed without assuming
  the whole position is closed?" YES - and this SETTLES the symbol-vs-trade half of the open design question.
  Confirm on THE TRADE'S OWN QUANTITY DELTA, not the symbol's flatness. That delta is observable even with
  siblings: MGC went 54 -> 11, and that IS trade 5531's 43 lots leaving.
  WHAT MUST BE PRESERVED - the check is not merely wrong. ib_client.py's own comment records it was added
  because a close ACCEPTED BUT NEVER FILLED left a real position open while the monitor marked the row closed,
  and step 1 had already cancelled the bracket, so the position was NAKED (the MHG adopt -> sl_cross ->
  re-orphan flap). 'DB closed always means broker confirmed' is worth keeping. Change the MEASUREMENT, not the
  guarantee.
  STILL OPEN AND STILL THE OPERATOR'S: the WITHIN-TRADE partial fill. 43 requested, 30 filled - confirm and
  journal a partial / refuse and retry the remainder / split the row. They differ in what happens to the
  leftover lots' PROTECTION. A risk call, not a correctness call: bring it back with the diff, never decide it
  silently.
  MANAGER CAVEAT, NOT ESTABLISHED: whether BOTH Alpaca close paths can observe a per-trade delta as cleanly as
  IB. They use a different position read. Establish it PER VENUE rather than assuming symmetry; if Alpaca
  cannot, the honest answer there may differ from IB's and must be said rather than smoothed over.
sweep_2026_09_11: |-
  COHORT RULE 3 ("non-migrant, individually read") of the MI-243 dormant sweep, 2026-09-11.
    THE RULE, stated before it was applied: a dormant object that is NOT a Phase-C migrant (47 of the
    622 dormant rows at `main` 4e9255acb) gets an INDIVIDUAL read, because it has no shared provenance
    to grade as a group. Each was graded into exactly one of: `done` where there is CHECKABLE completion
    evidence (4 rows); `ready` where it is live, operator-directed work with a clear done_condition and
    no completion evidence (42 rows); or LEFT `dormant` where it could not be graded (1 row).
    ⚠️ THE ASYMMETRY IS DELIBERATE: `ready` is the default and `done` needs evidence, because a row
    wrongly queued is corrected by whoever picks it up, while a row wrongly closed is not looked at again.
    ⚠️ `ready` HERE MEANS QUEUED, NOT STARTED, AND NOT ASSESSED FOR BLOCKERS. No `blocked_on` edge was
    invented for any of these rows — an invented edge is read by the constraint computation as a true
    blocker, and a false blocker is worse than a missing one.
  ---
  GRADED `ready` (QUEUED). Live, operator-directed work with a clear done_condition and no
    evidence of completion found by this sweep. It was moved out of `dormant` because `dormant`
    means "carried, not started, NOT queued" (this store's own migration note), and that is a
    false description of work the operator asked for and still wants.
