blocked_on_basis: >-
  ASSESSED 2026-09-08 by the owning session, from the code, from the Alpaca API
  reference, and from the recorded operator decision on #11279 in
  `docs/claude/work/OPEN-PRS.json`. Exactly ONE edge. ⚠️ IT IS NARROWER THAN
  MI-173'S QUESTION 3 AS PUT, and the narrowing is the finding: question 3
  asked "strict vs reduction", and the strict/reduction half is ALREADY
  ANSWERED. The operator answered it for IB on 2026-09-08 — a partial fill
  REFUSES, "erring toward a phantom OPEN row that existing reconcilers clean up,
  rather than a phantom CLOSED row that fabricates PnL on the remainder and
  leaves lots naked" — and this change is `strict` in exactly that sense: a
  reduction that lands only partly does not confirm, retCode 1, the row stays
  open. So that is the same answer applied to the mirror venue, not a default
  that drifted. What is genuinely undecided is the MEASUREMENT: #11279's
  approval scope reads "EXPLICITLY NOT Alpaca — Alpaca's mirror defect is
  decided separately on #11312", and that decision has not been made. Here the
  whole-symbol path KEEPS its flatness gate untouched and only the new partial
  path measures the trade's own quantity delta. ⚠️ The edge does NOT block the
  operation change, which is approved and complete. ⚠️ And the MI-140 coupling
  is deliberately NOT written as an edge: MI-140 is HELD UNTIL THIS LANDS, so
  the dependency runs the other way, and recording it backwards would make the
  constraint computation read a deadlock that does not exist.

evidence: >-
  CAPABILITY QUESTION ANSWERED FIRST, which was the proposal's own first step:
  a qty-scoped close CAN be expressed at the venue. `DELETE
  /v2/positions/{symbol_or_asset_id}` documents a `qty` query parameter — "the
  number of shares to liquidate. Can accept up to 9 decimal points. Cannot work
  with percentage" — read from the Alpaca API reference on 2026-09-08. So the
  second branch of the done condition (record that it cannot be expressed) does
  NOT apply, and the operator's approval holds.
  TEST POPULATION, measured against `main`'s src by reading each failure's
  EXCEPTION TYPE rather than by counting reds. 18 tests: 16 failed, 2 passed —
  and only SIX of those failures are BEHAVIOURAL. Those six are the evidence,
  and they go through `execute.close_open_position` / `execute.modify_open_order`,
  whose signatures are IDENTICAL on both trees, so on `main` they run the real
  defect and report it. TEN fail with `TypeError` — they hand the CLIENT a qty
  that has no parameter on `main`, which is the ABSENCE OF THE FEATURE and not a
  demonstration of the defect; they pin per-path behaviour the end-to-end six
  cannot see, but they are not counted as evidence. TWO pass on both trees and
  are the only true either-way controls. ⚠️ AN EARLIER VERSION OF THIS BLOCK
  CLAIMED TEN BEHAVIOURAL FAILURES AND WAS WRONG IN THE FLATTERING DIRECTION.
  The cause was a test-design weakness — the core claims were expressed through
  the NEW signature, so on `main` they could only say "no such parameter" — and
  it was fixed by ADDING three caller-level tests, not by rewording. Recorded
  rather than quietly overwritten.
  ⚠️ THE modify_protective HALF IS NO LONGER HYPOTHETICAL — evidence that arrived
  AFTER this work was written, from MI-179 (#11330), which landed on main while
  this PR was open. MI-173 found a hybrid OCO on alpaca_portfolio/TLT and could
  NOT distinguish cross-trade contamination from journal/venue divergence,
  because the deciding log line was past the journal's ~30-minute retention.
  MI-179 settled it from the leg's `submitted_at` — four days after its own
  parent and after trade 5414 opened — as CONTAMINATION: trade 5414's routine
  trailing amend rewrote trade 5266's stop to 82.33 against 5266's declared
  84.61875, a 2.29 error on a live protective level. Filed as
  BL-20260908-ALPACA-TRAILING-AMEND-PATCHED-A-SIBLING-TRADES-STOP-TO-THE-WRONG-DECLARED-LEVEL.
  So the symbol-scoped PATCH this change repairs has FIRED on a real book. ⚠️ NOT
  VERIFIED BY THIS SESSION — that is MI-179's live read, cited, not reproduced.

  ⚠️ AND THE THIRD VERB IS STILL OPEN AND IS NOT IN THIS SCOPE. MI-179 also filed
  BL-20260908-ALPACA-PLACE-PROTECTIVE-IGNORES-OCA-KEY-SO-EVERY-RE-ARM-IS-SYMBOL-WIDE:
  `place_protective`'s pre-cancel is unconditional and the `oca_key` its caller
  passes to scope it is silently ignored. This object covers `close` and
  `modify_protective` only, so a re-arm still cannot be placed on Alpaca without
  cancelling every leg on the symbol. Naming it so the close+modify fix is not
  read as making Alpaca protection trade-scoped in general.

  NOT ESTABLISHED, stated rather than filled in: live acceptance of `?qty=`
  against a real Alpaca position. No broker call was made from this session.
  Also not established: whether any over-close has ever actually fired — that
  was MI-171's measurement and was not reproduced here.

