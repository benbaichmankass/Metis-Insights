done_condition: >-
  EITHER the Alpaca close and modify_protective act on the named trade's quantity rather than the whole symbol, verified by a test that fails on today's code; OR it is established from the Alpaca API that a qty-scoped close cannot be expressed, and THAT is recorded as the finding with the consequence stated. The approval explicitly does not force the change if the venue cannot support it.

why: >-
  AlpacaClient.close(symbol) takes no qty; execute.close_open_position validates the per-trade qty then never passes it, so closing one trade liquidates the whole symbol. modify_protective carries the identical scope defect on a different verb and is filed nowhere. Tier-3, operator-approved 2026-09-08.

