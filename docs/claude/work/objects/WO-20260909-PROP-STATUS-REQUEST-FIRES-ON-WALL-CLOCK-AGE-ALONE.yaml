id: WO-20260909-PROP-STATUS-REQUEST-FIRES-ON-WALL-CLOCK-AGE-ALONE
type: commitment
parent_intent: IN-20260903-TRADING-SYSTEM-HEALTH
title: >-
  The prop status-request pings on wall-clock age alone, so a genuinely quiet account is indistinguishable from one that moved and was never reported
stage: DECIDED
lifecycle: in_flight
owner: session_01FoASvmUGuahCphE1cewPPs
opened_at: 2026-09-09
closed_at: null
review_trigger: >-
  Operator-raised. Re-read if the prop bridge changes shape or if breakout_1 is
  retired; otherwise it stays ready until owned.
done_condition: >-
  The prop status-request's TRIGGER keys on whether anything has HAPPENED since the last snapshot, not on wall-clock age alone, AND the ask still fires (a) on any fill reported since the last snapshot and (b) before a new ticket is sized. ⚠️ BEFORE ANY OF THAT, THE OPERATOR'S PREMISE IS MEASURED AND REPORTED EITHER WAY: over the 228h window on breakout_1, the count of `prop_fills` rows against the count of `prop_account_status` rows. If fills occurred with no snapshot following, the premise is FALSE in the dangerous direction and the ping was doing its job — that is the more valuable finding and it CHANGES this object rather than completing it. ⚠️ NOT SUFFICIENT: restoring the pre-2026-08-14 flat bail (that is a Tier-2 operator-approved decision protecting the account-level static DD floor and re-adding it re-opens the hole); or raising PROP_STATUS_REQUEST_MAX_AGE_HOURS (four consumers share that threshold — the ask, the fill-ack nudge, prop_balance.max_age_hours() sizing gate, and the /api/bot/prop/status freshness verdict — and one definition of "too old to trust" is deliberate, so sizing can never run off a balance the safety panel has written off). CHANGE THE TRIGGER, NOT THE THRESHOLD.

why: >-
  Operator-raised 2026-09-09 on a live ping, verbatim: "This ping in the prop channel is unessacry, the account snapshot is updated when a trade closes, if there are no prop trades than the account state didn't change". The ping quoted was breakout_1 with no open positions and a snapshot 228h (9.5d) old. The operator is right that the trigger is wrong: it fires on the AGE of the last snapshot and nothing else, so it cannot distinguish an account nothing has touched from one that moved and was never reported — and pinging about the first trains the operator to ignore the second, which is the desensitized-alarm failure this repo has already paid for.

source: >-
  operator, in conversation, 2026-09-09; relayed by manager session_01HrmZ1RRNM4UnEUaFdrPEjj

measurement_result: >-
  MEASURED 2026-09-09T09:54Z by MI-214, and REPORTED EITHER WAY as the
  done_condition requires. Locators: /api/bot/prop/fills?limit=500 and
  /api/bot/prop/status, read direct over https://ict-bot.duckdns.org.
  THE PREMISE IS HALF FALSE. breakout_1's newest prop_account_status is id 19 at
  2026-08-30T19:33:29Z; its newest prop_fills row is id 41 at
  2026-08-30T19:39:00Z — the last close is 5.5 MINUTES NEWER than the snapshot
  it supposedly produced. So "the account snapshot is updated when a trade
  closes" is FALSE AS A MECHANISM: a close PROMPTS a snapshot (a fill ack with a
  folded balance nudge, or a screenshot that may or may not also yield an
  account_status) and never guarantees one. THE COUNTS the done_condition asks
  for, over the window from that snapshot to the read: prop_account_status rows
  = 0 (that is the window definition), prop_fills rows = 1 (id 41, SOLUSDT
  closed, +35.28). POSITIVE CONTROL, so the near-zero is not a broken probe: the
  same reader returns 41 fills lifetime, oldest 2026-06-22. Also 0 open
  positions (derived through prop_position_identity.position_key, which collapses
  buy->long — a naive key reports a phantom ETHUSDT 'buy' open from 2026-07-05
  and that reading is WRONG) and 0 unacted tickets.
  ⚠️ THE ONE FILL IS NOT EVIDENCE THE PING WAS DOING ITS JOB, and this is the
  finding that decided the design: prop_reconcile.reconstruct_equity is
  ASYMMETRIC BY DESIGN — an unplaceable LOSS is always applied, an unplaceable
  GAIN is withheld and counted (fills_withheld_unplaceable_gain). So a REPORTED
  fill can only ever make the cushion CONSERVATIVE, never optimistic; the
  dangerous direction is closed by construction. Fill 41 is exactly that case:
  the live panel reads distance_to_dd_floor_usd 87.34 with
  fills_withheld_unplaceable_gain 1, where the true cushion is ~122.62.

divergence_from_done_condition: >-
  ⚠️ RAISED, NOT SILENTLY RESOLVED — the manager's done_condition above is
  PRESERVED VERBATIM and this is a PROPOSAL against it, for the manager or the
  operator to rule on. Clause (a) says the ask must still fire "on any fill
  reported since the last snapshot". PR #11530 DOES NOT IMPLEMENT CLAUSE (a),
  deliberately, and the reason is the measurement above: fill id 41 postdates the
  snapshot, so a trigger written to clause (a) WOULD STILL FIRE ON breakout_1
  TODAY and would not have silenced the ping the operator complained about. It
  would also fire on precisely the case that cannot be unsafe, because
  reconstruct_equity has already absorbed it conservatively. What #11530
  implements instead, covering the same safety ground: ASK_POSITION_OPEN (an open
  position, whose UNREALIZED drawdown is invisible to the cushion and is the one
  genuinely unsafe case), ASK_TICKET_SINCE_SNAPSHOT (a real non-suppressed ticket
  created after the snapshot — which is clause (b), "before a new ticket is
  sized", OBSERVED rather than assumed), ASK_NO_SNAPSHOT, and UNKNOWN (we could
  not look). QUIESCENT is the only verdict that suppresses. IF THE MANAGER OR
  OPERATOR WANTS CLAUSE (a) AS WRITTEN, it is a one-line change to
  assess_activity and this object should be re-opened rather than closed — but
  the ping the operator objected to will come back.

operator_decision: >-
  APPROVED 2026-09-09, Tier-2, UNCONDITIONAL. The operator was asked directly,
  with the load-bearing claim stated as the thing being approved — that a
  REPORTED fill can only ever make the cushion CONSERVATIVE, so the bot may go
  quiet while the book is FLAT — and chose "Yes — ship it".
  ⚠️ THE SAME ANSWER RULES ON `divergence_from_done_condition` ABOVE, which is
  why that block stays as the record rather than being deleted: the alternative
  "Ship, but also fire on any fill since the snapshot" — clause (a) of this
  object's own done_condition, as literally written — WAS OFFERED alongside,
  together with the measurement that it would STILL fire on breakout_1 today,
  and was NOT chosen. Clause (a) is therefore DECLINED ON THE EVIDENCE, not
  overlooked, and this object's done_condition is satisfied by the other route
  it names. A successor must not re-open clause (a) as unfinished work.
  ⚠️ REVERSAL CONDITION: if a prop fill is ever observed making the cushion
  OPTIMISTIC — which would falsify reconstruct_equity's asymmetry — this
  decision must be re-put to the operator rather than inherited.
  ⚠️ NOT approved: changing PROP_STATUS_REQUEST_MAX_AGE_HOURS (untouched), or
  restoring the pre-2026-08-14 flat bail (not restored).

