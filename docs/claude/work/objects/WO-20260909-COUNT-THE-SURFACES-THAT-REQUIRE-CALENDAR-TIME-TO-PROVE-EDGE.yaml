  ANSWERED 2026-09-09 by session_01KSZCUtFKze3k7ZvxnTnD4T. FOUR confirmed surfaces plus one conditional, of which THREE are new (M7 was the control). POSITIVE CONTROL ESTABLISHED FIRST: the probe rediscovered scripts/ml/strategy_review_packet.py::decide -- all 7 branches -- WITHOUT being told the file or the function name, and REFUSES to print any count when it does not (exit 2; verified against a tree without check D, where counts read `None`, never `0`). POPULATION: 1,058 Python files / 8,464 functions across scripts+src+ml, 0 parse failures; 66 OPEN-ITEMS rows, 4 backlogs, 32 skills. NEW SURFACES -- (S2) ml/promotion/gates.py DEFAULT GateThresholds profile requires a 7 CALENDAR-DAY shadow_soak and 200 LIVE trades for every non-regime head, while canon's guard (tests/ml/test_gates.py) is scoped to the REGIME profile only: the M7 fact pattern one level up, where the rule is binding, the guard is real, and the guard does not reach the surface; (S3) backtest_fidelity_calibrate.py MIN_LIVE_N=30 makes 30 live trades a precondition for a leg's BACKTEST being admissible edge evidence, in a script whose own docstring says it exists because the old way "caps every decision at reality's clock"; (S4) exit-refinement SKILL.md P7 attaches DEMOTION to a realized live future_r_delta record. CONDITIONAL -- (C1) e2_feature_information.py power floors, live or offline depending on which panel is handed in, with the code not reading the panel's own source stamp. VERDICT ON THE MANAGER'S QUESTION: a FIX, not a redesign -- 3 new surfaces in 8,464 functions is not systemic -- but the three are the daily strategy-review gate, the ML promotion gate and the backtest-trust calibrator, so nearly every edge decision passes through one of them. The pattern is not widespread; it is load-bearing.

limit: >-
  THE COUNT IS A `lower_bound`, NOT `measured`, AND THAT IS THE MOST IMPORTANT RESULT. S2 -- the largest new finding -- was found by READING, not by any automated pass, and NEITHER PASS CAN EVER FIND IT: check D detects an accrual-gated verdict as CONTROL FLOW (an `if` whose body assigns a verdict), whereas S2 is a DATA FIELD (`required=th.require_shadow_soak`, a constructor argument). How many more gates of that shape exist cannot be bounded from inside the instrument, so reporting the number as `measured` would be the unprovenanced-diagnostic error this repo has a guard for. Filed as BL-20260909-CHECK-D-IS-BLIND-TO-A-GATE-DECLARED-AS-A-DATA-FIELD-NOT-A-BRANCH. Also stated: Pass C (prose) is a co-occurrence classifier -- 19 edge/both candidates yielded 1 confirmed finding -- its recall is unmeasured, and the 11 `mechanics` + 4 `unclassified` rows were NOT individually read. YAML/JSON config thresholds were reached opportunistically by grep, not by a systematic pass.

