  A strategy-review packet is committed on a cadence and read, and a Tier-3
  approval lands in exactly one place.

blocked_on: []   # nothing blocks this — a CLAIM, not an absence of information

note: >-
  ⚠️ THIS IS THE ONLY PHASE THAT IS UNBLOCKED TODAY, and it is the only one
  that touches the MEASURED constraint (DECISION). It depends on nothing this
  build produces. strategy_review_packet.py is 1,518 lines that emit a real
  action badge with reasons and an SLA, and write to a GITIGNORED path with no
  cron — so no packet has ever been committed. The repair is a cron and a
  committed path. C4: strategy_changelog.json has been dead since 2026-07-28,
  and squeeze_breakout_4h runs live today against a written record saying it
  was demoted for a 0% win rate over 60 closes.

scope_split:
  c3_decision_preparation: >-
    IN FLIGHT 2026-09-01. The cron (.github/workflows/strategy-review-packets.yml),
    --all-strategies, write_index(), and the committed path comms/strategy_reviews/.
    ⚠️ THE DONE-CONDITION BELOW WAS TOO WEAK AND THE FIRST RUN PROVED IT. It read
    "NOT done until a dispatched run has actually COMMITTED an INDEX.json — a green
    run with no committed index is a failure, not a pass." A run on 2026-09-01
    committed one (#10652, merged) and the criterion would have PASSED a broken
    artifact: all 52 rows carried null n_closed/win_rate/expectancy/pnl_total
    (the builder read them off the packet's top level; they live under
    packet["headline"]), and the selection filter compared proposed_action against
    "HOLD" while Decision.action emits lowercase — so every graded strategy counted
    as actionable and the PR carried 105 files against a design that commits
    selectively. Existence of an artifact is not evidence about its content; this
    is the "green is not evidence" class applied to my own done-condition.
    ⚠️ REVISED CRITERION: NOT done until a committed INDEX.json carries (a) non-null
    metrics on the rows, (b) the `actionable` flag per row and an `actionable` count
    on the envelope, and (c) a file count consistent with the selection rule — one
    index plus two files per actionable row, NOT one per graded row. Verify by
    reading the committed file, never by the run's conclusion.
  c4_decision_recording: >-
    DEFERRED, with a stated reason rather than silently dropped. C4 wants one
    decision record instead of four forked surfaces, and the obvious first move —
    a guard comparing the changelog's execution verdict against
    config/strategies.yaml — CANNOT be built honestly today: the 53 changelog
    entries carry only {date, ref, summary}, so the verdict exists solely as PROSE
    ("DEMOTED execution: live -> shadow ..."). Extracting it by pattern-matching
    English is sub-class A of the diagnostic-provenance defect this repo has a
    guard family for, and a guard that matches prose would be confidently wrong
    on the entries it misses. The honest path is a STRUCTURED field on new
    entries plus a reported denominator of un-structured ones — which is a design
    decision, not a wire, and belongs to its own change.
  ⚠️_do_not_read_this_object_as_c4_delivered: >-
    A concrete live instance is already filed as
    BL-20260901-DECISION-RECORD-SAYS-SHADOW-WHILE-CONFIG-SAYS-LIVE-SQUEEZE-BREAKOUT-4H,
    whose resolution_criteria require BOTH a reconciliation AND the executable
    check — because closing the instance without the check is exactly what left
    this class alive the two previous times it was fixed.

