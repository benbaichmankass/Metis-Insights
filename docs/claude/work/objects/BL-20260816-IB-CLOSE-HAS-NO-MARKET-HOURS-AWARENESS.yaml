title: |-
  WHY the IB close does not fill: it fires a MarketOrder into COMEX with outsideRth unset and NOTHING in the system knows whether the venue is in session -- the exact gap Alpaca's close path already closes
stage: INTEGRITY
lifecycle: dormant
owner: null
