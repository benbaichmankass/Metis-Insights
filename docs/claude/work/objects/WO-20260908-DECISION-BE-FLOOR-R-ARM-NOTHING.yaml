decision_requests:
  - id: DEC-20260908-BE-FLOOR-R-ARM-NOTHING
    question: >-
      be_floor_r (a fleet-wide break-even floor) was measured path-aware and every value
      tested LOSES money. Do you accept that the answer is to arm nothing?
    urgency: routine
    asked_on: '2026-09-08'
    context: >-
      POPULATION: 28 graded ratchet legs, 4090 control trades, BACKTEST — never poolable with
      the 89 LIVE telemetry rows, which are exactly what cannot be replayed. Net R against an
      ungated control of +671.58R: −145.16R at 0.5 · −128.13R at 0.75 · −99.08R at 1.0 ·
      −35.04R at 1.5. Every arm loses, MONOTONICALLY in the floor — the signature of forgone
      continuation. +0.75R, the peak of the earlier GROSS benefit table, is the second-worst
      arm tested, so the cost does not merely exist, it exceeds the benefit everywhere tested.
      ⚠️ YOUR UNDERLYING THESIS IS NOT REFUTED: the ratchet really does reach break-even at a
      median 2.00R against a median live peak of 0.84R, so the stop reached break-even on only
      14 of 89 trades. What is refuted is PINNING THE STOP AT ENTRY — on these legs the wide
      chandelier is load-bearing and exists to ride retraces. ⚠️ AND KNOW THIS BEFORE READING
      ANY FOLD-COUNT GATE: be_floor_r=1.5 wins a strict majority of exercised folds under ALL
      THREE panel members while still losing 35R, because 30–39% of its folds are INERT — the
      lever never fired. A gate written as "majority of folds positive" would have passed it.
    options:
      - key: accept_none
        label: Accept it — arm nothing, close the question
        implication: >-
          be_floor_r stays at its default 0.0 on every leg and is not re-proposed from the
          gross table. The harness lever stays in place (default is byte-identical), so a
          future question can re-open it with fresh evidence. OI-20260907-BE-FLOOR-R clears.
      - key: test_higher
        label: Accept for the tested range, but commission a higher floor (>1.5R)
        implication: >-
          A new sweep at 2.0R+ before any decision. ⚠️ The memo explicitly declines to endorse
          this by extrapolation: a floor that arms almost never converges on doing nothing,
          and 38.6% of folds are ALREADY inert at 1.5R — so the likely finding is "no effect",
          bought with trainer time.
      - key: different_lever
        label: Reject the lever, commission the banking half instead
        implication: >-
          Drops the break-even floor and puts the effort into the trailing/banking half you are
          still owed — moving the stop up to bank R as it accrues, rather than pinning it at
          entry. That is MI-188b, already measuring, and it addresses the same thesis without
          the forgone-continuation cost.
