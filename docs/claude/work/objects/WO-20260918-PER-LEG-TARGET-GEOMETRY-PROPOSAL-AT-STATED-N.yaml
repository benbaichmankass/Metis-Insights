  e35 corpus were joined.
  THE PACKET'S SHAPE IS NOT THE ONE THE QUESTION IMPLIED, over all 55 legs:
  a per-leg number is OWED on 8, is ALREADY IN CONFIG on 10, is REFUSED BY EVIDENCE
  on 31, and is UNKNOWN on 6.
  (1) 44 of 55 legs do not set their own target at all — TP_VENUE_CAP_PCT=0.099 does,
      resolved on the UNIT MODULE via monitor_unit_for (a family-only test under-claims
      and misses fade_breakout_4h outright, as tp_venue_cap's own docstring warns).
  (2) 26 of those 44 touch NO Bybit account, and 5 route REAL MONEY through alpaca_live
      (tlt_pullback_1h, tlt_pullback_1d, ief_pullback_1d, slv_pullback_1d,
      iaum_pullback_1d). A constant named for a Bybit venue limit is the operative
      take-profit on real-money US ETF legs. This needed the ROUTING table beside the
      geometry and neither source memo could say it alone.
  (3) THE e35 CORPUS COVERS 41 LEGS, NOT THE 19 MI-307 READ — 7,343 real-tp_r cells.
      Exactly 11 cells on 10 legs survive walk-forward with no timeout component and no
      inert-fold contamination, and ON ALL 10 THE SURVIVING CELL'S tp_r IS THE VALUE
      CONFIG ALREADY DECLARES. There is no unshipped per-leg tp_r hiding in the corpus.
      6 of those 10 ride path B (net_R only) and every one FAILS its own gate on
      maxdd_worse; 2 further cells were excluded for the BL-20260817 inert-fold shape
      (5 reported wins, 3 of 6 folds inert) — the folds were read, not the summary quoted.
  (4) The genuinely open decision is 8 legs wide (7 ict_scalp + fvg_range_15m, the
      non-clamping family), and NOT ONE places a real-money order today: the scalp legs
      route to bybit_1 (paper) and fvg_range_15m is execution: shadow despite its
