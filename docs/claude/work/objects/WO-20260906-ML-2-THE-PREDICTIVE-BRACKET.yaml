  clause_1_calibration_first: >-
    BUILT. src/research/bracket_quantile.py regresses a CONDITIONAL QUANTILE of
    the favourable excursion, so E3.6's falsifier is the training objective
    rather than an afterthought: a predicted q-quantile should be reached (1-q)
    of the time. The eval harness prints the calibration block BEFORE any P&L
    block, always.
  clause_2_reuse_mi148: >-
    HONOURED. No second calibration definition was authored. The percent-of-
    entry basis, the venue-cap constant and the reading of "the target sits at
    quantile X of realised exits" are all taken from MI-148's instrument.
    ONE correction, in MI-148's favour: its stated reason for avoiding R is that
    the R denominator is contaminated -- but that contamination is a property of
    the LIVE JOURNAL (trades.stop_loss is the final trailed stop), not of R. In
    the harness, Trade.sl is the entry bar's stop and no lever overwrites it, so
    the BACKTEST corpus is cleaner than live for this question and can express
    both bases exactly.
  clause_3_population_problem: >-
    SOLVED as to availability, and this was the first task rather than a caveat.
    In-sandbox it is impossible and that was established by arithmetic, not
    assumed: Bybit is 403 at the proxy, and the five data/ohlcv/*.csv files have
    EXACTLY ONE UNIQUE CLOSE EACH -- they are flat fixtures, not candles. The
    un-blocked route is the trainer, which holds 166k-184k 15m bars per symbol
    across BTC/ETH/ADA/BNB/AVAX plus 1d/1h equities and futures. This is the
    unit of work MI-148 named and left unclaimed.
  clause_4_propose_not_apply: >-
    HONOURED. No config/strategies.yaml, no per-leg target value, no arming, no
    runtime caller. Nothing in src/ imports bracket_quantile.
  the_finding_that_matters: >-
    CALIBRATION ALONE IS VACUOUS, and this session's own first cut proved it.
    The unconditional empirical quantile is calibrated BY CONSTRUCTION, so a
    model can pass E3.6's falsifier while knowing nothing. Three defects were
    found by RUNNING the controls rather than reviewing them: (1) the optimiser
    destroyed calibration it was handed for free -- MACE 0.179 on PURE NOISE;
    (2) a plain model-beats-baseline test scores estimator efficiency as a win
    (+0.006..+0.027 on no-signal data), so the shuffled-label null now GATES the
    verdict per quantile; (3) THE SELFTEST GRADED ONE DRAW AND WAS WRONG,
    reporting the no-signal arm as 5/5 when across 6 seeds it is [0,1,0,2,0,1]
    of 5 -- the exact failure e2_null_calibration.py exists to prevent.
    Instrument now validated as a RATE: TPR 1.00 (6/6), FPR 0.00 (0/6).
  open_at_this_point: >-
    Whether BACKTEST exit locations match LIVE ones is NOT established.
    scripts/research/backtest_fidelity_calibrate.py exists for the OUTCOME half
    (win-rate + realised-R distribution) and, measured, HAS NEVER BEEN RUN --
    no artifact anywhere in the repo, with comms/research/ existing and holding
    one other file as the positive control. It also grades outcome agreement in
    R, not exit LOCATION in percent-of-entry, so it is not the instrument this
    question needs even once it is run. Reported as a finding, not assumed away.

