  Make the two sides agree on which tree they describe. Cheapest correct fix: in `main()`, when `--base` is given, read the body from the SAME revision the diff describes (`git show HEAD:<path>`) instead of the worktree, so linenos and body_lines are consistent by construction. Alternative: have `_added_lines` return the added TEXT with enough surrounding context to satisfy the window without needing absolute line numbers at all. Do NOT fix by widening ANNOTATION_WINDOW — the window is deliberately tight for row-structured JSON (its own comment records that a wide window previously harvested unrelated `checked:`-shaped strings from elsewhere in the file, an unasserted-denominator defect in the guard written to catch unasserted claims), and widening would trade a false positive for a false negative.
