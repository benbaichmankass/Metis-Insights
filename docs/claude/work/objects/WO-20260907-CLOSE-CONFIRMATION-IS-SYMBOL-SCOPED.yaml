  - kind: object
    ref: WO-20260907-ALPACA-LIVE-S-ROUTED-REAL-MONEY-LEG
    since: 2026-09-07
    note: >-
      ⚠️ COUPLING — THE ORDERING CONSTRAINT, AND IT RUNS BOTH WAYS. MI-140 must
      NOT be remediated before this lands. alpaca_live is REAL MONEY and is
      immune today for exactly one reason: it cannot place orders at all (both
      signals since arming were shorts suppressed by the operator's
      `side_filter: long` gate). Fixing MI-140 arms an Alpaca close-path defect
      on a real-money account the same day.

      ⚠️ THE COUPLING HOLDS BUT ITS TECHNICAL BASIS IS NOT WHAT THE DISPATCH
      STATED, AND A LATER SESSION MUST NOT LOOK FOR THE WRONG DEFECT. The
      dispatch's premise was that MI-140 arms THIS defect — the symbol-scoped
      false refusal — on real money. MI-168 established BY MEASUREMENT that it
      does not: both AlpacaClient close paths are symbol-scoped in their
      OPERATION too (`close(symbol)` takes no qty and issues
      `DELETE /v2/positions/{sym}`; `_close_extended_hours` reads qty from the
      LIVE POSITION; `execute.close_open_position` discards the per-trade qty on
      the alpaca branch), so operation and confirmation MATCH, symbol-flatness
      is reachable, and the false refusal cannot occur there. What MI-140 arms
      is the MIRROR defect: an OVER-CLOSE, where closing trade A silently
      liquidates sibling trade B's shares while B's journal row stays open with
      nothing behind it. That is arguably worse — an over-close liquidates a
      position nobody journalled closed, where a false refusal merely withholds
      a close. Both claims are pinned by tests in
      tests/test_close_confirm_trade_scope.py.

      ⚠️ APPLYING MI-167's PROPOSED "identical change" TO ALPACA WOULD INSTALL A
      FALSE-SUCCESS ON A REAL-MONEY-CAPABLE PATH (BL-20260707 re-introduced) and
      was deliberately NOT done. The Alpaca over-close needs its own unit: the
      honest fix is to make the OPERATION trade-scoped, which is a materially
      larger order-path change than a confirmation re-scope.

  - kind: backlog_row
    ref: >-
      bybit_2 is NOT exposed and must NOT be "fixed" by adding a confirmation
    since: 2026-09-07
    note: >-
      NOT a blocker — recorded here because it is the edge a future session is
      most likely to get wrong. bybit_2 (REAL MONEY) has NO close-confirmation
      at all: `grep -rn "BYBIT_CLOSE_CONFIRM" src/` returns 0, with the positive
      control `grep -rn "_CLOSE_CONFIRM_S" src/` returning IB and Alpaca, so the
      probe demonstrably finds confirmations that exist. It escapes on a MISSING
      VENUE GATE, not on its trade shape, and it IS among the 13 pairs holding
      concurrent open rows. Adding a confirmation to Bybit would arm a NEW gate
      on a real-money account, is explicitly not what was approved, and — on
      this unit's own evidence — a gate whose scope is not thought through is
      how this defect was created.

