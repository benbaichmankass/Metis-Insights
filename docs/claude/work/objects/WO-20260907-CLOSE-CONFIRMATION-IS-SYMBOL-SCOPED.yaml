done_condition: >-
  The Tier-3 diff in docs/design/close-confirmation-scope-DESIGN.md is APPROVED
  and merged, or explicitly REJECTED — either settles it; being un-actioned does
  not. ⚠️ TWO THINGS MUST BE SETTLED TOGETHER AND THEY ARE DIFFERENT DECISIONS.
  (1) The re-scoping itself. (2) The PARTIAL-REDUCTION question, deliberately
  left open by MI-167 and NOT decided silently here: `IB_CLOSE_CONFIRM_PARTIAL`
  ships at `strict` (a 40-of-43 fill does NOT confirm, erring toward a phantom
  OPEN row) with `reduction` implemented and tested (erring toward a FABRICATED
  PnL on the unclosed remainder plus naked lots). Approving the PR without
  saying which behaviour was chosen leaves a default drifting where a decision
  belongs. ⚠️ AND MERGED IS NOT OBSERVED: closing this also needs a real close
  on a symbol holding a sibling's lots seen CONFIRMING on the fleet. A passing
  harness cannot reach that — 12 green tests are not an observation of the live
  mechanism.

why: >-
  Measured by MI-167 on ib_paper/MGC 2026-09-07 from the systemd journal: trade
  5531's 43 lots filled in full and were sold by our own stop at 11:45:06Z
  (order 547, Filled 43.0 @ 4392.9). The close SUCCEEDED at the venue and was
  graded a FAILURE at 11:45:09Z — `close not confirmed flat: live_qty=11.0` —
  because sibling trade 5353 legitimately held 11 lots, so the symbol could
  never be flat, so the gate could never be satisfied. The failure branch
  deliberately leaves the journal row open: a realised -$17,024.28 absent from
  the book, a phantom 43-lot open row, and 43 re-armed sell lots resting over an
  11-lot position. The precondition is common, not exotic — 13 (account, symbol)
  pairs held two or more simultaneously-open rows in the 28-day window.

