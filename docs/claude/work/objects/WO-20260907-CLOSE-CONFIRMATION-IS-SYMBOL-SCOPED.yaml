id: WO-20260907-CLOSE-CONFIRMATION-IS-SYMBOL-SCOPED
type: commitment
parent_intent: IN-20260903-TRADING-SYSTEM-HEALTH
title: >-
  The close-confirmation gate is symbol-scoped while the close is trade-scoped,
  so a succeeded close is graded a failure and its journal row left open
stage: EVIDENCE
lifecycle: waiting
