verdict: >-
  DEFERRED — the re-arm CANNOT be performed safely with the capabilities that exist today,
  and this is a MEASURED refusal rather than an unestablished one. Basis: MEASURED (live
  venue reads) + MEASURED (code read against origin/main ed37f5ba). NOTHING WAS PLACED,
  CANCELLED, AMENDED OR CLOSED on any account.

  POPULATION AND READS. /api/diag/alpaca_open_orders, per-account `read_state: orders_read`
  — a confirmed clean read, never the summary line (MI-177) — twice: 2026-09-08T04:47:34Z
  (fleet-wide, 11 accounts) and 04:50:13Z (alpaca_portfolio). Identical both times, so the
  state below is stable and this session changed none of it.

  MEASURED STATE. alpaca_portfolio holds TLT short 72 shares @ 82.309028. Exactly ONE OCO
  pair rests: buy limit 74.67 qty 16 (292b3240, submitted 2026-08-31T13:36:40Z) and buy stop
  82.33 qty 16 (742c3729, submitted 2026-09-04T17:35:55Z). Journal: trade 5266
  (tlt_pullback_1d, short 16, stop_loss 84.61875, opened 08-31) and trade 5414
  (tlt_pullback_1h, short 56, stop_loss 82.32875, opened 09-03); 16 + 56 = 72, matching the
  venue exactly. So 56 of 72 shares carry no protective leg — the briefed condition,
  independently confirmed. alpaca_live was verified FLAT (0 positions, 0 orders,
  read_state `orders_read`) and was not touched.

  BLAST RADIUS — the constraint that decided this, established from code, not guessed.
  `AlpacaClient.place_protective` (alpaca_client.py:1361) is the ONLY path in the repo that
  places an Alpaca protective leg, and its ONLY caller is
  `order_monitor._attempt_naked_autoprotect`. At line 1405 it calls
  `_cancel_open_orders_for_symbol(sym)` UNCONDITIONALLY, which DELETEs every open order on
  the symbol for that account — parents and nested legs — i.e. BOTH of trade 5266's legs.
  The `oca_key` that `_attempt_naked_autoprotect` passes specifically to scope that cancel,
  under a comment naming BL-20260814, is honoured by `IBClient.place_protective` and is
  SILENTLY IGNORED by the Alpaca one. No other route reaches the goal either:
  `modify_protective` PATCHes existing legs and cannot create coverage for uncovered shares;
  `close(symbol)` is whole-symbol with no qty (MI-173); `place()` is a bracket MARKET ENTRY,
  which on a short would REDUCE the position; and the `system-actions` allowlist carries
  `flatten-alpaca-position` and `attach-ib-target` but NO Alpaca protective-attach action,
  so no sanctioned wire exists to invoke a repair from a session. Filed as
  BL-20260908-ALPACA-PLACE-PROTECTIVE-IGNORES-OCA-KEY-SO-EVERY-RE-ARM-IS-SYMBOL-WIDE.

  ⚠️ THIS WORK ORDER'S OWN PREMISE IS CORRECTED, AND THE CORRECTION IS THE MORE VALUABLE
  FINDING. The brief states the resting 16-share leg belongs to trade 5266 and matches the
  journal, echoing BL-20260820-OVERCOVER-REMEDIATION-CANCELLED-THE-JOURNAL-MATCHING-LEG.
  The leg IS 5266's (qty 16; limit 74.67 = 5266's take_profit_1 74.670375) but it DOES NOT
  MATCH 5266's journal: 5266 declares stop_loss 84.61875 while the leg rests at 82.33, which
  is trade 5414's declared 82.32875 to 2dp. The stop leg's submitted_at postdates its own
  parent's by four days and postdates 5414's open — the signature of a PATCH leg-replace —
  and the un-patched alpaca_paper mirror carries TLT stop 84.62, so 84.62 is what
  tlt_pullback_1d declares. Mechanism: `execute.modify_open_order`'s Alpaca branch calls
  `modify_protective(symbol, sl, tp)` with no trade scope, and that method PATCHes EVERY
  stop leg on the symbol — so trade 5414's routine trailing amend rewrote trade 5266's
  protective level. Filed as
  BL-20260908-ALPACA-TRAILING-AMEND-PATCHED-A-SIBLING-TRADES-STOP-TO-THE-WRONG-DECLARED-LEVEL.
  Both are recurrences of BL-20260825-THE-TRAILING-AMEND-NEVER-PASSES-OCA-KEY-SO-IT-STILL-CANCELS-SYMBOL-WIDE on a venue where the scoping parameter does not exist to be passed.

  WHY THE POSITION HAS STAYED NAKED, so nobody re-derives it: the Alpaca naked sweep
  (`order_monitor._check_broker_naked_equity_positions`) grades stop coverage as a
  SYMBOL-WIDE BOOLEAN — `if state.get("stop"): continue` — so 5266's resting leg makes the
  whole TLT symbol read "stop armed" and trade 5414 is skipped on every pass. It will never
  self-heal. That is the subject of WO-20260908-ALPACA-PROTECTIVE-COVERAGE-IS-GRADED-BY-SIDE
  and is deliberately NOT duplicated here.

  WHAT WAS NOT ESTABLISHED, rather than filled in. We did NOT read the audit trail to
  confirm which amend wrote 82.33 at 2026-09-04T17:35:55Z — the price and timestamps make
  trade 5414 the strong reading, and it is recorded as a reconstruction. We did NOT measure
  quantity-coverage across the other Alpaca accounts; that is the sibling WO's job.

