done_condition: |-
  Narrow 'executable position' for string literals: a path inside a string counts as WIRING only when the enclosing statement also names a process-launching or dispatch construct (subprocess.*, os.system, shlex/shell invocation, a workflow `run:` step, an argv list), and counts as a MENTION otherwise. Must be shipped with a self-test case for BOTH directions -- a prose string naming a script must NOT silence the guard, AND a subprocess argv naming a script MUST still count as wired -- because a one-directional test would let the hardening create the false negative it is meant to prevent. Re-run the full self-test and state the count; 8/8 with two new cases means 10/10, and anything less means the hardening broke an existing case.
