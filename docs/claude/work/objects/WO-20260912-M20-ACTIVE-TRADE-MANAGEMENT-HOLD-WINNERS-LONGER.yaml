decision_requests:
  - id: DEC-20260913-FOUR-LEG-DISPOSITION
    question: >-
      PB-20260821 asks for a kill / demote-to-shadow / hold decision on four legs.
      The M7 gate cannot produce one (U34 proved the KILL/DEMOTE matrix is gated on
      >=20 LIVE closes and both shadow legs grade structurally_ungradeable, so
      waiting cannot grade them). What disposition do you want for each of
      slv_trend_1h, htf_pullback_trend_2h, eth_pullback_2h and tlt_pullback_1h?
    urgency: routine
    asked_on: '2026-09-13'
    asked_by: session_01Wv1BdfEUnmCBZrhvUjeBzb
    context: >-
      MEASURED 2026-09-13 (MI-278 U42) off two live pulls, trader git_sha f2335be98.
      Instrument scripts/research/kill_case_admissibility.py; memo
      docs/research/m20-u42-the-kill-case-does-not-rest-on-measured-rows-2026-09-13.md.
      THE ROW'S OWN JUSTIFICATION IS GONE: it names slv_trend_1h as "the only large
      loser whose loss is well MEASURED (coverage 0.77)". That leg now reads coverage
      0.00 at 30d and 0.26 at lifetime, and its 30d defensible PnL is +49.56 -- a GAIN
      -- against a -735.11 headline carried by 2 unmeasured rows. Its LIFETIME loss
      does survive (-4214.86 admissible over 12 rows), so the instinct was not wrong;
      the stated reason was.
      || WHERE EACH LEG STANDS. slv_trend_1h: shadow since 2026-08-24, 3 PAPER
      accounts, never on real money, lifetime loss_survives. htf_pullback_trend_2h:
      shadow since 2026-08-23, bybit_1 paper only; its lifetime real-money rows
      predate its 2026-07-16 demote off bybit_2; PAPER LIFETIME GRADES loss_inverts --
      headline -4459.45 against an ADMISSIBLE +2130.53, with 17 of 23 rows unmeasured.
      eth_pullback_2h: LIVE on bybit_2 REAL MONEY, and on real money it is -$15.49
      over 15 lifetime closes (-$0.33 over 4 at 30d) -- approximately flat, not a kill
      case. tlt_pullback_1h: LIVE on alpaca_live REAL MONEY and has NEVER placed an
      order there -- 19 of 19 alpaca_live journal rows are `rejected`, zero closed,
      2026-08-18 to 2026-09-11 (U39's dry-booking finding from the other side).
      || [!] THE LEG WITH THE WORST HEADLINE HAS THE BEST EVIDENCE. htf_pullback_trend_2h
      is the one whose admissible record is a GAIN and the one U34 found carries
      net_r_oos +2.7261 over n=79 at FAITHFUL fidelity, the highest standard the
      builder emits. A kill argued from this row's premise would be arguing against
      the only positive evidence in the set. This is NOT a promotion proposal.
      || [!] TWO OF THE FOUR ARE ON REAL MONEY and the row was filed as a class of
      PAPER losers -- it has never said so.
      || [!] NOTHING HERE IS AN EDGE TEST. Admissibility grades PROVENANCE: whether a
      loss survives restriction to rows anyone can stand behind. A leg whose loss
      survives may still be worth keeping, and one whose loss inverts may still be
      worth killing on other grounds.
    options:
      - key: hold_all_four_pending_evidence
        label: Hold all four; record that the M7 gate cannot decide them and stop re-measuring
        implication: >-
          Nothing changes on the fleet. The two shadow legs stay parked on a stopped
          accrual clock and the two live legs keep trading as they are. This is a
          legitimate answer and it CLOSES PB-20260821 -- the row's criterion is a
          decision per leg, and "hold, for this stated reason" is one. What it costs
          is that htf's positive offline edge stays unharvested and tlt keeps a
          nominal real-money route that places nothing.
      - key: kill_the_two_shadow_legs
        label: Retire slv_trend_1h and htf_pullback_trend_2h outright
        implication: >-
          Removes two legs that cannot be graded by waiting. [!] For htf this kills
          the leg whose admissible record is +2130.53 and whose offline OOS edge is
          the best of the four -- defensible only if the reason is "we will not carry
          ungradeable legs", NOT "it lost money", because on the rows we can stand
          behind it did not.
      - key: repromote_htf_keep_slv_shadow
        label: Return htf_pullback_trend_2h to live (paper bybit_1) on its offline edge; leave slv in shadow
        implication: >-
          Restarts the only accrual clock that could ever settle this row, on the leg
          with the best evidence, at no real-money risk (bybit_1 is paper-class).
          [!] Tier-3 and it reverses an operator-approved demote made 2026-08-23 on a
          4-axis discharge, so it needs the reason for THAT demote to be re-read
          first -- U42 did not re-read it and does not claim it was wrong.
      - key: fix_tlt_route_first
        label: Deal with tlt_pullback_1h's dead real-money route before dispositioning anything
        implication: >-
          tlt is declared live on real money and has placed nothing in 25 days. Until
          that is resolved its record cannot inform any decision, and the declaration
          is misleading on every surface that reads execution state. This defers the
          other three rather than answering them.
      - key: something_else
        label: A different disposition, per leg
        implication: >-
          Say which leg gets which of kill / demote-to-shadow / hold and the reason;
          it is recorded per leg against PB-20260821's criterion.
    blocking: false
    notes: >-
      NOT BLOCKING. U42 continues to the next unit; nothing waits on this answer, and
      no parameter, roster or execution value was changed by the unit that raised it.

  - id: DEC-20260917-SCALP-MARGIN-BOUND-SIZING
    question: >-
      On roughly a quarter of ict_scalp orders the per-trade SIZE is set by available
      margin rather than by the declared 1.5% risk policy -- provably so, at any
      balance. The limiter is undeclared, moves with the book, and is recorded only on
      refusal rows. Do you want it left as-is and RECORDED as the policy, swept offline
      before any change, or made observable first? A stop floor is deliberately NOT
      offered as a ready option -- see the context.
    urgency: routine
    asked_on: '2026-09-17'
    asked_by: session_01Wv1BdfEUnmCBZrhvUjeBzb
    context: >-
      MEASURED 2026-09-17 (MI-278 U45) off two live pulls -- /api/diag/journal
      table=trades and table=order_packages, limit=1000 each, ids 4867-5866,
      2026-08-21 -> 2026-09-17, rowset digests declared in the memo. Instrument
      scripts/research/margin_bound_sizing_basis.py (50 self-test + 41 pytest controls;
      8 planted defects, 8 caught). Memo
      docs/research/m20-u45-the-size-is-the-ceiling-and-the-stop-is-why-2026-09-17.md.
      || THE PROOF NEEDS NO NEW STAMP AND NO BALANCE. The risk sizer demands
      equity x risk_pct x entry / risk_per_unit; the margin pre-flight cap allows
      basis_usd x leverage x buffer; and because every basis the sizer may use is at
      most equity, the equity term CANCELS. risk_pct x entry /
      (risk_per_unit x leverage x buffer) >= 1 proves the cap binds at ANY balance --
      equivalently, whenever the declared initial stop is closer than
      10000 x risk_pct / (leverage x buffer) = 55.56 bp at bybit_1's declared 1.5% / 3x
      / 0.9. On the pull: 43 of 274 gradeable sizer-output rows are provably bound,
      provableCoverage 0.2445, and the control against each row's OWN stamped ceiling
      is SOUND with ZERO false positives on 32 stamped rows.
      || [!] IT IS A FAMILY PROPERTY, NOT AN AVAX ONE, WHICH IS NOT WHAT THE ROW SAYS.
      42 of the 43 bound rows are ict_scalp_* orders; the other 16 legs on the account
      contribute ONE between them, and not a single pullback or donchian leg is bound
      at any ratio (their stops sit at 72-476 bp). ict_scalp_5m on BTC is
      proportionally worse than the leg PB-20260822 names: 50.0% of its gradeable
      orders bound, median ratio 1.003.
      || [!] THE OBVIOUS REMEDY IS WITHDRAWN BY THIS UNIT'S OWN EVIDENCE. A minimum
      stop distance WIDENS risk, which LOWERS the demanded quantity until the cap stops
      binding -- i.e. it removes the size clamp from the cohort that, on the only
      measurement available, is not the losing one. Pooled, the bound cohort is
      +1,013.93 over 34 closes against -10,842.22 over 96; but that comparison does NOT
      survive its own control -- ict_scalp_sol_15m has ZERO bound rows and contributes
      47% of the unbound loss by itself. Per leg, on a MEASURED-only basis and over the
      five legs where both arms reach n>=3, three lean toward the bound arm, one is
      tied and one leans against, at 1-10 measured rows per arm. NOT ESTABLISHED IN
      EITHER DIRECTION, on a PAPER account over 27 days.
      || WHAT THE CLAMP IS DOING MEANWHILE: median realised risk_usd is 387 on the
      bound cohort against 867 on the rest, while the declared per-trade budget at the
      observed equity is ~2,000. So on that cohort the per-trade risk is set by
      available margin, not by policy.
      || WHERE IT COMES FROM, read at the field (src/units/strategies/ict_scalp.py:508-523):
      sl = sweep extreme -/+ 0.20 x ATR, and the ONLY floor on risk is `risk <= 0`. No
      min_stop_bps parameter exists on any ict_scalp leg. But the degenerate case is
      rare -- risk/ATR is median 3.30 and only 1.8% of rows fall below 0.25 x ATR -- so
      an ATR floor is the wrong instrument: 1.0 x ATR touches 5.1% of rows and only 14
      of the 65 bound ones, while a bp floor at the binding distance touches 23.7% by
      construction. AND any floor on risk also moves the TARGET, because
      tp = entry +/- tp_at_r x risk three lines below; refusing the signal does not.
      || [!] DO NOT WIDEN THE MARGIN CAP. PB-20260822 forbids it in terms, and on the
      worst order in the pull (id 5653, ict_scalp_avax_5m, a 1.22 bp stop) the demand is
      45.6x the ceiling -- it would need roughly 137x leverage to pass.
      || NOTHING WAS CHANGED. config/strategies.yaml, config/accounts.yaml and every
      src/ file were read only.
    options:
      - key: leave_and_record
        label: Leave it as-is, and record that available margin is the limiter
        implication: >-
          Per-trade risk on the bound cohort continues to be set by the account's
          available margin rather than by the 1.5% policy, and moves with the book.
          Recorded as a decision rather than left looking like an oversight. No code,
          config or roster change.
      - key: sweep_first
        label: Sweep a min_stop_bps floor offline, then decide (RECOMMENDED)
        implication: >-
          An M8 sweep over the ict_scalp family sets the floor from measurement rather
          than from inference. Chosen because the live evidence points the OPPOSITE way
          to the intuition and this repo does not set a bar from an inference. No live
          change until the sweep reports.
      - key: observable_first
        label: Make the pre-clamp quantity readable (Tier-2, one line)
        implication: >-
          Add account_context_snapshots to diag.py::_JOURNAL_TABLES. The decision-time
          equity is ALREADY recorded per (order_package_id, account_id); what is missing
          is a read surface. This satisfies PB-20260822's first resolution_criteria
          conjunct WITHOUT the risk.py stamp the row proposes, and is independent of the
          other two options.
      - key: something_else
        label: A different instruction
        implication: >-
          Say what, and it is recorded against PB-20260822's criterion.
    blocking: false
    notes: >-
      NOT BLOCKING. Nothing waits on this answer and no parameter, roster or execution
      value was changed by the unit that raised it. [!] A STOP FLOOR IS DELIBERATELY NOT
      IN THE OPTION LIST: it is the intuitive remedy, this unit drafted it, and this
      unit's own within-leg control withdrew it. Offering it as a ready choice would put
      an unevidenced Tier-3 change in front of the operator wearing a measurement's
      clothes.
  - id: DEC-20260917-NETTING-ATTRIBUTION-EVIDENCE-IS-DROPPABLE
    question: >-
      The two keys that record a netting quantity rewrite are stored unprotected in
      `trades.notes`, so the 500-char cap sheds them -- measured, five live rows have
      already lost theirs. The module they live in states the rule that would have
      prevented it, and this is the FOURTH instance of the class its own comments
      record. Do you want the one-line protection applied, a durable marker outside
      `notes` instead, or the loss accepted and recorded?
    urgency: routine
    asked_on: '2026-09-17'
    asked_by: session_01Wv1BdfEUnmCBZrhvUjeBzb
    context: >-
      MEASURED 2026-09-17 (MI-278 U49) by RUNNING the reference implementation
      scripts/research/netting_position_size_basis.py with --soak, on
      /api/diag/journal?table=trades&limit=1000 (ids 4873-5872,
      sha256:098092a13d8efff2...) and /api/diag/log_file?name=netting_attribution_soak
      (1000-line tail, 2026-08-29T08:11:10Z -> 2026-09-16T07:12:15Z, of a 3,882,168-byte
      file). No new instrument was written -- one already exists and a second would be
      RC-BUILT-A-MECHANISM-THAT-ALREADY-EXISTED. Memo
      docs/research/m20-u49-the-netting-scoping-rule-applied-and-u47-audited-against-it-2026-09-17.md.
      || WHAT IS BROKEN. `_netting_apply_close`'s partial branch rewrites
      `position_size` and leaves the row OPEN, so it closes later under an ordinary exit
      reason. The only trace is `netting_attribution_basis` + `netting_attributed_qty`
      in `trades.notes`, written through `dump_capped(notes, 500)`, and NEITHER is in
      `json_notes._DEFAULT_PROTECTED`. On 783 graded bybit rows: 44 carry a stamp, the
      `exit_reason` filter sees 42, and the soak shows 5 MORE whose stamp was shed
      entirely -- 7 invisible in total against the 2 a journal-only audit can see, a
      3.5x under-count. A further 104 rows grade `evidence_may_be_shed`, which is *we
      could not look*, not a clean negative.
      || THE TWO KEYS FAIL IN TWO DIFFERENT WAYS, which matters for the remedy.
      `netting_attribution_basis` is a SHORT STRING ('leg_gone' / 'fifo'), so
      `_shrink_dict` trims it to a prefix matching neither vocabulary entry -- exactly
      BL-20260826-EXIT-REASON-SOURCE-TRUNCATED-BY-THE-NOTES-CAP. `netting_attributed_qty`
      is a FLOAT, which `_shrink_dict` can never trim (it only trims strings), so it can
      only be DROPPED WHOLE by the shed loop. One line covers both.
      || [!] THE ARGUMENT IS THE MODULE'S OWN, NOT THIS SESSION'S PREFERENCE.
      `json_notes.py` states 'EVERY PROVENANCE MARKER BELONGS HERE ... a consumer
      compares it for equality against a fixed vocabulary, so a trimmed value is not a
      shorter answer -- it is an unreadable third state that matches nothing.'
      `netting_attribution_basis` meets that criterion exactly: its vocabulary is
      leg_gone / fifo (order_monitor.py:9366, documented again at diag.py:544) and
      consumers compare against it. The tuple's own comments already record THREE prior
      instances (exit_reason_source; closed_by_operator + pre_mark_exit_reason).
      || [!] WHAT NO OPTION HERE BUYS: none of them recovers the five rows already shed,
      and none of them makes any close false or true -- that needs the venue-side read
      OI-20260908 specifies. This is about whether the NEXT ones are readable.
    options:
      - key: protect_the_keys
        label: Add both keys to json_notes._DEFAULT_PROTECTED (Tier-2, one line) (RECOMMENDED)
        implication: >-
          The two keys stop being shed, so a future netting rewrite stays attributable
          from the journal alone. Recommended because it is the remedy the module's own
          comment already prescribes for this exact class, and three prior instances
          were fixed this way. It does NOT recover the five rows already shed and must
          not be reported as if it did.
      - key: durable_marker_outside_notes
        label: Give the partial branch a durable marker outside `notes` instead (Tier-2, larger)
        implication: >-
          A column or its own log, so the evidence is not competing with a 500-char cap
          at all. Strictly better than protection and strictly more work; it also makes
          the marker queryable rather than requiring a substring read of `notes`. Choose
          this if the cap is expected to keep claiming keys.
      - key: accept_and_record
        label: Accept the loss and record it as a decision
        implication: >-
          Netting rewrites stay partly unattributable from the journal, and any analysis
          scoping this contamination must read the soak as well -- which is itself a
          tail, so the population stays a lower bound. Legitimate, and recorded as a
          decision rather than left looking like an oversight.
      - key: something_else
        label: A different instruction
        implication: >-
          Say what, and it is recorded against this row's clause (2).
    blocking: false
    notes: >-
      NOT BLOCKING. Nothing waits on this answer, and the unit that raised it applied no
      runtime change -- clause (1) of the row was cleared by USE (the corrected scoping
      rule applied to MI-278 U47's netting finding, which it CONFIRMED rather than
      overturned: 4 of 33 on bybit_2, soak adds zero). [!] A THIRD OPTION THAT LOOKS
      ATTRACTIVE IS DELIBERATELY ABSENT -- 'stop the partial branch rewriting
      position_size at all' is a legitimate Tier-2 order-path decision and the row says
      so, but it would leave the netted sibling holding its full size, which is the 451x
      journal-vs-exchange divergence BL-20260801 exists to stop. It is not offered as a
      ready choice without that consequence being measured.

