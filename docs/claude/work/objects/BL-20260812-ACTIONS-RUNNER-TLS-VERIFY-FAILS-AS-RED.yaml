next_action_at_migration: |-
  No code fix proposed yet -- this is a runner/infra condition, and a retry wrapper around checkout would MASK the signal rather than fix it. Minimum viable: teach the reader to tell them apart, which is cheap and already true -- a TLS-infra failure dies in the first ~30s at checkout or the first git command and never prints the guard summary, whereas a real guards failure gets past checkout and prints `PASS n / FAIL n` plus a named failing guard. If it recurs beyond this window, consider `actions/checkout` with a retry, but only with the failure still SURFACED (e.g. an annotation) so a masked flake cannot read as a clean pass.
