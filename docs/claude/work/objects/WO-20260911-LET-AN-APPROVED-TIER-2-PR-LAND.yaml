    THE DISPATCH BRIEF STATED THIS OBJECT WAS ALREADY ON FILE AND IT WAS NOT. Measured 2026-09-11
    against origin/main at 2901ccf44 -- `git ls-tree origin/main docs/claude/work/objects/` returns no
    file matching LET-AN-APPROVED or TIER-2-PR-LAND, and `docs/claude/work/spawn-priority-exception.yaml`
    on main contains zero occurrences of the id. The lane authored the object itself (this file) so the
    spawn gate could pass; it deliberately did NOT add itself to the spawn-priority exception, because
    a lane writing its own exception is the same self-approval failure this object exists to end.
- >-
    THE DISPATCHED REGISTRY KEY DID NOT EXIST. `session_registry.py confirm --registry-key
    pending-20260911T174755Z` returned "no pending row"; the key appears zero times in SESSIONS.json on
    origin/main (218 rows). The lane registered itself instead, so it is not invisible to a cold
    manager -- which is MI-15's exact failure class, recurring.
not_established:
- >-
    Whether the existing recorded approvals are sufficient to land on. PR #11738's approval carries a
    scope in PROSE ("R2 ONLY -- the per-pass IB circuit breaker") and no machine-comparable path list,
    so no mechanical check can compare it to a diff. Graded by this lane as the gap being in the
    RECORDING, not in the gate.
- >-
    Whether an approval record can be made operator-ORIGINATED rather than merely branch-SEPARATED.
    Measured 2026-09-11: every squash-merge on main is authored `Ben` at the operator's
    users.noreply.github.com address and committed by `GitHub`, so commit identity CANNOT discriminate
    a session-written record from an operator-written one. That is why the separation is branch-based.
