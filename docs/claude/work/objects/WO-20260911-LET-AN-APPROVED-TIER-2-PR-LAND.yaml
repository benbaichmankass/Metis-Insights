corrections_this_object_makes:
- >-
    THE LANE'S OWN EARLIER FINDING ABOUT THIS OBJECT IS SUPERSEDED AND MUST NOT BE
    RE-QUOTED. It reported that this object did not exist and that
    spawn-priority-exception.yaml named it zero times. That was TRUE WHEN MEASURED
    (origin/main @ 2901ccf44, ~2026-09-11T17:50Z, where the spawn gate duly refused)
    and became FALSE about twenty minutes later: the manager landed both in
    e5eeb42d2 at 18:01:45Z. Recorded as a dated observation that expired, not as a
    standing finding — carrying it forward would have had a successor hunting for a
    gap that is closed.
- >-
    WHAT DOES SURVIVE from that pass is the SESSION REGISTRY half, which is a
    different fact: the dispatched key `pending-20260911T174755Z` appears zero times
    in SESSIONS.json and `confirm` refused it. The lane registered itself instead.
    MI-15's failure class, recurring.
- >-
    R4's REASON WAS NEVER WRONG AND IS NOT WEAKENED. A change and its own approval
    must not be the same act. What R4 got wrong was the PROXY — it used 'a human
    clicks Merge' to stand for that separation. R15 replaces the proxy with the
    property itself. A successor reading this as 'R4 was relaxed' would be reading
    it backwards.

not_established:
- >-
    Whether the approvals we already have are sufficient to land on. PR #11738's
    approval carries a scope in PROSE ('R2 ONLY -- the per-pass IB circuit breaker')
    and no machine-comparable path list, and worse, the scope is NOT PATH-EXPRESSIBLE
    at all: the operator excluded R1, and R1 and R2 both live in src/main.py. Graded
    by this lane as the gap being in the RECORDING, not in the gate. The check was
    NOT loosened to fit.
- >-
    Whether an approval record can be made operator-ORIGINATED rather than merely
    branch-SEPARATED. Measured 2026-09-11 over the 15 most recent commits on
    origin/main: every squash carries the same author and committer identity, so
    commit metadata CANNOT discriminate a session-written record from an
    operator-written one. That is why the separation is branch-based and why R12 is
    what stands behind the claim.
- >-
    Whether the decision round-trip can write an approval record directly, which
    would make the path zero-click. It lands through commit-to-main, which self-lands
    as Tier-1 automation, and APPROVAL_DIR being in LANDING_MACHINERY blocks that
    under R12 -- by construction and correctly, since a self-landing route that could
    mint a credential defeats the whole design. Its own decision, not attempted here.
