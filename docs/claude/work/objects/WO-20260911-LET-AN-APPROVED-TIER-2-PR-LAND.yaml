review_trigger: >-
  When the first Tier-2 approval record is written for a real PR. Until one
  exists the mechanism is DEPLOYED AND UNEXERCISED, which reads identically to a
  mechanism that does not work. ⚠️ Do NOT re-open the DESIGN question — it is
  built and written up; what is owed is the two OBSERVATIONS below.
done_condition: >-
  An approved Tier-2 PR is OBSERVED landing on main with no human merge click, where the approval was RECORDED BEFORE and INDEPENDENTLY OF the landing, and a Tier-2 PR carrying no such recorded approval is OBSERVED still being refused (the negative control). A green test suite clears neither half.

why: >-
  OPERATOR-DIRECTIVE 2026-09-11, verbatim: 'the operator does not click things'. check_pr_landing R4 bars a Tier-2 diff from landing itself WHATEVER its approval state, so #11738 has sat green and approved since 2026-09-10T07:52Z waiting on a click that the operator has now said will not come. This is the autonomy mandate applied to the landing gate.

source: >-
  operator (conversational), 2026-09-11

blocked_on: []
blocked_on_basis: >-
  ASSESSED 2026-09-11 by the building lane, from the guard source and the live
  records rather than from the dispatch brief. Nothing blocks the BUILD — the
  guard is a self-contained CI script, and its own PR holding under R12 is the
  invariant being defended, not an obstacle. What the OBSERVED half waits on is
  the writing of the first real approval record, which is an operator/manager
