      OI-20260901-SCHEDULED-PROBES-AND-DUE-LIST-HAVE-NEVER-FIRED-ON-CRON records
      two workflows that are merged, enabled, and have never once fired.
  - kind: capability
    ref: opening a PR on benbaichmankass/ict-trader-dashboard from a read-only-MCP session
    since: 2026-09-01
    note: >-
      The SPA branch claude/phase-b-work-view is pushed but has NO PR. This
      session's MCP returns 403 "Resource not accessible by integration" on PR
      create and on issue comments (measured twice, with get_me and issue_read
      succeeding as positive controls). The bot repo covers that gap with
      pr-opener.yml and board-post.yml; the dashboard repo has NEITHER, and its
