observed: >-
  MEASURED 2026-09-01 by this session, against the committed store at the branch
  point (populations stated, counts not adjectives).

  STORE SHAPE — `find docs/claude/work -type f`: 1 intent, 8 objects, 0 steps.
  Lifecycle over all 8 objects at the branch point: dormant 4 / ready 1 /
  in_flight 2 / waiting 1 / done 0 / accepted 0 / unknown 0. The seven buckets
  sum to 8, which is asserted by test rather than trusted.

  WIP — 2 of a declared ceiling of 8 in flight. The ceiling is NOT enforced (that
  is Phase C, with the migration), and both the route and the digest render it as
  `declared_not_enforced` so a count under an unchecked ceiling can never read as
  "within limits".

  DANGLING EDGES — 5 `kind: object` blocked_on edges exist across the 8 objects;
  2 of the 5 resolve to nothing in the store. Both belong to WO-20260901-PHASE-H
  and name BL-* backlog rows, which do not migrate until Phase C. Reported as
  `refResolvedInStore: false` rather than hidden. This is expected today, NOT a
  defect — but it is the shape a computed constraint would trip over once E1
  reads this graph, so it is recorded rather than left to be rediscovered.

  DIFF — 12 files, 1498 insertions, 1 deletion against the merge base. The single
  deletion is this object's own `lifecycle: ready` line. CLAUDE.md, main.py and
  api-tier-policy.md are each +2/-0, as declared on the board before the first
  write. ⚠️ A tip-to-tip `git diff origin/main HEAD` shows ~100 additional
  comms/strategy_reviews/ files as DELETIONS; that is an artifact of main having
  moved past the branch point, not a change this branch makes. Diff against the
  MERGE BASE.

  TWO DEFECTS FOUND IN THIS SESSION'S OWN WORK, both fixed. (a) The object-id
  guard admitted `..`, and the route was safe only by the accident that
  `".." + ".yaml"` concatenates to an ordinary in-directory filename — found by
  its own test. (b) The "never a 5xx" contract was NOMINAL: YAML yields native
  date objects and `extra` preserves arbitrary keys, so a non-encodable value
  would have raised at response-render time, AFTER the module's own try/except —
  found by capturing a fixture, not by reading the code.

  NOT OBSERVED, and the reason this object is `waiting` rather than `done`:
  no page has been rendered, no route has been served from the live VM, and the
  digest has never fired.

