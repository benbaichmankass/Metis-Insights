decision_requests:
  - id: DEC-20260903-SUNSET-DISPOSITION-POLICY
    question: >-
      Ten strategy legs are evidenced retirement candidates and have waited two days.
      How do you want them handled — as a batch policy, rather than ten separate asks?
    urgency: routine
    asked_on: '2026-09-03'
    context: >-
      THE ASK IS DELIBERATELY A POLICY, NOT TEN QUESTIONS. You said "we need to keep my
      approval to where its actually needed ... so that I don't become the operational
      bottleneck here", and ten inline prompts for one sunset pass is the bottleneck
      shape. ⚠️ WHAT IS AND IS NOT ESTABLISHED: the candidates come from the E3 sunset
      pass over 52 legs with a lifetime read and 115 carried findings, and the machinery
      probe grades `measured`. What has NOT been done is a per-leg re-read of each one's
      current performance — so "retire all ten" would be acting on the pass, not on ten
      individual verdicts. That is why option `retire_all` is stated with that cost
      attached rather than offered as the clean choice. ⚠️ NOTE ONE CANDIDATE IS
      ALREADY ENTANGLED: trend_donchian_sol is the leg OI-20260831-PER-ACCOUNT-
      ARBITRATION names as its tiebreak test subject — it won 0 of 60 SOLUSDT buy-side
      ticks and has written ZERO journal rows on bybit_1 since 2026-07-07. Retiring it
      would remove the evidence that row is waiting on, so it may want a different
      answer from the other nine.
    options:
      - key: retire_all_ten
        label: Retire all ten — accept the sunset pass as sufficient evidence
        implication: >-
          Fastest, and Phase G's forcing function finally fires. The cost, stated: this
          acts on the batch pass rather than on ten individual verdicts, and it removes
          trend_donchian_sol, which is the live tiebreak evidence another open row is
          waiting on.
      - key: retire_nine_hold_sol
        label: Retire the nine, HOLD trend_donchian_sol for the arbitration test
        implication: >-
          Same forcing effect on nine legs while preserving the one leg an open
          monitoring row needs as evidence. Costs nothing except that the sol leg keeps
          not trading, which is already true.
      - key: per_leg_packet_first
        label: None yet — build a per-leg evidence packet first, then ask again
        implication: >-
          The most rigorous, and it is the option that keeps Phase G stalled. It also
          costs a session's work to produce ten packets over legs the pass already
          graded. Choose it if the batch evidence genuinely is not enough for you.
      - key: retire_none_and_close
        label: Retire none — record the sunset pass as reviewed and rejected
        implication: >-
          A legitimate ANSWER rather than a failure to decide, and it CLOSES the row
          instead of leaving it looking like work in flight. Records that the candidates
          were seen and kept.
    allows_free_text: true

done_condition: >-
  The operator answers DEC-20260903-SUNSET-DISPOSITION-POLICY and the answer is
  COMMITTED into this object on main. ⚠️ Whatever the answer, it must then be
  reflected in docs/claude/SUNSET-DISPOSITIONS.json, because that file is what a
  future sunset pass reads — an answer that lands only here would leave the next
  pass re-proposing the same ten legs.

review_trigger: >-
  If unanswered after the next cycle, re-ask ONCE and then record that the
  channel was used and the question was not answered — which is a different and
  more useful finding than silence.

answer:
  answered_by: operator
  answered_on: '2026-09-03'
  answered_via: >-
    Asked directly in the Claude Code session after the operator reported the
    Telegram prompt never arrived. Recorded here because the repo is the source
    of truth; the delivery defect is filed separately and does NOT invalidate
    the answer.
  verdict: none_of_the_above
  verbatim: >-
    "I don't want to retire anything yet - we need a flow for downgrading to
    shadow and tuning, not just turning things off out right"
  reading: >-
    ⚠️ THIS REJECTS ALL FOUR OPTIONS, AND THE QUESTION WAS MIS-FRAMED. Every
    option I offered was a point on a retire / do-not-retire axis
    (retire_all_ten, retire_nine_hold_sol, per_leg_packet_first,
    retire_none_and_close). The operator is not choosing a point on that axis —
    they are rejecting the AXIS. What they want is a THIRD PATH that does not
    exist yet: demote a leg to `shadow` and TUNE it, rather than kill it.
  what_this_means_concretely: >-
    NOTHING IS RETIRED. No leg moves. `docs/claude/SUNSET-DISPOSITIONS.json` is
    NOT to be filled in with retirements on this pass. The ten candidates stay
    live and stay candidates. ⚠️ AND THIS IS NOT A DEFERRAL DRESSED AS A
    DECISION: it is a real answer that redirects the work, and the row must not
    be left reading as though the operator failed to respond.
  the_capability_gap_this_exposes: >-
    Phase G's sunset machinery has exactly ONE terminal move — retire. The
    execution gates already support the intermediate state the operator is
    asking for (`config/strategies.yaml::execution: live | shadow`, a declared,
    default-permissive switch that runs the strategy and logs order packages
    everywhere while never sending a live order), so a leg CAN be demoted to
    shadow today. What does not exist is the FLOW: no criteria for when a sunset
    candidate is demoted rather than retired, no tuning loop attached to the
    demotion, and no exit condition that returns a demoted leg to `live` or
    finally retires it. A demote with no exit condition is how a leg becomes
    permanently half-off and unowned —
    `BL-20260825-KEPT-OPEN-ROWS-WITH-NO-EXIT-CONDITION-CAN-NEVER-BE-RETIRED` is
    that failure already recorded for backlog rows.
  followup: >-
    Filed as MI-107. The sunset pass keeps producing candidates in the meantime;
    what changes is what happens to one.
