why: >-
  Phase G's sunset pass (E3, 2026-09-01) produced TEN evidenced retirement
  candidates over 52 strategy legs, and they are rendered in the CLAUDE.md
  session brief every day: gdx_pullback_1d, gld_pullback_1d, iaum_pullback_1d,
  mes_trend_long_1d, scha_trend_long_1d, splg_trend_long_1d, spy_trend_long_1d,
  tqqq_trend_long_1d, trend_donchian_sol, turtle_soup. Retiring a leg is Tier-3,
  so a session may PROPOSE and never ENACT. Nothing has moved for two days.
  ⚠️ PHASE G IS THE FORCING FUNCTION OF THE OPERATING MODEL — its whole point is
  that something actually gets RETIRED — and it cannot clear while every
  candidate waits on a call nobody has been asked to make in a channel they can
  answer. The manager has been reporting this in chat instead of putting it in
  the decision inbox, which is MI-54's exact failure repeated.

