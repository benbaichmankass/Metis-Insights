decision_requests:
  - id: DEC-20260903-SUNSET-DISPOSITION-POLICY
    question: >-
      Ten strategy legs are evidenced retirement candidates and have waited two days.
      How do you want them handled — as a batch policy, rather than ten separate asks?
    urgency: routine
    asked_on: '2026-09-03'
    context: >-
      THE ASK IS DELIBERATELY A POLICY, NOT TEN QUESTIONS. You said "we need to keep my
      approval to where its actually needed ... so that I don't become the operational
      bottleneck here", and ten inline prompts for one sunset pass is the bottleneck
      shape. ⚠️ WHAT IS AND IS NOT ESTABLISHED: the candidates come from the E3 sunset
      pass over 52 legs with a lifetime read and 115 carried findings, and the machinery
      probe grades `measured`. What has NOT been done is a per-leg re-read of each one's
      current performance — so "retire all ten" would be acting on the pass, not on ten
      individual verdicts. That is why option `retire_all` is stated with that cost
      attached rather than offered as the clean choice. ⚠️ NOTE ONE CANDIDATE IS
      ALREADY ENTANGLED: trend_donchian_sol is the leg OI-20260831-PER-ACCOUNT-
      ARBITRATION names as its tiebreak test subject — it won 0 of 60 SOLUSDT buy-side
      ticks and has written ZERO journal rows on bybit_1 since 2026-07-07. Retiring it
      would remove the evidence that row is waiting on, so it may want a different
      answer from the other nine.
    options:
      - key: retire_all_ten
        label: Retire all ten — accept the sunset pass as sufficient evidence
        implication: >-
          Fastest, and Phase G's forcing function finally fires. The cost, stated: this
          acts on the batch pass rather than on ten individual verdicts, and it removes
          trend_donchian_sol, which is the live tiebreak evidence another open row is
          waiting on.
      - key: retire_nine_hold_sol
        label: Retire the nine, HOLD trend_donchian_sol for the arbitration test
        implication: >-
          Same forcing effect on nine legs while preserving the one leg an open
          monitoring row needs as evidence. Costs nothing except that the sol leg keeps
          not trading, which is already true.
      - key: per_leg_packet_first
        label: None yet — build a per-leg evidence packet first, then ask again
        implication: >-
          The most rigorous, and it is the option that keeps Phase G stalled. It also
          costs a session's work to produce ten packets over legs the pass already
          graded. Choose it if the batch evidence genuinely is not enough for you.
      - key: retire_none_and_close
        label: Retire none — record the sunset pass as reviewed and rejected
        implication: >-
          A legitimate ANSWER rather than a failure to decide, and it CLOSES the row
          instead of leaving it looking like work in flight. Records that the candidates
          were seen and kept.
    allows_free_text: true
    answer:
      chosen: none_of_the_above
      answered_at: '2026-09-03'
      answered_by: operator
      committed_by: session_018zzzSLT8UdJ1e1RbFeyvsz (MI-107, 2026-09-04)
      free_text: >-
        "I don't want to retire anything yet - we need a flow for downgrading to shadow
        and tuning, not just turning things off out right." ⚠️ THIS REJECTED ALL FOUR
        OPTIONS AND THE QUESTION WAS MIS-FRAMED — every option was a point on a
        retire / do-not-retire axis, and the operator rejected the AXIS. NOTHING IS
        RETIRED. The redirect is filed as MI-107 and is carried by
        DEC-20260904-DEMOTE-AND-TUNE-FLOW on this same object.
        ⚠️ THIS BLOCK IS A TRANSCRIPTION of the object-level `answer:` block below,
        which stays the fuller record. It is nested INSIDE the request because
        `work_decisions.grade_answer_state()` reads `request["answer"]` AND NOTHING
        ELSE — so without it this request graded `not_submitted` and the decision
        inbox would have re-prompted the operator with the very four options they
        rejected on 2026-09-03. Verified with the real normaliser, not by eye.

  - id: DEC-20260904-DEMOTE-AND-TUNE-FLOW
    question: >-
      The demote-to-shadow-and-tune flow you asked for is WRITTEN
      (docs/design/strategy-demote-and-tune-DESIGN.md). Do you agree it, yes or no?
      And the one thing I cannot decide for you is inside it: the ten candidates
      that prompted the flow do not qualify for it, because they do not trade at
      all. Who owns finding out why?
    urgency: routine
    asked_on: '2026-09-04'
    asked_by: session_018zzzSLT8UdJ1e1RbFeyvsz
    context: >-
      ⚠️ THIS IS NOT ANOTHER MENU ON THE RETIRE AXIS — that framing is what you
      rejected on 2026-09-03 and it was the right rejection. The flow is built the
      way you asked: a leg that trades and loses gets DEMOTED to `execution: shadow`
      and TUNED, riding the gate that already exists, with no third execution gate
      added. ⚠️ WHAT THE DATA THEN FORCED, and it is the real content of this ask:
      MEASURED over comms/sunset/2026-09-01/INDEX.json joined to config/strategies.yaml
      on 2026-09-04, ALL TEN candidates have `lifetime_closed_trades: 0` — not one has
      closed a single trade in its life — and NOT ONE is routed to real money; every
      routing is paper. So there is no money being lost to protect and no measured
      behaviour to tune. Worse, `execution: shadow` folds into `effective_dry` on EVERY
      account including paper, so demoting them would STOP THEIR PAPER FILLS and
      guarantee the exit condition is never met. Demote-and-tune is the right
      instrument for a leg that trades and loses; these ten are not underperforming,
      they are NOT RUNNING. ⚠️ AND THREE ALREADY HAVE A NAMED CAUSE sitting dormant in
      the work store: splg_trend_long_1d has no usable price history
      (BL-20260825-SPLG-HAS-NO-USABLE-YFINANCE-HISTORY); trend_donchian_sol emitted 144
      actionable signals and wrote ZERO journal rows
      (BL-20260830-TREND-DONCHIAN-SOL-SIGNALS-144-TIMES-AND-JOURNALS-NOTHING-ON-BYBIT-1)
      — the strategy works, something between signal and order does not; turtle_soup is
      `enabled: true` and listed by ZERO accounts. Their fault is upstream of the
      strategy, so the flow grew a third disposition — REPAIR — where the DIAGNOSIS is
      the work, not the parameters. ⚠️ NOTHING IS RETIRED AND NOTHING IS DEMOTED BY THIS
      ASK; every move stays Tier-3. ⚠️ AND THE EXHIBIT FOR WHY THE EXIT CONDITION CAME
      FIRST: turtle_soup has ALREADY been `execution: shadow` since 2026-04-29 — four
      months, zero closes, routed to nothing — and surfaced only because a different
      mechanism eventually flagged it. The shadow-backlog is not a risk, it already
      exists; 8 of 52 enabled legs are shadow today.
    options:
      - key: agree_flow_and_fund_repair
        label: Agree the flow, and schedule the REPAIR diagnosis for the ten
        implication: >-
          The flow is settled and the ten get a budget-bounded diagnosis lane — a
          session actually asked to find out WHY each produces nothing. Costs session
          time on ten legs that make no money today. Note three of the ten already have
          the cause half-named, so this is cheaper than it looks, and
          trend_donchian_sol's answer is evidence another open row
          (OI-20260831-PER-ACCOUNT-ARBITRATION) is already waiting on.
      - key: agree_flow_never_fired_is_terminal
        label: Agree the flow, and make "never fired in N passes" a retirement basis on its own
        implication: >-
          The flow is settled and no diagnosis is funded: a leg that has never produced
          a close becomes retire-proposed on the carry count alone. Cheapest, and it is
          a REAL answer rather than a deferral. The stated cost: splg's cause is a data
          feed and trend_donchian_sol's is routing, so this retires two legs whose
          strategies were never shown to be at fault — and removes the sol leg the
          arbitration row needs as evidence.
    allows_free_text: true

done_condition: >-
