outcome: >-
  OUTCOME 1 OF THE THREE — THE HARNESS DETECTS IT. MEASURED on the trainer via
  trainer-diag #11134 (workflow run 34032720336), 2026-09-06T12:19Z, leg
  trend_donchian BTCUSDT 1h, lifetime n=366, IS 316 / OOS 49 at a resolve_split
  boundary of 2025-11-23. A provably-dominant planted cell
  (net_r' = max(net_r, 0)) graded by the sweep's OWN detector, imported
  unmodified, returned PASS: beats() in both windows (IS d_net_r +236.0618,
  OOS +39.7913, max_drawdown_r -> 0.0 in both) and walk-forward 6/6 with
  inert_wins 0. Two null arms bound it — the wrapper reproduces the real
  harness to -0.0005R, and an inert lever moves the book by EXACTLY 0.0 in both
  windows, so the two arms differ only by the lever.
  ⚠️ THIS IS A FLOOR ON THE INSTRUMENT, NEVER A CEILING. The planted effect is
  +236R against real levers that move 1-8R, so it establishes plumbing and not
  SENSITIVITY. Sensitivity is covered separately by the sweep's own record: over
  all 1,376 kind=cell rows of docs/research/m20-sweep-corpus.jsonl its smallest
  passing cell is +0.0010R OOS and 10 of 91 passes are under 0.5R.
  ⚠️ AND THE OBJECT'S PREMISE WAS WRONG IN A WAY THAT MATTERS MORE THAN THE
  CONTROL. The 320 honest_negative cells were never all unfalsifiable: the sweep
  has emitted 91 passing verdicts across 50 of 225 distinct (leg,lever) pairs,
  and 35 of those 50 read honest_negative in the matrix. That is not a guard
  failure — check_matrix_corpus_agreement passes because each is acknowledged in
  the cell's ref prose — but every AGGREGATE reads the status WORD, not the
  prose, so honest_negative collapses 'measured and lost' with 'measured, won on
  at least one cell across a walk-forward, disposition withheld pending Tier-3'.
  A distinct status is PROPOSED, not applied; changing a live leg's disposition
  is the operator's.
