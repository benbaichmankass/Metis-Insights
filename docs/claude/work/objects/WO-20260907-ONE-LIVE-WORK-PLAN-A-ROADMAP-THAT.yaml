done_condition: >-
  THREE things, and the third is the one the operator actually asked for. (1) EXACTLY ONE work-plan document is live. Every other one carries an explicit terminal status in its own header - superseded, or closed-unfinished with what was left - and a CI guard refuses a second live plan, so this cannot silently regress. The census is stated: how many plan documents exist, which one is live, and what each closed one was closed as. (2) ROADMAP.md reflects reality: every milestone row's status is checked against what actually shipped, and the ones that are wrong are corrected. Its 'Next' section points at the LIVE plan, not a stale one. Where a row cannot be verified, it says so rather than being left as an unchecked claim. (3) A TASK-LEVEL priority order that CROSSES milestones. Not a ranking of milestones - a ranking of the specific tasks that serve the current cycle priority, including tasks that live inside milestones we are deliberately NOT pushing. The operator's exact framing: a milestone we do not generally want to push may contain a subtask that unlocks something we do. Each ranked task names its parent milestone, what it unblocks, and why it sits where it does.

