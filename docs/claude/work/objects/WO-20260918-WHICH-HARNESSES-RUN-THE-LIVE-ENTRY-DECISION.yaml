decision_requests:
  - id: DEC-20260918-WHERE-TO-SPEND-THE-NEXT-HARNESS-ADJUDICATION
    asked_by: session_01Ex5Dx1TMYy46ncsp8eptpx
    question: >-
      37 of the fleet's 45 execution:live legs are gated by pre-live evidence produced by
      a reimplementation nobody has adjudicated -- 20 behind a port CLAIM
      (trend_donchian) and 17 behind no claim at all (htf_pullback_trend_2h 16,
      squeeze_breakout_4h 1). MI-319 showed adjudication changes the answer. None of
      these is adjudicable by the probe that exists: trend refuses at gate ratio 0.4375,
      and pullback and squeeze were never claimed so there is no assertion to grade
      structurally. Each option below is a unit of work, not an edit; all are Tier-1
      (docs/** + scripts/research/**). Which?
    options:
      - key: behavioural_probe_for_trend
        label: >-
          Build the BEHAVIOURAL half for trend_donchian -- run harness and live unit over
          the same candles and compare accepts bar by bar, as MI-319's P2 did for fvg.
          Highest exposure (20 live legs) and it sidesteps the idiom problem entirely,
          because behaviour does not care how a gate is written. Most expensive, and
          MI-319 records that a population with zero accepts is `no_accepts_in_population`
          and NOT agreement -- so it may buy a refusal.
      - key: pullback_first_because_nothing_is_claimed
        label: >-
          Take htf_pullback_trend_2h (16 live legs) first, on the ground that an UNCLAIMED
          correspondence is worse than an unadjudicated claim: there is not even a
          sentence to hold the port to. Also repairs the stale "SCAFFOLD, not wired"
          docstring finding, which is a live navigational hazard today.
      - key: close_the_ict_scalp_seam
        label: >-
          Leave the reimplementations and measure the SEAM on the one harness that runs
          the live decision: what per_bar_cfg backtest_ict_scalp builds and what window it
          passes, against what the live builder does. 8 live legs, entry exact by
          construction, and the two classes at issue (MI-312's base_args, MI-319's
          declared candle minimum) are already established as real -- so this is the
          cheapest path to a KNOWN class rather than a speculative one.
      - key: decline
        label: >-
          Spend nothing more here. The census is the deliverable and the 37-leg figure is
          now recorded; adjudicating further is not obviously the best use of a lane while
          the trading-truth cycle has open measurement work. Legitimate, and must be
          RECORDED as a decision rather than left looking like an adjudication about to
          start -- otherwise this row reads as work about to begin, which is the failure
          mode it exists to prevent.
