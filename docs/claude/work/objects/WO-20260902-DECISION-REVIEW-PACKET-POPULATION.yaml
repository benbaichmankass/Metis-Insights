decision_requests:
  - id: DEC-20260902-REVIEW-PACKET-POPULATION
    question: >-
      Every M7 strategy-review packet blends real-money and paper PnL, against
      CLAUDE.md's P4 contract that "real and paper performance are never blended".
      Which population should the gate decide on?
    urgency: routine
    asked_on: '2026-09-02'
    context: >-
      `scripts/ml/strategy_review_packet.py::pull_decisions` filters ONLY `is_backtest`
      — it never consults `account_class` or `is_demo` — while /api/bot/stats,
      /api/bot/performance, /api/bot/trades/closed and /api/bot/strategy/attribution all
      honour the split. ⚠️ THIS CHANGES WHAT THE HEADLINE FINDING MEANS, not a report's
      tidiness: the -35,446 of "losing pnl no window could act on", which was the
      measured motivation for widening the evidence floor's window, is essentially all
      PAPER. Population: 142 closed non-backtest trades inside the 2026-09-01 packet
      window (2026-08-25T12:03Z..2026-09-01T12:03Z), joined trades -> order_packages.
      Split: PAPER 136 trades / -36,219.07 · REAL MONEY 6 trades / -3.11. And 59.4% of
      the total is ONE leg with ONE closed trade (ict_scalp_mgc_15m, -21,070.00, on
      ib_paper). ⚠️ THE OBVIOUS FIX IS THE TRAP: on real money the fleet closed 6 trades
      in 7 days, so a real-money-ONLY gate is MORE ungradeable than the blended one, not
      less. This is why it is a decision and not a cleanup.
    options:
      - key: separate_populations
        label: Report real and paper side by side; take the GRADE on real money
        implication: >-
          Honours P4 and keeps the paper evidence visible instead of discarding it. Cost,
          stated plainly: the gate then grades on 6 closed trades in 7 days and will
          refuse far more often than it does now — which is honest, and is a REFUSAL the
          operator will see rather than a confident blended number.
      - key: declare_blending_acceptable
        label: Declare blending acceptable FOR THIS GATE, and write down why
        implication: >-
          A legitimate answer — the gate asks "is this leg's logic working", which paper
          fills can speak to — but it must be RECORDED as a declared exception to P4,
          naming this gate only, or the next reader reads it as the defect it currently
          is.
    allows_free_text: true

