findings: >-
  THE FAN-OUT HAS NEVER DISPATCHED, ON ANY ACCOUNT, SINCE IT WAS BUILT — so the
  Tier-2 allowlist widening the whole sequence was queued behind is INERT.
  `_attach_fanout_plan` (intent_multiplexer.py:1019-1026) writes `apply_rounds`
  as a two-key projection {strategy, accounts}, dropping the side/entry/sl/tp
  that `plan["rounds"]` carries; `_fanout_apply_rounds` (pipeline.py:58-89)
  validates exactly those keys and returns [] fail-closed; pipeline.py:1077 then
  takes the `else:` branch and dispatches the GLOBAL winner's package.
  VERIFIED FOUR WAYS, none by reading: (1) ran the REAL source text of both
  functions, ast-extracted not retyped, against the real planner — apply_rounds
  written, `applied: true`, reader returns []; (2) LIVE production data,
  POPULATION 400 soak rows (tail of a 555,838-byte file,
  2026-09-02T15:42:52Z -> 2026-09-12T01:27:39Z): 317 rows carry `applied: true`
  with a non-empty `rounds_applied`, and ALL 317 entries have exactly the
  key-set ('accounts','strategy') — ONE distinct key-set, zero carrying `side`;
  (3) congenital not drift — writer projection, reader validation and round
  geometry all landed in the SAME commit, PR #10544 / 12e4a9eb4 / 2026-08-31;
  (4) the deployed code IS the analysed code — /api/diag/version git_sha ==
  git_sha_on_disk == c5a0ba993, restart_pending false.
  WHY IT WENT UNSEEN: the seam test that claims to prove it
  (test_a_plan_written_by_the_multiplexer_is_readable_by_the_pipeline, docstring
  "End-to-end on the real structures, not a hand-made dict") NEVER CALLS
  `_attach_fanout_plan`. It calls the planner then hand-writes
  `plan["apply_rounds"] = plan["rounds"]  # what apply mode attaches`, which is
  precisely what apply mode does not attach. Its sibling asserts only that the
  STRING "apply_rounds" occurs in the source. A test that constructs the
  producer's output cannot see a producer that builds it differently.
  TWO CORRECTIONS TO MI-274, whose core verdict SURVIVES BOTH INTACT.
  (1) HOP 4B IS FALSE: "apply_rounds REPLACES the global dispatch, so a partial
  arming closed both doors" — apply_rounds never survives validation, so the
  global dispatch ran unchanged and the prop twin's BL-20260827 route was never
  removed. breakout_1 IS starved, by the ORIGINAL global one-winner-per-symbol
  election, not by the allowlist.
  BL-20260911-ARMING-THE-ARBITRATION-FANOUT-ON-BYBIT1-ALONE-REMOVED-THE-PROP-ACCOUNT-S-ONLY-ROUTE-AND-THE-SOAK-RECORDED-IT-EVERY-TIME
  is filed on a false premise and is corrected in place.
  (2) THE STALE BALANCE DOES NOT BIND, and MI-274's own hop-5 table disproves its
  hop 6: two trend_donchian_eth_prop tickets reached `emit_prop_ticket` on
  2026-09-05 (16:34:52Z, 17:01:01Z), each carrying an order_package_id, with the
  snapshot ALREADY ~141h stale — so sizing returned a positive qty.
  PropRiskManager.position_size substitutes the NOMINAL equity when the live
  balance is unavailable (operator design 2026-06-19, its own docstring).
  Corroborated by the ticket data: risk_usd census over 163 rows (163 < the 200
  limit, so not a truncated page) reads 48 at $75.00 and 6 at $25.00, NONE at
  $71.81 — and $75.00 = 0.015 x $5,000 nominal, not 0.015 x the $4,787.34
  snapshot. So "send a fresh bal or it will not trade" would be FALSE. A fresh
  bal is still wanted (the snapshot is 298.3h old against a 24h limit) and is
  NOT on the critical path.
  A SECOND BLIND SPOT BESIDE AN ALREADY-FILED ONE — and this was first written as 'NEW,
  PREVIOUSLY UNRECORDED', which was FALSE and is withdrawn:
  BL-20260911-PROP-TICKET-RISK-IS-75-DOLLARS-AGAINST-87-DOLLARS-OF-DRAWDOWN-FLOOR-SO-TWO-LOSSES-PERMANENTLY-DISABLE-THE-ACCOUNT
  already records that ticket sizing does not consult distance_to_dd_floor_usd. The duplicate
  probe missed it because backlog_search is TOKEN OVERLAP ONLY and the two rows are phrased
  differently; reading the 54 open prop rows by hand caught it. What is additive is the SECOND
  mechanism: nothing in the ORDER PATH enforces the prop drawdown floor. `distance_to_dd_floor_usd` has display-only consumers
  (routers/prop.py, telegram_report_handler.py) — no branch reads the cushion —
  and the generic RiskManager cannot see prop outcomes at all, since
  daily_risk_state is rebuilt by SELECT ... FROM trades (3 sites in risk.py)
  while the prop executor writes only to prop_tickets/prop_fills and risk.py
  never reads a prop table (grep empty; POSITIVE CONTROL: the same pattern hits
  in breakout_executor.py). So max_dd_pct 0.06 / daily_usd 150 on breakout_1 can
  never trip from prop activity. Live cushion $87.34 against a nominal-sized risk
  of $75.00. ⚠️ THIS IS NOT A PROPOSAL TO STOP TRADING — the operator has ruled a
  low cushion must not stop trading and that ruling is not re-litigated — it is
  raised so the decision is made KNOWINGLY, and because sizing off a $5,000
  nominal is 4.4% ABOVE the account's actual equity.

