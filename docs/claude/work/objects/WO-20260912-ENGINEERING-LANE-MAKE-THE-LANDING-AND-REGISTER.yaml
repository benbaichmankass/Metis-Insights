  WHERE THE WORK STOPPED. Thirteen units ran this session, U80 through U92. ELEVEN ARE
  MERGED AND WERE VERIFIED AGAINST `main`'s OWN COPY AFTER EACH MERGE, never against the
  branch -- a merge is not a deploy and a green PR is not an observation. THREE ARE OPEN
