done_condition: >-
  Each queued unit (U1..U7) reaches one of exactly two terminal states, and says WHICH:
  (a) a LANDED fix carrying a planted-defect test -- a test in which the planted defect
  makes the guard/detector FAIL and a positive control keeps it quiet, so a green run is
  evidence rather than decoration; or (b) a written REFUSAL stating what was measured and
  why the fix is not feasible or not correct, filed where a later session will meet it.
  A fix without a planted-defect test does NOT satisfy (a), and a green run alone never
  does. Units are independent: the object is not done when one lands, and the queue does
  not end when U1..U6 do -- U7 names what follows.

why: >-
  Four failure modes were MEASURED on 2026-09-11/12 and all four are unowned, and each
  one loses work that OTHER lanes did. U1: PR #11842 was 4-of-4 green from 01:02Z and
  unmergeable for 3.5h on mergeable_state: dirty -- four green checks read identically
  to ready and nothing surfaces the difference. U2: claude-pr-automerge arms auto-merge
  before any check attaches, so a commit pushed afterwards may or may not make the
  squash; five measured instances, and the 2026-09-12 one dropped the commit carrying a
  LIVE lane's registry row, leaving that lane running unrecorded on main for nine
  minutes. U3: check_scope_overlap.py drops the declared paths under four of five real
  declaration shapes -- an A/B on live audit runs parsed 4 paths from a START whose
  bullets sit on the line after a bold header and 0 from the identical START with one
  blank line between them, and the blank-line shape is what ordinary markdown produces.
  U4: a shared-register merge can silently revert a FIELD while a union-by-id-set proof
  -- the remedy everyone reaches for -- reads clean; observed live on MI-277's branch,
  where resolving only the marked conflicts would have reverted two observation
  write-backs.

