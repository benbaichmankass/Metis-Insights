  PAUSED 2026-09-13T08:12Z by operator direction relayed through the manager
  (session_01HoFquGdTrD3TTGbMMRc43t): the account's weekly token budget is spent, every
  lane stands down, the seven-day window resets 2026-09-16T18:00:00Z. This note is written
