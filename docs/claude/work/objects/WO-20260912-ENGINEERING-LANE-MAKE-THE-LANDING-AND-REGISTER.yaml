    * #12214 (claude/mi280-u90-open-items-observation-loss) -- COMPLETE, armed, auto-merge
      on. check_suite.completed reported clean on head 2c93d65b7 at 08:19:35Z.
    * #12217 (claude/mi280-u91-red-main-runs-unproven) -- COMPLETE, armed, auto-merge on.
      It went `dirty` against a moved `main` and I RESOLVED THAT AND PUSHED (c44c59896),
      verified field-level: OPEN-ITEMS 86/86 -> 87 rows, 0 lost from either side, 0
      duplicates, and the only rows differing from my side are main's three newer ones.
      ⚠️ ITS `pytest-run` WENT RED ON THE PRE-ARMING HEAD 78ca2fe91 AND I COULD NOT
      ESTABLISH WHY -- see the open question below. That is the one genuinely unfinished
      thread in this lane.
    * #12218-or-unopened (claude/mi280-u92-malformed-removal-declaration) -- the branch is
      PUSHED and COMPLETE (local full guard set PASS 84 / FAIL 1, the one failure being
      pr-landing-guard for the landing record that has not been written). NO PR HAS BEEN
      OPENED AND IT IS NOT ARMED. This is the only unit needing more than CI.

  THE NEXT CONCRETE STEP, in order.
    (1) Open a PR for claude/mi280-u92-malformed-removal-declaration YOURSELF (never let
        claude-pr-automerge open it -- a PR born under GITHUB_TOKEN carries no
        pull_request event and its CI never fires), then push the SECOND commit carrying
        .github/pr-landing/mi280-u92-malformed-removal-declaration.json (tier 1, landing
        self), .github/pr-automerge-requests/<same-slug>.txt, and the per-branch merge slot
        from `claim_merge_slot.py --branch-claim`. The unit is finished; only the landing
        is not.
    (2) Answer the #12217 pytest question below, or say plainly that it could not be
        answered from this container.

  THE OPEN QUESTION, STATED AS A QUESTION RATHER THAN A GUESS. `pytest-run` concluded
  `failure` on #12217's head 78ca2fe91 (run 34746870906, job 103696288431). I could not
  reproduce it and I could not read it: the job log tail the MCP returns is the post-job
  cleanup block (2319 chars) and does not contain the failing test, and a LOCAL full-suite
  run is impossible in this container -- `python3 -m pytest -q` aborts at collection with
  116 errors, every one `RuntimeError: The starlette.testclient module requires httpx`,
  and `import httpx` raises ModuleNotFoundError. That is an ENVIRONMENT gap, NOT a repo
  defect, and it must not be reported as one. What IS established: the two test files this
  unit adds or touches pass (34 of 34, on the MERGED state), so the failure is not in them
  unless it is an interaction. WHAT TO DO FIRST: read the job's own log in the browser, or
  check whether pytest-run was red on `main` at that time -- the failure may not be this
  PR's at all, and the merge I have since pushed may have carried its fix.

  WHAT I KNOW THAT IS NOT YET WRITTEN DOWN ANYWHERE ELSE.
    * `backlog_append.py` has an `update_row(path, row_id, fields=..., append=...)` that
      amends a row IN PLACE preserving the file's exact bytes, and it stamps `resolved_at`
      itself. I hand-spliced a status flip before finding it and `artifact-validity-guard`
      correctly failed the run because the file stopped round-tripping. Use it. The same
      is true of OPEN-ITEMS.json, which has NO such helper -- every edit there is a manual
      splice, and that is what U90 (#12214) exists to make safe.
    * The four-cell truth table for `register-field-loss` is in U92's commit message and
      its backlog resolution; it was run in worktrees against `origin/main`, not in a
      harness. One of my own probes in that table was VACUOUS on the first attempt (two
      heredoc setups chained with && inside `bash -c`; the removal never applied and the
      guard reported `0 register(s) compared` -- an exit 0 that proved nothing). Read the
      DENOMINATOR, never the exit code.
    * `probe_file.py` now reads a whole-file JSON corpus as one row. Before U91 it read
      every corpus line by line, so `docs/claude/DUE.json` yielded ZERO rows and any probe
      over it reported "read and nothing matched" -- a clean negative over a population
      nobody read. If U91 does not land, every probe pointed at a pretty-printed JSON file
      is silently blind.

