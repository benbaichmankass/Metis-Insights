    chosen: land_it_now
    enacted: "merged 2026-09-12 as 1baff7a1f019efc10f8df9f26e24f8ee0f0157d5"

  - id: DEC-20260912-BREAKOUT-1-ARMING-STAYS-GATED
    decided_on: "2026-09-12"
    source: operator (conversational, manager decision popup)
    verdict: approved_with_conditions
    chosen: come_back_with_the_evidence
    scope: >-
      How the SECOND step — adding breakout_1 to ARBITRATION_FANOUT_ACCOUNTS —
      is gated. It is NOT approved. The operator explicitly declined to
      pre-authorise it.
    condition: >-
      The manager must first OBSERVE bybit_1 genuinely dispatching through the
      fan-out, then bring the operator the observed soak row and ask again.
      A merge is not a deploy and a deploy is not an observation. Arming
      breakout_1 without that second approval is forbidden.
    why_this_matters: >-
      Arming the allowlist before the dispatch is verified flips apply_scope to
      `allowlisted` and puts breakout_1 into rounds_applied while it stays
      starved — every observability surface, including the starvation counter
      itself, would then report the account as routed. That is the trap this
      sequencing exists to avoid, and it is why the operator kept the gate.
