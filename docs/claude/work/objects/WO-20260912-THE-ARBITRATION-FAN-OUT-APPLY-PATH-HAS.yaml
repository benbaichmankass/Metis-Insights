operator_decisions:
  - id: DEC-20260912-LAND-THE-FANOUT-PROJECTION-FIX
    decided_on: "2026-09-12"
    source: operator (conversational, manager decision popup)
    verdict: approved
    scope: >-
      Merging #11970 into main. The popup stated in full that this ARMS a
