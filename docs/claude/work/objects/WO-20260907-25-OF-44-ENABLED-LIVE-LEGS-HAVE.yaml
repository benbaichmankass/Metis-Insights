decision_requests:
  - id: DEC-20260907-TP-VALUE
    question: >-
      Apply tp_r 4.0 to gld_pullback_1h as a REACHABILITY repair - accepting that it
      is reachable but NOT calibrated?
    urgency: routine
    asked_on: 2026-09-07
    context: >-
      This is the only leg of the 25 with pre-existing gate-passing,
      live-expressible take-profit evidence: cell `tp4` (wf_pass,
      wf_wins_effective 4/6, 0 inert, d_net_r +9.00; sweep 2026-08-31).
      REACHABILITY IS MEASURED: live cap_r on this leg is min 7.94 / median 8.24
      over n=4 rows, so a declared 4.0 would BIND on 4 of 4 observed trades
      instead of the 9.9% venue clamp. WHAT IT DOES NOT ESTABLISH: that 4.0R is
      where momentum runs out. MI-155 grades this leg insufficient_n (n_live 3
      against a floor of 30), and a walk-forward is evidence about net R, not
      about exit LOCATION; 2 of its 6 folds lost. Note also that this DEPARTS
      from the coverage matrix's own winner for the leg (`sm1.5`, chosen by
      d_net_r +46.46), which carries no take-profit at all - so this is
      selecting for reachability over d_net_r, deliberately.
    options:
      - key: apply
        label: Apply tp_r 4.0 to gld_pullback_1h
        implication: >-
          One live leg stops resting a venue artefact and starts resting a
          declared level. It is the first leg on which target_extension_soak can
          produce a non-sentinel row, which unblocks MI-148 clause 3.
      - key: hold
        label: Hold until a timeframe-matched harness run exists
        implication: >-
          The fleet keeps zero legs with a reachable declared target among these
          25, and the soak keeps reading 100% sentinel_no_expectation - i.e. the
          instrument stays unable to observe the lever at all.
      - key: apply_with_sm
        label: Apply tp_r 4.0 AND the matrix's sm1.5 stop cell together
        implication: >-
          Ships both axes at once. ⚠️ NO CELL IN THE CORPUS EVALUATES THE PAIR -
          the joint effect is unmeasured, so this trades a known-unmeasured
          interaction for a larger expected d_net_r.
    allows_free_text: true
    asked_by:
      session_id: session_0148fMEXBbDgQU3qsrcWujtx
      recorded_at: 2026-09-07T09:10:00Z
      note: MI-156 - the only per-leg take-profit value the evidence supports today

  - id: DEC-20260907-TP-VOCAB
    question: >-
      Accept the `tp_intent` declaration key (mode: r_multiple | none | unexamined)
      on config legs - and require its reader in the same cycle?
    urgency: routine
    asked_on: 2026-09-07
    context: >-
      MI-146's gate condition 1 says a leg that deliberately has no target "must
      say so as an explicit declaration, not by carrying a 50R sentinel". Today
      a deliberate decision and a plain omission are BYTE-IDENTICAL, and for the
      10 no-target legs the sentinel is not even visible to a `grep tp_r`. The
      proposed key makes the decision readable and is RUNTIME-INERT by
      construction. ⚠️ THE HONEST OBJECTION, stated rather than hidden: nothing
      reads `tp_intent` today, and by this repo's own provenance-consumer-guard
      standard "a signal that is written and never read is worse than a missing
      one" - which is how exit_price_source rotted. So the key should either
      land WITH its reader (bracket_expectation_census.py and
      src/runtime/target_expectation.py, both Tier-1) or not land.
    options:
      - key: accept_with_reader
        label: Accept the key, and land its reader in the same cycle
        implication: >-
          The declaration becomes machine-readable and the census can finally
          separate "deliberate" from "omitted". Costs one Tier-1 follow-on PR.
      - key: accept_key_only
        label: Accept the key now, reader later
        implication: >-
          ⚠️ Creates exactly the write-only field the repo has a guard against.
          Not recommended by this proposal.
      - key: reject
        label: Reject the key; record intent somewhere else
        implication: >-
          The unit docstrings stay the only place the "deliberately unbracketed"
          decision is written down, so a config reader still cannot tell a
          decision from an omission, and MI-146's gate condition 1 stays unmet.
    allows_free_text: true
    asked_by:
      session_id: session_0148fMEXBbDgQU3qsrcWujtx
      recorded_at: 2026-09-07T09:10:00Z
      note: MI-156 - the declaration half of the repair, covering 24 of the 25 legs

  - id: DEC-20260907-TP-UNEXAMINED
    question: >-
      Is `unexamined` an acceptable PUBLISHED state for two live legs
      (qld_trend_long_1d, tqqq_trend_long_1d)?
    urgency: routine
    asked_on: 2026-09-07
    context: >-
      These two are absent from BOTH sweep corpora - e35-bracket-corpus.jsonl
      (41 legs) and -history.jsonl (27 legs) - against a positive control
      (splg_trend_long_1d) present in both. The coverage matrix says why:
      blocked:no_free_lane_candle_feed. So their target question has NEVER BEEN
      ASKED. They are trading live today with a 50R sentinel, and the choice is
      whether to say that plainly or to fold them in with the legs that were
      examined and found to have no shippable target. Folding them in would
      launder "we did not look" into "we decided", which is the collapse
      docs/CLAUDE-RULES-CANONICAL.md § "Collapsed states" exists to prevent.
    options:
      - key: publish_unexamined
        label: Publish `unexamined` on both legs
        implication: >-
          Two live legs visibly carry an un-asked question. That is the honest
          state and it creates standing pressure to source a candle substrate.
      - key: fold_into_none
        label: Declare them `none` like the others
        implication: >-
          ⚠️ Asserts a decision nobody made. Not recommended by this proposal.
      - key: shadow_them
        label: "Move both to execution: shadow until they can be swept"
        implication: >-
          Removes live exposure on legs whose exit geometry has never been
          examined. ⚠️ This is a SEPARATE Tier-3 demotion, outside this
          proposal's scope, and it would be evidence-free in the other direction
          - no measurement says these legs are bad.
    allows_free_text: true
    asked_by:
      session_id: session_0148fMEXBbDgQU3qsrcWujtx
      recorded_at: 2026-09-07T09:10:00Z
      note: MI-156 - keeping the third state separable, per the dispatch

why: >-
  MI-146 measured that on 56.8% of the live fleet (25 of 44 enabled+live legs)
  "it was right and it hit the take profit" is structurally impossible, so the
  only exit available to a winning trade is the ATR trail - and a trail by
  construction gives back the distance from the high-water mark to the trail
  line. That is the giveback the operator observed. MI-148 then established that
  clause 1 (give the sentinel legs a stated, reachable expectation) is a hard
  prerequisite for clauses 2 and 3, and MI-155 established that the
  MFE-quantile route to a per-leg number is closed on every leg today. This
  object is the repair that is available under those two constraints together.

