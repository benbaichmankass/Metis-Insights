done_condition: >-
  Produce the exact per-leg repair as a Tier-3 PROPOSAL for the 25 of 44 enabled+live legs with no reachable take-profit (15 declaring tp_r >= 20 that TP_VENUE_CAP_PCT = 0.099 silently clamps to 9.9% of entry; 10 declaring no target at all). The deliverable is docs/research/reachable-take-profit-proposal-2026-09-07.md, carrying the per-leg table (leg, current declaration, what the venue actually rests, proposed value, basis, what it does NOT establish), the two sub-populations kept apart and never merged, and the exact config/strategies.yaml diff as a fenced block that is NOT applied. It repairs REACHABILITY, not calibration, and must say so in those words - a target the venue accepts is strictly better than one it silently clamps away, which needs no fidelity evidence and does NOT establish that the new level is where momentum runs out. Per leg, state what the number rests on AND what it does not rest on. For the 15 clamped legs, decide per leg whether the honest repair is a real finite tp_r or an explicit declaration that the leg is deliberately unbracketed. For the 10 with no target, establish per leg whether a target was intended and lost or never declared, keeping "we did not look" as a distinguishable third state. READ-ONLY on config/.

outcome: >-
  DELIVERED as a proposal, open at PR #11225 (branch
  claude/reachable-tp-proposal-20260907), awaiting the Tier-3 decisions below.
  MEASURED against config/strategies.yaml and both e3.5 corpora at origin/main
  383a4f7, the full 110-revision history of that file, and the live trader
  (/api/diag/position_telemetry, 171 rows, 2026-09-07).
  THE HEADLINE RESULT IS THAT 24 OF THE 25 LEGS GET A DECLARATION AND NOT A
  NUMBER, and that is a consequence of MI-155 rather than of effort: all 44
  enabled+live legs grade insufficient_n, so no leg may take a target from the
  MFE-quantile route. Sub-population A (15 explicit sentinels) resolves to 13
  explicit `none` + 2 `unexamined` + 0 finite targets; sub-population B (10 with
  no target key) resolves to 1 finite target + 9 explicit `none`.
  SHARPEST FINDING: the e3.5 sweep pipeline has ALREADY shipped a take-profit to
  every leg for which it produced a gate-passing, live-expressible cell - nine
  legs, each carrying its winning cell id inline in config - and left exactly
  one behind, gld_pullback_1h (cell tp4). The other 24 have no shippable cell at
  all, because every TP-bearing passing cell on them is entangled with a
  bar-count timeout no live unit implements. So their unreachability is an
  ABSENCE OF EVIDENCE, not an oversight, and that is what makes it a declaration
  problem rather than a number problem.
  ESTABLISHED SEPARATELY: none of the 10 no-target legs has ever carried a tp_r
  key, across all 110 revisions of config/strategies.yaml (2026-04-29 ->
  2026-09-06, full history), against four positive controls on which the probe
  finds tp_r AND catches value changes. Absence there is "never declared", not
  "intended and lost".
  NOT ESTABLISHED, and the proposal says so per leg: that any proposed level is
  where momentum runs out. The one number (gld_pullback_1h tp_r 4.0) is
  REACHABLE - measured cap_r min 7.94 over n=4 live rows, so the declaration
  would bind rather than the clamp - and it is NOT CALIBRATED.

