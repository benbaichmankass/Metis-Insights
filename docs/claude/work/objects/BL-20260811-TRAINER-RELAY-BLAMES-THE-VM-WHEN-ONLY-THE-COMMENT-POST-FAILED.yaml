  Branch the handler on the actual failure STAGE, not on `CMD_PRESENT` alone — the same fix shape the earlier instance used, applied one level deeper. Concretely: (1) record whether the SSH step succeeded and whether output was captured, and emit a distinct message for 'the command SUCCEEDED but the result could not be posted' that explicitly says the trainer is NOT implicated; (2) always write the captured output to `$GITHUB_STEP_SUMMARY` before attempting the comment, so a delivery failure can never destroy a successful measurement; (3) retry the createComment once — `fetch failed` is transient — and consider truncating very large bodies, since the failing POST here carried a multi-KB body. Same treatment applies to the sibling vm-diag-snapshot relay, which shares this handler shape.
