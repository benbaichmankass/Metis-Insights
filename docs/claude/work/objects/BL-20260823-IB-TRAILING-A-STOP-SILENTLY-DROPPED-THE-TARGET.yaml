done_condition: |-
  ["ANSWERED 2026-08-23, and the answer is NO: the contaminated population is NOT reconstructible from the journal. Tested, not assumed — all four candidate anchors were checked and each fails for a specific reason: (1) `trades.stop_loss` is OVERWRITTEN IN PLACE by order_monitor._apply_update's `db.update_trade(trade_id, trade_sync)`; (2) `order_packages.sl` is overwritten in place by the same path's `db.update_order_package(pkg_id, updates)`; (3) the append-only `signals` dual-write records decision CONTEXT (event, timeframe, regime, adx_14, pattern, confidence, price) but carries NO protective geometry — verified against live MES rows, meta is `{event, timeframe, regime, adx_14, regime_source}`; (4) `position_telemetry` is UPSERT-on-order_package_id and its `rToStop` is derived from the CURRENT stop, so it holds no trajectory either, and it covers only donchian/pullback legs. There is no entry-time stop anywhere that survives the first trail. So do NOT report a number for the historical population — there is none to report, and a partial count would be worse than the honest 'unknown'.", 'GOING FORWARD IS THE ONLY MEASURABLE DIRECTION, and it needs one small write: stamp the trade when its protective bracket is re-armed or amended (a counter and/or first/last timestamp on the row). That is Tier-2 (a write on the trader path) so it is PROPOSED here, not shipped. Without it the same question will be equally unanswerable next time — and note the re-arm currently writes NOTHING durable at all: _attempt_naked_autoprotect returns a bool and logs only on FAILURE.', "⚠️ THE RE-ARM LEAVES NO DURABLE RECORD, which is a defect in its own right: `_attempt_naked_autoprotect` returns a bool and logs ONLY on failure - no journal write, no soak row, no outcome emit - and `modify_protective` likewise stamps nothing on the trade. So a repair that mutates a live position's protective bracket is invisible afterwards. Propose stamping the trade (Tier-2, a write on the trader path) so the population is measurable GOING FORWARD even if the history is lost.", "The exit-geometry / exit-head research must not calibrate on IB live exit outcomes until this is quantified: for a contaminated trade 'the target was never hit' describes a mechanism that had been removed. Carried into docs/research/EXIT-GEOMETRY-REBUILD-SESSION-PROMPT.md as a blocking caveat.", "PROVE THE FIX ON A NEW BRACKET: a bracket born AFTER the deploy must carry BOTH a STP and a LMT in one OCA group (/api/diag/ib_open_orders). Until then report it as 'deployed but NOT YET EXERCISED' - an unexercised fix and a working one look identical.", 'TRADE-REVIEW CHECK (added 2026-08-24, operator-directed standing watch) — the order-book check alone is NOT sufficient and MGC 4773 proves it: both legs rested, the target was 233.9 pts in the money, and the close still came from the monitor via `tp_cross`. Resolution additionally requires at least one IB close where the ATTACHED TARGET demonstrably acted (exit at/through the declared take-profit with a non-monitor `exit_reason`), with the population stated (n IB closes examined, split across target-acted / monitor-closed-while-LMT-rested / stop-closed-uninformative / none-closed). A `tp_cross` close while a LMT rested at or better than the exit price REOPENS this row rather than draining it.']
