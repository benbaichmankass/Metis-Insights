done_condition: >-
  (1) A row holding ready/unassigned past a MEASURED threshold is SURFACED where a manager reads before it plans - not in a 5.1 MB backlog and not behind a command someone must choose to run. (2) It is OBSERVED catching one: a real unrouted row reported BEFORE the operator asks about it. (2) is the whole point and (1) does not substitute - every mechanism in this family has shipped and then not been read. A green guard clears (1) ONLY. Thresholds must be established FROM THE DATA with the population stated, never chosen round numbers. The surface must distinguish 'we did not look' from 'nothing is stale'. If the honest answer is that MI-235/236/237 subsume this once built, saying so and CLOSING this row explicitly is a legitimate outcome - a fourth near-duplicate accruing IS the class.

why: >-
  THE THIRD DROP CLASS. MI-235 covers a session blocked on a manager action never told when it clears; MI-236 covers an in_flight row going stale because nothing decays it. NEITHER covers a row FILED correctly and then never routed: it sits ready/unassigned indefinitely with no age, nothing computes how long it has been unrouted, and no surface reports it. FILING IS NOT ROUTING and the register makes those indistinguishable. Four measured instances, every one found only because the operator happened to ask.

