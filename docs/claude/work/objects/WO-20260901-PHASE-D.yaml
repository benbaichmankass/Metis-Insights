review_trigger: >-
  Re-read when a session writes real blocked_on edges into the store (the diagnosis
  refuses for want of them, not for want of machinery), or when the operator changes
  the cycle priority.

done_condition: >-
  The cycle's priority has a computed readout behind it, AND docs/claude/DUE.* is
  deleted rather than left running beside it.

blocked_on:
  - kind: external_event
    ref: >-
      a session writing TRUE blocked_on edges, taking assessed coverage over the
      declared 50% floor so E1 can name a stage instead of refusing
    since: 2026-09-01
    note: >-
      ⚠️ THE MACHINERY IS BUILT AND THE DIAGNOSIS REFUSES — those are different facts
      and only the first is delivered. scripts/ops/constraint_readout.py computes the
      graph, but measured over the whole store on 2026-09-01 only 6 of 584 objects
      (1.0%) carry an ASSESSED blocked_on basis: 578 carry an empty list stating
      NOT_ASSESSED, which is nobody having looked. So the verdict is
      `insufficient_basis` and NO STAGE IS NAMED. That is the honest output and the
      readout ships it, but the phase's own done_condition asks for a computed
      readout BEHIND the priority, and a permanent refusal is a readout that will be
      skimmed past. It clears when the assessment work is done by the sessions that
      own those rows — not by this phase, which must not invent edges to satisfy its
      own done-condition. A false blocker is worse than a missing one.
  - kind: external_event
    ref: >-
      a demonstration that the readout supersedes docs/claude/DUE.* in full, or an
      operator decision to keep both
    since: 2026-09-01
    note: >-
      The build plan says the due-list is DELETED rather than left running beside the
      readout. It was NOT deleted, deliberately, and the reason is measured rather
      than cautious: render_due_list.py draws on OPEN-ITEMS.json monitoring cadences,
      PROBES.json, the recurrence ledger, red scheduled crons and unlanded automation
      PRs. The readout draws on the work store, the live money route and the
      operator-owed register. Four of the due-list's source classes have NO
      counterpart here, so deleting it would drop live signals — the opposite of the
      phase's intent. What overlaps is exactly one class: operator-owed items.

blocked_on_basis: >-
  ASSESSED 2026-09-01 by the Phase D session, against the store as it stands. Both
  edges are external_event rather than object edges, deliberately: what holds this is
  an observation nobody has made, not a deliverable another object owns.

note: >-
  E1 IS genuinely new — RE-VERIFIED this session rather than taken from the plan
  (RULE ONE). Probe: grep for `blocked_on` across *.py/*.md/*.json/*.yaml/*.ts
  excluding the objects dir, with a POSITIVE CONTROL that the same probe finds all
  584 objects that do carry it. Of the non-object hits, src/web/api/routers/work.py
  normalises the edges and grades blockedOnState but names no stage;
  scripts/ops/render_due_list.py and scripts/ops/work_digest.py do not read the field
  at all. Nothing computed a held-up stage before this change.

  ⚠️ THE EDGE THIS OBJECT USED TO CARRY WAS A FALSE BLOCKER, and finding it is a
  Phase D result rather than an aside. It read `object -> WO-20260901-PHASE-C`, on
  the reasoning that E1 needs migrated rows. The migration LANDED; Phase C sits at
  `waiting` only on an unobserved cold-session read of the priority. So the graph
  reported Phase D held by a capability that had already been delivered. The store
  cannot currently distinguish a target that is `waiting` because it is undelivered
  from one `waiting` on an observation, and a dependent needs the capability, not the
  observation. constraint_readout.py publishes that as `holds_on_waiting_targets`
  with the caveat attached rather than inventing a state nobody measured; two more
  live edges have the same shape (PHASE-G -> PHASE-D, PHASE-H -> PHASE-B).

operator_decision_2026_09_08:
  verdict: consolidate_into_the_readout
  text: >-
    "Carry the four missing classes into the readout, then retire DUE.md."
  decided_on: 2026-09-08
  scope: >-
    The PORT only. Retiring docs/claude/DUE.* is a SEPARATE, later change and is
    NOT authorised by the same act.
  condition: >-
    TWO CHANGES, NEVER ONE. Port the classes first and demonstrate them
    rendering; retire DUE.md only afterwards, in its own PR. Retiring in the
    same change takes the session-facing due list to ZERO if the port is
    incomplete. Precedent and reasoning are already in this repo: the hourly
    digest carrier was split across two PRs "so that a timer which fails to
    install cannot take the digest to ZERO", with the duplicate output in
    between recorded as an accepted cost rather than a defect. The same accepted
    cost applies here — DUE.md and READOUT.md §5 both render the same rows until
    the second PR lands, and that is a KNOWN state, not a defect to re-file.
  condition_2: >-
    ⚠️ THIS DOES NOT FIX THE READOUT'S COVERAGE AND MUST NOT BE REPORTED AS
    DOING SO. §1 still grades `insufficient_basis` and still names no stage, and
    that is CORRECT. Folding registers in adds ROWS, not assessed `blocked_on`
    BASIS. A PR body implying the consolidation improved the diagnosis would be
    the unprovenanced-diagnostic defect this repo has a guard for.
  condition_3: >-
    EVERY PORTED CLASS KEEPS ITS OWN READ-STATE. A cron that could not be READ
    is not a cron that is GREEN; an unlanded-automation list that could not be
    FETCHED is not an EMPTY queue.
  provenance: >-
    ⚠️ RELAYED, NOT READ FROM THIS FILE. The MI-196 spawn prompt instructed the
    session to read this decision at
    `WO-20260901-PHASE-D.yaml::operator_decision_2026_09_08` — and NO SUCH BLOCK
    EXISTED. Verified at session start with a positive control: `blocked_on_basis`
    was found in this same file on `origin/main` by the same probe, while
    `operator_decision_2026_09_08` and the string `consolidate_into_the_readout`
    returned ZERO hits repo-wide. So the verdict and its three conditions above
    are transcribed from the spawn prompt, which is the only surface that carried
    them; MI-196 did not witness the operator state them. This block is that
    record. If the wording differs from what the operator actually said, THIS is
    the text that was acted on.

port_measurement_2026_09_08: >-
  ⚠️ TWO CLAIMS IN THIS OBJECT'S OWN `blocked_on` NOTE ARE FALSE, measured by
  MI-196 against `scripts/ops/render_due_list.py` rather than re-quoted.
  (1) THE COUNT IS WRONG: the note says four due-list source classes have no
  readout counterpart. There are NINE `def src_*` functions — open_items, soaks,
  operator_owed, probes, research_queue, red_crons, unlanded_automation,
  error_feed, sunset_dispositions — and only `operator_owed` has one, so EIGHT
  classes were missing, not four. The operator's "four" was taken from this note.
  MI-196 ported all nine (eight rendered, `operator_owed` marked
  covered-elsewhere and deliberately not double-counted) because porting a
  subset would leave DUE.md un-superseded and make the retirement PR unsafe
  permanently.
  (2) THE RECURRENCE LEDGER IS NOT A DUE-LIST SOURCE. The note names it as one.
  The only `RECURRENCE-LEDGER` mention in `render_due_list.py` is line 15, a
  docstring reference to its SIBLING `render_session_brief.py`, which is the
  script that actually reads it. Positive control: `PROBES` appears 13 times in
  the same file and every real source has a `def src_*`. Field beats comment —
  the note is corrected here rather than reasoned from.
  A session planning off the old note would have ported the wrong set.

port_observed_2026_09_08: >-
  §5 IS RENDERING ON MAIN — OBSERVED, not inferred from the merge. PR #11369
  merged 11:09:03Z as 0e03be9d; read back from `origin/main` (not from a local
  build): docs/claude/READOUT.md carries "## 5 · Everything else that is due"
