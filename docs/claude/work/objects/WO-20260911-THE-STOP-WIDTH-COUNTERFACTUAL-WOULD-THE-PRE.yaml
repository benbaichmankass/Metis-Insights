  entry-declared e35 stop, 5 of 5 would ALSO have hit the pre-e35 2.5-ATR stop,
  and 0 of 5 reached their take-profit at ANY horizon out to the end of data (best
  MFE 1.974 R of pre-e35 risk against tp_r 50). Two would have stopped within 9
  minutes of when they actually did; three were deferred 4h-4.4 days and then
  stopped. || REVERSE ARM (needs NO horizon -- each trade's own lifetime bounds
  it): the tighter e35 stop would have been touched on 3 of 18 pre-era packages
  and would have killed 1 of 14 WINNERS, worth $5.61 of $24,967.77 = 0.0225% of
  pre-era winnings. The top TEN winning packages ($187.56 and up) all have MAE <=
  0.90 ATR against e35 stops at 1.5-2.0; the only two near an e35 stop are the two
  smallest winners. || THE ECONOMIC FRAME: risk.py::_size_unbounded sizes as
  (balance * risk_pct) / |entry - sl| and the target is tp_r * risk_distance, so
  BOTH the dollar risk and the dollar reward are INVARIANT to stop width -- the
  multiplier changes only which outcome the path reaches first. "It would have
  stopped anyway" therefore means "the same dollars, later". || WHAT DID CHANGE,
  with the truncation confound REMOVED (fixed windows from entry, so the window
  does not depend on the geometry under test or on when the trade closed): adverse
  excursion 1.4-1.8x larger and favourable 0.19-0.58x smaller at every horizon
  (4h/12h/24h/48h), favourable:adverse from 1.0-4.6 down to 0.33-0.54. Measured in
  ATR UNITS, so invariant to the multiplier change. ATR/price did NOT collapse
  (0.75-1.14x on the timeframes with real n) -- chop at unchanged volatility, not a
  vol regime change. || DOSE-RESPONSE INVERTS: the 20% tightening (2.5->2.0) gave a
  stop rate of 0.80 (p<0.0001) while the 40% tightening (2.5->1.5) gave 0.25
  (p=0.47). Confounded by symbol/timeframe, and its decisive arm is EMPTY -- see
  the backlog row. || INSTRUMENT WORK: 3 positive controls ran BEFORE the arms.
  PC1 basis FIT (OKX *-USDT-SWAP 1m; median deviation 0.0 bp, max 19.2, 0 of 33
  unfit). PC2 reproduction PASS (5 of 5, simulated touch within 0.1-3.3 min of the
  recorded closed_at) -- and PC2 is what CAUGHT a geometry error: the declared stop
  is anchored to the PACKAGE entry, not the fill, so the simulator now scales the
  entry-frozen exit_plan.stop distance by the multiplier ratio rather than
  recomputing it. All 33 packages' declared distances land EXACTLY on their own
  era's multiplier, which independently confirms the deploy reached the trader.
  || MI-271 IS ROBUST, NOT CORRECTED: its headline recomputed per PACKAGE (the
  correct unit -- account fan-out shares one price path and inflates n 1.27-1.64x,
