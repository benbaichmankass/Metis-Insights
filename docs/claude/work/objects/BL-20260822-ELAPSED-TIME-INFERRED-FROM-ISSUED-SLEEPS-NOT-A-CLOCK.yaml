next_action_at_migration: |-
  Practice, not code: when reporting elapsed time, READ A CLOCK -- take the difference between the API's own `started_at`/`completed_at`, or run `date -u` -- and never infer duration from sleeps issued, turns taken, or context consumed. If a duration is load-bearing enough to change a decision (merge / do not merge), it is load-bearing enough to measure. Consider adding this to the session-coordination skill's merge-protocol section beside the existing 'read the check runs by name' rule, which this sits directly next to.
