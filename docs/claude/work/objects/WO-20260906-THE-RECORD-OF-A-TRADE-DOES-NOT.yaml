      a correct ratio over an invisible denominator — the same defect class
      MI-144 was dispatched to fix, reproduced by the fix. Carried as
      OI-20260906-BRACKETOUTCOME-ANSWERS-THE-OPERATORS-QUESTION-OVER-A-QUARTER-OF-THE-BOOK.
    the_answer_to_the_operators_question: >-
      REAL MONEY, all history, n=428, 420 gradeable: 228 (54.3%) ended at a
      declared bracket — 187 at the STOP against 41 at the TARGET, a 4.6:1
      ratio — and 192 ended mid-bracket. ⚠️ QUOTE THIS FROM THE MEASUREMENT,
      NOT FROM THE LIVE ENDPOINT, until the coverage fix deploys: the endpoint
      currently answers 44.4% over 99 rows.
  c_read_route_silently_empties:
    tier: 1
    state: landed_unproven
    what: >-
      /api/bot/trades/closed now REFUSES with 503 + a machine-readable reason
