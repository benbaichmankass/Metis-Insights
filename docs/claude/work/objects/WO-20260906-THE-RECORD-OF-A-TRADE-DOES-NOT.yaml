    a_r_arithmetic_checked_not_eyeballed: >-
      window=30d real money: rBasis {declaredInitial 39, storedStop 0,
      refusedWrongSide 0, noBasis 0} — sum 39 == totalTrades 39, and
      declaredInitial+storedStop 39 == rTradeCount 39. window=all real money:
      {103, 321, 0, 0} — sum 424 == totalTrades 424, declared+stored 424 ==
      rTradeCount 424. The same identity holds on paper (529 / 865) and
      paperPortfolio (52 / 87). expectancyR moved +0.9818 -> +0.1772 on 30d and
      now reads -0.3152 on all-time real money against profitFactor 0.7294 and
      totalPnl -69.53 — sign AGREES on the all-time real-money book.
    caveat_the_sign_test_is_not_general: >-
      ⚠️ On the 30d real-money window the corrected expectancyR is +0.1772
      while profitFactor is 0.9507 — the sign still DISAGREES, on a window whose
      totalPnl is -$3.63 (essentially flat, n=39). That is the documented and
      expected behaviour, not a residual defect: R weights each trade by its own
      risk and USD does not. Quoted here so the pre-merge caveat is not quietly
      dropped now that the headline figure looks better.
    c_route_contract: >-
      limit=5 returns X-Total-Count 447 and X-Has-More true; offset=5 returns a
      DISJOINT page (ids verified non-overlapping), so truncation is
      distinguishable from exhaustion; limit=800 returns HTTP 422 naming the cap
      rather than a bare []; since=2026-09-01 SERVES (12 rows, X-Has-More false).
      ⚠️ The 12 vs the 142 recorded pre-merge is NOT a regression and was chased
      down rather than waved past: the route excludes paper by default, and
      include_demo=true returns 143 — the same population, one more close since.
    b_defect_found_by_this_observation: >-
      ⚠️ THE DEPLOYED BRACKET ANSWER COVERS A QUARTER OF THE BOOK. window=all
      real money publishes reachedRatio 0.4444 over gradeable=99 with
      noBracketRecord=321 (99+321+4 == 424, so the states partition cleanly).
      MEASURED cause, not inferred: only 120 of 470 real-money closed
      non-backtest rows carry an order_package_id at all (25.5%), and 325 of the
      350 NULL rows are reachable via order_packages.linked_trade_id (92.9%),
      leaving 25 unreachable by either key. Re-run offline with the SHIPPED
      classifier over the route's own population (n=428): the forward key alone
