why: >-
  Operator-directed 2026-09-08: "What are we doing about the losing streak? even
  on 16 trades, we can't just chalk this up to chance - something isn't working,
  and we need to track it down". The cycle priority is explicit that the
  MEASUREMENT is repaired BEFORE anything is acted on, because a verdict from a
  contaminated instrument is worse than no verdict — it gets acted on.

done_condition: >-
  Each non-`sl` close is attributed to the mechanism that ACTUALLY closed it, read
  from the journal and the venue rather than from `exit_reason` alone; the three
  pooled things (a) a genuine strategy exit that lost, (b) a reconciler/other path
  that misdescribes WHY the row closed, (c) a row whose pnl cannot carry a verdict
  at all — are separated with populations stated; and a verdict is given on the
  (a) subset only, with `insufficient_n` reported as the finding if that is what
  the clean subset supports.

outcome: >-
  DONE 2026-09-08. All three clauses met, and the answer is NOT the one the
  dispatch expected.

  ⚠️ THE DISPATCHED POPULATION WAS WRONG AND WRONG IN THE DIRECTION THAT MATTERS.
  n=15 was the real-money subset of a PAPER-INCLUSIVE page — a 5-day slice.
  `include_paper` defaults to False, so the default response is already
  real-money-only and the flag NARROWS the real-money count. Paged to exhaustion
  the real-money closed population is n=447 over 2026-05-09..2026-09-04. So "0
  wins" is a window artifact: the book is 117 W / 258 L / 49 flat (n=424 graded on
  the canonical decision set, sum -69.53). Filed as
  BL-20260908-INCLUDE-PAPER-TRUE-NARROWS-THE-REAL-MONEY-POPULATION-...

  THE STREAK IS REAL: 14 consecutive non-wins since trade 5170 (2026-08-28T16:24Z),
  not 13 — and that last win was itself booked by the reconciler, not a strategy
  exit. But under an IID model at the lifetime non-win rate (0.7241), a run of >=14
  somewhere in 424 trades has probability ~71%, expected ~1.24 times. So the STREAK
  LENGTH does not exclude chance and must not be presented as if it does. These
  trades are not IID, so that is a FLOOR on how ordinary the run is, not a p-value.

  THE EVIDENCE FOR "SOMETHING ISN'T WORKING" IS THE INSTRUMENT. `closeReason`
  cannot answer the question asked of it: its `other` bucket holds FIFTEEN distinct
  mechanisms, including 182 rows that ARE strategy exits (vwap_cross 102, sl_cross
  53, tp_cross 15, exit_head 5, time_decay 4, stale_stop 3). Reading `other` as
  "not a strategy exit" — which the dispatch did — is wrong in BOTH directions.
  Worse, /api/bot/trades/closed and /api/bot/strategies are DIFFERENT taxonomies
  over the same column and disagree on 174 of 447 rows (38.9%); 53 rows read `sl`
  on one surface and `other` on the other. Filed as a RECURRENCE of
  BL-20260820-STRATEGIES-EXIT-REASON-ROLLUP-BUCKETS-LEVERS-AS-OTHER.

  ATTRIBUTION over the decision set (n=431): (a) strategy exit 309 = 71.7%,
  (b) not a strategy exit 122 = 28.3%, unknown 0. Of the 14-row STREAK
  specifically, 8 of 14 were NOT strategy exits (2 operator flattens, 4 reconciler,
  2 netting) and 6 of 14 were `ict_scalp_5m`, already demoted off bybit_2.

  VERDICT: `insufficient_n` on EVERY leg routed to a real-money account. Largest
  convictable sample on a live-routed leg is 7 (trend_donchian) against
  MIN_CLOSED_FOR_ACTION=20; three of the seven roster legs have ZERO convictable
  closes. The lifetime loss is dominated by `vwap` (180 of 222 convictable rows,
  -49.38 of -69.53) — a leg off since 2026-06-07 and routed to no account.

  AND THE UNDERLYING PNL IS NOT BROKER TRUTH: 446 of 447 rows carry
  journalTrust 'known_divergent', and comms/broker_truth_ledger.json is as_of
  2026-07-13 — 57 days stale — so every close in the streak sits in a window with
  no wallet-truth counterpart at all.

  NO Tier-3 action enacted or proposed. No config change. Nothing promoted,
  demoted, retired or re-parameterised — the population does not support it, and
  saying so is the finding rather than an evasion of one.

