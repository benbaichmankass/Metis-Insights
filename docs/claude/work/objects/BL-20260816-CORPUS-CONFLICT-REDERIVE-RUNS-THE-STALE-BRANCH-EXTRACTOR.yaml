  Half (1) is shipped in this PR (preserve the dispatched extractor to $RUNNER_TEMP before any git op can revert it; re-derive from that copy; pinned by two tests in tests/test_m20_sweep_workflow_inputs.py incl. a negative control on the exact pre-fix shape). Half (2) is NOT done: the cheapest repair is a re-dispatch whose extractor is current, since the underlying measurement is not lost — verdicts.json carries live_tp_reach_r per leg and m20_fleet_exit_sweep.py:2858 builds the SUMMARY reach table from it, so only the corpus HOP dropped it. This session cannot download run artifacts (no artifact-download MCP), so the repair needs a re-run rather than a local re-extract. ⚠️ BLOCKS THE PLANNED CORPUS UNION: merging the 113 branch-only rows onto main would import 52 schema-degraded rows into the canonical corpus — do the repair first, or the union records the degradation permanently. ⚠️ THE RE-DISPATCH REPAIR IS CONDITIONAL, NOT GUARANTEED — verify it, do not assume it. m20_corpus_extract.measurement_key supersedes on (kind, leg, cell, split, tp_cap_pct, regime_router, min_oos_trades_floor, fee_bps_roundtrip, min_confidence_override, declared_levers_dropped). Under the default split_mode=oos-trades the `split` is DERIVED per leg to target ~25 OOS trades from frames scp'd from the trainer, so if those frames gained candles since 2026-08-16 the derived boundary moves, the key changes, and the re-run ADDS 52 rows beside the degraded ones instead of superseding them — leaving the corpus holding two identities for one book, which is the same defect class BL-20260813-TPCAP-REQUESTED-NOT-APPLIED existed to clear. After any repair run, assert the corpus row count is UNCHANGED and the extractor reported 'superseded: 52'; if it grew, the split moved and the old rows must be removed by key rather than left to accumulate.
