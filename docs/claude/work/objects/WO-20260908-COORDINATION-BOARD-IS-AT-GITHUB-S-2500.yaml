why: >-
  Issue #6927 writes 403 and reads return a board permanently frozen at
  2026-09-07T11:28:17Z. merge-claim-audit.yml fails silently on every merge;
  scope-overlap-audit.yml reads the frozen board as input. Operator granted a
  spawn-priority exception 2026-09-08.
  ⚠️ ONE CLAIM IN THE DISPATCH BRIEF WAS MEASURED AND DOES NOT HOLD, and it
  matters because it changes what had to be built. The brief stated
  scope-overlap-audit.yml "reports 0 from a live session for every PR" and that
  this "reads as no collision". It does not: `check_scope_overlap.assess`
  already refused an empty START set as `could_not_check` with an explicit
  denominator assertion, so a fully-frozen board produced a LOUD yellow on
  every PR, not a false green. The real defect was narrower and different — the
  yellow is permanent and indistinguishable from a tooling gap, so it is the
  desensitized-alarm class this repo has a P1 rule for, and during the first 24h
  after the freeze the window still contained pre-freeze STARTs that were graded
  as if live. The fix therefore had to make the board's DEATH detectable
  (a heartbeat), not merely re-point a number.

