why: >-
  BL-20260917-THE-WORK-DECISION-SWEEP-REPORTS-ITSELF-HEALTHY-AND-ROUTED-WHILE-FAILING-TO-SEND-EVERY-CANDIDATE-ON-47-OF-47-RUNS
  (severity critical, filed by the OPS lane). The work-decision sweep recorded
  candidates 4 / failed 4 / prompted_choice 0 on 47 of 47 recoverable runs while reading as checked,
  unpaused, unheld and routed to a live poller throughout. Four operator decisions were waiting; zero had
  been asked; every surface said the channel was fine.
  WHY THIS ONE AND NOT ANOTHER: CLAUDE.md's own design note for this channel says a decision channel with a
  question in it and no round-trip behind it is WORSE than no channel -- the operator answers nothing, the
  question reads in_transit for ever, and it LOOKS dealt with. Here it is worse still: nothing was even
  being asked and the receipt reported success. That is the unprovenanced-diagnostic class landing on the
  one channel the operator uses to make decisions.
  ⚠️ THE CAUSE WAS NOT KNOWN AT SPAWN AND IS NOW MEASURED: Telegram caps sendMessage's text at 4096
  CHARACTERS and render_decision_prompt had NO length budget anywhere -- it joined question + context +
  every option label and implication. send_telegram_direct RAISES on a non-2xx, the sweep caught that into a
  bare `failed += 1`, and the error string went only to the systemd journal, whose retention this repo has
  itself measured at ~30 minutes.
  THE PARTITION, over the COMPLETE population of 33 decision requests in docs/claude/work/objects/*.yaml,
  cross-checked against the live marker file (/api/diag/log_file?name=work_decision_prompted, 20 markers):
  0 of 5 over-cap requests had EVER been delivered, against 20 of 20 delivered markers all under the cap.
  Unanswered AND over cap = 4, which is EXACTLY the receipt's candidates 4 / failed 4. The 4 unanswered
  UNDER the cap all carry markers, so prompted_choice 0 is CORRECT for them.
  POSITIVE CONTROL, and it is in situ on the receipt itself: the largest prompt ever delivered is 3815
  chars, and the 47th run reads candidates 5 / failed 4 / prompted_choice 1 -- a 3815-char newcomer went out
  cleanly on the very same run the four over-cap ones failed.
  THE FOUR UNDELIVERED: DEC-20260917-SCALP-MARGIN-BOUND-SIZING (5463 chars),
  DEC-20260913-FOUR-LEG-DISPOSITION (4738), DEC-20260917-NETTING-ATTRIBUTION-EVIDENCE-IS-DROPPABLE (4569),
  DEC-20260912-LOUD-FLAG-TRIAGE (4184).
  ⚠️ THE SECOND FINDING IS THE MORE GENERAL ONE: the sweep wrote a durable receipt on every run and NOTHING
  READ IT. Detection was never the missing half -- the receipt had the numbers all along. The reader is what
  was absent, which is why this unit ships one rather than only a better field.
  ⚠️ NOT THIS UNIT: MI-254, the Workflow page's decisions inbox grading on `answer` alone so an ANSWERED
  decision reads unanswered. One is the SEND failing, the other the READ mis-grading, and fixing either
  alone leaves the round-trip broken. Separately owned; deliberately not folded in.
done_condition: >-
  BOTH, and they are different facts -- say WHICH was cleared.
  (1) THE CAUSE IS NAMED ON THE RECEIPT: a later reader can tell a Telegram refusal from a render fault from
  a network blip without the systemd journal, and a run where every candidate FAILED is distinguishable on
  the receipt itself from a run where there was NOTHING TO SEND. Those are opposite facts and rendered the
  same.
  (2) OBSERVED DELIVERED: a sweep receipt carries prompted_choice >= 1 (or prompted_choice_shortened >= 1)
  for one of the four, AND the operator confirms a decision prompt arrived.
  !! (1) WITHOUT (2) IS NOT ENOUGH -- naming the cause is diagnosis, not repair, and this unit also fixes
  the render, so (2) is reachable rather than aspirational.
  !! A QUIET RECEIPT CLEARS NOTHING: candidates 0 is the EMPTY-DENOMINATOR state and says nothing about
  whether a send would have worked. Read candidates BEFORE reading any zero in failed.
  !! AND A GREEN TEST SUITE CLEARS NOTHING. 193 tests pass and 7 planted defects are each caught, and a
  harness cannot reach a Telegram chat -- which is the whole of what was failing.
