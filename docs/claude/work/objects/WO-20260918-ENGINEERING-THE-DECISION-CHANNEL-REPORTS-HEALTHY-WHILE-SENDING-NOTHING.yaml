why: >-
  OPERATOR-DIRECTED 2026-09-17 (overnight): 'for engineering, I'm sure we can also find continuous amounts of
  work of structural things that need to be fixed, code that isn't working.' This is the strongest instance currently
  measured, and it is code that is not working while every surface says it is. MEASURED by the ops lane 2026-09-17
  (filed as BL-20260917-THE-WORK-DECISION-SWEEP-REPORTS-ITSELF-HEALTHY-AND-ROUTED-WHILE-FAILING-TO-SEND-EVERY-CANDIDATE-ON-47-OF-47-RUNS,
  severity CRITICAL): the work-decision sweep records `candidates: 4 / failed: 4 / prompted_choice: 0` on **47
  of 47 runs**, while reading as checked, unpaused, unheld and ROUTED TO A LIVE POLLER throughout. [!] WHY THIS
  IS THE ONE TO TAKE: CLAUDE.md's own design note says a decision channel with a question in it and no round-trip
  behind it is WORSE than no channel -- the operator answers nothing, the question reads in_transit forever, and
  it LOOKS dealt with. Here it is worse still: nothing is even being asked, and the receipt says everything is
  fine. That is the unprovenanced-diagnostic class landing on the one channel the operator uses to make decisions,
  and OI-20260901-DECISION-ROUNDTRIP-SHIPPED-AND-NO-DECISION-HAS-EVER-MADE-THE-ROUND-TRIP has been open on it
  since 2026-09-01. [!] AND IT COMPOSES WITH A SECOND, SEPARATE DEFECT ALREADY FILED: MI-254, the Workflow page's
  decisions inbox grades on `answer` alone so an ANSWERED decision reads UNANSWERED. Do not fold them together
  -- one is the SEND failing, the other is the READ mis-grading, and fixing either alone leaves the round-trip
  broken.
    === THE LANE'S MEASURED FINDINGS, APPENDED 2026-09-18 by session_01CQ91T43zDR3AKC7y1PPxvY. The manager's
    dispatch text above is PRESERVED VERBATIM and is not restated. ===
    THE CAUSE, which the dispatch correctly left open: Telegram caps sendMessage's `text` at 4096 CHARACTERS
    and render_decision_prompt had NO length budget anywhere -- it joined question + context + every option
    label and implication. send_telegram_direct RAISES on a non-2xx, the sweep caught that into a bare
    `failed += 1`, and the error string went only to the systemd journal, whose ~30-minute retention the
    dispatch itself names.
    THE PARTITION, over the COMPLETE population of 33 decision requests in docs/claude/work/objects/*.yaml
    cross-checked against the live marker file (20 markers): 0 of 5 over-cap requests had EVER been delivered,
    against 20 of 20 delivered markers all UNDER the cap. Unanswered AND over cap = 4 -- exactly the
    candidates 4 / failed 4 the dispatch quotes. The 4 unanswered UNDER the cap all carry markers, so
    prompted_choice 0 was CORRECT for them.
    TWO POSITIVE CONTROLS: the largest prompt ever delivered is 3815 chars; and in situ on the receipt, the
    47th run reads candidates 5 / failed 4 / prompted_choice 1 -- a 3815-char newcomer went out cleanly on the
    very same run the four over-cap ones failed. (So it is 46 of 47, not 47 of 47 -- a correction to the filed
    row's headline, and the 47th run is the control that makes the diagnosis discriminating rather than
    merely consistent.)
    THE FOUR UNDELIVERED: DEC-20260917-SCALP-MARGIN-BOUND-SIZING (5463 chars),
    DEC-20260913-FOUR-LEG-DISPOSITION (4738), DEC-20260917-NETTING-ATTRIBUTION-EVIDENCE-IS-DROPPABLE (4569),
    DEC-20260912-LOUD-FLAG-TRIAGE (4184).
    [!] IT WAS CODE, NOT CONFIGURATION, so the dispatch's escape hatch did not apply: the token resolved, the
    bot was polled, the write gate was open and the route was `claude` on all 47 rows.
    [!] THE SECOND FINDING IS THE MORE GENERAL ONE AND THE DISPATCH DID NOT ASK FOR IT: the sweep wrote a
    durable receipt on EVERY run and NOTHING READ IT. Detection was never the missing half -- the receipt had
    the numbers all along -- so the unit ships a READER (src/runtime/decision_channel_alert.py) and not only a
    better field.
    DELIVERED IN PR #12490 (Tier-2, landing: hold): the render bounded as a POST-CONDITION for every input;
    `failure_kinds` + a redacted bounded `failure_detail`; and `sweep_outcome` registered with
    collapsed-state-guard as telegram_decisions.sweep_outcome over six never-collapsed states, which is the
    dispatch's 'must stop reporting healthy' clause satisfied.
    [!] THIS FILE WAS WRITTEN TWICE, INDEPENDENTLY, AND THAT IS ITSELF THE FINDING -- recorded here rather
    than silently resolved. The dispatch told the lane to read this object FIRST. It was ABSENT from
    origin/main and absent from the lane's clone (measured both ways), so the lane created it. It in fact
    existed on the MANAGER'S OWN UNMERGED BRANCH (claude/wonderful-bardeen-ofg7um, PR #12476), which no lane
    can see. Predicted with `git merge-tree --write-tree`: the two versions collide add/add.
    THIS VERSION IS THE RECONCILIATION and is a SUPERSET: the manager's `title`, `why`, `done_condition`,
    `source`, `explicitly_not_in_scope` and `blocked_on_basis` are carried VERBATIM, with the lane's measured
    findings appended under their own heading. Whichever PR lands second, the resolution is to take THIS file,
    because it contains both. Nothing of the dispatcher's wording is dropped -- the repo's own rule is that a
    row recording a verdict without its condition reads as complete and is worse than a missing row.
    [!] AND IT IS A CLASS, NOT A SLIP: the MI-301 research lane hit the identical thing the same night
    (its PR #12491 records creating WO-20260918-RESEARCH-ATTRIBUTE-THE-2026-08-30-BREAK-E35-OR-MARKET after
    finding it absent from main and from its clone). Two lanes, one night, same mechanism. Filed as
    BL-20260918-A-LANE-IS-DISPATCHED-AGAINST-A-WORK-OBJECT-THAT-EXISTS-ONLY-ON-THE-MANAGERS-UNMERGED-BRANCH-SO-EVERY-LANE-CORRECTLY-MEASURES-IT-ABSENT-AND-CREATES-A-DUPLICATE.
