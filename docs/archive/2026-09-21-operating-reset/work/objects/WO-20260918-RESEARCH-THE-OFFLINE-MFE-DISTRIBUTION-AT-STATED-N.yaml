  THE DISTRIBUTION EXISTS AT STATED n: 112-1,004 per leg on 19 legs, Binance Vision USDs-M candles
  2021-01-01 -> 2026-09-16, against the live n=1-8 MI-148 correctly refused to set a number from.
  Population stated in full on the PR: 19 ok + 25 no_data + 8 not_capped_capable + 3 no_harness = 55.
  [!] THE ANSWER IS THAT NO PER-LEG tp_r IS PROPOSED, AND THAT IS THE FINDING, NOT A FAILURE TO DELIVER.
  TP_VENUE_CAP_PCT = 0.099 -- one fleet-wide constant named for a Bybit boundary -- ALREADY IS the per-leg
  take-profit: in each leg's own R it spans 1.74R to 7.20R (a 4.1x spread nobody chose), it ends 5.1%-44.2%
  of trades depending on the leg, and on all 6 legs that declare a real tp_r it overrides the declaration on
  70-97% of trades. Above it a declared tp_r is inert -- on 13 of 19 legs the effective reach at 4R and at
  10R differ by under 1pp, so tp_r: 4 and tp_r: 50 produce the same book.
  [!] IT WAS VALIDATED AGAINST A POSITIVE CONTROL IT COULD HAVE FAILED: evaluated at each leg's declared
  tp_r, P(mfe_r >= min(cap_r, x)) must predict the OBSERVED take_profit exit share of the capped run --
  19 of 19 legs agree within 3.2pp (mean -0.3pp, median +0.1pp).
  [!] GATE CONDITION 1 IS CORRECTED, NOT CLEARED, and must not be reported as cleared: 44 of 44 legs still
  grade insufficient_n. What moved is the reference -- exit_location_fidelity.py went from 3 hand-transcribed
  legs to 18 measured ones, taking 13 legs from `no_backtest_corpus_for_leg AND live_n_below_abstain_floor`
  to the floor alone. The remaining work is a SOAK, not a build.
  [!] WHAT THIS DOES NOT DISCHARGE: the per-leg target geometry is TIER-3 and is the OPERATOR'S decision --
  OI-20260906-THE-BRACKET-CALIBRATION-INSTRUMENT-EXISTS-AND-ITS-VERDICT-HAS-NOT-BEEN-ACTED-ON clause (2) is
