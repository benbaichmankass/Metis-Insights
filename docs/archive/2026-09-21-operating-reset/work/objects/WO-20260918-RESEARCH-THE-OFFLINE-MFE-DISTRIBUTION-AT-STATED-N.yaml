done_condition: >-
  A per-leg MFE distribution IN R from the offline harness, with n stated PER LEG, and a per-leg take-profit
  PROPOSAL derived from it that the operator can act on. Say which legs have enough n to carry a number and
  which do not -- naming the ones that do NOT is as much of the deliverable as the ones that do.
  [!] STATE THE POPULATION on every figure and report the provenance mix through src/runtime/provenance.py --
  never a bespoke predicate. A backtest population has its own hazards (look-ahead, the crypto-only candle
  source that returned 0 candles for GLD/MGC/QQQ/SLV/SPY/TLT/USO in #12205); name them rather than letting a
  bigger n read as a better answer.
  [!] AND THE KNOWN DISAGREEMENT IS PART OF THE JOB, NOT A SURPRISE TO DISCOVER: the backtest and live
  populations disagree by a measured ~2.5x about crypto p90 MFE. That gap is gate condition 1
  (backtest-live exit-location fidelity) and it is SEPARATE and UNMET -- see
  BL-20260906-THE-EARNED-TRUST-LINCHPIN-HAS-NEVER-BEEN-RUN-AND-GRADES-THE-WRONG-QUANTITY-FOR-EXIT-LOCATION.
  A proposal that does not say where it sits against that gap is not actionable.
  [!] PROPOSE ONLY -- per-leg target geometry is TIER-3 and the operator's. Do not change config.
  [!] AND IF THE OFFLINE HARNESS CANNOT PRODUCE USABLE n EITHER, that is a legitimate close and a harder fact
  than a number: record it with its denominator, because it would mean the per-leg proposal has no basis
  anywhere and the sentinel idiom stands by default rather than by choice.
