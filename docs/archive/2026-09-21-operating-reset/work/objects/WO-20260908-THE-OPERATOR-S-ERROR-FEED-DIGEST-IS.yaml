done_condition: >-
  The generator emits the header R3 requires, a test pins it by MUTATION (removing the header makes the test fail), and a regenerated digest PR is OBSERVED going green and landing. Fix the GENERATOR, never the guard — weakening R3 would trade a frozen digest for an unregistered one.

why: >-
  scripts/ops/error_feed_digest.py writes docs/claude/ERROR-FEED-DIGEST.md WITHOUT the doc-status header that check_document_index.py R3 requires. main's committed copy HAS the header; every regenerated copy does not. So every digest PR the workflow opens is RED on a required check while the WORKFLOW ITSELF REPORTS SUCCESS — the digest is frozen and nothing says so. Filed as BL-20260908-ERROR-FEED-DIGEST-GENERATOR-STRIPS-THE-DOC-STATUS-HEADER-SO-EVERY-DIGEST-PR-IS-RED.

