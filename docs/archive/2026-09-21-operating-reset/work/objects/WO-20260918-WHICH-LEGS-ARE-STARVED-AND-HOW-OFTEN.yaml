decision_requests:
  - id: DEC-20260918-UNSTARVE-THE-PROP-LEGS-OR-RECORD-THAT-WE-WILL-NOT
    asked_by: session_01Ex5Dx1TMYy46ncsp8eptpx
    question: >-
      Starvation is four legs on one account: breakout_1, holding two execution:live prop
      legs (trend_donchian_eth_prop, trend_donchian_sol_prop) that are also the only two
      live legs in the fleet producing order packages and zero fills. Each loses to its
      own non-prop twin on the same symbol. Which?
    options:
      - key: allowlist_breakout_1
        label: >-
          [Tier-2] Add breakout_1 to ARBITRATION_FANOUT_ACCOUNTS. Aimed exactly at the
          measured condition. MI-282's objection -- that this would be inert and harmful
          -- is DISCHARGED: it rested on the apply_rounds projection defect, which is
          repaired and observed dispatching. NOT a proven remedy: the fan-out has only
          ever dispatched on bybit_1 and only ever the global winner, and a prop dispatch
          is a Telegram ticket rather than an order, so this newly exercises a path that
          has never run. Expect the prop sequence in OI-20260911 to bind next, not a trade.
      - key: reroster_the_prop_legs
        label: >-
          [Tier-3] Re-roster so the prop legs are not entry-clones of bybit_1 legs. Three
          of the four starved candidates lose to their own non-prop twin, so the roster is
          what creates the contest. OI-20260911's clears_when already names this as a
          legitimate decision that must be recorded as one.
      - key: accept_and_record
        label: >-
          [no change] Accept it. Four legs, two of them live, on an account whose own
          unblock is an unfinished sequence. Legitimate -- and it must be RECORDED as a
          decision, because a measurement that is taken and then sits is the failure mode
          this row exists inside.
      - key: measure_the_silent_nine_first
        label: >-
          Neither yet. Nine execution:live legs produced ZERO order packages in the window
          and are silent rather than starved -- a different question with a different
          answer, deliberately out of MI-29's scope. Route that first if the fleet's
          never-traded legs are the real concern.
    answer:
      answered_by: operator
      answered_on: '2026-09-19'
      channel: chat pop-up to the manager session (AskUserQuestion), recorded here
      chosen: allowlist_breakout_1
      free_text: >-
        2026-09-19: the operator chose `allowlist_breakout_1` from a chat pop-up that carried
        the option's own [Tier-2] label and its caveats verbatim. THIS IS THE TIER-2 OPERATOR OK
        for adding breakout_1 to ARBITRATION_FANOUT_ACCOUNTS.
        [!] THE ANSWER IS RECORDED; THE ACTION IS NOT TAKEN. The env change plus a trader restart
        is a separate Tier-2 system-action, and it is NOT done by recording this. Read the arm
        back off /proc/<MainPID>/environ via get-env, never from the .env, which says only what
        the NEXT restart picks up.
        [!] AND DO NOT READ A DISPATCH AS A TRADE. The option's own text says the fan-out has only
        ever dispatched on bybit_1 and only ever the global winner, and that a prop dispatch is a
        Telegram ticket rather than an order -- so the expected next binding constraint is the
        prop sequence in OI-20260911, not a fill. An allowlisted routing row is NOT the clause-(2)
        evidence that row wants; an emitted prop_tickets row traced to a fan-out round is.
