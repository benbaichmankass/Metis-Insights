title: >-
  Research lane: measure which legs are starved, how often, and whether the per-account
  arbitration fan-out already covers them
stage: EVIDENCE
lifecycle: waiting
owner: session_01Ex5Dx1TMYy46ncsp8eptpx
opened_at: 2026-09-18
why: >-
  MI-29, unblocked by DEC-20260910-MI-29-MEASURE-THE-STARVED-LEGS-FIRST (operator, via
  popup, chosen 'Route it -- measure which legs, how often, and bring the options back').
  MI-29 had been blocked on the operator since 2026-09-01. The decision's own stated
