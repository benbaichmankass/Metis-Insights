adjudicated_2026_09_06: >-
  BOOKKEEPING CORRECTION by the manager, not a verdict on the work. lifecycle read `in_flight`,
  which asserts the object is being actively worked. A LIVE list_sessions read on 2026-09-06
  (population: 180 sessions enumerated back to 2026-08-02) found EXACTLY ONE session RUNNING and
  it was the manager itself, so no worker existed for this object. Moved in_flight -> ready.
  ⚠️ `ready` claims only that the object is AVAILABLE TO PICK UP. It is NOT a claim that the work
