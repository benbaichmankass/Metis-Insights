blocked_on:
  - kind: pr
    ref: "11140"
    since: 2026-09-06
  - kind: backlog_row
    ref: BL-20260906-EXIT-HEAD-GUARD-DROPS-THE-FAMILY-CHECK-ITS-SIBLING-ENTRY-HEAD-GUARD-MAKES
    since: 2026-09-06
blocked_on_basis: >-
  RE-ASSESSED 2026-09-06 by MI-154, and this REPLACES an earlier ASSESSED basis that
  said the opposite. That basis read: "The empty list is a real finding here, not an
  unlooked-at default: NOTHING blocks this object ... needs no decision that has not
  been made ... and no upstream work that is not already merged." It is quoted rather
  than deleted because the correction matters more than the tidiness: it was written
  in good faith on the brief's premise that #11140 had shipped, and it is REFUTED by
  measurement — #11140 is open and unmerged, and it is exactly the upstream work the
  basis says is already merged. A false NON-blocker is the more dangerous direction of
  this repo's own "a false blocker is worse than a missing one" rule, because the
  constraint computation reads the object as ready and a session picks it up expecting
  to be able to finish it.
  THE TWO EDGES ARE TRUE AND EACH WAS MEASURED, not inferred.
  (1) PR #11140 — read from the API: state open, merged false, tier 3, landing hold.
  Without it there is no call site a scalp artifact could be read by, so the artifact
  half cannot be OBSERVED at all, which is what the done_condition requires.
  (2) The family gate — maybe_score_exit_head gates on tf (exit_head_shadow.py:350) and
  symbols (353) and never reads `family`, while the sibling entry-head guard gates on
  family FIRST (entry_head_pwin.py:165) over an artifact from a near-identical exporter.
  Publishing a family=ict_scalp artifact into that directory is safe ONLY while no
  donchian-monitor leg shares its tf — true today (0 of 23 on 5m/15m) but a property of
  the CONFIG, not of the code, and exit-head-donchian-1h-v1 is stage=advisory, i.e. a
  live-money path. Building the artifact before the gate is the one ordering that
  converts a latent hazard into a live one for zero observable benefit.
  ⚠️ IT IS STILL NOT BLOCKED ON WO-20260906-TWO-RECORDS-DISAGREE-ON-EVERY-ICT-SCALP —
  the earlier basis was right about that, and the point stands: that object gates
  ARMING (which legs the consumer may act on) and says nothing about whether an
  artifact can exist. These two edges are different, and neither is a records question.

