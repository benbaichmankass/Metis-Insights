review_trigger: >-
  Re-read when PR #11140 (or any successor that puts an exit-head consumer in the
  ict_scalp unit) MERGES. Until then the artifact half cannot be observed doing
  anything, and building it early adds a latent hazard for no observable benefit.

done_condition: >-
  A 5m and/or 15m scalp-family exit-head artifact is TRAINED, EXPORTED and PUBLISHED,
  AND the in-distribution guard is OBSERVED admitting at least one real ict_scalp leg
  (a `decision_state` other than `not_scored` on a live or soak row). A green unit
  test is NOT this observation.
  ⚠️ TWO CLAUSES OF THE ORIGINAL WORDING ARE CORRECTED BY MEASUREMENT — the
  correction is recorded rather than the wording silently swapped.
  (1) It said the artifact should be published "such that /api/diag/shadow_stats lists
  it". THAT ROUTE CANNOT LIST IT. `/api/diag/shadow_stats` delegates to
  `src/web/api/routers/shadow.py::stats`, which aggregates `shadow_predictions.jsonl`
  via `iter_records(log)` — it enumerates models that have SCORED, not artifacts that
  exist. An artifact with no call site produces no rows and never appears there. If it
  DOES appear, that IS the observation.
  (2) It said a scalp artifact in-distribution on tf and symbols "would today be
  accepted by a donchian-family consumer". Measured, it would not: no leg reaching the
  exit-head hook is on 5m or 15m, so the tf guard excludes it first. The family gap is
  REAL but LATENT — see `blocked_on` and the backlog row.
  ⚠️ `decision_state` EXISTS NOWHERE on main or on the live VM; it is introduced by
  #11140. Do not write a done-condition against a field the deployed code lacks.

why: >-
  Operator decision 2026-09-06 chose 'Arm + queue the artifact', making this its own
  lane rather than a follow-up, precisely because arming without it is inert. The
  manager measured, with a positive control against /api/diag/shadow_stats: 32 models
  visible; the only exit-head artifacts are exit-head-donchian-1h-v1 and
  exit-head-donchian-peak-1h-v1, both 1h and both donchian, while all 8 ict_scalp legs
  are 5m/15m. ⚠️ THAT READING IS CORRECT AND WAS REPRODUCED INDEPENDENTLY (MI-154,
  2026-09-06): same 32-model population, same two artifacts, and the trainer mirror
  itself holds exactly those two files, both declaring family=donchian tf=1h.
  WHAT CHANGED IS THE ORDERING, NOT THE FINDING. The lane was briefed on the premise
  that #11140 had SHIPPED the ict_scalp consumer. It has not: #11140 is OPEN and
  UNMERGED (state open, merged false, tier 3, landing hold), and
  ICT_SCALP_EXIT_HEAD_MODE and exit_head_apply each appear in 0 files at main
  957fc81d — positive control, EXIT_LOOP_DECOUPLE_DISABLED appears in 18. Resolving
  src.runtime.pipeline.monitor_unit_for over the FULL population of 55 strategies in
  config/strategies.yaml: 23 legs reach maybe_score_exit_head (sole call site
  trend_donchian.py:802) and ALL are 1h/4h/1d — on 5m/15m, NONE; all 8 ict_scalp legs
  resolve to unit ict_scalp, which has no exit-head call site. So a published scalp
  artifact would have no reader.

