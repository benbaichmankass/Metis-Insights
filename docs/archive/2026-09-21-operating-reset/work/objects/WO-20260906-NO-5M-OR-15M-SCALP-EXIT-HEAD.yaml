id: WO-20260906-NO-5M-OR-15M-SCALP-EXIT-HEAD
type: question
parent_intent: IN-20260903-TRADING-SYSTEM-HEALTH
title: >-
  No 5m or 15m scalp exit-head artifact exists — and the CONSUMER is missing too,
  so the artifact is the SECOND half, not the first
stage: OBSERVATION
lifecycle: waiting
owner: session_01S7pASy78QiNViwhSadGdNb
