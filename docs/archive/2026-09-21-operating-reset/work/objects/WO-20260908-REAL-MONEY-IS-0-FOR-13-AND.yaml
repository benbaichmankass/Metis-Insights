done_condition: 'A written attribution of the 15 real-money closes that separates THREE things currently
  pooled: (a) closes where the strategy''s own exit fired and the trade genuinely lost; (b) closes where
  the reconciler or an ''other'' path booked the row, so the exit reason misdescribes WHY it closed; and
  (c) rows whose pnl is null or ''estimated'' and therefore cannot carry a verdict at all. For each of
  the 9 non-''sl'' closes, name the actual mechanism that closed it, read from the journal and the venue
  rather than from exit_reason - which describes HOW a row closed and is known to misdescribe WHY (the
  trade-4904 precedent in OI-20260830-E35-GEOMETRY-SHIPPED-TO-9-LEGS-NOT-YET-LIVE-VERIFIED, where a row
  reading ''reconciler_filled'' was in fact an operator flatten). THEN, and only on the (a) subset, state
  whether the remaining 4 legs show a real edge failure or an n too small to grade. [!] ''insufficient_n''
  IS A LEGITIMATE AND LIKELY VERDICT and must be reported as the finding rather than avoided - do NOT
  widen the window until something becomes gradeable, which is the low-n hazard MIN_CLOSED_FOR_ACTION
  exists to prevent. [!] NOT SUFFICIENT: a per-leg PnL table (that is the input, not the answer), or a
  promote/demote proposal computed off a population not yet shown to be clean. [!] NO Tier-3 action is
  enacted from this object - retiring or demoting a leg is PROPOSED only.'
