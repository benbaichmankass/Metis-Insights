  result is that the premise was measured on the wrong population. ⚠️ TWO OF ITS FIGURES ARE SUPERSEDED
  AND MUST NOT BE RE-QUOTED. (1) ''n=15, all bybit_2 ... 0 wins, 13 losses'' is the real-money subset
  of a PAPER-INCLUSIVE page — a 5-day slice. include_paper defaults to False, so the default response
  is ALREADY real-money-only and the flag NARROWS the count; paged to exhaustion the population is n=447
  over 2026-05-09..2026-09-04 and the book is 117 W / 258 L / 49 flat. (2) ''NINE OF FIFTEEN CLOSES WERE
  NOT A STRATEGY EXIT DECISION'' is numerically right for that window (9/6) but its REASONING — that closeReason
  ''other'' means ''not a strategy exit'' — is wrong in general: over the 447 rows `other` holds 182 rows
  that ARE strategy exits, and the two published surfaces disagree on 174 of 447 (38.9%). It coincided
