closed_observation: >-
  DONE 2026-09-18, clause (1) MET and clause (2) met in substance. PR #12517 merged as b71ec810a,
  VERIFIED on origin/main. The lane answered the question I dispatched rather than the one I assumed, and the
  answer is BOTH halves at once: MI-270's NAMED defect (session-brief-guard failing its own output) was NOT
  live -- but the workflow kept failing through run #15 anyway, via a DIFFERENT guard,
  artifact-validity-guard / check_backlog_refs.py. So "is MI-270 live" had no clean yes/no and the honest
  answer was to trace what was ACTUALLY failing.
  THE REAL DEFECT, and it is a good one: render_due_list.py::_clip cuts a due-list title BEFORE a filed
  BL-/MB-/FU- tracking id rather than into it, and #12378 had fixed exactly that -- but
  constraint_readout.py::_one_line carried its OWN narrower second clip (140/180 chars) and applied it ON TOP
  of the already-id-safe 200-char title, so a title that survived the first clip could be cut a second time
  INSIDE the same id, manufacturing a dangling reference to a row that does exist. Measured live rather than
  reasoned: PR #12331's diff carried a 16-char fragment of a real filed row -- the literal text is NOT
  reproduced here, because quoting a truncated id verbatim makes artifact-validity read the QUOTATION
  as a broken reference (it did, on this very branch). The row it fragments is the bybit_2 settle-coin
  one whose full id ends ...-A-REAL-MONEY-HEDGE-BOOK-IS-NEVER-FETCHED-AND-SITS-NAKED.
  Fixed by DELEGATING to the one _clip through the module's existing _due_lib() importer instead of keeping a
  diverging second copy -- the right shape, since the bug WAS the second copy. Self-test gains a positive
  control reproducing the live fragment; 11 new pytest cases cover the two-clip composition, the
  whole-id-overrun branch, and a scan for any other bare slice in the module.
  ⚠️ IT ALSO CAUGHT ITSELF: its own new docstrings tripped check_backlog_refs with the same class it was
  fixing (a real id line-wrapped, plus two literal truncated fragments in scripts/, which that guard scans and
  tests/ it does not). Fixed in a follow-up commit rather than excused.
  CLAUSE (2), stated honestly rather than stretched: the further Tier-1 structural work IS this fix plus the
  completed mechanism trace on BL-20260911 (whose earlier close admitted it had not traced which commit fixed
  the failure) and the MI-270 checklist row closed with that trace. The lane then STOPPED at a clean
  checkpoint rather than opening an unrelated investigation at 630k/1M context -- the right judgement, and I
  am recording it as such rather than as an unmet clause.
  COST: $23.25 on a FRESH Sonnet lane.
