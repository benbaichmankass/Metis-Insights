id: BL-20260912-THE-SWEEP-CORPUS-RECORDS-NO-DISPATCHED-SHA-SO-A-MISSING-FIELD-CANNOT-BE-TOLD-FROM-ONE-THE-EXTRACTOR-COULD-NOT-EMIT
type: question
parent_intent: null
title: |-
  Stamp the dispatched sha and Actions run id on every sweep-corpus row, so a missing field can be told from one the extractor could not emit
stage: INTEGRITY
lifecycle: dormant
owner: null
opened_at: null
