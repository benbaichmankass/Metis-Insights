decision_requests:
  - id: DEC-20260902-LOCAL-LLM-WEIGHT
    question: >-
      Both size arms of the local LLM are now benchmarked on answer quality against the
      same real repo question. Which one (if any) should carry weight?
    urgency: routine
    asked_on: '2026-09-02'
    context: >-
      1.5B (measured 2026-08-31 on the trainer, `RESULT: benchmarked`, controls passing):
      throughput pp128 22.35, tg64 7.19 t/s, 36.4s wall, 2.86 GB peak RSS on a 5.9 GB
      box. THE QUALITY WAS THE FINDING, NOT THE SPEED — it restated the prompt,
      FABRICATED a causal claim (joining two unrelated facts with an invented
      "indicating"), and MISATTRIBUTED the fault to venue liquidity when the defect was
      our own sizer reading an empty account-level field. On a system whose canonical
      rule is always-verify, a model that confidently invents a cause is worse than no
      model. 3B (Qwen2.5-3B-Instruct Q4_K_M, `RESULT: benchmarked`, both controls
      passing): better on BOTH of those specific defects — it hedges instead of
      inventing, and keeps the fault on the internal side — but never names the
      mechanism, at ~2.1x the latency and ~0.96 GB of headroom. ⚠️ ONE CORRECTION THE
      ROW CARRIES: the truncation both models show is OURS (`-n 200`), not evidence
      about either model. ⚠️ AND A THROUGHPUT COMPARISON DOES NOT ANSWER THIS — the row
      says so in terms, after a session produced one.
    options:
      - key: adopt_3b
        label: Adopt the 3B (Qwen2.5-3B-Instruct Q4_K_M)
        implication: >-
          Better on the two defects that actually disqualified the 1.5B (invention and
          misattribution), at ~2.1x latency and ~0.96 GB of headroom left on a 5.9 GB
          box. It still never names the mechanism, so it is an improvement in
          truthfulness rather than in usefulness.
      - key: keep_1_5b
        label: Keep the 1.5B
        implication: >-
          Twice as fast with real headroom — but it is the arm measured FABRICATING a
          causal claim and misattributing a fault. Choosing it means accepting that
          output on a system whose first rule is always-verify.
      - key: carries_no_weight
        label: The local LLM carries no weight — shelve the path
        implication: >-
          Records the honest reading of both arms: neither named the mechanism, so
          neither answered the question that was asked. Stops further trainer-VM time
          going into it. This is an ANSWER, not a failure to keep benchmarking.
