blocked_on_basis_note: >-
  MOVED in_flight -> waiting 2026-09-11. Merged as #11787 (f8eaa683d), the lane is idle, and the surface is OBSERVABLY rendering in the CLAUDE.md session brief over a seeded backlog of 69 rows. That is clause (1). Clause (2) is an OBSERVATION nobody can schedule: the mechanism catching a REAL newly-unrouted row before the operator asks. `waiting` is the honest lifecycle -- not `done`, which would claim an observation nobody has made, and not in_flight, which would claim someone is working on it when what is left is elapsed time and a real event.

  It is deliberately NOT blocked on MI-237 (the checklist schema migration).
  The migration would give a `state_since` field a tidy home, but the missing
  thing is an ELAPSED-TIME TERM and a SURFACE, and neither depends on the
  schema landing first. Nor is it blocked on MI-235 or MI-236: those cover
  different members of the same family and this one can be measured, built and
  surfaced independently of both.

  ⚠️ The checklist row for MI-246 carried this same assessment before the object
  existed; it is restated here so the object is not read as unassessed merely
  because it was captured later.

