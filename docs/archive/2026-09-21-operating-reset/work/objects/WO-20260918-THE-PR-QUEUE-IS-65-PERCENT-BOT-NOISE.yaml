manager_correction_2026_09_18T0508Z: >-
  ⚠️ THE `why` ABOVE UNDERSTATES THE POPULATION BY 4x AND THE ERROR IS THE MANAGER'S, NOT THE LANE'S.
  I wrote "all 20 open PRs ... THIRTEEN carry automation/reconcile-open-prs-*" and called that a stated
  population. It was PAGE ONE of a paginated result: I called list_pull_requests with perPage=20, took
  what came back as the total, and never checked for a second page. RE-MEASURED 2026-09-18T05:08Z with
  perPage=100: EIGHTY-TWO open PRs, of which SIXTY-FIVE are automation (79.3%) -- error-feed-digest 23,
  reconcile-open-prs 14, replay-pregate 6, constraint-readout 5, probes 5, data-commit 4, work-digest 3,
  session-reaper 2, econ-calendar 1, valuation-snapshots 1, strategy-reviews 1 -- against 17 real
  `claude/*` branches. That is the UNSTATED-DENOMINATOR failure (diagnostic-provenance sub-class C: a
  truncated result reading as a clean total), committed in the `why` of a work object about measurement
  hygiene, on the one rule this repo promoted to top level. Recorded rather than quietly edited.
  ⚠️ AND THE LANE FOUND A ROOT CAUSE I DID NOT DISPATCH IT FOR, WHICH SUPERSEDES MY FRAMING OF THE UNIT.
  MI-313 / PR #12509 (585393a33, merged): `open_pr_record.py --strict` grades
  docs/claude/work/OPEN-PRS.json AS A WHOLE FILE on every PR, not diff-scoped. PR #12346 was closed
  unmerged on 2026-09-17 and its row was never moved out of `open_prs[]` nor given a terminal
  disposition, so `session-registry-guard` REFUSED EVERY PR IN THE REPO from 2026-09-13 onward. The
  reconcile-open-prs bots were never the disease; they are one of eleven automation families blocked
  identically by a single undispositioned row. The lane transcribed the disposition from the PR's own
  closing comment rather than inventing one, and verified the file round-trips byte-identically.
  ⚠️ SO `stale-automation-sweep.yml` MAY BE ENTIRELY INNOCENT. The object's done_condition (1) still
  stands and is still worth establishing from the RUN HISTORY -- but it must now be read as "was the
  sweep also broken", not as "the sweep is why this happened", and a finding that it works correctly is
  a legitimate and useful answer rather than a failure to find the bug.
  ⚠️ WHAT IS NOT YET ESTABLISHED: whether the 65 blocked PRs actually DRAIN now that the guard passes.
  A merged root-cause fix is not an observation of the queue recovering -- do not close this object on
  #12509 alone.
