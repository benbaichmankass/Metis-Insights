why: >-
  MEASURED 2026-09-18T04:2xZ by the manager. POPULATION: all 20 open PRs on benbaichmankass/Metis-Insights at
  that moment. THIRTEEN carry head refs matching `automation/reconcile-open-prs-*`, opened between
  2026-09-17T15:30:33Z (#12451) and 2026-09-18T01:46:15Z (#12502) -- roughly one every 40 minutes for ten
  hours, and NOT ONE has landed. The remaining 7 are the real work.
  WHY THIS IS NOT COSMETIC: running the merge queue is one of the manager's THREE BASE DUTIES, and the open-PR
  list is what the manager and `pr-queue-watch.yml` both read to run it. A queue that is 65% noise is the
  desensitised-alarm failure this repo calls its own worst mode, pointed at the very list the duty depends on.
  `pr-queue-watch.yml` exits 1 DELIBERATELY to page when open PRs sit past a threshold -- so 13 never-landing
  bot PRs also train the operator past that page.
  AND THERE IS ALREADY A MECHANISM THAT SHOULD HAVE PREVENTED IT: `.github/workflows/stale-automation-sweep.yml`
  exists and the pileup exists, so either it is not running, not matching these refs, or running and declining
  to act. Which of those three it is has NOT been established and is the first thing to measure.
done_condition: >-
  BOTH, and they are different facts -- say WHICH you established.
  (1) DIAGNOSED: it is MEASURED which of the three states `stale-automation-sweep.yml` is in (never fired /
  fired and did not match / fired and declined), read from the workflow's OWN RUN HISTORY via actions_list,
  NEVER from its cron expression -- this repo has documented schedules that are merged, enabled, correct and
  fire late, erratically, or not at all. State the population of runs examined.
  (2) DISPOSITIONED: the 13 open bot PRs are either closed, or landed, or it is RECORDED why they must stay
  open -- and whatever produces them either stops producing un-landable PRs or its output is made to land.
  A fix that closes today's 13 without addressing the producer clears (2) only if that is stated as the
  limitation rather than presented as a fix.
must_not: >-
  DO NOT merge the 13 blindly to clear the number. Each rewrites docs/claude/work/OPEN-PRS.json, a SHARED
  REGISTER -- merging them in sequence is how registers get clobbered, and `open_pr_record.py --strict` grades
  that file in CI on every PR. If any is to land, land it through the same union discipline every shared
  register gets: verify rows == unique ids, top-level keys preserved, and the file round-trips byte-identically.
  DO NOT disable `pr-queue-watch.yml` or raise its threshold to silence the page -- the page is correct; its
  INPUT is polluted. Silencing a working alarm because its input is noisy is the exact inversion this repo
  files as a P1.
  DO NOT touch the two Tier-2 PRs held for the operator (#12490, #12497) or any lane's PR.
