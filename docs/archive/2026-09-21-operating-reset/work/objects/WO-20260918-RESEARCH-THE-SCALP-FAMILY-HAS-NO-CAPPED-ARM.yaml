  MERGED AND OBSERVED 2026-09-18. PR #12515 squashed to afc2525018a939bcaf508b52241f4e183d4d2d92
  on main; CI was 5 of 5 green on head f271931ed with mergeable_state clean. Verified ON MAIN
  rather than inferred from the merge result -- `git cat-file -e origin/main:` succeeds for both
  docs/research/scalp-family-target-arms-2026-09-18.md and scripts/target_basis.py.
  THE DISPATCH PREMISE WAS REFUTED BY THE LANE AND THAT IS THE FINDING: these legs' live units
  apply NO venue clamp (tp_venue_cap.CLAMPING_FAMILIES is {donchian,pullback,fade,squeeze}),
  so the harness DEFAULT arm was already the live-comparable book and the --tp-cap-pct flag I
  asked for would have been a measured no-op on 45 of 45 trades -- a positive control comparing
  a book to itself. The arm actually missing was the target DISABLE (--no-tp), which moves max
  MFE 2.51R -> 4.85R. Successor work is WO-20260918-PER-LEG-TARGET-GEOMETRY-PROPOSAL-AT-STATED-N.
