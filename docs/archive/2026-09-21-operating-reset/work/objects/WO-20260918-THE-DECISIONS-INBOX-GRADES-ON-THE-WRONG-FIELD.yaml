  DONE 2026-09-18, and the lane REFUTED ITS OWN DISPATCH PREMISE rather than building to it, which is the
  finding. Merged as 7334920f1 (#12500). THE DISPATCH EXPECTED A Tier-2 src/ CHANGE AND AN SPA CHANGE; NEITHER
  WAS NEEDED AND NEITHER WAS MADE -- measured, not assumed: MI-254 (#11688) and MI-258 (#11752) had already
  landed both halves (the route publishes `settled` + `actionable`; Work.svelte reads `settled` three-state
  instead of re-deriving `answerState != committed`). Verified independently by the manager: `git show --stat`
  on the merge touches ZERO files under src/ and zero under the dashboard.
  WHAT THE DEFECT ACTUALLY WAS: one HAND-RECORDED answer. Population stated -- all 188 files under
  docs/claude/work/objects/, 0 parse failures, 33 gradeable decision_requests, grading committed 25 /
  answered_in_conversation 3 / not_submitted 5, confirmed against the LIVE DEPLOYED route. Of the 4 hand-path
  instances, 3 used `verdict` and 1 used keys nothing reads -- so DEC-20260912-LOUD-FLAG-TRIAGE carried
  `answered_at`, `answered_by` and the operator's verbatim words while grading `not_submitted` ("Nobody has
  answered this through any channel") four days after the operator answered it.
  DELIVERED: (a) R4 in scripts/ci/check_decision_answers.py -- a request CLAIMING an answer
  (`answered_at`/`answered_by`) while grading not_submitted now FAILS, proven against the real store BOTH ways
  (fires pre-fix, passes post-fix), not only in a harness; (b) the one data row translated into the vocabulary
  the reader owns.
  [!] THE TRANSIT CONTRACT IS INTACT AND THE MANAGER CHECKED THIS RATHER THAN TAKING THE CLAIM: the object's own
  must_not was "do NOT fix this by grading an in_transit submission as answered -- that is the forward failure
  the contract exists to refuse". `reframed_not_answered` is NON-TERMINAL, grades `engaged_not_settled` (an
  ALREADY-REGISTERED state in the work_decisions.answer_state contract), and the question STAYS OPEN in
  AWAITING_OPERATOR_STATES. Nothing is marked decided. The `in_transit` branches in work.py and
  telegram_decisions.py are untouched -- grepped on the merged tree.
  [!] TWO NEW BACKLOG ROWS were filed rather than left to be discovered, including R4's OWN blind spot (an
  answer recorded purely as prose, carrying neither answered_at nor answered_by). A guard that files its own
  gap is the behaviour this repo wants.
  NOT CLAIMED: the operator's question is still unanswered and still owed -- this made it VISIBLE as unanswered,
  which is the opposite of closing it.
