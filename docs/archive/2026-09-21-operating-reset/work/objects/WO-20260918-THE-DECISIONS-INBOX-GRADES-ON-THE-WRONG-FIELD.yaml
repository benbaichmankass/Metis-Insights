why: >-
  MI-303 found and fixed why NOTHING WAS BEING ASKED -- Telegram's 4096-char body cap, with 0 of 5 over-cap
  requests ever delivered against 20 of 20 under it. This is the other half: even once a prompt lands and the
  operator taps, the inbox can still report the question as unanswered.
  [!] THE TWO ARE DELIBERATELY SEPARATE AND MUST NOT BE MERGED -- one is the SEND failing and one is the READ
  mis-grading, and fixing either alone leaves the round-trip broken. MI-303's PR says so in terms.
  [!] AND THIS ITEM IS ALREADY STALLED, WHICH IS ITSELF THE REASON TO RE-ROUTE IT: MI-254 has read `in_flight`
  since 2026-09-10T11:25Z owned by session_01MQ2EzPomkBsM6uxJMCrJbF -- EIGHT DAYS -- and that session is long
  dead. An in_flight row with a dead owner is the shape BL-20260917-THE-WIP-CEILING-IS-FULL-AND-SIX-OF-SIX-GRADEABLE-IN-FLIGHT-OWNERS-ARE-DEAD-SESSIONS-SO-A-NEW-LANE-CANNOT-RECORD-ITSELF
  measures, and it holds a ceiling slot while nothing moves.
  [!] STANDING CONTEXT: OI-20260901-DECISION-ROUNDTRIP-SHIPPED-AND-NO-DECISION-HAS-EVER-MADE-THE-ROUND-TRIP
  has been open since 2026-09-01 and its criterion is ONE decision completing the FULL round-trip -- submitted
  from the SPA, read back as `in_transit`, then a LATER read grading it `committed` with the answer visible in
  the object YAML on main. Neither half alone clears it.
done_condition: >-
  An ANSWERED decision is graded ANSWERED by whatever the operator actually reads. Establish by MEASUREMENT
  which field the grading reads and which field a committed answer writes -- name both -- and make the reader
  agree with the writer, or say precisely why it cannot.
  [!] THE TRANSIT CONTRACT IS LOAD-BEARING AND MUST SURVIVE: `in_transit` means SUBMITTED AND NOT YET
  DECIDED, and the route returns it deliberately so a confirmation never reads as an answer. Do NOT 'fix' this
  by grading an in_transit submission as answered -- that is the forward failure the contract exists to
  refuse, and it would be worse than the bug.
  [!] THREE STATES AT MINIMUM, never two: not_submitted / in_transit / committed. If the reader cannot
  distinguish them, that is the defect restated rather than fixed, and it should be registered with
  collapsed-state-guard.
  [!] A GREEN TEST SUITE ESTABLISHES NOTHING about the deployed page -- a harness cannot render the SPA. Say
  which you established.
  [!] SPA work lives in benbaichmankass/ict-trader-dashboard; bot-side routes are Tier-2. PROPOSE the Tier-2
  half with its exact diff and `landing: hold`; do not merge it.
