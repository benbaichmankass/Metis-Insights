# SIGNAL CATALOG — every variable, signal and feature the system reads.
# Checklist row SIGNAL-CATALOG (operator ideas inbox 2026-09-30). Extends
# docs/research/signal-research-framework-DESIGN.md (which scores signal
# COMPONENTS) by recording what the components READ.
#
# GUARD: scripts/ci/check_signal_catalog.py (guard `signal-catalog-guard`).
# Its header documents the keying rule per family (F1 ml features via manifests
# + *_FEATURE_COLUMNS, F2 strategy modules via candle-column literals + runtime
# imports, F3 config-declared ids). `unguarded_surfaces` below lists what no
# declared surface exposes, honestly.
#
# HEALTH: `health.state` says whether a null-rate/staleness METRIC EXISTS for the
# input, NOT what it reads. No live value was pulled in producing this file
# (population: static code/config inventory 2026-10-08, branch off main).
# `unmeasured` is a could-not-look, never "healthy" (src/runtime/provenance.py
# UNMEASURED_MARKER). Review of unused/redundant/unmeasured signals and candidate
# additions: docs/reference/signal-catalog-review.md.
#
# MAINTENANCE: hand-edit. Adding a candle column / runtime import to a strategy
# module, a manifest feature, or a config-declared id fails CI until it has an
# entry here. file:line refs were resolved at generation time and drift with
# edits; the guard checks names, not line numbers.
catalog_version: 1
generated: '2026-10-08'
guard: scripts/ci/check_signal_catalog.py
unguarded_surfaces:
- 'hand-built live feature rows: src/units/strategies/vwap.py, ict_scalp.py, turtle_soup.py, src/runtime/advisory_sizing.py'
- entry/exit head feature lists live in VM artifact JSON (scripts/ml/train_exit_head.py FEATURES*, train_entry_head.py FEATURES*), not git
- hardcoded regime constants (src/runtime/regime/detector.py ADX cut-points)
- config/news_feeds.yaml feed URLs; scripts/macro producer names
- macro_series ids referenced inside macro_valuation inputs / macro_events events[].series
health_vocabulary:
  measured: a per-input metric is served on an API/diag route
  build_time_only: computed at dataset build (ml/datasets/audit.py zero/nan fraction -> dataset_audit.jsonl), not served live
  batch_level_only: producer-level liveness/vacuity, not per input
  unmeasured: no null-rate or staleness metric exists for this input today (provenance.UNMEASURED_MARKER = "unmeasured"; never read as healthy)
