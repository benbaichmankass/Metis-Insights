# Model-FAMILY diversity (read by `ml_plan_status.py --diversity`; frontier-research skill). `family:` on an item names the
# model family the experiment is ABOUT (taxonomy: FAMILIES in the script). `families.<f>.history` is the graded verdicts of that
# family's units, oldest first -- appended by research-ops/frontier-research Step 0 when a unit is graded.
diversity:
  max_family_share: 0.6      # > this share of open family-tagged items in one family -> CONCENTRATION
  max_fail_streak: 3         # a family whose last N graded units all FAILed and still has open items -> FAIL-STREAK
families:
  deep_sequence:  {history: [FAIL]}        # TCN, price-only, BTC 15m regime (MB-20260703-001) -- one architecture, one input class
  ssl_representation: {history: [FAIL]}    # MAE on daily macro panel -> 15m vol head (T1.2 P2)
  ts_foundation_model: {history: [INDETERMINATE]}       # frozen Chronos-Bolt-Tiny embeddings FAILED at the shipped operating point, but fc_* quantile features PASSED and are advisory; bake-off pending
  tabular_foundation_model: {history: [INDETERMINATE]}   # ML-F12 2026-10-14: tabpfn arm error (licence), tabicl arm run; closes nothing
  rl_bandit: {history: []}
  conformal_calibration: {history: [INDETERMINATE]}   # ML-F8 2026-10-14: CV clause held on all 3 symbols, holdout empty -> re-run ML-F17
  linear_logit: {history: [FAIL, FAIL, PASS, INDETERMINATE, INDETERMINATE]}   # ML-M2 FAIL, ML-M3 FAIL (thin columns), ML-F11 PASS (MES 1d non-inferiority), ML-F7 INDETERMINATE, ML-F9 INDETERMINATE; 2026-10-14
  ensemble_stack: {history: [INDETERMINATE, INDETERMINATE]}    # ML-F16 (ExtraTrees/MLP vs LightGBM, 1h shards), ML-F13 (15m shards) 2026-10-14
# Plumbing expectations (read by `ml_plan_status.py --plumbing`). A silent or constant shadow head is a
# FINDING unless it appears here with the row/PI that tracks it -- so a new silence cannot hide.
plumbing:
  max_cycle_age_hours: 36
  max_silent_hours: 6          # a logging head with no row for this long is SILENT
  max_disk_used_pct: 85
  # PENDING PR #17580 + trainer promote-stage run: 4 shadow->candidate flips => expect {advisory: 3, shadow: 21, candidate: 71, research_only: 1}; update this line in the run that OBSERVES it.
  expected_registry_stages: {advisory: 3, shadow: 21, candidate: 71, research_only: 1}   # MEASURED 2026-10-15 (api/bot/ml/status, post ML-STAGE-FLIPS: 4 shadow->candidate at 2026-10-11T21:28Z, trace on ML-STAGE-TRACE); a change must be explained by a recorded decision
  expected_refusing:          # manifests the trainer's dataset audit REFUSES (enforced) -- MEASURED 2026-10-11 api/bot/ml/status refusing_manifests_24h
    ml/configs/baseline-prop-mission-policy.yaml: ML-STAGE-DECISIONS
    ml/configs/btc-regime-15m-lgbm-base-vt003-pcv-v1.yaml: ML-HYGIENE
    ml/configs/setup-candidates-metalabel-xsym-yz-v1.yaml: ML-LABEL-WALL
    ml/configs/setup-quality-lgbm-v2.yaml: ML-DATASET-FIXES
  tracked:
    conviction-meta-v1:                         {why: "demoted to candidate 2026-09-29 (ML-DEMOTE); un-served", by: ML-PRODUCERS}
