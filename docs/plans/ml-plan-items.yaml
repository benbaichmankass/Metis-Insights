# Model-FAMILY diversity (read by `ml_plan_status.py --diversity`; frontier-research skill). `family:` on an item names the
# model family the experiment is ABOUT (taxonomy: FAMILIES in the script). `families.<f>.history` is the graded verdicts of that
# family's units, oldest first -- appended by research-ops/frontier-research Step 0 when a unit is graded.
diversity:
  max_family_share: 0.6      # > this share of open family-tagged items in one family -> CONCENTRATION
  max_fail_streak: 3         # a family whose last N graded units all FAILed and still has open items -> FAIL-STREAK
families:
  deep_sequence:  {history: [FAIL]}        # TCN, price-only, BTC 15m regime (MB-20260703-001) -- one architecture, one input class; next: ML-F22 (GRU on the engineered feature window; torch_gru kind landed 2026-10-22, unit queued)
  gbdt: {history: [INDETERMINATE]}         # ML-F19 2026-10-22: yz / yz+fc challengers vs the advisory fc head on BTC/SOL 15m -- between pass bar and fail floor; the incumbent family's own champion-challenger, not a new family
  ssl_representation: {history: [FAIL]}    # MAE on daily macro panel -> 15m vol head (T1.2 P2)
  ts_foundation_model: {history: [INDETERMINATE, FAIL]}       # frozen Chronos-Bolt-Tiny embeddings FAILED at the shipped operating point, but fc_* quantile features PASSED and are advisory; RQ-20261011-9da8-01 FAIL 2026-10-24 (research-ops): Chronos-2 zero-shot only, BTC/ETH/SOL 15m vol head, n 78,735, BTC cv delta vs incumbent -0.0057 / vs HAR-RV control not >= +0.01; ETH+SOL vs incumbent > 0 held; HAR-RV and VAR controls did not match the incumbent on BTC; TimesFM-2.5 / TiRex-2 / Kronos / TTM have no loader (FRONTIER-LEVER-TSFM) so the family is NOT closed. Locator research/results/RQ-20261011-9da8-01/40074055932.jsonl
  tabular_foundation_model: {history: [INDETERMINATE, INDETERMINATE]}   # ML-F12 2026-10-14: tabpfn arm error (licence), tabicl arm run; closes nothing; next: ML-F20 (TabICL at 12k rows, queued 2026-10-18)
  rl_bandit: {history: []}
  conformal_calibration: {history: [INDETERMINATE, PASS, FAIL]}   # ML-F8 2026-10-14: CV clause held, holdout empty -> ML-F17 2026-10-16 PASS (log-loss over the prior on all 3 symbols, holdout non-empty); ML-F3P FAIL 2026-10-22 (65ff-25: 0 of 3 symbols pass at 1h, lgbm/mondrian config only)
  linear_logit: {history: [FAIL, FAIL, PASS, INDETERMINATE, INDETERMINATE, FAIL]}   # ML-M2 FAIL, ML-M3 FAIL (thin columns), ML-F11 PASS (MES 1d non-inferiority), ML-F7 INDETERMINATE, ML-F9 INDETERMINATE; 2026-10-14; ML-F21 FAIL 2026-10-22 (calibrated logit beats the prior but is not within 0.005 log-loss of LightGBM on any 1h symbol)
  ensemble_stack: {history: [INDETERMINATE, INDETERMINATE, PASS, INDETERMINATE, INDETERMINATE]}    # ML-F16 (ExtraTrees/MLP vs LightGBM, 1h shards), ML-F13 (15m shards) 2026-10-14; RQ-20261013-1414-05 PASS (ExtraTrees non-inferior to LightGBM on the MES 1d regime head, CV and holdout; written back 2026-10-16 by lane P2-AI-REGIME-BACKLOG-1016, manager audit 2026-10-16 s2); RQ-20261015-ab54-01 and RQ-20261016-001 INDETERMINATE (1h, tail_rows 43000, the same question twice)
