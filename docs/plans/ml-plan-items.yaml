# docs/plans/ml-plan-items.yaml -- the machine-readable ML / AI-trader build plan.
#
# The human-readable plan is ROADMAP.md § "AI trader (ML) -- build plan". THIS file is what the
# recurring ML plan loop (.claude/skills/ml-review/SKILL.md § "The ML plan loop") checks:
# every item names the checklist row or research/queue unit that carries it, the observation
# that closes it, and (for recurring items) the skill that re-asks. scripts/ops/ml_plan_status.py
# resolves each ref and flags an orphan (ref does not exist), a closed ref with an open item, an
# open ref whose item is marked done, and a stale item (no movement past `review_days`).
# An item with no resolvable ref is not a plan item -- it is a memo.
#
# Edit rules: add/close items ONLY with the row/unit that carries them. `state` here is the PLAN's
# view (open | done | killed | parked); the ref's own state is read live, never copied.
