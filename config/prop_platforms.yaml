# Which terminal each prop account is driven through (platform-adapter boundary).
#
# Spec: docs/research/prop-automation-options-2026-09-27.md § 2.
# Read by src/prop/platform/__init__.py::get_adapter. An unknown `platform`
# value raises; it never falls back silently.
#
#   dxtrade            — Breakout's DXtrade white-label (titled "Breakout
#                        Terminal"), login at app.breakoutprop.com. BUILT:
#                        read path (login, balance, positions, working orders).
#   breakout_terminal  — Breakout's proprietary terminal (dashboard →
#                        "Open Terminal"). BUILT to UNMEASURED DOM by lane
#                        PROP-TERM (2026-09-28): login → dashboard → Open
#                        Terminal, label-based reads, disarmed order controls.
#                        No account exists on it yet; nothing is live-verified.
#
# SWITCHING an account between terminals is ONE line: `platform:`. Leave
# `login_url` out and the per-platform default applies
# (src/prop/platform/__init__.py::DEFAULT_LOGIN_URLS); a leftover URL of the
# OTHER terminal raises instead of driving the wrong page. The executor maps
# symbols through config/prop_rulesets/breakout_routing.yaml
# `symbols.<bot>.<platform>_symbol`, so a breakout_terminal account also needs
# `breakout_terminal_symbol` rows (venue names unmeasured) — until then every
# ticket is refused by the structure guard, never guessed.
#
# breakout_1 is DXtrade: the operator logs in at app.breakoutprop.com
# (2026-09-27 ~10:17Z), which Breakout FAQ 14215629 maps to DXTrade accounts.
# Accounts cannot migrate between the two terminals. BREAKOUT_DX_* are the
# DXtrade TERMINAL login, not the app.breakoutprop.com dashboard login
# (operator, 2026-09-27 18:20Z).
#
# login_url is the DXtrade web terminal, NOT app.breakoutprop.com. MEASURED
# 2026-09-27 (curl + DNS, read-only):
#   - wss.breakoutprop.com is a DNS-only CNAME to the AWS load balancer
#     aws-breakout-prod-lb-*.elb.ap-southeast-1 (not proxied by Cloudflare).
#     `GET /` returns 200 "Breakout Terminal" from `server: envoy`, sets the
#     DXtrade DXTFID cookie, and serves form.loginForm-main (action
#     api/auth/login). Despite the name it is the terminal's HTTP host, and
#     it is where every login selector in src/prop/platform/dxtrade.py was
#     measured.
#   - app.breakoutprop.com is proxied by Cloudflare (403 "Just a moment..."
#     to curl). On the VM, run 36337076971 (issue #13239's successor #13279)
#     ended `unknown_page (login form never rendered ... at
#     https://app.breakoutprop.com)`: it is not the DXtrade login page.
#     The earlier "login: ok" (run 36329607152) never typed the credentials.
#   - Every other *.breakoutprop.com name probed (trade, dx, dxtrade,
#     terminal, platform, www) is Cloudflare's 403 too, so it says nothing.
accounts:
  breakout_1:
    platform: dxtrade
    # login_url: the dxtrade default, https://wss.breakoutprop.com/ (above).
    # Env-var NAMES (never values) holding the login. They reach the VM .env
    # via .github/workflows/sync-vm-secrets.yml as optional secrets.
    username_env: BREAKOUT_DX_USERNAME
    password_env: BREAKOUT_DX_PASSWORD
    # Step-3 executor (src/prop/prop_executor.py; PROP-EXEC 2026-09-28). The
    # kill switch is NOT here: it is PROP_EXECUTOR_MODE in the VM env
    # (off | read_only | live, default read_only).
    executor:
      safety_margin_usd: 5        # the "+ margin" in the § 3.3 DD / daily guards
      unconfirmed_reads: 3        # re-reads before a submit is `skipped: unconfirmed_submit`
      confirm_rel_tol: 0.02       # qty/price tolerance when matching a re-read
      # Venue lot sizes. A symbol with no entry here is REFUSED by the
      # structure guard: sizing into an unmeasured lot would type a number
      # whose risk nobody has computed. ADA/XRP are operator-confirmed
      # 2026-09-28 (Instrument Details: Lot Size 1, Size Steps 1, min 10 lots;
      # see breakout_routing.yaml). SOL/ETH/BTC are NOT measured: fill them
      # from the terminal's Instrument Details before the watched test.
      lots:
        ADAUSD: {lot_units: 1, lot_step: 1, min_lots: 10}
        XRPUSD: {lot_units: 1, lot_step: 1, min_lots: 10}
        # ETHUSD / SOLUSD: MEASURED 2026-09-28 06:18Z (issue #13500, run
        # 36385743336, passive network read, W6-PROP-E1): lotSize 1,
        # multiplier 1, quantityPrecision 2 -> lot_units 1, lot_step 0.01.
        # The venue MINIMUM was NOT in the served fields: min_lots is null
        # (no local minimum check); fill it from the probe / Instrument Details.
        ETHUSD: {lot_units: 1, lot_step: 0.01, min_lots: null}
        # SOLUSD price_step 0.01: MEASURED 2026-09-29 (dry run #13965, run
        # 36526339732): the watchlist quotes 118.01 / 118.02, the submit label
        # reads "at 118.02", and the ticket rounded a typed 119.2002 to 119.2.
        # The executor types SL / TP rounded to it and accepts a read-back
        # within one step (criterion D3). ETHUSD's step is not measured: unset.
        SOLUSD: {lot_units: 1, lot_step: 0.01, min_lots: null, price_step: 0.01}
        # BTCUSD: {lot_units: ?, lot_step: ?, min_lots: ?}   # UNMEASURED (no fields served)
      # The watched click / round trip places at most this many lots of the
      # named venue symbol, meant to be the venue MINIMUM. Empty = they refuse.
      # SOLUSD 0.01 (PROP-EXEC, 2026-09-28): the DOM does NOT state a minimum
      # (probe #13855: qty_constraints [], the lots input has no min/step), so
      # the cap is the LOT STEP (0.01, measured #13500): no valid size is
      # smaller, so the venue minimum is >= 0.01. The dry run is what measures
      # it: the terminal's submit label states the quantity it accepted
      # ("Buy <qty> SOLUSD at <price>", #13855) and a label that differs from
      # the typed 0.01 (a clamp to a higher minimum) REFUSES
      # (dxtrade.submit_label_mismatch). If the dry run passes at 0.01, the
      # minimum is 0.01. min_lots above stays null until then.
      watched_click_max_lots: {SOLUSD: 0.01}
      # Venue symbols the executor may ACT on (manager 2026-09-28: SOL-only
      # go-live; the sidebar sits on SOLUSD and symbol switching is not built).
      # Any other ticket is SKIPPED `symbol_not_enabled` before the form is
      # touched (never a refusal, never an AUTO-REVERT count) and stays manual
      # via Telegram. A symbol joins only after symbol switching lands AND it
      # passes the D1-D7 dry run. Env override: PROP_EXECUTOR_SYMBOLS.
      # 2026-09-30 (PROP-ETH-DOM): per-ticket symbol switching is BUILT
      # (DXtradeAdapter.select_linked_symbol, called by place_bracket).
      # ETHUSD stays OUT: its price_step is UNMEASURED (lots/lot_step/cvpp are
      # measured, #13500); measure it (watchlist quote decimals via
      # dump-tables, then the ETH round-trip-dry D1-D7 walk) before it joins.
      enabled_venue_symbols: [SOLUSD]

  # tradeify_1: Tradeify 247 1-Step $10k crypto evaluation on Tradeify's
  # DXtrade white-label (TRADEIFY-WIRE, 2026-09-30; operator decision ~08:24Z
  # "Buy the $10k pilot (Recommended)"). Memo:
  # docs/research/tradeify-portfolio-feasibility-2026-09-30.md (PR #14580).
  #
  # login_url MUST be explicit: the dxtrade DEFAULT is Breakout's host, so an
  # omitted URL would type Tradeify's login into Breakout's terminal.
  # MEASURED 2026-09-30 (docs/research/prop-dxtrade-firms-2026-09-30.md § 4.1,
  # issue #14635, run 36687556587, one GET per URL from the live VM egress):
  # GET https://dx.tradeify247.co/ -> 200, the DXtrade terminal page with
  # loginForm-main / #username / #password, no Cloudflare challenge and no
  # Error 1005. NOT measured: a login, the post-login DOM, symbol names, lots.
  tradeify_1:
    platform: dxtrade
    login_url: https://dx.tradeify247.co/
    username_env: TRADEIFY_DX_USERNAME
    password_env: TRADEIFY_DX_PASSWORD
    # Kill switch: PROP_EXECUTOR_MODE_TRADEIFY_1 (off | read_only | live,
    # default read_only). It NEVER reads breakout_1's PROP_EXECUTOR_MODE.
    # Ruleset + routing: accounts.yaml::tradeify_1.backtest_ruleset and that
    # ruleset's `routing:` key (src/prop/prop_executor.py::rule_paths_for).
    executor:
      safety_margin_usd: 5
      unconfirmed_reads: 3
      confirm_rel_tol: 0.02
      # EMPTY ON PURPOSE: no Tradeify lot size, step, minimum or price step is
      # measured. A symbol with no entry is REFUSED by the structure guard.
      # Fill from the login check's passive instrument-spec read (default
      # --symbols includes ETHUSD, SOLUSD, XRPUSD) once it has run.
      lots: {}
      watched_click_max_lots: {}
      # Nothing enabled: every ticket is SKIPPED `symbol_not_enabled` before
      # the form is touched. Set in the go-live PR only, after the dry evidence.
      enabled_venue_symbols: []

# Read-only terminal PROBES (not traded accounts): run by the
# `breakout-terminal-probe` system-action (scripts/prop/breakout_terminal_probe.py)
# to MEASURE a terminal before any account runs on it. PROP-TERM 2026-09-28:
# the brief says to try the existing BREAKOUT_DX_* login on the dashboard.
# The header above records the operator's note that those are the DXtrade
# TERMINAL login, so `login_rejected` is an expected, reportable outcome;
# point these at other env-var NAMES once the operator sets them.
probes:
  breakout_terminal:
    platform: breakout_terminal
    username_env: BREAKOUT_DX_USERNAME
    password_env: BREAKOUT_DX_PASSWORD
