# config/prop_rulesets/hyrotrader_lenient.yaml
# HyroTrader on Bybit (DEMO API) — LENIENT reading (4% daily, 6% max).
# Source: docs/research/hyrotrader-bybit-deep-dive-2026-09-30.md (first-party pages read
# 2026-09-30; nothing bought; HyroTrader NOT contacted). Lane HYRO-STRATS.
#
# ⚠️ unconfirmed: true — the firm's own pages print 4% / 5% daily and 5% / 6% max
# (deep dive § 1.2, Q2). This file is the LENIENT reading (4% daily, 6% max); the strictest
# reading is config/prop_rulesets/hyrotrader.yaml. Neither is checkout-verified.
ruleset: hyrotrader_lenient
plan: two-step-standard-5k
account_size_usd: 5000        # $5k challenge, $59 deposit refundable with first payout [1P home]
profit_split: 0.80            # starts 80%, +5%/4 months to 90% [1P]
unconfirmed: true

phases:
  evaluation:                 # Phase 1 (two-step). Phase 2 target is 5% — see raw.phase2_target_pct
    profit_target_pct: 0.10   # [1P] home
    min_trading_days: 5       # QUALIFYING days, see raw.qualifying_day [1P] /minimum-trading-days/
    max_eval_days: null       # "no minimum or maximum number of calendar days" [1P]
  funded:
    profit_target_pct: null   # "no profit distribution requirement" [1P]
    min_trading_days: 0

limits:
  daily_loss_pct: 0.04
  max_drawdown_pct: 0.06        # "6% maximum loss" [1P home /trading-rules/]
  drawdown_type: static
  drawdown_breach: terminal
  max_position_pct: 0.03      # max REALIZED loss on any single position 3% of initial [1P] (manually reviewed)

consistency:                  # Phases 1 and 2 ONLY [1P]: no single day > 40% of total net result
  enabled: true
  max_single_day_profit_share: 0.40

restrictions:
  weekend_flat: false         # "not required to close overnight" (funded wording) [1P]
  overnight_flat: false

funded_soak_days: 30

economics:
  account_fee_usd: 59         # refundable ONLY with first payout; lost on an earlier breach [1P]
  rebuy_fee_usd: 59           # "no discounts for repeat attempts" [1P]
  payout:
    first_payout_after_days: 1    # "same day as your first trade" (funded) [1P]; conservative use is the caller's
    payout_frequency_days: 7
    min_withdrawal_usd: 100       # >= $100 profit AFTER the split [1P]
    min_trading_days_before_payout: 0
    processing_hours: 24
  withdrawal_policy:
    mode: above_start
    bank_asap: true
    cadence_days: 7

# Fields the shared PropRuleset dataclass has no slot for. Read by
# scripts/research/hyro_passprob_mc.py, ignored by everything else (parse_ruleset keeps `raw`).
phase2_target_pct: 0.05                 # two-step verification [1P]
daily_loss_basis: equity_peak_of_utc_day   # STANDARD = trailing daily DD from the day's high equity,
                                           # floating P&L counts, server reset UTC [1P-paraphrase]
                                           # (SWING = fixed from day-start balance; paid upgrade)
qualifying_day:                        # [1P] /faq/evaluation-process/minimum-trading-days/
  min_trade_notional_frac_of_initial: 0.05   # "at least 5% of the initial account balance"
  min_abs_pnl_frac_of_trade_value: 0.01      # "PnL of a trade must be at least ±1% of the trade value"
  trade_value_reading: notional          # AMBIGUOUS: notional (=> >=1% price move) or margin (=> >=1%/leverage)
  same_day: true                         # "executed and closed on that day"
demo_realism:                            # [1P] /faq/bybit-platform/bybit-demo-compliance-rules-/
  flagged_trade_profit_credit: 0.40      # only 40% of profit from flagged no-slippage exact-fill trades counts
