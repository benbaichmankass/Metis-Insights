# Curated prediction-market list for scripts/macro/pm_snapshot_collect.py (PM-COLLECTOR).
# A small fixed list, NOT a crawl. Data-pull only: nothing here is read by any order path.
max_markets_per_series: 12     # cap per Kalshi series / Polymarket query (nearest-to-close first)
kalshi:
  base_url: https://api.elections.kalshi.com/trade-api/v2
  series:
    KXFEDDECISION: fed_rate_decision
    KXFED: fed_funds_rate
    KXCPI: cpi
    KXPAYROLLS: nfp
    KXRECSSNBER: recession
polymarket:
  gamma_url: https://gamma-api.polymarket.com
  # public-search query -> (topic, event slug prefix that must match)
  queries:
    - {q: "fed decision", topic: fed_rate_decision, slug_prefix: "fed-decision-in-"}
    - {q: "recession", topic: recession, slug_prefix: "us-recession-"}
# One-shot historical backfill (scripts/macro/pm_backfill_kalshi.py). Release-type series only; the
# live collector above ignores this key.
backfill:
  series: [KXCPI, KXPAYROLLS, KXFEDDECISION]
  window_hours_before_close: 168   # hourly candles from close-168h to close+1h
  period_minutes: 60
  min_seconds_between_calls: 2.5
