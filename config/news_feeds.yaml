# Free RSS news feeds for the M9 news layer (NEWS_SOURCE=rss).
#
# RSS is keyless + real-time — publishers emit items as they're published, with
# a pubDate usually minutes old — so it sidesteps the NewsAPI free-tier ~24h
# delay that made the layer inert. No API key, no per-call cost.
#
# A traded symbol pulls the feeds of its class-derived group(s) plus the
# `global` group. Articles are still scored for per-symbol relevance by the
# normalizer's keyword match, so a broad feed only contributes the items that
# actually mention the symbol. Adding/removing a feed is a YAML edit — the RSS
# client (src/news/news_client_rss.py) is source-agnostic.
#
# FEED SELECTION IS DERIVED — there is deliberately NO per-symbol list here
# (2026-08-07, BL-20260807-NEWS-FEED-SYMBOL-COVERAGE-5-OF-24). A symbol's group
# comes from its asset class in config/instruments.yaml via
# src.core.instrument_class.news_group_for_symbol, mapped through
# `asset_class_groups` below. The previous per-symbol `symbol_groups` map was a
# SECOND registry parallel to instruments.yaml; it drifted to 5 of 24 traded
# bases, so 19 symbols read macro-only headlines while the news veto was armed.
#
# So: to give a NEW symbol news coverage, do nothing. Adding it to
# instruments.yaml (which you must do to trade it) is sufficient. Only edit
# this file to add/remove a FEED, or to map a class to different groups.
# The `check_news_feed_coverage` CI guard fails the build if any traded base
# resolves to global-only, so the coverage cannot silently regress again.
#
# Loader: src/news/news_feeds.py (never raises — missing/bad file => no feeds).
# Feed URLs change over time; if one 404s the client skips it (best-effort).

defaults:
  max_items_per_feed: 25
  timeout_seconds: 8

groups:
  # Macro / cross-asset — relevant to everything (Fed, rates, inflation, jobs).
  global:
    - https://www.federalreserve.gov/feeds/press_all.xml
    - https://feeds.content.dowjones.io/public/rss/mw_topstories   # MarketWatch top stories
    - https://www.cnbc.com/id/20910258/device/rss/rss.html         # CNBC Economy (macro / Fed / data)
    - https://www.cnbc.com/id/10000664/device/rss/rss.html         # CNBC Markets (broad risk sentiment)
  crypto:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
  equities:
    - https://www.cnbc.com/id/100003114/device/rss/rss.html        # CNBC Top News
    - https://www.cnbc.com/id/20910258/device/rss/rss.html         # CNBC Economy
    - https://www.cnbc.com/id/10000664/device/rss/rss.html         # CNBC Markets
  energy:
    - https://oilprice.com/rss/main
    - https://www.cnbc.com/id/19836768/device/rss/rss.html         # CNBC Energy
  metals:
    - https://www.cnbc.com/id/10000664/device/rss/rss.html         # CNBC Markets (metals coverage)

# Which feed groups each ASSET CLASS draws from, in addition to `global`.
# Keys are the class tokens from src.core.instrument_class (crypto / index /
# commodity / bond / equity / fx), OR any value used as a per-instrument
# `news_group` override in instruments.yaml (e.g. `energy` for USO, whose
# coarse class is `commodity` but whose news desk is oil).
#
# A class with NO entry here (bond, fx) keeps the `global` macro feeds only —
# that is the correct answer, not a gap: rates/Fed/inflation news IS the macro
# feed for TLT/IEF, and there is no better FX-specific source in this set.
asset_class_groups:
  crypto:    [crypto]
  equity:    [equities]
  index:     [equities]
  commodity: [metals]
  energy:    [energy]      # per-instrument `news_group` override (USO)

# Classes that are DELIBERATELY macro-only (global feeds, no class group).
# This list is what makes "global-only" a declared decision rather than a
# silent fallthrough — the coverage guard fails on any traded symbol that ends
# up global-only WITHOUT its class being named here. That distinction is the
# whole fix: the 5-of-24 gap was invisible precisely because falling through to
# `global` looked identical to being correctly assigned to it.
macro_only_classes:
  - bond    # TLT / IEF — rates, Fed and inflation news IS the macro feed.
  - fx      # no FX-specific source in this feed set today.
