  # ── PROPOSED 2026-09-30, GRANTED 2026-09-30 (granted_by / source below) ────────
  # Lane PATHB-MANDATE (manager session_01HYq6XtfesZ57VyaQrK6CL1), pipeline row
  # PI-20260929-AQRK6CL1-0013. Proposed by a session; GRANTED by the operator.
  #
  # THE DECISION HAS ARRIVED TWICE IN THE SAME SHAPE:
  #   1. 2026-08-30, Tier-3 approved in conversation: a batch of `sm*` (atr_stop_mult)
  #      Path-B cells -- trend_donchian sm2, htf_pullback_trend_2h sm3,
  #      avax_pullback_2h sm2, trend_donchian_{eth,sol,xrp,ada,avax}_4h.
  #      (docs/research/exit-refinement-coverage.json bracket_geometry refs.)
  #   2. 2026-09-29 ~21:05Z, operator popup "Ship it": spy_pullback_1h sm1.5, #14332.
  #
  # ⚠️ THE PRECEDENT IS WIDER THAN THIS MANDATE, ON PURPOSE. Read from
  # config/accounts.yaml on 2026-09-30, trend_donchian_eth_4h and
  # trend_donchian_xrp_4h -- both in the 2026-08-30 batch -- sit on bybit_2 and
  # bybit_portfolio, i.e. REAL MONEY. This entry would NOT have covered them
  # (R-SOAK-ONLY). Their shipping was the operator's decision and stays one.
  #
  # ⚠️ "PATH B" HERE MEANS THE SWEEP VERDICT `path_b_wf_pass`, NOT THE SKILL'S TEXT.
  # .claude/skills/exit-refinement/SKILL.md defines Path B as capital-efficiency
  # up AND maxDD not worse, and says its two thresholds are NOT SET. The corpus
  # verdict is looser: net_R up in BOTH windows, capital/day up, yearly
  # walk-forward >= 4 usable and 2/3 wins; drawdown is RECORDED, not gated
  # (m20_fleet_exit_sweep.py ~L2986-3015). Every occurrence above was a cell the
  # gate marked `maxdd_worse`. So the drawdown bound below is THIS MANDATE'S
  # OWN, and it does not set the skill's two thresholds -- that remains the
  # operator's.
  - id: MD-SOAK-EXIT-CELL-PATHB
    grants: declare a passing stop-multiplier (atr_stop_mult) cell on a leg that sits ONLY on Stage-1 soak rosters
    direction: exit_geometry
    proposed_by: session_01R2PHzyjMvQoNiB39SdYWco
    proposed_at: '2026-09-30'
    granted_by: operator (Ben)
    granted_at: '2026-09-30'
    source: >-
      Popup in manager session session_01HYq6XtfesZ57VyaQrK6CL1, ~05:15Z
      2026-09-30, answered verbatim "Grant; firing opens a PR (Recommended)".
      The popup stated the bounds as written here. Recorded by the manager on
      checklist row PATHB-MANDATE in docs/claude/work/MANAGER-CHECKLIST.json
      (PR #14550). Confirmed again directly by the operator in this lane's
      session, 2026-09-30: "Grant confirmed, proceed with the mandate move".
      NO auto-land: a fire opens a PR and pings, and the manager merges it.
    recurrence: 2 occurrences (2026-08-30 batch of 8 cells with a computable ratio; 2026-09-29 #14332)
    # `direction: exit_geometry` is NOT add_risk|derisk_only, so `_decide()` (the
    # roster resolver) REFUSES this id by design. It is evaluated by
    # mandate_resolver.resolve_exit_cell() -- `python3 scripts/ops/mandate_resolver.py
    # --leg <leg> --exit-cell <cell> [--dry-proposed]`. A tighter stop raises
    # notional per unit risk (1.24x-1.93x over the measured population), so it is
    # NOT filed as derisk_only.
    fires_when: >-
      For ONE (leg, cell) in docs/research/e35-bracket-corpus.jsonl, read at
      fire time: (1) EVERY account roster in config/accounts.yaml that lists the
      leg is a Stage-1 paper soak account (bybit_1, alpaca_paper, ib_paper) --
      Stage-1 MEMBERSHIP, never `account_class`, because bybit_portfolio and
      alpaca_portfolio are class `paper` and are Stage-2 mirrors; a leg on any
      other account, including a mirror, a prop account or alpaca_options_paper,
      is out of scope; (2) every graded corpus row for the cell says
      `path_b_wf_pass`, and the newest is `state: measured`, `axis: stop`,
      `gate_path: B`, with no `tp_r` and no `timeout` (no live unit implements a
      bar-count exit), from a `family` in {pullback, donchian}; (3) net_R rises in
      BOTH the IS and OOS windows and capital/day rises; (4) base OOS trades >=
      bar.min_oos_trades; (5) wf_wins_effective / wf_usable clears
      bar.min_wf_win_fraction with wf_usable >= bar.min_wf_usable; (6) the
      cell's full-history d_max_dd is within the sweep's own exchange-rate
      allowance min(D_b x dN/N_b, D_b) AND within
      bar.max_dd_worsening_frac_of_base of the base drawdown; (7) the cell's
      leverage_multiple <= bar.max_leverage_multiple. The edit changes ONE key,
      `atr_stop_mult`, on that one leg in config/strategies.yaml, and nothing
      else. One cell per leg per fire, chosen by the rule B4 stated in advance:
      highest wf_wins_effective, tie-break d_net_r, over the leg's gate-passing
      cells.
    never: >-
      Never a leg present on ANY of bybit_2, bybit_portfolio, alpaca_live,
      alpaca_portfolio, ib_live, breakout_1, or any account not listed as
      Stage-1 above. Never a row that is missing, unmeasured, or whose
      base_oos_trades is null -- "could not look" is not a pass. Never a cell
      any graded corpus row disagrees with. Never a cell carrying a `timeout` or
      a `tp_r`. Never a harness family outside {pullback, donchian}; in
      particular never scripts/backtest_orb.py, src/backtest/backtester.py,
      scripts/backtest_xsec_momentum.py or scripts/backtest_vol_target.py.
      Never touches config/accounts.yaml, config/mandates.yaml, a roster, a risk
      cap, `mode:` or `execution:`. Never lands itself: the PR declares
      `landing: hold`.
    evidence_required: >-
      The corpus row (measurement_key and source run), the leg's regenerated
      comms/strategy_evidence/<leg>.json produced by the harness rather than
      hand-edited, the exit-refinement-coverage.json cell flipped in the same PR,
      the realtime ping, and the section-1 evidence review in the next daily
      brief. The regenerated record's net_r_oos must not be WORSE than the
      committed one it replaces (#14332: -14.07 -> -8.55; both read
      decision_rule.verdict=fail on a harness that omits skip_hours -- so this
      mandate ships exit geometry on a soak leg, it does not certify the leg).
    # Every number below is either taken from the sweep/skill, or PROPOSED with
    # its reasoning stated here -- none is a fitted constant. INFERRED entries
    # say so, and the operator may move any of them.
    bar:
      # skill § "MIN-OOS-TRADES FLOOR", operator-set 2026-08-11 -- a denominator
      # requirement, carried unchanged.
      min_oos_trades: 25
      # PROPOSED TIGHTENING of the sweep's "wf_usable >= 4 and wins x 3 >= usable x 2"
      # (=> 4/6 passes). Arithmetic, not evidence: under a coin-flip null with
      # independent folds P(>=4 of 6) = 22/64 = 34%, P(>=5 of 6) = 7/64 = 11%. The
      # sweep grades ~10 cells per leg across ~44 legs, so a 4/6 gate is close to no
      # filter, and an unattended fire has no human to catch a selection artifact.
      # (Folds are NOT independent, so read 11% as an order of magnitude.) 5/6
      # keeps 6 of the 8 batch cells with a computable ratio and drops
      # htf_pullback_trend_2h and avax_pullback_2h (4/6; their maxDD ask was <= 0).
      # Those two go to the operator, as they did before.
      min_wf_usable: 5
      min_wf_win_fraction: 0.8
      # PROPOSED. The largest maxDD-worsening (d_max_dd / base maxDD, full history)
      # in the 2026-08-30 batch is 0.35 (trend_donchian_avax_4h sm1.5); #14332 is
      # 0.24. The mandate is meant to REPEAT what the operator already accepted,
      # not extend it, so the cap is that batch's own maximum. The 2026-08-29 batch
      # went further (mgc_pullback_1d 0.94, slv_trend_1h 0.76) -- the operator
      # approved those individually, and this cap deliberately routes cells like
      # them back to a person. The sweep's exchange-rate test (clause 6) is
      # enforced BESIDE it and is NOT redundant: it would let gld_pullback_1h
      # sm1.5 (0.39) and slv_trend_1h sm1.5 (0.76) through; this cap does not.
      max_dd_worsening_frac_of_base: 0.35
      # INFERRED, PROPHYLACTIC, BINDS ON 0 OF THE 46 MEASURED path_b_wf_pass ROWS
      # (max 1.93x). A tighter stop raises notional per unit of risk; this only
      # bounds a future cell. It is a bound on a future cell, not a correction of a
      # present one -- strike it if a control that controls nothing is unwanted.
      max_leverage_multiple: 2.0
    # AUTO-LAND: NOT GRANTED (operator, same popup). Short form:
    # scripts/ci/check_mandate_autoland.py clause A1/A2 is built for REMOVALS from
    # accounts.yaml and refuses config/strategies.yaml; this entry ADDS notional
    # per unit risk on paper; and it has never fired once. No `autoland:` field.

proposed: []
