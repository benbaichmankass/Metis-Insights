      no decisive verdict exists yet, the operator-accepted 5.0 bps provisional
      basis in `never:` below still applies and is checked first -- a
      measurement never buys a way around it, and a `divergent` verdict refuses
      there too. The edit ADDS the leg to the Stage-2 account AND to its mirror
