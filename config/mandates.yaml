# config/mandates.yaml — the standing-authorization store (plan item B5)
#
# CREATED 2026-09-24. Until this file existed, `CLAUDE.md` asserted that "THE
# LADDER IS FULLY AUTOMATED ... including promotion to a real-money roster"
# while the store that would hold a single mandate DID NOT EXIST anywhere in
# git. Ten files referenced it. `scripts/ops/render_daily_brief.py` was the
# only honest one -- its line 38 reads "config/mandates.yaml (today: absent --
# B5 is not built)".
#
# THE CONSEQUENCE WAS STRUCTURAL, NOT BEHAVIOURAL, and it is why this file
# matters more than its length suggests:
#   * section 1 of the daily brief -- "taken under mandate" -- could only ever
#     be empty;
#   * EVERY Tier-2/3 decision necessarily routed to the operator, not by policy
#     but by the absence of anywhere to record an authorization;
#   * so a manager could not "ask for a mandate" even when it noticed it should,
#     because there was no landing place for the answer.
#
# ── WHAT A MANDATE IS, AND IS NOT ─────────────────────────────────────────────
#
# A mandate is an authorization the OPERATOR grants ONCE, IN ADVANCE, so a
# recurring decision of a known shape stops being asked. When one fires: a
# realtime ping, then the evidence record in section 1 of the next brief.
#
# ⚠️ A MANDATE IS NOT A THIRD EXECUTION GATE. It does not decide what RUNS --
# `accounts.yaml::mode` and `strategies.yaml::execution` remain the only two,
# per CLAUDE.md § "The two execution gates". A mandate decides what may be
# CHANGED WITHOUT ASKING. Do not let anything here grow into a run/no-run gate.
#
# ⚠️ "IF THE EVIDENCE SUPPORTS IT" IS THE ENTIRE SAFETY PROPERTY once nobody is
# in the path: a committed evidence record, a named harness, a stated n, NET OF
# THE FULL COST STACK, clearing a rule registered BEFORE the run. A claim in a
# PR body is not a record.
#
# ── SCHEMA ────────────────────────────────────────────────────────────────────
#
# Consumers read the top-level `mandates:` list (see
# scripts/ops/render_daily_brief.py::mandates_view and its test, which uses
# `- id: ... / grants: ...`). Each granted entry carries:
#
#   id:                 stable identifier, MD-<SHORT-NAME>
#   grants:             what it authorizes, in a word the brief can print
#   granted_by:         who granted it (an operator, named)
#   granted_at:         ISO date of the grant
#   source:             where the operator's answer is recorded, so a later
#                       session can check the grant instead of trusting it
#   fires_when:         the CONDITION, written so it can be checked rather than
#                       interpreted. If you cannot write a checkable condition,
#                       the decision is not ready to be a mandate.
#   never:              the explicit carve-outs. Every mandate has some.
#   evidence_required:  what must be committed when it fires.
#   blocked_until:      optional -- a precondition that must land first.
#
# The FIVE LADDER mandates carry three further fields, because
# `scripts/ops/mandate_resolver.py` reads them as the machine-checkable form of
# `fires_when` (added here 2026-09-24 with the grants; the resolver landed in
# #12873 and this comment is the schema catching up to the field):
#
#   direction:          `add_risk` | `derisk_only`. Anything else REFUSES.
#   bar:                min_n_closed / expectancy_gt / fold_majority /
#                       cost_tolerance_bps. A mandate with no `bar:` REFUSES --
#                       "a mandate with no bar is not a mandate".
#   cap:                basis / max_auto_share. Required for `add_risk`.
#
# ⚠️ THE FIVE PROCESS MANDATES DELIBERATELY CARRY NO `direction:`. They do not
# act on a roster, so the resolver has nothing to measure for them -- and its
# fail-closed behaviour is exactly right: asked to evaluate one, it REFUSES with
# "direction=None is not add_risk|derisk_only". Do not add a direction to a
# process mandate to quiet that; the refusal is the feature.
#
# ── THE GRANTED LIST — TEN MANDATES, GRANTED 2026-09-24 ───────────────────────
#
# OPERATOR (Ben), 2026-09-24 ~17:15Z, popup answered in the manager session
# session_01Ljhs6sFAdWHdMDhJpL5aBP, verbatim: **"Grant all 10 as written"** --
# the five process mandates that sat under `proposed:` here, plus the five
# ladder mandates defined in docs/plans/OPERATING-PLAN-2026-09-21.md § 5.3. The
# answer is recorded on checklist row B5 in docs/claude/work/MANAGER-CHECKLIST.json
# (merged in #12885), which is the durable record this file's `source:` fields
# point at.
#
# "AS WRITTEN" IS LOAD-BEARING. Every condition below is carried verbatim from
# the text the operator was shown -- the five `proposed:` entries as they stood
# at 1665947, and § 5.3 including its arming block. Nothing was widened, and
# where § 5.3 leaves a number unstated this file says so in place rather than
# quietly choosing a comfortable one (see MD-PROMOTE-S1-S2 `bar.cost_tolerance_bps`).
#
# ⚠️ A SESSION MUST NEVER PROMOTE ITS OWN PROPOSAL, AND THIS FILE IS NOT THE
# EXCEPTION. Writing an authorization for yourself is the same failure class as
# a session self-landing a PR that grants its own next PR -- the asymmetry IS
# the control. What happened here is the sanctioned path, and it is worth
# reading as a worked example: a manager PROPOSED (the five below), the operator
# GRANTED in a popup, the manager RECORDED the verbatim answer on row B5 and
# MERGED it, and only then did a lane transcribe it here -- in a PR the lane may
# not merge. The lane never held the authorization; it only copied a record.

mandates:

  # ── THE FIVE PROCESS MANDATES ──────────────────────────────────────────────
  #
  # Moved verbatim from `proposed:` (nothing in fires_when / never /
  # evidence_required / recurrence is altered); `granted_by`, `granted_at` and
  # `source` are added, and `proposed_by` / `proposed_at` are kept so the
  # proposal and the grant stay separately legible.

  - id: MD-OBSERVABILITY-IN-A-GATED-PATH
    grants: land_without_asking
    proposed_by: session_01XQhayAHWdrSYv8jN54P2HH
    proposed_at: '2026-09-24'
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5.
    recurrence: 3 times on 2026-09-24 alone (PRs #12738, #12735, #12748)
    fires_when: >-
      A PR is complete and CI-green, its landing declaration is held only for
      tier, and its diff changes NO order path, NO account roster, NO risk cap
      and NO sizing -- it adds or changes a read surface, a stamp, a column's
      write timing, or a register.
    never: >-
      Never when the diff touches config/accounts.yaml strategies rosters,
      config/strategies.yaml execution, config/pairs.yaml, any risk cap, or any
      file under src/ reached by the order path. Tier is declared by
      pr-landing-guard, and a disagreement resolves to the STRICTER tier.
    evidence_required: >-
      The post-merge observation named in the PR body, taken and recorded --
      not "will verify later".

  - id: MD-DEPLOY-AN-APPROVED-MERGE
    grants: deploy_and_verify
    proposed_by: session_01XQhayAHWdrSYv8jN54P2HH
    proposed_at: '2026-09-24'
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5.
    recurrence: >-
      Every Tier-2 merge. Asked as a separate question on #12738 when the
      operator had already said "merge, restart, verify".
    fires_when: >-
      A merge the operator already approved needs pull-and-deploy and the
      post-state read. CLAUDE.md defines Tier 2 as "ship and verify the post
      state", so the deploy was never a separate decision -- asking again
      splits one approval into two.
    never: >-
      Never a restart-bot-service that races ict-git-sync; use pull-and-deploy
      so the restart is guaranteed to load the intended commit. Never a deploy
      of something NOT already approved.
    evidence_required: >-
      The deploy run id and wrapper exit code, plus a read of
      /api/bot/runtime-config showing git_sha containing the merge and
      reload_state `current`.

  - id: MD-DERISK-ONLY-ROSTER-CUT
    grants: derisk_only
    proposed_by: session_01XQhayAHWdrSYv8jN54P2HH
    proposed_at: '2026-09-24'
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5.
    fires_when: >-
      A leg on a real-money roster FAILS B1's four-clause evidence bar and the
      change REMOVES it. Cut only.
    never: >-
      NEVER an addition. This exists because CI is asymmetric in the wrong
      direction: check_dry_run_in_diff.py guards turning a leg OFF and NOTHING
      guards turning one ON, which CLAUDE.md names as the mechanical cause of
      the roster going 36 -> 55 while every memo said cut. A mandate that
      allowed additions would widen exactly the hole.
    evidence_required: >-
      The failing evidence record, named harness, stated n, net of the full
      cost stack.

  - id: MD-STRIP-A-ZERO-MEASURED-LEVER
    grants: strip_inert_lever
    proposed_by: session_01XQhayAHWdrSYv8jN54P2HH
    proposed_at: '2026-09-24'
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5.
    recurrence: E41's shape (gld, qqq trail_decay arms).
    fires_when: >-
      A declared lever measures EXACTLY zero reach over a population above a
      registered floor, and removing it changes no live order-path behaviour.
    never: >-
      Never a lever measuring small-but-nonzero; never one whose population is
      below the registered floor; never one on a leg whose evidence record is
      unreadable or cites a source_run absent from the repo.
    evidence_required: >-
      The reachability record with its population stated, and the regenerated
      evidence record -- regenerated by the harness, never hand-edited.

  - id: MD-PREFER-THE-VERIFIABLE-SIDE
    grants: resolve_stale_branch_conflict
    proposed_by: session_01XQhayAHWdrSYv8jN54P2HH
    proposed_at: '2026-09-24'
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5.
    recurrence: >-
      The #12737 near-miss, where a stale branch would have imported an
      unverifiable measurement into the promotion corpus through an ordinary
      merge conflict.
    fires_when: >-
      A merge conflict in comms/strategy_evidence/ or a measurement register
      where ONE side cites a source_run that does not exist in the repo and the
      other cites one that does, with a row count matching its stated n.
    never: >-
      Never when BOTH sides are verifiable -- that is a real disagreement and
      goes to the operator. Never hand-edit a record's numbers to match a
      config; regenerate or escalate.
    evidence_required: >-
      The ls-tree output showing which source_run exists, and the row count of
      the surviving side's trades file against its stated n.

  # ── THE FIVE LADDER MANDATES ───────────────────────────────────────────────
  #
  # Defined in docs/plans/OPERATING-PLAN-2026-09-21.md § 5.3 and mirrored in
  # .claude/skills/manager/SKILL.md § "Standing authorizations". The 2026-09-21
  # grant, verbatim: "All the ladder decisions can be automated -- that is a
  # standing mandate. Strategies can be promoted to live money without explicit
  # operator approval if the evidence supports the decision. I should just get a
  # ping in realtime of the update and an evidence review in the next daily
  # briefing."
  #
  # ⚠️ NO EXPIRY IS RECORDED ON ANY OF THESE, because none was granted. The
  # manager skill says "expiry is load-bearing -- an expired mandate stops
  # authorizing"; writing an `expires:` this file was not given would be a
  # session inventing the bound of its own authorization, which is the one thing
  # it may never do. If the operator wants expiry, it is granted, not inferred.
  #
  # THE BAR and THE CAP below are the operator's 2026-09-21 decisions, recorded
  # on checklist row B5 and in § 5.3 "The bar and the cap — DECIDED 2026-09-21":
  # expectancy > 0 net of the FULL cost stack at n >= 30 closed; positive in a
  # MAJORITY of walk-forward folds; Stage-1 realized cost within a stated
  # tolerance of modelled; total declared risk across AUTO-PROMOTED legs <= 25%
  # of the account's configured risk budget, with NO RATE LIMIT.
  # <!-- population-ok: a configured ceiling the operator chose, not a measurement -->

  - id: MD-PROMOTE-S0-S1
    grants: add a leg to the Stage-1 soak book on a passing Stage-0 record
    direction: add_risk
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5. The underlying
      grant is the operator's 2026-09-21 ladder mandate, quoted in
      docs/plans/OPERATING-PLAN-2026-09-21.md § 5.3.
    fires_when: >-
      A leg not on a Stage-1 soak roster (bybit_1, alpaca_paper, ib_paper) has a
      committed Stage-0 evidence record at comms/strategy_evidence/<leg>.json
      that passes B1's four clauses and its identity check, whose source_run is
      a committed file in the repo, and that clears the bar below. The edit ADDS
      the leg to that one soak roster and nothing else.
    never: >-
      Never a leg whose record is missing, unreadable, or cites a source_run
      absent from the repo. Never onto a Stage-2 roster -- Stage 2 is reached
      only through Stage 1. Never when the account's account_class is not
      `paper`; a class mismatch is config drift the resolver will not paper
      over. Never past the cap.
    evidence_required: >-
      The committed record -- named harness, stated n, decision rule registered
      before the run, net of the full cost stack -- plus the realtime ping and
      the section-1 evidence review in the next daily brief.
    bar:
      min_n_closed: 30
      expectancy_gt: 0
      fold_majority: true
    cap:
      basis: uniform_account_risk_pct_share_of_roster
      max_auto_share: 0.25

  - id: MD-PROMOTE-S1-S2
    grants: add a leg to a REAL-MONEY roster on Stage-0 evidence plus Stage-1 cost fidelity
    direction: add_risk
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5. The underlying
      grant is the operator's 2026-09-21 ladder mandate, quoted in
      docs/plans/OPERATING-PLAN-2026-09-21.md § 5.3.
    # ⚠️ CARRIED VERBATIM FROM § 5.3, WHICH IS WHY THIS ENTRY IS GRANTED BUT NOT
    # ARMED. The plan's words: "AND THE PROMOTION MANDATE MUST NOT ARM UNTIL D1
    # LANDS. THIS IS NOT CAUTION, IT IS ARITHMETIC." The same block is stated in
    # CLAUDE.md § "The daily sync, and standing authorizations" and in
    # .claude/skills/manager/SKILL.md. The resolver REFUSES on any truthy
    # `blocked_until`, so this field is the arming switch and clearing it is the
    # operator's act, not a lane's.
    #
    # ⚠️ THE BLOCK NO LONGER NAMES A ROW ID, AND THAT IS THE POINT. It used to
    # read "D1 lands"; checklist row D1 reads `dropped`, killed 2026-09-22 as a
    # DUPLICATE of R1 ("R1 and D1 ARE THE SAME WORK"), and R1 reads `done`. A
    # dropped row can never land, so the block as WRITTEN could never clear --
    # while its SUBSTANCE was arguably already discharged by R1. That is a
    # decision, not a transcription, so the lane that found it stated it here
    # and verified the substance separately in
    # docs/research/d1-cost-stack-verification-2026-09-25.md (merged #12928).
    #
    # OPERATOR (Ben), 2026-09-25, popup answered in the manager session
    # session_01Ljhs6sFAdWHdMDhJpL5aBP, verbatim: **"Adopt text + fix the 24"**
    # -- adopt that memo's § 4 replacement text, correcting its counts to the
    # read-time measurement. THE MANDATE STAYS BLOCKED: `blocked_until` remains
    # truthy, the resolver still REFUSES, and clearing it is still the
    # operator's act. What changed is that the condition is now CHECKABLE --
    # two artifacts a session can read (a pipeline item's `state`, and a
    # checklist row's own done-when observation) instead of a row id that can
    # be `dropped` out from under it.
    #
    # ⚠️ AND IT DISTINGUISHES STALE FROM DANGEROUS, deliberately. The original
    # text was written when the number in question was 0.0 -- a silently
    # zeroed cost term producing a fee-only, optimistically-biased verdict.
    # That specific failure is FIXED for every harness path backing the current
    # corpus (§ 1(a)-(c) of the memo). The residual (a) gap is the OPPOSITE
    # sign: the stale perp records carry the higher pre-E60 5.0 bps against the
    # decided 3.0 bps, i.e. they over-charge cost. Do not re-read "blocked" as
    # "still zero-cost".
    #
    # ⚠️ THE `TODAY:` COUNTS BELOW ARE A MEASUREMENT, NOT A CONSTANT -- re-run
    # them, never quote them. Measured 2026-09-25 by this lane over all 52
    # comms/strategy_evidence/*.json records, classifying venue with
    # execution_costs.is_perp and comparing each perp record's
    # cost_stack.slippage against execution_costs.slippage_bps_roundtrip_for:
    # 28 perp records, 1 excluded as `no_harness` (turtle_soup), so 27
    # re-priceable, of which 22 stale at 5.0 bps and 5 fresh at 3.0 bps. The
    # memo's § 4 said 24 of 27; E39 (#12919) regenerated fade_breakout_4h and
    # htf_pullback_trend_2h at 3.0 bps on 2026-09-25 AFTER the memo's stated
    # population (origin/main at 05aeeb284), so 22 is the read-time figure and
    # 24 was already stale when the memo merged. This is exactly why the
    # clause's OPERATIVE condition is "zero records differ" / the pipeline
    # item's `state`, and the count is only context.
    blocked_until: >-
      BOTH of the following are checkable, not this row id. (a) Zero
      comms/strategy_evidence/*.json records for a Bybit-perp leg (symbol
      matching execution_costs.is_perp) carry a cost_stack.slippage that
      differs from execution_costs.slippage_bps_roundtrip_for(symbol) at read
      time -- equivalently, pipeline item PI-20260924-JCVFRWEA-0001 (or
      whatever id supersedes it) reads state done or killed, not queued. TODAY
      (2026-09-25, re-measured -- see the note above): 22 of 27 re-priceable
      perp records still carry the pre-E60 flat 5.0bps default against the
      decided 3.0bps (conservative, not optimistic, but unchecked). (b) A
      committed realized-slippage record exists for Alpaca equities and/or
      IBKR futures -- i.e. checklist row E62's own done-when has fired at
      least once (an Alpaca sl-family close carries
      exit_price_source=exchange_fill) -- so the 5.0bps basis those legs'
      records carry is either confirmed by a measurement or explicitly
      reaffirmed as the working assumption by the operator, not merely
      unexamined. TODAY: E62 is landed_unproven; no such close has been
      observed yet. Until both (a) and (b) hold, MD-PROMOTE-S1-S2's
      cost-tolerance clause (bar.cost_tolerance_bps: 0.0, "realized may not
      exceed modelled") is being evaluated against a modelled number nobody
      has re-checked is still current, on at least one venue in play.
    # ⚠️ CLAUSE 3 NAMES A PER-LEG VERDICT, NOT A VENUE POINT ESTIMATE
    # (2026-09-25, checklist row R3). It previously read "whose venue's realized
    # round-trip cost is within bar.cost_tolerance_bps of what the record
    # modelled" -- one number for a whole venue, which a leg with three measured
    # exits inherited wholesale. That phrasing could not express the two states
    # the decision turns on: "the measurement cannot yet decide for THIS leg"
    # and "we have not measured enough of THIS leg". Of the 55 legs in the first
    # committed R3 record, 51 are in the second of those. The wording changes;
    # the bar does not -- cost_tolerance_bps is untouched, and the arming block
    # (`blocked_until`) is untouched.
    fires_when: >-
      A leg already on the Stage-1 soak roster for its exchange has a committed
      Stage-0 evidence record that passes B1's four clauses and its identity
      check, clears the bar below, and whose PER-LEG cost-fidelity verdict reads
      `consistent` under RULE-R3-GATE1-COST-FIDELITY-v1
      (docs/research/r3-gate1-cost-fidelity-rule-2026-09-25.md), taken from the
      newest committed dated record under comms/research/r3_cost_fidelity/ and
      graded at bar.cost_tolerance_bps against the slippage that leg's own
      record modelled. `consistent` means the cell's 95% CI upper bound is at or
      below modelled + tolerance; where a leg has both a market and a simulator
      cell the MARKET cell decides. `divergent`, `inconclusive`,
      `insufficient_n` and `no_record` are each NOT a pass: only `consistent` is
      the Gate-1 pass, and a promotion may not fire on a verdict that says the
      measurement cannot yet decide. On alpaca_equities and ibkr_futures, where
      no decisive verdict exists yet, the operator-accepted 5.0 bps provisional
      basis in `never:` below still applies and is checked first -- a
      measurement never buys a way around it, and a `divergent` verdict refuses
      there too. The edit ADDS the leg to the Stage-2 account AND to its mirror
      -- Stage 2 is one stage, and the mirror carries the identical roster.
    never: >-
      Never a leg that has not soaked at Stage 1. Never while `blocked_until`
      stands. Never onto an account whose account_class is not `real_money`.
      Never past the cap: total declared risk across AUTO-PROMOTED legs may not
      exceed 25% of the account's configured risk budget. Never on an equities
      or futures leg whose record modelled LESS than the 5.0 bps provisional
      slippage -- on those venues there is no measurement to compare against.
    evidence_required: >-
      The committed record -- named harness, stated n, decision rule registered
      before the run, net of the full cost stack -- the realized-cost record it
      was checked against, the cap arithmetic, the realtime ping, and the
      section-1 evidence review in the next daily brief.
    bar:
      min_n_closed: 30
      expectancy_gt: 0
      fold_majority: true
      # ⚠️ § 5.3 requires clause 3 to be checked against "a stated tolerance"
      # and STATES NO NUMBER; no operator decision sets one. 0.0 is the
      # STRICTEST reading -- realized round-trip cost may not exceed what the
      # record modelled at all -- chosen because an unstated bound must resolve
      # to the safe side on the mandate that routes real money, not because
      # anyone decided it. It is INFERRED, not DECIDED, and it is the operator's
      # to set. Context, MEASURED and recorded on checklist rows D3/E60, not by
      # this session: perps realized 0.87 bps against a 3.0 bps model, so 0.0
      # does not block the venue that has a measurement. On alpaca_equities and
      # ibkr_futures the resolver never reaches this comparison -- it takes the
      # PROVISIONAL 5.0 bps basis instead (operator, 2026-09-24: "the 5.0
      # assumption is a working artifact until we get evidence backed numbers").
      # Checklist row E62 replaces that placeholder.
      cost_tolerance_bps: 0.0
    cap:
      basis: uniform_account_risk_pct_share_of_roster
      max_auto_share: 0.25

  - id: MD-DEMOTE-S2-S1
    grants: demote a Stage-2 leg when the mirror goes net-negative net-of-cost
    direction: derisk_only
    granted_by: operator (Ben)
    granted_at: '2026-09-24'
    source: >-
      Popup in session_01Ljhs6sFAdWHdMDhJpL5aBP, 2026-09-24 ~17:15Z, verbatim
      "Grant all 10 as written"; recorded on checklist row B5. The underlying
      grant is the operator's 2026-09-21 ladder mandate, quoted in
      docs/plans/OPERATING-PLAN-2026-09-21.md § 5.3.
    fires_when: >-
      A committed mirror-window record at
      comms/mandate_evidence/mirror_window/<leg>.json, whose source_run is a
      committed file in the repo, states net_r_net_of_full_cost < 0 over the
      window the record declares. The edit REMOVES the leg from the Stage-2
      account and its mirror and returns it to the Stage-1 soak book. This
      mandate carries no block: it reads live measurement, not the backtest
      corpus, and its worst case removes exposure.
    never: >-
      Never on a missing or unreadable record, and never on one citing a
      source_run absent from the repo -- "we could not look" is not a demotion
      signal. Never on a non-negative window: the evidence must support the
      demotion, not merely fail to forbid it. Never an addition to a real-money
      roster under this id.
    evidence_required: >-
      The mirror-window record with its n_closed, its stated window and its
      net-of-full-cost result, plus the realtime ping and the section-1 evidence
      review in the next daily brief.

  - id: MD-DEMOTE-S1-OFF
    grants: drop a Stage-1 leg whose realized cost diverges from its harness assumption
    direction: derisk_only
    granted_by: operator (Ben)
