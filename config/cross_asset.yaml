# Cross-asset peer map (S-CROSS-ASSET-PROBE → M16 c_reg lens, D2a, 2026-06-18).
#
# Target symbol -> ordered peer symbols (positional slots peer1, peer2, …) used
# by the LIVE cross-asset feature computation (`src/runtime/cross_asset_live.py`)
# to feed the cross-asset regime head (`eth-regime-1h-lgbm-xasset-v1`) at score
# time. The slot order MUST match the order the offline side-stream producer used
# (`scripts/ml/build_cross_asset.py --peer …`) so live features == train
# features. The probe's ablation found SOL the load-bearing peer for ETH, BTC a
# smaller additive contributor.
#
# Observe-only: this only conditions a shadow-stage regime head's features; it
# never influences an order. A symbol with no entry here gets no cross-asset
# features (the head degrades to NaN xa columns, which LightGBM handles). Kill
# switch: CROSS_ASSET_LIVE_DISABLED.

# ---------------------------------------------------------------------------
# PEER CHOICES ARE MEASURED, NOT INTUITED (2026-08-20).
#
# Every rho below is Pearson r on DAILY LOG RETURNS over the 90-day window in
# `comms/research/crypto_correlation_2026-08-18.json` (Bybit v5 klines, n=90,
# pulled via trainer-diag #9966). Each symbol takes its top-2 measured peers,
# which is N_PEER_SLOTS.
#
# ⚠️ DO NOT "IMPROVE" THE ETHUSDT ROW. Its peers are the ones
# `eth-regime-1h-lgbm-xasset-v1` was TRAINED on, and that head is live-wired at
# shadow stage. XRPUSDT (0.8763) is in fact a closer peer than SOLUSDT (0.8515),
# so the row looks wrong by the measurement below and is RIGHT as it stands:
# changing it would break live == train for a head already scoring, which is the
# one invariant this whole file exists to hold. A future ETH head trained on a
# different peer set changes this row IN THE SAME PR as the retrain, never before.
#
# ⚠️ ADDING A ROW HERE IS INERT FOR LIVE SCORING, which is why it is safe.
# `cross_asset_live.group_needs_cross_asset` computes the block only for a
# predictor that TRAINED on `xa_*` columns, and today only the ETH head has. A
# BTCUSDT row changes no live score, and adds no fetch, until a BTC head trains
# on it.
# ---------------------------------------------------------------------------

# TRAINED PEER SET — see the warning above before editing.
ETHUSDT:
